# =============================================================================
# 镜像清理配置（独立配置，不依赖 Harbor）
# =============================================================================

# 清理功能开关
CLEANUP_ENABLED="true"                    # 是否启用清理功能

# 清理策略配置
CLEANUP_IMAGES="true"                     # 是否清理镜像缓存
CLEANUP_PACKAGES="true"                   # 是否清理包文件
CLEANUP_PACKAGE_TYPES="debs,tars,charts,images"  # 清理的包类型（逗号分隔）

# 磁盘使用率阈值
CLEANUP_DISK_THRESHOLD="75"               # 磁盘使用率阈值（%），超过此值才清理

# 容器运行时配置
CONTAINERD_NAMESPACE="k8s.io"             # containerd 命名空间
NERDCTL_BIN="nerdctl"                     # nerdctl 命令路径
USE_SUDO="true"                           # 是否使用 sudo 执行命令

# 节点配置来源（从基础设施配置读取）
# 脚本会自动计算正确路径，这里可以留空或指定绝对路径
INFRA_CONFIG_FILE=""

# 日志配置
LOG_FILE="/var/log/k8s-image-cleanup.log"
LOG_LEVEL="INFO"                          # DEBUG, INFO, WARN, ERROR

