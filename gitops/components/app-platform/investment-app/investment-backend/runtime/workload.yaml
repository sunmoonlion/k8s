        sunmoonai.com/rabbitmq-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 06bdb2fa6f92916644c0497dd00b598d37b9c67cccb759dc8eb8058b20af92a9
    spec:
      serviceAccountName: investment-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: harbor.sunmoonai.com:30443/platform/investment-backend@sha256:0c75cb542efbe02989f56e804c6a4452d601d2347fcdb0b510792dc0787b751d
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.worker:celery_app', worker, --loglevel=INFO, '--concurrency=2', '--hostname=celery@$(POD_NAME)']
          startupProbe: {exec: {command: [python, -m, app.cli.worker_readiness]}, timeoutSeconds: 10, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {exec: {command: [python, -m, app.cli.worker_readiness]}, timeoutSeconds: 10, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: investment-worker}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: investment-runtime}}
            - {configMapRef: {name: investment-browser-identity}}
            - {secretRef: {name: investment-database-runtime}}
            - {secretRef: {name: investment-rabbitmq-runtime}}
            - {secretRef: {name: investment-knowledge-service}}
          resources: {"requests": {"cpu": "100m", "memory": "256Mi"}, "limits": {"cpu": "2", "memory": "1Gi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: investment-service-ca}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: investment-celery-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: investment-scheduler, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: investment-scheduler}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-scheduler
        app.kubernetes.io/part-of: investment
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 06bdb2fa6f92916644c0497dd00b598d37b9c67cccb759dc8eb8058b20af92a9
    spec:
      serviceAccountName: investment-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: harbor.sunmoonai.com:30443/platform/investment-backend@sha256:0c75cb542efbe02989f56e804c6a4452d601d2347fcdb0b510792dc0787b751d
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.scheduler:celery_app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule, --pidfile=, --max-interval=5]
          startupProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 10}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: investment-scheduler}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: investment-runtime}}
            - {configMapRef: {name: investment-browser-identity}}
            - {secretRef: {name: investment-database-runtime}}
            - {secretRef: {name: investment-rabbitmq-runtime}}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: investment-service-ca}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: investment-celery-config}}
