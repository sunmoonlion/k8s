# ============================================================================
# Investment Web Frontend YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/app/investment-web-frontend.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="investment-web-frontend-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="app"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# App 数据内容（用于生成 YAML）
# ============================================================================
# 镜像配置
INVESTMENT_WEB_FRONTEND_IMAGE_REGISTRY="${INVESTMENT_WEB_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
INVESTMENT_WEB_FRONTEND_IMAGE_PROJECT="${INVESTMENT_WEB_FRONTEND_IMAGE_PROJECT:-app-images}"
INVESTMENT_WEB_FRONTEND_IMAGE="${INVESTMENT_WEB_FRONTEND_IMAGE:-investment-web-frontend}"
INVESTMENT_WEB_FRONTEND_TAG="${INVESTMENT_WEB_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
INVESTMENT_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME="${INVESTMENT_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称（用于生成 App YAML）
INVESTMENT_WEB_FRONTEND_SECRET_NAME="${INVESTMENT_WEB_FRONTEND_SECRET_NAME:-investment-web-frontend-secret}"
INVESTMENT_WEB_FRONTEND_CONFIGMAP_NAME="${INVESTMENT_WEB_FRONTEND_CONFIGMAP_NAME:-investment-web-frontend-config}"

# PVC 配置（用于生成 App YAML 中的 volumeMounts）
PVC_NAME="${PVC_NAME:-investment-web-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
