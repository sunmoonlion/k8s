# ONLYOFFICE Docs Web 路由配置
# 通过 Traefik HTTP 路由暴露 ONLYOFFICE Docs 服务（8888）
#
# 使用路径前缀路由，避免需要在 /etc/hosts 中配置多个域名
# 访问方式：
# - https://<节点IP>:30443/onlyoffice-docs
# - 或 https://www.sunmoonai.com/onlyoffice-docs (如果配置了 DNS)

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onlyoffice-docs-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: onlyoffice-docs-web
spec:
  entryPoints:
    - websecure
    - web
  routes:
    # 使用路径前缀路由，支持 IP 或统一域名
    # 方案1: 使用 IP 地址（无需 DNS 配置）
    # 访问: https://<节点IP>:30443/onlyoffice-docs
    # 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
    # 访问: https://www.sunmoonai.com/onlyoffice-docs
    - match: Host(`115.190.153.150`) && PathPrefix(`/onlyoffice-docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: onlyoffice-docs-stripprefix
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/onlyoffice-docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: onlyoffice-docs-stripprefix
  tls:
    secretName: traefik-tls-secret

