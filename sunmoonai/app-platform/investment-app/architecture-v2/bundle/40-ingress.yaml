apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: investment-admin-frontend-ingress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: investment-r5
    sunmoonai.com/managed-by: architecture-v2
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`investment-admin.sunmoonai.com`) && PathPrefix(`/api`)
    services:
    - name: investment-r5-backend
      port: 8000
    priority: 100
  - kind: Rule
    match: Host(`investment-admin.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: investment-r5-admin-frontend
      port: 3000
    priority: 10
  tls:
    secretName: investment-r5-tls
---
