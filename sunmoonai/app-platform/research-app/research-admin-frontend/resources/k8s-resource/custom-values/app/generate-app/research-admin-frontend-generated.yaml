apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-admin-frontend
  namespace: app-platform-dev
  labels:
    app: research-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-admin-frontend
  template:
    metadata:
      labels:
        app: research-admin-frontend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: research-admin-frontend
        image: harbor.sunmoonai.com:30443/app-images/research-admin-frontend:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: research-admin-frontend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: research-admin-frontend
  namespace: app-platform-dev
  labels:
    app: research-admin-frontend
spec:
  selector:
    app: research-admin-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
