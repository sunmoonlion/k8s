# =============================================================================
# Traefik TLS Secret 部署配置
# 文件名: deploy-traefik-tls-secret.conf
# 用途: 配置Traefik TLS Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="traefik-tls-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-ingress-platform-dev}"

# Secret类型（固定为TLS）
SECRET_TYPE="kubernetes.io/tls"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="true"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="10"

# 手动指定重启的组件列表（必需，用逗号分隔）
# 注意：traefik-sunmoonai 部署在 ingress-platform-dev 命名空间中
RESTART_COMPONENTS_LIST="traefik-sunmoonai"

# =============================================================================
# CA配置说明
# =============================================================================
# 注意：CA路径从 Traefik 主配置文件（deploy-traefik.conf）中的 TRAEFIK_CA_LOCAL_DIR 读取
# 此配置文件仅用于 TLS Secret 部署参数（Secret名称、命名空间、重启配置等）

