spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      sunmoonai.com/app: info-r5
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: info-r5-backend
        app.kubernetes.io/component: backend-worker
        app.kubernetes.io/part-of: info-r5
        sunmoonai.com/app: info-r5
        sunmoonai.com/managed-by: architecture-v2
    spec:
      serviceAccountName: info-r5-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/info-backend@sha256:ee962dff40dd0ebee6969f084dceac10a9283814df7af45d1da6e114047bea0d
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
            name: info-r5-backend-config
        - secretRef:
            name: info-knowledge-ingest-client
        - configMapRef:
            name: info-admin-backend-s3
        - secretRef:
            name: info-admin-backend-s3
        - configMapRef:
            name: info-admin-backend-elasticsearch
        - secretRef:
            name: info-admin-backend-elasticsearch
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_PASSWORD
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: celeryworker-info-admin-backend-secret
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: celeryworker-info-admin-backend-secret
              key: CELERY_RESULT_BACKEND
              optional: true
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - celery -A app.bootstrap.worker:celery_app inspect ping --destination="celery@${POD_NAME}"
              --timeout=3 | grep -q pong
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: elasticsearch-ca
          mountPath: /etc/elasticsearch/ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: elasticsearch-ca
        secret:
          secretName: info-admin-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
