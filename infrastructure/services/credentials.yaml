---
- import_playbook: ../host/preflight.yaml
- name: Initialize or restore private platform inputs once
  hosts: kind_hosts
  gather_facts: false
  become: true
  vars:
    capacity_operation: services-render
  tasks:
    - name: Validate private input boundaries
      ansible.builtin.assert:
        quiet: true
        that:
          - services_config_dir == '/etc/sunmoon/services/' + cluster_name
          - services_backup_dir == '/mnt/sunmoon-data/backups/services/' + cluster_name
          - not ansible_check_mode
    - name: Enforce batch capacity for small private files
      ansible.builtin.include_tasks:
        file: ../host/tasks/capacity.yaml
        apply: {become: false}
      vars: {capacity_planned_bytes: 1048576}
    - name: Inspect exact private directories before writes
      ansible.builtin.stat: {path: '{{ item }}', follow: false}
      loop: ['{{ services_config_dir }}', '{{ services_backup_dir }}']
      register: dirs
    - name: Refuse symlink or foreign directory paths
      ansible.builtin.assert:
        quiet: true
        that:
          - not item.stat.islnk | default(false)
          - not item.stat.exists or (item.stat.isdir | default(false) and item.stat.uid == 0)
      loop: '{{ dirs.results }}'
      loop_control: {label: '{{ item.item }}'}
    - name: Create root-only input and backup directories
      ansible.builtin.file: {path: '{{ item }}', state: directory, mode: '0700', owner: root, group: root}
      loop: ['{{ services_config_dir }}', '{{ services_backup_dir }}']
    - name: Inspect both independent input files
      ansible.builtin.stat: {path: '{{ item }}', follow: false}
      loop: ['{{ services_config_dir }}/credentials.yaml', '{{ services_backup_dir }}/credentials.yaml']
      register: inputs
      no_log: true
    - name: Refuse redirected or insecure credential files
      ansible.builtin.assert:
        quiet: true
        that:
          - not item.stat.islnk | default(false)
          - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
      loop: '{{ inputs.results }}'
      no_log: true
    - name: Restore existing inputs from independent backup
      ansible.builtin.copy:
        src: '{{ services_backup_dir }}/credentials.yaml'
        dest: '{{ services_config_dir }}/credentials.yaml'
        remote_src: true
        mode: '0600'
      when: not inputs.results[0].stat.exists and inputs.results[1].stat.exists
      no_log: true
    - name: Refuse regenerating lost inputs for an already declared environment
      ansible.builtin.assert:
        quiet: true
        that:
          - inputs.results[0].stat.exists or inputs.results[1].stat.exists or lookup('fileglob', playbook_dir + '/../../gitops/components/data-platform/postgresql-auth.sops.yaml') == ''
        fail_msg: Restore the private credential backup for the declared environment; never silently regenerate database passwords.
    - name: Generate distinct secrets only for an entirely new environment
      ansible.builtin.copy:
        dest: '{{ services_config_dir }}/credentials.yaml'
        mode: '0600'
        force: false
        content: |
          service_credentials:
            postgresql_password: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            redis_password: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            rabbitmq_username: platform
            rabbitmq_password: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            rabbitmq_cookie: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            casdoor_db_password: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            casdoor_admin_password: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
            casdoor_application_secret: {{ lookup('password', '/dev/null', length=40, chars=['ascii_letters','digits']) }}
      when: not inputs.results[0].stat.exists and not inputs.results[1].stat.exists
      no_log: true
    - name: Keep independent input backup without silent overwrite
      ansible.builtin.copy:
        src: '{{ services_config_dir }}/credentials.yaml'
        dest: '{{ services_backup_dir }}/credentials.yaml'
        remote_src: true
        force: false
        mode: '0600'
      no_log: true
    - name: Require byte-identical recoverable input
      ansible.builtin.command: {argv: [cmp, --silent, '{{ services_config_dir }}/credentials.yaml', '{{ services_backup_dir }}/credentials.yaml']}
      changed_when: false
      no_log: true
