# Neo4j Web 路由配置
# 通过 Traefik HTTP 路由暴露 Neo4j Browser 服务
#
# 使用路径前缀路由，避免需要在 /etc/hosts 中配置多个域名
# 访问方式：
# - https://<节点IP>:30443/neo4j
# - 或 https://www.sunmoonai.com/neo4j (如果配置了 DNS)
#
# 注意：需要在 Neo4j 配置中设置 server.basePath: "/neo4j"（如果支持）

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neo4j-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: data-platform-ingress
    component: neo4j-web
spec:
  entryPoints:
    - websecure
  routes:
    # 使用路径前缀路由，支持 IP 或统一域名
    # 方案1: 使用 IP 地址（无需 DNS 配置）
    # 访问: https://<节点IP>:30443/neo4j
    # 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
    # 访问: https://www.sunmoonai.com/neo4j
    # Neo4j Browser/HTTP API 会请求 /browser 与 /db 等绝对路径资源
    # 若只匹配 /neo4j，会导致静态资源/接口走到其他后端而出现 500/404。
    - match: Host(`115.190.153.150`) && (PathPrefix(`/browser`) || PathPrefix(`/db`))
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: neo4j-ratelimit
        - name: neo4j-headers
    - match: Host(`115.190.153.150`) && PathPrefix(`/neo4j`)
      kind: Rule
      services:
        # 注意：SERVICE_NAME 和 SERVICE_PORT 不是配置项，而是从 Kubernetes Service 中动态获取
        # - SERVICE_NAME: 从主配置文件的 NEO4J_PROJECT_ID 构建（格式：neo4j-{project_id}）
        # - SERVICE_PORT: 从 Kubernetes Service 的 spec.ports[0].port 字段动态获取
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: neo4j-redirect
        - name: neo4j-stripprefix
        - name: neo4j-ratelimit
        - name: neo4j-headers
    - match: Host(`{{UNIFIED_HOST}}`) && (PathPrefix(`/browser`) || PathPrefix(`/db`))
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: neo4j-ratelimit
        - name: neo4j-headers
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/neo4j`)
      kind: Rule
      services:
        # 注意：SERVICE_NAME 和 SERVICE_PORT 不是配置项，而是从 Kubernetes Service 中动态获取
        # - SERVICE_NAME: 从主配置文件的 NEO4J_PROJECT_ID 构建（格式：neo4j-{project_id}）
        # - SERVICE_PORT: 从 Kubernetes Service 的 spec.ports[0].port 字段动态获取
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: neo4j-redirect
        - name: neo4j-stripprefix
        - name: neo4j-ratelimit
        - name: neo4j-headers
