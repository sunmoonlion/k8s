apiVersion: v1
kind: ConfigMap
metadata: {name: investment-runtime, namespace: app-platform-dev}
data:
  ENV: production
  APP_SLUG: investment
  DEPLOYMENT_ID: "investment-backend-0c75cb542efbe029"
  ALLOWED_HOSTS: "localhost,127.0.0.1,investment-api,investment-api.app-platform-dev.svc.cluster.local,investment.sunmoonai.com,investment-admin.sunmoonai.com"
  REDIS_HOST: redis.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CELERY_QUEUE: investment.default
  CELERY_TASK_TOPOLOGY_PREDECLARED: 'true'
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor.app-platform-dev.svc.cluster.local:8000
  CASDOOR_VERIFY_SSL: 'true'
  SESSION_COOKIE_SECURE: 'true'
  REFERENCE_INTERACTION_ENABLED: 'false'
  KNOWLEDGE_RETRIEVAL_URL: https://knowledge-tls.app-platform-dev.svc.cluster.local/api/internal/v1/knowledge/retrievals
  KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION: "sunmoonai-investment-knowledge-retrieve"
  KNOWLEDGE_RETRIEVAL_SERVICE_CLIENT_ID: "sunmoon-investment-knowledge-retrieve"
  KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE: "knowledge:retrieve"
  KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SSL_CERT_FILE: /etc/sunmoon/service/ca.crt
  CROSS_APP_TARGETS_JSON: "{\"info\": {\"web_base_url\": \"https://info.sunmoonai.com:30443\"}, \"knowledge\": {\"web_base_url\": \"https://knowledge.sunmoonai.com:30443\"}}"
  CROSS_APP_SOURCES_JSON: "{\"knowledge\": {}, \"info\": {}}"
  WORKBENCH_ENABLED: "true"
  WORKBENCH_REDIS_KEY_PREFIX: "investment:workbench"
  WORKBENCH_ENVIRONMENT_KEY: "user-pc"
  WORKBENCH_POLL_SECONDS: "1.0"
  WORKBENCH_RUNNER_ID: "sunmoon-kind-r1"
  WORKBENCH_PROVISIONER_URL: "http://sandbox-provisioner.sandbox-platform-dev.svc.cluster.local:8080"
  WORKBENCH_RELAY_ADMIN_URL: "ws://relay.relay-platform-dev.svc.cluster.local:47100"
  WORKBENCH_RELAY_PUBLIC_URL: "wss://relay.sunmoonai.com:30443"
  WORKBENCH_TOKEN_ISSUER: "sunmoon-workbench"
  WORKBENCH_SANDBOX_MODEL_PROVIDER: "kimi"
  WORKBENCH_SANDBOX_MODEL: "kimi-k3"
  WORKBENCH_SANDBOX_PROVIDER_BASE_URL: "https://api.moonshot.cn/v1"
  WORKBENCH_RECORDS_MCP_ENABLED: "true"
  WORKBENCH_RECORDS_MCP_URL: "http://investment-api.app-platform-dev.svc.cluster.local:8000/api/mcp/workbench"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: investment-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: investment-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: investment-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-api
        app.kubernetes.io/part-of: investment
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 06bdb2fa6f92916644c0497dd00b598d37b9c67cccb759dc8eb8058b20af92a9
    spec:
      serviceAccountName: investment-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/investment-backend@sha256:0c75cb542efbe02989f56e804c6a4452d601d2347fcdb0b510792dc0787b751d
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: investment-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: investment-runtime}}
            - {configMapRef: {name: investment-browser-identity}}
            - {secretRef: {name: investment-database-runtime}}
            - {secretRef: {name: investment-rabbitmq-runtime}}
            - {secretRef: {name: investment-redis-runtime}}
            - {secretRef: {name: investment-browser-secrets}}
            - {secretRef: {name: investment-domain-runtime}}
            - {secretRef: {name: investment-knowledge-service}}
          resources: {"requests": {"cpu": "100m", "memory": "192Mi"}, "limits": {"cpu": "2", "memory": "768Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: investment-service-ca}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: investment-celery-config}}
---
apiVersion: apps/v1
