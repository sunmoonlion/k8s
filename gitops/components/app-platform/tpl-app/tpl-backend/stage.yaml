# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: {file: app-platform/common/backend/prepare.yaml, vars: {application_name: tpl}}
defaults: {enabled: '{{ tpl_deployment.enabled }}', timeout: 8m}
stages:
- name: tpl-database
  path: database
  dependsOn: [postgresql]
  resources: [workload.yaml, bootstrap.sops.yaml, runtime.sops.yaml]
- name: tpl-migration
  path: migration
  dependsOn: [tpl-database]
  resources: [workload.yaml, auth.sops.yaml]
- name: tpl-redis
  path: redis
  dependsOn: [tpl-migration, redis]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: tpl-rabbitmq
  path: rabbitmq
  dependsOn: [tpl-redis, rabbitmq]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: tpl-identity
  path: identity
  dependsOn: [tpl-rabbitmq, casdoor]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: tpl-runtime
  path: runtime
  dependsOn: [tpl-identity]
  resources: '{{ ["workload.yaml", "tls.sops.yaml"] + (["storage.sops.yaml"] if tpl_backend_deployment.object_storage.enabled | default(false) else []) + (["provider.sops.yaml"] if tpl_backend_deployment.knowledge_provider.enabled | default(false) else []) + (["service.sops.yaml"] if tpl_backend_deployment.knowledge_service.enabled | default(false) else []) + (["domain.sops.yaml"] if tpl_backend_deployment.domain_secrets | default({}) | length > 0 else []) }}'
