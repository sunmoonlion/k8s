# ============================================================================
# celeryworker-investment-web-backend Celery Worker Secret YAML 生成配置
# Broker/Result 后端独立于业务数据库；业务数据库等敏感配置从 investment-web-backend Secret 继承。
# ============================================================================

TEMPLATE_FILE="templates/secret/celeryworker-investment-web-backend-secret.yaml"
OUTPUT_FILE="celeryworker-investment-web-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# RabbitMQ Broker URL。按实际 RabbitMQ 用户、密码、Service、vhost 调整。
CELERY_BROKER_URL="${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq.data-platform-dev.svc.cluster.local:5672//}"

# 默认不启用独立结果后端。若任务需要结果持久化，可改为 backend 已使用的 Redis/DB URL。
CELERY_RESULT_BACKEND="${CELERY_RESULT_BACKEND:-}"
