apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-app-bff
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llmops-app-bff
  template:
    metadata:
      labels:
        app: llmops-app-bff
    spec:
      containers:
      - name: llmops-app-bff
        # Harbor 镜像路径：仓库/项目/镜像名:标签
        # 由 deploy-llmops-bff.sh 计算并导出 LLMOPS_BFF_FULL_IMAGE_NAME
        image: ${LLMOPS_BFF_FULL_IMAGE_NAME}
        # IfNotPresent: 如果本地有镜像则使用本地，否则从 Harbor 拉取
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: llmops-app-bff-config
        - secretRef:
            name: llmops-app-bff-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-app-bff
spec:
  selector:
    app: llmops-app-bff
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP


