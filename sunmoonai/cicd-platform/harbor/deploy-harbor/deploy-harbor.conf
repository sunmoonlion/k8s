# Harbor 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
HARBOR_PROJECT_ID="sunmoonai"
HARBOR_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"   # production|development

# 访问与 TLS（HTTP 场景将 TLS 设为 false）
# 需要说明的是，如果要修改Harbor访问域名，需要同时修改：
# 1. infrastructure/deploy-infrastructure-all/deploy-infrastructure-all.conf中的STEP11_HARBOR_DOMAIN="harbor.sunmoonai.com"
# 2. k8s/utils/unified-cert-secret-management/cert-secret.conf中的中的证书分发地址：/etc/docker/certs.d/harbor.sunmoonai.com:30443和/etc/containerd/certs.d/harbor.sunmoonai.com:30443
# 3. ~/k8s/utils/registry-push-management/loadimage.conf中的REGISTRY_URL="harbor.sunmoonai.com:30443"
# 4.各个组件如果使用镜像仓库，需要修改其deploy-*.conf中的IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
HARBOR_EXTERNAL_HOST="harbor.sunmoonai.com"  # Harbor访问域名
HARBOR_EXTERNAL_PORT="30443"  # Harbor HTTPS端口（使用 websecure entryPoint）

# Harbor TLS 配置
# 注意：此配置项的使用取决于 TLS 终止位置
# - 如果 TLS 终止在 Traefik（如开发环境）：
#   * Harbor Ingress 的 tls: false（TLS 已在 Traefik 处理）
#   * 此配置项不会被使用（dev-values.yaml 中 tls: false 是写死的）
#   * 部署脚本会自动检测并跳过此配置项的替换
# - 如果 TLS 不在 Traefik 终止（如生产环境使用 Harbor 自己的证书）：
#   * Harbor Ingress 的 tls: true（使用 Harbor 自己的证书）
#   * 此配置项会被替换到 prod-values.yaml 中，控制 Harbor 的 TLS 启用/禁用
# 当前环境：开发环境，TLS 终止在 Traefik，此配置项不会被使用
HARBOR_TLS_ENABLED="true"

# Harbor Chart 所需的占位变量（仅用于 Helm values 渲染，不负责 Secret 部署）
# Secret 的实际生成与部署由 secret-management 系统一致管理
HARBOR_AUTH_SECRET_NAME="harbor-secret"
HARBOR_AUTH_SECRET_PASSWORD_KEY="HARBOR_ADMIN_PASSWORD"   # 必须与 secret-management 中的键名一致

# 是否在部署 Harbor 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 Harbor 可能会形成自依赖循环（部署 Harbor 还需从 Harbor 拉取）。
# 正确做法：
#  - 默认 true：Harbor 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#  - 设为 false：不强制离线。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
HARBOR_FORCE_OFFLINE="true"

# 是否在部署后自动创建项目并推送控制平面镜像
# 说明：设置为 true 时，Harbor 部署完成后会自动：
#  1. 创建 k8s-images 项目
#  2. 登录到 Harbor
#  3. 推送控制平面节点上的所有镜像到 Harbor
# 注意：此功能需要 Harbor 服务完全启动后才能执行
AUTO_CREATE_PROJECT_AND_PUSH_IMAGES="true"


# 代理缓存端点规划（Harbor 内部可后续在 UI 配置）
# 注意：这些配置当前未在部署脚本中使用，如需要可在Harbor UI中手动配置
# PROXY_CACHE_ENABLE="true"
# PROXY_DOCKER_IO_PATH="/proxy-docker"
# PROXY_K8S_IO_PATH="/proxy-k8s"

# 镜像版本配置（来源：resources/harbor/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，Harbor Chart会自动使用最新版本的镜像
# bitnami/harbor-core:2.13.2-debian-12-r3
HARBOR_CORE_IMAGE_VERSION="2.13.2-debian-12-r3"
# bitnami/harbor-portal:2.13.2-debian-12-r1
HARBOR_PORTAL_IMAGE_VERSION="2.13.2-debian-12-r1"
# bitnami/harbor-jobservice:2.13.2-debian-12-r3
HARBOR_JOBSERVICE_IMAGE_VERSION="2.13.2-debian-12-r3"
# bitnami/harbor-registry:2.13.2-debian-12-r2
HARBOR_REGISTRY_IMAGE_VERSION="2.13.2-debian-12-r2"
# bitnami/harbor-registryctl:2.13.2-debian-12-r3
HARBOR_REGISTRYCTL_IMAGE_VERSION="2.13.2-debian-12-r3"
# bitnami/harbor-adapter-trivy:2.13.2-debian-12-r2
HARBOR_TRIVY_ADAPTER_IMAGE_VERSION="2.13.2-debian-12-r2"
# bitnami/harbor-exporter:2.13.2-debian-12-r2
HARBOR_EXPORTER_IMAGE_VERSION="2.13.2-debian-12-r2"
# bitnami/nginx:1.29.1-debian-12-r0
HARBOR_NGINX_IMAGE_VERSION="1.29.1-debian-12-r0"
# bitnami/os-shell:12-debian-12-r50
HARBOR_OS_SHELL_IMAGE_VERSION="12-debian-12-r50"

# ============================================================================
# 子级部署控制（组件自管 Secrets，并在本脚本内触发）
# ============================================================================
# 说明：Harbor 组件的 Secrets 由组件内脚本生成与下发；
#      此处仅作为开关与优先级控制，便于在主部署流程中统一编排。
secrets_enabled="true"        # 是否由 Harbor 组件触发下发自身所需的 Secrets（如 harbor-secret）
middleware_enabled="false"    # Harbor 组件内不包含中间件，此处关闭
ingress_enabled="false"       # Harbor 组件内不包含独立 Ingress，此处关闭

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
secrets_priority=2000         # Secrets 最优先（确保核心组件可用的前提）
middleware_priority=1000      # 其次是中间件
ingress_priority=100          # 最后是 Ingress

