# ArgoCD 部署配置文件
# 基于 Bitnami ArgoCD 3.1.1

# ========================================
# 项目配置
# ========================================
ARGOCD_PROJECT_ID="sunmoonai"
ARGOCD_PROJECT_NAME="argocd"
ARGOCD_NAMESPACE="cicd-platform-dev"

# ========================================
# 认证配置
# ========================================
ARGOCD_USERNAME="admin"
ARGOCD_PASSWORD="sunmoonai_argocd_2025!"
ARGOCD_CHART_VERSION="11.0.0"
ARGOCD_APP_VERSION="3.1.1"

# ========================================
# 镜像版本配置 (基于 Bitnami ArgoCD 3.1.1)
# ========================================
ARGOCD_IMAGE_VERSION="3.1.1-debian-12-r0"
ARGOCD_DEX_IMAGE_VERSION="2.43.1-debian-12-r8"
ARGOCD_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"
ARGOCD_REDIS_IMAGE_VERSION="8.2.1-debian-12-r0"

# ========================================
# 生产环境配置
# ========================================
# 存储配置
PROD_STORAGE_CLASS="fast-ssd"
PROD_STORAGE_SIZE="10Gi"
PROD_STORAGE_ACCESS_MODE="ReadWriteOnce"

# 服务配置
PROD_SERVICE_TYPE="LoadBalancer"
PROD_SERVICE_PORT="80"
PROD_SERVICE_HTTPS_PORT="443"

# 资源配置
PROD_CPU_LIMIT="2000m"
PROD_MEMORY_LIMIT="4Gi"
PROD_CPU_REQUEST="1000m"
PROD_MEMORY_REQUEST="2Gi"

# 副本数配置
PROD_REPLICA_COUNT="2"
PROD_READ_REPLICAS="0"

# 网络配置
PROD_NETWORK_POLICY_ENABLED="true"
PROD_INGRESS_ENABLED="false"
PROD_TLS_ENABLED="true"

# 监控配置
PROD_METRICS_ENABLED="true"
PROD_SERVICE_MONITOR_ENABLED="true"
PROD_SERVICE_MONITOR_INTERVAL="30s"

# 自动扩缩容配置
PROD_AUTOSCALING_ENABLED="true"
PROD_HPA_MIN_REPLICAS="2"
PROD_HPA_MAX_REPLICAS="5"
PROD_HPA_TARGET_CPU="70"
PROD_HPA_TARGET_MEMORY="80"

# 备份配置
PROD_BACKUP_ENABLED="true"
PROD_BACKUP_SCHEDULE="0 2 * * *"
PROD_BACKUP_RETENTION="30d"

# 健康检查配置
PROD_LIVENESS_INITIAL_DELAY="60"
PROD_LIVENESS_PERIOD="30"
PROD_LIVENESS_TIMEOUT="10"
PROD_READINESS_INITIAL_DELAY="30"
PROD_READINESS_PERIOD="10"
PROD_READINESS_TIMEOUT="5"

# 安全配置
PROD_POD_SECURITY_POLICY_ENABLED="true"
PROD_AUDIT_ENABLED="true"
PROD_AUDIT_LEVEL="all"
PROD_AUDIT_LOG_PATH="/var/log/argocd/audit.log"
PROD_AUDIT_MAX_AGE="7"
PROD_AUDIT_MAX_BACKUP="5"
PROD_AUDIT_MAX_SIZE="100"

# ArgoCD 特定配置
PROD_ARGOCD_SERVER_HOST="0.0.0.0"
PROD_ARGOCD_SERVER_PORT="8080"
PROD_ARGOCD_SERVER_NAME="sunmoonai-argocd"
PROD_ARGOCD_SERVER_BASEPATH=""
PROD_ARGOCD_SERVER_REWRITEBASEPATH="false"
PROD_ARGOCD_SERVER_INSECURE="false"
PROD_ARGOCD_SERVER_EXTRA_ARGS="--insecure"

# 性能配置
PROD_ARGOCD_REPO_SERVER_PARALLELISM_LIMIT="10"
PROD_ARGOCD_APPLICATION_CONTROLLER_PARALLELISM_LIMIT="10"
PROD_ARGOCD_LOGGING_VERBOSE="false"
PROD_ARGOCD_LOGGING_LEVEL="info"

# ========================================
# 开发环境配置
# ========================================
# 存储配置
DEV_STORAGE_CLASS="standard"
DEV_STORAGE_SIZE="5Gi"
DEV_STORAGE_ACCESS_MODE="ReadWriteOnce"

# 服务配置
DEV_SERVICE_TYPE="ClusterIP"
DEV_SERVICE_PORT="80"
DEV_SERVICE_HTTPS_PORT="443"

# 资源配置
DEV_CPU_LIMIT="500m"
DEV_MEMORY_LIMIT="1Gi"
DEV_CPU_REQUEST="250m"
DEV_MEMORY_REQUEST="512Mi"

# 副本数配置
DEV_REPLICA_COUNT="1"
DEV_READ_REPLICAS="0"

# 网络配置
DEV_NETWORK_POLICY_ENABLED="false"
DEV_INGRESS_ENABLED="false"
DEV_TLS_ENABLED="false"

# 监控配置
DEV_METRICS_ENABLED="false"
DEV_SERVICE_MONITOR_ENABLED="false"
DEV_SERVICE_MONITOR_INTERVAL="30s"

# 自动扩缩容配置
DEV_AUTOSCALING_ENABLED="false"
DEV_HPA_MIN_REPLICAS="1"
DEV_HPA_MAX_REPLICAS="2"
DEV_HPA_TARGET_CPU="80"
DEV_HPA_TARGET_MEMORY="80"

# 备份配置
DEV_BACKUP_ENABLED="false"
DEV_BACKUP_SCHEDULE="0 2 * * *"
DEV_BACKUP_RETENTION="7d"

# 健康检查配置
DEV_LIVENESS_INITIAL_DELAY="30"
DEV_LIVENESS_PERIOD="30"
DEV_LIVENESS_TIMEOUT="10"
DEV_READINESS_INITIAL_DELAY="15"
DEV_READINESS_PERIOD="10"
DEV_READINESS_TIMEOUT="5"

# 安全配置
DEV_POD_SECURITY_POLICY_ENABLED="false"
DEV_AUDIT_ENABLED="false"
DEV_AUDIT_LEVEL="none"
DEV_AUDIT_LOG_PATH="/var/log/argocd/audit.log"
DEV_AUDIT_MAX_AGE="3"
DEV_AUDIT_MAX_BACKUP="2"
DEV_AUDIT_MAX_SIZE="50"

# ArgoCD 特定配置
DEV_ARGOCD_SERVER_HOST="0.0.0.0"
DEV_ARGOCD_SERVER_PORT="8080"
DEV_ARGOCD_SERVER_NAME="sunmoonai-dev-argocd"
DEV_ARGOCD_SERVER_BASEPATH=""
DEV_ARGOCD_SERVER_REWRITEBASEPATH="false"
DEV_ARGOCD_SERVER_INSECURE="true"
DEV_ARGOCD_SERVER_EXTRA_ARGS="--insecure"

# 性能配置
DEV_ARGOCD_REPO_SERVER_PARALLELISM_LIMIT="5"
DEV_ARGOCD_APPLICATION_CONTROLLER_PARALLELISM_LIMIT="5"
DEV_ARGOCD_LOGGING_VERBOSE="true"
DEV_ARGOCD_LOGGING_LEVEL="debug"
