# ============================================================================
# research-admin-backend Secret YAML 生成配置
# 注意：此文件包含真实密钥，不提交到 git
# ============================================================================

TEMPLATE_FILE="templates/secret/research-admin-backend-secret.yaml"
OUTPUT_FILE="research-admin-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# RabbitMQ producer Broker URL. Queue, vhost, users, and permissions are owned
# by messaging-platform/rabbitmq app definitions.
RABBITMQ_SERVICE_HOST="${RABBITMQ_SERVICE_HOST:-rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local}"
RABBITMQ_SERVICE_PORT="${RABBITMQ_SERVICE_PORT:-5672}"
RABBITMQ_VHOST="${RABBITMQ_VHOST:-research-development}"
RABBITMQ_PRODUCER_USER="${RABBITMQ_PRODUCER_USER:-research-admin-backend-producer}"
RABBITMQ_PRODUCER_PASSWORD="${RABBITMQ_PRODUCER_PASSWORD:-research-admin-backend-producer-dev}"
CELERY_BROKER_URL="${CELERY_BROKER_URL:-amqp://${RABBITMQ_PRODUCER_USER}:${RABBITMQ_PRODUCER_PASSWORD}@${RABBITMQ_SERVICE_HOST}:${RABBITMQ_SERVICE_PORT}/${RABBITMQ_VHOST}}"
CELERY_RESULT_BACKEND="${CELERY_RESULT_BACKEND:-}"
CASDOOR_CLIENT_ID="${CASDOOR_CLIENT_ID:-}"
CASDOOR_CLIENT_SECRET="${CASDOOR_CLIENT_SECRET:-}"
