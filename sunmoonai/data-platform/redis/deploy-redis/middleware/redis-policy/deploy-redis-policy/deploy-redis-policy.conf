# Redis 策略中间件部署配置
# 注意：Redis 使用 TCP 路由，middleware 支持有限（仅 rateLimit 可能有效）

# 基础配置
REDIS_PROJECT_ID="sunmoonai"
REDIS_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置（TCP 路由仅支持 rateLimit）
REDIS_POLICY_TYPES="rateLimit"

# 限流配置
REDIS_RATE_LIMIT_AVERAGE="200"
REDIS_RATE_LIMIT_BURST="400"

