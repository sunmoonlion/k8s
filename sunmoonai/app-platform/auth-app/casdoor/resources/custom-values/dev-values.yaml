# Casdoor 开发环境 Helm Values
# Chart: casdoor-krzw/casdoor  (community chart, appVersion v1.224.0)

image:
  repository: harbor.sunmoonai.com:30443/k8s-images/casdoor
  pullPolicy: IfNotPresent
  # tag 由 deploy-casdoor.sh 中通过 --set image.tag= 注入

imagePullSecrets:
  - name: harbor-registry-secret

# ──────────────────────────────────────────────────────────────
# 数据库配置（通过环境变量注入到容器）
# ──────────────────────────────────────────────────────────────
env:
  RUNNING_IN_DOCKER: "true"
  driverName: postgres
  dataSourceName:
    valueFrom:
      secretKeyRef:
        name: casdoor-postgresql-conn
        key: APP_DB_URI
        optional: false
  dbName: ""

# ──────────────────────────────────────────────────────────────
# 服务
# ──────────────────────────────────────────────────────────────
service:
  main:
    ports:
      http:
        port: 8000

# Ingress 由 Traefik IngressRoute 管理
ingress:
  main:
    enabled: false

# ──────────────────────────────────────────────────────────────
# 资源限制
# ──────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

controller:
  strategy: RollingUpdate
  rollingUpdate:
    unavailable: "0"
    surge: 1

probes:
  liveness:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
  readiness:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  startup:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60

# ──────────────────────────────────────────────────────────────
# app.conf（beego 配置，通过 ConfigMap 挂载到 /conf）
# copyrequestbody=true 是必须项，缺少会导致登录时 "unexpected end of JSON input"
# ──────────────────────────────────────────────────────────────
configmap:
  config:
    enabled: true
    data:
      app.conf: |
        appname = casdoor
        httpport = 8000
        runmode = prod
        SessionOn = true
        copyrequestbody = true
        logPostOnly = true
        staticBaseUrl = "."
        aiAssistantUrl = ""

persistence:
  config:
    enabled: true
    type: configMap
    name: casdoor-sunmoonai-config
    mountPath: /conf
    readOnly: true
