# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: {file: app-platform/common/backend/prepare.yaml, vars: {application_name: knowlab}}
defaults: {enabled: '{{ knowlab_deployment.enabled }}', timeout: 8m}
stages:
- name: knowlab-database
  path: database
  dependsOn: [postgresql]
  resources: [workload.yaml, bootstrap.sops.yaml, runtime.sops.yaml]
- name: knowlab-migration
  path: migration
  dependsOn: [knowlab-database]
  resources: [workload.yaml, auth.sops.yaml]
- name: knowlab-redis
  path: redis
  dependsOn: [knowlab-migration, redis]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowlab-rabbitmq
  path: rabbitmq
  dependsOn: [knowlab-redis, rabbitmq]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowlab-identity
  path: identity
  dependsOn: [knowlab-rabbitmq, casdoor]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowlab-runtime
  path: runtime
  dependsOn: '{{ ["knowlab-identity"] + (["knowlab-knowmart-deliver-identity"] if knowlab_backend_deployment.service_clients | default([]) | selectattr("target", "equalto", "knowmart") | selectattr("relation", "equalto", "deliver") | selectattr("enabled") | list | length > 0 else []) }}'
  resources: '{{ ["workload.yaml", "tls.sops.yaml"] + (["storage.sops.yaml"] if knowlab_backend_deployment.object_storage.enabled | default(false) else []) + (["provider.sops.yaml"] if knowlab_backend_deployment.knowledge_provider.enabled | default(false) else []) + (["service.sops.yaml"] if knowlab_backend_deployment.knowbase_service.enabled | default(false) else []) + (["domain.sops.yaml"] if knowlab_backend_deployment.domain_secrets | default({}) | length > 0 else []) + (["knowmart-deliver-service.sops.yaml"] if knowlab_backend_deployment.service_clients | default([]) | selectattr("target", "equalto", "knowmart") | selectattr("relation", "equalto", "deliver") | selectattr("enabled") | list | length > 0 else []) }}'
- name: knowlab-knowmart-deliver-identity
  path: knowmart-deliver-identity
  dependsOn: [casdoor, traefik]
  enabled: '{{ knowlab_deployment.enabled and (knowlab_backend_deployment.service_clients | default([]) | selectattr("target", "equalto", "knowmart") | selectattr("relation", "equalto", "deliver") | selectattr("enabled") | list | length > 0) }}'
  resources: [workload.yaml, provision.sops.yaml]
