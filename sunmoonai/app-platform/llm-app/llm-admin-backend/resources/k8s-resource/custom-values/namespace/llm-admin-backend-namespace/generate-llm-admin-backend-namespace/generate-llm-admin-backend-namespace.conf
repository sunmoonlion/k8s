# ============================================================================
# Llm Admin Backend Namespace YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/namespace/llm-admin-backend-namespace.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="llm-admin-backend-namespace-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="namespace"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"
