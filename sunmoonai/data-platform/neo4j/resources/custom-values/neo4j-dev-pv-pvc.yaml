apiVersion: v1
kind: PersistentVolume
metadata:
  name: neo4j-sunmoonai-dev-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""  # 静态 PV，不走 nfs-2 动态存储
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 172.28.46.235
    # ⚠️ 注意：下面这个 path 需要在「初始化基线盘」后，用实际 PV 中的 path 替换 UID 部分
    # 示例前缀来自 NFS 目录：data-platform-dev-data-neo4j-sunmoonai-0-pvc-<UID>
    path: /data/kind-nfs/data-platform-dev-data-neo4j-sunmoonai-0-pvc-84d44d3e-07bf-472c-b75e-58c31c05d3db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-sunmoonai-dev-pvc
  namespace: data-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: neo4j-sunmoonai-dev-pv

