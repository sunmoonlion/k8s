metadata:
  name: knowledge-web-frontend
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      sunmoonai.com/app: knowledge
      app.kubernetes.io/component: web-frontend
