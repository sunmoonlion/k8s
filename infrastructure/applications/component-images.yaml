# 自研的非应用镜像（0010 第 4 步）：会合点、沙箱、沙箱供给器。源码在本仓（`sunmoonai/` 里的三个目录仍是活源码），
# 钉本仓的一个提交；构建从该提交导出 context，工作区须干净且 HEAD 是它的后代。产物发到 Harbor 的 platform/<名字>，
# 锁写进 gitops/components/<对象>/image.lock.yaml（component-lock）。构建入口：make platform-build OBJECT=<对象>。
---
revision: b23ea80b24c0c3b866bb346277a870028ed58b42
images:
  relay:
    object: relay-platform/relay
    # a43473f1：记住在线代理的机器信息，管理通道加 agents 查询（账 49）
    revision: a43473f162195a7be7202ec382b0b13b16985b6f
    context: sunmoonai/relay-platform/relay
    dockerfile: Dockerfile
    base: python
    user: relay
    executable: python
    version: Python 3.13.15
  sandbox-provisioner:
    object: sandbox-platform/provisioner
    # 30e965a1：沙箱 Pod 带拉取凭据
    revision: 30e965a1626270af1521c5fdc991debafa51464d
    context: sunmoonai/sandbox-platform/provisioner
    dockerfile: Dockerfile
    base: python
    user: provisioner
    executable: python
    version: Python 3.13.15
  sandbox:
    # 只构建、不单独部署的对象：供给器按用户拉起沙箱 Pod 时用它
    object: sandbox-platform/sandbox
    # 沙箱 Dockerfile 在 e3ce871f 加了 DEBIAN_MIRROR：只有它钉新提交，会合点/供给器仍钉顶层的。
    # 源的地址在 download-modes.json（不在 context 里，不用改钉的提交）；国内源用 http：slim 基础镜像没有 ca-certificates，
    # apt 走 https 会在证书上失败（2026-10-06 第 26 轮退出 100），包本身有签名
    # 2fe6652c：编排端配置加 [windows] sandbox = unelevated（Windows 代理第 1 段联调）
    revision: 2fe6652cb99c3bb482263724ccefd42ea01532e4
    context: sunmoonai/sandbox-platform
    dockerfile: image/Dockerfile
    base: node-runtime
    user: codex
    executable: node
    version: v24.21.0
    # 要装 apt 包、pip 包和 Codex 的 npm 包，第一次比别的慢
    timeout_seconds: 3600
