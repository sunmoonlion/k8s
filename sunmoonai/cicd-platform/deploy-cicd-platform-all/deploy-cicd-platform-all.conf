# ============================================================================
# CI/CD 平台基础配置
# ============================================================================
CICD_PLATFORM_PROJECT_ID="sunmoonai"
CICD_PLATFORM_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制（按集群前缀，启用哪套由 default_cluster/CLUSTER 决定并自动覆盖）
# ============================================================================
# 是否部署 Harbor（C2 与 C1 共用同一 Harbor，故 C2 不单独部署，C2_harbor_enabled 固定为 false）
C1_harbor_enabled="true"
C2_harbor_enabled="false"   # 共用 C1 的 Harbor，不部署
KIND_harbor_enabled="true"
# 是否部署 Jenkins
C1_jenkins_enabled="false"
C2_jenkins_enabled="false"
KIND_jenkins_enabled="false"
# 是否部署 ArgoCD
C1_argocd_enabled="false"
C2_argocd_enabled="false"
KIND_argocd_enabled="false"

# ============================================================================
# 部署优先级（数值越大越先部署）
# ============================================================================
C1_harbor_priority=1000
C2_harbor_priority=1000
KIND_harbor_priority=1000
C1_jenkins_priority=100
C2_jenkins_priority=100
KIND_jenkins_priority=100
C1_argocd_priority=10
C2_argocd_priority=10
KIND_argocd_priority=10
