# ============================================================================
# Llm Admin Backend PVC YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/pvc/llm-admin-backend-pvc.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="llm-admin-backend-pvc-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="pvc"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# PVC 数据内容（用于生成 PVC YAML）
# ============================================================================
PVC_NAME="${PVC_NAME:-llm-admin-backend-pvc}"
PVC_STORAGE_CLASS="${PVC_STORAGE_CLASS:-local-path}"
PVC_ACCESS_MODE="${PVC_ACCESS_MODE:-ReadWriteOnce}"
PVC_STORAGE_SIZE="${PVC_STORAGE_SIZE:-10Gi}"
