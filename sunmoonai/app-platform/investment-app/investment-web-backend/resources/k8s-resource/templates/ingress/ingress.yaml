# Investment Web Backend 路由配置 (Traefik IngressRoute)
# NestJS 挂载点：所有业务路由在 /api/* 下，e.g. /api/auth/login
#
# 访问方式：
# - https://<NODE_IP>:30443/api/...
# - https://api.investment.sunmoonai.com/api/...
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: investment-web-backend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: investment-web-backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
