# ============================================================================
# LLMOps Service ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/configmap/llmops-service-config.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="llmops-service-config-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="configmap"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-llmops-bff.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# ConfigMap 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 ConfigMap YAML 文件
# ============================================================================
# ConfigMap 名称
LLMOPS_SERVICE_CONFIGMAP_NAME="${LLMOPS_SERVICE_CONFIGMAP_NAME:-llmops-service-config}"

# 服务器与项目配置
PROJECT_NAME="${PROJECT_NAME:-LLMOps Service}"
SERVER_NAME="${SERVER_NAME:-llmops.sunmoonai.com}"
SERVER_HOST="${SERVER_HOST:-https://llmops.sunmoonai.com}"
SERVER_BOT="${SERVER_BOT:-Symona}"

# CORS 配置
BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS:-[\"https://llmops.sunmoonai.com\",\"https://llmops.sunmoonai.com:443\"]}"

# 数据库配置（非敏感部分）
POSTGRES_SERVER="${POSTGRES_SERVER:-101.126.151.0}"  # PostgreSQL 服务器 IP
POSTGRES_PORT="${POSTGRES_PORT:-30444}"  # PostgreSQL 端口
POSTGRES_USER="${POSTGRES_USER:-sunmoonai_dev}"  # PostgreSQL 用户名
POSTGRES_DB="${POSTGRES_DB:-mydb}"  # PostgreSQL 数据库名

# Neo4j 配置（非敏感部分）
NEO4J_SERVER="${NEO4J_SERVER:-101.126.151.0}"  # Neo4j 服务器 IP
NEO4J_PORT="${NEO4J_PORT:-7687}"  # Neo4j Bolt 端口
NEO4J_USERNAME="${NEO4J_USERNAME:-neo4j}"
NEO4J_AUTH="${NEO4J_AUTH:-neo4j}"
NEO4J_BOLT="${NEO4J_BOLT:-bolt}"

# 功能开关与其他配置
USERS_OPEN_REGISTRATION="${USERS_OPEN_REGISTRATION:-True}"
NEO4J_FORCE_TIMEZONE="${NEO4J_FORCE_TIMEZONE:-True}"
NEO4J_AUTO_INSTALL_LABELS="${NEO4J_AUTO_INSTALL_LABELS:-True}"
NEO4J_MAX_CONNECTION_POOL_SIZE="${NEO4J_MAX_CONNECTION_POOL_SIZE:-50}"
MULTI_MAX="${MULTI_MAX:-20}"
EMAIL_RESET_TOKEN_EXPIRE_HOURS="${EMAIL_RESET_TOKEN_EXPIRE_HOURS:-48}"
EMAIL_TEMPLATES_DIR="${EMAIL_TEMPLATES_DIR:-/app/app/email-templates/build}"
EMAIL_TEST_USER="${EMAIL_TEST_USER:-test@example.com}"
