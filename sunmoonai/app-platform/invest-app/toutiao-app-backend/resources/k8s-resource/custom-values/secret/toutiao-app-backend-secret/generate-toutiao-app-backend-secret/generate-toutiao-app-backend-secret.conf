# ============================================================================
# toutiao-app-backend Secret YAML 生成配置
# ⚠️ 敏感信息：妥善保管，不要提交到 git
# ============================================================================

TEMPLATE_FILE="templates/secret/toutiao-app-backend-secret.yaml"
OUTPUT_FILE="toutiao-app-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

# 基础配置
NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息）
# ============================================================================
# MySQL 认证
MYSQL_USER="${MYSQL_USER:-root}"
MYSQL_PASSWORD="${MYSQL_PASSWORD:-changeme}"

# JWT（旧 HS256，保留供历史接口兼容）
JWT_SECRET="${JWT_SECRET:-changeme}"

# 七牛云密钥
QINIU_ACCESS_KEY="${QINIU_ACCESS_KEY:-changeme}"
QINIU_SECRET_KEY="${QINIU_SECRET_KEY:-changeme}"

# RabbitMQ 完整 URL（含密码）
RABBITMQ_URL="${RABBITMQ_URL:-amqp://python:changeme@rabbitmq:5672/toutiao}"

# 限流 Redis Sentinel 连接字符串（含认证信息，如有）
RATELIMIT_STORAGE_URL="${RATELIMIT_STORAGE_URL:-redis+sentinel://redis-sentinel:26379/mymaster}"

# 极验 CAPTCHA
GEETEST_ID="${GEETEST_ID:-changeme}"
GEETEST_KEY="${GEETEST_KEY:-changeme}"
