            - {configMapRef: {name: knowledge-browser-identity}}
            - {secretRef: {name: knowledge-database-runtime}}
            - {secretRef: {name: knowledge-rabbitmq-runtime}}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: provider-ca, mountPath: /etc/sunmoon/provider, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: provider-ca, secret: {secretName: knowledge-provider-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
        - {name: celery-config, configMap: {name: knowledge-celery-config}}
---
apiVersion: v1
kind: Service
metadata: {name: knowledge-api, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowledge-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-api-ingress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-admin}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-api-casdoor-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-api-casdoor-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-api}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-ragflow-egress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: knowledge, sunmoonai.com/ragflow-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ragflow, app.kubernetes.io/component: api}}
      ports: [{protocol: TCP, port: 9380}]
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-service-https-out, namespace: app-platform-dev}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [knowledge-api]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-sandboxes-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sandbox-platform-dev}}
          podSelector: {matchLabels: {"sunmoonai.com/sandbox": "true"}}
      ports: [{protocol: TCP, port: 8000}]
