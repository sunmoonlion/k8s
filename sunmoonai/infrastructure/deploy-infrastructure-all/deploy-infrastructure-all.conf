# =============================================================================
# Kubernetes 部署配置（k8s-deploy 专用）# 说明：本文件为唯一权威配置，脚本不会解析注释）# =============================================================================

# ============================
# 全局配置
# ============================
CLUSTER_NAME="my-k8s-cluster"
# 包管理与资源获取模式（统一开关）
# packages_deploy_mode: online | offline
# - offline:
#   - charts: 存放于远程各节点安装目录（SERVER_n_DIR）的 charts 子目录（例如 ~/packages-to-be-installed/charts），在远）master 节点执行 helm 安装
#   - debs/tars/images: 由远程各节点的安装目录（SERVER_n_DIR）下的子目录提供（debs/、tars/、images/），在各节点本机安装/加载
# - online:
#   - charts: 使用上游 Helm 仓库（如 projectcalico/flannel/cilium 等）在线拉取
#   - images: 由运行时/kubeadm/Helm 按需在线拉取（registry.k8s.io、docker.io、quay.io 等）
#   - debs/tars: 由远端主机通过 apt/curl 在线获取
packages_deploy_mode="offline"


# 包同步开关（部署前是否同步离线包至各节点）# - true: 执行包同步（默认值，保持向后兼容）# - false: 跳过包同步步
PACKAGE_SYNC_ENABLED=false


# 全局期望）K8s 版本（如不在 STEP03_K8S_VERSION 中显式设置，将使用该值）
CLUSTER_VERSION="1.30.4"
# 选择网络插件：calico | flannel | cilium | weave
NETWORK_PLUGIN="calico"
POD_CIDR="10.244.0.0/16"
SERVICE_CIDR="10.96.0.0/12"

# 代理设置（如需）# 说明：支持多集群配置，使）C{数字}_* 前缀区分不同集群的配
PROXY_ENABLED=false
HTTP_PROXY=""
HTTPS_PROXY=""
# 默认 NO_PROXY（如果未指定集群特定配置，使用此值）
NO_PROXY="127.0.0.1,localhost"

# 集群1代理配置（C1_* 前缀）C1_NO_PROXY="127.0.0.1,localhost,115.190.61.238,47.103.135.26"  # 集群1的节点IP列表

# 集群2代理配置（C2_* 前缀）# 注意：请根据集群2的实际节点IP配置
# C2_SERVER_1_PUBLIC_IP=115.190.37.57
# C2_SERVER_2_PUBLIC_IP=115.190.153.150
# C2_SERVER_3_PUBLIC_IP=115.190.86.211
C2_NO_PROXY="127.0.0.1,localhost,115.190.37.57,115.190.153.150,115.190.86.211"  # 集群2的节点IP列表

# 时区/语言/时间同步（确保无交互一键执行）
TIMEZONE="Asia/Shanghai"
LOCALE="en_US.UTF-8"
TIME_SYNC="systemd-timesyncd"   # systemd-timesyncd | chrony

# 日志目录（后续实现日志落盘时使用
LOG_DIR="$HOME/k8s-deploy-logs"

# 期望节点数量（留空自动按 SERVER_* 推导
EXPECTED_NODE_COUNT=""

