# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: ./prepare.yaml
stages:
- name: platform-foundations
  dependsOn: []
  enabled: true
  resources: '{{ ["runtime.yaml", "storage.yaml", "network.yaml", data_namespace + "-puller.sops.yaml", messaging_namespace + "-puller.sops.yaml", app_namespace + "-puller.sops.yaml", ops_namespace + "-puller.sops.yaml", relay_namespace + "-puller.sops.yaml", sandbox_namespace + "-puller.sops.yaml"] }}'
  render: [runtime.yaml, storage.yaml, network.yaml]
