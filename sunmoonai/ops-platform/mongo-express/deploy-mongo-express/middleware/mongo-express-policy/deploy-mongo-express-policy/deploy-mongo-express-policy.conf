# Mongo Express 策略中间件部署配置

# 基础配置
MONGO_EXPRESS_PROJECT_ID="sunmoonai"
MONGO_EXPRESS_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
# 注意：Traefik 不支持在同一个 Middleware 中同时使用 rateLimit 和 headers
# 当前只使用 rateLimit，如果需要 headers 功能，应创建独立的 mongo-express-headers middleware
MONGO_EXPRESS_POLICY_TYPES="rateLimit"

# 限流配置
MONGO_EXPRESS_RATE_LIMIT_AVERAGE="30"
MONGO_EXPRESS_RATE_LIMIT_BURST="60"

# 头部配置（已移除，如需使用请创建独立的 mongo-express-headers middleware）
# MONGO_EXPRESS_HEADERS_CUSTOM_REQUEST_HEADERS="X-Mongo-Express-Version:1.0"
# MONGO_EXPRESS_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Mongo-Express-Status:active"
