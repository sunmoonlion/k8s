---
# 本地管理员口令：预设（密码表第 13 项导入）→ 私有文件 → 独立备份；服务证书由 registry 的本地 CA 签发。
- name: Inspect the credential file without reading its value
  ansible.builtin.stat:
    path: '{{ jenkins_config_dir }}/private/admin-password'
    follow: false
    get_checksum: false
  register: credential_file

- name: Reject an unsafe credential file
  ansible.builtin.assert:
    quiet: true
    that:
      - not credential_file.stat.exists or credential_file.stat.isreg | default(false)
      - not credential_file.stat.islnk | default(false)
      - not credential_file.stat.exists or credential_file.stat.mode == '0600'
      - not credential_file.stat.exists or credential_file.stat.uid == 0

- name: Inspect the independent backup directory and the initialized home
  ansible.builtin.stat: {path: '{{ item }}', follow: false, get_checksum: false}
  loop: ['{{ jenkins_credential_backup_dir }}', '{{ jenkins_credential_backup_dir }}/admin-password', '{{ jenkins_home }}/config.xml']
  register: credential_guards
  no_log: true

- name: Refuse a redirected or insecure backup
  ansible.builtin.assert:
    quiet: true
    that:
      - not credential_guards.results[0].stat.islnk | default(false)
      - not credential_guards.results[0].stat.exists or (credential_guards.results[0].stat.isdir | default(false) and credential_guards.results[0].stat.uid == 0)
      - not credential_guards.results[1].stat.islnk | default(false)
      - not credential_guards.results[1].stat.exists or (credential_guards.results[1].stat.isreg | default(false) and credential_guards.results[1].stat.uid == 0 and credential_guards.results[1].stat.mode == '0600')

- name: Refuse regenerating a lost credential for an initialized controller
  ansible.builtin.assert:
    quiet: true
    that: credential_file.stat.exists or credential_guards.results[1].stat.exists or not credential_guards.results[2].stat.exists
    fail_msg: The controller is initialized but its administrator credential is missing. Restore the independent backup; never regenerate it.

- name: Restore a missing primary credential only from its exact backup
  ansible.builtin.copy:
    src: '{{ jenkins_credential_backup_dir }}/admin-password'
    dest: '{{ jenkins_config_dir }}/private/admin-password'
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: not credential_file.stat.exists and credential_guards.results[1].stat.exists
  no_log: true

- name: Read the human admin preset without changing an existing account
  ansible.builtin.include_tasks: ../../host/tasks/account-preset.yaml
  vars: {human_account: '{{ jenkins_human_account }}'}
  no_log: true

- name: Generate an independent initial credential only when absent and no preset was supplied
  ansible.builtin.command:
    argv: [openssl, rand, -hex, '24']
  when: not credential_file.stat.exists and not credential_guards.results[1].stat.exists and human_initial_password | length == 0
  register: generated_credential
  changed_when: true
  no_log: true

- name: Persist the initial credential without overwriting an existing file
  ansible.builtin.copy:
    dest: '{{ jenkins_config_dir }}/private/admin-password'
    content: '{{ human_initial_password if human_initial_password | length > 0 else generated_credential.stdout }}'
    force: false
    owner: root
    group: root
    mode: '0600'
  when: not credential_file.stat.exists and not credential_guards.results[1].stat.exists
  no_log: true
  diff: false

- name: Create the independent private credential backup directory
  ansible.builtin.file: {path: '{{ jenkins_credential_backup_dir }}', state: directory, owner: root, group: root, mode: '0700'}

- name: Preserve the credential without replacing a prior identity
  ansible.builtin.copy:
    src: '{{ jenkins_config_dir }}/private/admin-password'
    dest: '{{ jenkins_credential_backup_dir }}/admin-password'
    remote_src: true
    force: false
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Require exact recoverable credential bytes
  ansible.builtin.command:
    argv: [cmp, --silent, '{{ jenkins_config_dir }}/private/admin-password', '{{ jenkins_credential_backup_dir }}/admin-password']
  changed_when: false
  no_log: true

- name: Read the credential only to validate its shape
  ansible.builtin.slurp:
    src: '{{ jenkins_config_dir }}/private/admin-password'
  register: credential
  no_log: true

- name: Require a valid credential value
  ansible.builtin.assert:
    quiet: true
    that:
      - (credential.content | b64decode) | length >= jenkins_human_account.minimum_length | int
      - (credential.content | b64decode) | length <= jenkins_human_account.maximum_length | int
      - (credential.content | b64decode) is not search('[\r\n\x00]')
  no_log: true

- name: Give the container user its own read-only copy for the first start
  ansible.builtin.copy:
    src: '{{ jenkins_config_dir }}/private/admin-password'
    dest: '{{ jenkins_runtime_dir }}/secrets/admin-password'
    remote_src: true
    owner: '{{ jenkins_uid }}'
    group: '{{ jenkins_uid }}'
    mode: '0400'
  no_log: true
  diff: false

- name: Retire the controller certificate when its name no longer matches the site (key and CSR are regenerated together below)
  ansible.builtin.include_tasks: '{{ playbook_dir }}/../components/tasks/tls-retire.yaml'
  vars:
    tls_retire_crt: '{{ jenkins_config_dir }}/tls/server.crt'
    tls_retire_csr: '{{ jenkins_config_dir }}/tls/server.csr'
    tls_retire_names: ['{{ jenkins_hostname }}']
- name: Inspect the registry CA and the controller certificate pair
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
  loop:
    - '{{ registry_config_dir }}/tls/ca.crt'
    - '{{ registry_config_dir }}/tls/ca.key'
    - '{{ jenkins_config_dir }}/tls/server.key'
    - '{{ jenkins_config_dir }}/tls/server.crt'
  register: certificate_files

- name: Require the platform CA and refuse symlinks or a partial pair
  ansible.builtin.assert:
    quiet: true
    that:
      - certificate_files.results[0].stat.isreg | default(false)
      - certificate_files.results[1].stat.isreg | default(false)
      - certificate_files.results[2].stat.exists == certificate_files.results[3].stat.exists
      - certificate_files.results | map(attribute='stat.islnk') | map('default', false) | select | list | length == 0
    fail_msg: The registry local CA must exist (registry-deploy) before the controller certificate can be signed.

- name: Create a private server key and CSR once
  ansible.builtin.command:
    argv: [openssl, req, -new, -newkey, 'rsa:3072', -nodes, -sha256, -subj, '/CN={{ jenkins_hostname }}', -keyout, '{{ jenkins_config_dir }}/tls/server.key', -out, '{{ jenkins_config_dir }}/tls/server.csr']
  when: not certificate_files.results[2].stat.exists
  changed_when: true
  no_log: true

- name: Write server certificate extensions
  ansible.builtin.copy:
    dest: '{{ jenkins_config_dir }}/tls/server.ext'
    mode: '0600'
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=DNS:{{ jenkins_hostname }},IP:127.0.0.1

- name: Sign the server certificate with the platform CA once, in place
  ansible.builtin.command:
    argv: [openssl, x509, -req, -in, '{{ jenkins_config_dir }}/tls/server.csr', -CA, '{{ registry_config_dir }}/tls/ca.crt', -CAkey, '{{ registry_config_dir }}/tls/ca.key', -CAcreateserial, -out, '{{ jenkins_config_dir }}/tls/server.crt', -days, '{{ jenkins_certificate_days | string }}', -sha256, -extfile, '{{ jenkins_config_dir }}/tls/server.ext']
  when: not certificate_files.results[2].stat.exists
  changed_when: true
  no_log: true

- name: Restrict the private key
  ansible.builtin.file:
    path: '{{ jenkins_config_dir }}/tls/server.key'
    owner: root
    group: root
    mode: '0600'

- name: Verify certificate chain, DNS identity and remaining validity
  ansible.builtin.command:
    argv: '{{ item }}'
  changed_when: false
  loop:
    - [openssl, verify, -CAfile, '{{ registry_config_dir }}/tls/ca.crt', -verify_hostname, '{{ jenkins_hostname }}', '{{ jenkins_config_dir }}/tls/server.crt']
    - [openssl, x509, -checkend, '2592000', -noout, -in, '{{ jenkins_config_dir }}/tls/server.crt']

- name: Read the certificate pair for the TLS terminator
  ansible.builtin.slurp:
    src: '{{ item }}'
  loop: ['{{ jenkins_config_dir }}/tls/server.crt', '{{ jenkins_config_dir }}/tls/server.key']
  register: pem_parts
  no_log: true

- name: Assemble the HAProxy certificate bundle readable only by its container user
  ansible.builtin.copy:
    dest: '{{ jenkins_runtime_dir }}/tls/jenkins.pem'
    content: "{{ pem_parts.results[0].content | b64decode }}{{ pem_parts.results[1].content | b64decode }}"
    owner: root
    group: '{{ tls_uid }}'
    mode: '0640'
  no_log: true
  diff: false
