# ============================================================================
# Auth App Front Secret YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/secret/auth-app-front-secret.yaml"
OUTPUT_FILE="auth-app-front-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息，妥善保管）
# ============================================================================
# OIDC 客户端密钥（与 auth-app-backend 中注册的 client_secret 一致）
AUTH_CLIENT_SECRET="${AUTH_CLIENT_SECRET:-changeme}"

# Session 加密密钥（随机 32 字符字符串）
SESSION_SECRET="${SESSION_SECRET:-changeme}"
