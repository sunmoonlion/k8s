apiVersion: v1
kind: ServiceAccount
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
automountServiceAccountToken: true
imagePullSecrets:
  - {name: registry-puller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
rules:
  - apiGroups: ['']
    resources: [secrets, persistentvolumeclaims, services]
    verbs: [get, list, create, update, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sandbox-provisioner}
subjects:
  - {kind: ServiceAccount, name: sandbox-provisioner, namespace: 'sandbox-platform-dev'}
---
apiVersion: v1
kind: Service
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
spec:
  selector: {app.kubernetes.io/name: sandbox-provisioner}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app.kubernetes.io/name: sandbox-provisioner}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sandbox-provisioner}
      annotations: {sunmoonai.com/input-sha256: 'e2a37b28cbb3f9f4013bc7c76e2ec25e9fa74ea7bda89ffce1d08db8b783b3eb'}
    spec:
      serviceAccountName: sandbox-provisioner
      enableServiceLinks: false
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 10003, runAsGroup: 10003, fsGroup: 10003, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provisioner
          image: harbor.sunmoonai.com:30443/platform/sandbox-provisioner@sha256:3459b0b56fd5ac6be357137e69267a6094cc42475bfdd23ed92d49d7021b5f82
          imagePullPolicy: IfNotPresent
          env:
            - {name: SANDBOX_NAMESPACE, value: 'sandbox-platform-dev'}
            - {name: SANDBOX_IMAGE, value: 'harbor.sunmoonai.com:30443/platform/sandbox@sha256:e758ccb23d40e07f53c4e26b9473bb26d5425ef80848e15d5a7ca4eb88a75c3b'}
            - {name: RELAY_URL, value: 'ws://relay.relay-platform-dev.svc.cluster.local:47100'}
            # 新体系按环境参数化：沙箱的网络策略里，应用（两个 MCP、runner）和会合点各在哪个命名空间
            - {name: APP_NAMESPACE, value: 'app-platform-dev'}
            - {name: SANDBOX_IMAGE_PULL_SECRET, value: registry-puller}
            - {name: RELAY_NAMESPACE, value: 'relay-platform-dev'}
            - {name: KNOWLEDGE_MCP_URL, value: 'http://knowledge-api.app-platform-dev.svc.cluster.local:8000/api/mcp/knowledge'}
            - {name: SANDBOX_PVC_SIZE, value: '2Gi'}
            - {name: PROVISIONER_TOKEN, valueFrom: {secretKeyRef: {name: sandbox-provisioner, key: token}}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          resources: {"requests": {"cpu": "50m", "memory": "64Mi"}, "limits": {"cpu": "500m", "memory": "256Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sandbox-provisioner, namespace: sandbox-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sandbox-provisioner}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: 'app-platform-dev'}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: 'relay-platform-dev'}}
          podSelector: {matchLabels: {app.kubernetes.io/name: relay}}
      ports: [{protocol: TCP, port: 47100}]
