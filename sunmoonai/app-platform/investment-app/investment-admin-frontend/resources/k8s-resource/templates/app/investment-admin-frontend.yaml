apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-admin-frontend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: investment-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-admin-frontend
  template:
    metadata:
      labels:
        app: investment-admin-frontend
    spec:
      imagePullSecrets:
      - name: ${INVESTMENT_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: investment-admin-frontend
        image: ${INVESTMENT_ADMIN_FRONTEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: investment-admin-frontend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: investment-admin-frontend
spec:
  selector:
    app: investment-admin-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
