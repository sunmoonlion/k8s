# ============================================================================
# nodebullworker-llm-web-backend Node Bull Worker ConfigMap YAML 生成配置
# 只放 Worker 自身配置；业务数据库等配置从 llm-web-backend 的 ConfigMap/Secret 继承。
# ============================================================================

TEMPLATE_FILE="templates/configMap/nodebullworker-llm-web-backend-config.yaml"
OUTPUT_FILE="nodebullworker-llm-web-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"
NODE_ENV="${NODE_ENV:-production}"
QUEUE_ON="${QUEUE_ON:-true}"

