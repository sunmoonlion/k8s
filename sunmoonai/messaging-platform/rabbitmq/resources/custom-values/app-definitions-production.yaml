# RabbitMQ application topology for production.
# Replace these passwords with cluster secret-management values before production rollout.

auth:
  securePassword: false

loadDefinition:
  enabled: true
  existingSecret: rabbitmq-app-definitions

extraConfiguration: |-
  load_definitions = /app/load_definition.json

extraSecrets:
  rabbitmq-app-definitions:
    load_definition.json: |
      {
        "vhosts": [
          {"name": "info-production"},
          {"name": "research-production"},
          {"name": "investment-production"},
          {"name": "knowledge-production"}
        ],
        "users": [
          {"name": "info-admin-backend-producer", "password": "CHANGE_ME_info_admin_backend_producer_prod", "tags": ""},
          {"name": "info-admin-backend-worker", "password": "CHANGE_ME_info_admin_backend_worker_prod", "tags": ""},
          {"name": "research-admin-backend-producer", "password": "CHANGE_ME_research_admin_backend_producer_prod", "tags": ""},
          {"name": "research-admin-backend-worker", "password": "CHANGE_ME_research_admin_backend_worker_prod", "tags": ""},
          {"name": "investment-web-backend-producer", "password": "CHANGE_ME_investment_web_backend_producer_prod", "tags": ""},
          {"name": "investment-web-backend-worker", "password": "CHANGE_ME_investment_web_backend_worker_prod", "tags": ""},
          {"name": "investment-admin-backend-producer", "password": "CHANGE_ME_investment_admin_backend_producer_prod", "tags": ""},
          {"name": "investment-admin-backend-worker", "password": "CHANGE_ME_investment_admin_backend_worker_prod", "tags": ""},
          {"name": "investment-backend-worker", "password": "CHANGE_ME_investment_backend_worker_prod", "tags": ""},
          {"name": "knowledge-admin-backend-producer", "password": "CHANGE_ME_knowledge_admin_backend_producer_prod", "tags": ""},
          {"name": "knowledge-admin-backend-worker", "password": "CHANGE_ME_knowledge_admin_backend_worker_prod", "tags": ""}
        ],
        "permissions": [
          {"user": "info-admin-backend-producer", "vhost": "info-production", "configure": "^info\\.admin\\.default$", "write": "^$|^info\\.admin\\.default$", "read": "^$"},
          {"user": "info-admin-backend-worker", "vhost": "info-production", "configure": "^info\\.admin\\.default$", "write": "^$|^info\\.admin\\.default$", "read": "^info\\.admin\\.default$"},
          {"user": "research-admin-backend-producer", "vhost": "research-production", "configure": "^research\\.admin\\.default$", "write": "^$|^research\\.admin\\.default$", "read": "^$"},
          {"user": "research-admin-backend-worker", "vhost": "research-production", "configure": "^research\\.admin\\.default$", "write": "^$|^research\\.admin\\.default$", "read": "^research\\.admin\\.default$"},
          {"user": "investment-web-backend-producer", "vhost": "investment-production", "configure": "^investment\\.web\\.default$", "write": "^$|^investment\\.web\\.default$", "read": "^$"},
          {"user": "investment-web-backend-worker", "vhost": "investment-production", "configure": "^investment\\.web\\.default$", "write": "^$|^investment\\.web\\.default$", "read": "^investment\\.web\\.default$"},
          {"user": "investment-admin-backend-producer", "vhost": "investment-production", "configure": "^investment\\.admin\\.default$", "write": "^$|^investment\\.admin\\.default$", "read": "^$"},
          {"user": "investment-admin-backend-worker", "vhost": "investment-production", "configure": "^investment\\.admin\\.default$", "write": "^$|^investment\\.admin\\.default$", "read": "^investment\\.admin\\.default$"},
          {"user": "investment-backend-worker", "vhost": "investment-production", "configure": "^investment\\.default$", "write": "^$|^investment\\.default$", "read": "^investment\\.default$"},
          {"user": "knowledge-admin-backend-producer", "vhost": "knowledge-production", "configure": "^knowledge\\.admin\\.default$", "write": "^$|^knowledge\\.admin\\.default$", "read": "^$"},
          {"user": "knowledge-admin-backend-worker", "vhost": "knowledge-production", "configure": "^knowledge\\.admin\\.default$", "write": "^$|^knowledge\\.admin\\.default$", "read": "^knowledge\\.admin\\.default$"}
        ],
        "queues": [
          {"name": "info.admin.default", "vhost": "info-production", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "research.admin.default", "vhost": "research-production", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "investment.web.default", "vhost": "investment-production", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "investment.admin.default", "vhost": "investment-production", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "investment.default", "vhost": "investment-production", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "knowledge.admin.default", "vhost": "knowledge-production", "durable": true, "auto_delete": false, "arguments": {}}
        ]
      }
