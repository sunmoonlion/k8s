apiVersion: v1
kind: Service
metadata: {name: object-storage, namespace: data-platform-dev}
spec:
  selector: {app.kubernetes.io/name: object-storage}
  ports:
    - {name: https, port: 9000, targetPort: https}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: object-storage, namespace: data-platform-dev}
spec:
  serviceName: object-storage
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app.kubernetes.io/name: object-storage}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: object-storage}
      annotations: {sunmoonai.com/input-sha256: '8d1fa9a5e57ce89bb90375a76eb93ec6e2c9f4dbb48bd58c1787658a8e4ff62e'}
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: 'sunmoon-kind-worker2'}
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: object-storage
          image: harbor.sunmoonai.com:30443/platform/aistor@sha256:a94e1fe399bd050fe6d6148839597a4995350c0e62c9e83f0cec8b5630ed0a1e
          imagePullPolicy: IfNotPresent
          command: [minio]
          args: [server, /data, --address, ':9000', --console-address, ':9001', --license, /run/auth/minio.license, --certs-dir, /run/auth]
          env:
            - {name: MINIO_ROOT_USER_FILE, value: /run/auth/root-user}
            - {name: MINIO_ROOT_PASSWORD_FILE, value: /run/auth/root-password}
            - {name: MINIO_SITE_REGION, value: 'us-east-1'}
            - {name: HOME, value: /tmp}
            - {name: MINIO_BROWSER_REDIRECT_URL, value: 'https://aistor.sunmoonai.com:30443'}
            - {name: MINIO_SERVER_URL, value: 'https://object-storage.data-platform-dev.svc.cluster.local:9000'}
          ports:
            - {name: https, containerPort: 9000}
            - {name: console, containerPort: 9001}
          startupProbe: {httpGet: {path: /minio/health/live, port: https, scheme: HTTPS}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: https, scheme: HTTPS}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /minio/health/live, port: https, scheme: HTTPS}, periodSeconds: 20, timeoutSeconds: 3}
          resources: {"requests": {"cpu": "100m", "memory": "512Mi"}, "limits": {"cpu": "2", "memory": "2Gi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: object-storage-data}}
        - {name: auth, secret: {secretName: object-storage-auth, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
