apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker-tools-admin-backend
  namespace: app-platform-dev
  labels:
    app: celeryworker-tools-admin-backend
    component: celery-worker
    backend: tools-admin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celeryworker-tools-admin-backend
  template:
    metadata:
      labels:
        app: celeryworker-tools-admin-backend
        component: celery-worker
        backend: tools-admin-backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: celeryworker
        image: harbor.sunmoonai.com:30443/k8s-images/tools-admin-backend:1.0.0
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -n "$(printenv CELERY_INCLUDE_MODULES)" ]; then
            exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
              -I "$(printenv CELERY_INCLUDE_MODULES)" \
              -l "$(printenv CELERY_LOG_LEVEL)" \
              -Q "$(printenv CELERY_QUEUE)" \
              -c "$(printenv CELERY_CONCURRENCY)"
          fi
          exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
            -l "$(printenv CELERY_LOG_LEVEL)" \
            -Q "$(printenv CELERY_QUEUE)" \
            -c "$(printenv CELERY_CONCURRENCY)"
        envFrom:
        - configMapRef:
            name: tools-admin-backend-config
        - secretRef:
            name: tools-admin-backend-secret
        - configMapRef:
            name: celeryworker-tools-admin-backend-config
        - secretRef:
            name: celeryworker-tools-admin-backend-secret
        env:
        - name: CELERY_PRODUCER_SERVICE
          value: "tools-admin-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 10
          periodSeconds: 15
