apiVersion: v1
kind: PersistentVolume
metadata:
  name: harbor-sunmoonai-registry-dev-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kind-local-storage/harbor/registry
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [kind-worker]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-sunmoonai-registry-dev-pvc
  namespace: cicd-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""
  volumeName: harbor-sunmoonai-registry-dev-pv
---
