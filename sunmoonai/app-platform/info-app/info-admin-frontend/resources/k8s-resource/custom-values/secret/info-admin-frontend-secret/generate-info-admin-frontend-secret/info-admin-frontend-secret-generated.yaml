apiVersion: v1
kind: Secret
metadata:
  name: info-admin-frontend-secret
  namespace: app-platform-dev
  labels:
    app: info-admin-frontend
type: Opaque
stringData:
  # 运行阶段是纯 nginx 容器，不持有任何密钥。
  # 所有敏感变量（如 Casdoor client_secret）均在 info-admin-backend 中保管。
  # 本 Secret 预留用于将来可能的 nginx Basic Auth 等场景（当前为空）。
