# KIND 当前配置；与本目录实现同源维护。秘密与版本摘要不在这里。
---
# 部署/启动准入；修改边界见同目录 README 的字段表。
registry_enabled: true
# 仓库TLS/SNI域名；修改边界见同目录 README 的字段表。
registry_hostname: harbor.sunmoonai.com
# Compose实例名；修改边界见同目录 README 的字段表。
registry_project: sunmoon-registry
# 宿主回环HTTPS后端端口；修改边界见同目录 README 的字段表。
registry_https_port: 11443
# 私有配置、身份与TLS目录；修改边界见同目录 README 的字段表。
registry_config_dir: /etc/sunmoon/registry
# 官方生成配置和Compose运行目录；修改边界见同目录 README 的字段表。
registry_runtime_dir: /opt/sunmoon/registry
# 仓库数据挂载根；修改边界见同目录 README 的字段表。
registry_data_root: /data/harbor
# 本实例数据及日志目录；修改边界见同目录 README 的字段表。
registry_instance_dir: /data/harbor/platform-kind-v1
# 既定日志轮转授权；修改边界见同目录 README 的字段表。
registry_log_rotation_approved: true

# Human login policy; initial files are private inputs, not passwords in configuration.
registry_credential_backup_dir: /mnt/sunmoon-data/backups/registry/platform-kind-v1/credentials
registry_human_account:
  object: registry
  id: admin
  username: admin
  table_row: '12'
  table_import: true
  current_file: '{{ registry_config_dir }}/private/admin-password'
  current_field: ''
  backup_file: '{{ registry_credential_backup_dir }}/admin-password'
  initial_file: '{{ registry_config_dir }}/private/presets/admin-password'
  initial_backup_file: '{{ registry_credential_backup_dir }}/presets/admin-password'
  minimum_length: 8
  maximum_length: 128
  adapter: harbor
