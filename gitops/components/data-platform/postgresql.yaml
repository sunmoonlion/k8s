---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: data-platform-dev
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgresql}
  ports: [{name: service, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: data-platform-dev
spec:
  selector: {app.kubernetes.io/name: postgresql}
  ports:
    - {name: service, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: data-platform-dev
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: sunmoon-platform}
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: sunmoon-kind-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: harbor.sunmoonai.com:30443/platform/postgresql@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          ports:
            - {name: service, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/auth/password}
            - {name: POSTGRES_INITDB_ARGS, value: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: shm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgresql-data}}
        - {name: auth, secret: {secretName: postgresql-auth, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: run, emptyDir: {sizeLimit: 16Mi}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
