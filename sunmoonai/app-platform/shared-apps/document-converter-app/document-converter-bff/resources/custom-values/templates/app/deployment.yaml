apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-converter
  namespace: {{NAMESPACE}}
  labels:
    app: document-converter
    component: document-converter
    project: sunmoonai
spec:
  replicas: {{REPLICAS}}
  selector:
    matchLabels:
      app: document-converter
  template:
    metadata:
      labels:
        app: document-converter
        component: document-converter
        project: sunmoonai
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: document-converter
        image: {{IMAGE}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: {{CPU_REQUEST}}
            memory: {{MEMORY_REQUEST}}
          limits:
            cpu: {{CPU_LIMIT}}
            memory: {{MEMORY_LIMIT}}
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp-uploads
          mountPath: /tmp/uploads
        - name: tmp-outputs
          mountPath: /tmp/outputs
        - name: data-storage
          mountPath: {{PVC_MOUNT_PATH:-/app/data}}
          subPath: {{PVC_SUB_PATH:-}}
      volumes:
      - name: tmp-uploads
        emptyDir: {}
      - name: tmp-outputs
        emptyDir: {}
      - name: data-storage
        persistentVolumeClaim:
          claimName: {{PVC_NAME:-document-converter-pvc}}

