# ============================================================================
# Secrets All 部署配置
# ============================================================================

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件（使用新迁移的Secret脚本）
mongodb_auth_secret_enabled="true"       # 是否部署 MongoDB 认证密钥
harbor_registry_secret_enabled="true"  # 是否部署 Harbor 镜像拉取密钥（通常复用全局）
mongodb_llmopsservice_db_secret_enabled="true"  # 是否部署 LLMOps Service 数据库连接密钥

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
mongodb_auth_secret_priority=1000        # MongoDB 认证密钥优先级最高（最先部署）
harbor_registry_secret_priority=800     # Harbor 镜像拉取密钥优先级高
mongodb_llmopsservice_db_secret_priority=500  # LLMOps Service 数据库连接密钥优先级中等
