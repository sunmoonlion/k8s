# ============================================================================
# Harbor Registry Secret YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/secret/harbor-registry-secret.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="harbor-registry-secret-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="secret"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-celeryworker-incubator.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# Secret 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 Secret YAML 文件
# ============================================================================
# Secret 名称
HARBOR_REGISTRY_SECRET_NAME="${HARBOR_REGISTRY_SECRET_NAME:-harbor-registry-secret}"

# Harbor 镜像仓库配置
HARBOR_REGISTRY_URL="${HARBOR_REGISTRY_URL:-harbor.sunmoonai.com:30443}"
HARBOR_REGISTRY_USERNAME="${HARBOR_REGISTRY_USERNAME:-admin}"
HARBOR_REGISTRY_PASSWORD="${HARBOR_REGISTRY_PASSWORD:-Harbor12345}"
