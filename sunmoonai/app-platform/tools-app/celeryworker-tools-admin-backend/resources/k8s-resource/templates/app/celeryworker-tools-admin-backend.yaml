apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker-tools-admin-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-tools-admin-backend
    component: celery-worker
    backend: tools-admin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celeryworker-tools-admin-backend
  template:
    metadata:
      labels:
        app: celeryworker-tools-admin-backend
        component: celery-worker
        backend: tools-admin-backend
    spec:
      imagePullSecrets:
      - name: ${CELERYWORKER_TOOLS_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: celeryworker
        image: ${CELERYWORKER_TOOLS_ADMIN_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -n "$(printenv CELERY_INCLUDE_MODULES)" ]; then
            exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
              -I "$(printenv CELERY_INCLUDE_MODULES)" \
              -l "$(printenv CELERY_LOG_LEVEL)" \
              -Q "$(printenv CELERY_QUEUE)" \
              -c "$(printenv CELERY_CONCURRENCY)"
          fi
          exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
            -l "$(printenv CELERY_LOG_LEVEL)" \
            -Q "$(printenv CELERY_QUEUE)" \
            -c "$(printenv CELERY_CONCURRENCY)"
        envFrom:
        - configMapRef:
            name: ${TOOLS_ADMIN_BACKEND_CONFIGMAP_NAME:-tools-admin-backend-config}
        - secretRef:
            name: ${TOOLS_ADMIN_BACKEND_SECRET_NAME:-tools-admin-backend-secret}
        - configMapRef:
            name: ${CELERYWORKER_TOOLS_ADMIN_BACKEND_CONFIGMAP_NAME:-celeryworker-tools-admin-backend-config}
        - secretRef:
            name: ${CELERYWORKER_TOOLS_ADMIN_BACKEND_SECRET_NAME:-celeryworker-tools-admin-backend-secret}
        env:
        - name: CELERY_PRODUCER_SERVICE
          value: "tools-admin-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 10
          periodSeconds: 15
