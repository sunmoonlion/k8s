# ============================================================================
# Secrets All 部署配置
# ============================================================================
# 密钥和配置管理子子级部署控制标志

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# Secrets All 组件控制标志
# ============================================================================
# 控制是否部署各个密钥和配置管理组件
harbor_registry_secret_enabled="true"      # 是否部署 Harbor 镜像拉取密钥
postgresql_incubator_db_secret_enabled="true"  # 是否部署 PostgreSQL Incubator 数据库 Secret
neo4j_incubator_db_secret_enabled="true"  # 是否部署 Neo4j Incubator 图数据库 Secret
celeryworker_config_enabled="true"         # 是否部署 Celery Worker ConfigMap

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
harbor_registry_secret_priority=1000        # Harbor 镜像拉取密钥优先级最高（最先部署）
postgresql_incubator_db_secret_priority=900  # PostgreSQL Incubator 数据库 Secret 优先级高
neo4j_incubator_db_secret_priority=850     # Neo4j Incubator 图数据库 Secret 优先级高
celeryworker_config_priority=800           # Celery Worker ConfigMap 优先级高

