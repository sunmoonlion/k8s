apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celeryworker-research-admin-backend-pvc
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-research-admin-backend
    component: celery-worker
    backend: research-admin-backend
spec:
  accessModes:
    - ${PVC_ACCESS_MODE:-ReadWriteOnce}
  storageClassName: ${PVC_STORAGE_CLASS:-local-path}
  resources:
    requests:
      storage: ${PVC_STORAGE_SIZE:-10Gi}
