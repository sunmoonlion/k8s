---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform-services, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 8m
  path: ./components/core
  sourceRef: {kind: OCIRepository, name: platform}
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: casdoor-db, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 6m
  path: ./components/app-platform/casdoor/database
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: platform-services}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: casdoor-init, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 6m
  path: ./components/app-platform/casdoor/init
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: casdoor-db}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: casdoor, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 6m
  path: ./components/app-platform/casdoor
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: casdoor-init}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
