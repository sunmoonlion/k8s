# Casdoor 开发环境 Helm Values
# Chart: casdoor-krzw/casdoor  (community chart, appVersion v1.224.0)

image:
  repository: harbor.sunmoonai.com:30443/k8s-images/casdoor
  pullPolicy: Always
  # tag 由 deploy-casdoor.sh 中通过 --set image.tag= 注入

imagePullSecrets:
  - name: harbor-registry-secret

# ──────────────────────────────────────────────────────────────
# 数据库配置（通过环境变量注入到容器）
# ──────────────────────────────────────────────────────────────
env:
  RUNNING_IN_DOCKER: "true"
  driverName: postgres
  # ⚠️ 密码通过 K8s Secret 覆盖，这里仅作结构占位
  dataSourceName: "user=casdoor password=casdoor_dev_pass host=postgresql-sunmoonai.data-platform-dev.svc.cluster.local port=5432 sslmode=disable dbname=casdoor"
  dbName: ""

# ──────────────────────────────────────────────────────────────
# 服务
# ──────────────────────────────────────────────────────────────
service:
  main:
    ports:
      http:
        port: 8000

# Ingress 由 Traefik IngressRoute 管理
ingress:
  main:
    enabled: false

# ──────────────────────────────────────────────────────────────
# 资源限制
# ──────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ──────────────────────────────────────────────────────────────
# app.conf（beego 配置，通过 ConfigMap 挂载到 /conf）
# copyrequestbody=true 是必须项，缺少会导致登录时 "unexpected end of JSON input"
# ──────────────────────────────────────────────────────────────
configmap:
  config:
    enabled: true
    data:
      app.conf: |
        appname = casdoor
        httpport = 8000
        runmode = dev
        SessionOn = true
        copyrequestbody = true
        logPostOnly = true

persistence:
  config:
    enabled: true
    type: configMap
    name: casdoor-sunmoonai-config
    mountPath: /conf
    readOnly: true
