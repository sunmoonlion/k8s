apiVersion: v1
kind: ConfigMap
metadata: {name: knowbase-runtime, namespace: app-platform-dev}
data:
  ENV: production
  APP_SLUG: knowbase
  DEPLOYMENT_ID: "knowbase-backend-824476357d670cd1"
  ALLOWED_HOSTS: "localhost,127.0.0.1,knowbase-api,knowbase-api.app-platform-dev.svc.cluster.local,knowbase.sunmoonai.com,knowbase-admin.sunmoonai.com,knowbase-tls.app-platform-dev.svc.cluster.local"
  REDIS_HOST: redis.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CELERY_QUEUE: knowbase.default
  CELERY_TASK_TOPOLOGY_PREDECLARED: 'true'
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor.app-platform-dev.svc.cluster.local:8000
  CASDOOR_VERIFY_SSL: 'true'
  SESSION_COOKIE_SECURE: 'true'
  REFERENCE_INTERACTION_ENABLED: 'false'
  RAGFLOW_API_BASE: https://ragflow.data-platform-dev.svc.cluster.local:9380
  RAGFLOW_PARSE_TIMEOUT_SECONDS: '300'
  INGESTION_DATASET_BINDINGS: "{\"default\": {\"dataset_id\": \"a63bc70cc87511f18f5929cf7a1d88ce\", \"dataset_name\": \"sunmoon-kind-knowbase-default\"}}"
  RETRIEVAL_DATASET_ALLOWLIST: "default"
  RETRIEVAL_DEFAULT_TENANT_ID: "sunmoonai"
  S3_ENDPOINT: https://object-storage.data-platform-dev.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'true'
  ARTIFACT_S3_ALLOWED_BUCKETS: "knowfeed-originals"
  ARTIFACT_S3_ALLOWED_PREFIXES: "knowfeed/"
  SSL_CERT_FILE: /etc/sunmoon/provider/ca.crt
  INTERNAL_AUTH_CASDOOR_APPLICATION: "sunmoonai-knowfeed-knowbase-ingest"
  INTERNAL_AUTH_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  INTERNAL_AUTH_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  INTERNAL_AUTH_AUDIENCE: "sunmoon-knowfeed-knowbase-ingest"
  INTERNAL_AUTH_SUBJECT_ALLOWLIST: "admin/sunmoonai-knowfeed-knowbase-ingest"
  INTERNAL_AUTH_REQUIRED_SCOPE: "knowbase:ingest"
  RETRIEVAL_AUTH_CASDOOR_APPLICATION: "sunmoonai-knowbench-knowbase-retrieve"
  RETRIEVAL_AUTH_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  RETRIEVAL_AUTH_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  RETRIEVAL_AUTH_AUDIENCE: "sunmoon-knowbench-knowbase-retrieve"
  RETRIEVAL_AUTH_SUBJECT_ALLOWLIST: "admin/sunmoonai-knowbench-knowbase-retrieve"
  RETRIEVAL_AUTH_REQUIRED_SCOPE: "knowbase:retrieve"
  CROSS_APP_TARGETS_JSON: "{\"knowfeed\": {\"web_base_url\": \"https://knowfeed.sunmoonai.com:30443\"}}"
  CROSS_APP_SOURCES_JSON: "{\"knowbench\": {\"return_url\": \"https://knowbench.sunmoonai.com:30443/zh-CN/workbench?ref={ref}\"}, \"knowfeed\": {}}"
  KNOWBASE_MCP_JWT_ISSUER: "sunmoon-workbench"
  KNOWBASE_MCP_RATE_PER_MINUTE: "120"
  KNOWBASE_DATASET_TITLE: "\u96f6\u552e\u7ecf\u8425\u5e93\uff08\u6700\u5c0f\u5b9e\u4f8b\uff09"
  KNOWBASE_DATASET_REGISTRY_ENABLED: "true"
  KNOWBASE_DATASET_ALLOWED_BUCKETS: "knowfeed-originals"
  KNOWBASE_DATASET_CACHE_DIR: "/tmp/knowbase-datasets"
  KNOWBASE_SEMANTIC_ENGINE_ENABLED: "true"
  KNOWBASE_SEMANTIC_CACHE_DIR: "/tmp/knowledge-semantic"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: knowbase-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowbase-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowbase-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowbase-api
        app.kubernetes.io/part-of: knowbase
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/ragflow-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 45ff5508afbb70a66541a9919de5a9977f7e845acedbcd50bfb7f78ee581754d
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowbase-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/knowbase-backend@sha256:824476357d670cd108cfa70928956d37e4c31e60f77dfbaf4211d4f38046afdf
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowbase-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowbase-runtime}}
            - {configMapRef: {name: knowbase-browser-identity}}
            - {secretRef: {name: knowbase-database-runtime}}
            - {secretRef: {name: knowbase-rabbitmq-runtime}}
            - {secretRef: {name: knowbase-redis-runtime}}
            - {secretRef: {name: knowbase-browser-secrets}}
            - {secretRef: {name: knowbase-domain-runtime}}
            - {secretRef: {name: knowbase-provider-runtime}}
          resources: {"requests": {"cpu": "100m", "memory": "192Mi"}, "limits": {"cpu": "2", "memory": "768Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: provider-ca, mountPath: /etc/sunmoon/provider, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: provider-ca, secret: {secretName: knowbase-provider-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
        - {name: celery-config, configMap: {name: knowbase-celery-config}}
---
