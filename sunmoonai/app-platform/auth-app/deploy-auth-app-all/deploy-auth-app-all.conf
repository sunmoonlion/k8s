# ============================================================================
# Auth App 业务应用基础配置
# ============================================================================
AUTH_APP_PROJECT_ID="sunmoonai"
AUTH_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 组件部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
C1_casdoor_enabled="true"
C2_casdoor_enabled="false"
C3_casdoor_enabled="false"
KIND_casdoor_enabled="true"

C1_auth_app_backend_enabled="false"
C2_auth_app_backend_enabled="false"
C3_auth_app_backend_enabled="false"
KIND_auth_app_backend_enabled="true"

C1_auth_app_front_enabled="false"
C2_auth_app_front_enabled="false"
C3_auth_app_front_enabled="false"
KIND_auth_app_front_enabled="true"

# ============================================================================
# 组件部署优先级（数值越大越先部署）
# ============================================================================
C1_casdoor_priority=1000
C2_casdoor_priority=1000
C3_casdoor_priority=1000
KIND_casdoor_priority=1000

C1_auth_app_backend_priority=900
C2_auth_app_backend_priority=900
C3_auth_app_backend_priority=900
KIND_auth_app_backend_priority=900

C1_auth_app_front_priority=800
C2_auth_app_front_priority=800
C3_auth_app_front_priority=800
KIND_auth_app_front_priority=800
