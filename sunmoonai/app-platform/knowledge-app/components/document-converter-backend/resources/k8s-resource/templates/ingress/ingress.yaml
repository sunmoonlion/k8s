# Single domain route. Middleware selection is performed on parsed objects.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: document-converter-stripprefix
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: document-converter
spec:
  stripPrefix:
    prefixes:
      - /document-converter
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: document-converter-ingress
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: document-converter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${UNIFIED_HOST}`) && PathPrefix(`/document-converter`)
      kind: Rule
      services:
        - name: ${SERVICE_NAME}
          port: ${SERVICE_PORT}
      middlewares: []
  # Use the existing Traefik default TLS certificate; no cross-namespace Secret reference.
