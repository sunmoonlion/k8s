apiVersion: v1
kind: Secret
metadata:
  name: toutiao-app-front-secret
  namespace: ${NAMESPACE}
  labels:
    app: toutiao-app-front
type: Opaque
stringData:
  # OIDC 客户端密钥（与 auth-app-backend 中注册的 client_secret 一致）
  AUTH_CLIENT_SECRET: "${AUTH_CLIENT_SECRET}"

  # Session 加密密钥（随机 32 字符字符串）
  SESSION_SECRET: "${SESSION_SECRET}"
