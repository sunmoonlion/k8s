metadata: {name: knowledge-rabbitmq, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 8m
  path: ./components/app-platform/knowledge-app/knowledge-backend/rabbitmq
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: knowledge-redis}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
