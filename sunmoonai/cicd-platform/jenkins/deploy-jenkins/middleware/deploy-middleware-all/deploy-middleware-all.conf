# Jenkins 中间件总控部署配置

# 基础配置
JENKINS_PROJECT_ID="sunmoonai"
JENKINS_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
jenkins_policy_enabled="true"        # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
jenkins_policy_priority=100       # Policy 后部署（依赖路径前缀已存在）
