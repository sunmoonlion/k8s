# 用户配置，由原生 Ansible 读取；不作为 Kubernetes 对象应用。
---
services_casdoor_enabled: true
casdoor_volume:
  name: casdoor
  node: worker
  size: 1Gi
  uid: 1000
  gid: 1000
casdoor_hostname: 'casdoor.{{ site_domain }}'
# Casdoor 登录会话保持多久（秒，写进 app.conf 的 sessionCookieLifeTime）。sunmoonai 网页端开了单点登录，
# 公用电脑上忘了退出，这段时间内下一位能直接进入；所有者 2026-10-16 定 12 小时（SDD 0027）。全局生效，管理端一样
casdoor_session_lifetime_seconds: 43200
casdoor_database: casdoor
casdoor_database_user: casdoor

# Human login policy is separate from database and service identities.
casdoor_human_account:
  object: app-platform/auth-app/casdoor
  id: admin
  username: built-in/admin
  table_row: '18'
  table_import: true
  current_file: '{{ services_config_dir }}/credentials.yaml'
  current_field: service_credentials.casdoor_admin_password
  backup_file: '{{ services_backup_dir }}/credentials.yaml'
  initial_file: '{{ services_config_dir }}/presets/casdoor-admin-password'
  initial_backup_file: '{{ services_backup_dir }}/presets/casdoor-admin-password'
  minimum_length: 8
  maximum_length: 128
  adapter: casdoor
