# ============================================================================
# Investment Web Frontend Secret YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ⚠️ 敏感信息：请妥善保管此配置文件
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/secret/investment-web-frontend-secret.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="investment-web-frontend-secret-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="secret"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（SSR Nuxt 前端）
# ⚠️ 敏感信息：请妥善保管此配置文件
# ============================================================================
# Session/Cookie 加密密钥（⚠️ 必须修改为安全的随机字符串）
NUXT_SESSION_SECRET="${NUXT_SESSION_SECRET:-changeme}"

# OIDC / OAuth 客户端密钥（如需对接 Casdoor）
AUTH_CLIENT_SECRET="${AUTH_CLIENT_SECRET:-changeme}"

# Sentry DSN（可选）
SENTRY_DSN="${SENTRY_DSN:-}"
