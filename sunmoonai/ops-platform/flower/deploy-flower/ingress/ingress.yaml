# Flower Web 路由配置
# 通过 Traefik HTTP 路由暴露 Flower Web 服务
#
# 使用路径前缀路由，避免需要在 /etc/hosts 中配置多个域名
# 访问方式：
# - https://<节点IP>:30443/flower
# - 或 https://www.sunmoonai.com/flower (如果配置了 DNS)
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flower-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: ops-platform-ingress
    component: flower-web
spec:
  entryPoints:
    - websecure
  routes:
    # 主路由：处理所有 /flower 开头的路径
    # Flower 使用 --url_prefix=/flower 启动，会自动处理所有路径（参考 redisinsight）
    # 包括：/flower/、/flower/api/*、/flower/static/* 等
    # 注意：访问时需要使用 /flower/（带尾随斜杠），Flower 应用需要尾随斜杠
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/flower`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    # 主路由：处理所有 /flower 开头的路径
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/flower`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: ingress-platform-dev/traefik-tls-secret
