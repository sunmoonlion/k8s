# Kind 一键部署配置
# 供 deploy-kind.sh 读取（若存在）。修改后无需改脚本即可生效。

# -----------------------------------------------------------------------------
# NFS
# -----------------------------------------------------------------------------
# WSL 上 NFS 导出目录，须与 wsl-setup-nfs-server.sh 及 kind-up.sh 中一致
NFS_EXPORT_DIR="/data/kind-nfs"

# -----------------------------------------------------------------------------
# 一键部署步骤开关（也可通过命令行 --skip-registry-config / --skip-harbor-hosts 覆盖）
# -----------------------------------------------------------------------------
# 是否生成本地根 CA（与远程 Step12 同用途，供 Traefik/Harbor 等后续部署签发证书；若已存在则跳过）
DEPLOY_KIND_RUN_CA_INIT="true"
# 是否在 Kind 节点内写入 containerd 镜像拉取配置（与远程 Step02 对齐，先于镜像预加载执行）
DEPLOY_KIND_RUN_REGISTRY_CONFIG="true"
# 是否在 WSL /etc/hosts 中添加 Harbor 域名
DEPLOY_KIND_RUN_HARBOR_HOSTS="true"

# 是否在 Kind 集群中部署 Traefik 与 Harbor 组件（仅在本地 Kind 场景下使用）。
# 为 true 时，deploy-kind.sh 会在集群与存储准备好之后，调用各自的递归部署脚本：
#   - Traefik: ingress-platform/deploy-ingress-platform-all/deploy-ingress-platform-all.sh
#   - Harbor : cicd-platform/harbor/deploy-harbor/deploy-harbor.sh deploy
# 注意：这些脚本本身有各自的配置与前置条件，请确保已按各自文档配置好。
DEPLOY_KIND_RUN_TRAEFIK="true"
DEPLOY_KIND_RUN_HARBOR="true"

# -----------------------------------------------------------------------------
# Kind 节点 registry 配置（可选覆写，默认从 infrastructure 的 deploy-infrastructure-all.conf 读取 STEP02_REGISTRY_*）
# -----------------------------------------------------------------------------
# STEP02_REGISTRY_ENABLE="true"
# STEP02_REGISTRY_MIRRORS="docker.io=https://harbor.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://harbor.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io"
# STEP02_REGISTRY_DIRECT="harbor.sunmoonai.com:30443"

# -----------------------------------------------------------------------------
# Kind 节点基础镜像与自建镜像后缀（供 build-kind-node-image 使用）
# -----------------------------------------------------------------------------
# KIND_BASE_IMAGE：官方 kindest/node 基础镜像版本。
# 如需升级 Kind 版本，建议优先在此处更新：
#   KIND_BASE_IMAGE="kindest/node:v1.28.0"
KIND_BASE_IMAGE="kindest/node:v1.27.3"

# CUSTOM_NODE_SUFFIX：自建节点镜像 tag 后缀；与 build-kind-node-image.sh 中默认值保持一致。
# 例如 base 为 kindest/node:v1.27.3，后缀为 sunmoonai，则最终镜像为 kindest/node:v1.27.3-sunmoonai。
CUSTOM_NODE_SUFFIX="sunmoonai"

# -----------------------------------------------------------------------------
# Kind 集群重建控制
# -----------------------------------------------------------------------------
# 集群已存在时是否自动删除并重建（true/false，默认 false）
RECREATE_KIND_CLUSTER_IF_EXISTS="true"

# -----------------------------------------------------------------------------
# Kind 节点内 Harbor 解析（供 apply-kind-node-harbor-hosts.sh，因 v1alpha4 无 extraHosts）
# -----------------------------------------------------------------------------
# 集群内 harbor.sunmoonai.com 解析到的 IP（任一节点均可，NodePort 在各节点都监听）
# 实测：control-plane=172.18.0.2, kind-worker=172.18.0.3, kind-worker2=172.18.0.4
HARBOR_NODE_IP="172.18.0.2"

# -----------------------------------------------------------------------------
# WSL 使用 Windows 代理（供 apply-nfs-existing-cluster.sh 等从 GitHub 拉 chart）
# -----------------------------------------------------------------------------
# 留空则不用代理。取消下面两行注释后，IP 自动取 WSL 默认网关（即 Windows 主机，如 172.28.32.1），只需改端口
WINDOWS_PROXY_PORT="7890"
HTTP_PROXY_WSL="http://$(ip route show | grep -E '^default ' | awk '{print $3}'):${WINDOWS_PROXY_PORT}"
HTTPS_PROXY_WSL="http://$(ip route show | grep -E '^default ' | awk '{print $3}'):${WINDOWS_PROXY_PORT}"

# -----------------------------------------------------------------------------
# WSL 宿主机 Harbor 解析与登录及登录控制（供 wsl-setup-harbor-hosts-and-login.sh 与 deploy-kind.sh 使用）
# 是否在 deploy-kind.sh 末尾自动调用 wsl-setup-harbor-hosts-and-login.sh（true/false，仅 hosts+CA，不强制登录）
DEPLOY_KIND_RUN_HARBOR_HOSTS="true"
# 若希望在 WSL 宿主机自动登录 Harbor，在此配置管理员密码；若留空则不进行自动登录（可手动 docker login）
HARBOR_ADMIN_PASSWORD="Harbor@12345"
# 是否在一键流程中单独执行一次 WSL docker login Harbor（不依赖是否推送，仅用于方便开发验证）
DEPLOY_KIND_RUN_HARBOR_LOGIN="true"
# -----------------------------------------------------------------------------
# Harbor 域名，须与 Harbor 访问地址一致
HARBOR_HOST="harbor.sunmoonai.com"
# 宿主机访问 Harbor 时解析到的 IP：留空则脚本从当前 Kind 集群 control-plane 自动检测；填具体 IP 则固定使用（集群外 Harbor 时改为该入口 IP）。用节点 IP 而非 127.0.0.1 可避免 Docker 将 127.0.0.0/8 视为 insecure 导致 502
# HARBOR_IP="172.18.0.2"
HARBOR_IP=""
# Harbor 端口：直连节点时用 Traefik NodePort 30443（与 HARBOR_NODE_IP 一致）；集群内也为 30443
HARBOR_PORT="30443"

# -----------------------------------------------------------------------------
# 向 Harbor 推送镜像（供 push-to-harbor/push-images-to-harbor.sh 使用，可与 deploy-kind 流程分开执行）
# -----------------------------------------------------------------------------
# 是否在一键流程末尾执行推送：为 true 且下方配置了镜像来源时，会调用 push-images-to-harbor.sh。
DEPLOY_KIND_RUN_PUSH_TO_HARBOR="true"
#
# 与 load-images、build-kind-node-image 一致：支持「镜像列表文件」与「tar 目录」两种来源，可只填一项或两项都填。
# 路径相对本配置所在 deploy-kind 目录，或绝对路径；多个用英文逗号分隔。
#
# 镜像列表文件（一行一个镜像名，# 注释）
# DEPLOY_KIND_PUSH_IMAGE_FILES="../push-to-harbor/images-default.txt"
DEPLOY_KIND_PUSH_IMAGE_FILES=""
#
# tar 目录（该目录内所有 .tar 会 load 后推送到 Harbor）
# 相对 deploy-kind 目录；../../../packages-to-be-installed/images → /home/zymun/packages-to-be-installed/images
# DEPLOY_KIND_PUSH_TAR_DIRS="../push-to-harbor/tar-default-dir"
DEPLOY_KIND_PUSH_TAR_DIRS="../../../../packages-to-be-installed/images"
