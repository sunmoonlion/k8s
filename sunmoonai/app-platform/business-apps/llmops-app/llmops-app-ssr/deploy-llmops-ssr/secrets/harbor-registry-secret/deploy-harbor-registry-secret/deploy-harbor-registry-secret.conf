# =============================================================================
# Harbor Registry Secret 部署配置（LLMOPS SSR）
# 文件名: deploy-harbor-registry-secret.conf
# 用途: 配置 Harbor 镜像拉取 Secret 的生成和部署参数
# =============================================================================

# =============================================================================
# Secret 基本信息
# =============================================================================

# Secret 名称
SECRET_NAME="harbor-registry-secret"

# Secret 命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"

# Secret 类型（Docker 认证）
SECRET_TYPE="kubernetes.io/dockerconfigjson"

# =============================================================================
# Docker 认证配置
# =============================================================================

# Docker 服务器地址
# 优先使用主配置文件中的 LLMOPS_APP_SSR_IMAGE_REGISTRY（如果已设置）
# 如果主配置文件未加载，则使用默认值
DOCKER_SERVER="${LLMOPS_APP_SSR_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"

# Docker 用户名
DOCKER_USERNAME="admin"

# Docker 密码
DOCKER_PASSWORD="Harbor@12345"

# Docker 邮箱（可选）
# DOCKER_EMAIL="dev@sunmoonai.com"

# =============================================================================
# Secret 部署配置
# =============================================================================

# 是否重启使用该 Secret 的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"


