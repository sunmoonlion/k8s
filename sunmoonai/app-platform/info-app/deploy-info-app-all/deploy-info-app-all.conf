# ============================================================================
# Info App 业务应用配置
# ============================================================================
INFO_APP_PROJECT_ID="sunmoonai"
INFO_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"
INFO_APP_IMAGE_TAG="${INFO_APP_IMAGE_TAG:-1.0.0}"
INFO_ADMIN_BACKEND_TAG="${INFO_ADMIN_BACKEND_TAG:-1.0.1}"
CELERYWORKER_INFO_ADMIN_BACKEND_TAG="${CELERYWORKER_INFO_ADMIN_BACKEND_TAG:-1.0.1}"

# App 源码根目录。Backend 的资源声明随源码维护。
INFO_APP_SOURCE_ROOT="${INFO_APP_SOURCE_ROOT:-${HOME}/info-app}"

# Backend 能力默认完整启用；是否启动组件由下面的集群开关决定。
info_admin_backend_database_access_enabled="true"
info_admin_backend_redis_access_enabled="true"
info_admin_backend_mongodb_access_enabled="false"
info_admin_backend_storage_access_enabled="true"
info_admin_backend_search_access_enabled="true"
info_web_backend_database_access_enabled="true"
info_web_backend_redis_access_enabled="true"
info_web_backend_mongodb_access_enabled="false"
info_web_backend_storage_access_enabled="true"
info_web_backend_search_access_enabled="true"

# C1 远程开发集群暂不部署平台 Elasticsearch；Kind 仍使用默认 search=true。
C1_info_admin_backend_search_access_enabled="false"
C1_info_web_backend_search_access_enabled="false"

