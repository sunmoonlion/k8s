apiVersion: v1
kind: ConfigMap
metadata: {name: info-runtime, namespace: app-platform-dev}
data:
  ENV: production
  APP_SLUG: info
  DEPLOYMENT_ID: "info-9fbf4183337a92c8"
  ALLOWED_HOSTS: "localhost,127.0.0.1,info-api,info-api.app-platform-dev.svc.cluster.local,info.sunmoonai.com,info-admin.sunmoonai.com"
  REDIS_HOST: redis.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CELERY_QUEUE: info.default
  CELERY_TASK_TOPOLOGY_PREDECLARED: 'true'
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor.app-platform-dev.svc.cluster.local:8000
  CASDOOR_VERIFY_SSL: 'true'
  SESSION_COOKIE_SECURE: 'true'
  REFERENCE_INTERACTION_ENABLED: 'false'
  S3_ENDPOINT: https://object-storage.data-platform-dev.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_BUCKET: info-originals
  S3_FORCE_PATH_STYLE: 'true'
  S3_USE_TLS: 'true'
  AWS_CA_BUNDLE: /etc/sunmoon/object-storage/ca.crt
  STORAGE_BACKEND: "s3"
  SEARCH_BACKEND: "disabled"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: info-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: info-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: info-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: info-api
        app.kubernetes.io/part-of: info
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 08c4ed31938dd56bcf48e5193c066fb9b25ada75b49191d4aa7280d8482fe2c8
    spec:
      serviceAccountName: info-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/info-backend@sha256:f1f45c85441f36d77c320c467f31a1dff40073c11a4ac4f696035b8460838efa
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: info-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: info-runtime}}
            - {configMapRef: {name: info-browser-identity}}
            - {secretRef: {name: info-database-runtime}}
            - {secretRef: {name: info-rabbitmq-runtime}}
            - {secretRef: {name: info-redis-runtime}}
            - {secretRef: {name: info-browser-secrets}}
            - {secretRef: {name: info-storage-runtime}}
          resources: {"requests": {"cpu": "100m", "memory": "192Mi"}, "limits": {"cpu": "2", "memory": "768Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: storage-ca, secret: {secretName: info-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: info-celery-config}}
---
apiVersion: apps/v1
