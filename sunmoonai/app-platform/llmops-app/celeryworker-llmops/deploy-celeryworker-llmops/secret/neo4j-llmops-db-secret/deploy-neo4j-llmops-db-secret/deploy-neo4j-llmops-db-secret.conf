# =============================================================================
# Neo4j LLMOps DB Secret 部署配置
# 文件名: deploy-neo4j-llmops-db-secret.conf
# 用途: 配置Neo4j图数据库连接信息Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="neo4j-llmops-db-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（Neo4j连接信息）
# =============================================================================

# Neo4j 服务器地址（与 llmops-service-config 保持一致，使用 K8s 集群内 DNS）
NEO4J_SERVER="neo4j-service.data-platform"

# Neo4j 端口（标准 Neo4j 端口）
NEO4J_PORT="7687"

# Neo4j 用户名（需要根据实际配置调整）
NEO4J_USERNAME="neo4j"

# Neo4j 密码（需要根据实际配置调整，应与 llmops-service-secret 保持一致）
NEO4J_PASSWORD="zym123"

# Neo4j Bolt 协议（与 llmops-service-config 保持一致）
NEO4J_BOLT="bolt"

# Neo4j 认证（需要根据实际配置调整）
NEO4J_AUTH="neo4j"

# Neo4j Bolt URL（完整连接字符串）
# 格式：bolt://username:password@host:port
NEO4J_BOLT_URL="bolt://${NEO4J_USERNAME}:${NEO4J_PASSWORD}@${NEO4J_SERVER}:${NEO4J_PORT}"

# =============================================================================
# Neo4j 其他配置（非敏感配置，通常放在 ConfigMap，但也可以放在 Secret 中）
# =============================================================================
# 这些配置与 llmops-service-config 保持一致
NEO4J_FORCE_TIMEZONE="True"
NEO4J_AUTO_INSTALL_LABELS="True"
NEO4J_MAX_CONNECTION_POOL_SIZE="50"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
