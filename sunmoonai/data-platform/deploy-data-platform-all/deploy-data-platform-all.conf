# ============================================================================
# Data Platform 平台基础配置
# ============================================================================
DATA_PLATFORM_PROJECT_ID="sunmoonai"
DATA_PLATFORM_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# 说明：
# - C1：业务数据库/缓存（PostgreSQL/MongoDB/Redis）
# - C2：日志与观测（Elasticsearch/Kibana/Logstash/Neo4j 等）
# - KIND：本地 Kind 集群，默认对齐 C1（启用数据库/缓存，日志栈按需手动开启）

# PostgreSQL
C1_postgresql_enabled="true"
C2_postgresql_enabled="false"
C3_postgresql_enabled="false"
KIND_postgresql_enabled="true"

# MongoDB
C1_mongodb_enabled="true"
C2_mongodb_enabled="false"
C3_mongodb_enabled="false"
KIND_mongodb_enabled="true"

# Redis
C1_redis_enabled="true"
C2_redis_enabled="false"
C3_redis_enabled="false"
KIND_redis_enabled="true"

# Elasticsearch
C1_elasticsearch_enabled="false"
C2_elasticsearch_enabled="false"
C3_elasticsearch_enabled="false"
KIND_elasticsearch_enabled="true"

# Kibana
C1_kibana_enabled="false"
C2_kibana_enabled="false"
C3_kibana_enabled="false"
KIND_kibana_enabled="true"

# Logstash
C1_logstash_enabled="false"
C2_logstash_enabled="false"
C3_logstash_enabled="false"
KIND_logstash_enabled="true"

# Neo4j（预留，默认全部关闭）
C1_neo4j_enabled="false"
C2_neo4j_enabled="false"
C3_neo4j_enabled="false"
KIND_neo4j_enabled="true"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
C1_postgresql_priority=900
C2_postgresql_priority=900
C3_postgresql_priority=900
KIND_postgresql_priority=900

C1_mongodb_priority=800
C2_mongodb_priority=800
C3_mongodb_priority=800
KIND_mongodb_priority=800

C1_redis_priority=700
C2_redis_priority=700
C3_redis_priority=700
KIND_redis_priority=700

C1_elasticsearch_priority=600
C2_elasticsearch_priority=600
C3_elasticsearch_priority=600
KIND_elasticsearch_priority=600

C1_kibana_priority=500
C2_kibana_priority=500
C3_kibana_priority=500
KIND_kibana_priority=500

C1_logstash_priority=400
C2_logstash_priority=400
C3_logstash_priority=400
KIND_logstash_priority=400

C1_neo4j_priority=300
C2_neo4j_priority=300
C3_neo4j_priority=300
KIND_neo4j_priority=300

