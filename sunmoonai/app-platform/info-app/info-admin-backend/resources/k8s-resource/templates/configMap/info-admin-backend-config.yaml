apiVersion: v1
kind: ConfigMap
metadata:
  name: info-admin-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: info-admin-backend
data:
  ENV: "${ENVIRONMENT}"
  STORAGE_BACKEND: "${STORAGE_BACKEND}"
  SEARCH_BACKEND: "${SEARCH_BACKEND}"
  ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX}"
  CELERY_QUEUE: "${CELERY_QUEUE}"
  DELIVERY_OUTBOX_BATCH_SIZE: "${DELIVERY_OUTBOX_BATCH_SIZE}"
  DELIVERY_OUTBOX_LEASE_SECONDS: "${DELIVERY_OUTBOX_LEASE_SECONDS}"
  DELIVERY_OUTBOX_ACK_TIMEOUT_SECONDS: "${DELIVERY_OUTBOX_ACK_TIMEOUT_SECONDS}"
  DELIVERY_OUTBOX_RETRY_BASE_SECONDS: "${DELIVERY_OUTBOX_RETRY_BASE_SECONDS}"
  DELIVERY_OUTBOX_RETRY_MAX_SECONDS: "${DELIVERY_OUTBOX_RETRY_MAX_SECONDS}"
  KNOWLEDGE_APP_INGEST_URL: "${KNOWLEDGE_APP_INGEST_URL}"
  KNOWLEDGE_APP_SERVICE_APPLICATION: "${KNOWLEDGE_APP_SERVICE_APPLICATION}"
  KNOWLEDGE_APP_SERVICE_SCOPE: "${KNOWLEDGE_APP_SERVICE_SCOPE}"
  KNOWLEDGE_APP_TIMEOUT_SECONDS: "${KNOWLEDGE_APP_TIMEOUT_SECONDS}"
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  CASDOOR_VERIFY_SSL: "${CASDOOR_VERIFY_SSL}"
  FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
  FRONTEND_ALLOWED_ORIGINS: "${FRONTEND_ALLOWED_ORIGINS}"
  AUTH_POLICY_VERSION: "${AUTH_POLICY_VERSION}"
  AUTH_ALLOWED_ALGORITHMS: "${AUTH_ALLOWED_ALGORITHMS}"
