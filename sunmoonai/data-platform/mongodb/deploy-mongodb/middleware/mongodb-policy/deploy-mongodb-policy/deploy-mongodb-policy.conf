# Mongodb 策略中间件部署配置
# 注意：Mongodb 使用 TCP 路由，middleware 支持有限（仅 rateLimit 可能有效）

# 基础配置
MONGODB_PROJECT_ID="sunmoonai"
MONGODB_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置（TCP 路由仅支持 rateLimit）
MONGODB_POLICY_TYPES="rateLimit"

# 限流配置
MONGODB_RATE_LIMIT_AVERAGE="100"
MONGODB_RATE_LIMIT_BURST="200"

