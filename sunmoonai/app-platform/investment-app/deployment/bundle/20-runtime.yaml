apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-backend-api
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: investment-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: investment
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      sunmoonai.com/app: investment
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: investment
        sunmoonai.com/app: investment
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/internal-provider: 'true'
      annotations:
        sunmoonai.com/release-id: v20-investment-001
        sunmoonai.com/config-sha256: dff077901c69beb26d5241cd8d8862e754f41076c6169cde2157f0a855425e20
    spec:
      serviceAccountName: investment-backend-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            sunmoonai.com/app: investment
            app.kubernetes.io/component: backend-api
      containers:
      - name: api
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:b50ffde5a79fc4f1f2b78bbe74f7dbbfb02570514096ea67a7b5d5dde6526272
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        args:
        - app.bootstrap.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: investment-backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PASSWORD
        - name: ADMIN_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: ADMIN_CLIENT_ID
        - name: ADMIN_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: ADMIN_CLIENT_SECRET
        - name: WEB_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: WEB_CLIENT_ID
        - name: WEB_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: WEB_CLIENT_SECRET
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-broker
              key: CELERY_BROKER_URL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: investment-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      sunmoonai.com/app: investment
      app.kubernetes.io/component: backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: investment-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: investment-backend-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-backend-worker
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: investment-backend
    app.kubernetes.io/component: backend-worker
    app.kubernetes.io/part-of: investment
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      sunmoonai.com/app: investment
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-backend
        app.kubernetes.io/component: backend-worker
        app.kubernetes.io/part-of: investment
        sunmoonai.com/app: investment
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/allow-knowledge-internal: 'true'
      annotations:
        sunmoonai.com/config-sha256: dff077901c69beb26d5241cd8d8862e754f41076c6169cde2157f0a855425e20
    spec:
      serviceAccountName: investment-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:b50ffde5a79fc4f1f2b78bbe74f7dbbfb02570514096ea67a7b5d5dde6526272
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
            name: investment-backend-config
        - secretRef:
            name: investment-knowledge-retrieval-client
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-postgresql-conn
              key: DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-broker
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: investment-backend-broker
              key: CELERY_RESULT_BACKEND
              optional: true
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PASSWORD
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - celery -A app.bootstrap.worker:celery_app inspect ping --destination="celery@${POD_NAME}"
              --timeout=3 | grep -q pong
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
