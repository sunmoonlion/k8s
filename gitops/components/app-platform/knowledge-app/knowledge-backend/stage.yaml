# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: {file: app-platform/common/backend/prepare.yaml, vars: {application_name: knowledge}}
defaults: {enabled: '{{ knowledge_deployment.enabled }}', timeout: 8m}
stages:
- name: knowledge-database
  path: database
  dependsOn: [postgresql]
  resources: [workload.yaml, bootstrap.sops.yaml, runtime.sops.yaml]
- name: knowledge-migration
  path: migration
  dependsOn: [knowledge-database]
  resources: [workload.yaml, auth.sops.yaml]
- name: knowledge-redis
  path: redis
  dependsOn: [knowledge-migration, redis]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowledge-rabbitmq
  path: rabbitmq
  dependsOn: [knowledge-redis, rabbitmq]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowledge-identity
  path: identity
  dependsOn: [knowledge-rabbitmq, casdoor]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowledge-runtime
  path: runtime
  dependsOn: '{{ ["knowledge-identity"] + (["knowledge-provider", "ragflow-runtime"] if knowledge_backend_deployment.knowledge_provider.enabled | default(false) else []) + (["info-service-identity", "investment-service-identity"] if knowledge_backend_deployment.knowledge_service_receiver.enabled | default(false) else []) }}'
  resources: '{{ ["workload.yaml", "tls.sops.yaml"] + (["storage.sops.yaml"] if knowledge_backend_deployment.object_storage.enabled | default(false) else []) + (["provider.sops.yaml"] if knowledge_backend_deployment.knowledge_provider.enabled | default(false) else []) + (["service.sops.yaml"] if knowledge_backend_deployment.knowledge_service.enabled | default(false) else []) + (["domain.sops.yaml"] if knowledge_backend_deployment.domain_secrets | default({}) | length > 0 else []) }}'
- name: knowledge-provider
  path: provider
  dependsOn: [info-storage, ragflow-runtime]
  enabled: '{{ knowledge_deployment.enabled and knowledge_backend_deployment.knowledge_provider.enabled | default(false) }}'
  resources: [workload.yaml, provision.sops.yaml]
