# =============================================================================
# Logstash Secrets 部署配置
# 文件名: deploy-secrets-all.conf
# 用途: 配置Logstash所有Secret的部署参数
# =============================================================================

# =============================================================================
# Secret 组件启用和优先级配置
# =============================================================================

# Harbor Registry Secret（镜像拉取）
harbor_registry_secret_enabled="true"
harbor_registry_secret_priority="1000"

# Logstash Elasticsearch Secret（连接 Elasticsearch）
logstash_elasticsearch_secret_enabled="true"
logstash_elasticsearch_secret_priority="800"

