# =============================================================================
# Traefik Secrets 统一部署配置
# 文件名: deploy-secrets-all.conf
# 用途: 配置所有 Traefik Secrets 子组件的部署参数
# =============================================================================

# =============================================================================
# 子组件启用控制
# =============================================================================
# 控制各个 Secrets 子组件是否启用
# true: 启用，false: 禁用
traefik_tls_secret_enabled="${traefik_tls_secret_enabled:-true}"

# =============================================================================
# 子组件优先级控制
# =============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 注意：TLS Secret 应该在 Traefik 部署之前完成
traefik_tls_secret_priority="${traefik_tls_secret_priority:-2000}"

