apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-app-ssr-config
  namespace: ${NAMESPACE}
  labels:
    app: auth-app-ssr
data:
  # 服务器与域名
  SERVER_NAME: "auth-app-ssr.sunmoonai.com"
  SERVER_HOST: "https://auth-app-ssr.sunmoonai.com"

  # Nuxt SSR 运行配置（非敏感）
  NODE_ENV: "production"
  APP_ENV: "production"
  NITRO_HOST: "0.0.0.0"
  NITRO_PORT: "3000"
  NUXT_TELEMETRY_DISABLED: "1"

  # 后端 API 地址（按需调整）
  BACKEND_API_URL: "http://backend-bff.app-platform-dev"  # 请按实际后端服务修改

