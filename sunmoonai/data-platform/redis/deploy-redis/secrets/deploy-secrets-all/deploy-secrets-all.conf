# ============================================================================
# Secrets All 部署配置
# ============================================================================

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制
# ============================================================================
C1_redis_auth_secret_enabled="true"
C1_harbor_registry_secret_enabled="false"
C1_redis_myapp_secret_enabled="true"
C1_redis_llmopsservice_secret_enabled="true"  # 是否部署 LLMOps Service Redis 连接密钥

# ============================================================================
# 部署优先级控制
# ============================================================================
C1_redis_auth_secret_priority=1000
C1_harbor_registry_secret_priority=800
C1_redis_myapp_secret_priority=600
C1_redis_llmopsservice_secret_priority=500  # LLMOps Service Redis 连接密钥优先级中等
