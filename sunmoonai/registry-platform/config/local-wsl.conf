# shellcheck shell=bash disable=SC2034
# Shared local registry settings. Installation and entry cutover are separate actions.
REGISTRY_VERSION=2.13.2
REGISTRY_ADDRESS=harbor.sunmoonai.com:30443
REGISTRY_TRANSPORT=local
REGISTRY_CLIENT_ADDRESS=127.0.0.1
REGISTRY_DATA_ROOT=/data/harbor
REGISTRY_INSTALL_ROOT=/opt/sunmoon/registry/harbor-2.13.2
# Immutable certificate batch; setting references does not deploy or restart services.
REGISTRY_TLS_BATCH="${REGISTRY_TLS_BATCH:-${HOME}/private/registry-platform/tls-20260927-five-year}"
REGISTRY_CA_FILE="${REGISTRY_CA_FILE:-${REGISTRY_TLS_BATCH}/ca.crt}"
REGISTRY_CA_SHA256="${REGISTRY_CA_SHA256:-30fe0e56df354899ccf7e66d5d730b87946b8010db21852a2e4520997a51b0ec}"
REGISTRY_TLS_CERT_FILE="${REGISTRY_TLS_BATCH}/harbor/tls.crt"
REGISTRY_TLS_KEY_FILE="${REGISTRY_TLS_BATCH}/harbor/tls.key"
REGISTRY_TLS_BUNDLE_FILE="${REGISTRY_TLS_BATCH}/ingress-bundle.json"
REGISTRY_BIND_ADDRESS=127.0.0.1
REGISTRY_HTTPS_PORT=18443
REGISTRY_LOCAL_SNI_PROXY=true
