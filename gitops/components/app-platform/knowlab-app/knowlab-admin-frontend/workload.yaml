apiVersion: apps/v1
kind: Deployment
metadata: {name: knowlab-admin, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowlab-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: knowlab-admin, app.kubernetes.io/part-of: knowlab}
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowlab-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: harbor.sunmoonai.com:30443/platform/knowlab-admin-frontend@sha256:f9e5a1f0e8bfa38679db4c07cc86ff5591f6df8b58cea2de548fc0b0ca326669
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: DEPLOYMENT_ENV, value: production}
            - {name: AUTH_APP, value: knowlab}
            - {name: APP_ORIGIN, value: "https://knowlab-admin.sunmoonai.com:30443"}
            - {name: BACKEND_INTERNAL_URL, value: 'http://knowlab-api.app-platform-dev.svc.cluster.local:8000'}
            - {name: DEPLOYMENT_ID, value: "knowlab-admin-frontend-f9e5a1f0e8bfa386"}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: '3000'}
            - {name: REFERENCE_UI_ENABLED, value: 'false'}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: cache, mountPath: /app/.next/cache}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}, {name: cache, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: knowlab-admin, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowlab-admin}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowlab-admin, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-admin}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-api}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowlab-admin
  namespace: app-platform-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: sunmoon
  tls: [{hosts: [knowlab-admin.sunmoonai.com], secretName: knowlab-tls}]
  rules:
    - host: knowlab-admin.sunmoonai.com
      http:
        paths:
          # 内部接口不经公网：转给前端，前端没有这个页面，回 404（审读第 1 条；后端另按地址拦）
          - path: /api/internal
            pathType: Prefix
            backend: {service: {name: knowlab-admin, port: {number: 3000}}}
          - path: /api
            pathType: Prefix
            backend: {service: {name: knowlab-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: knowlab-admin, port: {number: 3000}}}
