apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: investment-web-backend-rate-limit
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: app-platform-ingress
    component: investment-web-backend
    middleware-type: rate-limit
spec:
  rateLimit:
    average: ${RATE_LIMIT_AVERAGE:-100}
    burst: ${RATE_LIMIT_BURST:-200}
    period: ${RATE_LIMIT_PERIOD:-1}s
