# ============================================================================
# Casdoor 部署配置
# ============================================================================

# 基础配置
CASDOOR_PROJECT_ID="${CASDOOR_PROJECT_ID:-sunmoonai}"
CASDOOR_NAMESPACE="${CASDOOR_NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# ============================================================================
# 镜像仓库配置
# ============================================================================
CASDOOR_IMAGE_REGISTRY="${CASDOOR_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
CASDOOR_IMAGE_PROJECT="${CASDOOR_IMAGE_PROJECT:-k8s-images}"

# ============================================================================
# 部署模式配置
# ============================================================================
DEPLOYMENT_MODE="${DEPLOYMENT_MODE:-online}"
ENABLE_OFFLINE_IMAGE_CHECK="${ENABLE_OFFLINE_IMAGE_CHECK:-false}"
CASDOOR_FORCE_OFFLINE="${CASDOOR_FORCE_OFFLINE:-false}"

# ============================================================================
# 镜像版本（推送到 Harbor 时使用）
# ============================================================================
# casbin/casdoor:latest 或具体版本如 v1.785.0
CASDOOR_IMAGE_VERSION="${CASDOOR_IMAGE_VERSION:-latest}"

# ============================================================================
# 访问配置
# ============================================================================
CASDOOR_UNIFIED_HOST="${CASDOOR_UNIFIED_HOST:-casdoor.sunmoonai.com}"
CASDOOR_SERVICE_PORT="${CASDOOR_SERVICE_PORT:-8000}"

# ============================================================================
# 多集群配置（可选，用于 --cluster C1/C2）
# ============================================================================
# C1_CASDOOR_NAMESPACE="app-platform-dev"
# C2_CASDOOR_NAMESPACE="app-platform-dev"

# ============================================================================
# 子级部署控制
# ============================================================================
secrets_enabled="${secrets_enabled:-true}"
ingress_enabled="${ingress_enabled:-true}"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# ============================================================================
secrets_priority=1000
ingress_priority=100
