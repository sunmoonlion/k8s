# ============================================================================
# info-admin-frontend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/info-admin-frontend.yaml"
OUTPUT_FILE="info-admin-frontend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
INFO_ADMIN_FRONTEND_IMAGE_REGISTRY="${INFO_ADMIN_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_INFO_ADMIN_FRONTEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INFO_ADMIN_FRONTEND_IMAGE_PROJECT="${INFO_ADMIN_FRONTEND_IMAGE_PROJECT:-app-images}"
INFO_ADMIN_FRONTEND_IMAGE="${INFO_ADMIN_FRONTEND_IMAGE:-info-admin-frontend}"
INFO_ADMIN_FRONTEND_TAG="${INFO_ADMIN_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
INFO_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME="${INFO_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
INFO_ADMIN_FRONTEND_SECRET_NAME="${INFO_ADMIN_FRONTEND_SECRET_NAME:-info-admin-frontend-secret}"
INFO_ADMIN_FRONTEND_CONFIGMAP_NAME="${INFO_ADMIN_FRONTEND_CONFIGMAP_NAME:-info-admin-frontend-config}"
INFO_ADMIN_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME="${INFO_ADMIN_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME-}"
INFO_ADMIN_FRONTEND_OBJECT_STORAGE_SECRET_NAME="${INFO_ADMIN_FRONTEND_OBJECT_STORAGE_SECRET_NAME-}"
INFO_ADMIN_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME="${INFO_ADMIN_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME-}"
INFO_ADMIN_FRONTEND_ELASTICSEARCH_SECRET_NAME="${INFO_ADMIN_FRONTEND_ELASTICSEARCH_SECRET_NAME-}"
INFO_ADMIN_FRONTEND_POSTGRESQL_SECRET_NAME="${INFO_ADMIN_FRONTEND_POSTGRESQL_SECRET_NAME-}"
INFO_ADMIN_FRONTEND_REDIS_SECRET_NAME="${INFO_ADMIN_FRONTEND_REDIS_SECRET_NAME-}"
INFO_ADMIN_FRONTEND_MONGODB_SECRET_NAME="${INFO_ADMIN_FRONTEND_MONGODB_SECRET_NAME-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-info-admin-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
