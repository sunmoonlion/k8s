apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-admin-frontend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: knowledge-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-admin-frontend
  template:
    metadata:
      labels:
        app: knowledge-admin-frontend
    spec:
      imagePullSecrets:
      - name: ${KNOWLEDGE_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: knowledge-admin-frontend
        image: ${KNOWLEDGE_ADMIN_FRONTEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: ${PVC_MOUNT_PATH:-/app/data}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ${PVC_NAME:-knowledge-admin-frontend-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-admin-frontend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: knowledge-admin-frontend
spec:
  selector:
    app: knowledge-admin-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
