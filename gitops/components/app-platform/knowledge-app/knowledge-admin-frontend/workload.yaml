apiVersion: apps/v1
kind: Deployment
metadata: {name: knowledge-admin, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowledge-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: knowledge-admin, app.kubernetes.io/part-of: knowledge}
    spec:
      serviceAccountName: knowledge-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: harbor.sunmoonai.com:30443/platform/knowledge-admin-frontend@sha256:b4c23cdcd7e00f39e84402022458c6bdbf4d1fae1c9f4ec703d112c2b4d506c5
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: DEPLOYMENT_ENV, value: production}
            - {name: AUTH_APP, value: knowledge}
            - {name: APP_ORIGIN, value: "https://knowledge-admin.sunmoonai.com:30443"}
            - {name: BACKEND_INTERNAL_URL, value: 'http://knowledge-api.app-platform-dev.svc.cluster.local:8000'}
            - {name: DEPLOYMENT_ID, value: "knowledge-admin-frontend-b4c23cdcd7e00f39"}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: '3000'}
            - {name: REFERENCE_UI_ENABLED, value: 'false'}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: cache, mountPath: /app/.next/cache}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}, {name: cache, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: knowledge-admin, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowledge-admin}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowledge-admin, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-admin}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowledge-api}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-admin
  namespace: app-platform-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: sunmoon
  tls: [{hosts: [knowledge-admin.sunmoonai.com], secretName: knowledge-tls}]
  rules:
    - host: knowledge-admin.sunmoonai.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: knowledge-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: knowledge-admin, port: {number: 3000}}}
