# Redis 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
REDIS_PROJECT_ID="sunmoonai"
REDIS_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
REDIS_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
REDIS_IMAGE_PROJECT="k8s-images"                     # 镜像项目名

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# REDIS_FORCE_OFFLINE="true"          # 离线模式：强制离线部署

# 访问与端口配置
REDIS_EXTERNAL_HOST="llmops.sunmoonai.com"  # Redis访问域名（使用微服务统一域名，通过端口30446区分）
# REDIS_EXTERNAL_PORT 将从 Traefik Service 中动态获取（通过 get_redis_external_port 函数）
# 如果未设置，脚本会自动从 Traefik Service 的 NodePort 中获取
# REDIS_EXTERNAL_PORT="${REDIS_EXTERNAL_PORT:-$(get_redis_external_port)}"
REDIS_TLS_ENABLED="false"                     # Redis通常不需要TLS

# Redis Secret 配置
REDIS_AUTH_SECRET_NAME="redis-secrets"                    # Redis 认证 Secret 名称
REDIS_AUTH_SECRET_PASSWORD_KEY="redis-password"          # Redis 认证 Secret 密码键名
REDIS_DATABASE_SECRET_NAME="redis-database-secrets"      # Redis 数据库 Secret 名称

# 是否在部署 Redis 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 Redis 可能会形成自依赖循环（部署 Redis 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：Redis 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
REDIS_FORCE_OFFLINE="false"

# 镜像版本配置（来源：resources/redis/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，Redis Chart会自动使用最新版本的镜像
# bitnami/redis:8.2.1-debian-12-r0
REDIS_IMAGE_VERSION="8.2.1-debian-12-r0"
# bitnami/redis-exporter:1.76.0-debian-12-r0
REDIS_METRICS_IMAGE_VERSION="1.76.0-debian-12-r0"
# bitnami/redis-sentinel:8.2.1-debian-12-r0
REDIS_SENTINEL_IMAGE_VERSION="8.2.1-debian-12-r0"
# bitnami/os-shell:12-debian-12-r51
REDIS_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"          # 是否部署密钥管理

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等
secrets_priority=10           # 密钥管理优先级最低（最后部署）

# =========================================================================
# 部署前镜像推送控制
# =========================================================================
# 是否在部署前推送镜像到 Harbor（默认：false，不推送）
# 说明：
#   - true: 部署前自动推送镜像到 Harbor（适用于离线部署或需要确保镜像在仓库中的场景）
#   - false: 跳过镜像推送（适用于镜像已在仓库中或通过其他方式管理的场景）
#   注意：在线模式下，如果镜像已在仓库中，通常不需要推送
PUSH_IMAGES_BEFORE_DEPLOY="false"

# =========================================================================
# 推送后清理远程 tar 包开关（按组件）
# =========================================================================
# 说明：控制推送镜像完成后是否删除远程节点上的 tar 文件
#   - true: 推送完成后删除远程 tar 文件（节省空间）
#   - false: 保留远程 tar 文件（用于后续复用或排障）
#
# 配置优先级：
#   1. 组件配置（本配置项）：CLEANUP_REMOTE_TAR_AFTER_DEPLOY
#      - 当组件脚本调用 loadimage.sh 时，此配置会覆盖 loadimage.conf 中的配置
#      - 优先级：最高（组件特定配置）
#   2. 通用配置（loadimage.conf）：CLEANUP_REMOTE_TAR_AFTER_PUSH
#      - 单独调用 loadimage.sh 或 registry-push-menu.sh 时使用
#      - 优先级：较低（通用默认配置）
#
# 使用场景：
#   - 组件调用：使用本配置项的值（CLEANUP_REMOTE_TAR_AFTER_DEPLOY）
#   - 单独调用：使用 loadimage.conf 中的值（CLEANUP_REMOTE_TAR_AFTER_PUSH）
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"
