apiVersion: v1
kind: ConfigMap
metadata: {name: investment-agent-releases-policy-v1, namespace: data-platform-dev}
data:
  reader.json: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::agent-releases/*"]}]}
  writer.json: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::agent-releases/*"]}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: investment-agent-releases-v1, namespace: data-platform-dev}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: investment-agent-releases-provision, sunmoonai.com/object-storage-client: 'true'}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: harbor.sunmoonai.com:30443/platform/aistor-mc@sha256:d108717a4a6d684586f392406caca8d57f94d9e5acb515db61bca2da72d6f2ba
          command: [/bin/sh, -ec]
          args:
            - |
              umask 0077
              mkdir -p /work/client/certs/CAs
              cp /run/auth/config.json /work/client/config.json
              cp /run/auth/ca.crt /work/client/certs/CAs/platform.crt
              mc() {
                /usr/bin/mc --config-dir /work/client --json "$@" >/work/result.json 2>/work/error.log || return 1
                case "$(cat /work/result.json)" in
                  *'"status": "error"'*|*'"status":"error"'*) return 1 ;;
                esac
              }
              mc mb --ignore-existing owned/agent-releases
              mc anonymous set none owned/agent-releases
              mc version enable owned/agent-releases
              for role in reader writer; do
                user="$(cat /run/auth/$role-user)"
                if ! mc admin user info owned "$user"; then
                  { cat /run/auth/$role-user; printf '\n'; cat /run/auth/$role-password; printf '\n'; } | mc admin user add owned
                fi
                mc admin policy create owned "investment-agent-releases-$role" "/run/policy/$role.json"
                mc admin policy attach owned "investment-agent-releases-$role" --user "$user"
              done
              printf '{"bucket":"agent-releases","private":true,"versioned":true,"identities_created":true,"runtime_permission_checks":"pending upload acceptance"}\n'
          env: [{name: HOME, value: /work}, {name: NO_PROXY, value: '*'}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: policy, mountPath: /run/policy, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - {name: auth, secret: {secretName: investment-agent-releases-provision, defaultMode: 0440}}
        - {name: policy, configMap: {name: investment-agent-releases-policy-v1}}
        - {name: work, emptyDir: {sizeLimit: 16Mi}}
