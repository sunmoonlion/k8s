# LLMOps Service API 路由配置 (Traefik IngressRoute)
# 路径前缀：/api/v1 → 后端服务端口 80
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# https://<节点IP>:30443/api/v1
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# https://llmops.sunmoonai.com/api/v1
#
# 注意：只需在 /etc/hosts 中添加一条记录即可访问所有服务
# 示例：101.126.151.0  llmops.sunmoonai.com
#
---
# Middleware: 路径前缀剥离
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llmops-app-bff-stripprefix
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-app-bff
spec:
  stripPrefix:
    prefixes:
      - "/api/v1"
---
# IngressRoute: HTTP 路由
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llmops-app-bff-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-app-bff
spec:
  entryPoints:
    - websecure
  routes:
    # ========================================================================
    # 为什么不能只用一个 Path(`/`) 路径匹配所有请求？
    # ========================================================================
    # 
    # 原因分析：
    # 
    # 1. FastAPI 路由注册方式：
    #    - app.include_router(api_router, prefix='/api/v1')
    #    - 所有业务路由都在 /api/v1 前缀下，例如：/api/v1/apps/ping
    #    - 文档路由在根路径：/docs, /redoc, /api/v1/openapi.json
    #
    # 2. 如果只用 Path(`/`) 匹配所有请求：
    #    - ✅ /docs → 后端收到 /docs → FastAPI 有 /docs 路由 → 可以工作
    #    - ✅ /api/v1/apps/ping → 后端收到 /api/v1/apps/ping → FastAPI 有 /api/v1/apps/ping 路由 → 可以工作
    #    - ❌ 但无法区分哪些路径需要 stripPrefix，哪些不需要
    #    - ❌ 如果未来需要 stripPrefix（例如后端路由改为 /apps/ping），就无法实现
    #    - ❌ 路由匹配不够精确，可能影响性能
    #
    # 3. 当前配置使用 stripPrefix 的原因：
    #    - 虽然 FastAPI 路由有 /api/v1 前缀，但 stripPrefix 可能是为了：
    #      a) 未来扩展性：如果后端路由改为无前缀，可以无缝切换
    #      b) 统一管理：所有 /api/v1/* 路径统一处理
    #    - 注意：如果 stripPrefix 导致 404，可能需要移除 stripPrefix
    #
    # 4. 所以需要分开定义：
    #    - 精确匹配 /docs, /redoc, /（不走 stripPrefix，因为它们在根路径）
    #    - 精确匹配 /api/v1/openapi.json（不走 stripPrefix，因为 FastAPI 配置的是完整路径）
    #    - 前缀匹配 /api/v1/*（走 stripPrefix，但需要注意后端路由是否有 /api/v1 前缀）
    #      * 如果后端路由有 /api/v1 前缀 → 不应该使用 stripPrefix（会导致 404）
    #      * 如果后端路由没有 /api/v1 前缀 → 应该使用 stripPrefix（才能匹配）
    #
    # 总结：分开定义可以让路由匹配更精确，也便于未来扩展和维护
    # ========================================================================
    
    # 使用节点 IP 访问 - 文档路径（精确匹配，优先级高，不需要 stripPrefix）
    # 注意：这些路径在 FastAPI 的根路径，不需要 stripPrefix
    - match: Host(`{{NODE_IP}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用节点 IP 访问 - OpenAPI JSON（精确匹配，不使用 stripPrefix）
    # 注意：FastAPI 的 openapi_url 配置为 /api/v1/openapi.json（完整路径）
    # 如果走 stripPrefix，后端收到 /openapi.json，但 FastAPI 期望 /api/v1/openapi.json
    # 所以需要精确匹配，不使用 stripPrefix
    - match: Host(`{{NODE_IP}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用节点 IP 访问 - API 路径（需要 stripPrefix）
    # 
    # ⚠️ 重要：后端路由有或没有 /api/v1 前缀的影响
    # 
    # 情况1：后端路由有 /api/v1 前缀（当前情况）
    #   - FastAPI: app.include_router(api_router, prefix='/api/v1')
    #   - 路由注册为：/api/v1/apps/ping
    #   - 如果使用 stripPrefix：
    #     * 外部请求：/api/v1/apps/ping
    #     * stripPrefix 后：/apps/ping
    #     * 后端收到：/apps/ping
    #     * FastAPI 路由：/api/v1/apps/ping
    #     * 结果：404 ❌（路径不匹配）
    #   - 如果不使用 stripPrefix：
    #     * 外部请求：/api/v1/apps/ping
    #     * 后端收到：/api/v1/apps/ping
    #     * FastAPI 路由：/api/v1/apps/ping
    #     * 结果：200 ✅（路径匹配）
    # 
    # 情况2：后端路由没有 /api/v1 前缀
    #   - FastAPI: app.include_router(api_router, prefix='/')
    #   - 路由注册为：/apps/ping
    #   - 如果使用 stripPrefix：
    #     * 外部请求：/api/v1/apps/ping
    #     * stripPrefix 后：/apps/ping
    #     * 后端收到：/apps/ping
    #     * FastAPI 路由：/apps/ping
    #     * 结果：200 ✅（路径匹配）
    #   - 如果不使用 stripPrefix：
    #     * 外部请求：/api/v1/apps/ping
    #     * 后端收到：/api/v1/apps/ping
    #     * FastAPI 路由：/apps/ping
    #     * 结果：404 ❌（路径不匹配）
    # 
    # 当前配置分析：
    #   - 从 main.py 看：app.include_router(api_router, prefix='/api/v1')
    #   - 这意味着后端路由有 /api/v1 前缀
    #   - 如果使用 stripPrefix，会导致 404
    #   - 建议：移除 stripPrefix，让后端直接处理 /api/v1/* 路径
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: llmops-app-bff-stripprefix
    # 使用统一域名访问 - 文档路径（精确匹配，优先级高，不需要 stripPrefix）
    # 说明：同上面的节点 IP 访问配置，只是 Host 不同
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用统一域名访问 - OpenAPI JSON（精确匹配，不使用 stripPrefix）
    # 说明：同上面的节点 IP 访问配置，只是 Host 不同
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用统一域名访问 - API 路径（需要 stripPrefix）
    # 说明：同上面的节点 IP 访问配置，只是 Host 不同
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: llmops-app-bff-stripprefix
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: ingress-platform-dev/traefik-tls-secret
