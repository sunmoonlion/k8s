---
# Shared operator credentials for the core services (PostgreSQL, Redis, RabbitMQ, Casdoor).
# Read once per run into memory as service_credentials; every consumer prepare includes this file.
- name: Read and preserve the shared core identities once
  when: service_credentials is not defined
  block:
    - name: Read private operator inputs
      ansible.builtin.slurp: {src: '{{ services_config_dir }}/credentials.yaml'}
      register: credential_input
      no_log: true
    - name: Decode credentials in memory
      ansible.builtin.set_fact:
        service_credentials: '{{ (credential_input.content | b64decode | from_yaml).service_credentials }}'
      no_log: true
    - name: Validate credential fields without disclosing values
      ansible.builtin.assert:
        quiet: true
        that:
          - service_credentials[item] is string
          - service_credentials[item] | length > 0
          - service_credentials[item] is not search('[\r\n]')
      loop: [postgresql_password, redis_password, rabbitmq_username, rabbitmq_password, rabbitmq_cookie, casdoor_db_password, casdoor_admin_password, casdoor_application_secret]
      no_log: true
    - name: Preserve a non-overwritten independent credential backup
      ansible.builtin.copy:
        src: '{{ services_config_dir }}/credentials.yaml'
        dest: '{{ services_backup_dir }}/credentials.yaml'
        remote_src: true
        force: false
        mode: '0600'
      no_log: true
    - name: Require matching credential backup before rendering
      ansible.builtin.command: {argv: [cmp, --silent, '{{ services_config_dir }}/credentials.yaml', '{{ services_backup_dir }}/credentials.yaml']}
      changed_when: false
      no_log: true
