# ============================================================================
# LLMOps App BFF PVC 部署配置
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：PVC 的数据内容在 generate-llmops-bff-pvc.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
llmops_bff_pvc_enabled="${llmops_bff_pvc_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
# PVC 应该在应用之前部署
llmops_bff_pvc_priority="${llmops_bff_pvc_priority:-2100}"

# 组件描述（用于日志输出）
llmops_bff_pvc_description="${llmops_bff_pvc_description:-LLMOps App BFF PVC}"
