---
- name: Set archive and target names from the immutable lock
  ansible.builtin.set_fact:
    archive_path: '{{ image_directory }}/{{ controller.id }}-{{ controller.manifest_digest[7:] }}.tar'
    target: '{{ registry_address }}/platform/{{ controller.id }}'
- name: Inspect cached archive without following links
  ansible.builtin.stat:
    path: '{{ archive_path }}'
    follow: false
    get_checksum: false
  register: cached
- name: Refuse an unsafe existing archive
  ansible.builtin.assert:
    quiet: true
    that:
      - not cached.stat.exists or cached.stat.isreg | default(false)
      - not cached.stat.islnk | default(false)
      - flux_material_action == 'prepare' or cached.stat.exists
- name: Download only missing archives without Docker unpacking
  when: flux_material_action == 'prepare' and not cached.stat.exists
  block:
    - name: Allocate this transfer's output directory
      ansible.builtin.tempfile:
        state: directory
        path: '{{ image_directory }}'
        prefix: .flux-transfer-
      register: transfer
    - name: Download, validate and publish atomically
      block:
        - name: Copy locked upstream compressed content with bounded retries
          environment:
            HTTP_PROXY: '{{ lookup("ansible.builtin.env", "HTTP_PROXY") }}'
            HTTPS_PROXY: '{{ lookup("ansible.builtin.env", "HTTPS_PROXY") }}'
            ALL_PROXY: '{{ lookup("ansible.builtin.env", "ALL_PROXY") }}'
            NO_PROXY: '{{ lookup("ansible.builtin.env", "NO_PROXY") }}'
          ansible.builtin.command:
            argv: [timeout, '600', docker, run, --rm, --pull=never, --network=host, --read-only, --cap-drop=ALL, '--security-opt=no-new-privileges:true', --env, HTTP_PROXY, --env, HTTPS_PROXY, --env, ALL_PROXY, --env, NO_PROXY, --mount, 'type=bind,source={{ transfer.path }},target=/var/tmp', --mount, 'type=bind,source={{ transfer.path }},target=/output', '{{ skopeo.manifest_digest }}', copy, --retry-times, '2', --preserve-digests, 'docker://{{ controller.reference }}', 'oci-archive:/output/image.tar']
          changed_when: true
        - name: Verify every manifest, config and layer before publication
          ansible.builtin.command:
            argv: [python3, '{{ verifier }}', '{{ transfer.path }}/image.tar', --expected-manifest, '{{ controller.manifest_digest }}']
          changed_when: false
        - name: Publish this verified archive without overwriting an existing file
          ansible.builtin.command:
            argv: [ln, --no-target-directory, '--', '{{ transfer.path }}/image.tar', '{{ archive_path }}']
          changed_when: true
        - name: Make public upstream content readable by restricted clients
          ansible.builtin.file:
            path: '{{ archive_path }}'
            mode: '0644'
      always:
        - name: Remove only this transfer directory
          ansible.builtin.file:
            path: '{{ transfer.path }}'
            state: absent
- name: Verify complete cached OCI content against the source lock
  ansible.builtin.command:
    argv: [python3, '{{ verifier }}', '{{ archive_path }}', --expected-manifest, '{{ controller.manifest_digest }}']
  register: verified
  changed_when: false
- name: Hash the archive envelope for inventory
  ansible.builtin.stat:
    path: '{{ archive_path }}'
    follow: false
    checksum_algorithm: sha256
  register: envelope
- name: Record the archive identity separately from its OCI manifest
  ansible.builtin.copy:
    dest: '{{ archive_path }}.json'
    mode: '0644'
    content: '{{ {"id": controller.id, "source": controller.reference, "sha256": envelope.stat.checksum, "size_bytes": envelope.stat.size, "verification": verified.stdout | from_json} | to_nice_json }}'
  when: flux_material_action == 'prepare'
- name: Publish through the trusted formal Harbor endpoint
  when: flux_material_action == 'publish'
  block:
    - name: Read existing destination tag using publisher identity
      ansible.builtin.command:
        argv: '{{ local_client + [skopeo.manifest_digest, "inspect", "--raw", "--authfile", "/publisher.json", "--cert-dir", "/certs", "docker://" + target + ":" + controller.source.rsplit(":", 1)[1]] }}'
      register: remote_tag
      changed_when: false
      failed_when: false
    - name: Refuse authentication failures or a tag pointing at different content
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            remote_tag.rc == 0 or 'manifest unknown' in remote_tag.stderr | lower or
            'name unknown' in remote_tag.stderr | lower or
            ('unknown: repository platform/' + controller.id + ' not found') in remote_tag.stderr | lower or
            ('unknown: artifact platform/' + controller.id + ':' + controller.source.rsplit(':', 1)[1] + ' not found') in remote_tag.stderr | lower
          - remote_tag.rc != 0 or 'sha256:' + (remote_tag.stdout | hash('sha256')) == controller.manifest_digest
        fail_msg: '{{ remote_tag.stderr }}'
    - name: Publish exact content only when destination tag is absent
      ansible.builtin.command:
        argv: '{{ local_client + ["--mount", "type=bind,source=" + archive_path + ",target=/source.tar,readonly", skopeo.manifest_digest, "copy", "--preserve-digests", "--dest-authfile", "/publisher.json", "--dest-cert-dir", "/certs", "oci-archive:/source.tar", "docker://" + target + ":" + controller.source.rsplit(":", 1)[1]] }}'
      changed_when: true
      when: remote_tag.rc != 0
    - name: Verify destination digest using the independent read-only identity
      ansible.builtin.command:
        argv: '{{ local_client + [skopeo.manifest_digest, "inspect", "--raw", "--authfile", "/puller.json", "--cert-dir", "/certs", "docker://" + target + "@" + controller.manifest_digest] }}'
      register: remote_manifest
      changed_when: false
      failed_when: remote_manifest.rc != 0 or 'sha256:' + (remote_manifest.stdout | hash('sha256')) != controller.manifest_digest
