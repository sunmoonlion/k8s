# ============================================================================
# Investment Admin Frontend ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

TEMPLATE_FILE="templates/configMap/investment-admin-frontend-config.yaml"
OUTPUT_FILE="investment-admin-frontend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# ConfigMap 数据内容（CSR 前端，nginx 托管静态文件）
# ============================================================================
# 环境标识
NODE_ENV="${NODE_ENV:-production}"

# 后端 API 地址（供前端 JS 在浏览器端调用）
VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://admin.investment.sunmoonai.com/api/v1}"

# Sentry 监控（可选）
SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT:-${ENVIRONMENT:-development}}"
