# Info Admin Frontend 路由配置 (Traefik IngressRoute)
# CSR SPA（Vue3 + Vite），nginx 静态服务，所有路由交给前端 Router 处理。
#
# 访问方式：
# - https://info-admin.sunmoonai.com/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-admin-frontend-ingress
  namespace: app-platform-dev
  labels:
    app: app-platform-ingress
    component: info-admin-frontend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`info-admin.sunmoonai.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: info-admin-frontend
          port: 80
