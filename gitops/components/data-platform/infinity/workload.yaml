---
apiVersion: v1
kind: ConfigMap
metadata: {name: infinity-settings, namespace: data-platform-dev}
data:
  infinity_conf.toml: |
    [general]
    version                  = "0.7.3"
    time_zone                = "utc-8"

    [network]
    server_address           = "0.0.0.0"
    postgres_port            = 5432
    http_port                = 23820
    client_port              = 23817
    connection_pool_size     = 128

    [log]
    log_filename             = "infinity.log"
    log_dir                  = "/var/infinity/log"
    log_to_stdout            = true
    log_file_max_size        = "100MB"
    log_file_rotate_count    = 10

    # trace/debug/info/warning/error/critical 6 log levels, default: info
    log_level               = "info"

    [storage]
    persistence_dir         = "/var/infinity/persistence"
    data_dir                = "/var/infinity/data"
    # periodically activates garbage collection:
    # 0 means real-time,
    # s means seconds, for example "60s", 60 seconds
    # m means minutes, for example "60m", 60 minutes
    # h means hours, for example "1h", 1 hour
    optimize_interval        = "10s"
    cleanup_interval         = "60s"
    compact_interval         = "120s"
    storage_type             = "local"

    # dump memory index entry when it reachs the capacity
    mem_index_capacity       = 65536

    # S3 storage config example:
    # [storage.object_storage]
    # url                      = "127.0.0.1:9000"
    # bucket_name              = "infinity"
    # access_key               = "minioadmin"
    # secret_key               = "minioadmin"
    # enable_https             = false

    [buffer]
    buffer_manager_size      = "1GB"
    lru_num                  = 7
    temp_dir                 = "/var/infinity/tmp"
    result_cache             = "off"
    memindex_memory_quota    = "256MB"

    [wal]
    wal_dir                       = "/var/infinity/wal"

    [resource]

---
apiVersion: v1
kind: Service
metadata: {name: infinity-headless, namespace: data-platform-dev}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: infinity}
  ports: [{name: service, port: 23817, targetPort: 23817}]
---
apiVersion: v1
kind: Service
metadata: {name: infinity, namespace: data-platform-dev}
spec:
  selector: {app.kubernetes.io/name: infinity}
  ports: [{name: service, port: 23817, targetPort: 23817}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: infinity, namespace: data-platform-dev}
spec:
  serviceName: infinity-headless
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: infinity}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: infinity, app.kubernetes.io/part-of: ragflow}

    spec:
      enableServiceLinks: false
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      nodeSelector: {kubernetes.io/hostname: 'sunmoon-kind-worker'}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: infinity
          image: harbor.sunmoonai.com:30443/platform/infinity@sha256:6640409359e6d515287d6255657ee78a86fdce996196fbb4d371a2e39243309f
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/infinity]
          args: [-f, /settings/infinity_conf.toml]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: service, containerPort: 23817}, {name: health, containerPort: 23820}]
          resources: {"requests": {"cpu": "250m", "memory": "1Gi"}, "limits": {"cpu": "2", "memory": "3Gi"}}
          startupProbe:
            httpGet: {path: /admin/node/current, port: health}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /admin/node/current, port: health}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: service}
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - {name: data, mountPath: /var/infinity}
            - {name: settings, mountPath: /settings, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: infinity-data}}

        - {name: settings, configMap: {name: infinity-settings}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: infinity-clients, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: infinity}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ragflow}}
      ports: [{protocol: TCP, port: 23817}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ragflow-infinity-egress, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ragflow}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: infinity}}
      ports: [{protocol: TCP, port: 23817}]
