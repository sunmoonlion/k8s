---
apiVersion: v1
kind: Service
metadata: {name: knowbase-api, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowbase-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbase-api-ingress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowbase-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbase-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbase-admin}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbase-api-casdoor-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowbase-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbase-api-casdoor-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbase-api}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbase-ragflow-egress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: knowbase, sunmoonai.com/ragflow-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: ragflow, app.kubernetes.io/component: api}}
      ports: [{protocol: TCP, port: 9380}]
---
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbase-service-https-out, namespace: app-platform-dev}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [knowbase-api]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 8443}]
