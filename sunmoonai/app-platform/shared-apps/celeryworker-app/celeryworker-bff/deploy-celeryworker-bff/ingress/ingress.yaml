# Celery Worker API 接口路由配置 (Traefik IngressRoute)
# Celery Worker API 接口端口：5555
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# http://<节点IP>:30443/api/v1/celeryworker
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# http://celeryworker.sunmoonai.com/api/v1/celeryworker
#
# 注意：只需在 /etc/hosts 中添加一条记录即可访问所有服务
# 示例：101.126.151.0  celeryworker.sunmoonai.com
#
---
# Middleware: 路径前缀剥离
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: celeryworker-multi-stripprefix
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: celeryworker-multi
spec:
  stripPrefix:
    prefixes:
      - "/api/v1/celeryworker"
---
# IngressRoute: HTTP 路由（Celery Worker API 接口）
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: celeryworker-multi-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: celeryworker-multi
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1/celeryworker`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: celeryworker-multi-stripprefix
    # 使用统一域名访问
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1/celeryworker`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: celeryworker-multi-stripprefix

