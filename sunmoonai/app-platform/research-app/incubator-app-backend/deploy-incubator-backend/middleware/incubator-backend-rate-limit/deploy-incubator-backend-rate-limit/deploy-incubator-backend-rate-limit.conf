# ============================================================================
# Incubator App BFF Rate Limit Middleware 部署配置
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：Rate Limit Middleware 的数据内容在 generate-incubator-backend-rate-limit.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 基础配置（默认值，可通过主配置或命令行参数覆盖）
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
incubator_bff_rate_limit_enabled="${incubator_bff_rate_limit_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
# Rate Limit Middleware 应该在 Ingress 之前部署
incubator_bff_rate_limit_priority="${incubator_bff_rate_limit_priority:-150}"

# 组件描述（用于日志输出）
incubator_bff_rate_limit_description="${incubator_bff_rate_limit_description:-Incubator App BFF Rate Limit Middleware}"
