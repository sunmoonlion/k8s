# ============================================================================
# tools-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/tools-web-backend.yaml"
OUTPUT_FILE="tools-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
TOOLS_WEB_BACKEND_IMAGE_REGISTRY="${TOOLS_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_TOOLS_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
TOOLS_WEB_BACKEND_IMAGE_PROJECT="${TOOLS_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
TOOLS_WEB_BACKEND_IMAGE="${TOOLS_WEB_BACKEND_IMAGE:-tools-web-backend}"
TOOLS_WEB_BACKEND_TAG="${TOOLS_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
TOOLS_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${TOOLS_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
TOOLS_WEB_BACKEND_SECRET_NAME="${TOOLS_WEB_BACKEND_SECRET_NAME:-tools-web-backend-secret}"
TOOLS_WEB_BACKEND_CONFIGMAP_NAME="${TOOLS_WEB_BACKEND_CONFIGMAP_NAME:-tools-web-backend-config}"
TOOLS_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${TOOLS_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-tools-web-backend-s3}"
TOOLS_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME="${TOOLS_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME:-tools-web-backend-s3}"
TOOLS_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${TOOLS_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-tools-web-backend-elasticsearch}"
TOOLS_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME="${TOOLS_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME:-tools-web-backend-elasticsearch}"
TOOLS_WEB_BACKEND_POSTGRESQL_SECRET_NAME="${TOOLS_WEB_BACKEND_POSTGRESQL_SECRET_NAME:-tools-web-backend-postgresql-conn}"
TOOLS_WEB_BACKEND_REDIS_SECRET_NAME="${TOOLS_WEB_BACKEND_REDIS_SECRET_NAME:-tools-web-backend-redis-conn}"
TOOLS_WEB_BACKEND_MONGODB_SECRET_NAME="${TOOLS_WEB_BACKEND_MONGODB_SECRET_NAME:-tools-web-backend-mongodb-conn}"

# PVC 配置
PVC_NAME="${PVC_NAME:-tools-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
