# ============================================================================
# Incubator App BFF Secrets All 部署配置
# ============================================================================

# 基础配置
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# ============================================================================
# 组件开关与优先级控制
# ============================================================================
# 控制是否部署各个 Secrets/ConfigMap 组件
# 优先级：数值越大优先级越高（越先部署）

# BFF Secret（敏感配置）
incubator_bff_secret_enabled="${incubator_bff_secret_enabled:-true}"
incubator_bff_secret_priority="${incubator_bff_secret_priority:-600}"

# BFF ConfigMap（非敏感配置）
incubator_bff_config_enabled="${incubator_bff_config_enabled:-true}"
incubator_bff_config_priority="${incubator_bff_config_priority:-500}"

