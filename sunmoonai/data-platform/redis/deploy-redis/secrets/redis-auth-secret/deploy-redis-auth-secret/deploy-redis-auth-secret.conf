# =============================================================================
# Redis Auth Secret 部署配置
# 文件名: deploy-redis-auth-secret.conf
# 用途: 配置Redis认证Secret的生成和部署参数
# 说明: Bitnami Redis Chart要求Secret键名使用破折号（redis-password）
#       配置中使用下划线变量名，脚本会自动转换为破折号键名
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="redis-auth-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（Redis Chart要求键名使用破折号）
# =============================================================================
# 注意：变量名使用下划线，脚本会自动转换为破折号键名
# 例如：redis_password -> redis-password

# Redis密码（必需）
redis_password="Re!d1359admin"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

