# toutiao-app-front Ingress YAML 生成配置
TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="toutiao-app-front-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

SERVICE_NAME="${SERVICE_NAME:-toutiao-app-front}"
SERVICE_PORT="${SERVICE_PORT:-3000}"
UNIFIED_HOST="${UNIFIED_HOST:-toutiao.sunmoonai.com}"
NODE_IP="${NODE_IP:-115.190.153.150}"
