---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-api-ingress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-admin}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-api-casdoor-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowbench-api-casdoor-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowbench-api}}
      ports: [{protocol: TCP, port: 8000}]
