apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-admin-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: knowledge-admin-backend
data:
  RAGFLOW_API_BASE: "${RAGFLOW_API_BASE}"
  RAGFLOW_PARSE_TIMEOUT_SECONDS: "${RAGFLOW_PARSE_TIMEOUT_SECONDS}"
  RAGFLOW_PARSE_POLL_INTERVAL_SECONDS: "${RAGFLOW_PARSE_POLL_INTERVAL_SECONDS}"
  ARTIFACT_S3_ALLOWED_BUCKETS: "${ARTIFACT_S3_ALLOWED_BUCKETS}"
  ARTIFACT_S3_ALLOWED_PREFIXES: "${ARTIFACT_S3_ALLOWED_PREFIXES}"
  ARTIFACT_MAX_SIZE_BYTES: "${ARTIFACT_MAX_SIZE_BYTES}"
  ARTIFACT_ALLOWED_CONTENT_TYPES: "${ARTIFACT_ALLOWED_CONTENT_TYPES}"
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  CASDOOR_VERIFY_SSL: "${CASDOOR_VERIFY_SSL}"
  FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
  FRONTEND_ALLOWED_ORIGINS: "${FRONTEND_ALLOWED_ORIGINS}"
  AUTH_POLICY_VERSION: "${AUTH_POLICY_VERSION}"
  INTERNAL_AUTH_CASDOOR_APPLICATION: "${INTERNAL_AUTH_CASDOOR_APPLICATION}"
  INTERNAL_AUTH_AUDIENCE: "${INTERNAL_AUTH_AUDIENCE}"
  INTERNAL_AUTH_SUBJECT_ALLOWLIST: "${INTERNAL_AUTH_SUBJECT_ALLOWLIST}"
  INTERNAL_AUTH_REQUIRED_SCOPE: "${INTERNAL_AUTH_REQUIRED_SCOPE}"
