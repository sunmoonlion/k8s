---
apiVersion: v1
kind: Service
metadata: {name: text-embeddings, namespace: data-platform-dev}
spec:
  selector: {app.kubernetes.io/name: text-embeddings}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: text-embeddings, namespace: data-platform-dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: text-embeddings}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: text-embeddings}
      annotations:
        sunmoonai.com/model-revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
        sunmoonai.com/model-files-sha256: 6a18804fabbc3a51a15106ba0287517d0effbce220d9878e7c2653aa34947ba8
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: sunmoon-kind-worker2}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: inference
          image: harbor.sunmoonai.com:30443/platform/text-embeddings-inference@sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - /models/97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
            - --served-model-name
            - Qwen/Qwen3-Embedding-0.6B
            - --port
            - "8080"
            - --dtype
            - float32
            - --pooling
            - last-token
            - --max-batch-tokens
            - "2048"
            - --max-client-batch-size
            - "8"
            - --max-concurrent-requests
            - "4"
            - --tokenization-workers
            - "2"
            - --auto-truncate
            - 'true'
            - --json-output
          env:
            - {name: HF_HUB_OFFLINE, value: '1'}
            - {name: HF_HUB_DISABLE_TELEMETRY, value: '1'}
            - {name: HF_HOME, value: /tmp/huggingface}
            - {name: OMP_NUM_THREADS, value: '4'}
            - {name: MKL_NUM_THREADS, value: '4'}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources: {"requests": {"cpu": "1", "memory": "3Gi"}, "limits": {"cpu": "4", "memory": "6Gi"}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: model, mountPath: /models, subPath: models, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: model
          persistentVolumeClaim: {claimName: text-embeddings-data, readOnly: true}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: text-embeddings-clients, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: text-embeddings}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ragflow}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ragflow-embedding-egress, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ragflow}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: text-embeddings}}
      ports: [{protocol: TCP, port: 8080}]
