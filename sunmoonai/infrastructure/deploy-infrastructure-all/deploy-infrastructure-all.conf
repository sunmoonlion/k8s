STEP05_WEAVE_CHART_VERSION="1.9.8"

# Helm 安装参数
# Helm 安装的目标命名空间，CNI 组件将安装在此命名空间中
# 通常使用 kube-system，这）Kubernetes 系统组件的标准命名空）STEP05_HELM_NAMESPACE="kube-system"

# Helm 安装时的额外参数，用于自定义安装行为
