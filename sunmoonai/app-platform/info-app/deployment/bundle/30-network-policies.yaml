    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: app-platform-dev
      podSelector:
        matchLabels:
          app: casdoor-sunmoonai
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-backend-worker-egress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
      app.kubernetes.io/component: backend-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          sunmoonai.com/data-platform: 'true'
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5672
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: app-platform-dev
      podSelector:
        matchLabels:
          app: casdoor-sunmoonai
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          sunmoonai.com/internal-provider: 'true'
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
---
