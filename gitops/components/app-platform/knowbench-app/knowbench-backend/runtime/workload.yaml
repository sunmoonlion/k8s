apiVersion: v1
kind: ConfigMap
metadata: {name: knowbench-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowbench-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowbench-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowbench-api
        app.kubernetes.io/part-of: knowbench
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 3f93bdd5bf65aee743f9c3b93ff12b7121c6b700836a1a2277253fd09626a530
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowbench-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/knowbench-backend@sha256:ac83f0eac23f116a3f4611a3e241bc23e100641da4c175313bf9f2f8813b2cd0
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowbench-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowbench-runtime}}
            - {configMapRef: {name: knowbench-browser-identity}}
            - {secretRef: {name: knowbench-database-runtime}}
            - {secretRef: {name: knowbench-rabbitmq-runtime}}
            - {secretRef: {name: knowbench-redis-runtime}}
            - {secretRef: {name: knowbench-browser-secrets}}
            - {secretRef: {name: knowbench-domain-runtime}}
            - {secretRef: {name: knowbench-knowbase-service}}
            - {secretRef: {name: knowbench-knowmart-summon-service}}
            - {secretRef: {name: knowbench-knowlab-read-service}}
            - {secretRef: {name: knowbench-agent-releases-runtime}}
          resources: {"requests": {"cpu": "100m", "memory": "192Mi"}, "limits": {"cpu": "2", "memory": "768Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: agent-releases-ca, mountPath: /etc/sunmoon/agent-releases, readOnly: true}
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: agent-releases-ca, secret: {secretName: knowbench-agent-releases-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: service-ca, configMap: {name: knowbench-service-ca}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: knowbench-celery-config}}
---
