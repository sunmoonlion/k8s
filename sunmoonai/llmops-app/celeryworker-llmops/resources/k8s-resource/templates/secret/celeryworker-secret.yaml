apiVersion: v1
kind: Secret
metadata:
  name: celeryworker-secret
  namespace: ${NAMESPACE}
  labels:
    app: celeryworker-llmops
type: Opaque
stringData:
  # 数据库/图数据库认证
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
  
  # PostgreSQL 完整连接字符串（包含密码）
  DB_URL: "${DB_URL}"
  
  # Neo4j 完整连接字符串（包含密码）
  NEO4J_BOLT_URL: "${NEO4J_BOLT_URL}"
  
  # DB_* 格式字段（兼容性）
  DB_PASSWORD: "${DB_PASSWORD}"

  # SMTP / 监控
  SMTP_USER: "${SMTP_USER}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"
  SENTRY_DSN: "${SENTRY_DSN}"

  # Redis 认证
  REDIS_USERNAME: "${REDIS_USERNAME}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

