# ============================================================================
# Auth App Front ConfigMap YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/configmap/auth-app-front-config.yaml"
OUTPUT_FILE="auth-app-front-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# ConfigMap 数据内容
# ============================================================================
NODE_ENV="${NODE_ENV:-production}"
NITRO_HOST="${NITRO_HOST:-0.0.0.0}"
NITRO_PORT="${NITRO_PORT:-3000}"

# auth-app-backend 连接地址（K8s 内部 Service 名）
AUTH_BACKEND_URL="${AUTH_BACKEND_URL:-http://auth-app-backend:3030/api/v1}"

# OIDC 客户端 ID（与 auth-app-backend 中注册的 client_id 一致）
AUTH_CLIENT_ID="${AUTH_CLIENT_ID:-auth-app-bff}"

# Session Cookie 名称
SESSION_COOKIE_NAME="${SESSION_COOKIE_NAME:-auth_session}"
