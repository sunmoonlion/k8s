# =============================================================================
# Traefik 服务器证书生成配置
# 文件名: generate-server-cert.conf
# 用途: 配置Traefik服务器证书的生成参数
# =============================================================================
# 注意：CA路径从 Traefik 主配置文件（deploy-traefik.conf）中的 TRAEFIK_CA_LOCAL_DIR 读取
# 此配置文件仅用于服务器证书参数（CN、DNS、IP等）

# =============================================================================
# 服务器证书配置（遵循 server-specifications 模板规范）
# =============================================================================
# 注意：此配置文件是服务器证书生成的权威配置源
# cert-secret.conf 中的配置主要用于 CA 证书管理和 Secret 部署
# 两者可以不一致，主要目的是确保 CA 证书放到正确的位置
#
# 配置说明（参考 server-specifications 模板）：
# 1. CN 字段为服务器主域名（不使用通配符，标准做法）
# 2. DNS.1 自动设置为 CN，在 SERVER_DNS 中添加其他域名（包括通配符）
# 3. 现代浏览器主要依赖 SANs（Subject Alternative Names）进行域名验证
# 4. 如需支持更多域名，在 SERVER_DNS 中用逗号分隔添加

# 服务器证书通用名称（CN）
# 通用名称：服务器的主要域名（标准做法：使用根域名，不使用通配符）
# 注意：DNS.1 会自动设置为与 CN 相同的值
SERVER_CN="${SERVER_CN:-sunmoonai.com}"

# 服务器证书DNS名称（多个用逗号分隔）
# 备用域名：支持多域名访问（包括通配符域名以覆盖所有子域名）
# 注意：DNS.1 自动设置为 CN（sunmoonai.com），这里从 DNS.2 开始
# 示例：*.sunmoonai.com,localhost,www.sunmoonai.com
SERVER_DNS="${SERVER_DNS:-*.sunmoonai.com,localhost}"

# 服务器证书IP地址（多个用空格分隔）
# IPv4地址：包含 Traefik 可能监听的IP地址
# 注意：应与 cert-secret.conf 中的 TRAEFIK_K1_K1_SERVER_IP_* 配置保持一致
# 示例：115.190.64.131 192.168.3.89 127.0.0.1 101.126.151.0 115.190.153.150
SERVER_IPS="${SERVER_IPS:-115.190.64.131 192.168.3.89 127.0.0.1 101.126.151.0 115.190.153.150}"

# 服务器证书有效期（天）
SERVER_DAYS="${SERVER_DAYS:-365}"

# 服务器证书密钥长度（位）
SERVER_KEY_SIZE="${SERVER_KEY_SIZE:-2048}"

