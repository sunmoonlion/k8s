apiVersion: v1
kind: PersistentVolume
metadata:
  name: sunmoon-kind-redisinsight
  annotations:
    sunmoonai.com/storage-owner: sunmoon-kind
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sunmoon-static
  local:
    path: /data/kind-local-storage/redisinsight
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [sunmoon-kind-worker2]
  claimRef:
    namespace: ops-platform-dev
    name: redisinsight-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-data
  namespace: ops-platform-dev
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: sunmoon-static
  volumeName: sunmoon-kind-redisinsight
  resources:
    requests: {storage: 2Gi}
