# ============================================================================
# Celery Worker 部署配置
# 文件名: deploy-celeryworker.conf
# 用途: 配置 Celery Worker 的部署参数
# ============================================================================

# ============================================================================
# 基础配置
# ============================================================================
CELERY_WORKER_PROJECT_ID="sunmoonai"
CELERY_WORKER_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# ============================================================================
# 镜像配置
# ============================================================================
# Harbor 镜像仓库配置（deploy 命令使用 Harbor 镜像）
CELERY_WORKER_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址
CELERY_WORKER_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
CELERY_WORKER_IMAGE_PULL_SECRET_NAME="harbor-registry-secret" # Harbor镜像拉取Secret名称

# Backend 镜像配置（用于 Init Container 提取代码）
BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
BACKEND_IMAGE_PROJECT="k8s-images"
BACKEND_IMAGE="llmops-service"
BACKEND_TAG="1.0.0"

# ============================================================================
# 代码提取配置（用于 Init Container）
# ============================================================================
# 源代码在 Backend 镜像中的路径（不同服务的镜像结构可能不同）
# 例如：llmops-service 使用 /app/app，其他服务可能使用 /app
CODE_EXTRACT_SOURCE_DIR="/app/app"

# 代码提取到共享卷的目标路径（通常不需要修改）
CODE_EXTRACT_TARGET_DIR="/shared/app"

# 需要提取的目录列表（用空格分隔，根据服务需求调整）
# 默认提取：worker（任务定义）、core（Celery配置）、services（服务层）、
#           db（数据库连接）、models（数据模型）、schemas（数据模式）、crud（CRUD操作）
# 如果某个服务没有某些目录，Init Container 会自动跳过
CODE_EXTRACT_DIRS="worker core services db models schemas crud"

# 需要提取的单个文件列表（用空格分隔，可选）
# 例如：__init__.py celeryworker_pre_start.py
CODE_EXTRACT_FILES="__init__.py celeryworker_pre_start.py"

# ============================================================================
# Celery Worker 配置
# ============================================================================
CELERY_BROKER_URL="amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//"
CELERY_RESULT_BACKEND="redis://redis-service.data-platform:6379"
CELERY_QUEUE="llmops-queue"  # 队列名称
CELERY_CONCURRENCY="1"       # Worker 并发数

# ============================================================================
# 部署前构建镜像开关
# ============================================================================
# 是否在部署前构建镜像并推送到 Harbor
# - true:  部署前构建镜像并推送到 Harbor，然后部署（仅在需要重新构建时使用）
# - false: 直接从 Harbor 拉取镜像部署，不构建（推荐，默认值）
# 注意：如果需要构建镜像，建议使用单独的命令：./deploy-celeryworker.sh build
BUILD_IMAGE_BEFORE_DEPLOY="false"

