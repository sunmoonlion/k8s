# PostgreSQL 策略中间件部署配置
# 注意：PostgreSQL 使用 TCP 路由，middleware 支持有限（仅 rateLimit 可能有效）

# 基础配置
POSTGRESQL_PROJECT_ID="sunmoonai"
POSTGRESQL_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略 YAML 文件路径（相对于 postgresql-policy 目录，脚本会在加载配置后计算完整路径）
# 注意：此变量在脚本中会被计算为完整路径
POSTGRESQL_POLICY_FILE_RELATIVE="../postgresql-policy.yaml"

# 策略类型配置（TCP 路由仅支持 rateLimit）
POSTGRESQL_POLICY_TYPES="rateLimit"

# 限流配置
POSTGRESQL_RATE_LIMIT_AVERAGE="100"
POSTGRESQL_RATE_LIMIT_BURST="200"

