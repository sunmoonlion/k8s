apiVersion: batch/v1
kind: Job
metadata:
  name: investment-r5-backend-migration-r5-investment-formal-001
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: investment-r5-backend
    app.kubernetes.io/component: backend-migration
    app.kubernetes.io/part-of: investment-r5
    sunmoonai.com/app: investment-r5
    sunmoonai.com/managed-by: architecture-v2
    sunmoonai.com/release-id: r5-investment-formal-001
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-r5-backend
        app.kubernetes.io/component: backend-migration
        app.kubernetes.io/part-of: investment-r5
        sunmoonai.com/app: investment-r5
        sunmoonai.com/managed-by: architecture-v2
        sunmoonai.com/release-id: r5-investment-formal-001
    spec:
      restartPolicy: Never
      serviceAccountName: investment-r5-backend-migration
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:edc52084c243703a68ab9b422d8ad0e1d2ff8519e6a25190b8b52fe8c1e1ed10
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.bootstrap.migration
        args:
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: investment-r5-backend-config
        env:
        - name: MIGRATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
