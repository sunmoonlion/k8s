# Kind 集群部署配置（供 deploy-kind.sh 读取）
# -----------------------------------------------------------------------------
# 执行步骤概览（均在 WSL 中）
# -----------------------------------------------------------------------------
# Kind 集群初始化流程：
#   1. 构建自定义 Kind 节点镜像（build-kind-node-image.sh）
#   2. 创建 Kind 集群（应用 kind-cluster.yaml）
#   3. 配置 containerd registry mirror，指向 Harbor 并配置 TLS 证书
#   4. 配置 WSL /etc/hosts 中 Harbor 的域名解析
#   5. 部署 Kind 集群内的 Traefik 与 Harbor
# CA 证书初始化由 ensure-kind-ca.sh 完成，Traefik/Harbor 共享同一套证书
DEPLOY_KIND_RUN_CA_INIT="true"

# -----------------------------------------------------------------------------
# Kind 节点内 registry 镜像源（与 infrastructure/deploy-infrastructure-all.conf 中 STEP02_REGISTRY_* 同源，可在此覆写）
# -----------------------------------------------------------------------------
# STEP02_REGISTRY_ENABLE="true"
# STEP02_REGISTRY_MIRRORS="docker.io=https://harbor.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://harbor.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io"
# STEP02_REGISTRY_DIRECT="harbor.sunmoonai.com:30443"

# -----------------------------------------------------------------------------
# Kind 自定义节点镜像：供 build-kind-node-image.sh 使用的基础镜像与后缀
# -----------------------------------------------------------------------------
# KIND_BASE_IMAGE：官方 kindest/node 标签，需与 kind-cluster.yaml / Kind 版本匹配
# 与当前集群版本不一致可能导致控制面异常，请按实际选择，例如：
#   KIND_BASE_IMAGE="kindest/node:v1.28.0"
KIND_BASE_IMAGE="kindest/node:v1.27.3"

# CUSTOM_NODE_SUFFIX：追加到镜像 tag 末尾，供 build-kind-node-image.sh 生成新镜像名
# 例如基础镜像 kindest/node:v1.27.3、后缀 sunmoonai → kindest/node:v1.27.3-sunmoonai
CUSTOM_NODE_SUFFIX="sunmoonai"

# -----------------------------------------------------------------------------
# Kind 集群：同名集群已存在时的策略
# -----------------------------------------------------------------------------
# true：先 kind delete 再重建；false：已存在则跳过创建（kind-up.sh 中未设置环境变量时默认 false）
RECREATE_KIND_CLUSTER_IF_EXISTS="true"

# 重建集群时是否清理 KIND_PV_HOST_PATH 下各组件子目录中的 PV 数据
# true:  清空所有组件数据目录，确保有状态服务从零初始化（全量重置场景）
# false: 保留旧数据（默认）。如需局部重置，手动清理（路径与 KIND_PV_HOST_PATH 一致时）：
#        sudo rm -rf /data/kind-local-storage/mongodb/*    # 仅重置 MongoDB
#        sudo rm -rf /data/kind-local-storage/postgresql/*  # 仅重置 PostgreSQL
CLEAN_PV_DATA_ON_RECREATE="true"

# -----------------------------------------------------------------------------
# Kind 本地 PV：两种落盘方案（KIND_PV_HOST_PATH 须与 kind-cluster.yaml 里 worker extraMounts.hostPath 一致）
# -----------------------------------------------------------------------------
#
# 方案一 | native（推荐，本文件默认）
#   - 含义：目录建在 WSL 发行版根分区上，不挂独立 vhdx、不要求 /etc/fstab 里为 PV 单独配盘。
#   - 做法：KIND_PV_STORAGE_MODE=native；执行 kind-up.sh 时会 sudo mkdir -p "$KIND_PV_HOST_PATH" 并放宽权限。
#   - 注意：与发行版系统盘共享容量；Kind 删集群后该目录仍在。
#
# 方案二 | vhd（独立数据盘，旧架构）
#   - 含义：Docker 数据与 Kind PV 各用一块 VHD/VHDX（路径在 Windows 侧自定，不限于 E:），
#           在 WSL 内分别挂到 /mnt/docker-ext4、/mnt/pv-kind-ext4，再把 PV 盘 bind 到 KIND_PV_HOST_PATH。
#   - 做法（顺序建议如下；细节与排错见 ../docs/wsl的vhdx挂载.md）：
#     1) 在 Windows「管理员」PowerShell 中：对每个文件执行
#          wsl --mount --vhd "<你的路径>\docker-data.vhd" --bare
#          wsl --mount --vhd "<你的路径>\pv-kind-local-storage.vhdx" --bare
#        进入 WSL 用 lsblk 确认块设备与分区号，必要时对分区 mkfs.ext4 并记录 UUID。
#     2) 在 WSL 内编辑 /etc/fstab：用 UUID= 挂载 /mnt/docker-ext4、/mnt/pv-kind-ext4；再增加一行 bind，
#        将 /mnt/pv-kind-ext4 绑定到 KIND_PV_HOST_PATH（与下方赋值及 kind-cluster.yaml 的 hostPath 三者一致）。
#     3) sudo mkdir -p /mnt/docker-ext4 /mnt/pv-kind-ext4 /data/kind-local-storage（若 hostPath 非默认则改路径）；
#        sudo mount -a；执行本目录 check-storage-mounts.sh，退出码须为 0。
#     4) 将本文件改为 KIND_PV_STORAGE_MODE=vhd 后再运行 kind-up.sh（会校验 fstab 与 findmnt）。
#     5) 若需开机自动 mount：可用 Windows 计划任务调用 deploy-kind/attach-vhds.ps1，并修改其中
#        VHD 路径、$WslUser、$CheckScript 与本机一致。
#
KIND_PV_STORAGE_MODE="native"
KIND_PV_HOST_PATH="/data/kind-local-storage"

# -----------------------------------------------------------------------------
# WSL 代理配置（用于访问 GitHub 上的 chart）
# -----------------------------------------------------------------------------
# 默认网关 IP 为 WSL 视角下 Windows 宿主机地址（常见形如 172.x.x.1，以 ip route 实际输出为准）
WINDOWS_PROXY_PORT="7890"
HTTP_PROXY_WSL="http://$(ip route show | grep -E '^default ' | awk '{print $3}'):${WINDOWS_PROXY_PORT}"
HTTPS_PROXY_WSL="http://$(ip route show | grep -E '^default ' | awk '{print $3}'):${WINDOWS_PROXY_PORT}"

# -----------------------------------------------------------------------------

# WSL 侧登录 Harbor 等流程使用的管理员密码（如 wsl-setup-harbor-login.sh）
HARBOR_ADMIN_PASSWORD="Ha!r1359admin"
HARBOR_PROJECT_NAMES="k8s-images,app-images"  # k8s-images 放基础组件镜像；app-images 放业务应用镜像
# -----------------------------------------------------------------------------
# Harbor 对外域名；WSL /etc/hosts 须指向「能命中 kind extraPortMappings 的地址」。
# Kind + hostPort 30443 时用 127.0.0.1（Docker 将端口发布到宿主机回环）。
# 勿用 kubectl 节点 InternalIP（如 172.18.0.2）：从 WSL 连 :30443 常为 Connection refused，脚本里会出现 HTTP 000。
# 节点内解析 Harbor 由 apply-kind-node-harbor-hosts.sh 等单独配置。外部 Harbor 可改 HARBOR_IP；排障可设 HARBOR_USE_NODE_INTERNAL_IP=true 并留空 HARBOR_IP。
HARBOR_HOST="harbor.sunmoonai.com"
HARBOR_IP="127.0.0.1"
# 须与 Traefik websecure NodePort、Harbor externalURL、kind-cluster hostPort 一致（当前均为 30443）
HARBOR_PORT="30443"

# -----------------------------------------------------------------------------
# 组件镜像 tar 包目录（与清单 *.txt 配套；供 Kind 侧预拉/推送 Harbor 等脚本引用）
# 说明：
#   - push_component_images_to_harbor 在 K8S_TARGET_MODE=kind 等场景下会读取 COMPONENT_IMAGE_TAR_DIR
#   - 默认与本机离线包目录一致，可按实际修改
#   - push-to-harbor 等流程中镜像引用里的 / 与 : 常替换为 _ 以生成 tar 文件名，例如：
#       bitnami/postgresql:17.6.0-debian-12-r4 -> bitnami_postgresql_17.6.0-debian-12-r4.tar
#   - 一键部署里若使用 DEPLOY_KIND_PUSH_TAR_DIRS，可为逗号分隔的多个目录；本变量为单目录常用写法
COMPONENT_IMAGE_TAR_DIR="$HOME/packages-to-be-installed/images"
