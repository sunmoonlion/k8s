# ============================================================================
# toutiao-app-front App YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/toutiao-app-front.yaml"
OUTPUT_FILE="toutiao-app-front-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

TOUTIAO_FRONT_IMAGE_REGISTRY="${TOUTIAO_FRONT_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
TOUTIAO_FRONT_IMAGE_PROJECT="${TOUTIAO_FRONT_IMAGE_PROJECT:-k8s-images}"
TOUTIAO_FRONT_IMAGE="${TOUTIAO_FRONT_IMAGE:-toutiao-app-front}"
TOUTIAO_FRONT_TAG="${TOUTIAO_FRONT_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
TOUTIAO_FRONT_IMAGE_PULL_SECRET_NAME="${TOUTIAO_FRONT_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

TOUTIAO_FRONT_SECRET_NAME="${TOUTIAO_FRONT_SECRET_NAME:-toutiao-app-front-secret}"
TOUTIAO_FRONT_CONFIGMAP_NAME="${TOUTIAO_FRONT_CONFIGMAP_NAME:-toutiao-app-front-config}"

PVC_NAME="${PVC_NAME:-toutiao-app-front-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
