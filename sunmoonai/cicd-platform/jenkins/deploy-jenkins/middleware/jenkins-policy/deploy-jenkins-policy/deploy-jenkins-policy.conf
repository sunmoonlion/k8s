# Jenkins 策略中间件部署配置

# 基础配置
JENKINS_PROJECT_ID="sunmoonai"
JENKINS_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
JENKINS_POLICY_TYPES="rateLimit,headers"

# 限流配置
JENKINS_RATE_LIMIT_AVERAGE="30"
JENKINS_RATE_LIMIT_BURST="60"

# 头部配置
JENKINS_HEADERS_CUSTOM_REQUEST_HEADERS="X-Jenkins-Version:2.426"
JENKINS_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Jenkins-Status:active"

