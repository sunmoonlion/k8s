# =============================================================================
# RabbitMQ Auth Secret 部署配置
# =============================================================================

SECRET_NAME="rabbitmq-auth-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-messaging-platform-dev}"
SECRET_TYPE="Opaque"

# RabbitMQ Chart要求键名使用破折号
rabbitmq_username="admin"
rabbitmq_password="zym123"  # RabbitMQ 应该使用此配置的密码
rabbitmq_erlang_cookie="ERLANGCOOKIE1234567890"

RESTART_COMPONENTS="true"
RESTART_PRIORITY="20"
RESTART_COMPONENTS_LIST="rabbitmq-sunmoonai"

