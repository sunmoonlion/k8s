  strategy: {type: Recreate}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowbase-scheduler}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowbase-scheduler
        app.kubernetes.io/part-of: knowbase
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 45ff5508afbb70a66541a9919de5a9977f7e845acedbcd50bfb7f78ee581754d
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowbase-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: harbor.sunmoonai.com:30443/platform/knowbase-backend@sha256:824476357d670cd108cfa70928956d37e4c31e60f77dfbaf4211d4f38046afdf
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.scheduler:celery_app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule, --pidfile=, --max-interval=5]
