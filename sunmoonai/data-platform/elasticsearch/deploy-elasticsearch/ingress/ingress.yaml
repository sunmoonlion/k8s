# Elasticsearch Web 路由配置

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: elasticsearch-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: data-platform-ingress
    component: elasticsearch-web
spec:
  entryPoints:
    - web      # HTTP entryPoint (30080，通过 iptables 80 -> 30080)
    - websecure # HTTPS entryPoint (30443，通过 iptables 443 -> 30443)
  routes:
    # 使用路径前缀路由，支持 IP 或统一域名
    # HTTP 访问（通过 iptables 80 -> 30080）：
    # - http://<节点IP>/elasticsearch
    # - http://www.sunmoonai.com/elasticsearch
    # HTTPS 访问（通过 iptables 443 -> 30443）：
    # - https://<节点IP>:30443/elasticsearch
    # - https://www.sunmoonai.com:30443/elasticsearch
    - match: Host(`101.126.151.0`) && PathPrefix(`/elasticsearch`)
      kind: Rule
      services:
        # 注意：SERVICE_NAME 和 SERVICE_PORT 不是配置项，而是从 Kubernetes Service 中动态获取
        # - SERVICE_NAME: 从主配置文件的 ELASTICSEARCH_PROJECT_ID 构建（格式：elasticsearch-{project_id}）
        # - SERVICE_PORT: 从 Kubernetes Service 的 spec.ports[0].port 字段动态获取
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: elasticsearch-stripprefix
        - name: elasticsearch-ratelimit
        - name: elasticsearch-headers
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/elasticsearch`)
      kind: Rule
      services:
        # 注意：SERVICE_NAME 和 SERVICE_PORT 不是配置项，而是从 Kubernetes Service 中动态获取
        # - SERVICE_NAME: 从主配置文件的 ELASTICSEARCH_PROJECT_ID 构建（格式：elasticsearch-{project_id}）
        # - SERVICE_PORT: 从 Kubernetes Service 的 spec.ports[0].port 字段动态获取
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: elasticsearch-stripprefix
        - name: elasticsearch-ratelimit
        - name: elasticsearch-headers
  tls:
    secretName: traefik-tls-secret
