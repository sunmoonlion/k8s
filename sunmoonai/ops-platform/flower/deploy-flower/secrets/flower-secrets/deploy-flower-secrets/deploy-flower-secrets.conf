# =============================================================================
# Flower Secret 部署配置
# 文件名: deploy-flower-secrets.conf
# 用途: 配置Flower认证Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="flower-secrets"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-ops-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置
# =============================================================================

# Flower 认证密码键名
FLOWER_AUTH_SECRET_PASSWORD_KEY="flower-password"

# Flower 管理员用户键名（与 deploy-flower.conf 中的 FLOWER_BASIC_AUTH_USER_KEY 保持一致）
FLOWER_ADMIN_USER_KEY="basic-auth-user"

# Flower 密码（如果未设置，将生成随机密码）
flower_password="${flower_password:-}"

# Flower 管理员用户（默认值）
flower_admin_user="${flower_admin_user:-admin}"

# Flower Broker URL（可选）
# broker_url="${broker_url:-}"

# Flower Broker API URL（可选）
# broker_api_url="${broker_api_url:-}"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
