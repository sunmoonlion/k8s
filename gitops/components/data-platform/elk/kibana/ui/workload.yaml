apiVersion: v1
kind: ConfigMap
metadata: {name: kibana-ui-initialize-v1, namespace: data-platform-dev}
data:
  initialize.js: |
    'use strict';
    const {request,readAuth}=require('./tls-client');
    const fs=require('node:fs');
    const user="sunmoon_kibana_reader";
    const owner="sunmoon-kind/kibana-ui";
    const index="sunmoon-logs-*";
    const admin=readAuth('/run/admin');
    const viewer=readAuth('/run/auth');
    const password=fs.readFileSync('/run/auth/password','utf8').trim();
    const desired={metadata:{sunmoon_owner:owner},elasticsearch:{cluster:[],indices:[{names:[index],privileges:['read','view_index_metadata']}]},kibana:[{base:['read'],feature:{},spaces:['default']}]};
    const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
    function status(r,expected,scope){if(r.status!==expected)throw new Error(scope+' HTTP '+r.status);}
    function ownedRole(r){
      const es=r.elasticsearch,kb=r.kibana,idx=es?.indices?.[0];
      return r.metadata?.sunmoon_owner===owner && same(es?.cluster,[]) && (es.run_as||[]).length===0 &&
        (es.remote_indices||[]).length===0 && (es.remote_cluster||[]).length===0 && es.indices?.length===1 &&
        same(idx.names,[index]) && same([...idx.privileges].sort(),['read','view_index_metadata']) &&
        !idx.allow_restricted_indices && !idx.field_security && !idx.query && kb?.length===1 &&
        same(kb[0].base,['read']) && Object.keys(kb[0].feature||{}).length===0 && same(kb[0].spaces,['default']);
    }
    (async()=>{
      const rolePath='/api/security/role/'+encodeURIComponent(user);
      let role=await request('kibana','GET',rolePath,admin);
      if(role.status===404){role=await request('kibana','PUT',rolePath+'?createOnly=true',admin,desired);status(role,204,'Create read-only browser role');}
      else {status(role,200,'Read browser role');if(!ownedRole(role.data))throw new Error('Refuse changing a foreign or broadened browser role');}
      const path='/_security/user/'+encodeURIComponent(user);
      let existing=await request('elasticsearch','GET',path,admin);
      if(existing.status===404 || (existing.status===200 && Object.keys(existing.data).length===0)){
        const created=await request('elasticsearch','PUT',path,admin,{password,roles:[user],metadata:{sunmoon_owner:owner}});status(created,200,'Create independent human reader');
      }else{
        status(existing,200,'Read browser identity');const u=existing.data[user];
        if(!u||u.metadata?.sunmoon_owner!==owner||!same(u.roles,[user])||!u.enabled)throw new Error('Refuse adopting a foreign or disabled browser identity');
      }
      const auth=await request('elasticsearch','GET','/_security/_authenticate',viewer);status(auth,200,'Authenticate human reader');
      if(auth.data.username!==user||!same(auth.data.roles,[user]))throw new Error('Human reader identity differs');
      const privileges=await request('elasticsearch','POST','/_security/user/_has_privileges',viewer,{cluster:['manage_security'],index:[{names:[index],privileges:['read','write','view_index_metadata']},{names:['sunmoon-kibana-foreign-check'],privileges:['read']}]});
      status(privileges,200,'Check human reader permissions');
      const own=privileges.data.index?.[index],other=privileges.data.index?.['sunmoon-kibana-foreign-check'];
      if(!own?.read||!own.view_index_metadata||own.write||other?.read||privileges.data.cluster?.manage_security)throw new Error('Human reader permissions differ');
      status(await request('elasticsearch','GET','/_security/user',viewer),403,'User administration must be denied');
      status(await request('kibana','GET','/api/data_views/data_view/sunmoon-application-logs',viewer),200,'Read prepared application log view');
      role=await request('kibana','GET',rolePath,admin);status(role,200,'Verify persisted role');if(!ownedRole(role.data))throw new Error('Persisted reader role differs');
      console.log(JSON.stringify({passed:true,independent_human_reader:true,default_space_read_only:true,application_logs_only:true,write_and_admin_denied:true,data_view_readable:true}));
    })().catch(error=>{console.error(error.message);process.exitCode=1;});

  tls-client.js: |
    'use strict';
    const fs = require('node:fs');
    const https = require('node:https');
    const ca = fs.readFileSync('/run/auth/ca.crt');
    const urls = {
      kibana:'https://kibana.data-platform-dev.svc.cluster.local:5601',
      elasticsearch:'https://elasticsearch.data-platform-dev.svc.cluster.local:9200'
    };
    function readAuth(path) {return fs.readFileSync(path+'/username','utf8').trim()+':'+fs.readFileSync(path+'/password','utf8').trim();}
    function request(service, method, path, auth, data) {
      return new Promise((resolve, reject) => {
        if (!urls[service] || !path.startsWith('/') || path.startsWith('//')) return reject(new Error('Unowned metadata endpoint'));
        const body = data === undefined ? undefined : JSON.stringify(data);
        const req = https.request(new URL(path, urls[service]), {method, ca, auth, rejectUnauthorized:true,
          headers:{'Content-Type':'application/json','kbn-xsrf':'sunmoon-data-view'}}, res => {
          let text='';
          res.on('data', chunk => {text+=chunk;if(text.length>4194304)req.destroy(new Error('Metadata exceeds limit'));});
          res.on('error', reject);
          res.on('end', () => {
            try {resolve({status:res.statusCode,data:text?JSON.parse(text):{}});}
            catch {reject(new Error('Invalid metadata response'));}
          });
        });
        req.setTimeout(30000,()=>req.destroy(new Error('Metadata request timed out; not replayed')));
        req.on('error',reject);req.end(body);
      });
    }
    module.exports={request,readAuth};

---
apiVersion: batch/v1
kind: Job
metadata: {name: kibana-ui-initialize-v1, namespace: data-platform-dev}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app.kubernetes.io/name: kibana-ui-initialize, sunmoonai.com/elasticsearch-client: 'true'}
      annotations: {sunmoonai.com/input-sha256: '719d1b456fdf8138199d6969b0202e18dadba2bb65f9bd7c6d035d927864bcf4'}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: initialize
          image: harbor.sunmoonai.com:30443/platform/kibana@sha256:d84abcfe9c715adc4f507eb0e28b3d9d3ee153b20645fbcbb7838a0dc4f98dac
          command: [/usr/share/kibana/node/default/bin/node, /scripts/initialize.js]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: admin, mountPath: /run/admin, readOnly: true}
      volumes:
        - {name: script, configMap: {name: kibana-ui-initialize-v1}}
        - {name: auth, secret: {secretName: kibana-ui-auth, defaultMode: 0440}}
        - {name: admin, secret: {secretName: kibana-ui-admin, defaultMode: 0440}}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: {name: kibana-internal, namespace: data-platform-dev}
spec:
  serverName: kibana.data-platform-dev.svc.cluster.local
  rootCAsSecrets: [kibana-upstream-ca]
  insecureSkipVerify: false
  forwardingTimeouts: {dialTimeout: 10s, responseHeaderTimeout: 60s}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kibana-ui
  namespace: data-platform-dev
  annotations: {kubernetes.io/ingress.class: sunmoon}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`kibana.sunmoonai.com`)'
      services: [{name: kibana, port: https, scheme: https, serversTransport: kibana-internal}]
  tls: {secretName: kibana-ui-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kibana-ui-access, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kibana}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: 'ingress-platform-dev'}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: kibana-ui-initialize}}
      ports: [{protocol: TCP, port: 5601}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kibana-ui-initialize-egress, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kibana-ui-initialize}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: kibana}}}]
      ports: [{protocol: TCP, port: 5601}]
