# ============================================================================
# knowledge-admin-backend ConfigMap YAML 生成配置
# 字段来源：应用 .env 中的非敏感字段
# ============================================================================

TEMPLATE_FILE="templates/configMap/knowledge-admin-backend-config.yaml"
OUTPUT_FILE="knowledge-admin-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

RAGFLOW_API_BASE="${RAGFLOW_API_BASE:-http://ragflow-sunmoonai-api:80}"
RAGFLOW_PARSE_TIMEOUT_SECONDS="${RAGFLOW_PARSE_TIMEOUT_SECONDS:-120}"
RAGFLOW_PARSE_POLL_INTERVAL_SECONDS="${RAGFLOW_PARSE_POLL_INTERVAL_SECONDS:-1.0}"
ARTIFACT_S3_ALLOWED_BUCKETS="${ARTIFACT_S3_ALLOWED_BUCKETS:-development-info-originals}"
ARTIFACT_S3_ALLOWED_PREFIXES="${ARTIFACT_S3_ALLOWED_PREFIXES:-info/original/}"
ARTIFACT_MAX_SIZE_BYTES="${ARTIFACT_MAX_SIZE_BYTES:-52428800}"
ARTIFACT_ALLOWED_CONTENT_TYPES="${ARTIFACT_ALLOWED_CONTENT_TYPES:-text/markdown,text/plain}"
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-sunmoonai-knowledge-admin}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-}"
CASDOOR_VERIFY_SSL="${CASDOOR_VERIFY_SSL:-true}"
FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-http://knowledge-admin-frontend:80}"
FRONTEND_ALLOWED_ORIGINS="${FRONTEND_ALLOWED_ORIGINS:-${FRONTEND_BASE_URL}}"
AUTH_POLICY_VERSION="${AUTH_POLICY_VERSION:-knowledge-admin-v1}"
AUTH_ALLOWED_ALGORITHMS="${AUTH_ALLOWED_ALGORITHMS:-RS256,ES256}"
INTERNAL_AUTH_CASDOOR_APPLICATION="${INTERNAL_AUTH_CASDOOR_APPLICATION:-sunmoonai-info-knowledge-ingest}"
INTERNAL_AUTH_DISCOVERY_URL="${INTERNAL_AUTH_DISCOVERY_URL:-}"
INTERNAL_AUTH_AUDIENCE="${INTERNAL_AUTH_AUDIENCE:-}"
INTERNAL_AUTH_SUBJECT_ALLOWLIST="${INTERNAL_AUTH_SUBJECT_ALLOWLIST:-}"
INTERNAL_AUTH_REQUIRED_SCOPE="${INTERNAL_AUTH_REQUIRED_SCOPE:-knowledge:ingest}"
