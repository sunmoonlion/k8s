---
# 组件命名空间与保留卷清单，供工作负载模板和检查使用。阶段/依赖图不在这里：唯一来源是 gitops/components/**/stage.yaml。
component_namespaces:
  ragflow: '{{ data_namespace }}'
  infinity: '{{ data_namespace }}'
  valkey: '{{ data_namespace }}'
  mongodb: '{{ data_namespace }}'
  neo4j: '{{ data_namespace }}'
  elasticsearch: '{{ data_namespace }}'
  kibana: '{{ data_namespace }}'
  logstash: '{{ data_namespace }}'
  postgresql: '{{ data_namespace }}'
  redis: '{{ data_namespace }}'
  object-storage: '{{ data_namespace }}'
  text-embeddings: '{{ data_namespace }}'
  rabbitmq: '{{ messaging_namespace }}'
  casdoor: '{{ app_namespace }}'
  pgadmin: '{{ ops_namespace }}'
  redisinsight: '{{ ops_namespace }}'
  flower: '{{ ops_namespace }}'
  mongo-express: '{{ ops_namespace }}'
  relay: '{{ relay_namespace }}'
  provisioner: '{{ sandbox_namespace }}'
services_volumes: '{{ [postgresql_volume, redis_volume, rabbitmq_volume, casdoor_volume, object_storage_volume, text_embeddings_volume, elasticsearch_volume, kibana_volume, logstash_volume, neo4j_volume, mongodb_volume, infinity_volume, valkey_volume, pgadmin_volume, redisinsight_volume] }}'
