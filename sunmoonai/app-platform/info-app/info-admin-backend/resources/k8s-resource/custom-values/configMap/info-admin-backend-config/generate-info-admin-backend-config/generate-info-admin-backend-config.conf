# ============================================================================
# info-admin-backend ConfigMap YAML 生成配置
# 字段来源：应用 .env 中的非敏感字段
# ============================================================================

TEMPLATE_FILE="templates/configMap/info-admin-backend-config.yaml"
OUTPUT_FILE="info-admin-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

STORAGE_BACKEND="${STORAGE_BACKEND:-s3}"
SEARCH_BACKEND="${SEARCH_BACKEND:-elasticsearch}"
ELASTICSEARCH_INDEX="${ELASTICSEARCH_INDEX:-info-information}"
CELERY_QUEUE="${CELERY_QUEUE:-info.admin.default}"
KNOWLEDGE_APP_INGEST_URL="${KNOWLEDGE_APP_INGEST_URL:-http://knowledge-admin-backend:8000/api/internal/v1/knowledge/ingestions}"
KNOWLEDGE_APP_SERVICE_APPLICATION="${KNOWLEDGE_APP_SERVICE_APPLICATION:-sunmoonai-info-knowledge-ingest}"
KNOWLEDGE_APP_SERVICE_SCOPE="${KNOWLEDGE_APP_SERVICE_SCOPE:-knowledge:ingest}"
KNOWLEDGE_APP_TIMEOUT_SECONDS="${KNOWLEDGE_APP_TIMEOUT_SECONDS:-20}"
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-sunmoonai-info-admin}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-}"
CASDOOR_VERIFY_SSL="${CASDOOR_VERIFY_SSL:-true}"
FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-http://info-admin-frontend:80}"
FRONTEND_ALLOWED_ORIGINS="${FRONTEND_ALLOWED_ORIGINS:-${FRONTEND_BASE_URL}}"
AUTH_POLICY_VERSION="${AUTH_POLICY_VERSION:-info-admin-v1}"
AUTH_ALLOWED_ALGORITHMS="${AUTH_ALLOWED_ALGORITHMS:-RS256,ES256}"
