apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebullworker-investment-web-backend
  namespace: app-platform-dev
  labels:
    app: nodebullworker-investment-web-backend
    component: node-bull-worker
    backend: investment-web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodebullworker-investment-web-backend
  template:
    metadata:
      labels:
        app: nodebullworker-investment-web-backend
        component: node-bull-worker
        backend: investment-web-backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: nodebullworker
        image: harbor.sunmoonai.com:30443/app-images/investment-web-backend:1.0.0
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          set -eu
          export NODE_ENV="${NODE_ENV:-production}"
          export QUEUE_ON="${QUEUE_ON:-true}"
          exec node dist/worker
        envFrom:
        - configMapRef:
            name: investment-web-backend-config
        - secretRef:
            name: investment-web-backend-secret
        - configMapRef:
            name: nodebullworker-investment-web-backend-config
        - secretRef:
            name: nodebullworker-investment-web-backend-secret
        - secretRef:
            name: investment-web-backend-nodebull-redis-conn
        env:
        - name: QUEUE_WORKER_SERVICE
          value: "investment-web-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
