      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-backend
        app.kubernetes.io/component: backend-worker
        app.kubernetes.io/part-of: investment
        sunmoonai.com/app: investment
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/allow-knowledge-internal: 'true'
      annotations:
        sunmoonai.com/release-id: kind-wb-20260926-r14
        sunmoonai.com/config-sha256: 5acbf7705b7b8bd205f632fcce91987ad35fb90e7946064b99a3abdb53a5d62a
        sunmoonai.com/source-commit: c89d8fe7491952d0dffd32ecebd4e5adc4042ab3
    spec:
      serviceAccountName: investment-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:4f639f78faea51306ddb2f495b8921763906a2ceb1cbdeb453b43bc2a2fe8710
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
            name: investment-backend-config
        - secretRef:
            name: investment-knowledge-retrieval-client
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-runtime
              key: WORKER_DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-runtime
              key: WORKER_CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: investment-backend-runtime
              key: WORKER_CELERY_RESULT_BACKEND
              optional: true
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PASSWORD
        readinessProbe:
          exec:
            command:
            - python
            - -m
            - app.cli.worker_readiness
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
