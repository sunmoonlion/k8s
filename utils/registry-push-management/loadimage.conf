#   注意：这应该是公网可访问的地址（或通过 VPN/跳板机可访问的地址），因为脚本从本地机器连�?C1_REMOTE_HOST="115.190.64.131"
# SSH 连接配置（用于连接到远程节点执行镜像操作�?C1_REMOTE_USER="zym"                    # SSH 登录用户�?C1_REMOTE_SSH_PORT="1022"               # SSH 端口
C1_REMOTE_SECRET="/home/zym/.ssh/id_rsa"  # SSH 私钥路径（与 REMOTE_PASS 二选一，优先使用私钥）
