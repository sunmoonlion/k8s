# ============================================================================
# Auth App SSR 部署配置
# ============================================================================

# 基础配置
AUTH_APP_SSR_PROJECT_ID="sunmoonai"
AUTH_APP_SSR_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像配置（需与源码 mybuild/build.conf 保持一致）
AUTH_APP_SSR_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
KIND_AUTH_APP_SSR_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
AUTH_APP_SSR_IMAGE_PROJECT="k8s-images"
AUTH_APP_SSR_IMAGE="auth-app-front"
AUTH_APP_SSR_TAG="1.0.0"
IMAGE_PULL_POLICY="Always"
AUTH_APP_SSR_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问域名/IP（Ingress 使用）
AUTH_APP_SSR_UNIFIED_HOST="auth-app-front.sunmoonai.com"
AUTH_APP_SSR_NODE_IP="115.190.153.150"
AUTH_APP_SSR_EXTERNAL_PORT="30443"

# 组件开关（控制是否部署）
namespace_enabled="true"    # Namespace（命名空间，应在所有资源之前创建）
secrets_enabled="true"      # Secrets（已与 ConfigMaps 分离）
configmap_enabled="true"    # ConfigMaps（已与 Secrets 分离）
middleware_enabled="false"  # Middleware（当前为占位符，保留用于未来扩展）
ingress_enabled="true"      # Ingress（HTTP 路由）

# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
namespace_priority=3000     # Namespace 优先级（最高，应在所有资源之前）
secrets_priority=2000       # Secrets 优先级
configmap_priority=1900    # ConfigMaps 优先级
middleware_priority=1000    # Middleware 优先级
ingress_priority=100        # Ingress 优先级（最低）

# ============================================================================
# PVC 配置（Persistent Volume Claim）
# ============================================================================
# 如果应用不需要持久化存储，可以不配置或设置为空
PVC_ENABLED="false"                    # 是否启用 PVC
PVC_NAME="auth-app-front-pvc"       # PVC 名称
PVC_MOUNT_PATH="/app/data"             # 容器内挂载路径
PVC_SUB_PATH=""                        # 子路径（可选，用于多 Pod 共享同一 PVC）
PVC_STORAGE_CLASS="local-path"              # StorageClass（使用 local-path 存储类）
PVC_ACCESS_MODE="ReadWriteOnce"        # 访问模式：ReadWriteOnce|ReadWriteMany|ReadOnlyMany
PVC_STORAGE_SIZE="10Gi"                # 存储大小
