# =============================================================================
# Harbor Registry Secret 部署配置（Document Converter BFF）
# 文件名: deploy-harbor-registry-secret.conf
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：Harbor 认证数据在 generate-harbor-registry-secret.conf 中
# =============================================================================

# =============================================================================
# 部署相关配置
# =============================================================================
# 基础配置（默认值，可通过主配置或命令行参数覆盖）
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
harbor_registry_secret_enabled="${harbor_registry_secret_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
# Harbor Registry Secret 需要最高优先级，因为其他组件依赖它来拉取镜像
harbor_registry_secret_priority="${harbor_registry_secret_priority:-700}"

# 组件描述（用于日志输出）
harbor_registry_secret_description="${harbor_registry_secret_description:-Harbor Registry Secret}"

