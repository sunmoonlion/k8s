# ============================================================================
# Ops Platform 平台基础配置
# ============================================================================
OPS_PLATFORM_PROJECT_ID="sunmoonai"
OPS_PLATFORM_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# pgAdmin
C1_pgadmin_enabled="false"
C2_pgadmin_enabled="true"
KIND_pgadmin_enabled="true"

# RedisInsight
C1_redisinsight_enabled="false"
C2_redisinsight_enabled="true"
KIND_redisinsight_enabled="true"

# Mongo Express
C1_mongo_express_enabled="false"
C2_mongo_express_enabled="true"
KIND_mongo_express_enabled="true"

# Flower
C1_flower_enabled="false"
C2_flower_enabled="true"
KIND_flower_enabled="true"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
C1_pgadmin_priority=900
C2_pgadmin_priority=900
KIND_pgadmin_priority=900

C1_redisinsight_priority=800
C2_redisinsight_priority=800
KIND_redisinsight_priority=800

C1_mongo_express_priority=700
C2_mongo_express_priority=700
KIND_mongo_express_priority=700

C1_flower_priority=600
C2_flower_priority=600
KIND_flower_priority=600

