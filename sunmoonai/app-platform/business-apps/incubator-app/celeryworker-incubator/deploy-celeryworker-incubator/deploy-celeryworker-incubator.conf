# ============================================================================
# Celery Worker (Incubator) 部署配置
# 文件名: deploy-celeryworker-incubator.conf
# 用途: 配置处理 incubator-app-bff 任务的 Celery Worker
# ============================================================================

# ============================================================================
# 基础配置
# ============================================================================
CELERY_WORKER_PROJECT_ID="sunmoonai"
CELERY_WORKER_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# ============================================================================
# 调试配置
# ============================================================================
# 是否保存生成的 YAML 文件到 resources 目录（用于调试和审计）
# true: 保存生成的 YAML 到 celeryworker-incubator-generated.yaml
# false: 不保存（默认，使用临时文件）
SAVE_GENERATED_YAML="${SAVE_GENERATED_YAML:-false}"

# ============================================================================
# 镜像配置
# ============================================================================
# Harbor 镜像仓库配置（deploy 命令使用 Harbor 镜像）
CELERY_WORKER_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址
CELERY_WORKER_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
CELERY_WORKER_IMAGE_PULL_SECRET_NAME="harbor-registry-secret" # Harbor镜像拉取Secret名称

# 镜像名称和标签（用于部署时指定镜像）
# 镜像名称和标签应该与 build/build.conf 中的配置保持一致
CELERY_WORKER_IMAGE="${CELERY_WORKER_IMAGE:-celeryworker}"
CELERY_WORKER_TAG="${CELERY_WORKER_TAG:-1.0.0}"

# ============================================================================
# 后端配置（单后端：incubator-app-bff）
# ============================================================================
# 后端镜像配置
BACKEND_IMAGE="incubator-app-bff"
BACKEND_TAG="1.0.0"
BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
BACKEND_IMAGE_PROJECT="k8s-images"

# ============================================================================
# 代码提取配置（用于 Init Container 从后端镜像提取代码）
# ============================================================================
# CODE_EXTRACT_SOURCE_DIR: 源代码在镜像中的路径（从哪里提取）
#   - 作用：指定后端镜像中应用代码的根目录
#   - 示例："/app/app" 表示代码在镜像的 /app/app 目录下
#   - 用途：Init Container 从这个路径开始提取代码
CODE_EXTRACT_SOURCE_DIR="/app/app"

# CODE_EXTRACT_DIRS: 要提取的目录列表（提取哪些目录）
#   - 作用：指定需要从后端镜像提取的目录（用空格分隔）
#   - 位置：在 SOURCE_DIR 下的第一级目录（根目录级别）
#   - 说明：
#     * worker/     - 任务定义（必须）
#     * core/       - Celery 配置（必须）
#     * services/  - 业务逻辑层（通常需要）
#     * db/         - 数据库连接（通常需要）
#     * models/     - 数据模型（通常需要）
#     * gdb/        - 图数据库相关（如果需要）
CODE_EXTRACT_DIRS="worker core services db models gdb"

# CODE_EXTRACT_FILES: 要提取的文件列表（提取哪些文件）
#   - 作用：指定需要从后端镜像提取的单个文件（用空格分隔）
#   - 位置：在 SOURCE_DIR 下的第一级文件（根目录级别）
CODE_EXTRACT_FILES="__init__.py"

# ============================================================================
# Celery Worker 配置
# ============================================================================
# RabbitMQ 消息代理（Broker）
CELERY_BROKER_URL="amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//"

# 监听队列（单队列）
# 注意：
#   1. 队列名称需要与后端服务发送任务时使用的队列名称一致
#   2. 队列无需预先创建：RabbitMQ 会在 Worker 启动时自动创建
#   3. 如果队列已存在，Worker 会直接使用现有队列
CELERY_QUEUE="incubator-queue"

# Redis 结果后端（Result Backend）
CELERY_RESULT_BACKEND="redis://redis-service.data-platform:6379/10"

# 并发数
CELERY_CONCURRENCY="2"

# ============================================================================
# 访问与域名配置（已废弃，Celery Worker 不需要 Ingress）
# ============================================================================
# 注意：Celery Worker 是纯后台任务处理，不需要 Service 和 Ingress
# 监控通过 Flower 服务统一管理（通过 Celery broker 连接）
# 如果需要直接访问 Worker，可以通过 kubectl port-forward 或 Flower 监控界面
CELERY_WORKER_UNIFIED_HOST="celeryworker-incubator.sunmoonai.com"  # 已废弃
CELERY_WORKER_NODE_IP="101.126.151.0"                    # 已废弃
CELERY_WORKER_EXTERNAL_PORT="30443"                      # 已废弃

# ============================================================================
# 组件开关配置
# ============================================================================
secrets_enabled="true"      # Secrets 和 ConfigMaps
middleware_enabled="false"  # Middleware（当前不需要，保留用于未来扩展）
ingress_enabled="false"     # Ingress（已禁用：Celery Worker 不需要 HTTP 接口，监控通过 Flower 服务）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
secrets_priority=2000       # Secrets 和 ConfigMaps 优先级（最高）
middleware_priority=1000    # Middleware 优先级
ingress_priority=100        # Ingress 优先级（最低）

# ============================================================================
# 镜像构建说明
# ============================================================================
# 注意: 镜像构建已分离到源代码项目的 build/ 目录
# 构建镜像请使用: cd ../build && ./build-image.sh build-push
# 部署脚本仅负责部署，不再包含构建功能
