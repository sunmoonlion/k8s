apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${INFO_DISTRIBUTION_WORKER_SERVICE_ACCOUNT_NAME:-info-distribution-worker}
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-info-admin-backend
    sunmoonai.com/service-principal: info-knowledge-ingest
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker-info-admin-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-info-admin-backend
    component: celery-worker
    backend: info-admin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celeryworker-info-admin-backend
  template:
    metadata:
      labels:
        app: celeryworker-info-admin-backend
        component: celery-worker
        backend: info-admin-backend
    spec:
      serviceAccountName: ${INFO_DISTRIBUTION_WORKER_SERVICE_ACCOUNT_NAME:-info-distribution-worker}
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ${CELERYWORKER_INFO_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: celeryworker
        image: ${CELERYWORKER_INFO_ADMIN_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -n "$(printenv CELERY_INCLUDE_MODULES)" ]; then
            exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
              -I "$(printenv CELERY_INCLUDE_MODULES)" \
              -l "$(printenv CELERY_LOG_LEVEL)" \
              -Q "$(printenv CELERY_QUEUE)" \
              -c "$(printenv CELERY_CONCURRENCY)"
          fi
          exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
            -l "$(printenv CELERY_LOG_LEVEL)" \
            -Q "$(printenv CELERY_QUEUE)" \
            -c "$(printenv CELERY_CONCURRENCY)"
        envFrom:
        - configMapRef:
            name: ${INFO_ADMIN_BACKEND_CONFIGMAP_NAME:-info-admin-backend-config}
        - secretRef:
            name: ${INFO_ADMIN_BACKEND_SECRET_NAME:-info-admin-backend-secret}
        - secretRef:
            name: ${INFO_KNOWLEDGE_INGEST_CLIENT_SECRET_NAME:-info-knowledge-ingest-client}
        - configMapRef:
            name: ${CELERYWORKER_INFO_ADMIN_BACKEND_CONFIGMAP_NAME:-celeryworker-info-admin-backend-config}
        - secretRef:
            name: ${CELERYWORKER_INFO_ADMIN_BACKEND_SECRET_NAME:-celeryworker-info-admin-backend-secret}
${INFO_ADMIN_BACKEND_DATABASE_ENV_FROM}
${INFO_ADMIN_BACKEND_OBJECT_STORAGE_ENV_FROM}
${INFO_ADMIN_BACKEND_ELASTICSEARCH_ENV_FROM}
        env:
        - name: CELERY_PRODUCER_SERVICE
          value: "info-admin-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - celery -A app.worker inspect ping --timeout 10
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - grep -aq celery /proc/1/cmdline
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: ${PVC_MOUNT_PATH:-/app/data}
${INFO_ADMIN_BACKEND_ELASTICSEARCH_VOLUME_MOUNT}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ${PVC_NAME:-celeryworker-info-admin-backend-pvc}
${INFO_ADMIN_BACKEND_ELASTICSEARCH_VOLUME}
