  KNOWBASE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SSL_CERT_FILE: /etc/sunmoon/service/ca.crt
