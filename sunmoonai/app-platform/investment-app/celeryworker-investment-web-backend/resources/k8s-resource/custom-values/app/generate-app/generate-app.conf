# ============================================================================
# celeryworker-investment-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/celeryworker-investment-web-backend.yaml"
OUTPUT_FILE="celeryworker-investment-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY="${CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
KIND_CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_PROJECT="${CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_PROJECT:-k8s-images}"
CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE="${CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE:-investment-web-backend}"
CELERYWORKER_INVESTMENT_WEB_BACKEND_TAG="${CELERYWORKER_INVESTMENT_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
CELERYWORKER_INVESTMENT_WEB_BACKEND_SECRET_NAME="${CELERYWORKER_INVESTMENT_WEB_BACKEND_SECRET_NAME:-celeryworker-investment-web-backend-secret}"
CELERYWORKER_INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME="${CELERYWORKER_INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-celeryworker-investment-web-backend-config}"
INVESTMENT_WEB_BACKEND_SECRET_NAME="${INVESTMENT_WEB_BACKEND_SECRET_NAME:-investment-web-backend-secret}"
INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME="${INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-investment-web-backend-config}"

# PVC 配置
PVC_NAME="${PVC_NAME:-celeryworker-investment-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
