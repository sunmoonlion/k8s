# ============================================================================
# Celery Worker (Incubator) Ingress YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# 注意：Celery Worker 是纯后台任务处理，通常不需要 Ingress
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/ingress/ingress.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="celeryworker-incubator-ingress-generated.yaml"

# 是否启用生成（默认禁用，因为 Celery Worker 不需要 HTTP 接口）
ENABLED="${ENABLED:-false}"

# 资源类型
RESOURCE_TYPE="ingress"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-celeryworker-incubator.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# Ingress 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 Ingress YAML 文件
# ============================================================================
# Ingress 相关配置
SERVICE_NAME="${SERVICE_NAME:-celeryworker-incubator-service}"      # 服务名称
SERVICE_PORT="${SERVICE_PORT:-5555}"                                # 服务端口（Flower 监控端口）
UNIFIED_HOST="${UNIFIED_HOST:-celeryworker-incubator.sunmoonai.com}" # 统一域名
NODE_IP="${NODE_IP:-101.126.151.0}"                                 # 节点 IP

# Middleware 配置
# 如果 USE_STRIP_PREFIX=true，使用路径前缀剥离中间件（在 ingress.yaml 中定义）
# 如果 USE_STRIP_PREFIX=false，使用限流中间件（需要单独部署）
USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"           # 是否使用 stripprefix 中间件
USE_RATE_LIMIT="${USE_RATE_LIMIT:-false}"               # 是否使用限流中间件（Celery Worker 通常不需要）

