apiVersion: v1
kind: ConfigMap
metadata:
  name: research-admin-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: research-admin-backend
data:
  ENV: "${ENV}"
  LOG_LEVEL: "${LOG_LEVEL}"
  SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS}"
  AGENT_SESSION_LOCK_TTL_SECONDS: "${AGENT_SESSION_LOCK_TTL_SECONDS}"
  AGENT_V4_TRAFFIC_ENABLED: "${AGENT_V4_TRAFFIC_ENABLED}"
  AGENT_V5_TRAFFIC_MODE: "${AGENT_V5_TRAFFIC_MODE}"
  AGENT_REDIS_KEY_PREFIX: "${AGENT_REDIS_KEY_PREFIX}"
  FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_ORGANIZATION: "${CASDOOR_ORGANIZATION}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  CASDOOR_VERIFY_SSL: "${CASDOOR_VERIFY_SSL}"
  CELERY_QUEUE: "${CELERY_QUEUE}"
  CELERY_TASK_DEFAULT_QUEUE: "${CELERY_QUEUE}"
