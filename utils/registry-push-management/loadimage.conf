# registry-push-management 集群配置
# 说明：通用配置适用于所有集群，集群特定配置使用 C1_*, C2_* 等前缀
# 当 CLUSTER 环境变量设置为对应值时，集群特定配置会覆盖通用配置

# ============================================================================
# 通用配置（所有集群共享，如果某个集群需要不同值，使用 C1_*, C2_* 覆盖）
# ============================================================================
# 本地镜像包目录
LOCAL_IMAGE_DIR="$HOME/packages-to-be-installed/images"

# 镜像仓库地址
REGISTRY_URL="harbor.sunmoonai.com:30443"
# 镜像项目名
#   说明：镜像仓库中的项目/命名空间名称，用于构建完整的镜像引用
#   例如：如果 REGISTRY_URL="harbor.sunmoonai.com:30443"，PROJECT_NAME="k8s-images"
#   则最终镜像引用为：harbor.sunmoonai.com:30443/k8s-images/镜像名:标签
#   注意：脚本不会自动创建项目，请确保该项目已在 Harbor 中创建，否则推送镜像会失败
PROJECT_NAME="k8s-images"

# Registry 认证信息
REGISTRY_USERNAME="admin"
REGISTRY_PASSWORD="Ha!b1359admin"
# 是否在 push 前登录（默认：true）
#   - true: 推送前执行 nerdctl login，使用上面的 REGISTRY_USERNAME 和 REGISTRY_PASSWORD 进行认证
#   - false: 跳过登录步骤，适用于已配置全局认证或匿名访问的 Registry
REGISTRY_LOGIN_BEFORE_PUSH="true"

# ============================================================================
# 集群特定配置（不同集群使用不同的值，使用 C1_*, C2_* 等前缀）
# ============================================================================
# 注意：以下配置在不同集群可能不同，必须为每个集群单独配置

# ----------------------------------------------------------------------------
# C1 集群配置
# ----------------------------------------------------------------------------
# 远程操作节点（用于执行镜像 load/tag/push 操作的节点）
#   说明：这是通过 SSH 登录执行镜像操作的远程节点地址，不是镜像仓库地址
#   脚本会从本地机器通过 SSH 连接到该节点，在该节点上执行 nerdctl load/tag/push 等操作
#   通常选择 Kubernetes 集群的某个节点（如 master 节点或包含 containerd 的节点）
#   注意：这应该是公网可访问的地址（或通过 VPN/跳板机可访问的地址），因为脚本从本地机器连接
C1_REMOTE_HOST="115.190.64.131"
# SSH 连接配置（用于连接到远程节点执行镜像操作）
C1_REMOTE_USER="zym"
C1_REMOTE_SSH_PORT="1022"
C1_REMOTE_SECRET="/home/zym/.ssh/id_rsa"
C1_REMOTE_PASS=""
C1_REMOTE_IMAGE_DIR="~/packages-to-be-installed/images"

# ----------------------------------------------------------------------------
# C2 集群配置
# ----------------------------------------------------------------------------
C2_REMOTE_HOST="115.190.37.57"
C2_REMOTE_USER="zym"
C2_REMOTE_SSH_PORT="1022"
C2_REMOTE_SECRET="/home/zym/.ssh/id_rsa"
C2_REMOTE_PASS=""
C2_REMOTE_IMAGE_DIR="~/packages-to-be-installed/images"

# ============================================================================
# 如需添加更多集群，使用 C3_*, C4_* 等前缀，格式与上面相同
# 说明：本工具仅适用于远程集群（通过 SSH 在远程节点执行 nerdctl），不适用于 Kind
# ============================================================================

# nerdctl/containerd
NERDCTL_BIN="nerdctl"
CONTAINERD_NAMESPACE="k8s.io"
USE_SUDO="true"

# 推送重试
PUSH_RETRY="2"
PUSH_RETRY_INTERVAL="3"

# 代理（可选）
HTTP_PROXY=""
HTTPS_PROXY=""
NO_PROXY="localhost,127.0.0.1,::1"

# 推送前检查工具配置（推送前检查 registry 是否存在，存在则跳过）
EXISTENCE_CHECK_TOOL="skopeo"
REGISTRY_TLS_VERIFY="false"

# 推送后清理远程 tar 文件开关（所有集群通用）
#   - true: 推送完成后删除远程 tar 文件（默认，节省空间）
#   - false: 保留远程 tar 文件（用于后续复用或排障）
CLEANUP_REMOTE_TAR_AFTER_PUSH="false"
