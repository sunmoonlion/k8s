# Incubator App SSR 中间件总控部署配置
# 注意：当前使用自定义请求头中间件（占位符），可根据需要扩展

# 基础配置
INCUBATOR_SSR_PROJECT_ID="sunmoonai"
INCUBATOR_SSR_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 当前 middleware.yaml 是占位符，可根据需要启用
incubator_ssr_headers_enabled="false"        # Headers 中间件（自定义请求头，当前为占位符）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
incubator_ssr_headers_priority=100       # Headers 优先级

