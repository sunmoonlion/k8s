TEMPLATE_FILE="templates/pvc/investment-web-backend-pvc.yaml"
OUTPUT_FILE="investment-web-backend-pvc-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="pvc"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
