# Incubator App BFF 中间件总控部署配置
# 注意：当前使用 stripprefix 中间件，用于路径前缀剥离

# 基础配置
INCUBATOR_BFF_PROJECT_ID="sunmoonai"
INCUBATOR_BFF_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
incubator_bff_stripprefix_enabled="true"        # StripPrefix 中间件（路径前缀剥离）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
incubator_bff_stripprefix_priority=100       # StripPrefix 优先级

