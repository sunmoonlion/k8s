data:
  DEPLOYMENT_ENV: production
  AUTH_APP: investment
  APP_ORIGIN: https://investment-admin.sunmoonai.com:30443
  BACKEND_INTERNAL_URL: http://investment-r5-backend:8000
  DEPLOYMENT_ID: r5-investment-formal-001-admin
