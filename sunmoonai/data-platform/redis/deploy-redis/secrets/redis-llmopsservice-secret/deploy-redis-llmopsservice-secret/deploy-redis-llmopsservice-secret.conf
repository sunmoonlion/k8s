# =============================================================================
# Redis LLMOps Service Secret 部署配置
# 文件名: deploy-redis-llmopsservice-secret.conf
# 用途: 配置Redis应用连接信息Secret的生成和部署参数
# 说明: 供 LLMOps Service 连接 Redis 使用，使用数据库编号 1
# =============================================================================

SECRET_NAME="redis-llmopsservice-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"
SECRET_TYPE="Opaque"

REDIS_HOST="redis-sunmoonai.data-platform-dev.svc.cluster.local"
REDIS_PORT="6379"
REDIS_PASSWORD="Re!d1359admin"
REDIS_SSL="false"
REDIS_DB="1"  # Redis 数据库编号（0-15），使用 1 为 LLMOps Service 专用

RESTART_COMPONENTS="false"
RESTART_PRIORITY="50"

