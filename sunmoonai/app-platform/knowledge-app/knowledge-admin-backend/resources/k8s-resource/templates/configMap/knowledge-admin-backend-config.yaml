apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-admin-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: knowledge-admin-backend
data:
  RAGFLOW_API_BASE: "${RAGFLOW_API_BASE}"
  RAGFLOW_PARSE_TIMEOUT_SECONDS: "${RAGFLOW_PARSE_TIMEOUT_SECONDS}"
  RAGFLOW_PARSE_POLL_INTERVAL_SECONDS: "${RAGFLOW_PARSE_POLL_INTERVAL_SECONDS}"
  ARTIFACT_S3_ALLOWED_BUCKETS: "${ARTIFACT_S3_ALLOWED_BUCKETS}"
  ARTIFACT_S3_ALLOWED_PREFIXES: "${ARTIFACT_S3_ALLOWED_PREFIXES}"
  ARTIFACT_MAX_SIZE_BYTES: "${ARTIFACT_MAX_SIZE_BYTES}"
  ARTIFACT_ALLOWED_CONTENT_TYPES: "${ARTIFACT_ALLOWED_CONTENT_TYPES}"
