apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: neo4j-headers
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: neo4j-headers
    project: sunmoonai
spec:
  headers:
    customRequestHeaders:
      X-Neo4j-Version: "5.15"
      # 反向代理下 Neo4j 需知原始协议与路径前缀，避免 500 / 重定向错误
      X-Forwarded-Proto: "https"
      X-Forwarded-Prefix: "/neo4j"
    customResponseHeaders:
      X-Neo4j-Status: "active"

