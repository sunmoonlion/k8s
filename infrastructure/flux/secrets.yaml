---
- import_playbook: ../host/preflight.yaml
- name: Prepare or restore the independent SOPS identity and bootstrap Flux
  hosts: kind_hosts
  gather_facts: false
  become: true
  vars:
    secrets_action: status
    capacity_operation: sops-bootstrap
    files: '{{ lookup("ansible.builtin.file", playbook_dir + "/../artifacts/files.lock.json") | from_json }}'
    sops_package: '{{ files.files | selectattr("id", "equalto", "sops") | first }}'
    age_package: '{{ files.files | selectattr("id", "equalto", "age") | first }}'
    tools: '{{ playbook_dir }}/../.tools/bin'
    build: '{{ playbook_dir }}/../.build/flux'
    recipient_path: '{{ playbook_dir }}/../environments/kind/sops-recipient.txt'
    key_path: '{{ sops_config_dir }}/age.agekey'
    backup_path: '{{ sops_backup_dir }}/age.agekey'
    kube: ['{{ tools }}/kubectl', '--kubeconfig={{ cluster_kubeconfig }}', '--context=kind-{{ cluster_name }}', '--request-timeout=30s']
  environment:
    HTTP_PROXY: ''
    HTTPS_PROXY: ''
    ALL_PROXY: ''
    http_proxy: ''
    https_proxy: ''
    all_proxy: ''
    NO_PROXY: '{{ registry_hostname }},127.0.0.1,localhost'
  tasks:
    - name: Validate the declared scope
      ansible.builtin.assert:
        quiet: true
        that:
          - not ansible_check_mode
          - secrets_action in ['prepare', 'apply', 'status']
          - cluster_name == 'sunmoon-kind'
          - sops_config_dir == '/etc/sunmoon/flux/' + cluster_name
          - sops_backup_dir == '/mnt/sunmoon-data/backups/flux/' + cluster_name
    - name: Skip a disabled SOPS deployment
      ansible.builtin.meta: end_play
      when: not sops_enabled | bool and secrets_action != 'status'
    - name: Verify SOPS and key generator bytes before using secrets
      ansible.builtin.stat:
        path: '{{ tools }}/{{ item.name }}'
        follow: false
        checksum_algorithm: sha256
      loop:
        - name: sops
          sha256: '{{ sops_package.sha256 }}'
        - name: age-keygen
          sha256: '{{ (age_package.archive_members | selectattr("path", "equalto", "age/age-keygen") | first).sha256 }}'
      register: binaries
    - name: Require exact executable identities
      ansible.builtin.assert:
        quiet: true
        that:
          - item.stat.isreg | default(false)
          - not item.stat.islnk | default(false)
          - item.stat.checksum | default('') == item.item.sha256
      loop: '{{ binaries.results }}'
      loop_control: {label: '{{ item.item.name }}'}
    - name: Budget key material and encrypted declarations
      ansible.builtin.include_tasks:
        file: ../host/tasks/capacity.yaml
        apply: {become: false}
      vars:
        capacity_planned_bytes: 16777216
      when: secrets_action != 'status'
    - name: Inspect every private path before writes
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: [/etc/sunmoon, /etc/sunmoon/flux, '{{ sops_config_dir }}', /mnt/sunmoon-data/backups, /mnt/sunmoon-data/backups/flux, '{{ sops_backup_dir }}']
      register: directories
    - name: Reject symlinks and non-directories
      ansible.builtin.assert:
        quiet: true
        that:
          - not item.stat.islnk | default(false)
          - not item.stat.exists or item.stat.isdir | default(false)
      loop: '{{ directories.results }}'
      loop_control: {label: '{{ item.item }}'}
    - name: Inspect the two independent identity copies
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
        get_checksum: false
      loop: ['{{ key_path }}', '{{ backup_path }}']
      register: identities
    - name: Refuse foreign or insecure existing key files
      ansible.builtin.assert:
        quiet: true
        that:
          - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
          - not item.stat.islnk | default(false)
      loop: '{{ identities.results }}'
      loop_control: {label: '{{ item.item }}'}
    - name: Inspect the tracked public recipient
      become: false
      ansible.builtin.stat:
        path: '{{ recipient_path }}'
        follow: false
      register: tracked_recipient
    - name: Refuse silent identity rotation after loss of both copies
      ansible.builtin.assert:
        quiet: true
        that:
          - identities.results[0].stat.exists or identities.results[1].stat.exists or not tracked_recipient.stat.exists
          - secrets_action == 'prepare' or identities.results[0].stat.exists
        fail_msg: Restore the existing age identity from backup; generating a replacement would lose access to committed ciphertext.
    - name: Prepare independent identity copies
      when: secrets_action == 'prepare'
      block:
        - name: Create private identity directories
          ansible.builtin.file:
            path: '{{ item }}'
            state: directory
            owner: root
            group: root
            mode: '0700'
          loop: ['{{ sops_config_dir }}', '{{ sops_backup_dir }}']
        - name: Restore a missing primary from the preserved backup
          ansible.builtin.copy:
            src: '{{ backup_path }}'
            dest: '{{ key_path }}'
            remote_src: true
            force: false
            mode: '0600'
            owner: root
            group: root
          when: not identities.results[0].stat.exists and identities.results[1].stat.exists
          no_log: true
        - name: Generate an identity only for a genuinely new environment
          ansible.builtin.command:
            argv: ['{{ tools }}/age-keygen', -o, '{{ key_path }}']
            creates: '{{ key_path }}'
          when: not identities.results[0].stat.exists and not identities.results[1].stat.exists
          no_log: true
        - name: Ensure restrictive primary mode
          ansible.builtin.file:
            path: '{{ key_path }}'
            owner: root
            group: root
            mode: '0600'
        - name: Preserve an independent copy without overwriting a previous identity
          ansible.builtin.copy:
            src: '{{ key_path }}'
            dest: '{{ backup_path }}'
            remote_src: true
            force: false
            owner: root
            group: root
            mode: '0600'
          no_log: true
    - name: Require identical recoverable identity copies
      ansible.builtin.command:
        argv: [cmp, --silent, '{{ key_path }}', '{{ backup_path }}']
      changed_when: false
      no_log: true
    - name: Derive public recipient without disclosing private material
      ansible.builtin.command:
        argv: ['{{ tools }}/age-keygen', -y, '{{ key_path }}']
      register: recipient
      changed_when: false
    - name: Require the pinned recipient if this environment was already published
      ansible.builtin.assert:
        quiet: true
        that:
          - recipient.stdout is match('^age1[a-z0-9]+$')
          - not tracked_recipient.stat.exists or lookup('ansible.builtin.file', recipient_path, errors='ignore') | trim == recipient.stdout
    - name: Prepare ciphertext for the namespace pull-only credential
      when: secrets_action == 'prepare'
      block:
        - name: Ensure candidate directory exists
          ansible.builtin.file:
            path: '{{ build }}'
            state: directory
            owner: '{{ cluster_operator }}'
            mode: '0755'
        - name: Save public recipient candidate
          ansible.builtin.copy:
            dest: '{{ build }}/sops-recipient.txt'
            content: |
              {{ recipient.stdout }}
            mode: '0644'
            owner: '{{ cluster_operator }}'
        - name: Read bounded registry identity
          ansible.builtin.slurp:
            src: '{{ registry_config_dir }}/private/puller-auth.json'
          register: puller
          no_log: true
        - name: Construct the Secret only in memory
          ansible.builtin.set_fact:
            pull_manifest: '{{ {"apiVersion":"v1", "kind":"Secret", "metadata":{"name":"registry-puller", "namespace":"platform-system"}, "type":"kubernetes.io/dockerconfigjson", "data":{".dockerconfigjson":puller.content}} }}'
          no_log: true
        - name: Inspect the existing ciphertext candidate
          ansible.builtin.stat:
            path: '{{ build }}/platform-puller.sops.yaml'
            follow: false
          register: prior_candidate
        - name: Refuse links or non-files for ciphertext
          ansible.builtin.assert:
            quiet: true
            that:
              - not prior_candidate.stat.islnk | default(false)
              - not prior_candidate.stat.exists or prior_candidate.stat.isreg | default(false)
        - name: Read existing encrypted candidate through its recovery identity
          ansible.builtin.command:
            argv: ['{{ tools }}/sops', decrypt, --output-type, json, '{{ build }}/platform-puller.sops.yaml']
          environment:
            SOPS_AGE_KEY_FILE: '{{ backup_path }}'
            XDG_CONFIG_HOME: /nonexistent
            HOME: /nonexistent
          register: prior_ciphertext
          changed_when: false
          failed_when: false
          no_log: true
        - name: Refuse overwriting unreadable existing ciphertext
          ansible.builtin.assert:
            quiet: true
            that: not prior_candidate.stat.exists or prior_ciphertext.rc == 0
        - name: Encrypt only a new or changed candidate using the public recipient
          ansible.builtin.command:
            argv: ['{{ tools }}/sops', encrypt, --age, '{{ recipient.stdout }}', --encrypted-regex, '^(data|stringData)$', --input-type, json, --output-type, yaml, /dev/stdin]
            stdin: '{{ pull_manifest | to_json }}'
          register: ciphertext
          changed_when: true
          when: prior_ciphertext.rc != 0 or (prior_ciphertext.stdout | from_json) != pull_manifest
          no_log: true
        - name: Save ciphertext only (plaintext is never written into this worktree)
          ansible.builtin.copy:
            dest: '{{ build }}/platform-puller.sops.yaml'
            content: |
              {{ ciphertext.stdout }}
            mode: '0644'
            owner: '{{ cluster_operator }}'
          when: ciphertext is changed
          no_log: true
        - name: Decrypt the candidate using only the independent recovery copy
          ansible.builtin.command:
            argv: ['{{ tools }}/sops', decrypt, --output-type, json, '{{ build }}/platform-puller.sops.yaml']
          environment:
            SOPS_AGE_KEY_FILE: '{{ backup_path }}'
            XDG_CONFIG_HOME: /nonexistent
            HOME: /nonexistent
          changed_when: false
          register: recovered_manifest
          no_log: true
        - name: Require recovered credential content to match the live bounded identity
          ansible.builtin.assert:
            quiet: true
            that: recovered_manifest.stdout | from_json == pull_manifest
          no_log: true
    - name: Apply or check the cluster decryption identity
      when: secrets_action in ['apply', 'status']
      block:
        - name: Require an explicitly promoted public recipient
          ansible.builtin.assert:
            quiet: true
            that: tracked_recipient.stat.exists
        - name: Read the independent cluster ownership receipt
          ansible.builtin.slurp:
            src: '{{ cluster_data_root }}/{{ cluster_name }}/bootstrap/identity.json'
          register: identity
        - name: Require the owned live API UID
          ansible.builtin.command:
            argv: '{{ kube + ["get", "namespace", "kube-system", "-o", "jsonpath={.metadata.uid}"] }}'
          register: uid
          changed_when: false
          failed_when: uid.rc != 0 or uid.stdout != (identity.content | b64decode | from_json).kube_system_uid
        - name: Read the private identity without logging it
          ansible.builtin.slurp:
            src: '{{ key_path }}'
          register: private_identity
          no_log: true
        - name: Refuse adoption of a foreign decryption Secret
          ansible.builtin.command:
            argv: '{{ kube + ["-n", "flux-system", "get", "secret", "sops-age", "--ignore-not-found", "-o", "json"] }}'
          register: owner
          changed_when: false
          failed_when: >-
            owner.rc != 0 or (owner.stdout != '' and
            (owner.stdout | from_json).metadata.annotations['sunmoonai.com/bootstrap-owner'] | default('') != cluster_name)
          no_log: true
        - name: Apply the bootstrap Secret without forcing other field owners
          ansible.builtin.include_tasks: tasks/apply.yaml
          vars:
            flux_manifest_sensitive: true
            flux_manifest: '{{ {"apiVersion":"v1", "kind":"Secret", "metadata":{"name":"sops-age", "namespace":"flux-system", "annotations":{"sunmoonai.com/bootstrap-owner":cluster_name, "sunmoonai.com/age-recipient":recipient.stdout}}, "type":"Opaque", "data":{"age.agekey":private_identity.content}} | to_json }}'
          when: secrets_action == 'apply'
        - name: Compare cluster identity and public annotation without exposing the key
          ansible.builtin.command:
            argv: '{{ kube + ["-n", "flux-system", "get", "secret", "sops-age", "-o", "json"] }}'
          register: cluster_identity
          changed_when: false
          failed_when: >-
            cluster_identity.rc != 0 or
            (cluster_identity.stdout | from_json).data['age.agekey'] != private_identity.content or
            (cluster_identity.stdout | from_json).metadata.annotations['sunmoonai.com/age-recipient'] != recipient.stdout
          no_log: true
