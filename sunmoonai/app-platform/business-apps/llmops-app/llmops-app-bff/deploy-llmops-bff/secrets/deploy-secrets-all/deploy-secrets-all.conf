# ============================================================================
# LLMOps Service Secrets All 部署配置
# ============================================================================
# 统一部署所有 LLMOps Service 相关的 Secrets 和 ConfigMaps

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# Secrets All 组件控制标志
# ============================================================================
# 控制是否部署各个组件

llmops_service_secret_enabled="true"      # 是否部署 LLMOps Service Secret
llmops_service_config_enabled="true"      # 是否部署 LLMOps Service ConfigMap

# ============================================================================
# 组件优先级配置
# ============================================================================
# 数字越大优先级越高（部署顺序）

llmops_service_secret_priority="600"       # LLMOps Service Secret 优先级
llmops_service_config_priority="500"      # LLMOps Service ConfigMap 优先级

