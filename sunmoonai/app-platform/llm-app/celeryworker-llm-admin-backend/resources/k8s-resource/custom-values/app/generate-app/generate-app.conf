# ============================================================================
# celeryworker-llm-admin-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/celeryworker-llm-admin-backend.yaml"
OUTPUT_FILE="celeryworker-llm-admin-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_REGISTRY="${CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
KIND_CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_PROJECT="${CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE="${CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE:-llm-admin-backend}"
CELERYWORKER_LLM_ADMIN_BACKEND_TAG="${CELERYWORKER_LLM_ADMIN_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME="${CELERYWORKER_LLM_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
CELERYWORKER_LLM_ADMIN_BACKEND_SECRET_NAME="${CELERYWORKER_LLM_ADMIN_BACKEND_SECRET_NAME:-celeryworker-llm-admin-backend-secret}"
CELERYWORKER_LLM_ADMIN_BACKEND_CONFIGMAP_NAME="${CELERYWORKER_LLM_ADMIN_BACKEND_CONFIGMAP_NAME:-celeryworker-llm-admin-backend-config}"
LLM_ADMIN_BACKEND_SECRET_NAME="${LLM_ADMIN_BACKEND_SECRET_NAME:-llm-admin-backend-secret}"
LLM_ADMIN_BACKEND_CONFIGMAP_NAME="${LLM_ADMIN_BACKEND_CONFIGMAP_NAME:-llm-admin-backend-config}"

# PVC 配置
PVC_NAME="${PVC_NAME:-celeryworker-llm-admin-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
