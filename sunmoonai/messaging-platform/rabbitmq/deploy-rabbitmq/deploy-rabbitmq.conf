# 项目标识
RABBITMQ_PROJECT_ID="sunmoonai"
RABBITMQ_NAMESPACE="messaging-platform-dev"

# ============================================================================
# 镜像仓库配置
# ============================================================================
RABBITMQ_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
RABBITMQ_IMAGE_PROJECT="k8s-images"                     # 镜像项目名

# 统一镜像拉取秘钥名（由密管统一创建）
RABBITMQ_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 统一密管 Secret 名称（占位）：请由 secret-management 创建
RABBITMQ_AUTH_SECRET_NAME="rabbitmq-auth-secret"

# ============================================================================
# 访问与端口配置
# ============================================================================
RABBITMQ_TLS_ENABLED="false"                    # RabbitMQ通常不需要TLS
RABBITMQ_UNIFIED_HOST="www.sunmoonai.com"       # 统一域名（用于路径前缀路由）
RABBITMQ_NODE_IP="115.190.153.150"             # 节点公网 IP 地址（用于 IP 访问方式）

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# RABBITMQ_FORCE_OFFLINE="true"       # 离线模式：强制离线部署

# 镜像版本配置
# bitnamilegacy/rabbitmq:4.1.3-debian-12-r1
RABBITMQ_IMAGE_VERSION="4.1.3-debian-12-r1"
# RabbitMQ Chart 使用内置的 Prometheus 插件，无需独立的 exporter 镜像
# bitnami/rabbitmq-exporter:1.0.0-debian-12-r0
# RABBITMQ_METRICS_IMAGE_VERSION="1.0.0-debian-12-r0"
# bitnami/os-shell:12-debian-12-r50
RABBITMQ_OS_SHELL_IMAGE_VERSION="12-debian-12-r50"

# ============================================================================
# 持久化数据复用开关
# ============================================================================
# RABBITMQ_PERSIST_MODE 用于控制是否在重建集群时复用已有的 NFS 数据盘：
# - init  ：使用 dev-values.yaml，走动态 storageClass，新建空数据盘（开发环境从零开始）
# - reuse ：先应用 rabbitmq-dev-pv-pvc.yaml，再使用 dev-values-persist.yaml，复用老数据盘
# 默认使用 init，避免在第一次部署时错误指向不存在的老盘
RABBITMQ_PERSIST_MODE="init"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"           # 是否部署密钥管理

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
# 依赖关系：
#   1. Secrets 必须最先部署（RabbitMQ 主部署需要它来拉取镜像和认证）
#   2. Middleware 必须在 Ingress 之前（IngressRoute 需要引用 Middleware）
#   3. Ingress 最后部署（依赖于 Middleware 和 Service）
secrets_priority=1000         # 密钥管理优先级最高（最先部署）
middleware_priority=100       # 中间件优先级中等（第二部署）
ingress_priority=10           # Ingress 优先级最低（最后部署）

