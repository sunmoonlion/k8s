apiVersion: v1
kind: Secret
metadata:
  name: tools-web-frontend-secret
  namespace: ${NAMESPACE}
  labels:
    app: tools-web-frontend
type: Opaque
stringData:
  # Casdoor 客户端密钥（BFF 服务端使用，不暴露给浏览器）
  CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET}"

  # Redis 完整 URI（含密码，用于 session 存储）
  REDIS_URL: "${REDIS_URL}"
