apiVersion: v1
kind: Secret
metadata:
  name: incubator-app-bff-secret
  namespace: ${NAMESPACE}
  labels:
    app: incubator-app-bff
type: Opaque
stringData:
  # 应用密钥
  SECRET_KEY: changeme
  TOTP_SECRET_KEY: changeme

  # 数据库/图数据库认证
  POSTGRES_PASSWORD: changeme
  NEO4J_PASSWORD: changeme

  # 管理员账户
  FIRST_SUPERUSER: admin@example.com
  FIRST_SUPERUSER_PASSWORD: changeme

  # SMTP / 监控
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SENTRY_DSN: ""

