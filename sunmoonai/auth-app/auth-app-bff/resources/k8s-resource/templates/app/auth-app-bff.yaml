apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: auth-app-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-app-bff
  template:
    metadata:
      labels:
        app: auth-app-bff
    spec:
      imagePullSecrets:
      - name: ${AUTH_APP_BFF_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: auth-app-bff
        # Harbor 镜像路径：仓库/项目/镜像名:标签
        # 由 deploy-auth-app-bff.sh 计算并导出 AUTH_APP_BFF_FULL_IMAGE_NAME
        image: ${AUTH_APP_BFF_FULL_IMAGE_NAME}
        # Always: 总是从 Harbor 拉取最新版本，避免使用节点本地的旧镜像
        # 注意：如果使用 IfNotPresent，节点本地有旧镜像时不会从 Harbor 拉取，导致使用旧版本
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        ports:
        - containerPort: 3030
        envFrom:
        - configMapRef:
            name: ${AUTH_APP_BFF_CONFIGMAP_NAME:-auth-app-bff-config}
        - secretRef:
            name: ${AUTH_APP_BFF_SECRET_NAME:-auth-app-bff-secret}
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3030
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3030
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data-storage
          mountPath: ${PVC_MOUNT_PATH:-/app/data}
          subPath: ${PVC_SUB_PATH:-}
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: ${PVC_NAME:-auth-app-bff-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: auth-app-bff
spec:
  selector:
    app: auth-app-bff
  ports:
  - port: 3030
    targetPort: 3030
    protocol: TCP
  type: ClusterIP

