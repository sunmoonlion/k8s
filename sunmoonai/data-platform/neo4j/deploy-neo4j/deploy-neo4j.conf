# Neo4j 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
NEO4J_PROJECT_ID="sunmoonai"
NEO4J_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
NEO4J_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
NEO4J_IMAGE_PROJECT="k8s-images"                     # 镜像项目名

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# NEO4J_FORCE_OFFLINE="true"          # 离线模式：强制离线部署

# 访问与端口配置
NEO4J_TLS_ENABLED="false"                    # Neo4j通常不需要TLS
NEO4J_UNIFIED_HOST="llmops.sunmoonai.com"       # 统一域名（用于路径前缀路由）

# Neo4j Secret 配置
NEO4J_AUTH_SECRET_NAME="neo4j-secrets"                    # Neo4j 认证 Secret 名称
NEO4J_AUTH_SECRET_PASSWORD_KEY="neo4j-password"          # Neo4j 认证 Secret 密码键名
NEO4J_DATABASE_SECRET_NAME="neo4j-database-secrets"      # Neo4j 数据库 Secret 名称

# 是否在部署 Neo4j 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 Neo4j 可能会形成自依赖循环（部署 Neo4j 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：Neo4j 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
NEO4J_FORCE_OFFLINE="false"

# 镜像版本配置（以 Harbor 物料为准）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，Neo4j Chart会自动使用最新版本的镜像
# bitnami/neo4j:5.26.11-debian-12-r0
NEO4J_IMAGE_VERSION="5.26.11-debian-12-r0"
# bitnami/os-shell:12-debian-12-r51
NEO4J_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"          # 是否部署密钥管理

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等
secrets_priority=10           # 密钥管理优先级最低（最后部署）

