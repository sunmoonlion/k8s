# PostgreSQL 开发环境配置（复用持久化数据版本）
# 基于 dev-values.yaml，调整持久化为使用静）PVC）
# - 静）PV/PVC：postgresql-sunmoonai-dev-pv / postgresql-sunmoonai-dev-pvc
# - 参见：data-platform/postgresql/deploy-postgresql/postgresql-dev-pv-pvc.yaml

global:
  imageRegistry: "{{POSTGRESQL_IMAGE_REGISTRY}}"
  imagePullSecrets:
    - name: "{{POSTGRESQL_IMAGE_PULL_SECRET_NAME}}"
  defaultStorageClass: ""

nameOverride: ""
fullnameOverride: ""

commonLabels:
  app.kubernetes.io/name: "postgresql"
  app.kubernetes.io/instance: "{{POSTGRESQL_PROJECT_ID}}"
  app.kubernetes.io/component: "postgresql"
  app.kubernetes.io/environment: "development"
  app.kubernetes.io/part-of: platform
  app.kubernetes.io/managed-by: helm

image:
  registry: "{{POSTGRESQL_IMAGE_REGISTRY}}"
  repository: "{{POSTGRESQL_IMAGE_PROJECT}}/postgresql"
  tag: "17.6.0-debian-12-r4"
  pullPolicy: "IfNotPresent"

tls:
  enabled: {{POSTGRESQL_TLS_ENABLED}}
  autoGenerated: {{POSTGRESQL_TLS_AUTO_GENERATED}}
  preferServerCiphers: true
  certificatesSecret: "{{POSTGRESQL_TLS_CERTIFICATES_SECRET}}"
  certFilename: "{{POSTGRESQL_TLS_CERT_FILENAME}}"
  certKeyFilename: "{{POSTGRESQL_TLS_CERT_KEY_FILENAME}}"
  certCAFilename: "{{POSTGRESQL_TLS_CERT_CA_FILENAME}}"

auth:
  enablePostgresUser: true
  existingSecret: "{{POSTGRESQL_AUTH_SECRET_NAME}}"
  secretKeys:
    adminPasswordKey: "{{POSTGRESQL_AUTH_SECRET_ADMIN_PASSWORD_KEY}}"
    userPasswordKey: "{{POSTGRESQL_AUTH_SECRET_DEV_PASSWORD_KEY}}"
  database: "mydb"
  username: "sunmoonai_dev"

primary:
  # 持久化：改为使用静）PVC（postgresql-sunmoonai-dev-pvc），用于重建集群时复用老数据盘
  persistence:
    enabled: true
    existingClaim: postgresql-sunmoonai-dev-pvc
    storageClass: ""        # 使用 existingClaim，不走动）local-path
    size: "8Gi"
    accessModes:
      - "ReadWriteOnce"

  service:
    type: "ClusterIP"
    ports:
      postgresql: 5432

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5
    successThreshold: 1

  initdb:
    scripts:
      create-llmops-db.sql: |
        CREATE DATABASE llmops_db;

      create-auth-db.sql: |
        CREATE DATABASE auth_db;

      grant-db-permissions.sql: |
        GRANT ALL PRIVILEGES ON DATABASE llmops_db TO sunmoonai_dev;
        GRANT ALL PRIVILEGES ON DATABASE auth_db TO sunmoonai_dev;

volumePermissions:
  enabled: true

readReplicas:
  replicaCount: 0
  enabled: false

metrics:
  enabled: false

ingress:
  enabled: false

postgresqlConfiguration:
  ssl: "off"
  maxConnections: 50
  sharedBuffers: "128MB"
  effectiveCacheSize: "512MB"
  maintenanceWorkMem: "32MB"

pgHbaConfiguration: |
  # TYPE  DATABASE        USER            ADDRESS                 METHOD
  local   all             all                                     trust
  host    all             all             127.0.0.1/32            md5
  host    all             all             ::1/128                 md5
  host    all             all             0.0.0.0/0               md5

