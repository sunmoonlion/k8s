# Llm Admin Frontend 路由配置 (Traefik IngressRoute)
# CSR SPA（Vue3 + Vite），nginx 静态服务，所有路由交给前端 Router 处理。
#
# 访问方式：
# - https://llm-admin.sunmoonai.com/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-admin-frontend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llm-admin-frontend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
