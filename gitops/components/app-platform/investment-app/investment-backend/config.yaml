# 投资应用基础运行配置；跨应用业务、模型Key和执行环境另行接入验收。
---
investment_backend_deployment:
  database: investment
  database_runtime_user: investment_runtime
  database_migrator_user: investment_migrator
  database_extensions: []
  database_bootstrap_revision: v1
  migration_job_revision: v3
  expected_schema_revision: '20260929_0012'
  private_dir: /etc/sunmoon/applications/sunmoon-kind/investment
  backup_dir: /mnt/sunmoon-data/backups/applications/sunmoon-kind/investment
  deploy_budget_bytes: 2147483648
  redis_user: investment_runtime
  redis_key_pattern: investment:*
  redis_identity_revision: v2
  rabbitmq_user: investment_runtime
  rabbitmq_vhost: investment
  rabbitmq_queue: investment.default
  rabbitmq_identity_revision: v2
  identity_organization: built-in
  identity_revision: v2
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    api:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: '2'
        memory: 768Mi
    worker:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    scheduler:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    runner:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: '1'
        memory: 512Mi
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
  domain_runtime_env: {}
  # 0010：工作台（0001-workbench）。沙箱、会合点、供给器在各自的组件；这里只是地址与开关。
  cross_app_enabled: true
  runner_replicas: 1
  domain_env:
    WORKBENCH_ENABLED: 'true'
    WORKBENCH_REDIS_KEY_PREFIX: 'investment:workbench'
    WORKBENCH_ENVIRONMENT_KEY: user-pc
    WORKBENCH_POLL_SECONDS: '1.0'
    WORKBENCH_RUNNER_ID: '{{ cluster_name }}-r1'
    WORKBENCH_PROVISIONER_URL: 'http://sandbox-provisioner.{{ sandbox_namespace }}.svc.cluster.local:8080'
    WORKBENCH_RELAY_ADMIN_URL: 'ws://relay.{{ relay_namespace }}.svc.cluster.local:47100'
    WORKBENCH_RELAY_PUBLIC_URL: 'wss://relay.sunmoonai.com:{{ entry_port }}'
    WORKBENCH_TOKEN_ISSUER: sunmoon-workbench
    WORKBENCH_SANDBOX_MODEL_PROVIDER: kimi
    WORKBENCH_SANDBOX_MODEL: kimi-k3
    WORKBENCH_SANDBOX_PROVIDER_BASE_URL: https://api.moonshot.cn/v1
    WORKBENCH_RECORDS_MCP_ENABLED: 'true'
    WORKBENCH_RECORDS_MCP_URL: 'http://investment-api.{{ app_namespace }}.svc.cluster.local:8000/api/mcp/workbench'
  domain_secrets:
    # Fernet 密钥（后端用 cryptography.Fernet 加密用户的模型 key）：2026-10-06 第 7 步登记 key 报 internal_error，原因是默认的 40 位随机串不是 Fernet 格式
    WORKBENCH_CREDENTIAL_KEY: {source: random, format: fernet}
    WORKBENCH_PROVISIONER_TOKEN: {source: component-input, name: sandbox-provisioner, key: token}
    WORKBENCH_RELAY_ADMIN_TOKEN: {source: component-input, name: relay, key: admin_token}
    WORKBENCH_TOKEN_SIGNING_KEY: {source: workbench-signing, key: private_key_pem}
  domain_secrets_roles: [api, runner]
  domain_egress:
    - {name: provisioner, roles: [api], namespace_var: sandbox_namespace, pod_labels: {app.kubernetes.io/name: sandbox-provisioner}, ports: [8080]}
    # runner 也要到会合点的管理口：它隔 10 秒问一次谁在线，登记「我的机器」、置在线离线（账 49）
    - {name: relay-admin, roles: [api, runner], namespace_var: relay_namespace, pod_labels: {app.kubernetes.io/name: relay}, ports: [47100]}
    - {name: sandboxes, roles: [runner], namespace_var: sandbox_namespace, pod_labels: {sunmoonai.com/sandbox: 'true'}, ports: [47800]}
  domain_ingress:
    - {name: sandboxes, namespace_var: sandbox_namespace, pod_labels: {sunmoonai.com/sandbox: 'true'}}

  # 所有者 2026-09-29 定：撤销 investment → knowledge 的检索身份（没有使用方了）。
  # 2026-10-06 暂时保留：knowledge 的接收端把 ingest 与 retrieve 两个绑定写死成一对（阶段依赖、校验、运行声明、
  # 检查都按两个来），关掉这一个要先改共用模板。待办 23 撞上了，先按原样部署，撤销另开一轮（迁移账本 21）。
  knowledge_service:
    enabled: true
    application: sunmoonai-investment-knowledge-retrieve
    client_id: sunmoon-investment-knowledge-retrieve
    organization: sunmoon-workload-investment-knowledge
    scope: knowledge:retrieve
    job_revision: v1
    token_seconds: 900
