# ============================================================================
# Tools Web Backend 部署配置
# 文件名: deploy-tools-web-backend.conf
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：用于生成 YAML 的数据内容在 generate-*.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 基础配置（默认值，可通过命令行参数覆盖）
TOOLS_WEB_BACKEND_PROJECT_ID="${TOOLS_WEB_BACKEND_PROJECT_ID:-sunmoonai}"
TOOLS_WEB_BACKEND_NAMESPACE="${TOOLS_WEB_BACKEND_NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"   # production|development
TOOLS_WEB_BACKEND_SOURCE_ROOT="${TOOLS_WEB_BACKEND_SOURCE_ROOT:-${HOME}/tools-app/tools-web-backend}"
TOOLS_WEB_BACKEND_DB_BOOTSTRAP_ENABLED="${TOOLS_WEB_BACKEND_DB_BOOTSTRAP_ENABLED:-true}"

# 镜像仓库地址按集群覆盖：远程集群默认走标准域名，Kind 通过 NodePort 暴露 Harbor。
C1_TOOLS_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com"
C2_TOOLS_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com"
C3_TOOLS_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com"
KIND_TOOLS_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
C1_DOCKER_SERVER="harbor.sunmoonai.com"
C2_DOCKER_SERVER="harbor.sunmoonai.com"
C3_DOCKER_SERVER="harbor.sunmoonai.com"
KIND_DOCKER_SERVER="harbor.sunmoonai.com:30443"

# 组件开关（控制是否部署）
namespace_enabled="true"    # Namespace（命名空间，应在所有资源之前创建）
secrets_enabled="true"      # Secrets（已与 ConfigMaps 分离）
configmap_enabled="true"    # ConfigMaps（已与 Secrets 分离）
middleware_enabled="false"  # Middleware（stripprefix 已集成到 ingress.yaml 中，保留用于未来扩展）
ingress_enabled="true"      # Ingress（HTTP 路由）

# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
namespace_priority=3000     # Namespace 优先级（最高，应在所有资源之前）
secrets_priority=2000       # Secrets 优先级
configmap_priority=1900    # ConfigMaps 优先级
middleware_priority=1000    # Middleware 优先级
ingress_priority=100        # Ingress 优先级（最低）

# 推送后清理远程 tar 包开关（预留，与模板保持一致）
