            name: info-backend-elasticsearch
        - secretRef:
            name: info-backend-elasticsearch
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-runtime
              key: WORKER_DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-runtime
              key: WORKER_CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: info-backend-runtime
              key: WORKER_CELERY_RESULT_BACKEND
              optional: true
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PASSWORD
        readinessProbe:
          exec:
            command:
            - python
            - -m
            - app.cli.worker_readiness
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: elasticsearch-ca
          mountPath: /var/run/secrets/sunmoonai/elasticsearch
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: elasticsearch-ca
        secret:
          secretName: info-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
