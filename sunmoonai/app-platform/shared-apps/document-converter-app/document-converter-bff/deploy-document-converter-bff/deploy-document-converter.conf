# Document Converter 部署配置

# 基础配置
DOCUMENT_CONVERTER_PROJECT_ID="sunmoonai"
DOCUMENT_CONVERTER_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像仓库配置（集群1 - Harbor）
# Harbor 在集群1，通过外部地址访问
DOCUMENT_CONVERTER_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"  # 集群1的 Harbor 外部地址
DOCUMENT_CONVERTER_IMAGE_PROJECT="k8s-images"
DOCUMENT_CONVERTER_IMAGE_NAME="document-converter"
DOCUMENT_CONVERTER_IMAGE_TAG="1.0"

# 部署模式配置
DEPLOYMENT_MODE="online"
ENABLE_OFFLINE_IMAGE_CHECK="false"

# 访问与端口配置
DOCUMENT_CONVERTER_UNIFIED_HOST="www.sunmoonai.com"
DOCUMENT_CONVERTER_SERVICE_PORT="8000"

# 服务配置
DOCUMENT_CONVERTER_REPLICAS="2"
DOCUMENT_CONVERTER_CPU_REQUEST="500m"
DOCUMENT_CONVERTER_CPU_LIMIT="1000m"
DOCUMENT_CONVERTER_MEMORY_REQUEST="512Mi"
DOCUMENT_CONVERTER_MEMORY_LIMIT="1Gi"

# 子级部署控制
secrets_enabled="true"              # 是否部署 Secrets（如 harbor-registry-secret）
middleware_enabled="true"
ingress_enabled="false"             # 是否部署 Ingress（纯 API 服务，如果仅内部调用可设为 false）

# 部署优先级
middleware_priority=1000
ingress_priority=100

# 镜像推送控制
PUSH_IMAGES_BEFORE_DEPLOY="false"
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

