apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-admin-frontend-ingress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info-r5
    sunmoonai.com/managed-by: architecture-v2
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`info-admin.sunmoonai.com`) && PathPrefix(`/api`)
    services:
    - name: info-r5-backend
      port: 8000
    priority: 100
  - kind: Rule
    match: Host(`info-admin.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: info-r5-admin-frontend
      port: 3000
    priority: 10
  tls:
    secretName: info-r5-tls
---
