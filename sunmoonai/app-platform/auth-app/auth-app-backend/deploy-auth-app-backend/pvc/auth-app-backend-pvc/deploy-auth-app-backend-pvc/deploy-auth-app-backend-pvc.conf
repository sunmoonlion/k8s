# ============================================================================
# Auth App BFF PVC 部署配置
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：PVC 的数据内容在 generate-auth-app-backend-pvc.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
AUTH_APP_BFF_pvc_enabled="${AUTH_APP_BFF_pvc_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
# PVC 应该在应用之前部署
AUTH_APP_BFF_pvc_priority="${AUTH_APP_BFF_pvc_priority:-2100}"

# 组件描述（用于日志输出）
AUTH_APP_BFF_pvc_description="${AUTH_APP_BFF_pvc_description:-Auth App BFF PVC}"
