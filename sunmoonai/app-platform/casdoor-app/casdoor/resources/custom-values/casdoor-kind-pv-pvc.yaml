apiVersion: v1
kind: PersistentVolume
metadata:
  name: casdoor-sunmoonai-dev-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kind-local-storage/casdoor
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [kind-worker]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casdoor-sunmoonai-dev-pvc
  namespace: app-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: casdoor-sunmoonai-dev-pv
