apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker-investment-web-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-investment-web-backend
    component: celery-worker
    backend: investment-web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celeryworker-investment-web-backend
  template:
    metadata:
      labels:
        app: celeryworker-investment-web-backend
        component: celery-worker
        backend: investment-web-backend
    spec:
      imagePullSecrets:
      - name: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      initContainers:
      - name: declare-rabbitmq-queue
        image: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        envFrom:
        - configMapRef:
            name: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-celeryworker-investment-web-backend-config}
        - secretRef:
            name: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_SECRET_NAME:-celeryworker-investment-web-backend-secret}
        command:
        - python
        - -c
        - |
          import os
          import sys
          import time
          from kombu import Connection, Queue

          broker_url = os.environ["CELERY_BROKER_URL"]
          queue_name = os.environ["CELERY_QUEUE"]
          last_error = None
          for attempt in range(1, 31):
              try:
                  with Connection(broker_url) as conn:
                      Queue(queue_name, durable=True).bind(conn).declare()
                  print(f"declared RabbitMQ queue: {queue_name}")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"queue declare failed ({attempt}/30): {exc}", flush=True)
                  time.sleep(2)
          raise SystemExit(f"failed to declare RabbitMQ queue {queue_name}: {last_error}")
      containers:
      - name: celeryworker
        image: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -n "$(printenv CELERY_INCLUDE_MODULES)" ]; then
            exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
              -I "$(printenv CELERY_INCLUDE_MODULES)" \
              -l "$(printenv CELERY_LOG_LEVEL)" \
              -Q "$(printenv CELERY_QUEUE)" \
              -c "$(printenv CELERY_CONCURRENCY)"
          fi
          exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
            -l "$(printenv CELERY_LOG_LEVEL)" \
            -Q "$(printenv CELERY_QUEUE)" \
            -c "$(printenv CELERY_CONCURRENCY)"
        envFrom:
        - configMapRef:
            name: ${INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-investment-web-backend-config}
        - secretRef:
            name: ${INVESTMENT_WEB_BACKEND_SECRET_NAME:-investment-web-backend-secret}
        - configMapRef:
            name: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-celeryworker-investment-web-backend-config}
        - secretRef:
            name: ${CELERYWORKER_INVESTMENT_WEB_BACKEND_SECRET_NAME:-celeryworker-investment-web-backend-secret}
        env:
        - name: CELERY_PRODUCER_SERVICE
          value: "investment-web-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 10
          periodSeconds: 15
