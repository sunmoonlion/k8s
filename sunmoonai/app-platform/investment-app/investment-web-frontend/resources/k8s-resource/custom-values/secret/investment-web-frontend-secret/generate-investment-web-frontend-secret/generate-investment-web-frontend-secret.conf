# ============================================================================
# Investment Web Frontend Secret YAML 生成配置
# 字段来源：investment-web-frontend/app/.env.example（敏感字段）
# ⚠️ 含真实密钥，绝不提交 git（已在 .gitignore 中排除）
# 使用前：cp generate-investment-web-frontend-secret.conf.example \
#            generate-investment-web-frontend-secret.conf
#         然后填入真实密钥
# ============================================================================

TEMPLATE_FILE="templates/secret/investment-web-frontend-secret.yaml"
OUTPUT_FILE="investment-web-frontend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息）
# ============================================================================
# Casdoor 客户端密钥（BFF 服务端使用，不暴露给浏览器）
CASDOOR_CLIENT_SECRET="${CASDOOR_CLIENT_SECRET:-changeme}"

# Redis 完整 URI（含密码，用于 session 存储）
# k8s 内部地址：redis-sunmoonai.data-platform-dev.svc.cluster.local:6379
REDIS_URL="${REDIS_URL:-redis://:changeme@redis-sunmoonai.data-platform-dev.svc.cluster.local:6379}"
