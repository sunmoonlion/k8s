# ============================================================================
# Neo4j Incubator DB Secret YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/secret/neo4j-incubator-db-secret.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="neo4j-incubator-db-secret-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="secret"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-celeryworker-incubator.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# Neo4j Secret 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 Neo4j Secret YAML 文件
# ============================================================================
# Secret 名称
NEO4J_SECRET_NAME="${NEO4J_SECRET_NAME:-neo4j-incubator-db-secret}"

# Neo4j 连接配置
NEO4J_SERVER="${NEO4J_SERVER:-101.126.151.0}"
NEO4J_PORT="${NEO4J_PORT:-7687}"
NEO4J_USERNAME="${NEO4J_USERNAME:-neo4j}"
NEO4J_PASSWORD="${NEO4J_PASSWORD:-Ne!o1359admin}"
NEO4J_BOLT="${NEO4J_BOLT:-bolt}"
NEO4J_AUTH="${NEO4J_AUTH:-neo4j}"

# Neo4j Bolt URL（完整连接字符串）
# 格式：bolt://username:password@host:port
NEO4J_BOLT_URL="${NEO4J_BOLT_URL:-bolt://${NEO4J_USERNAME}:${NEO4J_PASSWORD}@${NEO4J_SERVER}:${NEO4J_PORT}}"

# Neo4j 其他配置（非敏感配置，通常放在 ConfigMap，但也可以放在 Secret 中）
NEO4J_FORCE_TIMEZONE="${NEO4J_FORCE_TIMEZONE:-True}"
NEO4J_AUTO_INSTALL_LABELS="${NEO4J_AUTO_INSTALL_LABELS:-True}"
NEO4J_MAX_CONNECTION_POOL_SIZE="${NEO4J_MAX_CONNECTION_POOL_SIZE:-50}"

