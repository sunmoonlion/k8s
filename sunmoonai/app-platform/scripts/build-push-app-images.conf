# 应用构建与离线制品配置；由 build-push-app-images.sh 读取。
# 优先级：显式环境变量 > 本文件 > 脚本默认值。
# 本地/云使用同一仓库域名；CLUSTER 仅记录用途，不决定仓库地址。
# 云端执行未经实机验证。脚本默认计划，不直接发布。
DEFAULT_CLUSTER="KIND"
TAG="architecture-v2-dev"  # 本地候选标识；不创建远端同名 tag
TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
PLATFORM="linux/amd64"
PROGRESS="auto"
NO_CACHE="true"
START_FROM=""
DRY_RUN="true"

# 留空时脚本使用与本 k8s 仓并列的四个应用仓所在目录。
SOURCE_ROOT=""
APPS="tpl info knowledge investment"
COMPONENTS="backend admin-frontend web-frontend"

# 实际构建前必须准备：Git 外的绝对目录；每次自动创建独立 app-build.* 子目录。
# 同时须准备 PUBLICATION_SETTINGS 内 work_root，并按磁盘余量控制构建规模。
ARTIFACT_ROOT=""
# 留空使用 registry-platform/config/build-publication.local.json。
# 云端用同结构文件显式设置本机已核验的 Skopeo 路径及摘要。
PUBLICATION_SETTINGS=""

# 构建依赖源保留；构建阶段依赖仍须事先备齐，不等于离线依赖闭包已验收。
PYPI_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"
DEBIAN_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian"
DEBIAN_SECURITY_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian-security"
NPM_REGISTRY="https://registry.npmmirror.com"
