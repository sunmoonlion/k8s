apiVersion: batch/v1
kind: Job
metadata: {name: mongodb-initialize-v2, namespace: data-platform-dev}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 240
  template:
    metadata: {labels: {app.kubernetes.io/name: mongodb-initialize}}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: initialize
          image: harbor.sunmoonai.com:30443/platform/mongodb@sha256:17148334f6b0a4fad09ad70f6449cf4d0330bbf49469b6dff4338123a5f7bcbf
          command: [mongosh, --quiet, --nodb, --file, /settings/initialize.js]
          env:
            - {name: HOME, value: /tmp}
            - {name: MONGODB_HOST, value: 'mongodb.data-platform-dev.svc.cluster.local'}
            - {name: MONGODB_PORT, value: '27017'}
            - {name: MONGODB_REPLICA_SET, value: 'sunmoon'}
            - {name: MONGODB_ACCEPTANCE_DATABASE, value: 'sunmoon_acceptance'}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: settings, mountPath: /settings, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: auth, secret: {secretName: mongodb-initialize-auth, defaultMode: 0440}}
        - {name: settings, configMap: {name: mongodb-settings}}
        - {name: tmp, emptyDir: {sizeLimit: 32Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mongodb-initialize-egress, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mongodb-initialize}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: mongodb}}
      ports: [{protocol: TCP, port: 27017}]
