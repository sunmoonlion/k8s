# SSH 密码 (使用私钥时可选)
pass=
# Sudo 密码
sudo_pass=
# 本地绑定端口 (用于端口转发)
local_port=6441
# 远程 Kubernetes API 端口 (内网地址)
remote_api_port=6443
# 远程 Kubernetes API 地址 (内网地址)
remote_api_host=192.168.2.50
# Kubeconfig 保存路径
kubeconfig=~/.kube/cluster-c1-admin.conf
# 绑定 API IP 到本地别名 (true/false)
bind_alias=true

