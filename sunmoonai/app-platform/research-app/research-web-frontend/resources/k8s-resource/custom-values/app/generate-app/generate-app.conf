# ============================================================================
# research-web-frontend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/research-web-frontend.yaml"
OUTPUT_FILE="research-web-frontend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
RESEARCH_WEB_FRONTEND_IMAGE_REGISTRY="${RESEARCH_WEB_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_RESEARCH_WEB_FRONTEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
RESEARCH_WEB_FRONTEND_IMAGE_PROJECT="${RESEARCH_WEB_FRONTEND_IMAGE_PROJECT:-app-images}"
RESEARCH_WEB_FRONTEND_IMAGE="${RESEARCH_WEB_FRONTEND_IMAGE:-research-web-frontend}"
RESEARCH_WEB_FRONTEND_TAG="${RESEARCH_WEB_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
RESEARCH_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME="${RESEARCH_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
RESEARCH_WEB_FRONTEND_SECRET_NAME="${RESEARCH_WEB_FRONTEND_SECRET_NAME:-research-web-frontend-secret}"
RESEARCH_WEB_FRONTEND_CONFIGMAP_NAME="${RESEARCH_WEB_FRONTEND_CONFIGMAP_NAME:-research-web-frontend-config}"
RESEARCH_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME="${RESEARCH_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME:-}"
RESEARCH_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME="${RESEARCH_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME:-}"
RESEARCH_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME="${RESEARCH_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME:-}"
RESEARCH_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME="${RESEARCH_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME:-}"
RESEARCH_WEB_FRONTEND_POSTGRESQL_SECRET_NAME="${RESEARCH_WEB_FRONTEND_POSTGRESQL_SECRET_NAME:-}"
RESEARCH_WEB_FRONTEND_REDIS_SECRET_NAME="${RESEARCH_WEB_FRONTEND_REDIS_SECRET_NAME:-}"
RESEARCH_WEB_FRONTEND_MONGODB_SECRET_NAME="${RESEARCH_WEB_FRONTEND_MONGODB_SECRET_NAME:-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-research-web-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
