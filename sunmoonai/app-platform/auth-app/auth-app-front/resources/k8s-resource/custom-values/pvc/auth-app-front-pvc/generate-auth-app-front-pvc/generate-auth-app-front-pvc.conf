# ============================================================================
# Auth App Front PVC YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/pvc/auth-app-front-pvc.yaml"
OUTPUT_FILE="auth-app-front-pvc-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="pvc"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# PVC 数据内容
# ============================================================================
PVC_NAME="${PVC_NAME:-auth-app-front-pvc}"
PVC_STORAGE_CLASS="${PVC_STORAGE_CLASS:-local-path}"
PVC_ACCESS_MODE="${PVC_ACCESS_MODE:-ReadWriteOnce}"
PVC_STORAGE_SIZE="${PVC_STORAGE_SIZE:-5Gi}"
