# ============================================================================
# Celery Worker (LLMOps) YAML 生成配置
# ============================================================================

# 需要生成的资源列表
# 格式：资源类型:模板路径:输出文件名:是否启用
# 注意：Celery Worker 是纯后台任务处理，不需要 Service 和 Ingress
# 监控通过 Flower 服务统一管理（通过 Celery broker 连接）
GENERATE_RESOURCES=(
    "app:templates/app/celeryworker-llmops.yaml:celeryworker-llmops-generated.yaml:true"
    "configmap:templates/configmap/celeryworker-config.yaml:celeryworker-config-generated.yaml:true"
    "secret:templates/secret/postgresql-llmops-db-secret.yaml:postgresql-llmops-db-secret-generated.yaml:true"
    "secret:templates/secret/neo4j-llmops-db-secret.yaml:neo4j-llmops-db-secret-generated.yaml:true"
    "secret:templates/secret/harbor-registry-secret.yaml:harbor-registry-secret-generated.yaml:true"
)

# 生成顺序
GENERATE_ORDER=(
    "configmap:app"
    "secret:app"
)

# 部署配置路径
DEPLOY_CONFIG="../../deploy-celeryworker-llmops/deploy-celeryworker-llmops.conf"
