---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: data-platform-dev
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: service, port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data-platform-dev
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: service, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data-platform-dev
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: sunmoon-platform}
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: sunmoon-kind-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: initialize-acl-file
          image: harbor.sunmoonai.com:30443/platform/redis@sha256:7ef5b5cec96495a04ca7feff88a9492efeab8053fb284d24bdd73344c9245a48
          command: [/bin/sh, -ec]
          args:
            - |
              test ! -L /data/users.acl
              if [ ! -e /data/users.acl ]; then
                umask 077
                digest=$(sha256sum /run/auth/password)
                digest=${digest%% *}
                pending=$(mktemp /data/.users.acl.XXXXXX)
                trap 'rm -f "$pending"' EXIT
                printf 'user default on #%s ~* &* +@all\n' "$digest" > "$pending"
                mv "$pending" /data/users.acl
              fi
              test -f /data/users.acl
              test -s /data/users.acl
              test -r /data/users.acl
              chmod 600 /data/users.acl
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: auth, mountPath: /run/auth, readOnly: true}
      containers:
        - name: redis
          image: harbor.sunmoonai.com:30443/platform/redis@sha256:7ef5b5cec96495a04ca7feff88a9492efeab8053fb284d24bdd73344c9245a48
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 512Mi}
          ports:
            - {name: service, containerPort: 6379}
          command: [redis-server, /run/auth/redis.conf]
          startupProbe:
            exec: {command: [/bin/sh, -ec, 'REDISCLI_AUTH="$(cat /run/auth/password)" redis-cli ping | grep -qx PONG']}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec: {command: [/bin/sh, -ec, 'REDISCLI_AUTH="$(cat /run/auth/password)" redis-cli ping | grep -qx PONG']}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: redis-data}}
        - {name: auth, secret: {secretName: redis-auth, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
