# ============================================================================
# Document Converter BFF ConfigMap 部署配置
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：ConfigMap 的数据内容在 generate-document-converter-config.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 基础配置（默认值，可通过主配置或命令行参数覆盖）
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
document_converter_config_enabled="${document_converter_config_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
document_converter_config_priority="${document_converter_config_priority:-500}"

# 组件描述（用于日志输出）
document_converter_config_description="${document_converter_config_description:-Document Converter BFF ConfigMap}"

