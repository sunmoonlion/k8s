apiVersion: v1
kind: ConfigMap
metadata:
  name: incubator-app-front-config
  namespace: ${NAMESPACE}
  labels:
    app: incubator-app-front
data:
  # 服务器与域名
  SERVER_NAME: "incubator-front.sunmoonai.com"
  SERVER_HOST: "https://incubator-front.sunmoonai.com"

  # Nuxt SSR 运行配置（非敏感）
  NODE_ENV: "production"
  APP_ENV: "production"
  NITRO_HOST: "0.0.0.0"
  NITRO_PORT: "3000"
  NUXT_TELEMETRY_DISABLED: "1"

  # 后端 API 地址（按需调整）
  BACKEND_API_URL: "${BACKEND_API_URL:-http://backend-backend.app-platform-dev}"

  # ========================================================================
  # 业务 BFF 配置（联动配置 - 调用 incubator-app-backend）
  # ========================================================================
  VUE_APP_BFF_URL: "${VUE_APP_BFF_URL:-http://incubator-app-backend:8000}"
  INCUBATOR_BFF_URL: "${INCUBATOR_BFF_URL:-http://incubator-app-backend:8000}"
  VUE_APP_API_VERSION: "${VUE_APP_API_VERSION:-v1}"

  # ========================================================================
  # Session 配置（联动配置 - 必须与 auth-app-backend 一致）
  # ========================================================================
  SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-sunmoonai_session}"

