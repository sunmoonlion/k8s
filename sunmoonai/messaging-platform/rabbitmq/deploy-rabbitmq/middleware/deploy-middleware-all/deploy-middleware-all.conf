# RabbitMQ 中间件总控部署配置

# 基础配置
RABBITMQ_PROJECT_ID="sunmoonai"
RABBITMQ_NAMESPACE="messaging-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 注意：RabbitMQ 管理界面不支持路径前缀配置（与 Mongo Express、RedisInsight、Flower 不同）
# 因此必须使用 stripPrefix 中间件来处理路径前缀
# 参考：https://www.rabbitmq.com/management.html
rabbitmq_stripprefix_enabled="true"  # StripPrefix 中间件（路径前缀处理，必需）
rabbitmq_policy_enabled="true"        # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
rabbitmq_stripprefix_priority=200  # StripPrefix 先部署（路径前缀处理要先配置）
rabbitmq_policy_priority=100       # Policy 后部署（依赖路径前缀已存在）

