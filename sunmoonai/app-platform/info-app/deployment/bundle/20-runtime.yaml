    metadata:
      labels:
        app.kubernetes.io/name: info-backend
        app.kubernetes.io/component: backend-worker
        app.kubernetes.io/part-of: info
        sunmoonai.com/app: info
        sunmoonai.com/managed-by: app-platform-v2
      annotations:
        sunmoonai.com/release-id: kind-b7-20260919
        sunmoonai.com/config-sha256: 6ad5604f3630a6415078461ea705064a13d2694408daeb503f58b95fffdf34d8
        sunmoonai.com/source-commit: e5156a0bfc0d5ca9118128427dcacb69697a0737
    spec:
      serviceAccountName: info-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/info-backend@sha256:ec9e1da89285ec0e85d12ff51e25ce42c713b604989f9f8ba6c7812ff517c4aa
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
