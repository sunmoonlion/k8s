# ============================================================================
# Auth App BFF Secret YAML 生成配置
# 职责：配）YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）# 生成脚本）K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路
TEMPLATE_FILE="templates/secret/auth-app-backend-secret.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="auth-app-backend-secret-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="secret"

# ============================================================================
# 基础配置（用于生）YAML）# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）#   2. 主应用的 deploy-auth-app-backend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）# ============================================================================
# 命名空间和环境配
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认）
# ============================================================================
# Secret 数据内容（用于生）YAML）# 注意：这些数据会被用于生）Secret YAML 文件
# ⚠️ 敏感信息：请妥善保管此配置文）# ============================================================================
# 应用密钥（⚠）必须修改为安全的随机字符串）
SECRET_KEY="${SECRET_KEY:-changeme}"
TOTP_SECRET_KEY="${TOTP_SECRET_KEY:-changeme}"

# 数据）图数据库认证（⚠）必须修改为实际密码）
POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-Po!s1359}"
NEO4J_PASSWORD="${NEO4J_PASSWORD:-Ne!o1359admin}"

# PostgreSQL 完整连接字符串（包含密码，⚠）敏感信息）# 注意：生成脚本会自动）ConfigMap 读取 POSTGRES_SERVER, POSTGRES_PORT, POSTGRES_USER, POSTGRES_DB
# 并组装完整连接字符串。如果已设置 DB_URL，则使用设置的值；否则由脚本自动生
DB_URL="${DB_URL:-}"

# Neo4j 完整连接字符串（包含密码，⚠）敏感信息）# 注意：生成脚本会自动）ConfigMap 读取 NEO4J_SERVER, NEO4J_PORT, NEO4J_USERNAME, NEO4J_BOLT
# 并组装完整连接字符串。如果已设置 NEO4J_BOLT_URL，则使用设置的值；否则由脚本自动生）NEO4J_BOLT_URL="${NEO4J_BOLT_URL:-}"

# DB_* 格式字段（兼容性，⚠️ 敏感信息
DB_PASSWORD="${DB_PASSWORD:-${POSTGRES_PASSWORD}}"  # 数据库密码（）POSTGRES_PASSWORD 对应）
# 管理员账户（⚠️ 必须修改为实际值）
FIRST_SUPERUSER="${FIRST_SUPERUSER:-admin@sunmoonai.com}"
FIRST_SUPERUSER_PASSWORD="${FIRST_SUPERUSER_PASSWORD:-zym123}"

# SMTP / 监控（可选）
SMTP_USER="${SMTP_USER:-}"
SMTP_PASSWORD="${SMTP_PASSWORD:-}"
SENTRY_DSN="${SENTRY_DSN:-}"
