apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: toutiao-app-backend-pvc
  namespace: ${NAMESPACE:-invest-app-dev}
  labels:
    app: toutiao-app-backend
spec:
  accessModes:
    - ${PVC_ACCESS_MODE:-ReadWriteOnce}
  storageClassName: ${PVC_STORAGE_CLASS:-local-path}
  resources:
    requests:
      storage: ${PVC_STORAGE_SIZE:-10Gi}
