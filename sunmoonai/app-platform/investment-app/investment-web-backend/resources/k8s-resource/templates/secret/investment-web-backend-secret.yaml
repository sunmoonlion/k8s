apiVersion: v1
kind: Secret
metadata:
  name: investment-web-backend-secret
  namespace: ${NAMESPACE}
  labels:
    app: investment-web-backend
type: Opaque
stringData:
  RABBITMQ_PRODUCER_URL: "${RABBITMQ_PRODUCER_URL}"
  # PostgreSQL 完整连接字符串（Prisma 格式）
  DATABASE_URL: "${DATABASE_URL}"

  # Redis 密码
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # Redis 完整 URI（含密码，REDIS_URI 字段）
  REDIS_URI: "${REDIS_URI}"

  # Casdoor 客户端密钥
  CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET}"
