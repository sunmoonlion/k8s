---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgresql-clients, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-platform-dev}
          podSelector:
            matchLabels: {sunmoonai.com/postgresql-client: 'true'}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app-platform-dev}
          podSelector:
            matchLabels: {sunmoonai.com/postgresql-client: 'true'}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ops-platform-dev}
          podSelector:
            matchLabels: {sunmoonai.com/postgresql-client: 'true'}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgresql-client-egress, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {sunmoonai.com/postgresql-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-platform-dev}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgresql-client-egress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {sunmoonai.com/postgresql-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-platform-dev}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgresql-client-egress, namespace: ops-platform-dev}
spec:
  podSelector: {matchLabels: {sunmoonai.com/postgresql-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data-platform-dev}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
