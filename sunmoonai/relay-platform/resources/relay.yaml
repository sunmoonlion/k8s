# 会合点在边缘上的部署（第一期单实例；无状态，可加副本）。令牌表来自 Secret relay-tokens（key: tokens.json）。
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: edge
  labels: { app: relay }
spec:
  strategy: { type: Recreate }  # 单个 RWO 持久卷：先停旧的再起新的
  replicas: 1
  selector:
    matchLabels: { app: relay }
  template:
    metadata:
      labels: { app: relay }
    spec:
      securityContext: { runAsUser: 10002, runAsGroup: 10002, runAsNonRoot: true, fsGroup: 10002 }
      containers:
        - name: relay
          image: harbor.sunmoonai.com:30443/app-images/relay@sha256:5ccedf04bcd3ad124f22c346ea89b8af4e89c550bf48b109292cd0c1110fb184
          env:
            - { name: RELAY_HOST, value: "0.0.0.0" }
            - { name: RELAY_PORT, value: "47100" }
            - { name: RELAY_NAME, value: "edge-1" }
            - { name: RELAY_TOKENS_FILE, value: "/secrets/tokens.json" }
            # 工作台经 /admin 动态登记的令牌、推来的公钥、吊销表都落这个文件；放持久卷，pod 重建不丢
            #（2026-09-26 KIND：emptyDir 在换镜像时丢了公钥与吊销表，代理被拒、已吊销的令牌会重新有效）
            - { name: RELAY_TOKENS_STATE, value: "/state/tokens.json" }
            - name: RELAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: relay-admin, key: token, optional: true } }
            # D10：工作台验签公钥（ES256）。以 Secret relay-jwt 为准（重启即有）；工作台经 /admin 推来的只是补充
            - name: RELAY_JWT_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: relay-jwt, key: public.pem, optional: true } }
            - { name: RELAY_JWT_ISSUER, value: "sunmoon-workbench" }
          ports:
            - { name: ws, containerPort: 47100 }
          volumeMounts:
            - { name: tokens, mountPath: /secrets, readOnly: true }
            - { name: state, mountPath: /state }
          readinessProbe:
            httpGet: { path: /healthz, port: 47100 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: tokens
          secret: { secretName: relay-tokens, defaultMode: 0440 }
        - name: state
          persistentVolumeClaim: { claimName: relay-state }
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: edge
spec:
  selector: { app: relay }
  ports:
    - { name: ws, port: 47100, targetPort: 47100 }
---
# KIND 开发：宿主机（WSL）上的本地代理经 NodePort 连进来；边缘正式拓扑不用这个 Service（Traefik 路由 wss）。
apiVersion: v1
kind: Service
metadata:
  name: relay-nodeport
  namespace: edge
spec:
  type: NodePort
  selector: { app: relay }
  ports:
    - { name: ws, port: 47100, targetPort: 47100, nodePort: 30471 }
---
# 会合点状态（登记表、公钥、吊销表）的持久卷；单实例。多实例时改为共享存储，见 engineering.md「走向企业级」三
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: relay-state, namespace: edge }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 64Mi } }
