    metadata:
      labels:
        app.kubernetes.io/name: knowledge-backend
        app.kubernetes.io/component: backend-worker
        app.kubernetes.io/part-of: knowledge
        sunmoonai.com/app: knowledge
        sunmoonai.com/managed-by: app-platform-v2
      annotations:
        sunmoonai.com/config-sha256: d8842a161ab2eeacb476a363fd1bcaa4312e6157603b0c1a6a0916f2e0ef2a16
    spec:
      serviceAccountName: knowledge-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/knowledge-backend@sha256:38ef7c29a43e4a47a339ba06c6dd77bd0a31277035d1df31b0fc2ca69cd862c0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
            name: knowledge-backend-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-postgresql-conn
              key: DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-broker
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-broker
              key: CELERY_RESULT_BACKEND
              optional: true
        - name: RAGFLOW_API_BASE
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_API_BASE
        - name: RAGFLOW_PARSE_POLL_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_PARSE_POLL_INTERVAL_SECONDS
        - name: RAGFLOW_PARSE_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_PARSE_TIMEOUT_SECONDS
        - name: RETRIEVAL_DEFAULT_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RETRIEVAL_DEFAULT_TENANT_ID
        - name: RETRIEVAL_PROVIDER_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RETRIEVAL_PROVIDER_TIMEOUT_SECONDS
        - name: RETRIEVAL_DATASET_ALLOWLIST
          value: codex-smoke
        - name: RAGFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: knowledge-ragflow-provider
              key: RAGFLOW_API_KEY
        - name: ARTIFACT_ALLOWED_CONTENT_TYPES
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: ARTIFACT_ALLOWED_CONTENT_TYPES
        - name: ARTIFACT_MAX_SIZE_BYTES
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: ARTIFACT_MAX_SIZE_BYTES
        - name: ARTIFACT_S3_ALLOWED_BUCKETS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: ARTIFACT_S3_ALLOWED_BUCKETS
        - name: ARTIFACT_S3_ALLOWED_PREFIXES
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: ARTIFACT_S3_ALLOWED_PREFIXES
        - name: S3_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_ENDPOINT
        - name: S3_FORCE_PATH_STYLE
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_FORCE_PATH_STYLE
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_REGION
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-s3
              key: S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-s3
              key: S3_SECRET_ACCESS_KEY
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - celery -A app.bootstrap.worker:celery_app inspect ping --destination="celery@${POD_NAME}"
              --timeout=3 | grep -q pong
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
