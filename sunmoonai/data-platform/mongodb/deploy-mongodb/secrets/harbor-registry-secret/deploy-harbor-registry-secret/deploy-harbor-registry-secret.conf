# =============================================================================
# Harbor Registry Secret 部署配置（MongoDB）
# 文件名: deploy-harbor-registry-secret.conf
# 用途: 配置Harbor镜像拉取Secret的生成和部署参数
# 说明: 与PostgreSQL共享同一个harbor-registry-secret名称和命名空间
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称（与PostgreSQL共享）
SECRET_NAME="harbor-registry-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Docker Registry）
SECRET_TYPE="kubernetes.io/dockerconfigjson"

# =============================================================================
# Docker Registry配置
# =============================================================================

# Docker Registry服务器地址
# 优先使用主配置文件中的 MONGODB_IMAGE_REGISTRY（如果已设置）
# 如果主配置文件未加载，则使用默认值
DOCKER_SERVER="${MONGODB_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"

# Docker Registry用户名
DOCKER_USERNAME="admin"

# Docker Registry密码
DOCKER_PASSWORD="Harbor@12345"

# Docker Registry联系邮箱（可选）
# DOCKER_EMAIL="dev@sunmoonai.com"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

