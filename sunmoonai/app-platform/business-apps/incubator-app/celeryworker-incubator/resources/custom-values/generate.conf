# ============================================================================
# Celery Worker (Incubator) YAML 生成配置
# ============================================================================

# 需要生成的资源列表
# 格式：资源类型:模板路径:输出文件名:是否启用
# 资源类型：app, configmap, secret
# 注意：Celery Worker 是纯后台任务处理，不需要 Service 和 Ingress
# 监控通过 Flower 服务统一管理（通过 Celery broker 连接）
GENERATE_RESOURCES=(
    "app:templates/app/celeryworker-incubator.yaml:celeryworker-incubator-generated.yaml:true"
    "configmap:templates/configmap/celeryworker-config.yaml:celeryworker-config-generated.yaml:true"
    "secret:templates/secret/postgresql-incubator-db-secret.yaml:postgresql-incubator-db-secret-generated.yaml:true"
    "secret:templates/secret/neo4j-incubator-db-secret.yaml:neo4j-incubator-db-secret-generated.yaml:true"
    "secret:templates/secret/harbor-registry-secret.yaml:harbor-registry-secret-generated.yaml:true"
)

# 生成顺序（可选，默认按 GENERATE_RESOURCES 数组顺序）
# 格式：资源类型1:资源类型2（表示资源类型1需要在资源类型2之前生成）
GENERATE_ORDER=(
    "configmap:app"
    "secret:app"
)

# 部署配置路径（用于加载环境变量）
DEPLOY_CONFIG="../../deploy-celeryworker-incubator/deploy-celeryworker-incubator.conf"
