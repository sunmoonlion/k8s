# ============================================================================
# Celery Worker ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/configmap/celeryworker-config.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="celeryworker-config-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="configmap"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-celeryworker-incubator.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# ConfigMap 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 ConfigMap YAML 文件
# Worker 只需要必要的配置，不需要 BFF 的服务器、CORS 等配置
# ============================================================================
# Celery 配置
CELERY_BROKER_URL="${CELERY_BROKER_URL:-amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//}"
CELERY_QUEUE="${CELERY_QUEUE:-incubator-queue}"
CELERY_RESULT_BACKEND="${CELERY_RESULT_BACKEND:-redis://redis-service.data-platform:6379/10}"
CELERY_CONCURRENCY="${CELERY_CONCURRENCY:-2}"

# 数据库配置（非敏感部分）
POSTGRES_SERVER="${POSTGRES_SERVER:-101.126.151.0}"  # PostgreSQL 服务器 IP
POSTGRES_PORT="${POSTGRES_PORT:-30444}"  # PostgreSQL 端口
POSTGRES_USER="${POSTGRES_USER:-sunmoonai_dev}"  # PostgreSQL 用户名
POSTGRES_DB="${POSTGRES_DB:-mydb}"  # PostgreSQL 数据库名

# PostgreSQL 连接字符串模板（非敏感部分，密码在 Secret 中）
POSTGRES_URL_TEMPLATE="${POSTGRES_URL_TEMPLATE:-postgresql://${POSTGRES_USER}:PASSWORD@${POSTGRES_SERVER}:${POSTGRES_PORT}/${POSTGRES_DB}}"

# PostgreSQL SSL 模式（非敏感部分）
DB_SSLMODE="${DB_SSLMODE:-disable}"  # SSL 连接模式：disable|allow|prefer|require|verify-ca|verify-full

# DB_* 格式字段（兼容性，非敏感部分）
DB_HOST="${DB_HOST:-${POSTGRES_SERVER}}"  # 数据库主机（与 POSTGRES_SERVER 对应）
DB_PORT="${DB_PORT:-${POSTGRES_PORT}}"    # 数据库端口（与 POSTGRES_PORT 对应）
DB_NAME="${DB_NAME:-${POSTGRES_DB}}"      # 数据库名（与 POSTGRES_DB 对应）
DB_USER="${DB_USER:-${POSTGRES_USER}}"    # 数据库用户（与 POSTGRES_USER 对应）

# Neo4j 配置（非敏感部分）
NEO4J_SERVER="${NEO4J_SERVER:-101.126.151.0}"  # Neo4j 服务器 IP
NEO4J_PORT="${NEO4J_PORT:-7687}"  # Neo4j Bolt 端口
NEO4J_USERNAME="${NEO4J_USERNAME:-neo4j}"
NEO4J_AUTH="${NEO4J_AUTH:-neo4j}"
NEO4J_BOLT="${NEO4J_BOLT:-bolt}"

# Neo4j 连接字符串模板（非敏感部分，密码在 Secret 中）
NEO4J_BOLT_URL_TEMPLATE="${NEO4J_BOLT_URL_TEMPLATE:-${NEO4J_BOLT}://${NEO4J_USERNAME}:PASSWORD@${NEO4J_SERVER}:${NEO4J_PORT}}"

# Neo4j 功能配置
NEO4J_FORCE_TIMEZONE="${NEO4J_FORCE_TIMEZONE:-True}"
NEO4J_AUTO_INSTALL_LABELS="${NEO4J_AUTO_INSTALL_LABELS:-True}"
NEO4J_MAX_CONNECTION_POOL_SIZE="${NEO4J_MAX_CONNECTION_POOL_SIZE:-50}"

# SMTP 配置（非敏感部分，用于发送邮件通知）
SMTP_HOST="${SMTP_HOST:-smtp.example.com}"          # SMTP 服务器地址
SMTP_PORT="${SMTP_PORT:-587}"                        # SMTP 端口（587 for TLS, 465 for SSL, 25 for plain）
SMTP_TLS="${SMTP_TLS:-true}"                         # 是否使用 TLS
SMTP_SSL="${SMTP_SSL:-false}"                        # 是否使用 SSL（与 TLS 互斥）
SMTP_FROM="${SMTP_FROM:-noreply@sunmoonai.com}"     # 发件人地址
EMAILS_FROM_EMAIL="${EMAILS_FROM_EMAIL:-${SMTP_FROM}}"  # 发件人邮箱
EMAILS_FROM_NAME="${EMAILS_FROM_NAME:-Celery Worker}"  # 发件人名称
SMTP_TIMEOUT="${SMTP_TIMEOUT:-10}"                   # 连接超时（秒）

# Sentry 监控配置（非敏感部分）
SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT:-${ENVIRONMENT:-development}}"  # Sentry 环境标识
SENTRY_RELEASE="${SENTRY_RELEASE:-}"                 # Sentry 版本/发布标识（可选）
SENTRY_TRACES_SAMPLE_RATE="${SENTRY_TRACES_SAMPLE_RATE:-0.1}"  # 性能追踪采样率（0.0-1.0）
SENTRY_PROFILES_SAMPLE_RATE="${SENTRY_PROFILES_SAMPLE_RATE:-0.1}"  # 性能分析采样率（0.0-1.0）

# Redis 配置（非敏感部分，用于结果后端或其他用途）
REDIS_HOST="${REDIS_HOST:-redis-service.data-platform}"
REDIS_PORT="${REDIS_PORT:-6379}"
REDIS_DB="${REDIS_DB:-10}"
REDIS_USE_SSL="${REDIS_USE_SSL:-false}"

# Python 路径
PYTHONPATH="${PYTHONPATH:-/app}"
