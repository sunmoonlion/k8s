apiVersion: apps/v1
kind: Deployment
metadata: {name: knowfeed-web, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowfeed-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: knowfeed-web, app.kubernetes.io/part-of: knowfeed}
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowfeed-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: harbor.sunmoonai.com:30443/platform/knowfeed-web-frontend@sha256:f7cab49c2d3c735cf3d5b07a135f56f2012f7a1f167d8e7a77144351c8664b2e
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: DEPLOYMENT_ENV, value: production}
            - {name: AUTH_APP, value: knowfeed}
            - {name: APP_ORIGIN, value: "https://knowfeed.dev.sunmoonai.com:30443"}
            - {name: BACKEND_INTERNAL_URL, value: 'http://knowfeed-api.app-platform-dev.svc.cluster.local:8000'}
            - {name: DEPLOYMENT_ID, value: "knowfeed-web-frontend-f7cab49c2d3c735c"}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: '3000'}
            - {name: REFERENCE_UI_ENABLED, value: 'false'}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: cache, mountPath: /app/.next/cache}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}, {name: cache, emptyDir: {sizeLimit: 128Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: knowfeed-web, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowfeed-web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowfeed-web, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowfeed-web}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowfeed-api}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowfeed-web
  namespace: app-platform-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: sunmoon
  tls: [{hosts: [knowfeed.dev.sunmoonai.com], secretName: knowfeed-tls}]
  rules:
    - host: knowfeed.dev.sunmoonai.com
      http:
        paths:
          # 内部接口不经公网：转给前端，前端没有这个页面，回 404（审读第 1 条；后端另按地址拦）
          - path: /api/internal
            pathType: Prefix
            backend: {service: {name: knowfeed-web, port: {number: 3000}}}
          - path: /api
            pathType: Prefix
            backend: {service: {name: knowfeed-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: knowfeed-web, port: {number: 3000}}}
