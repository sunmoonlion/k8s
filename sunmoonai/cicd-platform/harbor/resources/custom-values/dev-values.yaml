# 开发环境 Harbor Values 配置
# 基于 Bitnami Harbor Chart 官方结构整理

# ============================================================================
# 从配置文件读取的变量
# ============================================================================
# 这些变量通过部署脚本从 deploy-harbor.conf 文件中读取并替换
# 部署脚本会自动替换 {{HARBOR_EXTERNAL_HOST}} 等模板变量

# ============================================================================
# 全局配置
# ============================================================================
global:
  imageRegistry: ""
  defaultStorageClass: ""  # 远程使用 existingClaim 静态 PV，与 step09 /data/local-storage 一致

# ============================================================================
# 通用配置
# ============================================================================
nameOverride: ""
fullnameOverride: ""

# 通用标签
commonLabels:
  app.kubernetes.io/name: "harbor"
  app.kubernetes.io/instance: "{{HARBOR_PROJECT_ID}}"
  app.kubernetes.io/component: "harbor"
  app.kubernetes.io/environment: "development"
  app.kubernetes.io/part-of: platform
  app.kubernetes.io/managed-by: helm


# ============================================================================
# Harbor 核心配置
# ============================================================================

# 管理员密码 - 使用现有Secret提高安全性
# adminPassword: "Harbor@12345"  # 已删除明文密码配置
existingSecret: "{{HARBOR_AUTH_SECRET_NAME}}"
existingSecretAdminPasswordKey: "{{HARBOR_AUTH_SECRET_PASSWORD_KEY}}"

# 外部访问URL - 使用模板变量，从deploy-harbor.conf读取
# 访问地址: https://harbor.sunmoonai.com:30443（使用 websecure entryPoint）
externalURL: https://{{HARBOR_EXTERNAL_HOST}}:{{HARBOR_EXTERNAL_PORT}}


# 暴露类型（chart 仅提供三种）
# exposureType: "ingress" - 由 chart 创建 Ingress 资源，由 Ingress Controller（如 Traefik）暴露
# exposureType: "proxy"   - 由 chart 为 Harbor 自带 NGINX 做入口；是否对外暴露由下面 service.type 决定
#                             service.type: ClusterIP 则不暴露（仅集群内）；NodePort/LoadBalancer 则暴露
# exposureType: "none"    - 由 chart 不创建 Ingress、也不创建 proxy，由用户自建 Ingress 等方式暴露
exposureType: "ingress"

# ============================================================================
# 服务配置
# ============================================================================
# 当使用 exposureType: "ingress" 时，Service 配置由 Helm 模板自动生成
# 不需要手动指定端口，避免与模板冲突
service:
  type: "ClusterIP"
  # ports 配置已移除，由 Helm 模板自动处理
# ============================================================================
# Ingress 配置（与 Traefik 配合使用）
# ============================================================================
# "内置 Ingress"指 Harbor Chart 会创建 Kubernetes Ingress 资源（声明路由）
# 并非 Harbor 自己跑一个 Ingress Controller。Traefik 作为集群的 Ingress Controller
# 会监听这些 Ingress 并按规则把流量转发到 Harbor Service
# 因此使用 Traefik 时必须保留 ingress.enabled: true，否则 Traefik 没有 Harbor 的路由可接；
# 若设为 false，需自行编写 Ingress 或改用 NodePort/LoadBalancer 暴露
ingress:
  enabled: true
  core:
    # 使用默认的IngressClass（自动检测集群默认的IngressClass）
    ingressClassName: ""
    # Harbor访问域名 - 使用模板变量
    hostname: "{{HARBOR_EXTERNAL_HOST}}"
    # 路径匹配类型
    pathType: "Prefix"
    # Annotations 配置（必须配置在 ingress.core.annotations 下）
    # 根据 Harbor Helm chart 模板，annotations 应该配置在 ingress.core.annotations 下
    annotations:
      # 使用 websecure entryPoint（端口 30443）
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      # 使用 buffering 中间件支持大文件上传
      traefik.ingress.kubernetes.io/router.middlewares: "ingress-platform-dev-traefik-buffering-sunmoonai@kubernetescrd"
      # 其他 Harbor 需要的 annotations
      ingress.kubernetes.io/proxy-body-size: "0"
      ingress.kubernetes.io/ssl-redirect: "true"
    # TLS 配置
    # 注意：TLS 终止在 Traefik，Traefik 到 Harbor 的流量是 HTTP（不加密）
    # HTTPS 证书：由 Traefik 侧生成并存放在 K8s Secret「traefik-tls-secret」（Traefik 所在命名空间，即 ingress-platform-dev）
    # 生成流程：ensure-kind-ca.sh 生成本地 CA → Traefik 部署时 deploy-traefik-tls-secret → CA 签发服务器证书并创建 Secret → Traefik 通过 tlsStore.defaultCertificate.secretName 指向 traefik-tls-secret
    tls: false
    selfSigned: false
# ============================================================================
# 持久化存储（Bitnami Harbor Chart）
# ============================================================================
# 远程静态 PV 见 harbor-remote-pv-pvc.yaml → /data/local-storage/harbor/*
# 由 deploy-harbor.conf 的 HARBOR_STORAGE_* 渲染；默认节点 hsy-local-3
#
# PostgreSQL、Redis 必须在子 chart 下配置 existingClaim；Trivy 仍用 chart 动态 volumeClaimTemplates。
persistence:
  persistentVolumeClaim:
    registry:
      existingClaim: "harbor-sunmoonai-registry-dev-pvc"
    jobservice:
      existingClaim: "harbor-sunmoonai-jobservice-dev-pvc"
    trivy:
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi

# ============================================================================
# 内置数据库配置（PostgreSQL）
# ============================================================================
postgresql:
  enabled: true
  primary:
    # 空 hostPath 挂载根常为 root:root，Bitnami(uid=1001) 无法初始化数据目录
    initContainers:
      - name: fix-storage-owner
        image: docker.io/bitnami/postgresql:17.6.0-debian-12-r4
        command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/postgresql"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: data
            mountPath: /bitnami/postgresql
    persistence:
      enabled: true
      existingClaim: harbor-sunmoonai-database-dev-pvc
    resources:
      limits:
        memory: "512Mi"  # 限制最大内存使用
      requests:
        memory: "256Mi"  # 请求最小内存
    # 可以在这里自定义PostgreSQL镜像
    # image:
    #   registry: docker.io
    #   repository: bitnami/postgresql
    #   tag: 16.7.0-debian-12-r0

# 禁用外部数据库配置，使用内置数据库
# externalDatabase:
#   host: "postgresql-{{HARBOR_PROJECT_ID}}.data-platform-dev.svc.cluster.local"
#   port: 5432
#   user: "{{HARBOR_PROJECT_ID}}_harbor"
#   # password: "SunMoonAI_PostgreSQL_2024!"  # 已删除明文密码
#   existingSecret: "postgresql-secrets"  # 直接使用PostgreSQL的Secret
#   existingSecretPasswordKey: "harbor-password"  # 使用PostgreSQL Secret中的harbor-password
#   sslmode: "disable"
#   coreDatabase: "{{HARBOR_PROJECT_ID}}_harbor"  # 使用PostgreSQL中已创建的Harbor数据库

# ============================================================================
# PostgreSQL 配置说明
# ============================================================================
# 使用现有的PostgreSQL组件：sunmoonai/data-platform/postgresql
#
# 已配置的Harbor用户和数据库：
# - 用户: sunmoonai_harbor
# - 数据库: sunmoonai_harbor
# - 密码: Harbor_Secure_2024! (来自postgresql-secrets的harbor-password）
# - 主机: postgresql-sunmoonai.data-platform-dev.svc.cluster.local
# - 端口: 5432
#
# PostgreSQL组件已通过initdbScripts自动创建了Harbor所需的用户和数据库

# ============================================================================
# 内置缓存配置（Redis）
# ============================================================================
redis:
  enabled: true
  architecture: standalone
  master:
    initContainers:
      - name: fix-storage-owner
        image: docker.io/bitnami/redis:8.2.1-debian-12-r0
        command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/redis"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: redis-data
            mountPath: /bitnami/redis
    persistence:
      enabled: true
      existingClaim: harbor-sunmoonai-redis-dev-pvc
    resources:
      limits:
        memory: "256Mi"  # 限制最大内存使用
      requests:
        memory: "128Mi"  # 请求最小内存

# 禁用外部 Redis 配置，使用内置 Redis
# externalRedis:
#   host: "redis-sunmoonai-master.data-platform-dev.svc.cluster.local"
#   port: 6379
#   password: "SunMoonAI_Redis_2024!"
#  #existingSecret: "redis-secrets"      # 使用密钥对于bitnami chart有bug
#   coreDatabaseIndex: "0"
#   jobserviceDatabaseIndex: "1"
#   registryDatabaseIndex: "2"
#   trivyAdapterDatabaseIndex: "5"

# ============================================================================
# Harbor 组件配置
# ============================================================================

# Portal（Web UI）
portal:
  replicaCount: 1

# Core（核心服务）
core:
  replicaCount: 1

# JobService（作业服务）
jobservice:
  replicaCount: 1
  maxJobWorkers: 10

# Registry（镜像仓库）
registry:
  replicaCount: 1
  storage:
    type: "filesystem"
  initContainers:
    - name: fix-storage-owner
      image: docker.io/bitnami/harbor-registry:2.13.2-debian-12-r2
      command: ["/bin/sh", "-ec", "chown 1001:1001 /storage"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: registry-data
          mountPath: /storage

# Trivy（镜像扫描）
trivy:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# Notary（镜像签名，可选）
notary:
  enabled: false

# ============================================================================
# 其他配置
# ============================================================================

# RBAC
rbac:
  create: true

# ServiceAccount
serviceAccount:
  create: true
  name: ""
