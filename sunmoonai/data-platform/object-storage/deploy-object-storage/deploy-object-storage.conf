# AIStor Object Storage deployment configuration

OBJECT_STORAGE_PROJECT_ID="sunmoonai"
OBJECT_STORAGE_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

OBJECT_STORAGE_OPERATOR_RELEASE="aistor-operator"
OBJECT_STORAGE_RELEASE_PREFIX="object-storage"
OBJECT_STORAGE_NAME="platform-object-storage"

OBJECT_STORAGE_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
OBJECT_STORAGE_IMAGE_PROJECT="k8s-images"
OBJECT_STORAGE_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

AISTOR_OPERATOR_IMAGE_VERSION="RELEASE.2026-06-10T05-02-21Z"
AISTOR_MINIO_IMAGE_VERSION="RELEASE.2026-05-28T20-50-32Z"
AISTOR_MINIO_SIDECAR_IMAGE_VERSION="RELEASE.2026-06-09T23-40-36Z"
AISTOR_MC_IMAGE_VERSION="RELEASE.2026-04-21T04-26-49Z"

# The license is never committed. By default it is loaded from the current
# user's private WSL configuration directory. AISTOR_LICENSE_FILE may override
# this location for another workstation or deployment environment.
AISTOR_LICENSE_SECRET_NAME="minio-license"
AISTOR_LICENSE_FILE="${AISTOR_LICENSE_FILE:-${HOME}/.config/sunmoonai/licenses/minio.license}"

OBJECT_STORAGE_ROOT_SECRET_NAME="object-storage-root-credentials"
OBJECT_STORAGE_ROOT_USER="sunmoonai-object-admin"
OBJECT_STORAGE_ROOT_PASSWORD="SunmoonAI-ObjectStore-Dev-2026!"

OBJECT_STORAGE_KIND_PV_NAME="object-storage-sunmoonai-dev-pv"
OBJECT_STORAGE_KIND_STORAGE_CLASS="object-storage-kind-static"
OBJECT_STORAGE_KIND_CAPACITY="10Gi"
OBJECT_STORAGE_KIND_NODE="kind-worker"
OBJECT_STORAGE_KIND_HOST_PATH="/data/kind-local-storage/object-storage"

OBJECT_STORAGE_CONSOLE_LOCAL_ADDRESS="${OBJECT_STORAGE_CONSOLE_LOCAL_ADDRESS:-127.0.0.1}"
OBJECT_STORAGE_CONSOLE_LOCAL_PORT="${OBJECT_STORAGE_CONSOLE_LOCAL_PORT:-19090}"
OBJECT_STORAGE_CONSOLE_SERVICE_PORT="${OBJECT_STORAGE_CONSOLE_SERVICE_PORT:-9090}"

OBJECT_STORAGE_S3_INTERNAL_ENDPOINT="${OBJECT_STORAGE_S3_INTERNAL_ENDPOINT:-http://minio.data-platform-dev.svc.cluster.local}"
OBJECT_STORAGE_S3_REGION="${OBJECT_STORAGE_S3_REGION:-us-east-1}"
OBJECT_STORAGE_PROVISIONER_IMAGE="${OBJECT_STORAGE_PROVISIONER_IMAGE:-harbor.sunmoonai.com:30443/k8s-images/minio/aistor/mc:RELEASE.2026-04-21T04-26-49Z}"

DEPLOYMENT_MODE="online"
OBJECT_STORAGE_FORCE_OFFLINE="false"
