# ============================================================================
# Incubator App BFF 部署配置
# 文件名: deploy-incubator-bff.conf
# 用途: 配置 Incubator App BFF 的部署参数
# ============================================================================

# 基础配置
INCUBATOR_BFF_PROJECT_ID="sunmoonai"
INCUBATOR_BFF_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像配置（与源码仓库 mybuild/build.conf 保持一致）
INCUBATOR_BFF_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INCUBATOR_BFF_IMAGE_PROJECT="k8s-images"
INCUBATOR_BFF_IMAGE="incubator-app-bff"
INCUBATOR_BFF_TAG="1.0.0"
IMAGE_PULL_POLICY="IfNotPresent"
INCUBATOR_BFF_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问与域名配置（如需 Ingress，可在后续脚本扩展）
INCUBATOR_BFF_TLS_ENABLED="false"
INCUBATOR_BFF_UNIFIED_HOST="incubator.sunmoonai.com"
INCUBATOR_BFF_NODE_IP="101.126.151.0"
INCUBATOR_BFF_EXTERNAL_PORT="30443"

# Secret / ConfigMap
INCUBATOR_BFF_SECRET_NAME="incubator-app-bff-secret"
INCUBATOR_BFF_CONFIGMAP_NAME="incubator-app-bff-config"

# 组件开关
secrets_enabled="true"      # Secrets 和 ConfigMaps
middleware_enabled="false"  # Middleware（stripprefix 已集成到 ingress.yaml 中，保留用于未来扩展）
ingress_enabled="true"      # Ingress（HTTP 路由）

# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
secrets_priority=2000       # Secrets 和 ConfigMaps 优先级（最高）
middleware_priority=1000    # Middleware 优先级
ingress_priority=100        # Ingress 优先级（最低）

# 推送后清理远程 tar 包开关（预留，与模板保持一致）
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

