# =============================================================================
# Logstash Elasticsearch Secret 部署配置
# 文件名: deploy-logstash-elasticsearch-secret.conf
# 用途: 配置Logstash连接Elasticsearch的认证Secret
# =============================================================================

SECRET_NAME="logstash-elasticsearch-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"
