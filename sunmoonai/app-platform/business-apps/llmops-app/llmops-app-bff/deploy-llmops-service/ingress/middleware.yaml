# Web Backend API 中间件配置
# 为 Web Backend API 路由提供必要的中间件支持

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llmops-service-stripprefix
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-service
spec:
  stripPrefix:
    prefixes:
      - "/api/v1"

---
# Web Backend 认证中间件（预留）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llmops-service-auth
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-service
spec:
  basicAuth:
    secret: llmops-service-auth-secret # 存储用户名和密码的 Secret

---
# Web Backend 限流中间件（预留）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llmops-service-rate-limit
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-service
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1s

---
# Web Backend 监控中间件（预留）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: llmops-service-monitoring
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llmops-service
spec:
  headers:
    customRequestHeaders:
      X-LLMOps-Service-Monitoring: "true"
