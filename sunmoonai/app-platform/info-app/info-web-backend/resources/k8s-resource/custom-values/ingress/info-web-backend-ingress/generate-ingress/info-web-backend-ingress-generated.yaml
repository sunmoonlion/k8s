# Info Web Backend 路由配置 (Traefik IngressRoute)
# NestJS 挂载点：所有业务路由在 /api/* 下，e.g. /api/auth/login
#
# 访问方式：
# - https://info-api.sunmoonai.com/api/...
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-web-backend-ingress
  namespace: app-platform-dev
  labels:
    app: app-platform-ingress
    component: info-web-backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`info-api.sunmoonai.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: info-web-backend
          port: 3000
