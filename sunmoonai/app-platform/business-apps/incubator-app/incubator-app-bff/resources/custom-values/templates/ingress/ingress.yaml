# Incubator App BFF 路由配置 (Traefik IngressRoute)
# 路径前缀：/api/v1 → 后端服务端口 80
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# https://<节点IP>:30443/api/v1/health
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# https://incubator.sunmoonai.com/api/v1/health
#
# 注意：只需在 /etc/hosts 中添加一条记录即可访问所有服务
# 示例：101.126.151.0  incubator.sunmoonai.com
#
---
# Middleware: 路径前缀剥离
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: incubator-app-bff-stripprefix
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: incubator-app-bff
spec:
  stripPrefix:
    prefixes:
      - "/api/v1"
---
# IngressRoute: HTTP 路由
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: incubator-app-bff-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: incubator-app-bff
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: incubator-app-bff-stripprefix
    # 使用统一域名访问
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: incubator-app-bff-stripprefix

