---
- name: Require bounded internal TLS hostnames
  ansible.builtin.assert:
    quiet: true
    that:
      - service_access_hosts.casdoor == 'casdoor-tls.' + app_namespace + '.svc.cluster.local'
      - service_access_hosts.knowbase == 'knowbase-tls.' + app_namespace + '.svc.cluster.local'
      - services_ingress_enabled | bool and services_casdoor_enabled | bool
- name: Require each application route to be an exact internal host and API prefix
  ansible.builtin.assert:
    quiet: true
    that:
      - item.key in application_names and item.key not in service_access_hosts
      - item.value.host == item.key + '-tls.' + app_namespace + '.svc.cluster.local'
      - item.value.path is match('^/api/internal/v1/[a-z][a-z0-9-]*$')
  loop: '{{ service_access_routes | default({}) | dict2items }}'
  loop_control: {label: '{{ item.key }}'}
- name: Create service transport candidate directory
  ansible.builtin.file: {path: '{{ build }}/ingress-platform/traefik/service-access', state: directory, owner: '{{ cluster_operator }}', mode: '0755'}
- name: Prepare an independent recoverable internal TLS certificate
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/tls-identity.yaml'
  vars:
    tls_private_dir: '{{ services_config_dir }}/service-access'
    tls_backup_dir: '{{ services_backup_dir }}/service-access'
    tls_declaration: '{{ playbook_dir }}/../../gitops/components/ingress-platform/traefik/service-access/tls.sops.yaml'
    tls_hostnames: '{{ service_access_hosts.values() | list }}'
# 共用证书（casdoor、knowbase）必须紧跟着它自己的 tls-identity 加密：下面每条应用入口的 tls-identity 都会重写
# app_tls，2026-10-17 R5.2 就是加密时 app_tls 已是最后一条入口（knowlab）的，共用密文装成了 knowlab 的证书，
# traefik 对 casdoor-tls、knowbase-tls 只能出示默认证书，五个服务身份注册全部失败。
- name: Require the slurped TLS identity to be the shared one
  ansible.builtin.assert:
    quiet: true
    that:
      - app_tls.results | map(attribute='source') | list == [services_config_dir ~ '/service-access/tls/server.key', services_config_dir ~ '/service-access/tls/server.crt']
- name: Encrypt the internal TLS identity for Traefik only
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: ingress-platform/traefik/service-access/tls.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: service-access-tls, namespace: '{{ app_namespace }}'}
        type: kubernetes.io/tls
        data: {'tls.key': '{{ app_tls.results[0].content }}', 'tls.crt': '{{ app_tls.results[1].content }}'}
  no_log: true
- name: Prepare and encrypt one independent TLS identity per application route
  ansible.builtin.include_tasks: '{{ playbook_dir }}/../../gitops/components/ingress-platform/traefik/service-access/route-tls.yaml'
  loop: '{{ service_access_routes | default({}) | dict2items }}'
  loop_control: {loop_var: route, label: '{{ route.key }}'}
- name: Render the cluster-local HTTPS routing objects
  ansible.builtin.template:
    src: '{{ playbook_dir }}/../../gitops/components/ingress-platform/traefik/service-access/workload.yaml.j2'
    dest: '{{ build }}/ingress-platform/traefik/service-access/workload.yaml'
    owner: '{{ cluster_operator }}'
    mode: '0644'
- name: Render explicit service access resource list
  ansible.builtin.copy:
    dest: '{{ build }}/ingress-platform/traefik/service-access/kustomization.yaml'
    owner: '{{ cluster_operator }}'
    mode: '0644'
    content: '{{ {"apiVersion":"kustomize.config.k8s.io/v1beta1","kind":"Kustomization","resources":["workload.yaml","tls.sops.yaml"] + (service_access_routes | default({}) | list | map("regex_replace", "^", "tls-") | map("regex_replace", "$", ".sops.yaml") | list)} | to_nice_yaml }}'
