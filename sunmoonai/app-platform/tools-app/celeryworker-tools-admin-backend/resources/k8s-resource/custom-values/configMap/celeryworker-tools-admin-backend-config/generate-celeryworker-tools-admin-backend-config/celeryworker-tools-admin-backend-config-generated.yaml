apiVersion: v1
kind: ConfigMap
metadata:
  name: celeryworker-tools-admin-backend-config
  namespace: app-platform-dev
  labels:
    app: celeryworker-tools-admin-backend
    component: celery-worker
    backend: tools-admin-backend
data:
  CELERY_APP_MODULE: "app.worker"
  CELERY_QUEUE: "tools.admin.default"
  CELERY_CONCURRENCY: "2"
  CELERY_LOG_LEVEL: "info"
  CELERY_INCLUDE_MODULES: ""
  CELERY_TASK_DEFAULT_QUEUE: "tools.admin.default"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  CELERY_TASK_ACKS_LATE: "true"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "1000"
