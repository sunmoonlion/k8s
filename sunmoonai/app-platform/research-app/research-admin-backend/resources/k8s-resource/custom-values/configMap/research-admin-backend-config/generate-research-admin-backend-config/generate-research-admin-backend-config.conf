# ============================================================================
# research-admin-backend ConfigMap YAML 生成配置
# 字段来源：应用 .env 中的非敏感字段
# ============================================================================

TEMPLATE_FILE="templates/configMap/research-admin-backend-config.yaml"
OUTPUT_FILE="research-admin-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-development}"

LOG_LEVEL="${LOG_LEVEL:-INFO}"
SESSION_TTL_SECONDS="${SESSION_TTL_SECONDS:-3600}"
AGENT_SESSION_LOCK_TTL_SECONDS="${AGENT_SESSION_LOCK_TTL_SECONDS:-300}"
AGENT_V4_TRAFFIC_ENABLED="${AGENT_V4_TRAFFIC_ENABLED:-false}"
AGENT_V5_TRAFFIC_MODE="${AGENT_V5_TRAFFIC_MODE:-off}"
AGENT_REDIS_KEY_PREFIX="${AGENT_REDIS_KEY_PREFIX:-research:agent}"
FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-http://research-admin-frontend:80}"
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-}"
CASDOOR_ORGANIZATION="${CASDOOR_ORGANIZATION:-built-in}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-sunmoonai-research-admin}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-}"
CASDOOR_VERIFY_SSL="${CASDOOR_VERIFY_SSL:-true}"
FRONTEND_ALLOWED_ORIGINS="${FRONTEND_ALLOWED_ORIGINS:-${FRONTEND_BASE_URL}}"
AUTH_POLICY_VERSION="${AUTH_POLICY_VERSION:-research-admin-v1}"
AUTH_ALLOWED_ALGORITHMS="${AUTH_ALLOWED_ALGORITHMS:-RS256,ES256}"
KNOWLEDGE_RETRIEVAL_URL="${KNOWLEDGE_RETRIEVAL_URL:-http://knowledge-admin-backend:8000/api/internal/v1/knowledge/retrievals}"
KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION="${KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION:-sunmoonai-research-knowledge-retrieve}"
KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL="${KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL:-https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration}"
KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT="${KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT:-http://casdoor-sunmoonai:8000}"
KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE="${KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE:-knowledge:retrieve}"
KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS="${KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS:-20}"
CELERY_QUEUE="${CELERY_QUEUE:-research.admin.default}"
