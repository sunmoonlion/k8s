# ============================================================================
# Incubator App SSR 部署配置
# ============================================================================

# 基础配置
INCUBATOR_SSR_PROJECT_ID="sunmoonai"
INCUBATOR_SSR_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像配置（需与源码 mybuild/build.conf 保持一致）
INCUBATOR_SSR_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INCUBATOR_SSR_IMAGE_PROJECT="k8s-images"
INCUBATOR_SSR_IMAGE="incubator-app-ssr"
INCUBATOR_SSR_TAG="1.0.0"
IMAGE_PULL_POLICY="IfNotPresent"
INCUBATOR_SSR_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问域名/IP（Ingress 使用）
INCUBATOR_SSR_UNIFIED_HOST="incubator-ssr.sunmoonai.com"
INCUBATOR_SSR_NODE_IP="101.126.151.0"
INCUBATOR_SSR_EXTERNAL_PORT="30443"

# Secrets / ConfigMaps 开关
secrets_enabled="true"
ingress_enabled="true"   # 已提供 ingress 脚本，可按需关闭

# 部署优先级（仅供参考）
secrets_priority=2000
ingress_priority=100

# 资源文件位置（不修改 resource/）
RESOURCES_DIR="../resource"
INCUBATOR_SSR_YAML="${RESOURCES_DIR}/incubator-app-ssr.yaml"

