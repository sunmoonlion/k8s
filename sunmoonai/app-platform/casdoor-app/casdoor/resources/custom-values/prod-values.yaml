# Casdoor 生产环境 Helm Values

image:
  repository: harbor.sunmoonai.com:30443/k8s-images/casdoor
  pullPolicy: IfNotPresent
  # tag 通过 --set image.tag= 注入，生产环境锁定具体版本

imagePullSecrets:
  - name: harbor-registry-secret

env:
  RUNNING_IN_DOCKER: "true"
  driverName: postgres
  # ⚠️ 生产环境必须通过 K8s Secret + envFrom 注入 dataSourceName，禁止明文
  dataSourceName: ""
  dbName: ""

service:
  main:
    ports:
      http:
        port: 8000

ingress:
  main:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    type: pvc
    mountPath: /conf
    size: 5Gi
    storageClass: "nfs-2"
