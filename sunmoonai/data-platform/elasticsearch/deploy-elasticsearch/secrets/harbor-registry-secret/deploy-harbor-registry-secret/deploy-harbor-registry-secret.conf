# =============================================================================
# Harbor Registry Secret 部署配置
# 文件�? deploy-harbor-registry-secret.conf
# 用�? 配置Harbor镜像拉取Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="harbor-registry-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Docker认证
SECRET_TYPE="kubernetes.io/dockerconfigjson"

# =============================================================================
# Docker认证配置
# =============================================================================

# Docker服务器地址
# 优先使用主配置文件中�?ELASTICSEARCH_IMAGE_REGISTRY（如果已设置�?# 如果主配置文件未加载，则使用默认
DOCKER_SERVER="${ELASTICSEARCH_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"

# Docker用户
DOCKER_USERNAME="admin"

# Docker密码
DOCKER_PASSWORD="Ha!b1359admin"

# Docker邮箱（可选）
# DOCKER_EMAIL="dev@sunmoonai.com"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100
RESTART_PRIORITY="50"

