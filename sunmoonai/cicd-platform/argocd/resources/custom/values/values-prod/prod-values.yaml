# ArgoCD 生产环境配置
# 基于 Bitnami ArgoCD 3.1.1

# ========================================
# 镜像配置
# ========================================
image:
  pullPolicy: Always
  tag: "3.1.1-debian-12-r0"

# ========================================
# 认证配置
# ========================================
auth:
  enabled: true
  adminUsername: "admin"
  adminPassword: "sunmoonai_argocd_2025!"
  dex:
    enabled: true
    image:
      tag: "2.43.1-debian-12-r8"
  tls:
    enabled: true
    certificatesSecret: "argocd-tls-cert"
    certificateFilename: "tls.crt"
    certificateKeyFilename: "tls.key"

# ========================================
# 持久化配置
# ========================================
persistence:
  enabled: true
  storageClass: "fast-ssd"
  accessMode: ReadWriteOnce
  size: "10Gi"
  mountPath: "/opt/bitnami/argocd"

# ========================================
# 资源配置
# ========================================
resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "1000m"
    memory: "2Gi"

# ========================================
# 探针配置
# ========================================
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  path: "/healthz"

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
  path: "/healthz"

# ========================================
# 监控配置
# ========================================
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    additionalLabels:
      monitoring: "prometheus"

# ========================================
# 网络策略配置
# ========================================
networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              name: "cicd-platform"
        - podSelector:
            matchLabels:
              app: "argocd"
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egressRules:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

# ========================================
# 自动扩缩容配置
# ========================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ========================================
# 备份配置
# ========================================
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: "30d"
  storage:
    type: "s3"
    bucket: "sunmoonai-argocd-backup"
    region: "us-west-2"

# ========================================
# ArgoCD 特定配置
# ========================================
argocd:
  # 服务器配置
  server:
    host: "0.0.0.0"
    port: 8080
    name: "sunmoonai-argocd"
    basePath: ""
    rewriteBasePath: false
    insecure: false
    extraArgs: "--insecure"
  
  # 仓库服务器配置
  repoServer:
    parallelismLimit: 10
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
  
  # 应用控制器配置
  applicationController:
    parallelismLimit: 10
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
  
  # 日志配置
  logging:
    verbose: false
    level: "info"
  
  # 高可用配置
  ha:
    enabled: true
    replicas: 2
  
  # Redis 配置
  redis:
    enabled: true
    image:
      tag: "8.2.1-debian-12-r0"
    auth:
      enabled: true
      password: "sunmoonai_redis_2025!"

# ========================================
# 服务配置
# ========================================
service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  httpsPort: 443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  labels:
    environment: "production"
    app: "argocd"

# ========================================
# Ingress 配置
# ========================================
ingress:
  enabled: false

# ========================================
# 安全上下文配置
# ========================================
securityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true

podSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true

# ========================================
# 节点选择器和容忍度
# ========================================
nodeSelector:
  node-type: "compute"
  environment: "production"

tolerations:
  - key: "node-type"
    operator: "Equal"
    value: "compute"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - argocd
          topologyKey: kubernetes.io/hostname

# ========================================
# 标签和注解
# ========================================
labels:
  environment: "production"
  app: "argocd"
  version: "3.1.1"
  tier: "cicd"

annotations:
  environment: "production"
  deployment-type: "helm"
  backup-enabled: "true"
  monitoring-enabled: "true"

# ========================================
# 环境变量
# ========================================
extraEnvVars:
  - name: ARGOCD_SERVER_INSECURE
    value: "false"
  - name: ARGOCD_LOGGING_VERBOSE
    value: "false"
  - name: ARGOCD_LOGGING_LEVEL
    value: "info"
  - name: ARGOCD_REPO_SERVER_PARALLELISM_LIMIT
    value: "10"
  - name: ARGOCD_APPLICATION_CONTROLLER_PARALLELISM_LIMIT
    value: "10"

extraEnvVarsCM: ""
extraEnvVarsSecret: ""

# ========================================
# 卷挂载
# ========================================
extraVolumes:
  - name: argocd-logs
    emptyDir: {}
  - name: argocd-certs
    secret:
      secretName: "argocd-tls-cert"

extraVolumeMounts:
  - name: argocd-logs
    mountPath: "/opt/bitnami/argocd/logs"
  - name: argocd-certs
    mountPath: "/opt/bitnami/argocd/certs"
    readOnly: true

# ========================================
# 初始化容器
# ========================================
initContainers:
  - name: init-argocd-config
    image: "bitnami/os-shell:12-debian-12-r51"
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/bitnami/argocd/logs
        chown -R 1001:1001 /opt/bitnami/argocd/logs
    volumeMounts:
      - name: argocd-logs
        mountPath: "/opt/bitnami/argocd/logs"

# ========================================
# 侧边容器
# ========================================
sidecars: []

# ========================================
# 生命周期钩子
# ========================================
lifecycleHooks:
  preStop:
    exec:
      command:
        - /bin/bash
        - -c
        - "sleep 10"

# ========================================
# 终止宽限期
# ========================================
terminationGracePeriodSeconds: 60
