# ============================================================================
# LLMOps App SSR Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="llmops-app-front-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

SERVICE_NAME="${SERVICE_NAME:-llmops-app-front}"
SERVICE_PORT="${SERVICE_PORT:-3000}"
UNIFIED_HOST="${UNIFIED_HOST:-llmops-front.sunmoonai.com}"
NODE_IP="${NODE_IP:-101.126.151.0}"
USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-true}"
