apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-converter-pvc
  namespace: {{NAMESPACE}}
  labels:
    app: document-converter
spec:
  accessModes:
    - {{PVC_ACCESS_MODE:-ReadWriteOnce}}
  storageClassName: {{PVC_STORAGE_CLASS:-}}
  resources:
    requests:
      storage: {{PVC_STORAGE_SIZE:-10Gi}}
