apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-sunmoonai-dev-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kind-local-storage/rabbitmq
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [kind-control-plane]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-sunmoonai-dev-pvc
  namespace: messaging-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: rabbitmq-sunmoonai-dev-pv
