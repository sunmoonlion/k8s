# Flower 中间件总控部署配置

# 基础配置
FLOWER_PROJECT_ID="sunmoonai"
FLOWER_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 注意：Flower 通过 --url_prefix 自己处理 baseurl，不需要 stripPrefix 中间件（参考 mongo-express）
flower_stripprefix_enabled="false"  # StripPrefix 中间件（已禁用，Flower 自己处理路径）
flower_policy_enabled="true"        # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
flower_stripprefix_priority=200  # StripPrefix 先部署（路径前缀处理要先配置）
flower_policy_priority=100       # Policy 后部署（依赖路径前缀已存在）
