# ============================================================================
# LLMOps App SSR 部署配置
# ============================================================================

# 基础配置
LLMOPS_SSR_PROJECT_ID="sunmoonai"
LLMOPS_SSR_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像配置（与源码构建保持一致）
LLMOPS_SSR_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
LLMOPS_SSR_IMAGE_PROJECT="k8s-images"
LLMOPS_SSR_IMAGE="llmops-app-ssr"
LLMOPS_SSR_TAG="1.0.0"
IMAGE_PULL_POLICY="IfNotPresent"
LLMOPS_SSR_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问域名/IP（Ingress 使用）
LLMOPS_SSR_UNIFIED_HOST="llmops-ssr.sunmoonai.com"
LLMOPS_SSR_NODE_IP="101.126.151.0"
LLMOPS_SSR_EXTERNAL_PORT="30443"

# Secrets / ConfigMaps / Ingress
secrets_enabled="true"
ingress_enabled="true"

# 部署优先级（仅供参考）
secrets_priority=2000
ingress_priority=100

# 资源文件位置
RESOURCES_DIR="../resources"
# 使用生成的 YAML 文件（由 resources/custom-values/generate.sh 生成）
CUSTOM_VALUES_DIR="${RESOURCES_DIR}/custom-values"
LLMOPS_SSR_YAML="${CUSTOM_VALUES_DIR}/llmops-app-ssr-generated.yaml"
