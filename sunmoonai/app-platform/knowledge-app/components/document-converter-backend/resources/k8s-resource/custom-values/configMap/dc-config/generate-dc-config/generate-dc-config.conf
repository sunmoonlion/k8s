# ============================================================================
# Document Converter BFF ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/configmap/document-converter-config.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="document-converter-config-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="configmap"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-document-converter-backend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# ConfigMap 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 ConfigMap YAML 文件
# Document Converter 是轻量级服务，不需要数据库等复杂配置
# ============================================================================
# 服务器与项目配置
PROJECT_NAME="${PROJECT_NAME:-Document Converter}"
SERVER_NAME="${SERVER_NAME:-document-converter.sunmoonai.com}"
SERVER_HOST="${SERVER_HOST:-https://document-converter.sunmoonai.com}"

# CORS 配置
BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS:-[\"https://document-converter.sunmoonai.com\",\"https://document-converter.sunmoonai.com:443\"]}"

# 服务配置
DOCUMENT_CONVERTER_SERVICE_PORT="${DOCUMENT_CONVERTER_SERVICE_PORT:-8000}"
DOCUMENT_CONVERTER_UNIFIED_HOST="${DOCUMENT_CONVERTER_UNIFIED_HOST:-www.sunmoonai.com}"

# Sentry 监控配置（非敏感部分）
SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT:-${ENVIRONMENT:-development}}"  # Sentry 环境标识
SENTRY_RELEASE="${SENTRY_RELEASE:-}"                 # Sentry 版本/发布标识（可选）
SENTRY_TRACES_SAMPLE_RATE="${SENTRY_TRACES_SAMPLE_RATE:-0.1}"  # 性能追踪采样率（0.0-1.0）
SENTRY_PROFILES_SAMPLE_RATE="${SENTRY_PROFILES_SAMPLE_RATE:-0.1}"  # 性能分析采样率（0.0-1.0）

