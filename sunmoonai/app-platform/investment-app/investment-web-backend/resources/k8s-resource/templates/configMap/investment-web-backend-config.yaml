apiVersion: v1
kind: ConfigMap
metadata:
  name: investment-web-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: investment-web-backend
data:
  # 基础（NestJS）
  NODE_ENV: "${NODE_ENV}"
  NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED}"
  PORT: "${PORT}"
  QUEUE_ENABLED: "${QUEUE_ENABLED}"
  QUEUE_ON: "${QUEUE_ON}"

  # 多租户配置
  TENANT_MODE: "${TENANT_MODE}"
  TENANT_DB_TYPE: "${TENANT_DB_TYPE}"

  # Redis 非敏感部分
  REDIS_TYPE: "${REDIS_TYPE}"
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_PORT: "${REDIS_PORT}"
  REDIS_DB: "${REDIS_DB}"
  REDIS_USER: "${REDIS_USER}"

  # Casdoor BFF（非敏感字段）
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_CLIENT_ID: "${CASDOOR_CLIENT_ID}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  FRONTEND_URL: "${FRONTEND_URL}"
  CASDOOR_ORGANIZATION: "${CASDOOR_ORGANIZATION}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"

  # CORS
  CORS: "${CORS}"
