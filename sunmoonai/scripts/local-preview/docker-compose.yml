# 本地预览栈（放本地机跑）：一台机上闭环 Casdoor 登录 → 网页 → 工作台 → 沙箱 → 会合点 → 本地代理（代理在宿主机原生跑，不在这里）。
# 用法见 README.md；先 `bash preview.sh init` 生成 .env 与 secrets/，再 `bash preview.sh up`。
# 端口：3000 网页与 /api（Caddy 合并同源），8100 Casdoor，47100 会合点（给宿主机上的代理），47900 知识 MCP（调试用）。
name: sunmoon-preview

x-backend-env: &backend-env
  ENV: development
  LOG_LEVEL: INFO
  SERVICE_NAME: investment-backend
  DEPLOYMENT_ID: preview
  APP_SLUG: investment
  DATABASE_URL: postgresql+asyncpg://investment:investment@postgres:5432/investment
  MIGRATION_DATABASE_URL: postgresql+psycopg://investment:investment@postgres:5432/investment
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CASDOOR_ENDPOINT: http://localhost:8100
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor:8000
  CASDOOR_ORGANIZATION: sunmoonai
  CASDOOR_VERIFY_SSL: "false"
  ADMIN_CASDOOR_CLIENT_ID: ${ADMIN_CLIENT_ID}
  ADMIN_CASDOOR_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
  ADMIN_CASDOOR_REDIRECT_URI: http://localhost:3000/api/auth/admin/callback
  ADMIN_FRONTEND_BASE_URL: http://localhost:3000
  WEB_CASDOOR_CLIENT_ID: ${WEB_CLIENT_ID}
  WEB_CASDOOR_CLIENT_SECRET: ${WEB_CLIENT_SECRET}
  WEB_CASDOOR_REDIRECT_URI: http://localhost:3000/api/auth/web/callback
  WEB_FRONTEND_BASE_URL: http://localhost:3000
  WEB_AUTH_DEFAULT_RETURN_TO: /zh-CN/workbench
  WEB_AUTH_ALLOWED_RETURN_PATHS: /zh-CN/workbench,/zh-CN/dashboard,/en/workbench,/en/dashboard,/
  SESSION_COOKIE_SECURE: "false"
  ALLOWED_HOSTS: localhost,127.0.0.1,backend-api
  WORKBENCH_ENABLED: "true"
  WORKBENCH_ENVIRONMENT_KEY: user-pc
  WORKBENCH_CREDENTIAL_KEY: ${WORKBENCH_CREDENTIAL_KEY}
  WORKBENCH_RUNNER_ID: preview-runner

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  casdoor:
    image: casbin/casdoor:3.42.0   # 与平台 deploy-casdoor.conf 钉的版本一致
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: "user=casdoor password=casdoor host=postgres port=5432 sslmode=disable dbname=casdoor"
      dbName: casdoor
      origin: http://localhost:8100
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/get-account || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  casdoor-seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: casdoor
      WEB_CLIENT_ID: ${WEB_CLIENT_ID}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET}
      ADMIN_CLIENT_ID: ${ADMIN_CLIENT_ID}
      ADMIN_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET}
      DEMO_USER: ${DEMO_USER}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    volumes:
      - ./casdoor-seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    depends_on:
      casdoor:
        condition: service_healthy
    restart: "no"

  migration:
    image: sunmoon/investment-backend:preview
    build:
      context: ${INVESTMENT_BACKEND_DIR}
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment: *backend-env
    command: ["python", "-m", "app.bootstrap.migration", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-api:
    image: sunmoon/investment-backend:preview
    environment: *backend-env
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      casdoor-seed:
        condition: service_completed_successfully
    volumes:
      - ./secrets:/secrets:ro
      - ./seed_workbench.py:/preview/seed_workbench.py:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 40

  backend-runner:
    image: sunmoon/investment-backend:preview
    environment: *backend-env
    command: ["python", "-m", "app.bootstrap.runner"]
    depends_on:
      backend-api:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro

  frontend:
    image: sunmoon/investment-web-frontend:preview
    build:
      context: ${INVESTMENT_WEB_FRONTEND_DIR}
      dockerfile: mybuild/Dockerfile
      target: run-minimal
      args:
        NODE_IMAGE: node:24.18.0-alpine
        NEXT_PUBLIC_APP_NAME: investment
        APP_ORIGIN: http://localhost:3000
        BACKEND_INTERNAL_URL: http://backend-api:8000
        DEPLOYMENT_ID: preview
    environment:
      DEPLOYMENT_ENV: production
      AUTH_APP: investment
      APP_ORIGIN: http://localhost:3000
      BACKEND_INTERNAL_URL: http://backend-api:8000
      DEPLOYMENT_ID: preview
      REFERENCE_UI_ENABLED: "false"
    depends_on:
      backend-api:
        condition: service_healthy
    profiles: ["full"]

  edge:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend-api:
        condition: service_healthy

  knowledge-mcp:
    image: sunmoon/knowledge-backend:preview
    build:
      context: ${KNOWLEDGE_BACKEND_DIR}
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["uvicorn", "app.bootstrap.mcp:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      KNOWLEDGE_DATASET_PATH: /datasets/lesson23_business_analysis.sqlite
      KNOWLEDGE_DATASET_ID: lesson23-business-analysis
      KNOWLEDGE_MCP_TOKENS_JSON: '{"${KNOWLEDGE_MCP_TOKEN}":{"user":"${RELAY_USER}","sandbox":"preview"}}'
    volumes:
      - ${KNOWLEDGE_DATASET_DIR}:/datasets:ro
    ports:
      - "127.0.0.1:47900:8000"

  relay:
    image: sunmoon/relay:preview
    build:
      context: ${K8S_DIR}/sunmoonai/relay-platform/relay
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "47100"
      RELAY_TOKENS_JSON: '{"${RELAY_USER}":{"agent":"${RELAY_AGENT_TOKEN}","sandbox":"${RELAY_SANDBOX_TOKEN}"}}'
    ports:
      - "127.0.0.1:47100:47100"

  sandbox:
    image: sunmoon/sandbox:preview
    build:
      context: ${K8S_DIR}/sunmoonai/sandbox-platform
      dockerfile: image/Dockerfile
    environment:
      RELAY_URL: ws://relay:47100
      RELAY_USER: ${RELAY_USER}
      RELAY_TOKEN: ${RELAY_SANDBOX_TOKEN}
      APP_SERVER_TOKEN_FILE: /secrets/app-server-token
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      MODEL: ${MODEL}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL}
      KNOWLEDGE_MCP_URL: http://knowledge-mcp:8000/api/mcp/knowledge
      KNOWLEDGE_MCP_TOKEN: ${KNOWLEDGE_MCP_TOKEN}
    volumes:
      - ./secrets:/secrets:ro
      - ${MODEL_AUTH_JSON}:/data/codex/auth.json:ro
    depends_on:
      - relay
      - knowledge-mcp
    profiles: ["full"]

volumes:
  pgdata:
