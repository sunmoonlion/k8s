---
# Browser access and its independent human reader belong to Kibana.
kibana_ui_enabled: true
kibana_ui_origin: 'https://kibana.sunmoonai.com:{{ entry_port }}'
kibana_ui_viewer_user: sunmoon_kibana_reader
kibana_ui_generation: v1
kibana_ui_session_idle_timeout: 30m
kibana_ui_session_lifespan: 8h

# First-install reads row 15d; never import 15a/15b/15c into this reader.
kibana_human_account:
  object: data-platform/elk/kibana/ui
  id: reader
  username: '{{ kibana_ui_viewer_user }}'
  table_row: '15d'
  table_import: true
  current_file: '{{ services_config_dir }}/elk-kibana-ui.yaml'
  current_field: password
  backup_file: '{{ services_backup_dir }}/elk-kibana-ui.yaml'
  initial_file: '{{ services_config_dir }}/presets/kibana-reader-password'
  initial_backup_file: '{{ services_backup_dir }}/presets/kibana-reader-password'
  minimum_length: 8
  maximum_length: 128
  adapter: elasticsearch
