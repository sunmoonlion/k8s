# ============================================================================
# Investment Web Backend ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/configMap/investment-web-backend-config.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="investment-web-backend-config-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="configmap"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-investment-web-backend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# ConfigMap 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 ConfigMap YAML 文件
# ============================================================================
# 服务器与项目配置
PROJECT_NAME="${PROJECT_NAME:-Investment Web}"
SERVER_NAME="${SERVER_NAME:-api.investment.sunmoonai.com}"
SERVER_HOST="${SERVER_HOST:-https://api.investment.sunmoonai.com}"

# CORS 配置
BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS:-[\"https://api.investment.sunmoonai.com\"]}"

# 数据库配置（非敏感部分）
POSTGRES_SERVER="${POSTGRES_SERVER:-101.126.151.0}"  # PostgreSQL 服务器 IP
POSTGRES_PORT="${POSTGRES_PORT:-30444}"              # PostgreSQL 端口
POSTGRES_USER="${POSTGRES_USER:-sunmoonai_dev}"      # PostgreSQL 用户名
POSTGRES_DB="${POSTGRES_DB:-investment_web_db}"          # PostgreSQL 数据库名

# PostgreSQL SSL 模式（非敏感部分）
DB_SSLMODE="${DB_SSLMODE:-disable}"

# DB_* 格式字段（兼容性，非敏感部分）
DB_HOST="${DB_HOST:-${POSTGRES_SERVER}}"
DB_PORT="${DB_PORT:-${POSTGRES_PORT}}"
DB_NAME="${DB_NAME:-${POSTGRES_DB}}"
DB_USER="${DB_USER:-${POSTGRES_USER}}"

# Redis 配置（非敏感部分）
REDIS_HOST="${REDIS_HOST:-redis}"
REDIS_PORT="${REDIS_PORT:-6379}"

# SMTP 配置（非敏感部分）
SMTP_HOST="${SMTP_HOST:-smtp.example.com}"
SMTP_PORT="${SMTP_PORT:-587}"
SMTP_TLS="${SMTP_TLS:-true}"
SMTP_SSL="${SMTP_SSL:-false}"
SMTP_FROM="${SMTP_FROM:-noreply@sunmoonai.com}"
EMAILS_FROM_EMAIL="${EMAILS_FROM_EMAIL:-${SMTP_FROM}}"
EMAILS_FROM_NAME="${EMAILS_FROM_NAME:-${PROJECT_NAME}}"
SMTP_TIMEOUT="${SMTP_TIMEOUT:-10}"

# Sentry 监控配置（非敏感部分）
SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT:-${ENVIRONMENT:-development}}"
SENTRY_TRACES_SAMPLE_RATE="${SENTRY_TRACES_SAMPLE_RATE:-0.1}"
SENTRY_PROFILES_SAMPLE_RATE="${SENTRY_PROFILES_SAMPLE_RATE:-0.1}"
