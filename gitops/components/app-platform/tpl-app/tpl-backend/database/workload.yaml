apiVersion: v1
kind: Namespace
metadata:
  name: tpl-app-dev
  labels:
    app.kubernetes.io/part-of: tpl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: tpl-app-dev}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: application-runtime, namespace: tpl-app-dev}
automountServiceAccountToken: false
imagePullSecrets: [{name: registry-puller}]
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: tpl-app-dev}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: '1', memory: 512Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: tpl-app-dev}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: tpl-app-dev}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tpl-postgresql, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tpl-app-dev}}
          podSelector: {matchLabels: {sunmoonai.com/postgresql-client: 'true'}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgresql-client, namespace: tpl-app-dev}
spec:
  podSelector: {matchLabels: {sunmoonai.com/postgresql-client: 'true'}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: 'tpl-database-v1', namespace: data-platform-dev}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: tpl, sunmoonai.com/postgresql-client: 'true'}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: harbor.sunmoonai.com:30443/platform/postgresql@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: '1', memory: 256Mi}}
          env:
            - {name: PGHOST, value: 'postgresql.data-platform-dev.svc.cluster.local'}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: postgres}
            - {name: PGCONNECT_TIMEOUT, value: '10'}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgresql-auth, key: password}}}
            - {name: MIGRATOR_PASSWORD, valueFrom: {secretKeyRef: {name: tpl-database-bootstrap, key: migrator_password}}}
            - {name: RUNTIME_PASSWORD, valueFrom: {secretKeyRef: {name: tpl-database-bootstrap, key: runtime_password}}}
          command: [/bin/sh, -ec]
          args:
            - |
              psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
              \set VERBOSITY terse
              \getenv migrator_password MIGRATOR_PASSWORD
              \getenv runtime_password RUNTIME_PASSWORD
              SELECT pg_advisory_lock(hashtextextended('sunmoon/tpl/database',0));
              DO $$ BEGIN
                IF EXISTS (SELECT FROM pg_roles WHERE rolname IN ('tpl_runtime','tpl_migrator') AND shobj_description(oid,'pg_authid') IS DISTINCT FROM 'sunmoon-kind/tpl') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing role';
                END IF;
                IF EXISTS (SELECT FROM pg_database WHERE datname='tpl' AND shobj_description(oid,'pg_database') IS DISTINCT FROM 'sunmoon-kind/tpl') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing database';
                END IF;
              END $$;
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','tpl_migrator',:'migrator_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='tpl_migrator') \gexec
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','tpl_runtime',:'runtime_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='tpl_runtime') \gexec
              COMMENT ON ROLE tpl_migrator IS 'sunmoon-kind/tpl';
              COMMENT ON ROLE tpl_runtime IS 'sunmoon-kind/tpl';
              SELECT format('CREATE DATABASE %I OWNER %I','tpl','tpl_migrator') WHERE NOT EXISTS(SELECT FROM pg_database WHERE datname='tpl') \gexec
              COMMENT ON DATABASE tpl IS 'sunmoon-kind/tpl';
              REVOKE ALL ON DATABASE tpl FROM PUBLIC;
              GRANT CONNECT ON DATABASE tpl TO tpl_runtime;
              SQL
              PGPASSWORD="$MIGRATOR_PASSWORD" psql --no-psqlrc -U tpl_migrator -d tpl --set=ON_ERROR_STOP=1 <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              GRANT USAGE ON SCHEMA public TO tpl_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO tpl_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO tpl_runtime;
              SQL
              PGPASSWORD="$RUNTIME_PASSWORD" psql --no-psqlrc -U tpl_runtime -d tpl --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
              echo 'TPL independent database identities verified'
