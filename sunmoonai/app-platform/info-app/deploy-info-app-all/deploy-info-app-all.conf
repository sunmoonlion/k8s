# ============================================================================
# Info App 业务应用配置
# ============================================================================
INFO_APP_PROJECT_ID="sunmoonai"
INFO_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"
INFO_APP_IMAGE_TAG="${INFO_APP_IMAGE_TAG:-1.0.0-rebuild.20260615}"

# App 源码根目录。Backend 的资源声明随源码维护。
INFO_APP_SOURCE_ROOT="${INFO_APP_SOURCE_ROOT:-${HOME}/info-app}"

# Backend 能力默认完整启用；是否启动组件由下面的集群开关决定。
info_admin_backend_database_access_enabled="true"
info_admin_backend_storage_access_enabled="true"
info_admin_backend_search_access_enabled="true"
info_web_backend_database_access_enabled="true"
info_web_backend_storage_access_enabled="true"
info_web_backend_search_access_enabled="true"

info_admin_backend_configured="true"
info_admin_frontend_configured="true"
info_web_backend_configured="true"
info_web_frontend_configured="true"

C1_info_admin_backend_enabled="true"
C2_info_admin_backend_enabled="false"
C3_info_admin_backend_enabled="false"
KIND_info_admin_backend_enabled="true"

C1_info_admin_frontend_enabled="true"
C2_info_admin_frontend_enabled="false"
C3_info_admin_frontend_enabled="false"
KIND_info_admin_frontend_enabled="true"

C1_info_web_backend_enabled="true"
C2_info_web_backend_enabled="false"
C3_info_web_backend_enabled="false"
KIND_info_web_backend_enabled="true"

C1_info_web_frontend_enabled="true"
C2_info_web_frontend_enabled="false"
C3_info_web_frontend_enabled="false"
KIND_info_web_frontend_enabled="true"

C1_info_admin_backend_priority=900
C2_info_admin_backend_priority=900
C3_info_admin_backend_priority=900
KIND_info_admin_backend_priority=900

C1_info_admin_frontend_priority=800
C2_info_admin_frontend_priority=800
C3_info_admin_frontend_priority=800
KIND_info_admin_frontend_priority=800

C1_info_web_backend_priority=700
