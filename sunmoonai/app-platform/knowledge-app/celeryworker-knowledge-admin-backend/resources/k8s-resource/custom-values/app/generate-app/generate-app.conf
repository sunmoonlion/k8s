# Secret / ConfigMap 名称
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME:-celeryworker-knowledge-admin-backend-secret}"
