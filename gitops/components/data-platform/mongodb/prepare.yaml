---
- name: Validate the owned single member MongoDB profile
  ansible.builtin.assert:
    quiet: true
    that:
      - mongodb_volume.uid == 999 and mongodb_volume.gid == 999
      - mongodb_port == 27017
      - mongodb_replica_set is match('^[a-z][a-z0-9_]+$')
      - mongodb_acceptance_database is match('^[a-z][a-z0-9_]+$')
      - mongodb_init_generation is match('^v[1-9][0-9]*$')
      - mongodb_wiredtiger_cache_gib | float >= 0.25
      - mongodb_oplog_mib | int >= 128
      - image_map.mongodb.source is search('noble$')
- name: Read the optional MongoDB administrator preset without changing an existing account
  ansible.builtin.include_tasks: '{{ playbook_dir }}/../host/tasks/account-preset.yaml'
  vars: {human_account: '{{ operator_account_mongodb }}'}
  no_log: true
- name: Prepare independent recoverable MongoDB credentials
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/component-input.yaml'
  vars:
    component_input_name: mongodb
    component_input_manifest: data-platform/mongodb/auth.sops.yaml
    component_initial_input:
      root_username: sunmoon_mongo_admin
      root_password: '{{ platform_admin_initials.get("data-platform/mongodb") or lookup("password","/dev/null",length=40,chars=["ascii_letters","digits"]) }}'
      replica_key: '{{ lookup("password","/dev/null",length=96,chars=["ascii_letters","digits"]) }}'
      acceptance_username: sunmoon_mongo_probe
      acceptance_password: '{{ lookup("password","/dev/null",length=40,chars=["ascii_letters","digits"]) }}'
  no_log: true
- name: Keep MongoDB identities only in memory
  ansible.builtin.set_fact: {mongodb_credentials: '{{ component_private_input }}'}
  no_log: true
- name: Validate MongoDB private fields
  ansible.builtin.assert:
    quiet: true
    that:
      - mongodb_credentials.root_username == operator_account_mongodb.username
      - mongodb_credentials.acceptance_username == 'sunmoon_mongo_probe'
      - mongodb_credentials.root_password | length >= operator_account_mongodb.minimum_length | int
      - mongodb_credentials.root_password | length <= operator_account_mongodb.maximum_length | int
      - mongodb_credentials.root_password is not search('[\r\n\x00]')
      - mongodb_credentials.acceptance_password is match('^[a-zA-Z0-9]{40}$')
      - mongodb_credentials.replica_key is match('^[a-zA-Z0-9]{96}$')
  no_log: true
- name: Prepare independent MongoDB TLS identity
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/component-tls.yaml'
  vars:
    tls_component: mongodb
    tls_component_namespace: '{{ data_namespace }}'
    tls_guard_manifest: data-platform/mongodb/auth.sops.yaml
- name: Encrypt runtime root identity, replica key and TLS
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: data-platform/mongodb/auth.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: mongodb-auth, namespace: '{{ data_namespace }}'}
        stringData:
          root-username: '{{ mongodb_credentials.root_username }}'
          root-password: '{{ mongodb_credentials.root_password }}'
          replica-key: '{{ mongodb_credentials.replica_key }}'
          input.json: '{{ mongodb_credentials | to_json }}'
          server.pem: '{{ component_tls_material.mongodb.cert + component_tls_material.mongodb.key }}'
          ca.crt: '{{ component_tls_material.mongodb.ca }}'
  no_log: true
- name: Encrypt bounded independent initialization credentials
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: data-platform/mongodb/initialize/auth.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: mongodb-initialize-auth, namespace: '{{ data_namespace }}'}
        stringData:
          input.json: '{{ mongodb_credentials | dict2items | rejectattr("key","equalto","replica_key") | items2dict | to_json }}'
          ca.crt: '{{ component_tls_material.mongodb.ca }}'
  no_log: true
- name: Derive only MongoDB rollout identity
  ansible.builtin.set_fact:
    mongodb_input_digest: '{{ [mongodb_credentials,component_tls_material.mongodb] | to_json | hash("sha256") }}'
  no_log: true
- name: Render MongoDB runtime and independent initialization candidate
  ansible.builtin.template:
    src: '{{ playbook_dir }}/../../gitops/components/data-platform/mongodb/{{ item }}/workload.yaml.j2'
    dest: '{{ build }}/data-platform/mongodb/{{ item }}/workload.yaml'
    owner: '{{ cluster_operator }}'
    mode: '0644'
  loop: ['.', initialize]
- name: Render explicit MongoDB roots
  ansible.builtin.copy:
    dest: '{{ build }}/data-platform/mongodb/{{ item }}/kustomization.yaml'
    owner: '{{ cluster_operator }}'
    mode: '0644'
    content: |
      {{ {'apiVersion':'kustomize.config.k8s.io/v1beta1','kind':'Kustomization','resources':['workload.yaml','auth.sops.yaml']} | to_nice_yaml }}
  loop: ['.', initialize]
