# ============================================================================
# Messaging Platform 平台基础配置
# ============================================================================
MESSAGING_PLATFORM_PROJECT_ID="sunmoonai"
MESSAGING_PLATFORM_NAMESPACE="messaging-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 全局持久化模式（与总部署脚本保持一致，供直接调用本脚本时使用）
# ============================================================================
# 说明：
# - 不设置（默认）：各组件使用自己 deploy-*.conf 中的 *_PERSIST_MODE（init|reuse）
# - 设置为 init ：所有已实现持久化模式的组件强制走“新盘”初始化模式
# - 设置为 reuse：所有已实现持久化模式的组件强制走“复用老盘”模式
#   覆盖的 Messaging Platform 组件包括：
#     - RabbitMQ        （RABBITMQ_PERSIST_MODE）
# 使用示例：
#   SUNMOONAI_GLOBAL_PERSIST_MODE="reuse" ./deploy-messaging-platform-all.sh deploy sunmoonai messaging-platform-dev development
# 或在此处取消注释进行长期配置（注意：若由总部署脚本调用，总部署中的设置仍可通过环境变量覆盖）：
# SUNMOONAI_GLOBAL_PERSIST_MODE="init"

# ============================================================================
# 子级部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# C1_/C2_/C3_/KIND_ 按集群；脚本中 rabbitmq_enabled 由 apply_cluster_config_mapping 覆盖
C1_rabbitmq_enabled="true"
C2_rabbitmq_enabled="true"
C3_rabbitmq_enabled="true"
KIND_rabbitmq_enabled="true"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
C1_rabbitmq_priority=900
C2_rabbitmq_priority=900
C3_rabbitmq_priority=900
KIND_rabbitmq_priority=900


