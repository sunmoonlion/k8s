# ============================================================================
# research-web-frontend ConfigMap YAML 生成配置
# 字段来源：应用 .env 中的非敏感字段
# ============================================================================

TEMPLATE_FILE="templates/configMap/research-web-frontend-config.yaml"
OUTPUT_FILE="research-web-frontend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

NODE_ENV="${NODE_ENV:-production}"
NEXT_PUBLIC_APP_NAME="${NEXT_PUBLIC_APP_NAME:-research}"
NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://research-admin-api.sunmoonai.com/api}"
