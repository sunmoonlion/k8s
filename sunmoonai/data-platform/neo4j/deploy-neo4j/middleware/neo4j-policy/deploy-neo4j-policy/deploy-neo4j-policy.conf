# Neo4j 策略中间件部署配置

# 基础配置
NEO4J_PROJECT_ID="sunmoonai"
NEO4J_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
NEO4J_POLICY_TYPES="rateLimit,headers"

# 限流配置
NEO4J_RATE_LIMIT_AVERAGE="50"
NEO4J_RATE_LIMIT_BURST="100"

# 头部配置
NEO4J_HEADERS_CUSTOM_REQUEST_HEADERS="X-Neo4j-Version:8.11"
NEO4J_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Neo4j-Status:active"

