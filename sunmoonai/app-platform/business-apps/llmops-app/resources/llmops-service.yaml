apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-service
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llmops-service
  template:
    metadata:
      labels:
        app: llmops-service
    spec:
      containers:
      - name: llmops-service
        image: ${LLMOPS_SERVICE_FULL_IMAGE_NAME:-${LLMOPS_SERVICE_IMAGE_REGISTRY}/${LLMOPS_SERVICE_IMAGE_PROJECT}/${LLMOPS_SERVICE_IMAGE}:${LLMOPS_SERVICE_TAG}}  # Harbor 镜像路径：仓库/项目/镜像名:标签
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}  # IfNotPresent: 如果本地有镜像则使用本地，否则从 Harbor 拉取
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: llmops-service-config
        - secretRef:
            name: llmops-service-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-service
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-service
spec:
  selector:
    app: llmops-service
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
