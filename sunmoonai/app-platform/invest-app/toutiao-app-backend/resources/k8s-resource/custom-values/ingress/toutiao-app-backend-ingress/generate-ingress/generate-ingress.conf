# ============================================================================
# toutiao-app-backend Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="toutiao-app-backend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

# 基础配置
NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Ingress 数据内容
# ============================================================================
SERVICE_NAME="${SERVICE_NAME:-toutiao-app-backend}"
SERVICE_PORT="${SERVICE_PORT:-5000}"
UNIFIED_HOST="${UNIFIED_HOST:-toutiao-api.sunmoonai.com}"
NODE_IP="${NODE_IP:-115.190.153.150}"
