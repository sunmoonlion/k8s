# ============================================================================
# ONLYOFFICE Docs App BFF YAML 生成配置
# ============================================================================
# 注意：主应用使用 Helm 部署，这里只生成 Ingress 和 Middleware 的 YAML

# 需要生成的资源列表
# 格式：资源类型:模板路径:输出文件名:是否启用
GENERATE_RESOURCES=(
    "middleware:templates/middleware/onlyoffice-docs-stripprefix.yaml:onlyoffice-docs-stripprefix-generated.yaml:true"
    "ingress:templates/ingress/ingress.yaml:onlyoffice-docs-ingress-generated.yaml:true"
)

# 生成顺序
GENERATE_ORDER=(
    "middleware:ingress"
)

# 部署配置路径
DEPLOY_CONFIG="../../deploy-onlyoffice-docs/deploy-onlyoffice-docs.conf"
