# toutiao-app-backend 路由配置 (Traefik IngressRoute)
# Flask API 服务，端口 5000
#
# 访问方式：
# 方案1: https://<节点IP>:30443/api/v1/
# 方案2: https://toutiao-api.sunmoonai.com/api/v1/
#
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: toutiao-app-backend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: invest-app-ingress
    component: toutiao-app-backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
