# ============================================================================
# LLMOps App SSR YAML 生成配置
# ============================================================================

# 需要生成的资源列表
# 格式：资源类型:模板路径:输出文件名:是否启用
GENERATE_RESOURCES=(
    "pvc:templates/pvc/llmops-app-ssr-pvc.yaml:llmops-app-ssr-pvc-generated.yaml:true"
    "app:templates/app/llmops-app-ssr.yaml:llmops-app-ssr-generated.yaml:true"
    "configmap:templates/configmap/llmops-app-ssr-config.yaml:llmops-app-ssr-config-generated.yaml:true"
    "secret:templates/secret/llmops-app-ssr-secret.yaml:llmops-app-ssr-secret-generated.yaml:true"
    "secret:templates/secret/harbor-registry-secret.yaml:harbor-registry-secret-generated.yaml:true"
    "ingress:templates/ingress/ingress.yaml:llmops-app-ssr-ingress-generated.yaml:true"
)

# 生成顺序
GENERATE_ORDER=(
    "pvc:app"
    "configmap:app"
    "secret:app"
    "app:ingress"
)

# 部署配置路径
DEPLOY_CONFIG="../../deploy-llmops-ssr/deploy-llmops-ssr.conf"
