apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-app-ssr
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-app-ssr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmops-app-ssr
  template:
    metadata:
      labels:
        app: llmops-app-ssr
    spec:
      imagePullSecrets:
      - name: ${LLMOPS_SSR_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: llmops-app-ssr
        image: ${LLMOPS_SSR_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: llmops-app-ssr-config
        - secretRef:
            name: llmops-app-ssr-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data-storage
          mountPath: ${PVC_MOUNT_PATH:-/app/data}
          subPath: ${PVC_SUB_PATH:-}
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: ${PVC_NAME:-llmops-app-ssr-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-app-ssr
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llmops-app-ssr
spec:
  selector:
    app: llmops-app-ssr
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
