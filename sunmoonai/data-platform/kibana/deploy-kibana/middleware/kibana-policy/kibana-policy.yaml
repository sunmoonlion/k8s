apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kibana-ratelimit
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: kibana-ratelimit
    project: sunmoonai
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kibana-headers
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: kibana-headers
    project: sunmoonai
spec:
  headers:
    customRequestHeaders:
      X-Kibana-Version: "9.1.2"
    customResponseHeaders:
      X-Kibana-Status: "active"

