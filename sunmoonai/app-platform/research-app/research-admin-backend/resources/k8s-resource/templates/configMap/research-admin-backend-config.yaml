apiVersion: v1
kind: ConfigMap
metadata:
  name: research-admin-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: research-admin-backend
data:
  ENV: "${ENV}"
  LOG_LEVEL: "${LOG_LEVEL}"
  SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS}"
  AGENT_SESSION_LOCK_TTL_SECONDS: "${AGENT_SESSION_LOCK_TTL_SECONDS}"
  AGENT_V4_TRAFFIC_ENABLED: "${AGENT_V4_TRAFFIC_ENABLED}"
  AGENT_V5_TRAFFIC_MODE: "${AGENT_V5_TRAFFIC_MODE}"
  AGENT_REDIS_KEY_PREFIX: "${AGENT_REDIS_KEY_PREFIX}"
  FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_ORGANIZATION: "${CASDOOR_ORGANIZATION}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  CASDOOR_VERIFY_SSL: "${CASDOOR_VERIFY_SSL}"
  FRONTEND_ALLOWED_ORIGINS: "${FRONTEND_ALLOWED_ORIGINS}"
  AUTH_POLICY_VERSION: "${AUTH_POLICY_VERSION}"
  AUTH_ALLOWED_ALGORITHMS: "${AUTH_ALLOWED_ALGORITHMS}"
  KNOWLEDGE_RETRIEVAL_URL: "${KNOWLEDGE_RETRIEVAL_URL}"
  KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION: "${KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION}"
  KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL: "${KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL}"
  KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT: "${KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT}"
  KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE: "${KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE}"
  KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS: "${KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS}"
  CELERY_QUEUE: "${CELERY_QUEUE}"
  CELERY_TASK_DEFAULT_QUEUE: "${CELERY_QUEUE}"
