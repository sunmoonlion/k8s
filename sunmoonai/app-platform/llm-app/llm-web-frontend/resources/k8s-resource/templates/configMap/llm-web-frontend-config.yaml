apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-web-frontend-config
  namespace: ${NAMESPACE}
  labels:
    app: llm-web-frontend
data:
  # NEXT_PUBLIC_* 变量在 Docker 构建时通过 --build-arg 注入，已静态嵌入 bundle，运行时无需重复注入。
  # 以下为 Next.js API Routes（BFF）在服务端读取的运行时变量（非敏感部分）。

  # Casdoor OIDC（非敏感字段）
  CASDOOR_ENDPOINT: "${CASDOOR_ENDPOINT}"
  CASDOOR_CLIENT_ID: "${CASDOOR_CLIENT_ID}"
  CASDOOR_REDIRECT_URI: "${CASDOOR_REDIRECT_URI}"
  CASDOOR_ORGANIZATION: "${CASDOOR_ORGANIZATION}"
  CASDOOR_APPLICATION: "${CASDOOR_APPLICATION}"
