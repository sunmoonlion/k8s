apiVersion: v1
kind: Secret
metadata:
  name: portal-app-backend-secret
  namespace: ${NAMESPACE}
  labels:
    app: portal-app-backend
type: Opaque
stringData:
  # ========================================================================
  # 应用密钥（Secret - 生产环境必须修改）
  # ========================================================================
  JWT_SECRET: "${JWT_SECRET}"

  # ========================================================================
  # 数据库配置（Secret - 生产环境必须修改）
  # ========================================================================
  DATABASE_URL: "${DATABASE_URL}"

  # ========================================================================
  # 其他敏感配置（根据实际需要添加）
  # ========================================================================
  # REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

