C3_nodebullworker_llm_web_backend_enabled="false"
KIND_nodebullworker_llm_web_backend_enabled="true"

C1_celeryworker_llm_admin_backend_enabled="true"
C2_celeryworker_llm_admin_backend_enabled="false"
C3_celeryworker_llm_admin_backend_enabled="false"
KIND_celeryworker_llm_admin_backend_enabled="true"

C1_llm_web_frontend_enabled="true"
C2_llm_web_frontend_enabled="false"
C3_llm_web_frontend_enabled="false"
KIND_llm_web_frontend_enabled="true"

