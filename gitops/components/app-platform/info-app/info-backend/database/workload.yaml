apiVersion: v1
kind: ServiceAccount
metadata: {name: info-runtime, namespace: app-platform-dev}
automountServiceAccountToken: false
imagePullSecrets: [{name: registry-puller}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: 'info-database-v1', namespace: data-platform-dev}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: info, sunmoonai.com/postgresql-client: 'true'}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: harbor.sunmoonai.com:30443/platform/postgresql@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: '1', memory: 256Mi}}
          env:
            - {name: PGHOST, value: 'postgresql.data-platform-dev.svc.cluster.local'}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: postgres}
            - {name: PGCONNECT_TIMEOUT, value: '10'}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgresql-auth, key: password}}}
            - {name: MIGRATOR_PASSWORD, valueFrom: {secretKeyRef: {name: info-database-bootstrap, key: migrator_password}}}
            - {name: RUNTIME_PASSWORD, valueFrom: {secretKeyRef: {name: info-database-bootstrap, key: runtime_password}}}
          command: [/bin/sh, -ec]
          args:
            - |
              psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
              \set VERBOSITY terse
              \getenv migrator_password MIGRATOR_PASSWORD
              \getenv runtime_password RUNTIME_PASSWORD
              SELECT pg_advisory_lock(hashtextextended('sunmoon/info/database',0));
              DO $bootstrap$ BEGIN
                IF EXISTS (SELECT FROM pg_roles WHERE rolname IN ('info_runtime','info_migrator') AND shobj_description(oid,'pg_authid') IS DISTINCT FROM 'sunmoon-kind/info') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing role';
                END IF;
                IF EXISTS (SELECT FROM pg_database WHERE datname='info' AND shobj_description(oid,'pg_database') IS DISTINCT FROM 'sunmoon-kind/info') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing database';
                END IF;
              END $bootstrap$;
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','info_migrator',:'migrator_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='info_migrator') \gexec
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','info_runtime',:'runtime_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='info_runtime') \gexec
              COMMENT ON ROLE info_migrator IS 'sunmoon-kind/info';
              COMMENT ON ROLE info_runtime IS 'sunmoon-kind/info';
              SELECT format('CREATE DATABASE %I OWNER %I','info','info_migrator') WHERE NOT EXISTS(SELECT FROM pg_database WHERE datname='info') \gexec
              COMMENT ON DATABASE info IS 'sunmoon-kind/info';
              REVOKE ALL ON DATABASE info FROM PUBLIC;
              GRANT CONNECT ON DATABASE info TO info_runtime;
              SQL
              psql --no-psqlrc -d info --set=ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
              PGPASSWORD="$MIGRATOR_PASSWORD" psql --no-psqlrc -U info_migrator -d info --set=ON_ERROR_STOP=1 <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              GRANT USAGE ON SCHEMA public TO info_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO info_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO info_runtime;
              SQL
              PGPASSWORD="$RUNTIME_PASSWORD" psql --no-psqlrc -U info_runtime -d info --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
              echo 'INFO independent database identities verified'
