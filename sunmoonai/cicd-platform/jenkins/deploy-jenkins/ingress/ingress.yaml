# Jenkins Web 路由配置
# 通过 Traefik HTTP 路由暴露 Jenkins 服务
#
# 使用路径前缀路由，避免需要在 /etc/hosts 中配置多个域名
# 访问方式：
# - https://<节点IP>:30443/jenkins
# - 或 https://www.sunmoonai.com/jenkins (如果配置了 DNS)
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: cicd-platform-ingress
    component: jenkins-web
spec:
  entryPoints:
    - websecure
  routes:
    # 使用路径前缀路由，支持 IP 或统一域名
    # 方案1: 使用 IP 地址（无需 DNS 配置）
    # 访问: https://<节点IP>:30443/jenkins
    # 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
    # 访问: https://www.sunmoonai.com/jenkins
    #
    # 路由策略：
    # Bitnami Jenkins 默认支持子路径模式，不需要使用 stripPrefix！
    # Jenkins 会自动处理 /jenkins 前缀：
    #   - 访问 /jenkins → 自动 302 重定向到 /jenkins/login
    #   - 这是 Jenkins 的标准行为
    # 如果使用 stripPrefix，会导致路径不匹配，出现 Internal Server Error
    #
    # IP 地址路由
    # 只匹配 /jenkins 前缀路径，不使用 stripPrefix，让 Jenkins 自己处理子路径
    - match: Host(`115.190.153.150`) && PathPrefix(`/jenkins`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: jenkins-policy
    # 统一域名路由
    # 只匹配 /jenkins 前缀路径，不使用 stripPrefix，让 Jenkins 自己处理子路径
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/jenkins`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: jenkins-policy
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: traefik-tls-secret
