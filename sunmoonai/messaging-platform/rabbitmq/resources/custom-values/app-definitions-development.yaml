# RabbitMQ application topology for development.
# One shared RabbitMQ instance, one vhost per app+env, one producer and one worker user per backend.

auth:
  securePassword: false

loadDefinition:
  enabled: true
  existingSecret: rabbitmq-app-definitions

extraConfiguration: |-
  load_definitions = /app/load_definition.json

extraSecrets:
  rabbitmq-app-definitions:
    load_definition.json: |
      {
        "vhosts": [
          {"name": "info-development"},
          {"name": "research-development"},
          {"name": "investment-development"},
          {"name": "knowledge-development"}
        ],
        "users": [
          {"name": "info-admin-backend-producer", "password": "info-admin-backend-producer-dev", "tags": ""},
          {"name": "info-admin-backend-worker", "password": "info-admin-backend-worker-dev", "tags": ""},
          {"name": "research-admin-backend-producer", "password": "research-admin-backend-producer-dev", "tags": ""},
          {"name": "research-admin-backend-worker", "password": "research-admin-backend-worker-dev", "tags": ""},
          {"name": "investment-backend-worker", "password": "investment-backend-worker-dev", "tags": ""},
          {"name": "knowledge-admin-backend-producer", "password": "knowledge-admin-backend-producer-dev", "tags": ""},
          {"name": "knowledge-admin-backend-worker", "password": "knowledge-admin-backend-worker-dev", "tags": ""}
        ],
        "permissions": [
          {"user": "info-admin-backend-producer", "vhost": "info-development", "configure": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "info-admin-backend-worker", "vhost": "info-development", "configure": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^info\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "research-admin-backend-producer", "vhost": "research-development", "configure": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "research-admin-backend-worker", "vhost": "research-development", "configure": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^research\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "investment-backend-worker", "vhost": "investment-development", "configure": "^investment\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^investment\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^investment\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "knowledge-admin-backend-producer", "vhost": "knowledge-development", "configure": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"},
          {"user": "knowledge-admin-backend-worker", "vhost": "knowledge-development", "configure": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "write": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$", "read": "^knowledge\\.admin\\.default$|^celery|^celery\\..*|^reply\\.celery\\..*|^.*\\.reply\\.celery\\.pidbox$|^celeryev$"}
        ],
        "queues": [
          {"name": "info.admin.default", "vhost": "info-development", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "research.admin.default", "vhost": "research-development", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "investment.default", "vhost": "investment-development", "durable": true, "auto_delete": false, "arguments": {}},
          {"name": "knowledge.admin.default", "vhost": "knowledge-development", "durable": true, "auto_delete": false, "arguments": {}}
        ]
      }
