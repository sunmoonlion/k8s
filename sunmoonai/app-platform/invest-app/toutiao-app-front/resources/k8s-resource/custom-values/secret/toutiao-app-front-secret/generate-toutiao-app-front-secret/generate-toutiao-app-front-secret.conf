# ============================================================================
# toutiao-app-front Secret YAML 生成配置
# ⚠️ 敏感信息：妥善保管，不要提交到 git
# ============================================================================

TEMPLATE_FILE="templates/secret/toutiao-app-front-secret.yaml"
OUTPUT_FILE="toutiao-app-front-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# OIDC 客户端密钥（与 auth-app-backend 中注册的 client_secret 一致）
AUTH_CLIENT_SECRET="${AUTH_CLIENT_SECRET:-changeme}"

# Session 加密密钥（随机 32 字符字符串）
SESSION_SECRET="${SESSION_SECRET:-changeme}"
