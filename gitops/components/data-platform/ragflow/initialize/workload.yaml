apiVersion: batch/v1
kind: Job
metadata: {name: ragflow-initialize-v5, namespace: data-platform-dev}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {app.kubernetes.io/name: ragflow, app.kubernetes.io/component: initialize, sunmoonai.com/postgresql-client: 'true', sunmoonai.com/object-storage-client: 'true'}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: 'sunmoon-kind-worker2'}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: initialize
          image: harbor.sunmoonai.com:30443/platform/ragflow-runtime@sha256:3b2328c9e8e0fe36d834d4204e5c519558b66150f0ed8a3ab0ad03dde8264b0e
          imagePullPolicy: IfNotPresent
          command: [/ragflow/.venv/bin/python3, /sunmoon/initialize.py]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: '2', memory: 4Gi}}
          env:
            - {name: DEVICE, value: cpu}
            - {name: DB_TYPE, value: postgres}
            - {name: DOC_ENGINE, value: infinity}
            - {name: STORAGE_IMPL, value: AWS_S3}
            - {name: REGISTER_ENABLED, value: '0'}
            - {name: ENABLE_CHAT_CHANNEL, value: '0'}
            - {name: HF_HUB_OFFLINE, value: '1'}
            - {name: TRANSFORMERS_OFFLINE, value: '1'}
            - {name: PIP_NO_INDEX, value: '1'}
            - {name: UV_OFFLINE, value: 'true'}
            - {name: HOME, value: /tmp/home}
            - {name: OMP_NUM_THREADS, value: '1'}
            - {name: OPENBLAS_NUM_THREADS, value: '1'}
            - {name: MKL_NUM_THREADS, value: '1'}
            - {name: MAX_CONCURRENT_TASKS, value: '1'}
            - {name: AWS_EC2_METADATA_DISABLED, value: 'true'}
            - {name: LITELLM_LOCAL_MODEL_COST_MAP, value: 'True'}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: AWS_CA_BUNDLE, value: /run/bootstrap/ca.crt}
          volumeMounts:
            - {name: scripts, mountPath: /sunmoon, readOnly: true}
            - {name: auth, mountPath: /ragflow/conf/service_conf.yaml, subPath: service_conf.yaml, readOnly: true}
            - {name: auth, mountPath: /run/bootstrap, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /ragflow/logs}
      volumes:
        - {name: scripts, configMap: {name: ragflow-initialize-v5}}
        - {name: auth, secret: {secretName: ragflow-initialize-auth, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
        - {name: logs, emptyDir: {sizeLimit: 256Mi}}
