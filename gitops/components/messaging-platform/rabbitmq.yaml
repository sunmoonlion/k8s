---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: messaging-platform-dev
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports: [{name: service, port: 5672, targetPort: 5672}]
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: messaging-platform-dev
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: service, port: 5672, targetPort: 5672}
    - {name: management, port: 15672, targetPort: 15672}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: messaging-platform-dev
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: sunmoon-platform}
    spec:
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # Single-node persistent identity, independent of the namespace Service DNS.
      hostAliases:
        - ip: '127.0.0.1'
          hostnames: ['rabbitmq-0.rabbitmq-headless.platform-system.svc.cluster.local']
      nodeSelector:
        kubernetes.io/hostname: sunmoon-kind-worker2
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: cookie
          image: harbor.sunmoonai.com:30443/platform/rabbitmq@sha256:f50f1cbbec73032d248d516b043a6dd334302b571d71b68486e7b32a86efb45d
          command: [/bin/sh, -ec]
          args:
            - 'if [ ! -e /var/lib/rabbitmq/.erlang.cookie ]; then cp /run/auth/erlang-cookie /var/lib/rabbitmq/.erlang.cookie; chmod 600 /var/lib/rabbitmq/.erlang.cookie; fi; cmp --silent /run/auth/erlang-cookie /var/lib/rabbitmq/.erlang.cookie'
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: auth, mountPath: /run/auth, readOnly: true}
      containers:
        - name: rabbitmq
          image: harbor.sunmoonai.com:30443/platform/rabbitmq@sha256:f50f1cbbec73032d248d516b043a6dd334302b571d71b68486e7b32a86efb45d
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          ports:
            - {name: service, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: RABBITMQ_USE_LONGNAME, value: 'true'}
            - {name: RABBITMQ_NODENAME, value: 'rabbit@rabbitmq-0.rabbitmq-headless.platform-system.svc.cluster.local'}
            - {name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: '+S 2:2'}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, check_running]}
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
            - {name: auth, mountPath: /run/auth, readOnly: true}
            - {name: auth, mountPath: /etc/rabbitmq/conf.d/20-sunmoon.conf, subPath: rabbitmq.conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: rabbitmq-data}}
        - {name: auth, secret: {secretName: rabbitmq-auth, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
