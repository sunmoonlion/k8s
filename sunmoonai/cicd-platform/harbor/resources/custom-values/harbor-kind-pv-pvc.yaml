apiVersion: v1
kind: PersistentVolume
metadata:
  name: harbor-sunmoonai-trivy-dev-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kind-local-storage/harbor
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [kind-worker]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-sunmoonai-trivy-dev-pvc
  namespace: cicd-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: harbor-sunmoonai-trivy-dev-pv
