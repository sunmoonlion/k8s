# ============================================================================
# investment-web-frontend Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="investment-web-frontend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# TODO: 填写 Ingress 路由配置
SERVICE_NAME="${SERVICE_NAME:-investment-web-frontend}"
SERVICE_PORT="${SERVICE_PORT:-3000}"
UNIFIED_HOST="${UNIFIED_HOST:-investment.sunmoonai.com}"

USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-false}"
