# Elasticsearch 生产环境配置

global:
  kibanaEnabled: false
  defaultStorageClass: "fast-ssd"

clusterName: elasticsearch-prod

master:
  replicaCount: 3
  resourcesPreset: "medium"
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  heapSize: 1g
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "fast-ssd"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: elasticsearch
                app.kubernetes.io/component: master
            topologyKey: kubernetes.io/hostname

data:
  replicaCount: 3
  resourcesPreset: "large"
  resources:
    requests:
      cpu: 2
      memory: 4Gi
    limits:
      cpu: 4
      memory: 8Gi
  heapSize: 2g
  persistence:
    enabled: true
    size: 100Gi
    storageClass: "fast-ssd"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: elasticsearch
                app.kubernetes.io/component: data
            topologyKey: kubernetes.io/hostname

coordinating:
  replicaCount: 2
  resourcesPreset: "medium"
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  heapSize: 1g

ingest:
  replicaCount: 2
  resourcesPreset: "medium"
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  heapSize: 1g

service:
  type: ClusterIP
  ports:
    restAPI: 9200
    transport: 9300

security:
  enabled: true
  existingSecret: elasticsearch-secrets
  tls:
    restEncryption: true
    autoGenerated: true
    verificationMode: certificate

metrics:
  enabled: true
  resourcesPreset: "small"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

sysctlImage:
  enabled: true
  resourcesPreset: "nano"

networkPolicy:
  enabled: true
