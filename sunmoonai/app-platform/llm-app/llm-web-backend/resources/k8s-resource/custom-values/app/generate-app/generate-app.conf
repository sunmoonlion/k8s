# ============================================================================
# Llm Web Backend YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/app/llm-web-backend.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="llm-web-backend-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="app"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# App 数据内容（用于生成 YAML）
# ============================================================================
# 镜像配置
LLM_WEB_BACKEND_IMAGE_REGISTRY="${LLM_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
LLM_WEB_BACKEND_IMAGE_PROJECT="${LLM_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
LLM_WEB_BACKEND_IMAGE="${LLM_WEB_BACKEND_IMAGE:-llm-web-backend}"
LLM_WEB_BACKEND_TAG="${LLM_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
LLM_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${LLM_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称（用于生成 App YAML）
LLM_WEB_BACKEND_SECRET_NAME="${LLM_WEB_BACKEND_SECRET_NAME:-llm-web-backend-secret}"
LLM_WEB_BACKEND_CONFIGMAP_NAME="${LLM_WEB_BACKEND_CONFIGMAP_NAME:-llm-web-backend-config}"
LLM_WEB_BACKEND_QUEUE_REDIS_SECRET_NAME="${LLM_WEB_BACKEND_QUEUE_REDIS_SECRET_NAME:-llm-web-backend-nodebull-redis-conn}"

# PVC 配置（用于生成 App YAML 中的 volumeMounts）
PVC_NAME="${PVC_NAME:-llm-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
