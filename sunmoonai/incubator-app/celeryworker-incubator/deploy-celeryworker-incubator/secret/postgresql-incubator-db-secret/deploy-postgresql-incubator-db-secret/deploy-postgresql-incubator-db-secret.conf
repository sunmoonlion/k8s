# ============================================================================
# PostgreSQL Incubator DB Secret 部署配置
# 文件名: deploy-postgresql-incubator-db-secret.conf
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：PostgreSQL 连接数据在 generate-postgresql-incubator-db-secret.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 基础配置（默认值，可通过主配置或命令行参数覆盖）
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
postgresql_incubator_db_secret_enabled="${postgresql_incubator_db_secret_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
postgresql_incubator_db_secret_priority="${postgresql_incubator_db_secret_priority:-600}"

# 组件描述（用于日志输出）
postgresql_incubator_db_secret_description="${postgresql_incubator_db_secret_description:-PostgreSQL Incubator DB Secret}"

# Secret 基本信息（用于部署）
SECRET_NAME="postgresql-incubator-db-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-${NAMESPACE:-app-platform-dev}}"
SECRET_TYPE="Opaque"

# 是否重启使用该 Secret 的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
