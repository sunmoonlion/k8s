# =============================================================================
# MongoDB LLMOps Service DB Secret 部署配置
# 文件名: deploy-mongodb-llmopsservice-db-secret.conf
# 用途: 配置MongoDB数据库连接信息Secret的生成和部署参数
# 说明: 供下游应用连接MongoDB llmops_db数据库使用
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="mongodb-llmopsservice-db-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（数据库连接信息）
# =============================================================================

# 数据库主机地址
DB_HOST="mongodb-sunmoonai.data-platform-dev.svc.cluster.local"

# 数据库端口
DB_PORT="27017"

# 数据库名称
DB_NAME="llmops_db"

# 数据库用户名
DB_USER="sunmoonai_dev"

# 数据库密码
DB_PASSWORD="zym123"

# SSL模式（disable/require/verify-ca/verify-full）
DB_SSLMODE="disable"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

