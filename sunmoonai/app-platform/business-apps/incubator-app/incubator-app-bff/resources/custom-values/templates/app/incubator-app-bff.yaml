apiVersion: apps/v1
kind: Deployment
metadata:
  name: incubator-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: incubator-app-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incubator-app-bff
  template:
    metadata:
      labels:
        app: incubator-app-bff
    spec:
      imagePullSecrets:
      - name: ${INCUBATOR_BFF_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: incubator-app-bff
        image: ${INCUBATOR_BFF_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: incubator-app-bff-config
        - secretRef:
            name: incubator-app-bff-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: incubator-app-bff
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: incubator-app-bff
spec:
  selector:
    app: incubator-app-bff
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP

