# ============================================================================
# Llm Admin Frontend Secret YAML 生成配置
# ⚠️ 注意：运行阶段是纯 nginx 容器，不持有任何密钥。
# 所有敏感变量均由 llm-admin-backend 保管。
# Secret 内容为空，预留用于将来 nginx Basic Auth 等场景。
# ============================================================================

TEMPLATE_FILE="templates/secret/llm-admin-frontend-secret.yaml"
OUTPUT_FILE="llm-admin-frontend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# stringData 为空，模板中仅含说明注释，无实际 key-value。
