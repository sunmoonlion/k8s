# Neo4j 中间件总控部署配置

# 基础配置
NEO4J_PROJECT_ID="sunmoonai"
NEO4J_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
neo4j_stripprefix_enabled="true"  # StripPrefix 中间件（路径前缀处理）
neo4j_policy_enabled="true"      # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
neo4j_stripprefix_priority=200  # StripPrefix 先部署（路径前缀处理要先配置）
neo4j_policy_priority=100       # Policy 后部署（依赖路径前缀已存在）

