# 知识应用运行配置；RAGFlow为派生索引，信息原文以独立只读身份读取。
---
knowledge_backend_deployment:
  database: knowledge
  database_runtime_user: knowledge_runtime
  database_migrator_user: knowledge_migrator
  database_extensions:
  - uuid-ossp
  database_bootstrap_revision: v1
  migration_job_revision: v1
  expected_schema_revision: '20260911_0006'
  private_dir: /etc/sunmoon/applications/sunmoon-kind/knowledge
  backup_dir: /mnt/sunmoon-data/backups/applications/sunmoon-kind/knowledge
  deploy_budget_bytes: 2147483648
  redis_user: knowledge_runtime
  redis_key_pattern: knowledge:*
  redis_identity_revision: v1
  rabbitmq_user: knowledge_runtime
  rabbitmq_vhost: knowledge
  rabbitmq_queue: knowledge.default
  rabbitmq_identity_revision: v1
  identity_organization: built-in
  identity_revision: v1
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    api:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: '2'
        memory: 768Mi
    worker:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    scheduler:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
  domain_runtime_env: {}
  knowledge_provider:
    enabled: true
    dataset_key: default
    dataset_name: sunmoon-kind-knowledge-default
    tenant_id: sunmoonai
    source_user: knowledge_source_reader
    source_bucket: info-originals
    source_prefix: info/original/
    job_revision: v1
