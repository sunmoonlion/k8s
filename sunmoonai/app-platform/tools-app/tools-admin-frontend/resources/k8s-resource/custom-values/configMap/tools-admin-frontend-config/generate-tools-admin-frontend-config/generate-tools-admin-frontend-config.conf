# ============================================================================
# Tools Admin Frontend ConfigMap YAML 生成配置
# ⚠️ 注意：VITE_* 变量在 Docker 构建时通过 --build-arg 注入，已静态嵌入 bundle。
# 运行阶段是纯 nginx 容器，不读取任何环境变量，ConfigMap 内容为空。
# ============================================================================

TEMPLATE_FILE="templates/configMap/tools-admin-frontend-config.yaml"
OUTPUT_FILE="tools-admin-frontend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# ConfigMap data 为空，模板中仅含说明注释，无实际 key-value。
