# 会合点在边缘上的部署（第一期单实例；无状态，可加副本）。令牌表来自 Secret relay-tokens（key: tokens.json）。
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: edge
  labels: { app: relay }
spec:
  replicas: 1
  selector:
    matchLabels: { app: relay }
  template:
    metadata:
      labels: { app: relay }
    spec:
      securityContext: { runAsUser: 10002, runAsGroup: 10002, runAsNonRoot: true }
      containers:
        - name: relay
          image: harbor.sunmoonai.com:30443/app-images/relay@sha256:REPLACE_WITH_BUILT_DIGEST
          env:
            - { name: RELAY_HOST, value: "0.0.0.0" }
            - { name: RELAY_PORT, value: "47100" }
            - { name: RELAY_NAME, value: "edge-1" }
            - { name: RELAY_TOKENS_FILE, value: "/secrets/tokens.json" }
          ports:
            - { name: ws, containerPort: 47100 }
          volumeMounts:
            - { name: tokens, mountPath: /secrets, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 47100 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: tokens
          secret: { secretName: relay-tokens, defaultMode: 0400 }
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: edge
spec:
  selector: { app: relay }
  ports:
    - { name: ws, port: 47100, targetPort: 47100 }
---
# KIND 开发：宿主机（WSL）上的本地代理经 NodePort 连进来；边缘正式拓扑不用这个 Service（Traefik 路由 wss）。
apiVersion: v1
kind: Service
metadata:
  name: relay-nodeport
  namespace: edge
spec:
  type: NodePort
  selector: { app: relay }
  ports:
    - { name: ws, port: 47100, targetPort: 47100, nodePort: 30471 }

