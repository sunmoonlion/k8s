apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tools-web-backend-pvc
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: tools-web-backend
spec:
  accessModes:
    - ${PVC_ACCESS_MODE:-ReadWriteOnce}
  storageClassName: ${PVC_STORAGE_CLASS:-}
  resources:
    requests:
      storage: ${PVC_STORAGE_SIZE:-10Gi}
