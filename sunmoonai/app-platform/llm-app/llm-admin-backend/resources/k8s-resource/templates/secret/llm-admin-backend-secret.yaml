apiVersion: v1
kind: Secret
metadata:
  name: llm-admin-backend-secret
  namespace: ${NAMESPACE}
  labels:
    app: llm-admin-backend
type: Opaque
stringData:
  # PostgreSQL 完整连接字符串（含密码，由 generate 脚本拼装）
  DATABASE_URL: "${DATABASE_URL}"

  # Redis 密码
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # Casdoor 客户端密钥
  CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET}"
