# Incubator App SSR 路由配置 (Traefik IngressRoute)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: incubator-app-ssr-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: incubator-app-ssr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}

