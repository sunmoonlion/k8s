# ============================================================================
# Tools App 业务应用基础配置
# ============================================================================
TOOLS_APP_PROJECT_ID="sunmoonai"
TOOLS_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 组件部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
C1_document_converter_backend_enabled="false"
C2_document_converter_backend_enabled="false"
C3_document_converter_backend_enabled="false"
KIND_document_converter_backend_enabled="true"

# ============================================================================
# 组件部署优先级（数值越大越先部署）
# ============================================================================
C1_document_converter_backend_priority=900
C2_document_converter_backend_priority=900
C3_document_converter_backend_priority=900
KIND_document_converter_backend_priority=900
