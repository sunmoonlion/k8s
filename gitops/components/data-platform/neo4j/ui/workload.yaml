apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: {name: neo4j-internal, namespace: data-platform-dev}
spec:
  serverName: neo4j.data-platform-dev.svc.cluster.local
  rootCAsSecrets: [neo4j-upstream-ca]
  insecureSkipVerify: false
  forwardingTimeouts: {dialTimeout: 10s, responseHeaderTimeout: 60s}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neo4j-ui
  namespace: data-platform-dev
  annotations: {kubernetes.io/ingress.class: sunmoon}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`neo4j.sunmoonai.com`)'
      # 透传 Host：Neo4j 的 Jetty 核的是 Host 头与它自己证书的名字，所以公网名字进了 Neo4j 内部证书的 SAN（neo4j/prepare.yaml）；
      # 不透传时 Traefik 会把 Host 换成后端 Pod 的 IP，同样 400（2026-10-06 第 27 轮两次试出来的）
      services: [{name: neo4j, port: https, scheme: https, serversTransport: neo4j-internal}]
  tls: {secretName: neo4j-ui-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: neo4j-ui-access, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: neo4j}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: 'ingress-platform-dev'}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 7473}]
