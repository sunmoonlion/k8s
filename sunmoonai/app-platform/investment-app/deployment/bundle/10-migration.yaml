apiVersion: batch/v1
kind: Job
metadata:
  name: investment-backend-migration-kind-invest-dd-20260911
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: investment-backend
    app.kubernetes.io/component: backend-migration
    app.kubernetes.io/part-of: investment
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
    sunmoonai.com/release-id: kind-invest-dd-20260911
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-backend
        app.kubernetes.io/component: backend-migration
        app.kubernetes.io/part-of: investment
        sunmoonai.com/app: investment
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/release-id: kind-invest-dd-20260911
    spec:
      restartPolicy: Never
      serviceAccountName: investment-backend-migration
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:6a30e2d50eb47735ba8cf449fb776a5d1c848d84311c7e4ce69e99ab8719a434
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.bootstrap.migration
        args:
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: investment-backend-config
        env:
        - name: MIGRATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
