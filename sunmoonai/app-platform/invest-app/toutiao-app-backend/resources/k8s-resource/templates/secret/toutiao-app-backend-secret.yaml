apiVersion: v1
kind: Secret
metadata:
  name: toutiao-app-backend-secret
  namespace: ${NAMESPACE}
  labels:
    app: toutiao-app-backend
type: Opaque
stringData:
  # MySQL 密码
  MYSQL_USER: "${MYSQL_USER}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

  # JWT（旧 HS256）
  JWT_SECRET: "${JWT_SECRET}"

  # 七牛云密钥
  QINIU_ACCESS_KEY: "${QINIU_ACCESS_KEY}"
  QINIU_SECRET_KEY: "${QINIU_SECRET_KEY}"

  # RabbitMQ 完整连接字符串（含密码）
  RABBITMQ_URL: "${RABBITMQ_URL}"

  # 限流 Redis（含 sentinel 地址）
  RATELIMIT_STORAGE_URL: "${RATELIMIT_STORAGE_URL}"

  # 极验 CAPTCHA
  GEETEST_ID: "${GEETEST_ID}"
  GEETEST_KEY: "${GEETEST_KEY}"
