# ONLYOFFICE Docs 生产环境配置

# 全局配置
global:
  imageRegistry: "harbor.sunmoonai.com:30443"
  imagePullSecrets:
    - name: harbor-registry-secret
  security:
    allowInsecureImages: true

# 禁用 pre-upgrade hook（首次部署时服务不存在，会导致 hook 失败）
upgrade:
  job:
    enabled: false

# 连接配置（跨集群访问）
# 注意：
# - PostgreSQL、Redis 在集群1（C1），通过 Traefik 暴露外部访问
# - RabbitMQ 在集群2（C2），与 ONLYOFFICE Docs 同集群，使用 Service DNS
connections:
  dbType: postgres
  dbHost: 101.126.151.0  # 集群1的节点IP地址（非TLS TCP连接使用IP）
  dbPort: "30444"         # PostgreSQL 外部端口（Traefik TCP 路由）
  dbName: onlyoffice_docs
  dbUser: onlyoffice_docs
  dbExistingSecret: onlyoffice-postgresql-secret
  dbSecretKeyName: postgres-password
  
  redisHost: 101.126.151.0  # 集群1的节点IP地址（非TLS TCP连接使用IP）
  redisPort: "30446"         # Redis 外部端口（Traefik TCP 路由）
  redisExistingSecret: onlyoffice-redis-secret
  redisSecretKeyName: redis-password
  redisNoPass: false
  
  amqpType: rabbitmq
  amqpHost: rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local  # 集群2的 Service DNS（同集群）
  amqpPort: "5672"                 # RabbitMQ AMQP 端口（同集群直接访问）
  amqpVhost: "/"
  amqpUser: onlyoffice_docs
  amqpExistingSecret: onlyoffice-rabbitmq-secret
  amqpSecretKeyName: rabbitmq-password

# 服务配置
service:
  type: ClusterIP
  port: 8888

# 副本数配置（生产环境：增加副本数）
docservice:
  replicaCount: 2
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

converter:
  replicaCount: 2
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

proxy:
  resources:
    requests:
      cpu: 256m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# 持久化存储（生产环境：启用）
persistence:
  storageClass: "nfs-2"  # 使用集群中存在的 StorageClass
  size: 8Gi  # 存储大小
  runtimeConfig:
    enabled: true  # 启用运行时配置的持久化存储
    size: 1Gi  # 运行时配置存储大小

