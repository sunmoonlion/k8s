# ============================================================================
# Auth App Front Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="auth-app-front-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Ingress 数据内容
# ============================================================================
SERVICE_NAME="${SERVICE_NAME:-auth-app-front}"
SERVICE_PORT="${SERVICE_PORT:-3000}"
UNIFIED_HOST="${UNIFIED_HOST:-auth-app-front.sunmoonai.com}"
NODE_IP="${NODE_IP:-101.126.151.0}"
