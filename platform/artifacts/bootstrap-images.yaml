---
- name: Prepare or verify offline KIND and Calico images
  hosts: kind_hosts
  gather_facts: false
  become: false
  vars:
    image_action: plan
    upstream: '{{ lookup("ansible.builtin.file", playbook_dir + "/upstream-images.lock.json") | from_json }}'
    node_lock: '{{ lookup("ansible.builtin.file", playbook_dir + "/node-image.lock.json") | from_json }}'
    selected: '{{ node_lock.images + (upstream.images | selectattr("id", "in", ["calico-node", "calico-cni", "calico-kube-controllers"]) | list) }}'
    archive_lock: '{{ lookup("ansible.builtin.file", playbook_dir + "/bootstrap-archives.lock.json") | from_json }}'
    image_directory: '{{ artifact_cache_root }}/images'
    archive_verifier: '{{ playbook_dir }}/verify-oci-archive.py'
  tasks:
    - name: Validate image preparation mode and complete selection
      ansible.builtin.assert:
        quiet: true
        that:
          - ansible_version.full == '2.21.4'
          - not ansible_check_mode
          - image_action in ['plan', 'fetch', 'verify']
          - node_lock.schema_version == 1
          - selected | length == 4
          - selected | map(attribute='id') | unique | length == 4
          - artifact_cache_root is match('^/[a-zA-Z0-9_./-]+$')
          - "'..' not in artifact_cache_root.split('/')"

    - name: Validate immutable image descriptors
      ansible.builtin.assert:
        quiet: true
        that:
          - item.id is match('^[a-z][a-z0-9-]*$')
          - item.manifest_digest is match('^sha256:[a-f0-9]{64}$')
          - item.reference.endswith('@' + item.manifest_digest)
          - item.compressed_layer_bytes | int > 0
      loop: '{{ selected }}'
      loop_control:
        label: '{{ item.id }}'

    - name: Inspect the cache and image directory
      ansible.builtin.stat:
        path: '{{ item }}'
        follow: false
      loop: ['{{ artifact_cache_root }}', '{{ image_directory }}']
      register: directories

    - name: Reject symlink or non-directory archive paths
      ansible.builtin.assert:
        quiet: true
        that:
          - not item.stat.exists or item.stat.isdir | default(false)
          - not item.stat.islnk | default(false)
      loop: '{{ directories.results }}'
      loop_control:
        label: '{{ item.item }}'

    - name: Prepare each archive through the same native path
      ansible.builtin.include_tasks: tasks/image-archive.yaml
      loop: '{{ selected }}'
      loop_control:
        loop_var: selected_image
        label: '{{ selected_image.id }}'

