# 公网边缘第一期（SDD 0013）。只放公开参数；frp 令牌在私有文件里，不进 Git。
---
# edge_public_ip 是站点事实，在 environments/<站点>/site.yaml（C2 起）；域名与公网端口也从站点拼。
edge_domains: ['knowbench.{{ site_domain }}', 'casdoor.{{ site_domain }}', 'relay.{{ site_domain }}']
edge_https_port: '{{ public_port }}'
edge_http_port: 80
edge_frps_port: 7000
edge_vhost_port: 8080
edge_health_port: 8082
edge_ssh_port: 1022
# acme-staging → acme：先对 Let's Encrypt 测试环境跑通再切正式。smoke 只给本机冒烟（Traefik 自带默认证书）。
edge_tls_mode: acme
edge_config_dir: /etc/sunmoon/edge
# 令牌私有文件：YAML，单键 token，root 0600；由所有者从集群侧私有输入经 SSH 写入（SDD 0013 第四节）。
edge_token_file: /etc/sunmoon/edge/frp-token.yaml
edge_images:
  traefik: docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
  frps: docker.io/fatedier/frps:v0.71.0@sha256:cd8b947ba61678b200baa4f71ccc33f3c52e4e2cc0059700ba3b8354e36af7c3
# 冒烟用的客户端，正式环境的 frpc 在集群里（SDD 0013 第五节）。
edge_smoke_frpc_image: docker.io/fatedier/frpc:v0.71.0@sha256:99ece6a2b62cfc68731e0df289af804ff1c699911cfc47871856434f1d6d53ee
edge_rate_limit: {average: 50, burst: 100}
# 按域名只放行列出的路径，其余回 403；没列的域名整域放行。paths 精确匹配，prefixes 前缀匹配，不看查询串。
# casdoor：公网用户只走 OAuth 授权码登录，管理界面与管理接口不对公网（待办 65）。清单是 2026-10-16 用同版本
# Casdoor（4.12.0）实走登录录下来的：首次进入、错密码、登录拿到回跳、再次授权、注册页。换令牌、JWKS 走集群内部，不经边缘。
# 升级 Casdoor 或打开注册、找回密码、MFA 时要重录。/api/logout 是单点登录的退出（各应用带 client_id 跳来结束会话，
# Casdoor 只跳回登记过的地址），2026-10-16 实验录入（SDD 0027 P1b）。
# 键是短名（域名 = 短名.site_domain）：extra-vars 的字典键不过 Jinja，所以不写全名。
edge_path_allowlist:
  casdoor:
    paths: [/login/oauth/authorize, /signup/oauth/authorize, /api/get-account, /api/get-app-login, /api/login, /api/logout]
    prefixes: [/assets/]
