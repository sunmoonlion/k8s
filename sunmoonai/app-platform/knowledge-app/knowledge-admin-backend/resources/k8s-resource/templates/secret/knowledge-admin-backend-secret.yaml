apiVersion: v1
kind: Secret
metadata:
  name: knowledge-admin-backend-secret
  namespace: ${NAMESPACE}
  labels:
    app: knowledge-admin-backend
type: Opaque
stringData:
  CASDOOR_CLIENT_ID: "${CASDOOR_CLIENT_ID}"
  CASDOOR_CLIENT_SECRET: "${CASDOOR_CLIENT_SECRET}"
  RAGFLOW_API_KEY: "${RAGFLOW_API_KEY}"
