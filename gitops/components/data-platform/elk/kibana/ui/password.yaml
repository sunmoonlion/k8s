---
- name: Resolve the owning component's fixed protocol and trust settings
  ansible.builtin.set_fact:
    account_protocol_path: "{{ inventory_dir }}/../../gitops/components/data-platform/elk/kibana/ui/password.py"
    account_protocol_settings:
      hostname: 'elasticsearch.{{ data_namespace }}.svc.cluster.local'
      kubectl: '{{ inventory_dir }}/../.tools/bin/kubectl'
      kubeconfig: '{{ cluster_kubeconfig }}'
      context: 'kind-{{ cluster_name }}'
      namespace: '{{ data_namespace }}'
      ca: '{{ registry_config_dir }}/clients/ca.crt'
      admin_file: '{{ services_config_dir }}/elk.yaml'
      username: '{{ kibana_ui_viewer_user }}'
      owner: '{{ cluster_name }}/kibana-ui'
- name: Check the real component login identity before any rotation
  ansible.builtin.include_tasks: '{{ inventory_dir }}/tasks/account-protocol-check.yaml'
  when: account_action != 'recover'

- name: Preserve the approved independent Kibana password
  ansible.builtin.assert:
    quiet: true
    that: account_action not in ['stage','rotate','recover']
    fail_msg: This unit preserves Kibana. A later reader rotation requires an explicitly approved preset and a new initializer generation; check and view remain available.
