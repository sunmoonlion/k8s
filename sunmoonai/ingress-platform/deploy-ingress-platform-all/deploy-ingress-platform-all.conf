# ============================================================================
# Ingress 平台基础配置
# ============================================================================
INGRESS_PLATFORM_PROJECT_ID="sunmoonai"
INGRESS_PLATFORM_NAMESPACE="ingress-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志
# ============================================================================
# 控制是否部署各个子级组件
traefik_enabled="true"         # 是否部署 Traefik 入口控制器
# ingress_enabled="true"         # 是否部署 Ingress 路由配置

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
traefik_priority=1000          # Traefik 优先级最高（最先部署）
# ingress_priority=100           # Ingress 路由优先级较低（后部署）

# ============================================================================
# 组件特定配置
# ============================================================================
# Traefik 配置
TRAEFIK_NAMESPACE="ingress-platform-dev"
TRAEFIK_ENVIRONMENT="development"

# Ingress 配置
INGRESS_NAMESPACE="ingress-platform-dev"
INGRESS_ENVIRONMENT="development"
