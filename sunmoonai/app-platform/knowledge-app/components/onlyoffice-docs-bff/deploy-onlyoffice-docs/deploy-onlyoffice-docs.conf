# ONLYOFFICE Docs 部署配置

# 基础配置
ONLYOFFICE_PROJECT_ID="sunmoonai"
ONLYOFFICE_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像仓库配置（集群1 - Harbor）
# Harbor 在集群1，通过外部地址访问
ONLYOFFICE_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"  # 集群1的 Harbor 外部地址
ONLYOFFICE_IMAGE_PROJECT="k8s-images"

# 部署模式配置
DEPLOYMENT_MODE="online"
ENABLE_OFFLINE_IMAGE_CHECK="false"

# 访问与端口配置
ONLYOFFICE_UNIFIED_HOST="www.sunmoonai.com"
ONLYOFFICE_SERVICE_PORT="8888"

# 外部服务连接配置（跨集群访问）
# 注意：
# - PostgreSQL、Redis、Harbor 在集群1（C1），通过 Traefik 暴露外部访问
# - RabbitMQ 在集群2（C2），与 ONLYOFFICE Docs 同集群，使用 Service DNS

# PostgreSQL (集群1 - data-platform-dev)
# 通过 Traefik TCP 路由暴露（非 TLS），使用 IP 地址访问
ONLYOFFICE_DB_TYPE="postgres"
ONLYOFFICE_DB_HOST="101.126.151.0"  # 集群1的节点IP地址（非TLS TCP连接使用IP）
ONLYOFFICE_DB_PORT="30444"          # PostgreSQL 外部端口（Traefik TCP 路由）
ONLYOFFICE_DB_NAME="onlyoffice_docs"
ONLYOFFICE_DB_USER="onlyoffice_docs"
ONLYOFFICE_DB_EXISTING_SECRET="onlyoffice-postgresql-secret"
ONLYOFFICE_DB_SECRET_KEY_NAME="postgres-password"

# Redis (集群1 - data-platform-dev)
# 通过 Traefik TCP 路由暴露（非 TLS），使用 IP 地址访问
ONLYOFFICE_REDIS_HOST="101.126.151.0"  # 集群1的节点IP地址（非TLS TCP连接使用IP）
ONLYOFFICE_REDIS_PORT="30446"          # Redis 外部端口（Traefik TCP 路由）
ONLYOFFICE_REDIS_EXISTING_SECRET="onlyoffice-redis-secret"
ONLYOFFICE_REDIS_SECRET_KEY_NAME="redis-password"
ONLYOFFICE_REDIS_NO_PASS="false"

# RabbitMQ (集群2 - messaging-platform-dev)
# 与 ONLYOFFICE Docs 同集群，使用 Service DNS 直接访问
ONLYOFFICE_AMQP_TYPE="rabbitmq"
ONLYOFFICE_AMQP_HOST="rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local"  # 集群2的 Service DNS
ONLYOFFICE_AMQP_PORT="5672"                   # RabbitMQ AMQP 端口（同集群直接访问）
ONLYOFFICE_AMQP_VHOST="/"
ONLYOFFICE_AMQP_USER="onlyoffice_docs"
ONLYOFFICE_AMQP_EXISTING_SECRET="onlyoffice-rabbitmq-secret"
ONLYOFFICE_AMQP_SECRET_KEY_NAME="rabbitmq-password"

# 子级部署控制
middleware_enabled="true"
ingress_enabled="true"
secrets_enabled="true"

# 部署优先级
middleware_priority=1000
ingress_priority=100
secrets_priority=10

# 镜像推送控制
PUSH_IMAGES_BEFORE_DEPLOY="false"
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

