# ============================================================================
# Tools Admin Backend Secret YAML 生成配置
# 字段来源：tools-admin-backend/app/.env（敏感字段）
# ⚠️ 含真实密码，绝不提交 git（已在 .gitignore 中排除）
# 使用前：cp generate-tools-admin-backend-secret.conf.example \
#            generate-tools-admin-backend-secret.conf
#         然后填入真实密码
# ============================================================================

TEMPLATE_FILE="templates/secret/tools-admin-backend-secret.yaml"
OUTPUT_FILE="tools-admin-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息）
# ============================================================================
# PostgreSQL 完整连接字符串（asyncpg 驱动，config.py 的 database_url 字段）
# 格式：postgresql+asyncpg://user:password@host:port/dbname
# k8s 内部地址：postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432
DATABASE_URL="${DATABASE_URL:-postgresql://tools_admin_user:Po!s1359@postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432/tools_admin}"

# Redis 密码（对应 .env REDIS_PASSWORD）
REDIS_PASSWORD="${REDIS_PASSWORD:-ToolsAdminRedisAcl_7nR4wP2vK9mL3qX8j}"

# Casdoor 客户端密钥（对应 .env CASDOOR_CLIENT_SECRET）
CASDOOR_CLIENT_SECRET="${CASDOOR_CLIENT_SECRET:-2c384adabec1651cf015b4c5e70a3aef5686f1cb}"

# RabbitMQ producer 连接信息。vhost、用户、权限和队列由 messaging-platform/rabbitmq 的 app definitions 统一创建。
RABBITMQ_SERVICE_HOST="${RABBITMQ_SERVICE_HOST:-rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local}"
RABBITMQ_SERVICE_PORT="${RABBITMQ_SERVICE_PORT:-5672}"
RABBITMQ_VHOST="${RABBITMQ_VHOST:-tools-development}"
RABBITMQ_QUEUE="${RABBITMQ_QUEUE:-tools.admin.default}"
RABBITMQ_PRODUCER_USER="${RABBITMQ_PRODUCER_USER:-tools-admin-backend-producer}"
RABBITMQ_PRODUCER_PASSWORD="${RABBITMQ_PRODUCER_PASSWORD:-tools-admin-backend-producer-dev}"
RABBITMQ_PRODUCER_URL="${RABBITMQ_PRODUCER_URL:-amqp://${RABBITMQ_PRODUCER_USER}:${RABBITMQ_PRODUCER_PASSWORD}@${RABBITMQ_SERVICE_HOST}:${RABBITMQ_SERVICE_PORT}/${RABBITMQ_VHOST}}"
