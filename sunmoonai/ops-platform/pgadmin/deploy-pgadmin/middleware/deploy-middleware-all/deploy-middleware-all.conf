# Pgadmin 中间件总控部署配置

# 基础配置
PGADMIN_PROJECT_ID="sunmoonai"
PGADMIN_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 注意：pgAdmin 通过 SCRIPT_NAME 环境变量自己处理路径前缀，不需要 StripPrefix middleware
pgadmin_stripprefix_enabled="false"  # StripPrefix 中间件（已禁用，pgAdmin 自己处理路径前缀）
pgadmin_policy_enabled="true"         # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
pgadmin_stripprefix_priority=200  # StripPrefix 优先级（已禁用，保留用于参考）
pgadmin_policy_priority=100       # Policy 优先级
