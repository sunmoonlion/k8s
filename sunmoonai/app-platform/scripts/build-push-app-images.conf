# App Platform App 镜像构建与推送配置
#
# 优先级：
# 1. 执行命令前显式传入的环境变量
# 2. 本配置文件
# 3. build-push-app-images.sh 内置默认值

# 默认目标集群配置。可在执行时用 CLUSTER=KIND / CLUSTER=C1 覆盖。
DEFAULT_CLUSTER="KIND"

# 默认镜像版本。正式开发基线当前使用 1.0.0。
TAG="1.0.0"

# 构建平台。Kind 和当前远程开发集群均使用 amd64。
PLATFORM="linux/amd64"

# Docker build 输出模式：auto / plain / tty。
PROGRESS="auto"

# 是否禁用 Docker 构建缓存。
NO_CACHE="true"

# 从指定 app/component 开始继续构建，例如：
# START_FROM="research/admin-backend"
START_FROM=""

# 只打印 docker build / docker push 命令，不实际执行。
DRY_RUN="false"

# App 源码所在根目录。默认各 App 在 /home/zymun/{app}-app。
SOURCE_ROOT="${HOME}"

# 本轮纳入统一构建的 App。
APPS="info research investment tools knowledge"

# 每个 App 纳入统一构建的组件。
COMPONENTS="admin-backend admin-frontend web-backend web-frontend"

# Python / Debian / Node 依赖镜像源。
PYPI_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"
DEBIAN_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian"
DEBIAN_SECURITY_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian-security"
NPM_REGISTRY="https://registry.npmmirror.com"

# Kind 本地开发集群使用的镜像仓库。
KIND_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
KIND_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
KIND_TAG="1.0.0"

# 远程开发集群 C1 使用的镜像仓库。
# 当前 C1 仍使用同一个 Harbor；如果以后远程独立仓库，只改这里即可。
C1_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
C1_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
C1_TAG="1.0.0"

# 预留远程集群配置。
C2_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
C2_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
C2_TAG="1.0.0"

C3_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
C3_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
C3_TAG="1.0.0"
