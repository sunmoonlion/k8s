---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: platform-foundations, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 15m
  path: ./components/foundations
  sourceRef: {kind: OCIRepository, name: platform}
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: postgresql, namespace: flux-system}
spec:
