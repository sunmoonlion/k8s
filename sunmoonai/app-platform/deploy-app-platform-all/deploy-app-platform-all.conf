# ============================================================================
# App Platform 平台基础配置
# ============================================================================
APP_PLATFORM_PROJECT_ID="sunmoonai"
APP_PLATFORM_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志（根据需要启用/禁用）
# ============================================================================
# 共享应用 (shared-apps) - 基础设施优先
# 注意：celeryworker_bff 已拆分为独立的 Worker（celeryworker-incubator 和 celeryworker-llmops）
# 请使用独立的 Worker 部署脚本进行部署
document_converter_bff_enabled="true"
onlyoffice_docs_bff_enabled="true"

# 业务应用 (business-apps)
incubator_bff_enabled="true"
incubator_ssr_enabled="true"
llmops_bff_enabled="true"
llmops_ssr_enabled="true"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
# 共享应用优先级（基础设施优先）
# 注意：celeryworker_bff 已拆分为独立的 Worker，不再在此统一部署
document_converter_bff_priority=900
onlyoffice_docs_bff_priority=800

# 业务应用优先级
incubator_bff_priority=700
incubator_ssr_priority=600
llmops_bff_priority=500
llmops_ssr_priority=400
