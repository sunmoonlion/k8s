# ============================================================================
# LLMOps App BFF Rate Limit Middleware YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/middleware/llmops-app-backend-rate-limit.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="llmops-app-backend-rate-limit-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="middleware"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-llmops-backend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# Rate Limit Middleware 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 Rate Limit Middleware YAML 文件
# ============================================================================
# 限流配置
# average: 平均请求速率（每秒请求数）
# burst: 突发请求允许的最大数量
# period: 时间窗口（秒）
RATE_LIMIT_AVERAGE="${RATE_LIMIT_AVERAGE:-100}"     # 平均每秒 100 个请求
RATE_LIMIT_BURST="${RATE_LIMIT_BURST:-200}"         # 突发允许 200 个请求
RATE_LIMIT_PERIOD="${RATE_LIMIT_PERIOD:-1}"         # 时间窗口 1 秒

