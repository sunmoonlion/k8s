# ============================================================================
# Traefik 缓冲中间件部署配置
# ============================================================================

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="ingress-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 缓冲中间件配置
# ============================================================================
# 最大请求大小（字节，0 表示不限制）
# 2GB = 2147483648 字节，用于支持大镜像文件上传
MIDDLEWARE_BUFFERING_MAX_REQUEST="2147483648"

# 最大响应大小（字节，0 表示不限制）
# 2GB = 2147483648 字节
MIDDLEWARE_BUFFERING_MAX_RESPONSE="2147483648"

# 内存请求大小（字节，0 表示不限制）
# 20MB = 20971520 字节，超过此大小会写入磁盘
MIDDLEWARE_BUFFERING_MEM_REQUEST="20971520"

# 内存响应大小（字节，0 表示不限制）
# 20MB = 20971520 字节，超过此大小会写入磁盘
MIDDLEWARE_BUFFERING_MEM_RESPONSE="20971520"

# 重试表达式（Traefik 表达式语法）
MIDDLEWARE_BUFFERING_RETRY_EXPRESSION="IsNetworkError() && Attempts() <= 2"

