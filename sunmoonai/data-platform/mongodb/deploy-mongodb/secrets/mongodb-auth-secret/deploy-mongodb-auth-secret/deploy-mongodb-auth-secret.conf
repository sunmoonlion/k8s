# =============================================================================
# MongoDB Auth Secret 部署配置
# 文件名: deploy-mongodb-auth-secret.conf
# 用途: 配置MongoDB认证Secret的生成和部署参数
# 说明: MongoDB Chart要求Secret键名使用破折号（如mongodb-root-password）
#       配置中使用下划线变量名，脚本会自动转换为破折号键名
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="mongodb-auth-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（MongoDB Chart要求键名使用破折号）
# =============================================================================
# 注意：变量名使用下划线，脚本会自动转换为破折号键名
# 例如：mongodb_root_password -> mongodb-root-password

# Root用户密码（必需）
mongodb_root_password="zym123"

# 应用用户密码列表（必需，与 auth.usernames 顺序一致，多个用逗号分隔）
mongodb_passwords="zym123"

# 可选：监控密码
# mongodb_metrics_password="MetricsPa55!"

# 可选：副本集密钥
# mongodb_replica_set_key="ReplicaSetKeyPa55!"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

