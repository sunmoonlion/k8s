# ============================================================================

# nerdctl/containerd
NERDCTL_BIN="nerdctl"
CONTAINERD_NAMESPACE="k8s.io"
USE_SUDO="true"

# 推送重�?PUSH_RETRY="2"
PUSH_RETRY_INTERVAL="3"

# 代理（可选）
HTTP_PROXY=""
HTTPS_PROXY=""
