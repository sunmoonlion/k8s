# ============================================================================
# LLMOps App BFF 部署配置
# 文件名: deploy-llmops-bff.conf
# 用途: 配置 LLMOps App BFF 的部署参数
# ============================================================================

# ============================================================================
# 基础配置
# ============================================================================
LLMOPS_BFF_PROJECT_ID="sunmoonai"
LLMOPS_BFF_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# ============================================================================
# 镜像配置
# ============================================================================
# 说明：
# - 这些变量只是在 conf 里定义默认值，本身不会触发任何替换
# - 部署脚本 deploy-llmops-bff.sh 会 source 本文件，然后用这些变量组装：
#     LLMOPS_BFF_FULL_IMAGE_NAME="${LLMOPS_BFF_IMAGE_REGISTRY}/${LLMOPS_BFF_IMAGE_PROJECT}/${LLMOPS_BFF_IMAGE}:${LLMOPS_BFF_TAG}"
# - 组装好的 LLMOPS_BFF_FULL_IMAGE_NAME 会通过 envsubst 替换到 llmops-app-bff.yaml 里的
#     image: ${LLMOPS_BFF_FULL_IMAGE_NAME}
# - 因此，这里的值相当于“镜像地址的默认配置”
# Harbor 镜像仓库配置（deploy 命令使用 Harbor 镜像）
LLMOPS_BFF_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址
LLMOPS_BFF_IMAGE_PROJECT="k8s-images"                        # 镜像项目名
LLMOPS_BFF_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"   # Harbor 镜像拉取 Secret 名称（Kubernetes 中的 imagePullSecret）

# ============================================================================
# 访问与端口配置
# ============================================================================
LLMOPS_BFF_TLS_ENABLED="true"                 # 通过 Traefik 终止 TLS
LLMOPS_BFF_UNIFIED_HOST="llmops.sunmoonai.com"    # 统一域名（用于路径前缀路由）
LLMOPS_BFF_NODE_IP="101.126.151.0"            # 节点公网 IP 地址（用于 IP 访问方式）

# ============================================================================
# LLMOps App BFF Secret 配置
# ============================================================================
LLMOPS_BFF_SECRET_NAME="llmops-app-bff-secret"        # LLMOps App BFF Secret 名称
LLMOPS_BFF_CONFIGMAP_NAME="llmops-app-bff-config"    # LLMOps App BFF ConfigMap 名称

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
secrets_enabled="true"          # 是否部署 LLMOps App BFF Secrets 和 ConfigMaps
middleware_enabled="false"      # Middleware（stripprefix 已集成到 ingress.yaml 中，保留用于未来扩展）
ingress_enabled="true"          # 是否部署 Ingress 配置

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
secrets_priority=2000          # Secrets 优先级最高（最先部署，确保组件可用）
middleware_priority=1000        # Middleware 优先级
ingress_priority=100            # Ingress 优先级最低（最后部署，在服务之后）

# =========================================================================
# 推送后清理远程 tar 包开关
# =========================================================================
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

# ============================================================================
# 镜像构建说明
# ============================================================================
# 注意: 镜像构建已分离到源代码项目的 build/ 目录
# 构建镜像请使用: cd ../../../../../sunmoonai-llmops-service/build && ./build-image.sh build-push
# 部署脚本仅负责部署，不再包含构建功能


