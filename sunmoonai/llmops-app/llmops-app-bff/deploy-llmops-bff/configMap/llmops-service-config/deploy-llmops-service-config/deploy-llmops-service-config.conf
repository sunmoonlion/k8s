# =============================================================================
# LLMOps Service ConfigMap 部署配置
# 文件名: deploy-llmops-service-config.conf
# 用途: 配置 LLMOps Service ConfigMap 的生成和部署参数
# =============================================================================

# =============================================================================
# ConfigMap基本信息
# =============================================================================

# ConfigMap名称
CONFIGMAP_NAME="llmops-service-config"

# ConfigMap命名空间（将在部署脚本中从参数获取，这里作为默认值）
CONFIGMAP_NAMESPACE="${CONFIGMAP_NAMESPACE:-app-platform-dev}"

# =============================================================================
# ConfigMap部署配置
# =============================================================================

# 是否重启使用该ConfigMap的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

# =============================================================================
# 数据库配置
# =============================================================================
POSTGRES_SERVER="${POSTGRES_SERVER:-101.126.151.0}"  # PostgreSQL 服务器 IP
POSTGRES_PORT="${POSTGRES_PORT:-30444}"  # PostgreSQL 端口
POSTGRES_USER="${POSTGRES_USER:-sunmoonai_dev}"  # PostgreSQL 用户名
POSTGRES_DB="${POSTGRES_DB:-mydb}"  # PostgreSQL 数据库名

# =============================================================================
# Neo4j 配置
# =============================================================================
NEO4J_SERVER="${NEO4J_SERVER:-101.126.151.0}"  # Neo4j 服务器 IP
NEO4J_PORT="${NEO4J_PORT:-7687}"  # Neo4j Bolt 端口
NEO4J_USERNAME="${NEO4J_USERNAME:-neo4j}"  # Neo4j 用户名
NEO4J_AUTH="${NEO4J_AUTH:-neo4j}"  # Neo4j 认证信息
NEO4J_BOLT="${NEO4J_BOLT:-bolt}"  # Neo4j Bolt 协议

