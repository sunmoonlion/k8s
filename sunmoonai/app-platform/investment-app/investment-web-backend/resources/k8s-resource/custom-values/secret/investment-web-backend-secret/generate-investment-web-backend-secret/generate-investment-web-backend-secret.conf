# ============================================================================
# Investment Web Backend Secret YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ⚠️ 敏感信息：请妥善保管此配置文件
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/secret/investment-web-backend-secret.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="investment-web-backend-secret-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="secret"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（用于生成 YAML）
# ⚠️ 敏感信息：请妥善保管此配置文件
# ============================================================================
# 应用密钥（⚠️ 必须修改为安全的随机字符串）
SECRET_KEY="${SECRET_KEY:-changeme}"

# 数据库认证（⚠️ 必须修改为实际密码）
POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-Po!s1359}"

# PostgreSQL 完整连接字符串（包含密码）
# 注意：生成脚本会自动从 ConfigMap 读取 POSTGRES_SERVER, POSTGRES_PORT, POSTGRES_USER, POSTGRES_DB
# 并组装完整连接字符串。如果已设置 DB_URL，则使用设置的值；否则由脚本自动生成
DB_URL="${DB_URL:-}"

# DB_* 格式字段（兼容性）
DB_PASSWORD="${DB_PASSWORD:-${POSTGRES_PASSWORD}}"

# 管理员账户（⚠️ 必须修改为实际值）
FIRST_SUPERUSER="${FIRST_SUPERUSER:-admin@sunmoonai.com}"
FIRST_SUPERUSER_PASSWORD="${FIRST_SUPERUSER_PASSWORD:-changeme123}"

# SMTP / 监控（可选）
SMTP_USER="${SMTP_USER:-}"
SMTP_PASSWORD="${SMTP_PASSWORD:-}"
SENTRY_DSN="${SENTRY_DSN:-}"

# JWT 配置（⚠️ 必须修改为安全的随机字符串）
JWT_SECRET="${JWT_SECRET:-changeme}"

# Redis 配置（可选）
REDIS_PASSWORD="${REDIS_PASSWORD:-}"
