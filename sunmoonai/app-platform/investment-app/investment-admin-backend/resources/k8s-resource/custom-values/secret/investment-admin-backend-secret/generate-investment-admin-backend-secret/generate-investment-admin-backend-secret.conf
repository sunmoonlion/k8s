# ============================================================================
# Investment Admin Backend Secret YAML 生成配置
# 字段来源：investment-admin-backend/app/.env（敏感字段）
# ⚠️ 含真实密码，绝不提交 git（已在 .gitignore 中排除）
# 使用前：cp generate-investment-admin-backend-secret.conf.example \
#            generate-investment-admin-backend-secret.conf
#         然后填入真实密码
# ============================================================================

TEMPLATE_FILE="templates/secret/investment-admin-backend-secret.yaml"
OUTPUT_FILE="investment-admin-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息）
# ============================================================================
# PostgreSQL 完整连接字符串（asyncpg 驱动，config.py 的 database_url 字段）
# 格式：postgresql+asyncpg://user:password@host:port/dbname
# k8s 内部地址：postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432
DATABASE_URL="${DATABASE_URL:-postgresql+asyncpg://sunmoonai_dev:changeme@postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432/investment_admin}"

# Redis 密码（对应 .env REDIS_PASSWORD）
REDIS_PASSWORD="${REDIS_PASSWORD:-changeme}"

# Casdoor 客户端密钥（对应 .env CASDOOR_CLIENT_SECRET）
CASDOOR_CLIENT_SECRET="${CASDOOR_CLIENT_SECRET:-changeme}"
