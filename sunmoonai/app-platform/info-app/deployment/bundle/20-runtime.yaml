apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-backend-api
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: info-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: info
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      sunmoonai.com/app: info
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: info-backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: info
        sunmoonai.com/app: info
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/internal-provider: 'true'
      annotations:
        sunmoonai.com/release-id: kind-info-dd-20260911
        sunmoonai.com/config-sha256: b7575050afe5ec69a048fbd1f8e1fca4c96076d6cbe839a9071a88e9bddfbd98
        sunmoonai.com/source-commit: 8c3b695e3e2b5b4064b5b14ce8d2b6d6767177e2
    spec:
      serviceAccountName: info-backend-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            sunmoonai.com/app: info
            app.kubernetes.io/component: backend-api
      containers:
      - name: api
        image: harbor.sunmoonai.com:30443/app-images/info-backend@sha256:884dc222c2c7c3fc86787592ec03a5bb306a44a8bf069df10e3c9ed38806f1b9
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        args:
        - app.bootstrap.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: info-backend-config
        - configMapRef:
            name: info-backend-s3
        - secretRef:
            name: info-backend-s3
        - configMapRef:
            name: info-backend-elasticsearch
        - secretRef:
            name: info-backend-elasticsearch
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PASSWORD
        - name: ADMIN_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: info-browser-identity
              key: ADMIN_CLIENT_ID
        - name: ADMIN_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: info-browser-identity
              key: ADMIN_CLIENT_SECRET
        - name: WEB_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: info-browser-identity
              key: WEB_CLIENT_ID
        - name: WEB_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: info-browser-identity
              key: WEB_CLIENT_SECRET
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-broker
              key: CELERY_BROKER_URL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: info-backend
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: Host
              value: info-backend
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: info-backend
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: elasticsearch-ca
          mountPath: /var/run/secrets/sunmoonai/elasticsearch
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: elasticsearch-ca
        secret:
          secretName: info-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: info-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
