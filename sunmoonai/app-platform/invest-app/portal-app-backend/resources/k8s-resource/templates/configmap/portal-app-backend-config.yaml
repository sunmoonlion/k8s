apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-app-backend-config
  namespace: ${NAMESPACE}
  labels:
    app: portal-app-backend
data:
  # ========================================================================
  # 服务配置（联动配置 - 必须与其他服务一致）
  # ========================================================================
  PORT: "${PORT:-3000}"
  PREFIX: "${PREFIX:-/api}"
  VERSION: "${VERSION:-v1}"
  SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-sunmoonai_session}"

  # ========================================================================
  # 认证服务配置（联动配置 - 调用 auth-app-backend）
  # ========================================================================
  AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth-app-backend:3030}"

  # ========================================================================
  # 其他配置（业务特定配置，不影响联动）
  # ========================================================================
  CORS: "${CORS:-true}"
  ERROR_FILTER: "${ERROR_FILTER:-true}"
  NODE_ENV: "${NODE_ENV:-production}"

