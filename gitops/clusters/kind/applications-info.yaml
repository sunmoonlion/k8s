---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: info-database, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 8m
  path: ./components/app-platform/info-app/info-backend/database
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: platform-services}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
