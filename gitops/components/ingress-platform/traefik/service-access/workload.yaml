---
apiVersion: v1
kind: Service
metadata: {name: casdoor-tls, namespace: app-platform-dev}
spec:
  type: ExternalName
  externalName: traefik.ingress-platform-dev.svc.cluster.local
  ports: [{name: https, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casdoor-service-access
  namespace: app-platform-dev
  annotations: {traefik.ingress.kubernetes.io/router.entrypoints: websecure}
spec:
  ingressClassName: sunmoon
  tls: [{secretName: service-access-tls, hosts: [casdoor-tls.app-platform-dev.svc.cluster.local]}]
  rules:
    - host: casdoor-tls.app-platform-dev.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: casdoor, port: {number: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: knowledge-tls, namespace: app-platform-dev}
spec:
  type: ExternalName
  externalName: traefik.ingress-platform-dev.svc.cluster.local
  ports: [{name: https, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-service-access
  namespace: app-platform-dev
  annotations: {traefik.ingress.kubernetes.io/router.entrypoints: websecure}
spec:
  ingressClassName: sunmoon
  tls: [{secretName: service-access-tls, hosts: [knowledge-tls.app-platform-dev.svc.cluster.local]}]
  rules:
    - host: knowledge-tls.app-platform-dev.svc.cluster.local
      http:
        paths:
          - path: /api/internal/v1/knowledge
            pathType: Prefix
            backend:
              service: {name: knowledge-api, port: {number: 8000}}
