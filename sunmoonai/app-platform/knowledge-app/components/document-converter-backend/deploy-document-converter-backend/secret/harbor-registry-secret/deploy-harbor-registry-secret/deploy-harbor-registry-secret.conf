# shellcheck shell=bash
# 镜像拉取 Secret 的日常配置；本地/云端共用实现。
# 地址固定为 harbor.sunmoonai.com:30443。
# 认证仅从 REGISTRY_CONFIG_FILE 指向的 REGISTRY_CREDENTIALS_FILE 私有 JSON 读取。
# 不在本文件设置 DOCKER_USERNAME/DOCKER_PASSWORD，也不继承历史管理员口令。
# 命名空间显式位置参数优先；重启只在 RESTART_COMPONENTS=true 且指定 LIST 时执行。
# 云端未经实机验证。说明：sunmoonai/registry-platform/docs/pull-secrets.md

SECRET_NAME="harbor-registry-secret"
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
harbor_registry_secret_enabled="${harbor_registry_secret_enabled:-true}"
harbor_registry_secret_priority="${harbor_registry_secret_priority:-700}"
harbor_registry_secret_description="${harbor_registry_secret_description:-Harbor Registry Secret}"
