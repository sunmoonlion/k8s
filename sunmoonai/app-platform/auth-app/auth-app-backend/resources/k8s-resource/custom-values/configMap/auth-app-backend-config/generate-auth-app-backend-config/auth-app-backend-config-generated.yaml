apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-app-backend-config
  namespace: app-platform-dev
  labels:
    app: auth-app-backend
data:
  # ========================================================================
  # 服务配置（联动配置 - 必须与其他服务一致）
  # ========================================================================
  PORT: "3030"
  PREFIX: "/api"
  VERSION: "v1"
  SESSION_COOKIE_NAME: "sunmoonai_session"

  # ========================================================================
  # 其他配置（业务特定配置，不影响联动）
  # ========================================================================
  GRPC_PORT: "40001"
  CORS: "true"
  ERROR_FILTER: "true"
  NODE_ENV: "production"

  # Redis 配置（非敏感部分）
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
