---
# Casdoor private inputs: the shared platform service certificate, the database login,
# the startup and one-time initialization configuration and the first administrator.
- name: Read the shared core identities
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/shared-credentials.yaml'
- name: Generate a private service TLS key only when absent
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, RSA, -pkeyopt, 'rsa_keygen_bits:3072', -out, '{{ services_config_dir }}/tls/server.key']
    creates: '{{ services_config_dir }}/tls/server.key'
  no_log: true
- name: Enforce private key access
  ansible.builtin.file: {path: '{{ services_config_dir }}/tls/server.key', mode: '0600', owner: root, group: root}
- name: Generate the service certificate request
  ansible.builtin.command:
    argv: [openssl, req, -new, -key, '{{ services_config_dir }}/tls/server.key', -out, '{{ services_config_dir }}/tls/server.csr', -subj, '/CN={{ casdoor_hostname }}']
    creates: '{{ services_config_dir }}/tls/server.csr'
- name: Declare exact TLS certificate extensions
  ansible.builtin.copy:
    dest: '{{ services_config_dir }}/tls/extensions.cnf'
    mode: '0600'
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=DNS:{{ casdoor_hostname }}
- name: Issue the five-year service certificate with the existing platform CA
  ansible.builtin.command:
    argv: [openssl, x509, -req, -in, '{{ services_config_dir }}/tls/server.csr', -CA, '{{ registry_config_dir }}/tls/ca.crt', -CAkey, '{{ registry_config_dir }}/tls/ca.key', -set_serial, '0x{{ lookup("pipe", "openssl rand -hex 16") }}', -days, '1825', -sha256, -extfile, '{{ services_config_dir }}/tls/extensions.cnf', -out, '{{ services_config_dir }}/tls/server.crt']
    creates: '{{ services_config_dir }}/tls/server.crt'
- name: Verify the chain and hostname before publication
  ansible.builtin.command:
    argv: [openssl, verify, -CAfile, '{{ registry_config_dir }}/tls/ca.crt', -verify_hostname, '{{ casdoor_hostname }}', '{{ services_config_dir }}/tls/server.crt']
  changed_when: false
- name: Back up service TLS material without overwriting prior identities
  ansible.builtin.copy:
    src: '{{ services_config_dir }}/tls'
    dest: '{{ services_backup_dir }}/'
    remote_src: true
    force: false
    mode: preserve
  no_log: true
- name: Require matching TLS backup identities
  ansible.builtin.command:
    argv: [cmp, --silent, '{{ services_config_dir }}/tls/{{ item }}', '{{ services_backup_dir }}/tls/{{ item }}']
  loop: [server.key, server.crt]
  changed_when: false
  no_log: true
- name: Read private certificate material into memory
  ansible.builtin.slurp: {src: '{{ services_config_dir }}/tls/{{ item }}'}
  loop: [server.key, server.crt]
  register: service_tls
  no_log: true
- name: Encrypt independent database login
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: app-platform/auth-app/casdoor/database/auth.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: casdoor-database-auth, namespace: '{{ data_namespace }}'}
        stringData: {password: '{{ service_credentials.casdoor_db_password }}'}
  no_log: true
- name: Encrypt startup config without repeating initialization on restarts
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    initializing: false
    secret_item:
      file: app-platform/auth-app/casdoor/config.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: casdoor-config, namespace: '{{ app_namespace }}'}
        stringData: {app.conf: '{{ lookup("template", playbook_dir + "/../../gitops/components/app-platform/auth-app/casdoor/app.conf.j2") }}'}
  no_log: true
- name: Encrypt one-time initialization config
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    initializing: true
    secret_item:
      file: app-platform/auth-app/casdoor/init/config.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: casdoor-init-config, namespace: '{{ app_namespace }}'}
        stringData: {app.conf: '{{ lookup("template", playbook_dir + "/../../gitops/components/app-platform/auth-app/casdoor/app.conf.j2") }}'}
  no_log: true
- name: Encrypt the new administrator initialization input
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: app-platform/auth-app/casdoor/init/identity.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: casdoor-initial-identity, namespace: '{{ app_namespace }}'}
        stringData:
          init_data.json: '{{ {"users":[{"owner":"built-in","name":"admin","type":"normal-user","password":service_credentials.casdoor_admin_password,"displayName":"Platform administrator","isAdmin":true,"isGlobalAdmin":true}]} | to_json }}'
  no_log: true
- name: Encrypt application TLS identity
  ansible.builtin.include_tasks: '{{ playbook_dir }}/tasks/encrypt.yaml'
  vars:
    secret_item:
      file: app-platform/auth-app/casdoor/tls.sops.yaml
      manifest:
        apiVersion: v1
        kind: Secret
        metadata: {name: platform-tls, namespace: '{{ app_namespace }}'}
        type: kubernetes.io/tls
        data: {'tls.key': '{{ service_tls.results[0].content }}', 'tls.crt': '{{ service_tls.results[1].content }}'}
  no_log: true
