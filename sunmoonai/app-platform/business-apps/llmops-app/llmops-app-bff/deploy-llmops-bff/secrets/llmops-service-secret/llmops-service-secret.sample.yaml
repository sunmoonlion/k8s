apiVersion: v1
kind: Secret
metadata:
  name: llmops-service-secret
  namespace: app-platform-dev
  labels:
    app: llmops-service
    component: secrets
    environment: dev
type: Opaque
data:
  # 应用密钥 (需要 base64 编码)
  # 使用命令生成: echo -n "your-secret-key" | base64
  SECRET_KEY: <base64-encoded-secret-key>
  TOTP_SECRET_KEY: <base64-encoded-totp-secret-key>
  
  # 数据库密码 (需要 base64 编码)
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>
  NEO4J_PASSWORD: <base64-encoded-neo4j-password>
  
  # 管理员账户 (需要 base64 编码)
  FIRST_SUPERUSER: <base64-encoded-admin-email>
  FIRST_SUPERUSER_PASSWORD: <base64-encoded-admin-password>
  
  # SMTP 认证 (需要 base64 编码)
  SMTP_USER: <base64-encoded-smtp-user>
  SMTP_PASSWORD: <base64-encoded-smtp-password>
  
  # 监控 (需要 base64 编码)
  SENTRY_DSN: <base64-encoded-sentry-dsn>

