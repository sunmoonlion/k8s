# 通过 ./sunmoon kind storage 渲染节点并核验挂载；不要直接 kubectl apply 此模板。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: casdoor-sunmoonai-dev-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/kind-local-storage/casdoor
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [__KIND_STATIC_NODE__]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casdoor-sunmoonai-dev-pvc
  namespace: app-platform-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: casdoor-sunmoonai-dev-pv
