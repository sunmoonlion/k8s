# =============================================================================
# 定时清理任务配置
# =============================================================================

# 定时任务开关
PERIODIC_CLEANUP_ENABLED="false"           # 是否启用定时清理任务

# 执行时间配置（Cron格式）
PERIODIC_CLEANUP_SCHEDULE="0 2 * * *"    # 默认：每天凌晨 2:00
# 示例：
# "0 2 * * *"      - 每天凌晨 2:00
# "0 */6 * * *"    - 每 6 小时
# "0 3 * * 0"      - 每周日凌晨 3:00

# 执行模式
EXECUTION_MODE="conditional"              # conditional（条件执行）或 always（总是执行）
# conditional: 检查磁盘使用率，只有达到阈值才执行清理
# always: 总是执行清理，忽略磁盘使用率检查

# 日志配置
LOG_FILE="/var/log/k8s-image-cleanup.log"

# Cron 用户
CRON_USER="zym"                           # Cron 任务运行的用户

