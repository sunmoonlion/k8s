# KIND 当前配置；与本目录实现同源维护。秘密与版本摘要不在这里。
---
# Flux部署/源应用准入；修改边界见同目录 README 的字段表。
flux_enabled: true
# 密钥引导准入；修改边界见同目录 README 的字段表。
sops_enabled: true
# 主解密身份目录；修改边界见同目录 README 的字段表。
sops_config_dir: /etc/sunmoon/flux/sunmoon-kind
# 独立数据盘密钥副本；修改边界见同目录 README 的字段表。
sops_backup_dir: /mnt/sunmoon-data/backups/flux/sunmoon-kind
