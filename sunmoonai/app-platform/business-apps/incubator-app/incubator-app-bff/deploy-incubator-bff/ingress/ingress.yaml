# Incubator App BFF 路由配置 (Traefik IngressRoute)
# 路径前缀：/api/v1 → 后端服务端口 80
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: incubator-app-bff-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: incubator-app-bff
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: incubator-app-bff-stripprefix
    # 使用统一域名访问
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
        - name: incubator-app-bff-stripprefix

