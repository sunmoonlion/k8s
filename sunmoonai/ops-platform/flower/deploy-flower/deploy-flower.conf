# Flower 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
FLOWER_PROJECT_ID="sunmoonai"
FLOWER_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
FLOWER_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
FLOWER_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
FLOWER_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"      # Harbor 镜像拉取 Secret 名称

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# FLOWER_FORCE_OFFLINE="true"         # 离线模式：强制离线部署

# 访问与端口配置
FLOWER_TLS_ENABLED="false"                    # Flower通常不需要TLS
FLOWER_UNIFIED_HOST="www.sunmoonai.com"       # 统一域名（用于路径前缀路由）
FLOWER_NODE_IP="115.190.153.150"             # 节点公网 IP 地址（用于 IP 访问方式）
FLOWER_URL_PREFIX="/flower"                 # Flower URL 前缀（让应用自己处理 baseurl，参考 redisinsight 和 mongo-express）
                                            # 注意：Flower 使用 --url_prefix 参数（类似其他应用的 --base-path 或 siteBaseUrl）

# Flower Secret 配置
FLOWER_AUTH_SECRET_NAME="flower-secrets"                    # Flower 认证 Secret 名称
FLOWER_AUTH_SECRET_PASSWORD_KEY="flower-password"          # Flower 认证 Secret 密码键名

# Flower Broker 配置（Secret 键名，可选）
# 如果需要从 Secret 读取 broker 配置，设置这些键名，并在 Secret 中添加对应的键
# 如果不需要，保持为空字符串即可
FLOWER_BROKER_URL_KEY=""                                    # Flower Broker URL Secret 键名（可选，默认空）
FLOWER_BROKER_API_URL_KEY=""                                # Flower Broker API URL Secret 键名（可选，默认空）
FLOWER_BASIC_AUTH_USER_KEY="basic-auth-user"               # Flower Basic Auth 用户名 Secret 键名

# 是否在部署 Flower 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 Flower 可能会形成自依赖循环（部署 Flower 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：Flower 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
FLOWER_FORCE_OFFLINE="false"

# 镜像版本配置（来源：resources/flower/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，Flower Chart会自动使用最新版本的镜像
# mher/flower:2.0.1
FLOWER_IMAGE_VERSION="2.0.1"
# bitnami/os-shell:12-debian-12-r51
FLOWER_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"          # 是否部署密钥管理

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等
secrets_priority=10           # 密钥管理优先级最低（最后部署）


