apiVersion: v1
kind: ConfigMap
metadata: {name: knowlab-runtime, namespace: app-platform-dev}
data:
  ENV: production
  APP_SLUG: knowlab
  DEPLOYMENT_ID: "knowlab-backend-18f461d9e0ab3e8c"
  ALLOWED_HOSTS: "localhost,127.0.0.1,knowlab-api,knowlab-api.app-platform-dev.svc.cluster.local,knowlab.sunmoonai.com,knowlab-admin.sunmoonai.com,knowlab-tls.app-platform-dev.svc.cluster.local"
  REDIS_HOST: redis.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CELERY_QUEUE: knowlab.default
  CELERY_TASK_TOPOLOGY_PREDECLARED: 'true'
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor.app-platform-dev.svc.cluster.local:8000
  CASDOOR_VERIFY_SSL: 'true'
  SESSION_COOKIE_SECURE: 'true'
  REFERENCE_INTERACTION_ENABLED: 'false'
  S3_ENDPOINT: https://object-storage.data-platform-dev.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_BUCKET: knowlab-originals
  S3_FORCE_PATH_STYLE: 'true'
  S3_USE_TLS: 'true'
  AWS_CA_BUNDLE: /etc/sunmoon/object-storage/ca.crt
  KNOWMART_INTERNAL_URL: https://knowmart-tls.app-platform-dev.svc.cluster.local/api/internal/v1/knowmart
  KNOWMART_DELIVER_SERVICE_APPLICATION: "sunmoonai-knowlab-knowmart-deliver"
  KNOWMART_DELIVER_SERVICE_CLIENT_ID: "sunmoon-knowlab-knowmart-deliver"
  KNOWMART_DELIVER_SERVICE_SCOPE: "knowmart:deliver"
  KNOWMART_DELIVER_SERVICE_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  KNOWMART_DELIVER_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  KNOWBENCH_INTERNAL_URL: https://knowbench-tls.app-platform-dev.svc.cluster.local/api/internal/v1/knowbot-runtime
  KNOWBENCH_TESTRUN_SERVICE_APPLICATION: "sunmoonai-knowlab-knowbench-testrun"
  KNOWBENCH_TESTRUN_SERVICE_CLIENT_ID: "sunmoon-knowlab-knowbench-testrun"
  KNOWBENCH_TESTRUN_SERVICE_SCOPE: "knowbench:testrun"
  KNOWBENCH_TESTRUN_SERVICE_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  KNOWBENCH_TESTRUN_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SERVICE_AUTH_READ_CALLERS: "knowbench"
  SERVICE_AUTH_READ_KNOWBENCH_CASDOOR_APPLICATION: "sunmoonai-knowbench-knowlab-read"
  SERVICE_AUTH_READ_KNOWBENCH_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  SERVICE_AUTH_READ_KNOWBENCH_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SERVICE_AUTH_READ_KNOWBENCH_AUDIENCE: "sunmoon-knowbench-knowlab-read"
  SERVICE_AUTH_READ_KNOWBENCH_SUBJECT_ALLOWLIST: "admin/sunmoonai-knowbench-knowlab-read"
  SERVICE_AUTH_READ_KNOWBENCH_REQUIRED_SCOPE: "knowlab:read"
  SSL_CERT_FILE: /etc/sunmoon/service/ca.crt
  STORAGE_BACKEND: "s3"
  WEB_AUTH_ALLOWED_RETURN_PATHS: "/zh-CN/dashboard,/en/dashboard,/zh-CN/login,/en/login,/zh-CN/knowbots,/en/knowbots"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: knowlab-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowlab-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowlab-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowlab-api
        app.kubernetes.io/part-of: knowlab
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: f45a51c384c1bdc73d91eda58531a86b3a76bf1840590ce8577fccd1c182220b
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowlab-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/knowlab-backend@sha256:18f461d9e0ab3e8c309d9195a0cea9a2e3ac96644981ed75089955f05be11b6f
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowlab-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowlab-runtime}}
            - {configMapRef: {name: knowlab-browser-identity}}
            - {secretRef: {name: knowlab-database-runtime}}
            - {secretRef: {name: knowlab-rabbitmq-runtime}}
            - {secretRef: {name: knowlab-redis-runtime}}
            - {secretRef: {name: knowlab-browser-secrets}}
            - {secretRef: {name: knowlab-storage-runtime}}
            - {secretRef: {name: knowlab-knowmart-deliver-service}}
            - {secretRef: {name: knowlab-knowbench-testrun-service}}
          resources: {"requests": {"cpu": "100m", "memory": "256Mi"}, "limits": {"cpu": "2", "memory": "1536Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: knowlab-service-ca}}
        - {name: storage-ca, secret: {secretName: knowlab-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: celery-config, configMap: {name: knowlab-celery-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowlab-worker, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowlab-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowlab-worker
        app.kubernetes.io/part-of: knowlab
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: f45a51c384c1bdc73d91eda58531a86b3a76bf1840590ce8577fccd1c182220b
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowlab-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: harbor.sunmoonai.com:30443/platform/knowlab-backend@sha256:18f461d9e0ab3e8c309d9195a0cea9a2e3ac96644981ed75089955f05be11b6f
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.worker:celery_app', worker, --loglevel=INFO, '--concurrency=2', '--hostname=celery@$(POD_NAME)']
          startupProbe: {exec: {command: [python, -m, app.cli.worker_readiness]}, timeoutSeconds: 10, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {exec: {command: [python, -m, app.cli.worker_readiness]}, timeoutSeconds: 10, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowlab-worker}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowlab-runtime}}
            - {configMapRef: {name: knowlab-browser-identity}}
            - {secretRef: {name: knowlab-database-runtime}}
            - {secretRef: {name: knowlab-rabbitmq-runtime}}
            - {secretRef: {name: knowlab-storage-runtime}}
            - {secretRef: {name: knowlab-knowmart-deliver-service}}
            - {secretRef: {name: knowlab-knowbench-testrun-service}}
          resources: {"requests": {"cpu": "100m", "memory": "256Mi"}, "limits": {"cpu": "2", "memory": "1Gi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: knowlab-service-ca}}
        - {name: storage-ca, secret: {secretName: knowlab-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: celery-config, configMap: {name: knowlab-celery-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowlab-scheduler, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowlab-scheduler}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowlab-scheduler
        app.kubernetes.io/part-of: knowlab
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: f45a51c384c1bdc73d91eda58531a86b3a76bf1840590ce8577fccd1c182220b
    spec:
      dnsConfig:
        options: [{name: ndots, value: '2'}]
      serviceAccountName: knowlab-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: harbor.sunmoonai.com:30443/platform/knowlab-backend@sha256:18f461d9e0ab3e8c309d9195a0cea9a2e3ac96644981ed75089955f05be11b6f
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.scheduler:celery_app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule, --pidfile=, --max-interval=5]
          startupProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 10}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowlab-scheduler}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowlab-runtime}}
            - {configMapRef: {name: knowlab-browser-identity}}
            - {secretRef: {name: knowlab-database-runtime}}
            - {secretRef: {name: knowlab-rabbitmq-runtime}}
            - {secretRef: {name: knowlab-storage-runtime}}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: service-ca, mountPath: /etc/sunmoon/service, readOnly: true}
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: service-ca, configMap: {name: knowlab-service-ca}}
        - {name: storage-ca, secret: {secretName: knowlab-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: celery-config, configMap: {name: knowlab-celery-config}}
---
apiVersion: v1
kind: Service
metadata: {name: knowlab-api, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: knowlab-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowlab-api-ingress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-admin}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowlab-api-casdoor-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: knowlab-api-casdoor-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knowlab-api}}
      ports: [{protocol: TCP, port: 8000}]
---
