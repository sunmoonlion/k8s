# Casdoor 开发环境 Helm Values
# Chart: casdoor-krzw/casdoor  (community chart, appVersion v1.224.0)

image:
  repository: harbor.sunmoonai.com:30443/k8s-images/casdoor
  pullPolicy: IfNotPresent
  # tag 在 deploy-casdoor.sh 中通过 --set image.tag= 注入

imagePullSecrets:
  - name: harbor-registry-secret

# ──────────────────────────────────────────────────────────────
# 数据库配置（通过环境变量注入到容器）
# ──────────────────────────────────────────────────────────────
env:
  RUNNING_IN_DOCKER: "true"
  driverName: postgres
  # ⚠️ 密码通过 K8s Secret 覆盖，这里仅作结构占位
  dataSourceName: "user=casdoor password=casdoor_dev_pass host=postgresql-sunmoonai.data-platform-dev.svc.cluster.local port=5432 sslmode=disable dbname=casdoor"
  dbName: ""

# ──────────────────────────────────────────────────────────────
# 服务
# ──────────────────────────────────────────────────────────────
service:
  main:
    ports:
      http:
        port: 8000

# Ingress 由 Traefik IngressRoute 管理
ingress:
  main:
    enabled: false

# ──────────────────────────────────────────────────────────────
# 资源限制
# ──────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ──────────────────────────────────────────────────────────────
# 持久化存储（/conf 目录）
# ──────────────────────────────────────────────────────────────
# ⚠️ 重要：PVC 挂载覆盖了镜像内置的 /conf，导致 app.conf 丢失。
# 首次部署后需手动写入 /conf/app.conf（beego 必须有此文件才能正常读取请求体）：
#
#   kubectl exec -n app-platform-dev <pod> -- sh -c 'cat > /conf/app.conf << EOF
#   appname = casdoor
#   httpport = 8000
#   runmode = dev
#   SessionOn = true
#   copyrequestbody = true
#   logPostOnly = true
#   EOF'
#   kubectl rollout restart deployment/casdoor-sunmoonai -n app-platform-dev
#
# 缺少 copyrequestbody=true 会导致登录时报 "unexpected end of JSON input"。
persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    type: pvc
    mountPath: /conf
    size: 1Gi
    storageClass: "nfs-2"
