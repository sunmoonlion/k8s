apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-default-deny
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-dns-egress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-frontend-ingress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchExpressions:
    - key: sunmoonai.com/app
      operator: In
      values:
      - info
    - key: app.kubernetes.io/component
      operator: In
      values:
      - admin-frontend
      - web-frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-platform-dev
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-frontend-egress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchExpressions:
    - key: sunmoonai.com/app
      operator: In
      values:
      - info
    - key: app.kubernetes.io/component
      operator: In
      values:
      - admin-frontend
      - web-frontend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          sunmoonai.com/app: info
          app.kubernetes.io/component: backend-api
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-backend-ingress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
      app.kubernetes.io/component: backend-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-platform-dev
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - podSelector:
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values:
          - admin-frontend
          - web-frontend
        - key: sunmoonai.com/app
          operator: In
          values:
          - info
    - podSelector:
        matchLabels:
          sunmoonai.com/allow-info-internal: 'true'
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-backend-migration-egress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
      app.kubernetes.io/component: backend-migration
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          sunmoonai.com/backend-dependency: info
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          sunmoonai.com/data-platform: 'true'
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: info-backend-api-egress
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  podSelector:
    matchLabels:
      sunmoonai.com/app: info
      app.kubernetes.io/component: backend-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          sunmoonai.com/data-platform: 'true'
