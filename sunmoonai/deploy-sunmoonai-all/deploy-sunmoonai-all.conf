# ============================================================================
# SunmoonAI 项目总部署配置
# ============================================================================
SUNMOONAI_PROJECT_ID="sunmoonai"
# 注意：SunmoonAI 项目本身不需要总命名空间，各平台使用自己的命名空间
ENVIRONMENT="development"

# ============================================================================
# KIND / kubeadm 仅建群方式不同，建群入口见仓库根 README。
# 本总控只部署已存在集群上的平台/应用，不调用旧 deploy-kind 或云端建群。
# Harbor 始终使用独立仓库模块；ingress/cicd 开关对两种集群同义。
# 新 main 的消费者和子脚本配置仍需迁移核验，不自动替换旧 inbox 目标。
# ============================================================================
# 平台级部署控制标志
# ============================================================================
# 控制是否部署各个平台级组件（具体分流逻辑见上方说明）
infrastructure_enabled="false"       # 必须 false；建群单独执行
ingress_platform_enabled="false"     # 共享入口平台开关，保留当前选择
cicd_platform_enabled="false"        # 共享 CI/CD 平台开关，保留当前选择
data_platform_enabled="true"         # 是否部署数据平台
app_platform_enabled="true"         # 是否部署应用平台（auth / info / knowledge / llm / research / investment / tools）
messaging_platform_enabled="true"    # 是否部署消息平台
ops_platform_enabled="true"          # 是否部署运维平台（pgadmin / mongo-express 等）

# ============================================================================
# 部署前准备
# ============================================================================
# 是否在部署前自动从各组件的 .yaml.example 复制生成 secret 的 .yaml 占位文件。默认 true。
# 设为 false 的典型场景：
#   - 已手工或通过其他途径维护好各组件 secret 的 .yaml，不希望被 example 覆盖。
#   - 使用外部密管（如 Vault/CI 注入），不需要从 example 生成占位文件。
PREPARE_SECRETS_FROM_EXAMPLES="${PREPARE_SECRETS_FROM_EXAMPLES:-true}"

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
infrastructure_priority=1000         # 基础设施优先级最高（最先部署）
# ingress_platform_priority=900      # 入口平台优先级高
# cicd_platform_priority=800         # CI/CD 平台优先级高
data_platform_priority=700           # 数据平台优先级中等
app_platform_priority=450            # 应用平台依赖 data/messaging 等基础能力，默认排在 messaging 之后、ops 之前
messaging_platform_priority=500      # 消息平台优先级中等
ops_platform_priority=400            # 运维平台优先级较低（最后部署）

# ============================================================================
# 平台特定配置
# ============================================================================
# 基础设施平台配置
INFRASTRUCTURE_NAMESPACE="infrastructure-dev"
INFRASTRUCTURE_ENVIRONMENT="development"

# 入口平台配置
INGRESS_PLATFORM_NAMESPACE="ingress-platform-dev"
INGRESS_PLATFORM_ENVIRONMENT="development"

# CI/CD 平台配置
CICD_PLATFORM_NAMESPACE="cicd-platform-dev"
CICD_PLATFORM_ENVIRONMENT="development"

# Harbor 配置
HARBOR_ADMIN_PASSWORD="Ha!r1359admin"  # Harbor 管理员密码
HARBOR_PROJECT_NAME="k8s-images"       # Harbor 镜像项目名称
HARBOR_PROJECT_NAMES="k8s-images,app-images"  # k8s-images 放基础组件镜像；app-images 放业务应用镜像

# 数据平台配置
DATA_PLATFORM_NAMESPACE="data-platform-dev"
DATA_PLATFORM_ENVIRONMENT="development"

# 应用平台配置
APP_PLATFORM_NAMESPACE="app-platform-dev"
APP_PLATFORM_ENVIRONMENT="development"

# 消息平台配置
MESSAGING_PLATFORM_NAMESPACE="messaging-platform-dev"
MESSAGING_PLATFORM_ENVIRONMENT="development"

# 运维平台配置
OPS_PLATFORM_NAMESPACE="ops-platform-dev"
OPS_PLATFORM_ENVIRONMENT="development"

# ============================================================================
# 可选：等待就绪模式
# ============================================================================
# WAIT_READY=true 时，每个平台部署完成后会轮询该平台命名空间内 Pod，
# 直到非空 Pod 集合全部 Ready/Succeeded；查询失败、空集合或超时不能报告成功。
# WAIT_READY_TIMEOUT：单平台最大等待秒数，默认 180（3 分钟）。
# WAIT_READY="true"
# WAIT_READY_TIMEOUT=180
