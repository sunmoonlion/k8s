# ============================================================================
# knowledge-admin-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/knowledge-admin-backend.yaml"
OUTPUT_FILE="knowledge-admin-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY="${KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
KNOWLEDGE_ADMIN_BACKEND_IMAGE_PROJECT="${KNOWLEDGE_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
KNOWLEDGE_ADMIN_BACKEND_IMAGE="${KNOWLEDGE_ADMIN_BACKEND_IMAGE:-knowledge-admin-backend}"
KNOWLEDGE_ADMIN_BACKEND_TAG="${KNOWLEDGE_ADMIN_BACKEND_TAG:-1.0.1}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
KNOWLEDGE_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME:-knowledge-admin-backend-secret}"
KNOWLEDGE_ADMIN_BACKEND_BROWSER_OIDC_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_BROWSER_OIDC_SECRET_NAME:-knowledge-admin-backend-browser-oidc}"
KNOWLEDGE_INFO_INGEST_BINDING_SECRET_NAME="${KNOWLEDGE_INFO_INGEST_BINDING_SECRET_NAME:-knowledge-info-ingest-service-binding}"
KNOWLEDGE_ADMIN_BACKEND_CONFIGMAP_NAME="${KNOWLEDGE_ADMIN_BACKEND_CONFIGMAP_NAME:-knowledge-admin-backend-config}"
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_SECRET_NAME:-celeryworker-knowledge-admin-backend-secret}"
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_CONFIGMAP_NAME="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_CONFIGMAP_NAME:-celeryworker-knowledge-admin-backend-config}"
KNOWLEDGE_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${KNOWLEDGE_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME-knowledge-admin-backend-s3}"
KNOWLEDGE_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME-knowledge-admin-backend-s3}"
KNOWLEDGE_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${KNOWLEDGE_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME-knowledge-admin-backend-elasticsearch}"
KNOWLEDGE_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME-knowledge-admin-backend-elasticsearch}"
KNOWLEDGE_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME-knowledge-admin-backend-postgresql-conn}"
KNOWLEDGE_ADMIN_BACKEND_REDIS_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_REDIS_SECRET_NAME-knowledge-admin-backend-redis-conn}"
KNOWLEDGE_ADMIN_BACKEND_MONGODB_SECRET_NAME="${KNOWLEDGE_ADMIN_BACKEND_MONGODB_SECRET_NAME-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-knowledge-admin-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
