        sunmoonai.com/app: info
        sunmoonai.com/managed-by: app-platform-v2
      annotations:
        sunmoonai.com/config-sha256: b7575050afe5ec69a048fbd1f8e1fca4c96076d6cbe839a9071a88e9bddfbd98
        sunmoonai.com/source-commit: 8c3b695e3e2b5b4064b5b14ce8d2b6d6767177e2
    spec:
      serviceAccountName: info-backend-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: harbor.sunmoonai.com:30443/app-images/info-backend@sha256:884dc222c2c7c3fc86787592ec03a5bb306a44a8bf069df10e3c9ed38806f1b9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - exec celery -A app.bootstrap.worker:celery_app worker --loglevel=INFO --concurrency="${CELERY_WORKER_CONCURRENCY}"
          --hostname="celery@${POD_NAME}"
        envFrom:
        - configMapRef:
            name: info-backend-config
        - secretRef:
            name: info-knowledge-ingest-client
        - configMapRef:
            name: info-backend-s3
        - secretRef:
            name: info-backend-s3
        - configMapRef:
            name: info-backend-elasticsearch
        - secretRef:
            name: info-backend-elasticsearch
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: info-backend-redis-conn
              key: REDIS_PASSWORD
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-broker
              key: CELERY_BROKER_URL
        - name: CELERY_RESULT_BACKEND
          valueFrom:
            secretKeyRef:
              name: info-backend-broker
              key: CELERY_RESULT_BACKEND
              optional: true
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - celery -A app.bootstrap.worker:celery_app inspect ping --destination="celery@${POD_NAME}"
              --timeout=3 | grep -q pong
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 8
          failureThreshold: 4
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: elasticsearch-ca
          mountPath: /var/run/secrets/sunmoonai/elasticsearch
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: elasticsearch-ca
        secret:
          secretName: info-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
