# 开发环）Harbor Values 配置
# 基于 Bitnami Harbor Chart 官方结构整理

# ============================================================================
# 从配置文件读取的变量
# ============================================================================
# 这些变量通过部署脚本）deploy-harbor.conf 文件中读取并替换
# 部署脚本会自动替）{{HARBOR_EXTERNAL_HOST}} 等模板变）

# ============================================================================
# 全局配置
# ============================================================================
global:
  imageRegistry: ""
  defaultStorageClass: ""  # 使用 existingClaim 静态 PV，不需要 storageClass

# ============================================================================
# 通用配置
# ============================================================================
nameOverride: ""
fullnameOverride: ""

# 通用标签
commonLabels:
  app.kubernetes.io/name: "harbor"
  app.kubernetes.io/instance: "{{HARBOR_PROJECT_ID}}"
  app.kubernetes.io/component: "harbor"
  app.kubernetes.io/environment: "development"
  app.kubernetes.io/part-of: platform
  app.kubernetes.io/managed-by: helm


# ============================================================================
# Harbor 核心配置
# ============================================================================

# 管理员密）- 使用现有Secret提高安全）
# adminPassword: "Harbor@12345"  # ）已删除明文密码配）
existingSecret: "{{HARBOR_AUTH_SECRET_NAME}}"
existingSecretAdminPasswordKey: "{{HARBOR_AUTH_SECRET_PASSWORD_KEY}}"

# 外部访问URL - 使用模板变量，从deploy-harbor.conf读取
# 访问地址: https://harbor.sunmoonai.com:30443（使）websecure entryPoint）
externalURL: https://{{HARBOR_EXTERNAL_HOST}}:{{HARBOR_EXTERNAL_PORT}}


# 暴露类型（chart 仅提供三种）
# exposureType: "ingress" - ）chart 创建 Ingress 资源，由 Ingress Controller（如 Traefik）暴）
# exposureType: "proxy"   - ）chart ）Harbor 自带 NGINX 做入口；是否对外暴露由下）service.type 决定）
#                             service.type: ClusterIP ）不暴露（仅集群内）；NodePort/LoadBalancer ）暴露
# exposureType: "none"    - ）chart 不创）Ingress、也不创）proxy，由用户自建 Ingress 等方式暴）
exposureType: "ingress"

# ============================================================================
# 服务配置
# ============================================================================
# 当使）exposureType: "ingress" 时，Service 配置）Helm 模板自动生成
# 不需要手动指定端口，避免与模板冲）
service:
  type: "ClusterIP"
  # ports 配置已移除，）Helm 模板自动处理
# ============================================================================
# Ingress 配置（与 Traefik 配合使用）
# ============================================================================
# “内）Ingress”指 Harbor Chart 会创）Kubernetes Ingress 资源（声明路由））
# 并非 Harbor 自己跑一）Ingress Controller。Traefik 作为集群）Ingress Controller
# 会监听这）Ingress 并按规则把流量转）Harbor Service）
# 因此使用 Traefik 时必须保）ingress.enabled: true，否）Traefik 没有 Harbor 的路由可接；
# 若设）false，需自行编写 Ingress 或改）NodePort/LoadBalancer 暴露）
ingress:
  enabled: true
  core:
    # 使用默认的IngressClass（自动检测集群默认的IngressClass）
    ingressClassName: ""
    # Harbor访问域名 - 使用模板变量
    hostname: "{{HARBOR_EXTERNAL_HOST}}"
    # 路径匹配类型
    pathType: "Prefix"
    # Annotations 配置（必须配置在 ingress.core.annotations 下）
    # 根据 Harbor Helm chart 模板，annotations 应该配置）ingress.core.annotations ）
    annotations:
      # 使用 websecure entryPoint（端）30443）
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      # 使用 buffering 中间件支持大文件上传
      traefik.ingress.kubernetes.io/router.middlewares: "ingress-platform-dev-traefik-buffering-sunmoonai@kubernetescrd"
      # 其他 Harbor 需要的 annotations
      ingress.kubernetes.io/proxy-body-size: "0"
      ingress.kubernetes.io/ssl-redirect: "true"
    # TLS 配置
    # 注意：TLS 终止）Traefik，Traefik ）Harbor 的流量是 HTTP（不加密）
    # HTTPS 证书：由 Traefik 侧生成并存放）K8s Secret「traefik-tls-secret」（Traefik 所在命名空间，）ingress-platform-dev））
    # 生成流程：ensure-kind-ca.sh 生成本地）CA ）Traefik 部署）deploy-traefik-tls-secret ）CA 签发服务器证书并创建）Secret ）Traefik ）tlsStore.defaultCertificate.secretName 指向 traefik-tls-secret）
    tls: false
    selfSigned: false
# ============================================================================
# 持久化存储（Bitnami Harbor Chart）
# ============================================================================
# Kind 静态 PV 见 harbor-kind-pv-pvc.yaml → /data/kind-local-storage/harbor/*
#
# 注意：仅 registry/jobservice 走 persistence.persistentVolumeClaim；
# PostgreSQL、Redis 必须在各自子 chart 下配置 existingClaim（写 database/redis 无效）。
# Trivy STS 当前 chart 不支持 existingClaim，扫描缓存仍用动态 PVC。
persistence:
  persistentVolumeClaim:
    registry:
      existingClaim: "harbor-sunmoonai-registry-dev-pvc"
    jobservice:
      existingClaim: "harbor-sunmoonai-jobservice-dev-pvc"
    trivy:
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi

# ============================================================================
# 内置数据库配置（PostgreSQL）
# ============================================================================
# 元数据（项目/仓库/标签）落盘到 harbor-sunmoonai-database-dev-pvc
postgresql:
  enabled: true
  primary:
    # Kind 空 hostPath 为 root:root，与 registry 同理需 init 修正挂载根目录属主
    initContainers:
      - name: fix-storage-owner
        image: docker.io/bitnami/postgresql:17.6.0-debian-12-r4
        command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/postgresql"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: data
            mountPath: /bitnami/postgresql
    persistence:
      enabled: true
      existingClaim: harbor-sunmoonai-database-dev-pvc
    resources:
      limits:
        memory: "512Mi"  # 限制最大内存使）
      requests:
        memory: "256Mi"  # 请求最小内）
    # 可以在这里自定义PostgreSQL镜像
    # image:
    #   registry: docker.io
    #   repository: bitnami/postgresql
    #   tag: 16.7.0-debian-12-r0

# 禁用外部数据库配置，使用内置数据）
# externalDatabase:
#   host: "postgresql-{{HARBOR_PROJECT_ID}}.data-platform-dev.svc.cluster.local"
#   port: 5432
#   user: "{{HARBOR_PROJECT_ID}}_harbor"
#   # password: "SunMoonAI_PostgreSQL_2024!"  # ）已删除明文密）
#   existingSecret: "postgresql-secrets"  # 直接使用PostgreSQL的Secret
#   existingSecretPasswordKey: "harbor-password"  # 使用PostgreSQL Secret中的harbor-password
#   sslmode: "disable"
#   coreDatabase: "{{HARBOR_PROJECT_ID}}_harbor"  # 使用PostgreSQL中已创建的Harbor数据）

# ============================================================================
# PostgreSQL 配置说明
# ============================================================================
# 使用现有的PostgreSQL组件：sunmoonai/data-platform/postgresql
# 
# 已配置的Harbor用户和数据库）
# - 用户: sunmoonai_harbor
# - 数据） sunmoonai_harbor  
# - 密码: Harbor_Secure_2024! (来自postgresql-secrets的harbor-password）
# - 主机: postgresql-sunmoonai.data-platform-dev.svc.cluster.local
# - 端口: 5432
#
# PostgreSQL组件已通过initdbScripts自动创建了Harbor所需的用户和数据）

# ============================================================================
# 内置缓存配置（Redis）
# ============================================================================
# 启用内置 Redis（会话/缓存）
redis:
  enabled: true
  architecture: standalone
  master:
    initContainers:
      - name: fix-storage-owner
        image: docker.io/bitnami/redis:8.2.1-debian-12-r0
        command: ["/bin/sh", "-ec", "chown 1001:1001 /bitnami/redis"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: redis-data
            mountPath: /bitnami/redis
    persistence:
      enabled: true
      existingClaim: harbor-sunmoonai-redis-dev-pvc
    resources:
      limits:
        memory: "256Mi"  # 限制最大内存使）
      requests:
        memory: "128Mi"  # 请求最小内）

# 禁用外部 Redis 配置，使用内）Redis
# externalRedis:
#   host: "redis-sunmoonai-master.data-platform-dev.svc.cluster.local"
#   port: 6379
#   password: "SunMoonAI_Redis_2024!"
#  #existingSecret: "redis-secrets"      # 使用密钥对于bitnami chart有bug
#   coreDatabaseIndex: "0"
#   jobserviceDatabaseIndex: "1"
#   registryDatabaseIndex: "2"
#   trivyAdapterDatabaseIndex: "5"

# ============================================================================
# Harbor 组件配置
# ============================================================================

# Portal（Web UI）
portal:
  replicaCount: 1

# Core（核心服务）
core:
  replicaCount: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# JobService（作业服务）
jobservice:
  replicaCount: 1
  maxJobWorkers: 10
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# Registry（镜像仓库）
registry:
  replicaCount: 1
  storage:
    type: "filesystem"
  # Kind 环境：volumePermissions init 容器只 chown /storage 内容（-mindepth 1），
  # 空目录时 /storage 本身永远是 root:root，导致 registry(uid=1001) 无法写入。
  # 用自定义 initContainer 直接 chown /storage 目录本身。
  initContainers:
    - name: fix-storage-owner
      # 与 registry.server 同镜像：certificate-volume-server 已先拉取，本 init 不再访问外网/Harbor，
      # 避免 os-shell@DockerHub 超时、或 Harbor 私有 k8s-images 无 imagePullSecrets 导致 401。
      image: docker.io/bitnami/harbor-registry:2.13.2-debian-12-r2
      command: ["/bin/sh", "-ec", "chown 1001:1001 /storage"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: registry-data
          mountPath: /storage

# Trivy（镜像扫描）
trivy:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# Notary（镜像签名，可选）
notary:
  enabled: false

# ============================================================================
# 其他配置
# ============================================================================

volumePermissions:
  enabled: false

# RBAC
rbac:
  create: true

# ServiceAccount
serviceAccount:
  create: true
  name: ""
