# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
defaults:
  enabled: '{{ services_enabled and services_elk_enabled }}'
stages:
- name: elasticsearch
  dependsOn: [platform-foundations]
  images: [elasticsearch]
- name: elk-initialize
  path: ../initialize
  dependsOn: [elasticsearch]
  images: [elasticsearch]
