# Info Web Frontend 路由配置 (Traefik IngressRoute)
# Next.js standalone（SSR + BFF），含 /api/auth/* 内置路由，所有请求交给 Node.js server 处理。
#
# 访问方式：
# - https://info.sunmoonai.com/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-web-frontend-ingress
  namespace: app-platform-dev
  labels:
    app: app-platform-ingress
    component: info-web-frontend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`info.sunmoonai.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: info-web-frontend
          port: 3000
