# ============================================================================
# research-admin-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/research-admin-backend.yaml"
OUTPUT_FILE="research-admin-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
RESEARCH_ADMIN_BACKEND_IMAGE_REGISTRY="${RESEARCH_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_RESEARCH_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
RESEARCH_ADMIN_BACKEND_IMAGE_PROJECT="${RESEARCH_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
RESEARCH_ADMIN_BACKEND_IMAGE="${RESEARCH_ADMIN_BACKEND_IMAGE:-research-admin-backend}"
RESEARCH_ADMIN_BACKEND_TAG="${RESEARCH_ADMIN_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
RESEARCH_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
RESEARCH_ADMIN_BACKEND_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_SECRET_NAME:-research-admin-backend-secret}"
RESEARCH_ADMIN_BACKEND_CONFIGMAP_NAME="${RESEARCH_ADMIN_BACKEND_CONFIGMAP_NAME:-research-admin-backend-config}"
RESEARCH_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${RESEARCH_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-research-admin-backend-s3}"
RESEARCH_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME:-research-admin-backend-s3}"
RESEARCH_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${RESEARCH_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-research-admin-backend-elasticsearch}"
RESEARCH_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME:-research-admin-backend-elasticsearch}"
RESEARCH_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME:-research-admin-backend-postgresql-conn}"
RESEARCH_ADMIN_BACKEND_REDIS_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_REDIS_SECRET_NAME:-research-admin-backend-redis-conn}"
RESEARCH_ADMIN_BACKEND_MONGODB_SECRET_NAME="${RESEARCH_ADMIN_BACKEND_MONGODB_SECRET_NAME:-research-admin-backend-mongodb-conn}"

# PVC 配置
PVC_NAME="${PVC_NAME:-research-admin-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
