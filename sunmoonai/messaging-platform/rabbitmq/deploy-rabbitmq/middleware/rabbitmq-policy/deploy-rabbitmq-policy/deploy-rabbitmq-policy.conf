# RabbitMQ 策略中间件部署配置

# 基础配置
RABBITMQ_PROJECT_ID="sunmoonai"
RABBITMQ_NAMESPACE="messaging-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
RABBITMQ_POLICY_TYPES="rateLimit,headers"

# 限流配置
RABBITMQ_RATE_LIMIT_AVERAGE="30"
RABBITMQ_RATE_LIMIT_BURST="60"

# 头部配置
RABBITMQ_HEADERS_CUSTOM_REQUEST_HEADERS="X-RabbitMQ-Version:3.12.0"
RABBITMQ_HEADERS_CUSTOM_RESPONSE_HEADERS="X-RabbitMQ-Status:active"

