# ============================================================================
# knowledge-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/knowledge-web-backend.yaml"
OUTPUT_FILE="knowledge-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY="${KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
KNOWLEDGE_WEB_BACKEND_IMAGE_PROJECT="${KNOWLEDGE_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
KNOWLEDGE_WEB_BACKEND_IMAGE="${KNOWLEDGE_WEB_BACKEND_IMAGE:-knowledge-web-backend}"
KNOWLEDGE_WEB_BACKEND_TAG="${KNOWLEDGE_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
KNOWLEDGE_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
KNOWLEDGE_WEB_BACKEND_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_SECRET_NAME:-knowledge-web-backend-secret}"
KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME="${KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME:-knowledge-web-backend-config}"
KNOWLEDGE_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${KNOWLEDGE_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-knowledge-web-backend-s3}"
KNOWLEDGE_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME:-knowledge-web-backend-s3}"
KNOWLEDGE_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${KNOWLEDGE_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-knowledge-web-backend-elasticsearch}"
KNOWLEDGE_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME:-knowledge-web-backend-elasticsearch}"
KNOWLEDGE_WEB_BACKEND_POSTGRESQL_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_POSTGRESQL_SECRET_NAME:-knowledge-web-backend-postgresql-conn}"
KNOWLEDGE_WEB_BACKEND_REDIS_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_REDIS_SECRET_NAME:-knowledge-web-backend-redis-conn}"
KNOWLEDGE_WEB_BACKEND_MONGODB_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_MONGODB_SECRET_NAME:-knowledge-web-backend-mongodb-conn}"

# PVC 配置
PVC_NAME="${PVC_NAME:-knowledge-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
