apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-r5-backend-api
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: info-r5-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: info-r5
    sunmoonai.com/app: info-r5
    sunmoonai.com/managed-by: architecture-v2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      sunmoonai.com/app: info-r5
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: info-r5-backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: info-r5
        sunmoonai.com/app: info-r5
        sunmoonai.com/managed-by: architecture-v2
        sunmoonai.com/internal-provider: 'true'
      annotations:
        sunmoonai.com/release-id: r5-info-formal-001
    spec:
      serviceAccountName: info-r5-backend-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            sunmoonai.com/app: info-r5
            app.kubernetes.io/component: backend-api
      containers:
      - name: api
        image: harbor.sunmoonai.com:30443/app-images/info-backend@sha256:ee962dff40dd0ebee6969f084dceac10a9283814df7af45d1da6e114047bea0d
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        args:
        - app.bootstrap.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: info-r5-backend-config
        - configMapRef:
            name: info-admin-backend-s3
        - secretRef:
            name: info-admin-backend-s3
        - configMapRef:
            name: info-admin-backend-elasticsearch
        - secretRef:
            name: info-admin-backend-elasticsearch
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: info-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: info-admin-backend-redis-conn
              key: REDIS_PASSWORD
        - name: ADMIN_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: info-r5-browser-identity
              key: ADMIN_CLIENT_ID
        - name: ADMIN_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: info-r5-browser-identity
              key: ADMIN_CLIENT_SECRET
        - name: WEB_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: info-r5-browser-identity
              key: WEB_CLIENT_ID
        - name: WEB_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: info-r5-browser-identity
              key: WEB_CLIENT_SECRET
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: celeryworker-info-admin-backend-secret
              key: CELERY_BROKER_URL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: info-r5-backend
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: Host
              value: info-r5-backend
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: info-r5-backend
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: elasticsearch-ca
          mountPath: /etc/elasticsearch/ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: elasticsearch-ca
        secret:
          secretName: info-admin-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: info-r5-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info-r5
    sunmoonai.com/managed-by: architecture-v2
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      sunmoonai.com/app: info-r5
      app.kubernetes.io/component: backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: info-r5-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info-r5
    sunmoonai.com/managed-by: architecture-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: info-r5-backend-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
