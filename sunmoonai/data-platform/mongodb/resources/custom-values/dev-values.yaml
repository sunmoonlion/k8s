# MongoDB 开发环境配置 - 直接写具体值，不做模板替换

# 全局配置
global:
  imageRegistry: ""
  imagePullSecrets:
    - name: "harbor-registry-secret"
  storageClass: "nfs-2"

# 镜像配置
image:
  registry: ""
  repository: bitnami/mongodb
  tag: "8.0.13-debian-12-r0"
  pullPolicy: "IfNotPresent"
  pullSecrets: []

# 认证配置
auth:
  enabled: true
  # 通过统一密管的 Secret 注入（Bitnami MongoDB 期望的键：
  #   mongodb-root-password, mongodb-passwords, 可选 mongodb-metrics-password, mongodb-replica-set-key）
  existingSecret: "mongodb-auth-secret"
  # 使用数组字段（新版推荐），用户名/数据库在此声明；密码由 existingSecret 提供
  # - 支持创建多个用户与数据库：usernames、databases 一一对应
  # - 密码从密管 Secret 的键 mongodb-passwords 读取，按 usernames 的顺序以英文逗号分隔
  #   例：usernames: ["app_a","app_b"], databases: ["db_a","db_b"],
  #       mongodb-passwords: "PassA,PassB"
  # - root 密码来自 mongodb-root-password
  # - 对比：Bitnami PostgreSQL 只支持代建"单个" username/database；多用户需用 initdb.scripts
  # - 注意：usernames 和 databases 是一一对应的，如果只有一个用户但需要多个数据库，
  #   需要在 initdbScripts 中创建额外的数据库并授予权限
  usernames:
    - "sunmoonai_dev"
  passwords: []
  databases:
    - "mydb"  # 默认数据库（与 sunmoonai_dev 用户一一对应）

# 持久化配置
# 注意：MongoDB Chart 需要在根级别配置 persistence，不支持 primary.persistence 结构
# 在 standalone 模式下，只创建一个 PVC
persistence:
  enabled: true 
  storageClass: "nfs-2"
  size: "8Gi"
  accessModes:
    - "ReadWriteOnce"

# 服务配置
# 注意：MongoDB Chart 需要在根级别配置 service，不支持 primary.service 结构
service:
  type: "ClusterIP"  # 改为 ClusterIP，只在内网访问
  ports:
    mongodb: 27017

# 资源配置
# 注意：MongoDB Chart 需要在根级别配置 resources，不支持 primary.resources 结构
resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

# 健康检查配置
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
  successThreshold: 1

# 架构配置
architecture: standalone

# 监控配置
metrics:
  enabled: false
  image:
    registry: ""
    repository: bitnami/mongodb-exporter
    tag: "0.47.0-debian-12-r1"
    pullPolicy: "IfNotPresent"
  
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"

# Ingress 配置 - 通过 Traefik 统一管理
ingress:
  enabled: false  # 禁用 Helm Chart 的 Ingress，使用独立的 Ingress 资源

# 初始化脚本 - 创建额外的数据库并授予用户权限
# 注意：MongoDB 的 auth.usernames 和 auth.databases 是一一对应的
# 如果只有一个用户但需要多个数据库，需要在 initdbScripts 中创建额外的数据库并授予权限
initdbScripts:
  # 创建 llmops_db 数据库并授予 sunmoonai_dev 用户权限
  create-llmops-db.js: |
    // 切换到 llmops_db 数据库（如果不存在会自动创建）
    db = db.getSiblingDB('llmops_db');
    // 创建一个临时集合以确保数据库被创建
    db.createCollection('_init');
    // 注意：用户 sunmoonai_dev 是在 mydb 数据库中创建的，所以需要在 mydb 数据库中授予权限
    // 切换到 mydb 数据库以授予用户权限
    db = db.getSiblingDB('mydb');
    // 检查用户是否存在，如果存在则授予权限
    try {
      var user = db.getUser('sunmoonai_dev');
      if (user) {
        // 授予 sunmoonai_dev 用户对 llmops_db 数据库的所有权限
        db.grantRolesToUser('sunmoonai_dev', [
          { role: 'readWrite', db: 'llmops_db' },
          { role: 'dbAdmin', db: 'llmops_db' }
        ]);
        print('已授予 sunmoonai_dev 用户对 llmops_db 数据库的权限');
      } else {
        print('警告: sunmoonai_dev 用户不存在，跳过权限授予');
      }
    } catch (e) {
      print('错误: 无法授予权限 - ' + e);
      // 不抛出异常，允许脚本继续执行
    }

# 数据库配置
mongodbConfiguration: |
  # 开发环境配置
  storage:
    dbPath: /bitnami/mongodb
    journal:
      enabled: true
  systemLog:
    destination: file
    logAppend: true
    path: /opt/bitnami/mongodb/logs/mongodb.log
  net:
    port: 27017
    bindIp: 0.0.0.0
