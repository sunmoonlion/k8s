# ============================================================================
# tools-admin-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/tools-admin-backend.yaml"
OUTPUT_FILE="tools-admin-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
TOOLS_ADMIN_BACKEND_IMAGE_REGISTRY="${TOOLS_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_TOOLS_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
TOOLS_ADMIN_BACKEND_IMAGE_PROJECT="${TOOLS_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
TOOLS_ADMIN_BACKEND_IMAGE="${TOOLS_ADMIN_BACKEND_IMAGE:-tools-admin-backend}"
TOOLS_ADMIN_BACKEND_TAG="${TOOLS_ADMIN_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
TOOLS_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME="${TOOLS_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
TOOLS_ADMIN_BACKEND_SECRET_NAME="${TOOLS_ADMIN_BACKEND_SECRET_NAME:-tools-admin-backend-secret}"
TOOLS_ADMIN_BACKEND_CONFIGMAP_NAME="${TOOLS_ADMIN_BACKEND_CONFIGMAP_NAME:-tools-admin-backend-config}"
TOOLS_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${TOOLS_ADMIN_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-tools-admin-backend-s3}"
TOOLS_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME="${TOOLS_ADMIN_BACKEND_OBJECT_STORAGE_SECRET_NAME:-tools-admin-backend-s3}"
TOOLS_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${TOOLS_ADMIN_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-tools-admin-backend-elasticsearch}"
TOOLS_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME="${TOOLS_ADMIN_BACKEND_ELASTICSEARCH_SECRET_NAME:-tools-admin-backend-elasticsearch}"
TOOLS_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME="${TOOLS_ADMIN_BACKEND_POSTGRESQL_SECRET_NAME:-tools-admin-backend-postgresql-conn}"
TOOLS_ADMIN_BACKEND_REDIS_SECRET_NAME="${TOOLS_ADMIN_BACKEND_REDIS_SECRET_NAME:-tools-admin-backend-redis-conn}"
TOOLS_ADMIN_BACKEND_MONGODB_SECRET_NAME="${TOOLS_ADMIN_BACKEND_MONGODB_SECRET_NAME:-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-tools-admin-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
