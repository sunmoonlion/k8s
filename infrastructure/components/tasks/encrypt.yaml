---
# 「只加密有变化的输入」的基准是候选目录里上一次的密文。新工位的 .build/ 是空的，基准就得从已提交的 gitops 取：
# 否则同样的明文会被重新加密（新 nonce、新 mac、lastmodified 变），整仓的 sops 文件全都变（2026-10-06 待办 23b 实测）。
- name: Inspect the candidate and the committed ciphertext
  ansible.builtin.stat: {path: '{{ item }}', follow: false}
  loop: ['{{ build }}/{{ secret_item.file }}', '{{ components_root }}/{{ secret_item.file }}']
  register: ciphertexts
  no_log: true
- name: Seed the candidate from the committed ciphertext when this worktree has none yet
  ansible.builtin.copy:
    src: '{{ components_root }}/{{ secret_item.file }}'
    dest: '{{ build }}/{{ secret_item.file }}'
    remote_src: true
    owner: '{{ cluster_operator }}'
    mode: '0644'
  when:
    - not ciphertexts.results[0].stat.exists
    - ciphertexts.results[1].stat.exists and ciphertexts.results[1].stat.isreg | default(false) and not ciphertexts.results[1].stat.islnk | default(false)
  no_log: true
- name: Read prior ciphertext through the independent backup identity
  ansible.builtin.command:
    argv: ['{{ tools }}/sops', decrypt, --output-type, json, '{{ build }}/{{ secret_item.file }}']
  environment:
    SOPS_AGE_KEY_FILE: '{{ sops_backup_dir }}/age.agekey'
    HOME: /nonexistent
    XDG_CONFIG_HOME: /nonexistent
  register: prior
  changed_when: false
  failed_when: false
  no_log: true
- name: Inspect the candidate path
  ansible.builtin.stat: {path: '{{ build }}/{{ secret_item.file }}', follow: false}
  register: existing
- name: Refuse unreadable or redirected ciphertext
  ansible.builtin.assert:
    quiet: true
    that:
      - not existing.stat.islnk | default(false)
      - not existing.stat.exists or (existing.stat.isreg | default(false) and prior.rc == 0)
- name: Encrypt only changed input, never write plaintext into Git
  ansible.builtin.command:
    argv: ['{{ tools }}/sops', encrypt, --age, '{{ recipient }}', --encrypted-regex, '^(data|stringData)$', --input-type, json, --output-type, yaml, /dev/stdin]
    stdin: '{{ secret_item.manifest | to_json }}'
  register: ciphertext
  when: prior.rc != 0 or (prior.stdout | from_json) != secret_item.manifest
  changed_when: true
  no_log: true
- name: Save the encrypted candidate
  ansible.builtin.copy:
    dest: '{{ build }}/{{ secret_item.file }}'
    content: |
      {{ ciphertext.stdout }}
    owner: '{{ cluster_operator }}'
    mode: '0644'
  when: ciphertext is changed
  no_log: true
- name: Verify candidate using independent recovery identity
  ansible.builtin.command:
    argv: ['{{ tools }}/sops', decrypt, --output-type, json, '{{ build }}/{{ secret_item.file }}']
  environment:
    SOPS_AGE_KEY_FILE: '{{ sops_backup_dir }}/age.agekey'
    HOME: /nonexistent
    XDG_CONFIG_HOME: /nonexistent
  register: recovered
  changed_when: false
  failed_when: recovered.rc != 0 or (recovered.stdout | from_json) != secret_item.manifest
  no_log: true
