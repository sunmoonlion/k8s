---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: casdoor-ingress, namespace: platform-system}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: casdoor}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8000}]
