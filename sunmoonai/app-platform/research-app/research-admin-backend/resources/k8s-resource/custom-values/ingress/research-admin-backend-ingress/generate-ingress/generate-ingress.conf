TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="research-admin-backend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# TODO: 填写 Ingress 路由配置
SERVICE_NAME="${SERVICE_NAME:-research-admin-backend}"
