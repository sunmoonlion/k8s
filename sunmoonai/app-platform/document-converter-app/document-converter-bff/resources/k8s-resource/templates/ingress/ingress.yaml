# Document Converter BFF 路由配置 (Traefik IngressRoute)
# 使用统一域名访问
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# https://<节点IP>:30443/document-converter
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# https://www.sunmoonai.com/document-converter
#
# 注意：只需在 /etc/hosts 中添加一条记录即可访问所有服务
# 示例：101.126.151.0  www.sunmoonai.com
#
---
# Middleware: 根据配置选择使用 stripprefix 或 rate-limit
# 如果 USE_STRIP_PREFIX=true，使用路径前缀剥离中间件（在此文件中定义）
# 如果 USE_STRIP_PREFIX=false，使用限流中间件（需要单独部署，使用 document-converter-rate-limit）
# 注意：此部分由生成脚本根据 USE_STRIP_PREFIX 配置决定是否包含
#STRIP_PREFIX_MIDDLEWARE_START
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: document-converter-stripprefix
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: document-converter
    middleware-type: stripprefix
spec:
  stripPrefix:
    prefixes:
      - "/document-converter"
#STRIP_PREFIX_MIDDLEWARE_END
---
# IngressRoute: HTTP 路由
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: document-converter-ingress
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: document-converter
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问
    - match: Host(`${NODE_IP}`) && PathPrefix(`/document-converter`)
      kind: Rule
      services:
        - name: ${SERVICE_NAME}
          port: ${SERVICE_PORT}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END
    # 使用统一域名访问
    - match: Host(`${UNIFIED_HOST}`) && PathPrefix(`/document-converter`)
      kind: Rule
      services:
        - name: ${SERVICE_NAME}
          port: ${SERVICE_PORT}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: ingress-platform-dev/traefik-tls-secret

