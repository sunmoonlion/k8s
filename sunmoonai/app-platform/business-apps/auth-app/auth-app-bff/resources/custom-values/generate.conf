    "pvc:templates/pvc/auth-app-bff-pvc.yaml:auth-app-bff-pvc-generated.yaml:true"
    "app:templates/app/auth-app-bff.yaml:auth-app-bff-generated.yaml:true"
    "configmap:templates/configmap/auth-app-bff-config.yaml:auth-app-bff-config-generated.yaml:true"
