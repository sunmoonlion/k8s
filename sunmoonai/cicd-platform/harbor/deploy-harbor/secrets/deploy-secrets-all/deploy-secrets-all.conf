# ============================================================================
# Secrets All 部署配置
# ============================================================================
# Harbor 密钥管理部署控制标志

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# Secrets All 组件控制标志
# ============================================================================
# 控制是否部署各个密钥管理组件
harbor_secret_enabled="true"       # 是否部署 Harbor 认证密钥

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件（使用新迁移的Secret脚本）
harbor_secret_enabled="true"       # 是否部署 Harbor 认证密钥

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
harbor_secret_priority=1000        # Harbor 认证密钥优先级最高
