# ============================================================================
# LLMOps App SSR ConfigMap YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/configmap/llmops-app-front-config.yaml"
OUTPUT_FILE="llmops-app-front-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

LLMOPS_SSR_CONFIGMAP_NAME="${LLMOPS_SSR_CONFIGMAP_NAME:-llmops-app-front-config}"
PROJECT_NAME="${PROJECT_NAME:-LLMOps App SSR}"
SERVER_NAME="${SERVER_NAME:-llmops-front.sunmoonai.com}"
SERVER_HOST="${SERVER_HOST:-https://llmops-front.sunmoonai.com}"
SERVER_BOT="${SERVER_BOT:-Symona}"
BACKEND_CORS_ORIGINS="${BACKEND_CORS_ORIGINS:-[\"https://llmops-front.sunmoonai.com\",\"https://llmops-front.sunmoonai.com:443\"]}"
POSTGRES_SERVER="${POSTGRES_SERVER:-101.126.151.0}"
POSTGRES_PORT="${POSTGRES_PORT:-30444}"
POSTGRES_USER="${POSTGRES_USER:-sunmoonai_dev}"
POSTGRES_DB="${POSTGRES_DB:-mydb}"
NEO4J_SERVER="${NEO4J_SERVER:-101.126.151.0}"
NEO4J_PORT="${NEO4J_PORT:-7687}"
NEO4J_USERNAME="${NEO4J_USERNAME:-neo4j}"
NEO4J_AUTH="${NEO4J_AUTH:-neo4j}"
NEO4J_BOLT="${NEO4J_BOLT:-bolt}"
USERS_OPEN_REGISTRATION="${USERS_OPEN_REGISTRATION:-True}"
NEO4J_FORCE_TIMEZONE="${NEO4J_FORCE_TIMEZONE:-True}"
NEO4J_AUTO_INSTALL_LABELS="${NEO4J_AUTO_INSTALL_LABELS:-True}"
NEO4J_MAX_CONNECTION_POOL_SIZE="${NEO4J_MAX_CONNECTION_POOL_SIZE:-50}"
MULTI_MAX="${MULTI_MAX:-20}"
EMAIL_RESET_TOKEN_EXPIRE_HOURS="${EMAIL_RESET_TOKEN_EXPIRE_HOURS:-48}"
EMAIL_TEMPLATES_DIR="${EMAIL_TEMPLATES_DIR:-/app/app/email-templates/build}"
EMAIL_TEST_USER="${EMAIL_TEST_USER:-test@example.com}"
