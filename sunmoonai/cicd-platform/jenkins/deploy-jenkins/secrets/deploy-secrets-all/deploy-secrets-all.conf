# =============================================================================
# Jenkins Secrets 部署配置
# 文件名: deploy-secrets-all.conf
# 用途: 配置Jenkins所有Secret的部署参数
# =============================================================================

# =============================================================================
# 基础配置
# =============================================================================
PROJECT_ID="sunmoonai"
NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# =============================================================================
# Jenkins Secrets 部署配置
# =============================================================================
# 控制是否部署各个子级 Secret
harbor_registry_secret_enabled="true"      # 是否部署 Harbor 镜像拉取密钥
kaniko_registry_secret_enabled="true"      # 是否部署 Kaniko 镜像推送密钥
jenkins_secrets_enabled="true"             # 是否部署 Jenkins 认证密钥

# =============================================================================
# 部署优先级控制
# =============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
harbor_registry_secret_priority="800"      # Harbor 镜像拉取密钥优先级高
kaniko_registry_secret_priority="900"      # Kaniko 镜像推送密钥优先级（在 Harbor 之后，Jenkins 之前）
jenkins_secrets_priority="1000"            # Jenkins 认证密钥优先级最高

