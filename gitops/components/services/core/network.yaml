---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-clients
  namespace: platform-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {sunmoonai.com/postgresql-client: 'true'}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-client-egress
  namespace: platform-system
spec:
  podSelector:
    matchLabels: {sunmoonai.com/postgresql-client: 'true'}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
