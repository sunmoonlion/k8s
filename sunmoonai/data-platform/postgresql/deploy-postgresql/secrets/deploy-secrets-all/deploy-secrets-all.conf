# ============================================================================
# Secrets All 部署配置
# ============================================================================
# 密钥管理子子级部署控制标志

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# Secrets All 组件控制标志
# ============================================================================
# 控制是否部署各个密钥管理组件
postgresql_auth_secret_enabled="true"       # 是否部署 PostgreSQL 认证密钥
postgresql_tls_secret_enabled="true"        # 是否部署 PostgreSQL TLS 密钥
postgresql_secret_enabled="false"       # 是否部署 PostgreSQL 密钥
redis_secret_enabled="false"            # 是否部署 Redis 密钥

# ============================================================================
# Secrets All 特定配置
# ============================================================================
# PostgreSQL 认证密钥配置
POSTGRESQL_AUTH_SECRET_NAME="postgresql-4.sunmoonai.local-auth"
POSTGRESQL_ADMIN_PASSWORD="PostgreSQL@12345"

# PostgreSQL TLS 密钥配置
POSTGRESQL_TLS_SECRET_NAME="postgresql-4.sunmoonai.local-tls"
POSTGRESQL_TLS_CERT_PATH=""
POSTGRESQL_TLS_KEY_PATH=""

# PostgreSQL 密钥配置
POSTGRESQL_SECRET_NAME="postgresql-secrets"
POSTGRESQL_PASSWORD_KEY="postgresql-password"

# Redis 密钥配置
REDIS_SECRET_NAME="redis-secrets"
REDIS_PASSWORD_KEY="redis-password"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件（使用新迁移的Secret脚本）
postgresql_auth_secret_enabled="true"       # 是否部署 PostgreSQL 认证密钥
harbor_registry_secret_enabled="true"      # 是否部署 Harbor 镜像拉取密钥
# postgresql_mydb_secret_enabled="true"       # ❌ 已删除：使用服务级别的 Secret
postgresql_authservice_db_secret_enabled="true"  # 是否部署 Auth Service 数据库连接密钥
postgresql_llmopsservice_db_secret_enabled="true"  # 是否部署 LLMOps Service 数据库连接密钥

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
postgresql_auth_secret_priority=1000        # PostgreSQL 认证密钥优先级最高（最先部署）
harbor_registry_secret_priority=800        # Harbor 镜像拉取密钥优先级高
# postgresql_mydb_secret_priority=600        # ❌ 已删除：使用服务级别的 Secret
postgresql_authservice_db_secret_priority=500  # Auth Service 数据库连接密钥优先级中等
postgresql_llmopsservice_db_secret_priority=500  # LLMOps Service 数据库连接密钥优先级中等
