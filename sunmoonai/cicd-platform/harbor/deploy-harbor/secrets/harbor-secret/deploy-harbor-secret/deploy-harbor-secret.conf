# =============================================================================
# Harbor Secret 部署配置
# 文件） deploy-harbor-secret.conf
# 用） 配置Harbor Opaque Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="harbor-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-cicd-platform-dev}"

# Secret 类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（Opaque类型使用动态键名）
# =============================================================================

# Harbor管理员用户名
HARBOR_ADMIN_USERNAME="admin"

# Harbor 管理员密码
HARBOR_ADMIN_PASSWORD="Ha!r1359admin"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该 Secret 的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

# 手动指定重启的组件列表（可选，用逗号分隔）
# RESTART_COMPONENTS_LIST="harbor-core,harbor-jobservice,harbor-portal"
