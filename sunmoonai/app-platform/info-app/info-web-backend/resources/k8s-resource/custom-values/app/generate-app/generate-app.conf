# ============================================================================
# info-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/info-web-backend.yaml"
OUTPUT_FILE="info-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
INFO_WEB_BACKEND_IMAGE_REGISTRY="${INFO_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_INFO_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INFO_WEB_BACKEND_IMAGE_PROJECT="${INFO_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
INFO_WEB_BACKEND_IMAGE="${INFO_WEB_BACKEND_IMAGE:-info-web-backend}"
INFO_WEB_BACKEND_TAG="${INFO_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
INFO_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${INFO_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
INFO_WEB_BACKEND_SECRET_NAME="${INFO_WEB_BACKEND_SECRET_NAME:-info-web-backend-secret}"
INFO_WEB_BACKEND_CONFIGMAP_NAME="${INFO_WEB_BACKEND_CONFIGMAP_NAME:-info-web-backend-config}"
INFO_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${INFO_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-info-web-backend-s3}"
INFO_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME="${INFO_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME:-info-web-backend-s3}"
INFO_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${INFO_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-info-web-backend-elasticsearch}"
INFO_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME="${INFO_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME:-info-web-backend-elasticsearch}"
INFO_WEB_BACKEND_POSTGRESQL_SECRET_NAME="${INFO_WEB_BACKEND_POSTGRESQL_SECRET_NAME:-info-web-backend-postgresql-conn}"
INFO_WEB_BACKEND_REDIS_SECRET_NAME="${INFO_WEB_BACKEND_REDIS_SECRET_NAME:-info-web-backend-redis-conn}"
INFO_WEB_BACKEND_MONGODB_SECRET_NAME="${INFO_WEB_BACKEND_MONGODB_SECRET_NAME:-info-web-backend-mongodb-conn}"

# PVC 配置
PVC_NAME="${PVC_NAME:-info-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
