# RedisInsight 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
REDISINSIGHT_PROJECT_ID="sunmoonai"
REDISINSIGHT_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
REDISINSIGHT_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
REDISINSIGHT_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
REDISINSIGHT_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"  # 从 Harbor 拉镜像的 Secret 名称

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# REDISINSIGHT_FORCE_OFFLINE="true"   # 离线模式：强制离线部署

# 访问与端口配置
REDISINSIGHT_TLS_ENABLED="false"                           # RedisInsight通常不需要TLS
REDISINSIGHT_UNIFIED_HOST="www.sunmoonai.com"               # 统一域名（用于路径前缀路由）
REDISINSIGHT_NODE_IP="115.190.153.150"                     # 节点公网 IP 地址（用于 IP 访问方式）

# 是否在部署 RedisInsight 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 RedisInsight 可能会形成自依赖循环（部署 RedisInsight 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：RedisInsight 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
REDISINSIGHT_FORCE_OFFLINE="true"

# 镜像版本配置（来源：resources/redisinsight/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，RedisInsight Chart会自动使用最新版本的镜像
# redis/redisinsight:2.70
REDISINSIGHT_IMAGE_VERSION="2.70"
# bitnami/os-shell:12-debian-12-r51
REDISINSIGHT_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等

