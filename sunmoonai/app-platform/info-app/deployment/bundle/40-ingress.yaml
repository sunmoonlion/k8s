apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-admin-route
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: info
    sunmoonai.com/managed-by: app-platform-v2
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`info-admin.sunmoonai.com`) && PathPrefix(`/api`)
    services:
    - name: info-backend
      port: 8000
    priority: 100
  - kind: Rule
    match: Host(`info-admin.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: info-admin-frontend
      port: 3000
    priority: 10
  tls:
    secretName: info-tls
---
