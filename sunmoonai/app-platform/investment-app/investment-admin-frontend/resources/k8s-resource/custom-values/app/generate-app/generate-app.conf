# ============================================================================
# investment-admin-frontend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/investment-admin-frontend.yaml"
OUTPUT_FILE="investment-admin-frontend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
INVESTMENT_ADMIN_FRONTEND_IMAGE_REGISTRY="${INVESTMENT_ADMIN_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_INVESTMENT_ADMIN_FRONTEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INVESTMENT_ADMIN_FRONTEND_IMAGE_PROJECT="${INVESTMENT_ADMIN_FRONTEND_IMAGE_PROJECT:-app-images}"
INVESTMENT_ADMIN_FRONTEND_IMAGE="${INVESTMENT_ADMIN_FRONTEND_IMAGE:-investment-admin-frontend}"
INVESTMENT_ADMIN_FRONTEND_TAG="${INVESTMENT_ADMIN_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
INVESTMENT_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
INVESTMENT_ADMIN_FRONTEND_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_SECRET_NAME:-investment-admin-frontend-secret}"
INVESTMENT_ADMIN_FRONTEND_CONFIGMAP_NAME="${INVESTMENT_ADMIN_FRONTEND_CONFIGMAP_NAME:-investment-admin-frontend-config}"
INVESTMENT_ADMIN_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME="${INVESTMENT_ADMIN_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_OBJECT_STORAGE_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_OBJECT_STORAGE_SECRET_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME="${INVESTMENT_ADMIN_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_ELASTICSEARCH_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_ELASTICSEARCH_SECRET_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_POSTGRESQL_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_POSTGRESQL_SECRET_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_REDIS_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_REDIS_SECRET_NAME:-}"
INVESTMENT_ADMIN_FRONTEND_MONGODB_SECRET_NAME="${INVESTMENT_ADMIN_FRONTEND_MONGODB_SECRET_NAME:-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-investment-admin-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
