# ============================================================================
# Auth App BFF YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/app/auth-app-backend.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="auth-app-backend-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="app"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-auth-app-backend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# App 数据内容（用于生成 YAML）
# 注意：这些数据会被用于生成 App YAML 文件
# ============================================================================
# 镜像配置（与源码仓库 mybuild/build.conf 保持一致）
AUTH_APP_BFF_IMAGE_REGISTRY="${AUTH_APP_BFF_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
AUTH_APP_BFF_IMAGE_PROJECT="${AUTH_APP_BFF_IMAGE_PROJECT:-k8s-images}"
AUTH_APP_BFF_IMAGE="${AUTH_APP_BFF_IMAGE:-auth-app-backend}"
AUTH_APP_BFF_TAG="${AUTH_APP_BFF_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
AUTH_APP_BFF_IMAGE_PULL_SECRET_NAME="${AUTH_APP_BFF_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称（用于生成 App YAML）
AUTH_APP_BFF_SECRET_NAME="${AUTH_APP_BFF_SECRET_NAME:-auth-app-backend-secret}"
AUTH_APP_BFF_CONFIGMAP_NAME="${AUTH_APP_BFF_CONFIGMAP_NAME:-auth-app-backend-config}"

# PVC 配置（用于生成 App YAML 中的 volumeMounts）
# 注意：PVC 的存储配置（STORAGE_CLASS、ACCESS_MODE、STORAGE_SIZE）在 generate-auth-app-backend-pvc.conf 中
PVC_NAME="${PVC_NAME:-auth-app-backend-pvc}"          # PVC 名称（引用 PVC 组件）
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"         # 容器内挂载路径（用于 App YAML）
PVC_SUB_PATH="${PVC_SUB_PATH:-}"                       # 子路径（可选，用于多 Pod 共享同一 PVC，用于 App YAML）

