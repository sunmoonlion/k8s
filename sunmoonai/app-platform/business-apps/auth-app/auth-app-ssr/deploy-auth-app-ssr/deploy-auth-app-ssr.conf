# ============================================================================
# Auth App SSR 部署配置
# 文件名: deploy-auth-app-ssr.conf
# 用途: 配置 Auth App SSR 的部署参数
# ============================================================================

# 基础配置
AUTH_APP_SSR_PROJECT_ID="sunmoonai"
AUTH_APP_SSR_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# 镜像配置（与源码仓库 mybuild/build.conf 保持一致）
AUTH_APP_SSR_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
AUTH_APP_SSR_IMAGE_PROJECT="k8s-images"
AUTH_APP_SSR_IMAGE="auth-app-ssr"
AUTH_APP_SSR_TAG="1.0.0"
IMAGE_PULL_POLICY="Always"
AUTH_APP_SSR_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问与域名配置（如需 Ingress，可在后续脚本扩展）
AUTH_APP_SSR_TLS_ENABLED="false"
AUTH_APP_SSR_UNIFIED_HOST="auth-ssr.sunmoonai.com"
AUTH_APP_SSR_NODE_IP="101.126.151.0"
AUTH_APP_SSR_EXTERNAL_PORT="30443"

# Secret / ConfigMap
AUTH_APP_SSR_SECRET_NAME="auth-app-ssr-secret"
AUTH_APP_SSR_CONFIGMAP_NAME="auth-app-ssr-config"

# 组件开关
secrets_enabled="true"      # Secrets 和 ConfigMaps
middleware_enabled="false"  # Middleware（stripprefix 已集成到 ingress.yaml 中，保留用于未来扩展）
ingress_enabled="true"      # Ingress（HTTP 路由）

# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
secrets_priority=2000       # Secrets 和 ConfigMaps 优先级（最高）
middleware_priority=1000    # Middleware 优先级
ingress_priority=100        # Ingress 优先级（最低）

# 推送后清理远程 tar 包开关（预留，与模板保持一致）
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

# ============================================================================
# PVC 配置（Persistent Volume Claim）
# ============================================================================
# 如果应用不需要持久化存储，可以不配置或设置为空
PVC_ENABLED="false"                    # 是否启用 PVC
PVC_NAME="auth-app-ssr-pvc"            # PVC 名称
PVC_MOUNT_PATH="/app/data"              # 容器内挂载路径
PVC_SUB_PATH=""                        # 子路径（可选，用于多 Pod 共享同一 PVC）
PVC_STORAGE_CLASS="nfs-1"              # StorageClass（使用 nfs-1 存储类）
PVC_ACCESS_MODE="ReadWriteOnce"        # 访问模式：ReadWriteOnce|ReadWriteMany|ReadOnlyMany
PVC_STORAGE_SIZE="10Gi"                # 存储大小
