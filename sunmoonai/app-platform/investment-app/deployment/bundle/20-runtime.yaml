apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-backend-api
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: investment-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: investment
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      sunmoonai.com/app: investment
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: investment
        sunmoonai.com/app: investment
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/internal-provider: 'true'
      annotations:
        sunmoonai.com/release-id: kind-wb-20260926-r14
        sunmoonai.com/config-sha256: 5acbf7705b7b8bd205f632fcce91987ad35fb90e7946064b99a3abdb53a5d62a
        sunmoonai.com/source-commit: c89d8fe7491952d0dffd32ecebd4e5adc4042ab3
    spec:
      serviceAccountName: investment-backend-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            sunmoonai.com/app: investment
            app.kubernetes.io/component: backend-api
      containers:
      - name: api
        image: harbor.sunmoonai.com:30443/app-images/investment-backend@sha256:4f639f78faea51306ddb2f495b8921763906a2ceb1cbdeb453b43bc2a2fe8710
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        args:
        - app.bootstrap.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: investment-backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-runtime
              key: API_DATABASE_URL
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: investment-backend-runtime
              key: API_CELERY_BROKER_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: investment-backend-redis-conn
              key: REDIS_PASSWORD
        - name: ADMIN_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: ADMIN_CLIENT_ID
        - name: ADMIN_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: ADMIN_CLIENT_SECRET
        - name: WEB_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: WEB_CLIENT_ID
        - name: WEB_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: investment-browser-identity
              key: WEB_CLIENT_SECRET
        - name: WORKBENCH_CREDENTIAL_KEY
          valueFrom:
            secretKeyRef:
              name: investment-workbench
              key: WORKBENCH_CREDENTIAL_KEY
              optional: true
        - name: WORKBENCH_PROVISIONER_TOKEN
          valueFrom:
            secretKeyRef:
              name: investment-workbench
              key: WORKBENCH_PROVISIONER_TOKEN
              optional: true
        - name: WORKBENCH_RELAY_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: investment-workbench
              key: WORKBENCH_RELAY_ADMIN_TOKEN
              optional: true
        - name: WORKBENCH_TOKEN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: investment-workbench
              key: WORKBENCH_TOKEN_SIGNING_KEY
              optional: true
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: investment-backend
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: investment-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: investment
    sunmoonai.com/managed-by: app-platform-v2
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      sunmoonai.com/app: investment
      app.kubernetes.io/component: backend-api
