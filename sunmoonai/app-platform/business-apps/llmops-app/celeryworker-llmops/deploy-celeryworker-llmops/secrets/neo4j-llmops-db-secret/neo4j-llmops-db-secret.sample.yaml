apiVersion: v1
kind: Secret
metadata:
  name: neo4j-llmops-db-secret
  namespace: app-platform-dev
type: Opaque
stringData:
  # Neo4j 连接字段
  NEO4J_SERVER: "neo4j-service.data-platform"
  NEO4J_PORT: "7687"
  NEO4J_USERNAME: "neo4j"
  # NEO4J_PASSWORD: "CHANGE_ME"
  NEO4J_BOLT: "bolt"
  NEO4J_AUTH: "neo4j"
  NEO4J_BOLT_URL: "bolt://neo4j:CHANGE_ME@neo4j-service.data-platform:7687"
  NEO4J_FORCE_TIMEZONE: "True"
  NEO4J_AUTO_INSTALL_LABELS: "True"
  NEO4J_MAX_CONNECTION_POOL_SIZE: "50"
---
# LLMOps Neo4j 图数据库连接信息 Secret
# 用途：为 celeryworker-llmops 提供独立的 Neo4j 图数据库连接配置
# 注意：与 llmops-service-secret（应用 Secret）区分开
# 包含 Neo4j 连接所需的所有字段
# 仅归档/占位用途：实际由部署脚本创建与更新；本文件用于结构对齐
