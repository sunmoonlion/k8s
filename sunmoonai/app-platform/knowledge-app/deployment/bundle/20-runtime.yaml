          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_ENDPOINT
        - name: S3_FORCE_PATH_STYLE
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_FORCE_PATH_STYLE
        - name: S3_REGION
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: S3_REGION
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
