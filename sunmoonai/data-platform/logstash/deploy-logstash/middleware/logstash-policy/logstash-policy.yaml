apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: logstash-ratelimit
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: logstash-ratelimit
    project: sunmoonai
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: logstash-headers
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: logstash-headers
    project: sunmoonai
spec:
  headers:
    customRequestHeaders:
      X-Logstash-Version: "9.1.2"
    customResponseHeaders:
      X-Logstash-Status: "active"

