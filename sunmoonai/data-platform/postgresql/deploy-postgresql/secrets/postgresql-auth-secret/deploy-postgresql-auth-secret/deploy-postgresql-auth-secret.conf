# =============================================================================
# PostgreSQL Auth Secret 部署配置
# 文件名: deploy-postgresql-auth-secret.conf
# 用途: 配置PostgreSQL认证Secret的生成和部署参数
# 说明: PostgreSQL Chart要求Secret键名使用小写字母
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="postgresql-auth-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-data-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（PostgreSQL Chart要求键名使用小写字母）
# =============================================================================

# 管理员密码键（PostgreSQL Chart需要，键名需与deploy-postgresql.conf中的POSTGRESQL_AUTH_SECRET_ADMIN_PASSWORD_KEY一致）
admin_password="zym123"

# 应用用户密码键（PostgreSQL Chart需要，键名需与deploy-postgresql.conf中的POSTGRESQL_AUTH_SECRET_DEV_PASSWORD_KEY一致）
dev_password="zym123"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
