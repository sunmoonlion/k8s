# MongoDB 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
MONGODB_PROJECT_ID="sunmoonai"
MONGODB_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
MONGODB_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
MONGODB_IMAGE_PROJECT="k8s-images"                     # 镜像项目名

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# MONGODB_FORCE_OFFLINE="true"        # 离线模式：强制离线部署

# 访问与端口配置
MONGODB_EXTERNAL_HOST="llmops.sunmoonai.com"  # MongoDB访问域名（使用微服务统一域名，通过端口30445区分）
# MONGODB_EXTERNAL_PORT 将从 Traefik Service 中动态获取（通过 get_mongodb_external_port 函数）
# 如果未设置，脚本会自动从 Traefik Service 的 NodePort 中获取
# MONGODB_EXTERNAL_PORT="${MONGODB_EXTERNAL_PORT:-$(get_mongodb_external_port)}"
MONGODB_TLS_ENABLED="false"                        # MongoDB通常不需要TLS

# MongoDB Secret 配置（由统一密管创建与维护）
# Bitnami MongoDB 期望 existingSecret 中存在以下键：
#  - mongodb-root-password（root 用户密码）
#  - mongodb-passwords（与 auth.usernames 顺序一致的密码列表，逗号分隔）
MONGODB_AUTH_SECRET_NAME="mongodb-auth-secret"

# 镜像拉取凭据（由基础设施或统一密管创建；Chart 通过 global.imagePullSecrets 引用）
MONGODB_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 是否在部署 MongoDB 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 MongoDB 可能会形成自依赖循环（部署 MongoDB 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：MongoDB 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
MONGODB_FORCE_OFFLINE="false"

# 镜像版本配置（来源：resources/mongodb/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，MongoDB Chart会自动使用最新版本的镜像
# bitnami/mongodb:8.0.13-debian-12-r0
MONGODB_IMAGE_VERSION="8.0.13-debian-12-r0"
# bitnami/mongodb-exporter:0.47.0-debian-12-r1
MONGODB_METRICS_IMAGE_VERSION="0.47.0-debian-12-r1"
# bitnami/os-shell:12-debian-12-r51
MONGODB_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"         # 密钥由统一密管管理（默认不在组件内部署）

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等
secrets_priority=10           # 密钥管理优先级最低（最后部署）

