# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: {file: app-platform/common/frontend/prepare.yaml, vars: {application_name: investment, frontend: web}}
defaults: {enabled: '{{ investment_deployment.enabled }}', timeout: 8m}
stages:
- name: investment-web
  dependsOn: [investment-runtime, traefik]
  resources: [workload.yaml]
