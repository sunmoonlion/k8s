apiVersion: v1
kind: Secret
metadata:
  name: postgresql-auth-secret
  namespace: data-platform-dev
type: Opaque
stringData:
  # 管理员密码键（与 Chart 的 auth.secretKeys.adminPasswordKey 对齐）
  admin_password: "CHANGE_ME_STRONG_ADMIN_PASSWORD"
  # 应用用户密码键（与 Chart 的 auth.secretKeys.userPasswordKey 对齐）
  dev_password: "CHANGE_ME_STRONG_USER_PASSWORD"
---
# 仅归档/占位用途：实际由统一密管创建与更新；本文件用于结构对齐

