# Mongo Express 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# 基础
MONGO_EXPRESS_PROJECT_ID="sunmoonai"
MONGO_EXPRESS_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 镜像仓库配置
# ============================================================================
MONGO_EXPRESS_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
MONGO_EXPRESS_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
MONGO_EXPRESS_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"  # Harbor 镜像拉取 Secret 名称（必须与 Harbor Registry Secret 部署的 Secret 名称一致）

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# MONGO_EXPRESS_FORCE_OFFLINE="true" # 离线模式：强制离线部署

# 访问与端口配置
MONGO_EXPRESS_TLS_ENABLED="false"                           # Mongo Express通常不需要TLS
MONGO_EXPRESS_UNIFIED_HOST="www.sunmoonai.com"              # 统一域名（用于路径前缀路由）
MONGO_EXPRESS_NODE_IP="115.190.153.150"                     # 节点公网 IP 地址（用于 IP 访问方式）

# ============================================================================
# MongoDB 连接配置
# ============================================================================
# MongoDB 部署在 C1 集群，通过 Traefik TCP 路由暴露
# 连接流程：Mongo Express (C2) → 101.126.151.0:30445 (Traefik) → MongoDB (C1)
MONGODB_EXTERNAL_HOST="101.126.151.0"                # MongoDB 外部访问地址（C1 集群 Traefik 入口节点 IP）
MONGODB_EXTERNAL_PORT="30445"                        # MongoDB 外部访问端口（Traefik 暴露的 TCP 端口）

# Mongo Express Secret 配置
MONGO_EXPRESS_AUTH_SECRET_NAME="mongo-express-secrets"                    # Mongo Express 认证 Secret 名称

# Mongo Express Secret 键名配置（用于 dev-values.yaml 模板替换）
# 注意：这些键名必须与 deploy-mongo-express-secrets.conf 中的配置保持一致
#
# 用途说明：
# 1. MONGO_EXPRESS_AUTH_SECRET_PASSWORD_KEY - MongoDB 管理员密码键名（当前未使用）
#    用途：管理员模式（mongodbEnableAdmin=true）时，用于连接 MongoDB 的管理员账户密码
#    对应 Chart 字段：existingSecretKeyMongodbAdminPassword
#    注意：当前使用非管理员模式，此配置已注释，如需使用管理员模式请取消注释
#
# 2. MONGO_EXPRESS_MONGODB_AUTH_PASSWORD_KEY - MongoDB 认证密码键名（当前使用）
#    用途：非管理员模式（mongodbEnableAdmin=false）时，用于连接 MongoDB 的数据库用户密码
#    对应 Chart 字段：existingSecretKeyMongodbAuthPassword
#
# 3. MONGO_EXPRESS_SITE_COOKIE_SECRET_KEY - Cookie 签名密钥键名
#    用途：用于 cookie-parser 中间件签名 Cookie，确保 Cookie 安全
#    对应 Chart 字段：existingSecretKeySiteCookieSecret
#
# 4. MONGO_EXPRESS_SITE_SESSION_SECRET_KEY - Session 签名密钥键名
#    用途：用于 express-session 中间件签名 Session ID，确保 Session 安全
#    对应 Chart 字段：existingSecretKeySiteSessionSecret
#
# 5. MONGO_EXPRESS_BASIC_AUTH_PASSWORD_KEY - Basic Auth 密码键名
#    用途：Mongo Express Web 界面的登录密码（Basic Authentication）
#    对应 Chart 字段：existingSecretKeyBasicAuthPassword
#
# MONGO_EXPRESS_AUTH_SECRET_PASSWORD_KEY="mongo-express-password"  # 管理员模式使用，当前已注释
MONGO_EXPRESS_MONGODB_AUTH_PASSWORD_KEY="mongodb-auth-password"    # 非管理员模式使用（当前使用）
MONGO_EXPRESS_SITE_COOKIE_SECRET_KEY="site-cookie-secret"
MONGO_EXPRESS_SITE_SESSION_SECRET_KEY="site-session-secret"
MONGO_EXPRESS_BASIC_AUTH_PASSWORD_KEY="basic-auth-password"

# 是否在部署 Mongo Express 时强制离线
# 说明：若节点在 step02 已将镜像源优先指向 Harbor 或其 Proxy Cache，
# 则在线部署 Mongo Express 可能会形成自依赖循环（部署 Mongo Express 还需从 Harbor 拉取）。
# 正确做法：
#  - 设为 true：Mongo Express 使用离线物料部署，避免循环风险；稳定且可在弱网/离线环境成功。
#    注意：如果设为 true，建议将 DEPLOYMENT_MODE 设置为 "offline" 以避免配置冲突。
#  - 设为 false：不强制离线（在线模式推荐）。此时请确保：
#      1) step02 的镜像源策略采用 fallback（上游优先，Harbor 为回退）或暂时不指向 Harbor；
#      2) 网络可达上游仓库，避免被限流影响部署。
#      3) 此时可以将 DEPLOYMENT_MODE 设置为 "online"
MONGO_EXPRESS_FORCE_OFFLINE="false"

# 镜像版本配置（来源：resources/mongo-express/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，Mongo Express Chart会自动使用最新版本的镜像
# mongo-express:1.0.2
MONGO_EXPRESS_IMAGE_VERSION="1.0.2"
# bitnami/os-shell:12-debian-12-r51
MONGO_EXPRESS_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置
secrets_enabled="true"          # 是否部署密钥管理

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
middleware_priority=1000       # 中间件优先级最高（最先部署）
ingress_priority=100          # Ingress 优先级中等
secrets_priority=10           # 密钥管理优先级最低（最后部署）

