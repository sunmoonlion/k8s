# shellcheck shell=bash disable=SC2034
# Cloud path 未经实机验证. Copy to an owner-managed file and fill the host fields.
# Same module as local; never use a Kubernetes master as an implicit registry host.
REGISTRY_VERSION=2.13.2
REGISTRY_ADDRESS=harbor.sunmoonai.com:30443
REGISTRY_TRANSPORT=ssh
REGISTRY_SSH_HOST=''
REGISTRY_MACHINE_ID=''
REGISTRY_PRIVATE_IP=''
REGISTRY_CLIENT_ADDRESS=''
REGISTRY_CREDENTIALS_FILE="${REGISTRY_CREDENTIALS_FILE:-${HOME}/private/registry-platform/cloud/consumer.json}"
REGISTRY_DATA_ROOT=/data/harbor
REGISTRY_INSTALL_ROOT=/opt/sunmoon/registry/harbor-2.13.2
# Public CA input on the management machine, not a private signing key.
REGISTRY_CA_FILE="${HOME}/private/registry-platform/cloud/ca.crt"
REGISTRY_CA_SHA256=''
# Explicit management-host input paths; only public CA/leaf material and service
# leaf keys may be distributed. Never distribute the root CA signing key.
REGISTRY_TLS_CERT_FILE=''
REGISTRY_TLS_KEY_FILE=''
REGISTRY_TLS_BUNDLE_FILE=''
REGISTRY_BIND_ADDRESS=''
REGISTRY_HTTPS_PORT=30443
REGISTRY_LOCAL_SNI_PROXY=false
