# ============================================================================
# App Platform 平台基础配置
# ============================================================================
APP_PLATFORM_PROJECT_ID="sunmoonai"
APP_PLATFORM_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志（根据需要启用/禁用）
# ============================================================================
# 文档转换服务（基于 LibreOffice，轻量级）
C2_document_converter_enabled="true"

# ONLYOFFICE Docs（完整 Office 套件，需要数据库）
C2_onlyoffice_docs_enabled="false"

# LLMOps Service
C2_llmops_service_enabled="false"

# Celery Worker
C2_celeryworker_enabled="false"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
# 文档转换服务（轻量级，无依赖，可以优先部署）
C2_document_converter_priority=900

# ONLYOFFICE Docs（需要 PostgreSQL、Redis、RabbitMQ，依赖较多）
C2_onlyoffice_docs_priority=800

# LLMOps Service（可能需要数据库等依赖）
C2_llmops_service_priority=700

# Celery Worker（通常依赖消息队列）
C2_celeryworker_priority=600

