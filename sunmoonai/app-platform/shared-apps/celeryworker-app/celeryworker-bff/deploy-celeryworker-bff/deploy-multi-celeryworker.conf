# ============================================================================
# Celery Worker 多后端部署配置
# 文件名: deploy-multi-celeryworker.conf
# 用途: 配置处理多个后端任务的 Celery Worker
# ============================================================================

# ============================================================================
# 基础配置
# ============================================================================
CELERY_WORKER_PROJECT_ID="sunmoonai"
CELERY_WORKER_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# ============================================================================
# 镜像配置
# ============================================================================
# Harbor 镜像仓库配置（deploy 命令使用 Harbor 镜像）
CELERY_WORKER_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址
CELERY_WORKER_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
CELERY_WORKER_IMAGE_PULL_SECRET_NAME="harbor-registry-secret" # Harbor镜像拉取Secret名称

# 镜像名称和标签（用于部署时指定镜像）
# 镜像名称和标签应该与 build/build.conf 中的配置保持一致
CELERY_WORKER_IMAGE="${CELERY_WORKER_IMAGE:-celeryworker}"
CELERY_WORKER_TAG="${CELERY_WORKER_TAG:-1.0.0}"

# ============================================================================
# 多后端配置（统一格式，易于扩展）
# ============================================================================
# 说明：每个后端使用统一的配置格式：BACKEND_<name>_<property>
# 例如：BACKEND_llmops_IMAGE, BACKEND_incubator_IMAGE
# 这样可以方便地添加新后端，只需添加对应的配置项即可

# 默认镜像仓库配置（所有后端共享，除非单独指定）
DEFAULT_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
DEFAULT_BACKEND_IMAGE_PROJECT="k8s-images"
DEFAULT_CODE_EXTRACT_SOURCE_DIR="/app/app"
DEFAULT_CODE_EXTRACT_DIRS="worker core services db models schemas crud"
DEFAULT_CODE_EXTRACT_FILES="__init__.py celeryworker_pre_start.py"

# ============================================================================
# 后端1: llmops-service 配置
# ============================================================================
BACKEND_llmops_IMAGE="llmops-service"
BACKEND_llmops_TAG="1.0.0"
BACKEND_llmops_IMAGE_REGISTRY="${DEFAULT_BACKEND_IMAGE_REGISTRY}"
BACKEND_llmops_IMAGE_PROJECT="${DEFAULT_BACKEND_IMAGE_PROJECT}"
BACKEND_llmops_CODE_EXTRACT_SOURCE_DIR="${DEFAULT_CODE_EXTRACT_SOURCE_DIR}"
BACKEND_llmops_CODE_EXTRACT_DIRS="${DEFAULT_CODE_EXTRACT_DIRS}"
BACKEND_llmops_CODE_EXTRACT_FILES="${DEFAULT_CODE_EXTRACT_FILES}"

# ============================================================================
# 后端2: incubator-service 配置
# ============================================================================
BACKEND_incubator_IMAGE="incubator-service"
BACKEND_incubator_TAG="1.0.0"
BACKEND_incubator_IMAGE_REGISTRY="${DEFAULT_BACKEND_IMAGE_REGISTRY}"
BACKEND_incubator_IMAGE_PROJECT="${DEFAULT_BACKEND_IMAGE_PROJECT}"
BACKEND_incubator_CODE_EXTRACT_SOURCE_DIR="${DEFAULT_CODE_EXTRACT_SOURCE_DIR}"
BACKEND_incubator_CODE_EXTRACT_DIRS="worker core services db models"
BACKEND_incubator_CODE_EXTRACT_FILES="__init__.py"

# ============================================================================
# 后端3: scrapy-service 配置（示例，取消注释以启用）
# ============================================================================
# BACKEND_scrapy_IMAGE="scrapy-service"
# BACKEND_scrapy_TAG="1.0.0"
# BACKEND_scrapy_IMAGE_REGISTRY="${DEFAULT_BACKEND_IMAGE_REGISTRY}"
# BACKEND_scrapy_IMAGE_PROJECT="${DEFAULT_BACKEND_IMAGE_PROJECT}"
# BACKEND_scrapy_CODE_EXTRACT_SOURCE_DIR="${DEFAULT_CODE_EXTRACT_SOURCE_DIR}"
# BACKEND_scrapy_CODE_EXTRACT_DIRS="worker core services db models"
# BACKEND_scrapy_CODE_EXTRACT_FILES="__init__.py"

# ============================================================================
# Celery Worker 配置（方案A：单个 RabbitMQ + 多个队列，单个 Redis + 结果键前缀）
# ============================================================================
# RabbitMQ 消息代理（Broker）- 方案A：单个实例 + 多个队列
# 说明：所有后端共享同一个 RabbitMQ 实例，使用不同的队列名称实现隔离
# 队列隔离机制：RabbitMQ 的队列是完全独立的，不同队列的消息互不影响
CELERY_BROKER_URL="amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//"

# 监听多个队列（用逗号分隔）
# 注意：
#   1. 队列名称需要与后端服务发送任务时使用的队列名称一致
#   2. 队列名称通常与后端名称对应，例如：llmops -> llmops-queue
#   3. 队列无需预先创建：RabbitMQ 会在 Worker 启动时自动创建这些队列
#   4. 如果队列已存在，Worker 会直接使用现有队列
CELERY_QUEUES="llmops-queue,incubator-queue"

# Redis 结果后端（Result Backend）- 方案A：单个实例 + 结果键前缀
# 说明：所有后端共享同一个 Redis 实例（数据库 0）
# Celery 通过应用名称自动区分结果键，不同后端的结果键不会冲突：
#   - llmops-service: celery-task-meta-llmops-{task-id}
#   - incubator-service: celery-task-meta-incubator-{task-id}
# 结果键隔离机制：Celery 使用应用名称作为结果键前缀，天然隔离
CELERY_RESULT_BACKEND="redis://redis-service.data-platform:6379/10"

CELERY_CONCURRENCY="2"  # 多后端建议增加并发数

# ============================================================================
# 镜像构建说明
# ============================================================================
# 注意: 镜像构建已分离到源代码项目的 build/ 目录
# 构建镜像请使用: cd ../build && ./build-image.sh build-push
# 部署脚本仅负责部署，不再包含构建功能
