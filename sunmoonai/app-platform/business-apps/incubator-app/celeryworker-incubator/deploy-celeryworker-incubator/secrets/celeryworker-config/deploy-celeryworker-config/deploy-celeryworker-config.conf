# =============================================================================
# Celery Worker ConfigMap 部署配置
# 文件名: deploy-celeryworker-config.conf
# 用途: 配置 Celery Worker ConfigMap 的部署参数
# =============================================================================

# =============================================================================
# ConfigMap 基本信息
# =============================================================================

# ConfigMap 名称
CONFIGMAP_NAME="celeryworker-config"

# ConfigMap 命名空间（将在部署脚本中从参数获取，这里作为默认值）
CONFIGMAP_NAMESPACE="${CONFIGMAP_NAMESPACE:-app-platform-dev}"

# =============================================================================
# Celery Worker 配置
# =============================================================================

# RabbitMQ 消息代理（Broker）
CELERY_BROKER_URL="${CELERY_BROKER_URL:-amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//}"

# Redis 结果后端（Result Backend）
CELERY_RESULT_BACKEND="${CELERY_RESULT_BACKEND:-redis://redis-service.data-platform:6379/0}"

# 监听多个队列（用逗号分隔）
# 注意：队列名称需要与后端服务发送任务时使用的队列名称一致
CELERY_QUEUES="${CELERY_QUEUES:-llmops-queue,incubator-queue}"

# Celery Worker 并发数（多后端建议增加并发数，根据实际负载调整）
CELERY_CONCURRENCY="${CELERY_CONCURRENCY:-2}"

# Redis 连接（如果需要，用于其他用途）
REDIS_URL="${REDIS_URL:-redis://redis-service.data-platform:6379}"

# Python 路径
PYTHONPATH="/app"

