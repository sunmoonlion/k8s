# Kind 镜像加载配置
# 路径可为相对本目录(load-images)或绝对路径

# 默认镜像列表文件（一行一个镜像名），可多个，空格分隔
# 示例: DEFAULT_IMAGE_FILES="images-default.txt" 或 "images-default.txt images-harbor.txt"
DEFAULT_IMAGE_FILES="images-default.txt"

# 默认 tar 目录：将此目录内所有 .tar 文件加载到 Kind（可直接把 tar 复制进来）
# 相对路径为相对本目录；留空则不自动加载 tar
DEFAULT_TAR_DIR="tar-default-dir"

# Kind 集群名（留空则从 k8s-admin.conf [KIND] 读取）
# KIND_CLUSTER_NAME=kind
