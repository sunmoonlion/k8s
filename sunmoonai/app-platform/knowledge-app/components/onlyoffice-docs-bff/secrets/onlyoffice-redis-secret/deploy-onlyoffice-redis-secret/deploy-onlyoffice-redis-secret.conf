# =============================================================================
# ONLYOFFICE Redis Secret 部署配置
# 文件名: deploy-onlyoffice-redis-secret.conf
# 用途: 配置 ONLYOFFICE Docs 连接 Redis 的认证 Secret
# =============================================================================

SECRET_NAME="onlyoffice-redis-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"
SECRET_TYPE="Opaque"

# =============================================================================
# Redis 密码配置
# ⚠️  重要：这是 ONLYOFFICE Docs 连接 Redis 使用的密码！
# =============================================================================
# Redis 密码
# 
# 部署前请确保：
# 1. Redis 已启用密码认证（requirepass）
# 2. 此密码与 Redis 配置的密码保持一致
# 3. 如果 Redis 未设置密码，请在 dev-values.yaml 中设置 redisNoPass: true
#
# 如果为空，脚本将提示错误
# 请在此处设置密码，例如：
# REDIS_PASSWORD="your_redis_password_here"
REDIS_PASSWORD="${REDIS_PASSWORD:-}"

# 目标 Secret 键名（ONLYOFFICE Docs 使用的键名）
TARGET_SECRET_KEY="redis-password"

RESTART_COMPONENTS="false"
RESTART_PRIORITY="50"

