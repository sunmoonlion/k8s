# ============================================================================
# knowledge-web-frontend Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="knowledge-web-frontend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

SERVICE_NAME="${SERVICE_NAME:-knowledge-web-frontend}"
SERVICE_PORT="${SERVICE_PORT:-3000}"
UNIFIED_HOST="${UNIFIED_HOST:-knowledge.sunmoonai.com}"

USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-false}"
