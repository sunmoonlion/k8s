# 对于每个 StepXX）# - STEPXX_ENABLED=true|false  控制该步骤是否执）# - STEPXX_TARGET=master|worker|all  限定执行节点类型（结）SERVER_n_TYPE 判断）# - 其他）STEPXX_ 开头的键为该步骤的专用参数（如版本、超时、镜像等）#
# 执行行为）# - 所有步骤均遵循 precheck ）ensure_resources ）execute ）verify 四阶段；
# - 幂等：脚本在远端打标记（/var/tmp/k8s-steps/stepXX.done），变更版本/配置会触发重做；
# - 在线/离线：当 USE_OFFLINE=auto 时在线失败会提示离线路径与人工准备步骤）
# ============================
# 集群选择配置
# ============================
# CLUSTER: 当前使用的集群配置（格式：C{数字}，如 C1, C2, C3 等，支持不连续编号）
# - 优先级：命令行参）--cluster > 环境变量 CLUSTER > 全局配置文件 (k8s/utils/k8s-admin.conf) > 默认）C1
# - 注意：如果未设置，脚本会自动）k8s/utils/k8s-admin.conf ）[GLOBAL] 段读）default_cluster
# - 如需修改全局默认集群，请编辑 k8s/utils/k8s-admin.conf 中的 default_cluster=C1
CLUSTER="${CLUSTER:-}"

