# 浏览器入口；后端身份配置读取同一来源。运行配置与本组件声明同处。
---
knowbase_web_deployment:
  origin: 'https://knowbase.{{ site_domain }}:{{ public_port }}'
  casdoor_application: sunmoonai-knowbase-web
  casdoor_client_id: sunmoon-kind-knowbase-web
  port: 3000
  replicas: 1
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
