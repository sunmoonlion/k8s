# ============================================================================
# Tools Admin Frontend Ingress YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
TEMPLATE_FILE="templates/ingress/ingress.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="tools-admin-frontend-ingress-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="ingress"

# ============================================================================
# 基础配置（用于生成 YAML）
# ============================================================================
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Ingress 数据内容（用于生成 YAML）
# ============================================================================
SERVICE_NAME="${SERVICE_NAME:-tools-admin-frontend}"
SERVICE_PORT="${SERVICE_PORT:-80}"
UNIFIED_HOST="${UNIFIED_HOST:-tools-admin.sunmoonai.com}"

# Middleware 配置
USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-true}"
