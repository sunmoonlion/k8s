# =============================================================================
# Packages 管理配置（独立于 k8s 部署）
# =============================================================================
# 代理配置
PROXY_ENABLED=false
HTTP_PROXY=""
HTTPS_PROXY=""
NO_PROXY="localhost,127.0.0.1,::1"

# 构建目录配置（与 k8s-deploy 统一）
BUILD_DIR="$HOME/packages-to-be-installed"
DEB_DIR="$BUILD_DIR/debs"
IMAGE_DIR="$BUILD_DIR/images"
WORK_DIR="$BUILD_DIR/work"

# =============================================================================
# 服务器节点配置（仅用于上传分发）
# =============================================================================

# 服务器配置，多台服务器按编号增加（仅需与文件分发相关的字段）
# TYPE: 可选，标注服务器类型
# PUBLIC_IP: 公网 IP（用于 SSH 与文件传输）
# USER: SSH 用户名
# SECRET / PASS: SSH 密钥路径或密码（二选一）
# DIR: 远端文件存放目录
# SSH_PORT: SSH 端口

# 示例（已打开，直接修改即可；如不使用请清空 PUBLIC_IP 以停止计数）
