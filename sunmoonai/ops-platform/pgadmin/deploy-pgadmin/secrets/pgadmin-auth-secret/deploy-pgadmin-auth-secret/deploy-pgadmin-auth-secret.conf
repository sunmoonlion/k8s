# =============================================================================
# pgAdmin Secret 部署配置
# 文件名: deploy-pgadmin-auth-secret.conf
# 用途: 配置pgAdmin认证Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称（从主配置文件继承，如果没有则使用默认值）
# 注意：此配置与 deploy-pgadmin.conf 中的 PGADMIN_AUTH_SECRET_NAME 保持一致
SECRET_NAME="${PGADMIN_AUTH_SECRET_NAME:-pgadmin-auth-secret}"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-ops-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置
# =============================================================================

# Secret 键名配置（这些键名会用于 Kubernetes Secret 中的键名）
# 注意：
#   - PGADMIN_AUTH_SECRET_PASSWORD_KEY 在主配置文件中定义（主配置脚本需要它用于 dev-values.yaml 模板替换）
#   - pgAdmin 的用户名（email）在 dev-values.yaml 的 env.email 中定义，不需要存储在 Secret 中
PGADMIN_AUTH_SECRET_PASSWORD_KEY="${PGADMIN_AUTH_SECRET_PASSWORD_KEY:-pgadmin-auth-password}"  # 从主配置继承

# pgAdmin 密码（如果未设置，将生成随机密码）
# 建议设置固定密码，方便后续使用
# 如果留空，脚本会自动生成随机密码
# 注意：
#   - 此密码用于 pgAdmin 登录，请妥善保管
#   - 变量名使用下划线（pgadmin_password），因为 bash 变量名不能使用连字符
#   - 但存储到 Secret 中的键名使用连字符（pgadmin-auth-password），由 PGADMIN_AUTH_SECRET_PASSWORD_KEY 配置决定
#   - pgAdmin 的用户名（email）在 dev-values.yaml 的 env.email 中定义，不存储在 Secret 中
pgadmin_password="${pgadmin_password:-Pg!a1359admin}"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
