apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elasticsearch-ratelimit
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: elasticsearch-ratelimit
    project: sunmoonai
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: elasticsearch-headers
  namespace: data-platform-dev
  labels:
    app: data-platform-ingress
    component: elasticsearch-headers
    project: sunmoonai
spec:
  headers:
    customRequestHeaders:
      X-Elasticsearch-Version: "9.1.2"
    customResponseHeaders:
      X-Elasticsearch-Status: "active"

