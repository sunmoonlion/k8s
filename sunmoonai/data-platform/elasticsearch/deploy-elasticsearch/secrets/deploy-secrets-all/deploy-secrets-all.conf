# ============================================================================
# Secrets All 部署配置
# ============================================================================

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制
# ============================================================================
elasticsearch_myapp_secret_enabled="true"
elasticsearch_admin_secret_enabled="true"
harbor_registry_secret_enabled="true"      # 是否部署 Harbor 镜像拉取密钥

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
harbor_registry_secret_priority=800        # Harbor 镜像拉取密钥优先级高
elasticsearch_myapp_secret_priority=1000
elasticsearch_admin_secret_priority=900
