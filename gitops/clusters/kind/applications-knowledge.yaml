---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: knowledge-database, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 8m
  path: ./components/app-platform/knowledge-app/knowledge-backend/database
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: platform-services}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: knowledge-migration, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 8m
  path: ./components/app-platform/knowledge-app/knowledge-backend/migration
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn: [{name: knowledge-database}]
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
