apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: {name: object-storage-console, namespace: data-platform-dev}
spec:
  serverName: object-storage.data-platform-dev.svc.cluster.local
  rootCAsSecrets: [object-storage-upstream-ca]
  insecureSkipVerify: false
  forwardingTimeouts: {dialTimeout: 10s, responseHeaderTimeout: 60s}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: object-storage-ui
  namespace: data-platform-dev
  annotations: {kubernetes.io/ingress.class: sunmoon}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: 'Host(`aistor.sunmoonai.com`)'
      services: [{name: object-storage, port: console, scheme: https, serversTransport: object-storage-console}]
  tls: {secretName: object-storage-ui-tls}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: object-storage-ui-access, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: object-storage}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: 'ingress-platform-dev'}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
      ports: [{protocol: TCP, port: 9001}]
---
# 控制台和 S3 服务在同一个 Pod 里：登录时控制台按 MINIO_SERVER_URL 回连自己的 Service（9000）。
# 命名空间默认拒绝，这个 Pod 又不是「客户端」，回连会被丢掉，页面回 500 "unable to login due to network error"（2026-10-06 第 27 轮）。
# 只放行它到自己的 API 端口，进出各一条。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: object-storage-console-self, namespace: data-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: object-storage}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: object-storage}}
      ports: [{protocol: TCP, port: 9000}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: object-storage}}
      ports: [{protocol: TCP, port: 9000}]
