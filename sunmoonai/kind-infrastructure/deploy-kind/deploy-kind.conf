# Kind 集群初始化流程：
#   1. 构建自定义 Kind 节点镜像（build-kind-node-image.sh）
#   2. 创建 Kind 集群（应用 kind-cluster.yaml）
#   3. 配置 containerd registry mirror，指向 Harbor 并配置 TLS 证书
#   4. 配置 WSL /etc/hosts 中 Harbor 的域名解析
#   5. 部署 Kind 集群内的 Traefik 与 Harbor
# CA 证书初始化由 ensure-kind-ca.sh 完成，Traefik/Harbor 共享同一套证书
