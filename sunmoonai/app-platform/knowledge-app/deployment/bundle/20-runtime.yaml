    matchLabels:
      sunmoonai.com/app: knowledge
      app.kubernetes.io/component: web-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: knowledge-web-frontend
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: knowledge-web-frontend
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
