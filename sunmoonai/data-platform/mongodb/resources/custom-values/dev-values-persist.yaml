# MongoDB 开发环境配置（复用持久化数据版本）- 直接写具体值，不做模板替换

global:
  imageRegistry: ""
  imagePullSecrets:
    - name: "harbor-registry-secret"
  storageClass: "nfs-2"

image:
  registry: ""
  repository: bitnami/mongodb
  tag: "8.0.13-debian-12-r0"
  pullPolicy: "IfNotPresent"
  pullSecrets: []

auth:
  enabled: true
  existingSecret: "mongodb-auth-secret"
  usernames:
    - "sunmoonai_dev"
  passwords: []
  databases:
    - "mydb"

# 持久化配置（复用老盘：使用静态 PVC mongodb-sunmoonai-dev-pvc）
persistence:
  enabled: true
  existingClaim: mongodb-sunmoonai-dev-pvc
  storageClass: ""       # 使用 existingClaim，不再通过 storageClass 动态创建
  size: "8Gi"
  accessModes:
    - "ReadWriteOnce"

service:
  type: "ClusterIP"
  ports:
    mongodb: 27017

resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
  successThreshold: 1

architecture: standalone

metrics:
  enabled: false
  image:
    registry: ""
    repository: bitnami/mongodb-exporter
    tag: "0.47.0-debian-12-r1"
    pullPolicy: "IfNotPresent"
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"

ingress:
  enabled: false

initdbScripts:
  create-llmops-db.js: |
    db = db.getSiblingDB('llmops_db');
    db.createCollection('_init');
    db = db.getSiblingDB('mydb');
    try {
      var user = db.getUser('sunmoonai_dev');
      if (user) {
        db.grantRolesToUser('sunmoonai_dev', [
          { role: 'readWrite', db: 'llmops_db' },
          { role: 'dbAdmin', db: 'llmops_db' }
        ]);
        print('已授予 sunmoonai_dev 用户对 llmops_db 数据库的权限');
      } else {
        print('警告: sunmoonai_dev 用户不存在，跳过权限授予');
      }
    } catch (e) {
      print('错误: 无法授予权限 - ' + e);
    }

mongodbConfiguration: |
  storage:
    dbPath: /bitnami/mongodb
    journal:
      enabled: true
  systemLog:
    destination: file
    logAppend: true
    path: /opt/bitnami/mongodb/logs/mongodb.log
  net:
    port: 27017
    bindIp: 0.0.0.0

