---
- name: Inspect credential files without reading their values
  ansible.builtin.stat:
    path: '{{ registry_config_dir }}/private/{{ item }}'
    follow: false
    get_checksum: false
  loop: [admin-password, database-password]
  register: credential_files

- name: Reject unsafe credential files
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.stat.exists or item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
      - not item.stat.exists or item.stat.mode == '0600'
      - not item.stat.exists or item.stat.uid == 0
  loop: '{{ credential_files.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Validate the independent registry credential backup path
  ansible.builtin.assert:
    quiet: true
    that: registry_credential_backup_dir == '/mnt/sunmoon-data/backups/registry/platform-kind-v1/credentials'
- name: Inspect backup directory and existing registry declaration guards
  ansible.builtin.stat: {path: '{{ item }}', follow: false, get_checksum: false}
  loop: ['{{ registry_credential_backup_dir }}', '{{ registry_runtime_dir }}/harbor.yml', '{{ registry_instance_dir }}/data/database/pgdata/PG_VERSION']
  register: registry_input_guards
- name: Reject a redirected independent backup directory
  ansible.builtin.assert:
    quiet: true
    that:
      - not registry_input_guards.results[0].stat.islnk | default(false)
      - not registry_input_guards.results[0].stat.exists or (registry_input_guards.results[0].stat.isdir | default(false) and registry_input_guards.results[0].stat.uid == 0)
- name: Inspect the exact private registry backup pair
  ansible.builtin.stat: {path: '{{ registry_credential_backup_dir }}/{{ item }}', follow: false, get_checksum: false}
  loop: [admin-password, database-password]
  register: registry_input_backups
  no_log: true
- name: Refuse insecure or redirected private registry backups
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.stat.islnk | default(false)
      - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
  loop: '{{ registry_input_backups.results }}'
  no_log: true
- name: Refuse regenerating lost credentials for a declared or initialized registry
  ansible.builtin.assert:
    quiet: true
    that: credential_files.results[item].stat.exists or registry_input_backups.results[item].stat.exists or (not registry_input_guards.results[1].stat.exists and not registry_input_guards.results[2].stat.exists)
    fail_msg: Existing registry credential is missing. Restore its independent credential or cold backup; never regenerate it.
  loop: [0, 1]
- name: Restore a missing primary credential only from its exact backup
  ansible.builtin.copy:
    src: '{{ registry_credential_backup_dir }}/{{ credential_files.results[item].item }}'
    dest: '{{ registry_config_dir }}/private/{{ credential_files.results[item].item }}'
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: not credential_files.results[item].stat.exists and registry_input_backups.results[item].stat.exists
  loop: [0, 1]
  no_log: true
- name: Read the human admin preset without changing an existing Harbor account
  ansible.builtin.include_tasks: ../../host/tasks/account-preset.yaml
  vars: {human_account: '{{ registry_human_account }}'}
  no_log: true
- name: Generate independent initial credentials only when absent
  ansible.builtin.command:
    argv: [openssl, rand, -hex, '32']
  when: not item.stat.exists and not registry_input_backups.results[preset_index].stat.exists
  loop: '{{ credential_files.results }}'
  loop_control: {index_var: preset_index}
  register: generated_credentials
  changed_when: true
  no_log: true

- name: Persist newly generated credentials without overwriting existing files
  ansible.builtin.copy:
    dest: '{{ registry_config_dir }}/private/{{ item.item.item }}'
    content: '{{ human_initial_password if item.item.item == "admin-password" and human_initial_password | length > 0 else item.stdout }}'
    force: false
    mode: '0600'
    owner: root
    group: root
  when: not item.skipped | default(false)
  loop: '{{ generated_credentials.results }}'
  no_log: true
  diff: false

- name: Create an independent private credential backup directory
  ansible.builtin.file: {path: '{{ registry_credential_backup_dir }}', state: directory, owner: root, group: root, mode: '0700'}
- name: Preserve each registry credential without replacing a prior identity
  ansible.builtin.copy:
    src: '{{ registry_config_dir }}/private/{{ item }}'
    dest: '{{ registry_credential_backup_dir }}/{{ item }}'
    remote_src: true
    force: false
    owner: root
    group: root
    mode: '0600'
  loop: [admin-password, database-password]
  no_log: true
- name: Require exact recoverable registry credential bytes
  ansible.builtin.command:
    argv: [cmp, --silent, '{{ registry_config_dir }}/private/{{ item }}', '{{ registry_credential_backup_dir }}/{{ item }}']
  loop: [admin-password, database-password]
  changed_when: false
  no_log: true
- name: Inspect certificate and private key paths
  ansible.builtin.stat:
    path: '{{ registry_config_dir }}/tls/{{ item }}'
    follow: false
    get_checksum: false
  loop: [ca.key, ca.crt, server.key, server.crt]
  register: certificate_files

- name: Refuse symlinks and partial certificate pairs
  ansible.builtin.assert:
    quiet: true
    that:
      - not item.stat.exists or item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
      - certificate_files.results[0].stat.exists == certificate_files.results[1].stat.exists
      - certificate_files.results[2].stat.exists == certificate_files.results[3].stat.exists
  loop: '{{ certificate_files.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Create a private local CA once
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -nodes
      - -sha256
      - -days
      - '{{ registry_release.ca_days | string }}'
      - -subj
      - /CN=SunMoon Registry Local CA
      - -addext
      - basicConstraints=critical,CA:TRUE,pathlen:0
      - -addext
      - keyUsage=critical,keyCertSign,cRLSign
      - -keyout
      - '{{ registry_config_dir }}/tls/ca.key'
      - -out
      - '{{ registry_config_dir }}/tls/ca.crt'
  when: not certificate_files.results[0].stat.exists
  changed_when: true
  no_log: true

- name: Create a private server key and CSR once
  ansible.builtin.command:
    argv: [openssl, req, -new, -newkey, 'rsa:3072', -nodes, -sha256, -subj, '/CN={{ registry_hostname }}', -keyout, '{{ registry_config_dir }}/tls/server.key', -out, '{{ registry_config_dir }}/tls/server.csr']
  when: not certificate_files.results[2].stat.exists
  changed_when: true
  no_log: true

- name: Write server certificate extensions
  ansible.builtin.copy:
    dest: '{{ registry_config_dir }}/tls/server.ext'
    mode: '0600'
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=DNS:{{ registry_hostname }},IP:127.0.0.1

- name: Sign the five-year server certificate once
  ansible.builtin.command:
    argv: [openssl, x509, -req, -in, '{{ registry_config_dir }}/tls/server.csr', -CA, '{{ registry_config_dir }}/tls/ca.crt', -CAkey, '{{ registry_config_dir }}/tls/ca.key', -CAcreateserial, -out, '{{ registry_config_dir }}/tls/server.crt', -days, '{{ registry_release.certificate_days | string }}', -sha256, -extfile, '{{ registry_config_dir }}/tls/server.ext']
  when: not certificate_files.results[2].stat.exists
  changed_when: true
  no_log: true

- name: Restrict private keys
  ansible.builtin.file:
    path: '{{ registry_config_dir }}/tls/{{ item }}'
    owner: root
    group: root
    mode: '0600'
  loop: [ca.key, server.key]

- name: Verify certificate chain, DNS identity and remaining validity
  ansible.builtin.command:
    argv: '{{ item }}'
  changed_when: false
  loop:
    - [openssl, verify, -CAfile, '{{ registry_config_dir }}/tls/ca.crt', -verify_hostname, '{{ registry_hostname }}', '{{ registry_config_dir }}/tls/server.crt']
    - [openssl, x509, -checkend, '2592000', -noout, -in, '{{ registry_config_dir }}/tls/server.crt']

- name: Read credentials only into protected task variables
  ansible.builtin.slurp:
    src: '{{ registry_config_dir }}/private/{{ item }}'
  loop: [admin-password, database-password]
  register: credentials
  no_log: true

- name: Require valid generated credential values
  ansible.builtin.assert:
    quiet: true
    that:
      - item.item != 'database-password' or (item.content | b64decode) is match('^[a-f0-9]{64}$')
      - item.item != 'admin-password' or ((item.content | b64decode) | length >= 8 and (item.content | b64decode) | length <= 128 and (item.content | b64decode) is not search('[\r\n\x00]'))
  loop: '{{ credentials.results }}'
  no_log: true

- name: Read public identities for key and certificate matching
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [openssl, pkey, -in, '{{ registry_config_dir }}/tls/ca.key', -pubout]
    - [openssl, x509, -in, '{{ registry_config_dir }}/tls/ca.crt', -pubkey, -noout]
    - [openssl, pkey, -in, '{{ registry_config_dir }}/tls/server.key', -pubout]
    - [openssl, x509, -in, '{{ registry_config_dir }}/tls/server.crt', -pubkey, -noout]
  register: public_identities
  changed_when: false
  no_log: true

- name: Require certificate private keys to match
  ansible.builtin.assert:
    quiet: true
    that:
      - public_identities.results[0].stdout == public_identities.results[1].stdout
      - public_identities.results[2].stdout == public_identities.results[3].stdout
