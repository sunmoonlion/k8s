            - {secretRef: {name: info-storage-runtime}}
          resources: {"requests": {"cpu": "100m", "memory": "256Mi"}, "limits": {"cpu": "2", "memory": "1Gi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: storage-ca, secret: {secretName: info-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: info-celery-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: info-scheduler, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: info-scheduler}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: info-scheduler
        app.kubernetes.io/part-of: info
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 08c4ed31938dd56bcf48e5193c066fb9b25ada75b49191d4aa7280d8482fe2c8
    spec:
      serviceAccountName: info-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: harbor.sunmoonai.com:30443/platform/info-backend@sha256:f1f45c85441f36d77c320c467f31a1dff40073c11a4ac4f696035b8460838efa
          imagePullPolicy: IfNotPresent
          command: [celery]
          args: [-A, 'app.bootstrap.scheduler:celery_app', beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule, --pidfile=, --max-interval=5]
          startupProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {exec: {command: [python, -m, app.cli.scheduler_activity, --schedule, /tmp/celerybeat-schedule, --max-age, '30']}, timeoutSeconds: 5, periodSeconds: 10}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: info-scheduler}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: info-runtime}}
            - {configMapRef: {name: info-browser-identity}}
            - {secretRef: {name: info-database-runtime}}
            - {secretRef: {name: info-rabbitmq-runtime}}
            - {secretRef: {name: info-storage-runtime}}
          resources: {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"cpu": "1", "memory": "512Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: storage-ca, mountPath: /etc/sunmoon/object-storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: storage-ca, secret: {secretName: info-storage-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: celery-config, configMap: {name: info-celery-config}}
---
apiVersion: v1
kind: Service
metadata: {name: info-api, namespace: app-platform-dev}
spec:
  selector: {app.kubernetes.io/name: info-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: info-api-ingress, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: info-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-platform-dev}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: info-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: info-admin}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: info-api-casdoor-out, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: info-api}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: info-api-casdoor-in, namespace: app-platform-dev}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: casdoor}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: info-api}}
      ports: [{protocol: TCP, port: 8000}]
