# Celery Worker 中间件总控部署配置
# 注意：Celery Worker Flower 监控界面通常不需要中间件，此配置保留用于未来扩展

# 基础配置
CELERY_WORKER_PROJECT_ID="sunmoonai"
CELERY_WORKER_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 当前 Celery Worker Flower 监控界面不需要中间件，保留配置用于未来扩展
# celeryworker_stripprefix_enabled="false"  # 如果需要路径前缀剥离，可启用

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
# celeryworker_stripprefix_priority=100   # 如果需要，可设置优先级

