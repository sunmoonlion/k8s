# =============================================================================
# Infrastructure 包同步配置
# =============================================================================
# 说明：用于基础设施安装前的包文件同步
# 复用 harbor-registry.conf 的服务器节点配置（SERVER_*）

# 本地包目录（固定，与 packages-management 兼容）
LOCAL_PACKAGE_DIR="$HOME/packages-to-be-installed"
LOCAL_DEBS_DIR="$LOCAL_PACKAGE_DIR/debs"
LOCAL_IMAGES_DIR="$LOCAL_PACKAGE_DIR/images"
LOCAL_TARS_DIR="$LOCAL_PACKAGE_DIR/tars"
LOCAL_CHARTS_DIR="$LOCAL_PACKAGE_DIR/charts"

# 远端包目录（固定）
REMOTE_PACKAGE_DIR="~/packages-to-be-installed"
REMOTE_DEBS_DIR="$REMOTE_PACKAGE_DIR/debs"
REMOTE_IMAGES_DIR="$REMOTE_PACKAGE_DIR/images"
REMOTE_TARS_DIR="$REMOTE_PACKAGE_DIR/tars"
REMOTE_CHARTS_DIR="$REMOTE_PACKAGE_DIR/charts"

