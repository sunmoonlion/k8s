# =============================================================================
# Harbor 镜像管理配置（独立配置，不依赖其）conf）# =============================================================================

# Harbor 访问配置（将 API ）Registry 明确分离）# - HARBOR_REGISTRY: ）nerdctl push 使用）Registry 地址（无协议），） www.sunmoonai.com:30443
# - HARBOR_API_BASE: ）Harbor API 使用的地址（含协议），） https://www.sunmoonai.com:30443
HARBOR_REGISTRY="www.sunmoonai.com:30443"
HARBOR_API_BASE="https://www.sunmoonai.com:30443"

# 认证（建议使）robot 账户
HARBOR_USERNAME="admin"
HARBOR_PASSWORD="Ha!r1359admin"

# 目标项目（默认）
HARBOR_DEFAULT_PROJECT="k8s-images"

# 允许 HTTP（自签名或内网场景）
HARBOR_INSECURE="false"
VERIFY_SSL="true"

# nerdctl/containerd 配置
CONTAINERD_NAMESPACE="k8s.io"

# 本地镜像包目录（固定，与 packages-management 兼容
LOCAL_IMAGE_DIR="$HOME/packages-to-be-installed/images"

# 组件镜像清单目录（集中管理）；留空则）harbor-image.sh 按仓库位置自动推
COMPONENT_IMAGES_DIR=""

# 控制平面（用于按需上传、load→push→清理）
CONTROL_PLANE_HOST=""
CONTROL_PLANE_USER=""
CONTROL_PLANE_SSH_PORT="22"
CONTROL_PLANE_SECRET=""
CONTROL_PLANE_PASS=""
CONTROL_PLANE_IMAGE_DIR="~/packages-to-be-installed/images"

# 全局清理参数
AUTO_CLEANUP_AFTER_PUSH="false"
AUTO_CLEANUP_UNUSED_IMAGES="false"
CLEANUP_DISK_THRESHOLD="75"   # 超过该磁盘使用率才触发清）
# 推送可靠性与并发控制
PUSH_RETRY="2"                    # 失败重试次数
PUSH_RETRY_INTERVAL="3"           # 重试间隔
MAX_PARALLEL_PUSH="1"             # 未来如需并发可用（当前脚本串行）
NERDCTL_BIN="nerdctl"             # 可切）nerdctl 路径
USE_SUDO="true"                   # 远端是否使用 sudo 执行 nerdctl

# 代理（如需
HTTP_PROXY=""
HTTPS_PROXY=""
NO_PROXY="localhost,127.0.0.1,::1"

# =============================================================================
# 集群节点列表（Harbor 安装后全局清理使用）# =============================================================================
# 说明）# - 节点配置）deploy-infrastructure-all.conf 中读）# - 脚本会自动读）SERVER_n_PUBLIC_IP、SERVER_n_USER、SERVER_n_SECRET、SERVER_n_SSH_PORT、SERVER_n_DIR 等配）# - 支持多集群配置（通过 CLUSTER 环境变量）KUBECONFIG 自动选择对应）C{数字}_SERVER_n_* 配置）# - 清理操作包括）#   * nerdctl image prune -a -f（清理未使用）containerd 镜像）#   * 删除包文件目录（debs, tars, charts, images）# - 如果 PUBLIC_IP 为空，该节点会被跳过（禁用）
# =============================================================================
# 注意：节点配置已移至 deploy-infrastructure-all.conf，此处不再需要配）
