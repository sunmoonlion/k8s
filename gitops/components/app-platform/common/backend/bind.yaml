---
# Shared by backend and frontend prepares. prepare_vars.application_name is required.
- name: Require an explicit application bind
  ansible.builtin.assert:
    quiet: true
    that:
      - prepare_vars.application_name in ['tpl', 'knowfeed', 'knowbase', 'knowbench', 'knowlab', 'knowmart']
- name: Bind application paths
  ansible.builtin.set_fact:
    application_name: '{{ prepare_vars.application_name }}'
    app_root: '{{ playbook_dir }}/../../gitops/components/app-platform/{{ prepare_vars.application_name }}-app'
    component_root: '{{ playbook_dir }}/../../gitops/components/app-platform/{{ prepare_vars.application_name }}-app/{{ prepare_vars.application_name }}-backend'
    mechanism_root: '{{ playbook_dir }}/../../gitops/components/app-platform/common/backend'
    application_object: 'app-platform/{{ prepare_vars.application_name }}-app/{{ prepare_vars.application_name }}-backend'
    frontend_web_object: 'app-platform/{{ prepare_vars.application_name }}-app/{{ prepare_vars.application_name }}-web-frontend'
    frontend_admin_object: 'app-platform/{{ prepare_vars.application_name }}-app/{{ prepare_vars.application_name }}-admin-frontend'
- name: Load application configuration and locked images
  ansible.builtin.set_fact:
    application_cfg: '{{ (lookup("file", app_root + "/config.yaml") | from_yaml)[application_name + "_deployment"] }}'
    backend_cfg_raw: '{{ (lookup("file", component_root + "/config.yaml") | from_yaml)[application_name + "_backend_deployment"] }}'
    web_cfg: '{{ (lookup("file", app_root + "/" + application_name + "-web-frontend/config.yaml") | from_yaml)[application_name + "_web_deployment"] }}'
    admin_cfg: '{{ (lookup("file", app_root + "/" + application_name + "-admin-frontend/config.yaml") | from_yaml)[application_name + "_admin_deployment"] }}'
    app_images:
      backend: '{{ lookup("file", component_root + "/image.lock.yaml") | from_yaml }}'
      web: '{{ lookup("file", app_root + "/" + application_name + "-web-frontend/image.lock.yaml") | from_yaml }}'
      admin: '{{ lookup("file", app_root + "/" + application_name + "-admin-frontend/image.lock.yaml") | from_yaml }}'
    source_lock: '{{ (lookup("file", playbook_dir + "/../applications/sources.yaml") | from_yaml).applications[application_name] }}'
- name: Place the site-derived private paths where the configuration file used to hold them
  # private_dir/backup_dir 不再写在应用配置里（会被 lookup("file") 重读，Jinja 不展开）；从站点值推出，
  # 插回原来的位置（deploy_budget_bytes 之前）——配置哈希按键序算，位置变了六个后端都会滚动更新。
  ansible.builtin.set_fact:
    backend_cfg: >-
      {%- set out = {} -%}
      {%- for k, v in backend_cfg_raw.items() -%}
        {%- if k == 'deploy_budget_bytes' -%}
          {%- set _ = out.update({'private_dir': '/etc/sunmoon/applications/' ~ cluster_name ~ '/' ~ application_name, 'backup_dir': data_root ~ '/backups/applications/' ~ cluster_name ~ '/' ~ application_name}) -%}
        {%- endif -%}
        {%- set _ = out.update({k: v}) -%}
      {%- endfor -%}
      {{ out }}

- name: Combine public application identity
  ansible.builtin.set_fact:
    cfg: '{{ application_cfg | combine(backend_cfg) | combine({"namespace": app_namespace, "web_origin": web_cfg.origin, "admin_origin": admin_cfg.origin}) }}'
    browser_clients:
      web: {name: '{{ web_cfg.casdoor_application }}', client_id: '{{ web_cfg.casdoor_client_id }}', origin: '{{ web_cfg.origin }}'}
      admin: {name: '{{ admin_cfg.casdoor_application }}', client_id: '{{ admin_cfg.casdoor_client_id }}', origin: '{{ admin_cfg.origin }}'}
    storage_enabled: '{{ (backend_cfg.object_storage.enabled | default(false)) | bool }}'
    agent_releases_enabled: '{{ lookup("vars", prepare_vars.application_name + "_agent_releases", default={}).enabled | default(false) | bool }}'
    # 分身测试的测试电脑（SDD 0027 §3.4，只有 knowbench 有）
    test_computer_enabled: '{{ (backend_cfg.knowbot_test_computer.enabled | default(false)) | bool }}'
    provider_enabled: '{{ (backend_cfg.knowledge_provider.enabled | default(false)) | bool }}'
    service_enabled: '{{ (backend_cfg.knowbase_service.enabled | default(false)) | bool }}'
    receiver_enabled: '{{ (backend_cfg.knowbase_service_receiver.enabled | default(false)) | bool }}'
    service_relation: '{{ "ingest" if application_name == "knowfeed" else "retrieve" }}'
    service_env_prefix: '{{ "KNOWBASE_APP_SERVICE" if application_name == "knowfeed" else "KNOWBASE_RETRIEVAL_SERVICE" }}'
    service_bindings:
      ingest: '{{ (lookup("file", playbook_dir + "/../../gitops/components/app-platform/knowfeed-app/knowfeed-backend/config.yaml") | from_yaml).knowfeed_backend_deployment.knowbase_service }}'
      retrieve: '{{ (lookup("file", playbook_dir + "/../../gitops/components/app-platform/knowbench-app/knowbench-backend/config.yaml") | from_yaml).knowbench_backend_deployment.knowbase_service }}'
- name: Derive public rollout identity
  ansible.builtin.set_fact:
    deployment_id: '{{ app_images.backend.deployment_id }}'
    migration_job: '{{ application_name }}-migrate-{{ app_images.backend.digest[7:19] }}-{{ cfg.migration_job_revision }}'
# SDD 0027 P1：通用的跨应用服务身份（knowbase 那一对仍走上面的 knowbase_service / service_bindings，不动）。
# 调用方 service_clients 每项一条关系；接收方 service_receivers 只写接受谁的哪种关系，身份从调用方配置推出来。
- name: Bind generic outbound service clients
  ansible.builtin.set_fact:
    generic_service_clients: '{{ backend_cfg.service_clients | default([]) | selectattr("enabled") | list }}'
- name: Bind generic inbound service relations from each caller's own declaration
  ansible.builtin.set_fact:
    generic_service_receivers: >-
      {%- set out = [] -%}
      {%- for r in backend_cfg.service_receivers | default([]) if r.enabled -%}
        {%- set caller = (lookup("file", playbook_dir + "/../../gitops/components/app-platform/" + r.caller + "-app/" + r.caller + "-backend/config.yaml") | from_yaml)[r.caller + "_backend_deployment"] -%}
        {%- set found = caller.service_clients | default([]) | selectattr("target", "equalto", application_name) | selectattr("relation", "equalto", r.relation) | list -%}
        {%- set _ = out.append({"relation": r.relation, "caller": r.caller, "client": (found[0] if found | length == 1 else none)}) -%}
      {%- endfor -%}
      {{ out }}
- name: Require every inbound relation to match exactly one enabled caller client
  ansible.builtin.assert:
    quiet: true
    that:
      - item.client is not none and item.client.enabled
      - item.client.scope == application_name + ':' + item.relation
    fail_msg: 'Service receiver {{ application_name }}:{{ item.relation }} has no single enabled client in {{ item.caller }}'
  loop: '{{ generic_service_receivers }}'
  loop_control: {label: '{{ item.caller }}:{{ item.relation }}'}
