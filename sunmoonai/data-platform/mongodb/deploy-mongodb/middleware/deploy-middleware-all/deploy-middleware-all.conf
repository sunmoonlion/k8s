# Mongodb 中间件总控部署配置
# 注意：Mongodb 使用 TCP 路由，仅支持 policy（rateLimit），不支持 stripprefix

# 基础配置
MONGODB_PROJECT_ID="sunmoonai"
MONGODB_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
mongodb_policy_enabled="true"        # Policy 中间件（限流）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
mongodb_policy_priority=100       # Policy 优先级
