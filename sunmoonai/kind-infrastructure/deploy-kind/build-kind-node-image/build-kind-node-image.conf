#!/usr/bin/env bash

# -----------------------------------------------------------------------------
# build-kind-node-image 配置文件（类似 load-images.conf）
# -----------------------------------------------------------------------------
# 说明：
# - 所有路径既可以写绝对路径，也可以写相对路径；
# - 相对路径一律相对于本目录：deploy-kind/build-kind-node-image/。
# - BUILD_KIND_IMAGE_LIST_FILE 与 BUILD_KIND_TAR_DIR 二选一配置，不能同时非空。
#
# 方式 1：使用镜像列表文件（每行一个镜像名称，支持注释行 # 开头）
#   - 脚本会依次执行：docker pull -> docker save 成 .tar
#   - 示例：
#       BUILD_KIND_IMAGE_LIST_FILE="images-init.txt"
#
# 方式 2：使用已有的 .tar 目录
#   - 目录中应当已经包含若干 *.tar，脚本会直接复制并在 Dockerfile 中 ctr import
#   - 示例（推荐：使用 image-init-dir 下已准备好的 tar 包）：
#       BUILD_KIND_TAR_DIR="image-init-dir"
#
# 默认：我们假设你已经把所需 .tar 放在本目录下的 image-init-dir/ 中，
# 因此下面默认启用方式 2，并关闭方式 1。

#BUILD_KIND_IMAGE_LIST_FILE="images-init.txt"
BUILD_KIND_IMAGE_LIST_FILE=""

BUILD_KIND_TAR_DIR="image-init-dir"
