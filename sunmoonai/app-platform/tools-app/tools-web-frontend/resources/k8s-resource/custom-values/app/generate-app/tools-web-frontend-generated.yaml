apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-web-frontend
  namespace: app-platform-dev
  labels:
    app: tools-web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tools-web-frontend
  template:
    metadata:
      labels:
        app: tools-web-frontend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: tools-web-frontend
        image: harbor.sunmoonai.com:30443/app-images/tools-web-frontend:1.0.0-rebuild.20260615
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: tools-web-frontend-config
        - secretRef:
            name: tools-web-frontend-secret



        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tools-web-frontend-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: tools-web-frontend
  namespace: app-platform-dev
  labels:
    app: tools-web-frontend
spec:
  selector:
    app: tools-web-frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
