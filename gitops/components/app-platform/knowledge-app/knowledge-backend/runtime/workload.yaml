apiVersion: v1
kind: ConfigMap
metadata: {name: knowledge-runtime, namespace: app-platform-dev}
data:
  ENV: production
  APP_SLUG: knowledge
  DEPLOYMENT_ID: "knowledge-backend-71aad8b47ada3ea9"
  ALLOWED_HOSTS: "localhost,127.0.0.1,knowledge-api,knowledge-api.app-platform-dev.svc.cluster.local,knowledge.sunmoonai.com,knowledge-admin.sunmoonai.com,knowledge-tls.app-platform-dev.svc.cluster.local"
  REDIS_HOST: redis.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CELERY_QUEUE: knowledge.default
  CELERY_TASK_TOPOLOGY_PREDECLARED: 'true'
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor.app-platform-dev.svc.cluster.local:8000
  CASDOOR_VERIFY_SSL: 'true'
  SESSION_COOKIE_SECURE: 'true'
  REFERENCE_INTERACTION_ENABLED: 'false'
  RAGFLOW_API_BASE: https://ragflow.data-platform-dev.svc.cluster.local:9380
  RAGFLOW_PARSE_TIMEOUT_SECONDS: '300'
  INGESTION_DATASET_BINDINGS: "{\"default\": {\"dataset_id\": \"4752d41ebfde11f19b670d4e2005906f\", \"dataset_name\": \"sunmoon-kind-knowledge-default\"}}"
  RETRIEVAL_DATASET_ALLOWLIST: "default"
  RETRIEVAL_DEFAULT_TENANT_ID: "sunmoonai"
  S3_ENDPOINT: https://object-storage.data-platform-dev.svc.cluster.local:9000
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: 'true'
  ARTIFACT_S3_ALLOWED_BUCKETS: "info-originals"
  ARTIFACT_S3_ALLOWED_PREFIXES: "info/"
  SSL_CERT_FILE: /etc/sunmoon/provider/ca.crt
  INTERNAL_AUTH_CASDOOR_APPLICATION: "sunmoonai-info-knowledge-ingest"
  INTERNAL_AUTH_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  INTERNAL_AUTH_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  INTERNAL_AUTH_AUDIENCE: "sunmoon-info-knowledge-ingest"
  INTERNAL_AUTH_SUBJECT_ALLOWLIST: "admin/sunmoonai-info-knowledge-ingest"
  INTERNAL_AUTH_REQUIRED_SCOPE: "knowledge:ingest"
  RETRIEVAL_AUTH_CASDOOR_APPLICATION: "sunmoonai-investment-knowledge-retrieve"
  RETRIEVAL_AUTH_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  RETRIEVAL_AUTH_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  RETRIEVAL_AUTH_AUDIENCE: "sunmoon-investment-knowledge-retrieve"
  RETRIEVAL_AUTH_SUBJECT_ALLOWLIST: "admin/sunmoonai-investment-knowledge-retrieve"
  RETRIEVAL_AUTH_REQUIRED_SCOPE: "knowledge:retrieve"
  CROSS_APP_TARGETS_JSON: "{\"info\": {\"web_base_url\": \"https://info.sunmoonai.com:30443\"}}"
  CROSS_APP_SOURCES_JSON: "{\"investment\": {\"return_url\": \"https://investment.sunmoonai.com:30443/zh-CN/workbench?ref={ref}\"}, \"info\": {}}"
  KNOWLEDGE_MCP_JWT_ISSUER: "sunmoon-workbench"
  KNOWLEDGE_MCP_RATE_PER_MINUTE: "120"
  KNOWLEDGE_DATASET_TITLE: "\u96f6\u552e\u7ecf\u8425\u5e93\uff08\u6700\u5c0f\u5b9e\u4f8b\uff09"
  KNOWLEDGE_DATASET_REGISTRY_ENABLED: "true"
  KNOWLEDGE_DATASET_ALLOWED_BUCKETS: "info-originals"
  KNOWLEDGE_DATASET_CACHE_DIR: "/tmp/knowledge-datasets"
  KNOWLEDGE_SEMANTIC_ENGINE_ENABLED: "true"
  KNOWLEDGE_SEMANTIC_CACHE_DIR: "/tmp/knowledge-semantic"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: knowledge-celery-config, namespace: app-platform-dev}
data:
  celeryconfig.py: |
    # Native Celery 5.6 configuration; transient per-connection queues only.
    control_queue_durable = False
    control_queue_exclusive = True
    event_queue_durable = False
    event_queue_exclusive = True
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowledge-api, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowledge-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-api
        app.kubernetes.io/part-of: knowledge
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/ragflow-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
        sunmoonai.com/redis-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 7ffcf00dbbc34ca55bc2f15d685c97962b8b4ace5064bdd4180a5a44b50d6590
    spec:
      serviceAccountName: knowledge-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: harbor.sunmoonai.com:30443/platform/knowledge-backend@sha256:71aad8b47ada3ea90363f485850dc7153f7ad0cb075a255619e7a1f6916a7681
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [app.bootstrap.api:app, --no-access-log, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '10.247.0.0/16']
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 3, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http, httpHeaders: [{name: Host, value: localhost}]}, timeoutSeconds: 3, periodSeconds: 20}
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SERVICE_NAME, value: knowledge-api}
            - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
            - {name: CELERY_CONFIG_MODULE, value: celeryconfig}
            - {name: PYTHONPATH, value: '/etc/sunmoon/celery:/app'}
          envFrom:
            - {configMapRef: {name: knowledge-runtime}}
            - {configMapRef: {name: knowledge-browser-identity}}
            - {secretRef: {name: knowledge-database-runtime}}
            - {secretRef: {name: knowledge-rabbitmq-runtime}}
            - {secretRef: {name: knowledge-redis-runtime}}
            - {secretRef: {name: knowledge-browser-secrets}}
            - {secretRef: {name: knowledge-domain-runtime}}
            - {secretRef: {name: knowledge-provider-runtime}}
          resources: {"requests": {"cpu": "100m", "memory": "192Mi"}, "limits": {"cpu": "2", "memory": "768Mi"}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: provider-ca, mountPath: /etc/sunmoon/provider, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: celery-config, mountPath: /etc/sunmoon/celery, readOnly: true}
      volumes:
        - {name: provider-ca, secret: {secretName: knowledge-provider-runtime, items: [{key: ca.crt, path: ca.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
        - {name: celery-config, configMap: {name: knowledge-celery-config}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: knowledge-worker, namespace: app-platform-dev}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: knowledge-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-worker
        app.kubernetes.io/part-of: knowledge
        sunmoonai.com/postgresql-client: 'true'
        sunmoonai.com/rabbitmq-client: 'true'
        sunmoonai.com/ragflow-client: 'true'
        sunmoonai.com/object-storage-client: 'true'
      annotations:
        sunmoonai.com/config-sha256: 7ffcf00dbbc34ca55bc2f15d685c97962b8b4ace5064bdd4180a5a44b50d6590
    spec:
      serviceAccountName: knowledge-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
