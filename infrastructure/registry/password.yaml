---
- name: Resolve the owning component's fixed protocol and trust settings
  ansible.builtin.set_fact:
    account_protocol_path: "{{ inventory_dir }}/../registry/password.py"
    account_protocol_settings:
      hostname: '{{ registry_hostname }}'
      port: '{{ registry_https_port }}'
      ca: '{{ registry_config_dir }}/clients/ca.crt'
- name: Check the real component login identity before any rotation
  ansible.builtin.include_tasks: '{{ inventory_dir }}/tasks/account-protocol-check.yaml'
  when: account_action != 'recover'

- name: Explain that registry human targets are private inputs rather than GitOps Secrets
  ansible.builtin.assert:
    that: account_action != 'stage'
    fail_msg: Harbor uses its imported private preset directly; account-stage applies only to a component GitOps identity Secret.
- name: Rotate the Harbor account with its native official configuration
  ansible.builtin.include_tasks: rotation.yaml
  when: account_action in ['rotate','recover']
