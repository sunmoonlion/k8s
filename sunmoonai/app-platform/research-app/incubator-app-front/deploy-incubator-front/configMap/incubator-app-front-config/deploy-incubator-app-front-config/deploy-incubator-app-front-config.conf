# ============================================================================
# Incubator App SSR ConfigMap 部署配置
# 职责：只包含部署控制参数，不包含用于生成 YAML 的数据内容
# 注意：ConfigMap 的数据内容在 generate-incubator-app-front-config.conf 中
# ============================================================================

# ============================================================================
# 部署相关配置
# ============================================================================
# 基础配置（默认值，可通过主配置或命令行参数覆盖）
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# 组件部署控制（用于主脚本动态扫描）
# 控制是否部署此组件
incubator_app_ssr_config_enabled="${incubator_app_ssr_config_enabled:-true}"

# 部署优先级（数值越大优先级越高，越先部署）
incubator_app_ssr_config_priority="${incubator_app_ssr_config_priority:-500}"

# 组件描述（用于日志输出）
incubator_app_ssr_config_description="${incubator_app_ssr_config_description:-Incubator App SSR ConfigMap}"

# ConfigMap 基本信息（用于部署）
CONFIGMAP_NAME="incubator-app-front-config"
CONFIGMAP_NAMESPACE="${CONFIGMAP_NAMESPACE:-${NAMESPACE:-app-platform-dev}}"

# 是否重启使用该 ConfigMap 的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
