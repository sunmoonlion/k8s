# ============================================================================
# LLMOps Service 部署配置
# 文件名: deploy-llmops-service.conf
# 用途: 配置 LLMOps Service 的部署参数
# ============================================================================

# ============================================================================
# 基础配置
# ============================================================================
LLMOPS_SERVICE_PROJECT_ID="sunmoonai"
LLMOPS_SERVICE_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# ============================================================================
# 镜像配置
# ============================================================================
# Harbor 镜像仓库配置（deploy 命令使用 Harbor 镜像）
LLMOPS_SERVICE_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址
LLMOPS_SERVICE_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
LLMOPS_SERVICE_IMAGE_PULL_SECRET_NAME="harbor-registry-secret" # Harbor镜像拉取Secret名称

# ============================================================================
# 访问与端口配置
# ============================================================================
LLMOPS_SERVICE_TLS_ENABLED="true"                 # 通过 Traefik 终止 TLS
LLMOPS_SERVICE_UNIFIED_HOST="llmops.sunmoonai.com"    # 统一域名（用于路径前缀路由）
LLMOPS_SERVICE_NODE_IP="101.126.151.0"            # 节点公网 IP 地址（用于 IP 访问方式）

# ============================================================================
# LLMOps Service Secret 配置
# ============================================================================
LLMOPS_SERVICE_SECRET_NAME="llmops-service-secret"        # LLMOps Service Secret 名称
LLMOPS_SERVICE_CONFIGMAP_NAME="llmops-service-config"    # LLMOps Service ConfigMap 名称

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
secrets_enabled="true"          # 是否部署 LLMOps Service Secrets 和 ConfigMaps
ingress_enabled="true"          # 是否部署 Ingress 配置

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
secrets_priority=2000          # Secrets 优先级最高（最先部署，确保组件可用）
ingress_priority=100          # Ingress 优先级最低（最后部署，在服务之后）

# =========================================================================
# 推送后清理远程 tar 包开关
# =========================================================================
CLEANUP_REMOTE_TAR_AFTER_DEPLOY="false"

# ============================================================================
# 镜像构建说明
# ============================================================================
# 注意: 镜像构建已分离到源代码项目的 build/ 目录
# 构建镜像请使用: cd ../../../../../sunmoonai-llmops-service/build && ./build-image.sh build-push
# 部署脚本仅负责部署，不再包含构建功能
