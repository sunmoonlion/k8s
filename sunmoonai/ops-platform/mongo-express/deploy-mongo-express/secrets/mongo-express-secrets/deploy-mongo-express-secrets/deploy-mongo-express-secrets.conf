# =============================================================================
# Mongo Express Secret 部署配置
# 文件名: deploy-mongo-express-secrets.conf
# 用途: 配置Mongo Express认证Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="mongo-express-secrets"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-ops-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置
# =============================================================================

# Mongo Express 认证密码键名
MONGO_EXPRESS_AUTH_SECRET_PASSWORD_KEY="mongo-express-password"

# Mongo Express 管理员用户键名
MONGO_EXPRESS_ADMIN_USER_KEY="mongo-express-admin-user"

# 其他 Secret 键名（与 dev-values.yaml 中的配置保持一致）
MONGO_EXPRESS_MONGODB_AUTH_PASSWORD_KEY="mongodb-auth-password"
MONGO_EXPRESS_SITE_COOKIE_SECRET_KEY="site-cookie-secret"
MONGO_EXPRESS_SITE_SESSION_SECRET_KEY="site-session-secret"
MONGO_EXPRESS_BASIC_AUTH_PASSWORD_KEY="basic-auth-password"

# Mongo Express 密码（如果未设置，将生成随机密码）
mongo_express_password="${mongo_express_password:-}"

# Mongo Express 管理员用户（默认值）
mongo_express_admin_user="${mongo_express_admin_user:-admin}"

# MongoDB 认证密码（必须与 MongoDB Secret 中的 mongodb-passwords 值一致）
mongodb_auth_password="${mongodb_auth_password:-Mo!g1359}"

# Basic Auth 密码（Web 登录密码，如果未设置，将生成随机密码）
basic_auth_password="${basic_auth_password:-}"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
