# 后端数据库、迁移任务、私有路径和容量预算；秘密不入此文件。
---
knowmart_backend_deployment:
  database: knowmart
  database_runtime_user: knowmart_runtime
  database_migrator_user: knowmart_migrator
  database_bootstrap_revision: v2
  migration_job_revision: v1
  expected_schema_revision: '20261018_0006'
  deploy_budget_bytes: 2147483648
  redis_user: knowmart_runtime
  redis_key_pattern: 'knowmart:*'
  redis_identity_revision: v3
  rabbitmq_user: knowmart_runtime
  rabbitmq_vhost: knowmart
  rabbitmq_queue: knowmart.default
  rabbitmq_identity_revision: v2
  identity_organization: built-in
  # 普通用户所在组织（决策 D21、SDD 0014）：网页端应用挂这里；管理端仍在 built-in。
  identity_user_organization: sunmoonai
  identity_revision: v4
  # 跨应用跳转（SDD 0027）：工作台带用户来「我的分身」选一位，按登记的回跳地址回去（knowbench 的工作台）
  cross_app_enabled: true
  domain_env:
    # 登录完能回到「我的分身」（从工作台带来的 from、ref 不丢）；其余同模板默认
    WEB_AUTH_ALLOWED_RETURN_PATHS: '/zh-CN/dashboard,/en/dashboard,/zh-CN/login,/en/login,/zh-CN/knowbots,/en/knowbots'
  # 接收的跨应用服务关系（SDD 0027 P1）：只写接受谁的哪种关系，身份从调用方的 service_clients 推出来，
  # 不重复维护。内部入口在 traefik service-access 的 service_access_routes.knowmart。
  service_receivers:
    - {relation: deliver, caller: knowlab, enabled: true}
    - {relation: summon, caller: knowbench, enabled: true}
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    api: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: '2', memory: 768Mi}}
    worker: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
    scheduler: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
  # RabbitMQ 4.3不允许非持久非独占队列；Celery控制/事件队列随连接退出。
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
