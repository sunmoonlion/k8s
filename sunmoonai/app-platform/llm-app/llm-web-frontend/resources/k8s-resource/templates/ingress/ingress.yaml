# Llm Web Frontend 路由配置 (Traefik IngressRoute)
# Next.js standalone（SSR + BFF），含 /api/auth/* 内置路由，所有请求交给 Node.js server 处理。
#
# 访问方式：
# - https://llm.sunmoonai.com/
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: llm-web-frontend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: llm-web-frontend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
