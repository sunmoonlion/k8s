# ============================================================================
# toutiao-app-front ConfigMap YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/configmap/toutiao-app-front-config.yaml"
OUTPUT_FILE="toutiao-app-front-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ConfigMap 数据内容（非敏感）
NODE_ENV="${NODE_ENV:-production}"
NITRO_HOST="${NITRO_HOST:-0.0.0.0}"
NITRO_PORT="${NITRO_PORT:-3000}"
TOUTIAO_API_URL="${TOUTIAO_API_URL:-http://toutiao-app-backend.invest-app-dev.svc.cluster.local:5000}"
AUTH_BACKEND_URL="${AUTH_BACKEND_URL:-http://auth-app-backend.app-platform-dev.svc.cluster.local:3030/api/v1}"
AUTH_CLIENT_ID="${AUTH_CLIENT_ID:-toutiao-bff}"
SESSION_COOKIE_NAME="${SESSION_COOKIE_NAME:-toutiao_session}"
