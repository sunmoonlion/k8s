# ============================================================================
# celeryworker-investment-web-backend Celery Worker ConfigMap YAML 生成配置
# 只放 Worker 自身配置；业务数据库等配置从 investment-web-backend 的 ConfigMap/Secret 继承。
# ============================================================================

TEMPLATE_FILE="templates/configMap/celeryworker-investment-web-backend-config.yaml"
OUTPUT_FILE="celeryworker-investment-web-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

CELERY_APP_MODULE="${CELERY_APP_MODULE:-app.worker}"
CELERY_QUEUE="${CELERY_QUEUE:-investment.web.default}"
CELERY_CONCURRENCY="${CELERY_CONCURRENCY:-2}"
CELERY_LOG_LEVEL="${CELERY_LOG_LEVEL:-info}"
CELERY_INCLUDE_MODULES="${CELERY_INCLUDE_MODULES:-}"
CELERY_WORKER_PREFETCH_MULTIPLIER="${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
CELERY_TASK_ACKS_LATE="${CELERY_TASK_ACKS_LATE:-true}"
CELERY_WORKER_MAX_TASKS_PER_CHILD="${CELERY_WORKER_MAX_TASKS_PER_CHILD:-1000}"
