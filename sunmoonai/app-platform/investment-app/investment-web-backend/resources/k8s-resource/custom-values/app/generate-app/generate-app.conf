# ============================================================================
# investment-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/investment-web-backend.yaml"
OUTPUT_FILE="investment-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY="${INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_INVESTMENT_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
INVESTMENT_WEB_BACKEND_IMAGE_PROJECT="${INVESTMENT_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
INVESTMENT_WEB_BACKEND_IMAGE="${INVESTMENT_WEB_BACKEND_IMAGE:-investment-web-backend}"
INVESTMENT_WEB_BACKEND_TAG="${INVESTMENT_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
INVESTMENT_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${INVESTMENT_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
INVESTMENT_WEB_BACKEND_SECRET_NAME="${INVESTMENT_WEB_BACKEND_SECRET_NAME:-investment-web-backend-secret}"
INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME="${INVESTMENT_WEB_BACKEND_CONFIGMAP_NAME:-investment-web-backend-config}"
INVESTMENT_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME="${INVESTMENT_WEB_BACKEND_OBJECT_STORAGE_CONFIGMAP_NAME:-investment-web-backend-s3}"
INVESTMENT_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME="${INVESTMENT_WEB_BACKEND_OBJECT_STORAGE_SECRET_NAME:-investment-web-backend-s3}"
INVESTMENT_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME="${INVESTMENT_WEB_BACKEND_ELASTICSEARCH_CONFIGMAP_NAME:-investment-web-backend-elasticsearch}"
INVESTMENT_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME="${INVESTMENT_WEB_BACKEND_ELASTICSEARCH_SECRET_NAME:-investment-web-backend-elasticsearch}"
INVESTMENT_WEB_BACKEND_POSTGRESQL_SECRET_NAME="${INVESTMENT_WEB_BACKEND_POSTGRESQL_SECRET_NAME:-investment-web-backend-postgresql-conn}"
INVESTMENT_WEB_BACKEND_REDIS_SECRET_NAME="${INVESTMENT_WEB_BACKEND_REDIS_SECRET_NAME:-investment-web-backend-redis-conn}"
INVESTMENT_WEB_BACKEND_MONGODB_SECRET_NAME="${INVESTMENT_WEB_BACKEND_MONGODB_SECRET_NAME:-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-investment-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
