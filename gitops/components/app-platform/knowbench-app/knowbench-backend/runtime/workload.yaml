  KNOWMART_SUMMON_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  KNOWLAB_INTERNAL_URL: https://knowlab-tls.app-platform-dev.svc.cluster.local/api/internal/v1/knowlab
  KNOWLAB_READ_SERVICE_APPLICATION: "sunmoonai-knowbench-knowlab-read"
  KNOWLAB_READ_SERVICE_CLIENT_ID: "sunmoon-knowbench-knowlab-read"
  KNOWLAB_READ_SERVICE_SCOPE: "knowlab:read"
  KNOWLAB_READ_SERVICE_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  KNOWLAB_READ_SERVICE_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SERVICE_AUTH_TESTRUN_CALLERS: "knowlab"
  SERVICE_AUTH_TESTRUN_KNOWLAB_CASDOOR_APPLICATION: "sunmoonai-knowlab-knowbench-testrun"
  SERVICE_AUTH_TESTRUN_KNOWLAB_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  SERVICE_AUTH_TESTRUN_KNOWLAB_BACKCHANNEL_ENDPOINT: https://casdoor-tls.app-platform-dev.svc.cluster.local
  SERVICE_AUTH_TESTRUN_KNOWLAB_AUDIENCE: "sunmoon-knowlab-knowbench-testrun"
  SERVICE_AUTH_TESTRUN_KNOWLAB_SUBJECT_ALLOWLIST: "admin/sunmoonai-knowlab-knowbench-testrun"
  SERVICE_AUTH_TESTRUN_KNOWLAB_REQUIRED_SCOPE: "knowbench:testrun"
  CROSS_APP_TARGETS_JSON: "{\"knowfeed\": {\"web_base_url\": \"https://knowfeed.sunmoonai.com:30443\"}, \"knowbase\": {\"web_base_url\": \"https://knowbase.sunmoonai.com:30443\"}, \"knowmart\": {\"web_base_url\": \"https://knowmart.sunmoonai.com:30443\"}}"
  CROSS_APP_SOURCES_JSON: "{\"knowbase\": {}, \"knowfeed\": {}}"
