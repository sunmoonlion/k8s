# User-facing maintainer identity; component runtime fields remain in the ELK config.
---

# Maintainer identity; permissions and current credential storage, never password values.
operator_account_elasticsearch:
  object: data-platform/elk/elasticsearch
  id: administrator
  username: elastic
  account_type: platform-administrator
  table_row: ''
  table_import: false
  current_file: '{{ services_config_dir }}/elk.yaml'
  current_field: elastic_password
  backup_file: '{{ services_backup_dir }}/elk.yaml'
  minimum_length: 8
  maximum_length: 128
  adapter: elasticsearch-admin
  initial_preset_supported: false
  protocol_check_supported: false
  rotation_supported: false
