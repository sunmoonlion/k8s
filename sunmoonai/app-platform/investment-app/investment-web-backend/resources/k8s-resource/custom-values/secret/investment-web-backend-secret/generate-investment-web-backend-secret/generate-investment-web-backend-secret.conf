# ============================================================================
# Investment Web Backend Secret YAML 生成配置
# 字段来源：investment-web-backend/app/.env（敏感字段）
# ⚠️ 含真实密码，绝不提交 git（已在 .gitignore 中排除）
# 使用前：cp generate-investment-web-backend-secret.conf.example \
#            generate-investment-web-backend-secret.conf
#         然后填入真实密码
# ============================================================================

TEMPLATE_FILE="templates/secret/investment-web-backend-secret.yaml"
OUTPUT_FILE="investment-web-backend-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# ============================================================================
# Secret 数据内容（⚠️ 敏感信息）
# ============================================================================
# PostgreSQL 完整连接字符串（Prisma 格式）
# k8s 内部地址：postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432
DATABASE_URL="${DATABASE_URL:-postgresql://investment_web_user:Po!s1359@postgresql-sunmoonai.data-platform-dev.svc.cluster.local:5432/investment_web}"

# Redis 密码（对应 .env REDIS_PASSWORD）
REDIS_PASSWORD="${REDIS_PASSWORD:-InvestmentWebRedisAcl_8k3Qm9xP2vL7nR4w}"

# Redis 完整 URI（含密码，供 ioredis 直连使用）
REDIS_URI="${REDIS_URI:-redis://investment_web_backend:InvestmentWebRedisAcl_8k3Qm9xP2vL7nR4w@redis-sunmoonai-master.data-platform-dev.svc.cluster.local:6379/0}"

# Casdoor 客户端密钥（对应 .env CASDOOR_CLIENT_SECRET）
CASDOOR_CLIENT_SECRET="${CASDOOR_CLIENT_SECRET:-e3c083d342dc5fb0644738c928b09bd59054acb1}"

# RabbitMQ producer 连接信息。vhost、用户、权限和队列由 messaging-platform/rabbitmq 的 app definitions 统一创建。
RABBITMQ_SERVICE_HOST="${RABBITMQ_SERVICE_HOST:-rabbitmq-sunmoonai.messaging-platform-dev.svc.cluster.local}"
RABBITMQ_SERVICE_PORT="${RABBITMQ_SERVICE_PORT:-5672}"
RABBITMQ_VHOST="${RABBITMQ_VHOST:-investment-development}"
RABBITMQ_QUEUE="${RABBITMQ_QUEUE:-investment.web.default}"
RABBITMQ_PRODUCER_USER="${RABBITMQ_PRODUCER_USER:-investment-web-backend-producer}"
RABBITMQ_PRODUCER_PASSWORD="${RABBITMQ_PRODUCER_PASSWORD:-investment-web-backend-producer-dev}"
RABBITMQ_PRODUCER_URL="${RABBITMQ_PRODUCER_URL:-amqp://${RABBITMQ_PRODUCER_USER}:${RABBITMQ_PRODUCER_PASSWORD}@${RABBITMQ_SERVICE_HOST}:${RABBITMQ_SERVICE_PORT}/${RABBITMQ_VHOST}}"
