# 推送镜像到 Harbor 的默认配置
# 路径可为相对本目录(push-to-harbor)或绝对路径
# 使用前请先：docker login <HARBOR_HOST>

# Harbor 地址（含端口）
HARBOR_HOST="harbor.sunmoonai.com:30443"
# Harbor 项目名
HARBOR_PROJECT="k8s-images"

# 默认镜像列表文件（一行一个镜像名，# 注释），多个用空格分隔；相对路径为相对本目录
# 留空则仅使用 DEFAULT_TAR_DIR；与 load-kind-images 的 DEFAULT_IMAGE_FILES 一致
# DEFAULT_IMAGE_FILES="images-default.txt"

# 默认 tar 目录：该目录内所有 .tar 会 load 后推送到 Harbor；相对路径为相对本目录
DEFAULT_TAR_DIR="tar-default-dir"
