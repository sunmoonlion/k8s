# =============================================================================
# ONLYOFFICE RabbitMQ Secret 部署配置
# 文件名: deploy-onlyoffice-rabbitmq-secret.conf
# 用途: 配置 ONLYOFFICE Docs 连接 RabbitMQ 的认证 Secret
# =============================================================================

SECRET_NAME="onlyoffice-rabbitmq-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"
SECRET_TYPE="Opaque"

# =============================================================================
# RabbitMQ 密码配置
# ⚠️  重要：这是 ONLYOFFICE Docs 专用 RabbitMQ 用户的密码！
# =============================================================================
# RabbitMQ 用户密码
# 用户名：onlyoffice_docs（在 deploy-onlyoffice-docs.conf 中配置）
# 虚拟主机：/（在 deploy-onlyoffice-docs.conf 中配置）
# 
# 部署前请确保：
# 1. 在 RabbitMQ 中已创建用户：rabbitmqctl add_user onlyoffice_docs your_password
# 2. 已授予权限：rabbitmqctl set_permissions -p / onlyoffice_docs ".*" ".*" ".*"
# 3. 此密码与创建用户时设置的密码保持一致
#
# 如果为空，脚本将提示错误
# 请在此处设置密码，例如：
# RABBITMQ_PASSWORD="your_rabbitmq_password_here"
RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD:-}"

# 目标 Secret 键名（ONLYOFFICE Docs 使用的键名）
TARGET_SECRET_KEY="rabbitmq-password"

RESTART_COMPONENTS="false"
RESTART_PRIORITY="50"

