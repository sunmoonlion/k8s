apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-converter
  namespace: ${NAMESPACE}
  labels:
    app: document-converter
spec:
  replicas: ${DOCUMENT_CONVERTER_REPLICAS}
  selector:
    matchLabels:
      app: document-converter
  template:
    metadata:
      labels:
        app: document-converter
    spec:
      imagePullSecrets:
      - name: ${DOCUMENT_CONVERTER_IMAGE_PULL_SECRET_NAME}
      containers:
      - name: document-converter
        image: ${DOCUMENT_CONVERTER_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY}
        ports:
        - containerPort: ${DOCUMENT_CONVERTER_SERVICE_PORT}
        envFrom:
        - configMapRef:
            name: ${DOCUMENT_CONVERTER_CONFIGMAP_NAME}
        - secretRef:
            name: ${DOCUMENT_CONVERTER_SECRET_NAME}
        resources:
          requests:
            memory: "${DOCUMENT_CONVERTER_MEMORY_REQUEST}"
            cpu: "${DOCUMENT_CONVERTER_CPU_REQUEST}"
          limits:
            memory: "${DOCUMENT_CONVERTER_MEMORY_LIMIT}"
            cpu: "${DOCUMENT_CONVERTER_CPU_LIMIT}"
        livenessProbe:
          httpGet:
            path: /health
            port: ${DOCUMENT_CONVERTER_SERVICE_PORT}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: ${DOCUMENT_CONVERTER_SERVICE_PORT}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: document-converter
  namespace: ${NAMESPACE}
  labels:
    app: document-converter
spec:
  selector:
    app: document-converter
  ports:
  - port: ${DOCUMENT_CONVERTER_SERVICE_PORT}
    targetPort: ${DOCUMENT_CONVERTER_SERVICE_PORT}
    protocol: TCP
  type: ClusterIP

