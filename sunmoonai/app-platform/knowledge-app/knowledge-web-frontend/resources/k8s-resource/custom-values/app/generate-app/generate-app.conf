# ============================================================================
# knowledge-web-frontend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/knowledge-web-frontend.yaml"
OUTPUT_FILE="knowledge-web-frontend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
KNOWLEDGE_WEB_FRONTEND_IMAGE_REGISTRY="${KNOWLEDGE_WEB_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_KNOWLEDGE_WEB_FRONTEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
KNOWLEDGE_WEB_FRONTEND_IMAGE_PROJECT="${KNOWLEDGE_WEB_FRONTEND_IMAGE_PROJECT:-app-images}"
KNOWLEDGE_WEB_FRONTEND_IMAGE="${KNOWLEDGE_WEB_FRONTEND_IMAGE:-knowledge-web-frontend}"
KNOWLEDGE_WEB_FRONTEND_TAG="${KNOWLEDGE_WEB_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
KNOWLEDGE_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
KNOWLEDGE_WEB_FRONTEND_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_SECRET_NAME:-knowledge-web-frontend-secret}"
KNOWLEDGE_WEB_FRONTEND_CONFIGMAP_NAME="${KNOWLEDGE_WEB_FRONTEND_CONFIGMAP_NAME:-knowledge-web-frontend-config}"
KNOWLEDGE_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME="${KNOWLEDGE_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME-}"
KNOWLEDGE_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME-}"
KNOWLEDGE_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME="${KNOWLEDGE_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME-}"
KNOWLEDGE_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME-}"
KNOWLEDGE_WEB_FRONTEND_POSTGRESQL_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_POSTGRESQL_SECRET_NAME-}"
KNOWLEDGE_WEB_FRONTEND_REDIS_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_REDIS_SECRET_NAME-}"
KNOWLEDGE_WEB_FRONTEND_MONGODB_SECRET_NAME="${KNOWLEDGE_WEB_FRONTEND_MONGODB_SECRET_NAME-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-knowledge-web-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
