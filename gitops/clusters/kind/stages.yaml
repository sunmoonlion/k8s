---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: casdoor-db, namespace: flux-system}
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 15m
  path: ./components/app-platform/auth-app/casdoor/database
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn:
    - {name: postgresql}
  prune: false
  deletionPolicy: Orphan
  wait: false
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: casdoor-database-v1
      namespace: data-platform-dev

  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: casdoor-init, namespace: flux-system}
spec:
