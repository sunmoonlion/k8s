ENV="${ENV:-dev}"

# 镜像配置
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
KIND_CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE_PROJECT="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE_PROJECT:-app-images}"
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_IMAGE:-knowledge-admin-backend}"
CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_TAG="${CELERYWORKER_KNOWLEDGE_ADMIN_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
