apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker-research-admin-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker-research-admin-backend
    component: celery-worker
    backend: research-admin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celeryworker-research-admin-backend
  template:
    metadata:
      labels:
        app: celeryworker-research-admin-backend
        component: celery-worker
        backend: research-admin-backend
    spec:
      imagePullSecrets:
      - name: ${CELERYWORKER_RESEARCH_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: celeryworker
        image: ${CELERYWORKER_RESEARCH_ADMIN_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        command:
        - sh
        - -c
        - |
          set -eu
          if [ -n "$(printenv CELERY_INCLUDE_MODULES)" ]; then
            exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
              -I "$(printenv CELERY_INCLUDE_MODULES)" \
              -l "$(printenv CELERY_LOG_LEVEL)" \
              -Q "$(printenv CELERY_QUEUE)" \
              -c "$(printenv CELERY_CONCURRENCY)"
          fi
          exec celery -A "$(printenv CELERY_APP_MODULE)" worker \
            -l "$(printenv CELERY_LOG_LEVEL)" \
            -Q "$(printenv CELERY_QUEUE)" \
            -c "$(printenv CELERY_CONCURRENCY)"
        envFrom:
        - configMapRef:
            name: ${RESEARCH_ADMIN_BACKEND_CONFIGMAP_NAME:-research-admin-backend-config}
        - secretRef:
            name: ${RESEARCH_ADMIN_BACKEND_SECRET_NAME:-research-admin-backend-secret}
        - configMapRef:
            name: ${CELERYWORKER_RESEARCH_ADMIN_BACKEND_CONFIGMAP_NAME:-celeryworker-research-admin-backend-config}
        - secretRef:
            name: ${CELERYWORKER_RESEARCH_ADMIN_BACKEND_SECRET_NAME:-celeryworker-research-admin-backend-secret}
${RESEARCH_ADMIN_BACKEND_DATABASE_ENV_FROM}
${RESEARCH_ADMIN_BACKEND_OBJECT_STORAGE_ENV_FROM}
${RESEARCH_ADMIN_BACKEND_ELASTICSEARCH_ENV_FROM}
        env:
        - name: CELERY_PRODUCER_SERVICE
          value: "research-admin-backend"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - celery -A app.worker inspect ping --timeout 10
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - grep -aq celery /proc/1/cmdline
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
