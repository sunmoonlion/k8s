# ArgoCD 基础配置模板
# 基于 Bitnami ArgoCD 3.1.1

# ========================================
# 镜像配置
# ========================================
image:
  registry: docker.io
  repository: bitnami/argo-cd
  tag: "{{ .Values.image.tag | default .Values.image.version }}"
  pullPolicy: "{{ .Values.image.pullPolicy }}"
  pullSecrets: "{{ .Values.image.pullSecrets }}"

# ========================================
# 认证配置
# ========================================
auth:
  enabled: "{{ .Values.auth.enabled }}"
  adminUsername: "{{ .Values.auth.adminUsername }}"
  adminPassword: "{{ .Values.auth.adminPassword }}"
  dex:
    enabled: "{{ .Values.auth.dex.enabled }}"
    image:
      registry: docker.io
      repository: bitnami/dex
      tag: "{{ .Values.auth.dex.image.tag }}"
  tls:
    enabled: "{{ .Values.auth.tls.enabled }}"
    certificatesSecret: "{{ .Values.auth.tls.certificatesSecret }}"
    certificateFilename: "{{ .Values.auth.tls.certificateFilename }}"
    certificateKeyFilename: "{{ .Values.auth.tls.certificateKeyFilename }}"

# ========================================
# 持久化配置
# ========================================
persistence:
  enabled: "{{ .Values.persistence.enabled }}"
  storageClass: "{{ .Values.persistence.storageClass }}"
  accessMode: "{{ .Values.persistence.accessMode }}"
  size: "{{ .Values.persistence.size }}"
  mountPath: "{{ .Values.persistence.mountPath }}"

# ========================================
# 资源配置
# ========================================
resources:
  limits:
    cpu: "{{ .Values.resources.limits.cpu }}"
    memory: "{{ .Values.resources.limits.memory }}"
  requests:
    cpu: "{{ .Values.resources.requests.cpu }}"
    memory: "{{ .Values.resources.requests.memory }}"

# ========================================
# 探针配置
# ========================================
livenessProbe:
  enabled: "{{ .Values.livenessProbe.enabled }}"
  initialDelaySeconds: "{{ .Values.livenessProbe.initialDelaySeconds }}"
  periodSeconds: "{{ .Values.livenessProbe.periodSeconds }}"
  timeoutSeconds: "{{ .Values.livenessProbe.timeoutSeconds }}"
  failureThreshold: "{{ .Values.livenessProbe.failureThreshold }}"
  successThreshold: "{{ .Values.livenessProbe.successThreshold }}"
  path: "{{ .Values.livenessProbe.path }}"

readinessProbe:
  enabled: "{{ .Values.readinessProbe.enabled }}"
  initialDelaySeconds: "{{ .Values.readinessProbe.initialDelaySeconds }}"
  periodSeconds: "{{ .Values.readinessProbe.periodSeconds }}"
  timeoutSeconds: "{{ .Values.readinessProbe.timeoutSeconds }}"
  failureThreshold: "{{ .Values.readinessProbe.failureThreshold }}"
  successThreshold: "{{ .Values.readinessProbe.successThreshold }}"
  path: "{{ .Values.readinessProbe.path }}"

# ========================================
# 监控配置
# ========================================
metrics:
  enabled: "{{ .Values.metrics.enabled }}"
  serviceMonitor:
    enabled: "{{ .Values.metrics.serviceMonitor.enabled }}"
    interval: "{{ .Values.metrics.serviceMonitor.interval }}"
    scrapeTimeout: "{{ .Values.metrics.serviceMonitor.scrapeTimeout }}"
    additionalLabels: "{{ .Values.metrics.serviceMonitor.additionalLabels }}"

# ========================================
# 网络策略配置
# ========================================
networkPolicy:
  enabled: "{{ .Values.networkPolicy.enabled }}"
  ingressRules: "{{ .Values.networkPolicy.ingressRules }}"
  egressRules: "{{ .Values.networkPolicy.egressRules }}"

# ========================================
# 自动扩缩容配置
# ========================================
autoscaling:
  enabled: "{{ .Values.autoscaling.enabled }}"
  minReplicas: "{{ .Values.autoscaling.minReplicas }}"
  maxReplicas: "{{ .Values.autoscaling.maxReplicas }}"
  targetCPUUtilizationPercentage: "{{ .Values.autoscaling.targetCPUUtilizationPercentage }}"
  targetMemoryUtilizationPercentage: "{{ .Values.autoscaling.targetMemoryUtilizationPercentage }}"

# ========================================
# 备份配置
# ========================================
backup:
  enabled: "{{ .Values.backup.enabled }}"
  schedule: "{{ .Values.backup.schedule }}"
  retention: "{{ .Values.backup.retention }}"
  storage:
    type: "{{ .Values.backup.storage.type }}"
    bucket: "{{ .Values.backup.storage.bucket }}"
    region: "{{ .Values.backup.storage.region }}"

# ========================================
# ArgoCD 特定配置
# ========================================
argocd:
  # 服务器配置
  server:
    host: "{{ .Values.argocd.server.host }}"
    port: "{{ .Values.argocd.server.port }}"
    name: "{{ .Values.argocd.server.name }}"
    basePath: "{{ .Values.argocd.server.basePath }}"
    rewriteBasePath: "{{ .Values.argocd.server.rewriteBasePath }}"
    insecure: "{{ .Values.argocd.server.insecure }}"
    extraArgs: "{{ .Values.argocd.server.extraArgs }}"
  
  # 仓库服务器配置
  repoServer:
    parallelismLimit: "{{ .Values.argocd.repoServer.parallelismLimit }}"
    resources:
      limits:
        cpu: "{{ .Values.argocd.repoServer.resources.limits.cpu }}"
        memory: "{{ .Values.argocd.repoServer.resources.limits.memory }}"
      requests:
        cpu: "{{ .Values.argocd.repoServer.resources.requests.cpu }}"
        memory: "{{ .Values.argocd.repoServer.resources.requests.memory }}"
  
  # 应用控制器配置
  applicationController:
    parallelismLimit: "{{ .Values.argocd.applicationController.parallelismLimit }}"
    resources:
      limits:
        cpu: "{{ .Values.argocd.applicationController.resources.limits.cpu }}"
        memory: "{{ .Values.argocd.applicationController.resources.limits.memory }}"
      requests:
        cpu: "{{ .Values.argocd.applicationController.resources.requests.cpu }}"
        memory: "{{ .Values.argocd.applicationController.resources.requests.memory }}"
  
  # 日志配置
  logging:
    verbose: "{{ .Values.argocd.logging.verbose }}"
    level: "{{ .Values.argocd.logging.level }}"
  
  # 高可用配置
  ha:
    enabled: "{{ .Values.argocd.ha.enabled }}"
    replicas: "{{ .Values.argocd.ha.replicas }}"
  
  # Redis 配置
  redis:
    enabled: "{{ .Values.argocd.redis.enabled }}"
    image:
      registry: docker.io
      repository: bitnami/redis
      tag: "{{ .Values.argocd.redis.image.tag }}"
    auth:
      enabled: "{{ .Values.argocd.redis.auth.enabled }}"
      password: "{{ .Values.argocd.redis.auth.password }}"

# ========================================
# 服务配置
# ========================================
service:
  type: "{{ .Values.service.type }}"
  port: "{{ .Values.service.port }}"
  targetPort: "{{ .Values.service.targetPort }}"
  httpsPort: "{{ .Values.service.httpsPort }}"
  annotations: "{{ .Values.service.annotations }}"
  labels: "{{ .Values.service.labels }}"

# ========================================
# Ingress 配置
# ========================================
ingress:
  enabled: "{{ .Values.ingress.enabled }}"
  className: "{{ .Values.ingress.className }}"
  annotations: "{{ .Values.ingress.annotations }}"
  hosts: "{{ .Values.ingress.hosts }}"
  tls: "{{ .Values.ingress.tls }}"

# ========================================
# 安全上下文配置
# ========================================
securityContext:
  enabled: "{{ .Values.securityContext.enabled }}"
  runAsUser: "{{ .Values.securityContext.runAsUser }}"
  runAsGroup: "{{ .Values.securityContext.runAsGroup }}"
  fsGroup: "{{ .Values.securityContext.fsGroup }}"
  runAsNonRoot: "{{ .Values.securityContext.runAsNonRoot }}"

podSecurityContext:
  enabled: "{{ .Values.podSecurityContext.enabled }}"
  runAsUser: "{{ .Values.podSecurityContext.runAsUser }}"
  runAsGroup: "{{ .Values.podSecurityContext.runAsGroup }}"
  fsGroup: "{{ .Values.podSecurityContext.fsGroup }}"
  runAsNonRoot: "{{ .Values.podSecurityContext.runAsNonRoot }}"

# ========================================
# 节点选择器和容忍度
# ========================================
nodeSelector: "{{ .Values.nodeSelector }}"
tolerations: "{{ .Values.tolerations }}"
affinity: "{{ .Values.affinity }}"

# ========================================
# 标签和注解
# ========================================
labels: "{{ .Values.labels }}"
annotations: "{{ .Values.annotations }}"

# ========================================
# 环境变量
# ========================================
extraEnvVars: "{{ .Values.extraEnvVars }}"
extraEnvVarsCM: "{{ .Values.extraEnvVarsCM }}"
extraEnvVarsSecret: "{{ .Values.extraEnvVarsSecret }}"

# ========================================
# 卷挂载
# ========================================
extraVolumes: "{{ .Values.extraVolumes }}"
extraVolumeMounts: "{{ .Values.extraVolumeMounts }}"

# ========================================
# 初始化容器
# ========================================
initContainers: "{{ .Values.initContainers }}"

# ========================================
# 侧边容器
# ========================================
sidecars: "{{ .Values.sidecars }}"

# ========================================
# 生命周期钩子
# ========================================
lifecycleHooks: "{{ .Values.lifecycleHooks }}"

# ========================================
# 终止宽限期
# ========================================
terminationGracePeriodSeconds: "{{ .Values.terminationGracePeriodSeconds }}"
