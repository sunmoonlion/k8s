# ============================================================================
# Middleware 部署配置
# ============================================================================
# 中间件子级部署控制标志

# 基础配置
PROJECT_ID="sunmoonai"
NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件控制标志
# ============================================================================
# 控制是否部署各个中间件组件
middleware_timeout_enabled="false"     # 是否部署超时中间件（Traefik v3 不支持 timeout 中间件）
middleware_buffering_enabled="true"     # 是否部署缓冲中间件

# ============================================================================
# 中间件特定配置
# ============================================================================
# 超时配置
MIDDLEWARE_TIMEOUT_CONNECT="10s"
MIDDLEWARE_TIMEOUT_RESPONSE="3600s"

# 缓冲配置
MIDDLEWARE_BUFFERING_MAX_REQUEST="0"
MIDDLEWARE_BUFFERING_MAX_RESPONSE="0"
