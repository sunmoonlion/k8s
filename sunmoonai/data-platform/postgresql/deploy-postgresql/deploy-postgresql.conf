# PostgreSQL 部署精简配置（生产最小增强版）
# 仅保留必须字段，其余通过 chart 默认或 values 文件控制

# ============================================================================
# 基础配置
# ============================================================================
POSTGRESQL_PROJECT_ID="sunmoonai"
POSTGRESQL_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"   # production|development

# ============================================================================
# 部署模式配置
# ============================================================================
# 部署模式：online（在线模式）| offline（离线模式）
DEPLOYMENT_MODE="online"

# 在线模式配置
ENABLE_OFFLINE_IMAGE_CHECK="false"  # 在线模式：禁用离线镜像检查

# 离线模式配置（保留，通过注释说明）
# ENABLE_OFFLINE_IMAGE_CHECK="true"   # 离线模式：启用离线镜像检查
# POSTGRESQL_FORCE_OFFLINE="true"     # 离线模式：强制离线部署

# ============================================================================
# 访问与端口配置
# ============================================================================
POSTGRESQL_EXTERNAL_HOST="llmops.sunmoonai.com"  # PostgreSQL访问域名（使用微服务统一域名，通过端口30444区分）
# POSTGRESQL_EXTERNAL_PORT 将从 Traefik Service 中动态获取（通过 get_postgresql_external_port 函数）
# 如果未设置，脚本会自动从 Traefik Service 的 NodePort 中获取
# POSTGRESQL_EXTERNAL_PORT="${POSTGRESQL_EXTERNAL_PORT:-$(get_postgresql_external_port)}"
POSTGRESQL_TLS_ENABLED="false"                         # 通过 Traefik 终止 TLS，PostgreSQL 自身不启用 TLS

# ============================================================================
# TLS 配置
# ============================================================================
POSTGRESQL_TLS_AUTO_GENERATED="false"                  # 使用证书管理系统生成的证书
POSTGRESQL_TLS_CERTIFICATES_SECRET="postgresql-tls-secret"  # TLS证书Secret名称
POSTGRESQL_TLS_CERT_FILENAME="tls.crt"                 # 证书文件名
POSTGRESQL_TLS_CERT_KEY_FILENAME="tls.key"             # 证书密钥文件名
POSTGRESQL_TLS_CERT_CA_FILENAME="ca.crt"               # CA证书文件名

# ============================================================================
# PostgreSQL Secret 配置
# 
# ⚠️  重要：PostgreSQL Chart 要求 Secret 键名使用小写字母！
#      - PostgreSQL Helm Chart 要求键名为小写字母（如 admin_password）
#      - 不能使用大写字母（如 ADMIN_PASSWORD）
#      - 这是 PostgreSQL Chart 的特定要求，不是 Kubernetes 的通用规则
#      - 其他应用的 Secret 键名要求可能不同
# ============================================================================
POSTGRESQL_AUTH_SECRET_NAME="postgresql-auth-secret"                    # PostgreSQL 认证 Secret 名称
POSTGRESQL_AUTH_SECRET_ADMIN_PASSWORD_KEY="admin_password"        # PostgreSQL 管理员密码键名
POSTGRESQL_AUTH_SECRET_DEV_PASSWORD_KEY="dev_password"            # PostgreSQL 应用用户密码键名

# ============================================================================
# 镜像仓库配置（在线模式使用）
# ============================================================================
POSTGRESQL_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"       # 镜像仓库地址（与统一域名一致）
POSTGRESQL_IMAGE_PROJECT="k8s-images"                     # 镜像项目名
POSTGRESQL_IMAGE_PULL_SECRET_NAME="harbor-registry-secret" # Harbor镜像拉取Secret名称

# 镜像版本配置（来源：resources/postgresql/Chart.yaml annotations.images）
# 注意：这些配置仅在离线部署模式（ENABLE_OFFLINE_IMAGE_CHECK=true 或 FORCE_IMAGE_CHECK=true）时使用
# 在线部署模式下，PostgreSQL Chart会自动使用最新版本的镜像
# bitnami/postgresql:17.6.0-debian-12-r4
POSTGRESQL_IMAGE_VERSION="17.6.0-debian-12-r4"
# bitnami/postgresql-exporter:0.17.1-debian-12-r16
POSTGRESQL_METRICS_IMAGE_VERSION="0.17.1-debian-12-r16"
# bitnami/os-shell:12-debian-12-r51
POSTGRESQL_OS_SHELL_IMAGE_VERSION="12-debian-12-r51"

# ============================================================================
# 子级部署控制
# ============================================================================
# 控制是否部署各个子级组件
secrets_enabled="true"          # 是否部署 PostgreSQL Secrets（认证密钥、数据库密钥等）
middleware_enabled="true"       # 是否部署 Traefik 中间件
ingress_enabled="true"          # 是否部署 Ingress 配置

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
secrets_priority=2000          # Secrets 优先级最高（最先部署，确保组件可用）
middleware_priority=1000       # 中间件优先级中等
ingress_priority=100          # Ingress 优先级最低


