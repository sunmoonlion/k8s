# =============================================================================
# LLMOps Service Secret 部署配置
# 文件名: deploy-llmops-service-secret.conf
# 用途: 配置 LLMOps Service Secret 的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="llmops-service-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret值配置（⚠️ 必须修改为实际值）
# =============================================================================

# 应用密钥（⚠️ 必须修改为安全的随机字符串）
SECRET_KEY="${SECRET_KEY:-changeme}"
TOTP_SECRET_KEY="${TOTP_SECRET_KEY:-changeme}"

# 数据库/图数据库认证（⚠️ 必须修改为实际密码）
POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-zym123}"
NEO4J_PASSWORD="${NEO4J_PASSWORD:-zym123}"

# 管理员账户（⚠️ 必须修改为实际值）
FIRST_SUPERUSER="${FIRST_SUPERUSER:-admin@example.com}"
FIRST_SUPERUSER_PASSWORD="${FIRST_SUPERUSER_PASSWORD:-changeme}"

# SMTP / 监控（可选）
SMTP_USER="${SMTP_USER:-}"
SMTP_PASSWORD="${SMTP_PASSWORD:-}"
SENTRY_DSN="${SENTRY_DSN:-}"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"

