# ============================================================================
# Traefik 基础配置
# ============================================================================
TRAEFIK_PROJECT_ID="sunmoonai"
TRAEFIK_NAMESPACE="ingress-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 镜像检查配置
# ============================================================================
# 是否在部署前进行离线镜像检查（默认 false）。
# 仅当设置为 "true" 时，才会执行镜像存在性检查。
# 可用环境变量 FORCE_IMAGE_CHECK=true 临时强制开启。
ENABLE_OFFLINE_IMAGE_CHECK="true"

# ============================================================================
# 镜像版本配置
# ============================================================================
# traefik:v3.5.2
TRAEFIK_IMAGE_VERSION="v3.5.2"
# traefik:v3.5.2 (生产环境可能需要不同版本)
TRAEFIK_PROD_IMAGE_VERSION="v3.5.2"

# ============================================================================
# 子级部署控制标志
# ============================================================================
# 控制是否部署各个子级组件
secrets_enabled="true"              # 是否由 Traefik 组件触发下发自身所需的 Secrets（如 traefik-tls-secret）
middleware_enabled="true"           # 是否部署 Traefik 中间件
middleware_buffering_enabled="true" # 是否部署缓冲中间件

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
secrets_priority=2000               # Secrets 最优先（确保核心组件可用的前提）
middleware_priority=1000            # 其次是中间件
middleware_buffering_priority=900   # 缓冲中间件优先级高

# ============================================================================
# CA 配置（Traefik 专用）
# ============================================================================
# Traefik 使用的 CA 路径（用于生成服务器证书）
# 注意：
# - 默认使用绝对路径（基于 $HOME），避免 ~ 在脚本中未展开导致路径不存在
# - ensure-kind-ca.sh 与统一证书管理会将 CA 生成到同一路径
TRAEFIK_CA_LOCAL_DIR="${TRAEFIK_CA_LOCAL_DIR:-$HOME/k8s/sunmoonai/ingress-platform/traefik/deploy-traefik/secrets/traefik-tls-secret/ca}"

# ============================================================================
# iptables 自动配置
# ============================================================================
# 是否在 Traefik 部署后自动配置所有节点的 iptables 转发规则（80/443 -> 30080/30443）
# 默认: true（自动配置）
# 设置为 false 可禁用自动配置，需要手动在每个节点上执行脚本
# 环境变量 AUTO_CONFIG_IPTABLES 会覆盖此配置
AUTO_CONFIG_IPTABLES="${AUTO_CONFIG_IPTABLES:-true}"

# SSH 连接配置（用于自动配置 iptables）
# 说明：节点 SSH 配置从 deploy-infrastructure-all.conf 中读取
#       脚本会自动读取 SERVER_n_PUBLIC_IP、SERVER_n_USER、SERVER_n_SECRET、SERVER_n_SSH_PORT 等配置
#       支持多集群配置（通过 CLUSTER 环境变量自动选择对应的 C{数字}_SERVER_n_* 配置）
#
# 如果节点配置不在 deploy-infrastructure-all.conf 中，可通过环境变量覆盖：
# SSH_USER: SSH 用户名（默认: root，会被 SERVER_n_USER 覆盖）
# SSH_KEY: SSH 私钥路径（默认: $HOME/.ssh/id_rsa，会被 SERVER_n_SECRET 覆盖）
# SSH_PORT: SSH 端口（默认: 22，会被 SERVER_n_SSH_PORT 覆盖）
# SSH_PASSWORD: SSH 密码（仅在无密钥时使用，会被 SERVER_n_PASS 覆盖）
