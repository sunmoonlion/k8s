# ============================================================================
# Harbor Registry Secret YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/secret/harbor-registry-secret.yaml"
OUTPUT_FILE="harbor-registry-secret-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="secret"

# 基础配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# Harbor Docker 认证配置（⚠️ 敏感信息）
# ============================================================================
DOCKER_SERVER="${DOCKER_SERVER:-harbor.sunmoonai.com}"
DOCKER_USERNAME="${DOCKER_USERNAME:-${HARBOR_ADMIN_USER:-${HARBOR_USERNAME:-${REGISTRY_USERNAME:-admin}}}}"
DOCKER_PASSWORD="${DOCKER_PASSWORD:-${HARBOR_ADMIN_PASSWORD:-${HARBOR_PASSWORD:-${REGISTRY_PASSWORD:-TODO_FILL_IN_HARBOR_PASSWORD}}}}"
