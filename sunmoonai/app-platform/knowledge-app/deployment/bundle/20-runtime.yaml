apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-backend-api
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: knowledge-backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: knowledge
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      sunmoonai.com/app: knowledge
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: knowledge
        sunmoonai.com/app: knowledge
        sunmoonai.com/managed-by: app-platform-v2
        sunmoonai.com/internal-provider: 'true'
      annotations:
        sunmoonai.com/release-id: v20-knowledge-stable-001
        sunmoonai.com/config-sha256: d8842a161ab2eeacb476a363fd1bcaa4312e6157603b0c1a6a0916f2e0ef2a16
    spec:
      serviceAccountName: knowledge-backend-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            sunmoonai.com/app: knowledge
            app.kubernetes.io/component: backend-api
      containers:
      - name: api
        image: harbor.sunmoonai.com:30443/app-images/knowledge-backend@sha256:38ef7c29a43e4a47a339ba06c6dd77bd0a31277035d1df31b0fc2ca69cd862c0
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        args:
        - app.bootstrap.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: knowledge-backend-config
        - secretRef:
            name: knowledge-info-ingest-service-binding
        - secretRef:
            name: knowledge-active-retrieval-service-binding
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-postgresql-conn
              key: DATABASE_URL
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-redis-conn
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-redis-conn
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-redis-conn
              key: REDIS_DB
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-redis-conn
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-redis-conn
              key: REDIS_PASSWORD
        - name: ADMIN_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: knowledge-browser-identity
              key: ADMIN_CLIENT_ID
        - name: ADMIN_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: knowledge-browser-identity
              key: ADMIN_CLIENT_SECRET
        - name: WEB_CASDOOR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: knowledge-browser-identity
              key: WEB_CLIENT_ID
        - name: WEB_CASDOOR_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: knowledge-browser-identity
              key: WEB_CLIENT_SECRET
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-broker
              key: CELERY_BROKER_URL
        - name: RAGFLOW_API_BASE
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_API_BASE
        - name: RAGFLOW_PARSE_POLL_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_PARSE_POLL_INTERVAL_SECONDS
        - name: RAGFLOW_PARSE_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RAGFLOW_PARSE_TIMEOUT_SECONDS
        - name: RETRIEVAL_DEFAULT_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RETRIEVAL_DEFAULT_TENANT_ID
        - name: RETRIEVAL_PROVIDER_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: knowledge-backend-config
              key: RETRIEVAL_PROVIDER_TIMEOUT_SECONDS
        - name: RETRIEVAL_DATASET_ALLOWLIST
          value: codex-smoke
        - name: RAGFLOW_API_KEY
          valueFrom:
            secretKeyRef:
              name: knowledge-ragflow-provider
              key: RAGFLOW_API_KEY
        startupProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: knowledge-backend
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            httpHeaders:
            - name: Host
              value: knowledge-backend
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            httpHeaders:
            - name: Host
              value: knowledge-backend
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -ec
              - sleep 10
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: knowledge-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      sunmoonai.com/app: knowledge
      app.kubernetes.io/component: backend-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: knowledge-backend-api
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: knowledge-backend-api
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
