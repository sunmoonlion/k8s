# ============================================================================
# info-admin-backend 部署配置
# 职责：部署控制参数，数据内容在 generate-*.conf 中
# ============================================================================

# TODO: 填写 PROJECT_ID 和 NAMESPACE
INFO_ADMIN_BACKEND_PROJECT_ID="${INFO_ADMIN_BACKEND_PROJECT_ID:-sunmoonai}"
INFO_ADMIN_BACKEND_NAMESPACE="${INFO_ADMIN_BACKEND_NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"   # production|development

# Harbor 地址不要写死为 harbor.sunmoonai.com:30443。
# 部署入口只传 kind/c1，由 k8s/utils/cluster-config-mapping.sh 统一解析。
INFO_ADMIN_BACKEND_IMAGE_REGISTRY="${INFO_ADMIN_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_INFO_ADMIN_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
DOCKER_SERVER="${DOCKER_SERVER:-harbor.sunmoonai.com}"
KIND_DOCKER_SERVER="harbor.sunmoonai.com:30443"
INFO_ADMIN_BACKEND_BROWSER_OIDC_SECRET_NAME="${INFO_ADMIN_BACKEND_BROWSER_OIDC_SECRET_NAME:-info-admin-backend-browser-oidc}"

# 组件开关（控制是否部署）
namespace_enabled="true"
secrets_enabled="true"
configmap_enabled="true"
middleware_enabled="false"
ingress_enabled="true"

# 部署优先级（数值越大越先部署）
namespace_priority=3000
secrets_priority=2000
configmap_priority=1900
middleware_priority=1000
ingress_priority=100
