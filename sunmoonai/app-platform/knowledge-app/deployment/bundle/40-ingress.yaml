apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge-admin-route
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`knowledge-admin.sunmoonai.com`) && PathPrefix(`/api`)
    services:
    - name: knowledge-backend
      port: 8000
    priority: 100
  - kind: Rule
    match: Host(`knowledge-admin.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: knowledge-admin-frontend
      port: 3000
    priority: 10
  tls:
    secretName: knowledge-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
