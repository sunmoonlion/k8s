# Kubernetes 集群管理配置文件
# 支持跳板机模式和直接访问模式
# 支持多集群配置（C1/C2）

# ========================================
# 全局配置
# ========================================
[GLOBAL]
# 默认访问方式 (bastion/direct)
default_mode=direct
# 自动停止连接 (true/false)
auto_stop=true
# 连接超时时间 (秒)
timeout=30
# 集群模式选择 (local/remote/kind)
# local: 使用本地 Kubernetes 集群 (~/.kube/config)
# remote: 使用远程 Kubernetes 集群 (通过 SSH 隧道)
# kind: 使用 kind (Kubernetes in Docker) 本地集群
cluster_mode=kind

# ========================================
# 全局默认集群配置（整个项目使用）
# ========================================
# 默认集群 (C1/C2/C3.../KIND)，用于整个 k8s 项目的所有脚本
# 优先级：命令行参数 --cluster > 环境变量 CLUSTER > 此配置项 > 硬编码默认值 C1
# 说明：
#   - 此配置项会被所有使用 cluster-config-mapping.sh 的脚本自动读取
#   - 包括：deploy-infrastructure-all.sh, package-sync.sh, deploy-all.sh 等
#   - 修改此值即可改变整个项目的默认集群，无需在每个脚本中单独修改
#   - 可通过环境变量 CLUSTER 或命令行参数 --cluster 临时覆盖
#   - 使用 kind 时，设置为 KIND
default_cluster=KIND

# ========================================
# 集群 C1 - 跳板机模式配置
# ========================================
[C1_BASTION]
# 跳板机地址[:端口]
host=47.103.135.26:1022
# SSH 用户名
user=zym
# 私钥文件路径 (留空则使用密码)
secret=~/.ssh/id_rsa
# SSH 密码 (使用私钥时可选)
pass=
# Sudo 密码 (用于访问 /etc/kubernetes/admin.conf)
sudo_pass=
# API 服务器地址[:端口] (通过跳板机访问的目标，公网地址)
api_server=115.190.64.131:1022
# Kubernetes API 端口 (用于隧道转发)
api_port=6443
# API 服务器用户名 (留空则使用跳板机用户名)
api_user=zym
# 本地绑定端口 (用于端口转发)
local_port=6441
# Kubeconfig 保存路径
kubeconfig=~/.kube/cluster-c1-admin.conf
# 绑定 API IP 到本地别名 (true/false)
bind_alias=true

# ========================================
# 集群 C1 - 直接访问模式配置
# ========================================
[C1_DIRECT]
# API 服务器地址[:端口] (直接访问的目标)
