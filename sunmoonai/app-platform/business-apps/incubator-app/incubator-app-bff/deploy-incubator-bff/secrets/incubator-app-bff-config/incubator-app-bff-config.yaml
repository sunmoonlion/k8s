apiVersion: v1
kind: ConfigMap
metadata:
  name: incubator-app-bff-config
  namespace: app-platform-dev
  labels:
    app: incubator-app-bff
data:
  # 服务器与项目
  PROJECT_NAME: "Incubator App BFF"
  SERVER_NAME: "incubator.sunmoonai.com"
  SERVER_HOST: "https://incubator.sunmoonai.com"
  SERVER_BOT: "Symona"

  # CORS（可按需调整，留空时服务端代码允许全部）
  BACKEND_CORS_ORIGINS: '["https://incubator.sunmoonai.com","https://incubator.sunmoonai.com:443"]'

  # 数据库/图数据库（非敏感部分）
  POSTGRES_SERVER: "101.126.151.0"
  POSTGRES_PORT: "30444"
  POSTGRES_USER: "sunmoonai_dev"
  POSTGRES_DB: "mydb"
  NEO4J_SERVER: "101.126.151.0"
  NEO4J_PORT: "7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_AUTH: "neo4j"
  NEO4J_BOLT: "bolt"

  # 功能开关与其他配置
  USERS_OPEN_REGISTRATION: "True"
  NEO4J_FORCE_TIMEZONE: "True"
  NEO4J_AUTO_INSTALL_LABELS: "True"
  NEO4J_MAX_CONNECTION_POOL_SIZE: "50"
  MULTI_MAX: "20"
  EMAIL_RESET_TOKEN_EXPIRE_HOURS: "48"
  EMAIL_TEMPLATES_DIR: "/app/app/email-templates/build"
  EMAIL_TEST_USER: "test@example.com"
