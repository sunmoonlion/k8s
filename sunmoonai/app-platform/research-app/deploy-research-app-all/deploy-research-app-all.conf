# ============================================================================
# Research App 业务应用配置
# ============================================================================
# LEGACY ROLLBACK ONLY: Architecture v2 的活动入口是 ../investment-app。
# 本配置只用于 R7 前恢复既有 Research 基线，不得承载新的 Investment 发布。
RESEARCH_APP_PROJECT_ID="sunmoonai"
RESEARCH_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"
RESEARCH_APP_IMAGE_TAG="${RESEARCH_APP_IMAGE_TAG:-1.0.0}"
RESEARCH_ADMIN_BACKEND_TAG="${RESEARCH_ADMIN_BACKEND_TAG:-1.0.1}"
CELERYWORKER_RESEARCH_ADMIN_BACKEND_TAG="${CELERYWORKER_RESEARCH_ADMIN_BACKEND_TAG:-1.0.1}"
# Research Admin remains the legacy Vue baseline. Research Web 1.0.1 is an
# isolated v4 Agent Console snapshot only; it is not Next Web v2 acceptance.
RESEARCH_ADMIN_FRONTEND_TAG="${RESEARCH_ADMIN_FRONTEND_TAG:-1.0.0}"
RESEARCH_WEB_FRONTEND_TAG="${RESEARCH_WEB_FRONTEND_TAG:-1.0.1}"

# App 源码根目录。Backend 的资源声明随源码维护。
RESEARCH_APP_SOURCE_ROOT="${RESEARCH_APP_SOURCE_ROOT:-${HOME}/research-app}"

# Backend 能力默认完整启用；是否启动组件由下面的集群开关决定。
research_admin_backend_database_access_enabled="true"
research_admin_backend_redis_access_enabled="true"
research_admin_backend_mongodb_access_enabled="false"
research_admin_backend_storage_access_enabled="true"
research_admin_backend_search_access_enabled="true"
research_web_backend_database_access_enabled="true"
research_web_backend_redis_access_enabled="true"
research_web_backend_mongodb_access_enabled="false"
research_web_backend_storage_access_enabled="true"
research_web_backend_search_access_enabled="true"

# C1 远程开发集群暂不部署平台 Elasticsearch；Kind 仍使用默认 search=true。
C1_research_admin_backend_search_access_enabled="false"
C1_research_web_backend_search_access_enabled="false"

research_admin_backend_configured="true"
research_admin_frontend_configured="true"
research_web_backend_configured="true"
