# ============================================================================
# SunmoonAI 项目总部署配置
# ============================================================================
SUNMOONAI_PROJECT_ID="sunmoonai"
# 注意：SunmoonAI 项目本身不需要总命名空间，各平台使用自己的命名空间
ENVIRONMENT="development"

# ============================================================================
# Kind 本地 vs 远程集群（C1/C2）说明
# ============================================================================
# - infrastructure / ingress-platform：面向「远程」集群（SSH 到节点、传 --cluster C1/C2），
#   会创建命名空间、配 Traefik 等。Kind 上不需要跑这两项，命名空间由 kind-infrastructure
#   的 kind-up.sh → apply-namespaces-existing-cluster.sh 创建，Traefik 等按 kind 文档单独部署。
# - Kind 上「完整跑一次」建议：不启用 infrastructure_enabled、ingress_platform_enabled；
#   只按需启用 cicd_platform（Harbor）、data_platform、ops_platform 等，然后执行：
#   export KUBECONFIG=$HOME/.kube/kind-config
#   ./deploy-sunmoonai-all.sh deploy sunmoonai development false

# ============================================================================
# 平台级部署控制标志
# ============================================================================
# 控制是否部署各个平台级组件
# ⚠ Kind 场景特别说明：
#   - 基础设施(infrastructure) / 入口平台(ingress-platform) / 集群内 Harbor 等，
#     已在 kind-infrastructure/deploy-kind.sh 阶段完成初始化；
#   - 若当前 KUBECONFIG 指向 Kind 集群，请务必保持下列开关为「注释」或显式设为 false，
#     避免再次对 Kind 集群重复执行远程 C1/C2 用的部署逻辑。
# infrastructure_enabled="true"       # 是否部署基础设施平台（仅远程 C1/C2，Kind 不启用）
# ingress_platform_enabled="true"     # 是否部署入口平台（仅远程，Kind 不启用）
# cicd_platform_enabled="true"        # 是否部署 CI/CD 平台（含 Harbor，Kind 场景由 deploy-kind 控制）
data_platform_enabled="true"      # 是否部署数据平台
messaging_platform_enabled="true" # 是否部署消息平台
ops_platform_enabled="true"       # 是否部署运维平台（pgadmin / mongo-express 等）

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
# infrastructure_priority=1000         # 基础设施优先级最高（最先部署）
# ingress_platform_priority=900        # 入口平台优先级高
# cicd_platform_priority=800           # CI/CD 平台优先级高
data_platform_priority=700           # 数据平台优先级中等
messaging_platform_priority=500      # 消息平台优先级中等
ops_platform_priority=400            # 运维平台优先级较低（最后部署）

# ============================================================================
# 平台特定配置
# ============================================================================
# 基础设施平台配置
INFRASTRUCTURE_NAMESPACE="infrastructure-dev"
INFRASTRUCTURE_ENVIRONMENT="development"

# 入口平台配置
INGRESS_PLATFORM_NAMESPACE="ingress-platform-dev"
INGRESS_PLATFORM_ENVIRONMENT="development"

# CI/CD 平台配置
CICD_PLATFORM_NAMESPACE="cicd-platform-dev"
CICD_PLATFORM_ENVIRONMENT="development"

# Harbor 配置
HARBOR_ADMIN_PASSWORD="Harbor@12345"  # Harbor 管理员密码
HARBOR_PROJECT_NAME="k8s-images"      # Harbor 镜像项目名称


# 数据平台配置
DATA_PLATFORM_NAMESPACE="data-platform-dev"
DATA_PLATFORM_ENVIRONMENT="development"

# 消息平台配置
MESSAGING_PLATFORM_NAMESPACE="messaging-platform-dev"
MESSAGING_PLATFORM_ENVIRONMENT="development"

# 运维平台配置
OPS_PLATFORM_NAMESPACE="ops-platform-dev"
OPS_PLATFORM_ENVIRONMENT="development"
