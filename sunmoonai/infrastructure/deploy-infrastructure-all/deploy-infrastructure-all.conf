# ============================
# Step00 集群重置（逆序撤销前面步骤）# ============================
# 强烈建议：仅在确认需要彻底回滚时启用；默认关闭以避免误触）
STEP00_ENABLED=true
STEP00_TARGET=all                       # master | worker | all
STEP00_RESTORE_HOSTNAME=true            # 将主机名恢复）SERVER_n_CURRENT_HOSTNAME
STEP00_RESTORE_SWAP=true                # 取消注释 /etc/fstab 中的 swap 条目）swapon -a
STEP00_REMOVE_SYSCTL_OVERRIDES=true     # 移除）Step01 写入）sysctl ）STEP00_REMOVE_KERNEL_MODULES=true       # 移除）Step01 加载/写入的内核模）STEP00_REMOVE_REMOTE_ARTIFACTS=false     # 删除远端离线工件（images/debs/tars）STEP00_REMOVE_RUNTIME=true              # 停止并移）containerd/nerdctl/CNI 可执行与配置
STEP00_REMOVE_K8S_PACKAGES=true         # 卸载 kubeadm/kubelet/kubectl 并移）APT ）STEP00_REMOVE_K8S_IMAGES=false           # 删除 nerdctl k8s.io 命名空间镜像
STEP00_REMOVE_NAMESPACES=true            # 清理所有非系统命名空间（app-platform-dev、data-platform-dev 等）

# ============================
# Step01 OS 基线与内核（swap / 内核模块 / sysctl 等）
# ============================
STEP01_ENABLED=true
STEP01_TARGET=all         # master | worker | all
STEP01_IPTABLES_MODE=nft  # nft | legacy
STEP01_DISABLE_SWAP=true
# 逗号分隔，键值用等号
STEP01_SYSCTL_OVERRIDES="net.ipv4.ip_forward=1,net.bridge.bridge-nf-call-iptables=1"
STEP01_LOAD_KERNEL_MODULES="overlay,br_netfilter,ip_vs,ip_vs_rr,ip_vs_wrr,ip_vs_sh,nf_conntrack"
STEP01_SET_HOSTNAME=true
STEP01_AUTOGEN_HOSTS=true
STEP01_SYNC_TIME=true

# ============================
# Step02 容器运行时（默认 nerdctl-full：含 containerd+runc+CNI+nerdctl）# ============================
STEP02_ENABLED=true
STEP02_TARGET=all
STEP02_RUNTIME_MODE=nerdctl-full   # nerdctl-full | containerd-apt | docker
STEP02_NERDCTL_VERSION=2.1.3
STEP02_NERDCTL_FULL_URL="https://github.com/containerd/nerdctl/releases/download/v2.1.3/nerdctl-full-2.1.3-linux-amd64.tar.gz"
STEP02_SYSTEMD_CGROUP=true
STEP02_SANDBOX_IMAGE="registry.k8s.io/pause:3.9"
STEP02_CNI_BIN_DIR="/opt/cni/bin"
STEP02_NERDCTL_NAMESPACE="k8s.io"

# Step02 镜像仓库（containerd hosts.toml）配置（可选）
# - STEP02_REGISTRY_ENABLE: 开关。为 true 时才写入下面）registry 配置（默）false）# - STEP02_REGISTRY_MIRRORS: 上游仓库）有序回退），仅影响 pull/resolve；分号分隔仓库，逗号分隔端点
#     端点按顺序优先（前优先、后回退）。示例（Harbor 代理优先，上游回退）：
#     'docker.io=https://harbor.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://harbor.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io'
# - STEP02_REGISTRY_DIRECT: 并列配置项，为某个私有仓库主机写"直连"端点，显式开）pull/push/resolve；支）主机:端口 ）http(s)://URL
#     未配置直连也）push/pull（走默认主机与协议，只要网络/认证正常即可）；直连用于明确端点/协议并确）push 能力。示例：
#     'harbor-4.sunmoonai.com:80' ）'https://harbor-4.sunmoonai.com'
#     注意：此配置主要用于告诉 containerd 这是一个合法的仓库端点，而不是配置认证和TLS）#     认证通过 docker login ）imagePullSecret 配置，TLS 通过系统 CA 证书）/etc/containerd/certs.d/ 配置）STEP02_REGISTRY_ENABLE=true

# 镜像仓库配置（多集群支持）# 说明：使）C{数字}_* 前缀区分不同集群的配置（）C1_*, C2_*, C3_* 等）
#       脚本会根）CLUSTER 自动将对应的 C*_STEP02_REGISTRY_* 映射）STEP02_REGISTRY_*
#       如果两个集群共享同一）Harbor，只需配置默认值即）
# 默认配置（如果两个集群共享同一）Harbor，只需配置这里）# 说明）#   - 如果 Harbor 中已创建 proxy-docker ）proxy-k8s 代理项目，可以使用下面的配置启用缓存
#   - 如果未创建代理项目，建议直接使用上游仓库（注释掉代理配置）#   - 使用 https:// 因为 Harbor 30443 端口）HTTPS
# 方式1：使）Harbor 代理缓存（需要先）Harbor UI 中创）proxy-docker ）proxy-k8s 项目）# STEP02_REGISTRY_MIRRORS="docker.io=https://harbor.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://harbor.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io"
# 方式2：直接使用上游仓库（如果未创建代理项目，使用此配置）
STEP02_REGISTRY_MIRRORS="docker.io=https://registry-1.docker.io;registry.k8s.io=https://registry.k8s.io"
STEP02_REGISTRY_DIRECT="harbor.sunmoonai.com:30443"

# 集群1镜像仓库配置（C1_* 前缀，如果需要不同的配置）# C1_STEP02_REGISTRY_MIRRORS="docker.io=https://www.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://www.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io"
# C1_STEP02_REGISTRY_DIRECT="www.sunmoonai.com:30443"

# 集群2镜像仓库配置（C2_* 前缀，如果需要不同的配置）# C2_STEP02_REGISTRY_MIRRORS="docker.io=https://www.sunmoonai.com:30443/proxy-docker,https://registry-1.docker.io;registry.k8s.io=https://www.sunmoonai.com:30443/proxy-k8s,https://registry.k8s.io"
# C2_STEP02_REGISTRY_DIRECT="www.sunmoonai.com:30443"

# CRI socket 路径配置（可选）
# - 留空使用默认路径：unix:///var/run/containerd/containerd.sock
# - 自定义路径示例：unix:///custom/path/containerd.sock
# - 注意：此配置会影）step02 containerd 安装）step04 kubeadm init
# - 格式：unix:///path/to/containerd.sock
STEP02_CRI_SOCKET_OVERRIDE=""

# 在线下载等操作的超时时间（秒），默认 300 ）STEP02_ONLINE_TIMEOUT=300

# ========================================
#
# 远程节点离线包预同步（可选）
# 说明：
# - PRE_SYNC_OFFLINE_PACKAGES=true 时，Step01 会在应用 OS 基线之前，
#   将本地 LOCAL_PACKAGES_ROOT/{debs,tars,images,charts} 同步到每个节点的 SERVER_n_DIR/{debs,tars,images,charts}。
# - 当为 false 时，保持现有行为，假定离线包已通过其他方式（手动/CI）提前分发到远程节点
PRE_SYNC_OFFLINE_PACKAGES="false"
# 本机离线包根目录（默认为 ~/packages-to-be-installed
LOCAL_PACKAGES_ROOT="$HOME/packages-to-be-installed"


# ============================
# Step13 Traefik / Harbor 部署
# ============================
# 说明）# - 该步骤负责在远程集群中调用现有的 Traefik ）Harbor 部署脚本）#   - ingress-platform/deploy-ingress-platform-all/deploy-ingress-platform-all.sh
#   - cicd-platform/harbor/deploy-harbor/deploy-harbor.sh deploy
# - 是否真正部署仍由各组件自身的配置开关决定（历史行为保持不变），
#   本步骤只负责在基础设施阶段触发部署调用）STEP13_ENABLED=true
STEP13_TARGET=master


# ============================
# Step03 Kubernetes 二进制（kubeadm/kubelet/kubectl）# ============================
STEP03_ENABLED=true
STEP03_TARGET=all
# 不设置时使用 CLUSTER_VERSION
STEP03_K8S_VERSION=""
STEP03_HOLD_PACKAGES=true
STEP03_KUBELET_EXTRA_ARGS="--cgroup-driver=systemd"
STEP03_APT_CHANNEL_AUTO=true
# 在线安装 apt update/install 的超时时间（秒），默）600 ）STEP03_ONLINE_TIMEOUT=600

# ============================
# Step04 控制面初始化（kubeadm init）# ============================
STEP04_ENABLED=true
STEP04_TARGET=master
STEP04_CONTROLPLANE_ENDPOINT=""   # 例：vip.example.com:6443（多 Master 时使用）
STEP04_POD_CIDR="10.244.0.0/16"
STEP04_SERVICE_CIDR="10.96.0.0/12"
STEP04_KUBE_PROXY_MODE="ipvs"  # iptables | ipvs
# 检测到上次失败残留）etc/kubernetes/manifests/*.yaml ）/var/lib/etcd）时，是否自动清理并重试
# 建议在全新重装流程中开启，以避）preflight 被残留文件阻）STEP04_AUTO_CLEAN_RESIDUALS=true
# 控制平面证书上传配置
# - true：将控制平面证书上传到集）Secret 中，其他节点加入时自动获取证）# - false：不上传证书，其他节点加入时需要手动复制证书文件或指定证书路径
# - 建议：通常设置）true，简化节点加入过程；仅在特殊安全要求下设置为 false
STEP04_UPLOAD_CERTS=true
# API Server 证书）Subject Alternative Names (SANs)
# - 用于指定 API Server 证书中允许的主机名、IP 地址或域）# - 格式：逗号分隔的列表，）"192.168.1.100,api.example.com,kubernetes.default.svc.cluster.local"
# - 常见用途：
#   * 负载均衡）IP：当使用负载均衡器访）API Server ）#   * 外部域名：当通过域名访问集群）#   * 内部服务名：kubernetes.default.svc.cluster.local
# - 留空：仅使用默认）localhost 和内部服务名，可通过ssh隧道远程访问
STEP04_APISERVER_CERT_SANS=""

# 可选：自定）CoreDNS ）Etcd 镜像版本（留空则）K8s 版本自动映射）# 注意：自定义版本可能）K8s 版本不兼容，脚本会发出警告但不会阻止执行
STEP04_COREDNS_IMAGE_TAG=""    # 例如 v1.11.1；留空则）1.30→v1.11.1）.29→v1.11.1）.28→v1.10.1
STEP04_ETCD_IMAGE_TAG=""       # 例如 3.5.12-0；留空则）1.30）.5.12-0）.29）.5.10-0）.28）.5.9-0

# ============================
# Step05 CNI 安装（通过 Helm 在线/离线安装）# ============================
STEP05_ENABLED=true
STEP05_TARGET=master
STEP05_CNI="calico"                # calico | flannel | cilium | weave

# CNI 版本配置（留空则根据 Kubernetes 版本自动选择）STEP05_CALICO_CHART_VERSION="3.28.2"    # 留空自动选择：K8s 1.28）.26.1, 1.29）.27.0, 1.30）.28.2
STEP05_FLANNEL_CHART_VERSION="0.25.0"
