apiVersion: v1
kind: ServiceAccount
metadata: {name: knowbase-runtime, namespace: app-platform-dev}
automountServiceAccountToken: false
imagePullSecrets: [{name: registry-puller}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: 'knowbase-database-v1', namespace: data-platform-dev}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: knowbase, sunmoonai.com/postgresql-client: 'true'}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: harbor.sunmoonai.com:30443/platform/postgresql@sha256:0377e72c5289ed2f98cf61b1a9c2db9eb9d300317fe14244492fbc94343b3d04
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: '1', memory: 256Mi}}
          env:
            - {name: PGHOST, value: 'postgresql.data-platform-dev.svc.cluster.local'}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: postgres}
            - {name: PGCONNECT_TIMEOUT, value: '10'}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: postgresql-auth, key: password}}}
            - {name: MIGRATOR_PASSWORD, valueFrom: {secretKeyRef: {name: knowbase-database-bootstrap, key: migrator_password}}}
            - {name: RUNTIME_PASSWORD, valueFrom: {secretKeyRef: {name: knowbase-database-bootstrap, key: runtime_password}}}
          command: [/bin/sh, -ec]
          args:
            - |
              psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
              \set VERBOSITY terse
              \getenv migrator_password MIGRATOR_PASSWORD
              \getenv runtime_password RUNTIME_PASSWORD
              SELECT pg_advisory_lock(hashtextextended('sunmoon/knowbase/database',0));
              DO $bootstrap$ BEGIN
                IF EXISTS (SELECT FROM pg_roles WHERE rolname IN ('knowbase_runtime','knowbase_migrator') AND shobj_description(oid,'pg_authid') IS DISTINCT FROM 'sunmoon-kind/knowbase') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing role';
                END IF;
                IF EXISTS (SELECT FROM pg_database WHERE datname='knowbase' AND shobj_description(oid,'pg_database') IS DISTINCT FROM 'sunmoon-kind/knowbase') THEN
                  RAISE EXCEPTION 'Refusing a foreign existing database';
                END IF;
              END $bootstrap$;
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','knowbase_migrator',:'migrator_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='knowbase_migrator') \gexec
              SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L','knowbase_runtime',:'runtime_password') WHERE NOT EXISTS(SELECT FROM pg_roles WHERE rolname='knowbase_runtime') \gexec
              COMMENT ON ROLE knowbase_migrator IS 'sunmoon-kind/knowbase';
              COMMENT ON ROLE knowbase_runtime IS 'sunmoon-kind/knowbase';
              SELECT format('CREATE DATABASE %I OWNER %I','knowbase','knowbase_migrator') WHERE NOT EXISTS(SELECT FROM pg_database WHERE datname='knowbase') \gexec
              COMMENT ON DATABASE knowbase IS 'sunmoon-kind/knowbase';
              REVOKE ALL ON DATABASE knowbase FROM PUBLIC;
              GRANT CONNECT ON DATABASE knowbase TO knowbase_runtime;
              SQL
              psql --no-psqlrc -d knowbase --set=ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
              PGPASSWORD="$MIGRATOR_PASSWORD" psql --no-psqlrc -U knowbase_migrator -d knowbase --set=ON_ERROR_STOP=1 <<'SQL'
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              GRANT USAGE ON SCHEMA public TO knowbase_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO knowbase_runtime;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE,SELECT ON SEQUENCES TO knowbase_runtime;
              SQL
              PGPASSWORD="$RUNTIME_PASSWORD" psql --no-psqlrc -U knowbase_runtime -d knowbase --set=ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
              echo 'KNOWBASE independent database identities verified'
