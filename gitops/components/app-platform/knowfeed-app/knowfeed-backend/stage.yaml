# 本组件的 Flux 阶段声明；所在目录即可选对象（OBJECT）。path 相对本目录；dependsOn 为阶段名；
# enabled/dependsOn 可用 Jinja 表达式，由 Ansible 按当前配置求值。图由 infrastructure/components/stages.py 扫描汇总。
---
prepare: {file: app-platform/common/backend/prepare.yaml, vars: {application_name: knowfeed}}
defaults: {enabled: '{{ knowfeed_deployment.enabled }}', timeout: 8m}
stages:
- name: knowfeed-database
  path: database
  dependsOn: [postgresql]
  resources: [workload.yaml, bootstrap.sops.yaml, runtime.sops.yaml]
- name: knowfeed-migration
  path: migration
  dependsOn: [knowfeed-database]
  resources: [workload.yaml, auth.sops.yaml]
- name: knowfeed-redis
  path: redis
  dependsOn: [knowfeed-migration, redis]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowfeed-rabbitmq
  path: rabbitmq
  dependsOn: [knowfeed-redis, rabbitmq]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowfeed-identity
  path: identity
  dependsOn: [knowfeed-rabbitmq, casdoor]
  resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]
- name: knowfeed-runtime
  path: runtime
  dependsOn: '{{ ["knowfeed-identity"] + (["knowfeed-service-identity"] if knowfeed_backend_deployment.knowbase_service.enabled | default(false) else []) + (["knowfeed-storage"] if knowfeed_backend_deployment.object_storage.enabled | default(false) else []) }}'
  resources: '{{ ["workload.yaml", "tls.sops.yaml"] + (["storage.sops.yaml"] if knowfeed_backend_deployment.object_storage.enabled | default(false) else []) + (["provider.sops.yaml"] if knowfeed_backend_deployment.knowledge_provider.enabled | default(false) else []) + (["service.sops.yaml"] if knowfeed_backend_deployment.knowbase_service.enabled | default(false) else []) + (["domain.sops.yaml"] if knowfeed_backend_deployment.domain_secrets | default({}) | length > 0 else []) }}'
- name: knowfeed-storage
  path: storage
  dependsOn: [object-storage]
  enabled: '{{ knowfeed_deployment.enabled and knowfeed_backend_deployment.object_storage.enabled | default(false) }}'
  resources: [workload.yaml, provision.sops.yaml]
- name: knowfeed-service-identity
  path: service-identity
  dependsOn: [casdoor, postgresql]
  enabled: '{{ knowfeed_deployment.enabled and knowfeed_backend_deployment.knowbase_service.enabled | default(false) }}'
  resources: [workload.yaml, provision.sops.yaml]
