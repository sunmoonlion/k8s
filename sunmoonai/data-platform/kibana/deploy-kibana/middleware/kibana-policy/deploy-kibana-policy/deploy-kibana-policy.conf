# Kibana 策略中间件部署配置

# 基础配置
KIBANA_PROJECT_ID="sunmoonai"
KIBANA_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
KIBANA_POLICY_TYPES="rateLimit,headers"

# 限流配置
KIBANA_RATE_LIMIT_AVERAGE="50"
KIBANA_RATE_LIMIT_BURST="100"

# 头部配置
KIBANA_HEADERS_CUSTOM_REQUEST_HEADERS="X-Kibana-Version:9.1.2"
KIBANA_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Kibana-Status:active"

