apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-service-config
  namespace: ${NAMESPACE}
  labels:
    app: llmops-service
data:
  # 服务器与项目
  PROJECT_NAME: "${PROJECT_NAME}"
  SERVER_NAME: "${SERVER_NAME}"
  SERVER_HOST: "${SERVER_HOST}"
  SERVER_BOT: "${SERVER_BOT}"

  # CORS（可按需调整，留空时服务端代码允许全部）
  BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS}'

  # 数据库/图数据库（非敏感部分）
  POSTGRES_SERVER: "${POSTGRES_SERVER}"
  POSTGRES_PORT: "${POSTGRES_PORT}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_DB: "${POSTGRES_DB}"
  
  # PostgreSQL 连接字符串模板（非敏感部分，密码在 Secret 中）
  POSTGRES_URL_TEMPLATE: "${POSTGRES_URL_TEMPLATE}"
  
  # PostgreSQL SSL 模式（非敏感部分）
  DB_SSLMODE: "${DB_SSLMODE}"
  
  # DB_* 格式字段（兼容性，非敏感部分）
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USER}"
  
  NEO4J_SERVER: "${NEO4J_SERVER}"
  NEO4J_PORT: "${NEO4J_PORT}"
  NEO4J_USERNAME: "${NEO4J_USERNAME}"
  NEO4J_AUTH: "${NEO4J_AUTH}"
  NEO4J_BOLT: "${NEO4J_BOLT}"
  
  # Neo4j 连接字符串模板（非敏感部分，密码在 Secret 中）
  NEO4J_BOLT_URL_TEMPLATE: "${NEO4J_BOLT_URL_TEMPLATE}"
  
  # Neo4j 查询限制配置
  NEO4J_SUGGESTION_LIMIT: "${NEO4J_SUGGESTION_LIMIT}"
  NEO4J_RESULTS_LIMIT: "${NEO4J_RESULTS_LIMIT}"

  # 功能开关与其他配置
  USERS_OPEN_REGISTRATION: "${USERS_OPEN_REGISTRATION}"
  NEO4J_FORCE_TIMEZONE: "${NEO4J_FORCE_TIMEZONE}"
  NEO4J_AUTO_INSTALL_LABELS: "${NEO4J_AUTO_INSTALL_LABELS}"
  NEO4J_MAX_CONNECTION_POOL_SIZE: "${NEO4J_MAX_CONNECTION_POOL_SIZE}"
  MULTI_MAX: "${MULTI_MAX}"
  EMAIL_RESET_TOKEN_EXPIRE_HOURS: "${EMAIL_RESET_TOKEN_EXPIRE_HOURS}"
  EMAIL_TEMPLATES_DIR: "${EMAIL_TEMPLATES_DIR}"
  EMAIL_TEST_USER: "${EMAIL_TEST_USER}"

  # SMTP 配置（非敏感部分）
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_TLS: "${SMTP_TLS}"
  SMTP_SSL: "${SMTP_SSL}"
  SMTP_FROM: "${SMTP_FROM}"
  EMAILS_FROM_EMAIL: "${EMAILS_FROM_EMAIL}"
  EMAILS_FROM_NAME: "${EMAILS_FROM_NAME}"
  EMAILS_TO_EMAIL: "${EMAILS_TO_EMAIL}"
  SMTP_TIMEOUT: "${SMTP_TIMEOUT}"

  # Sentry 监控配置（非敏感部分）
  SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT}"
  SENTRY_RELEASE: "${SENTRY_RELEASE}"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE}"
  SENTRY_PROFILES_SAMPLE_RATE: "${SENTRY_PROFILES_SAMPLE_RATE}"

  # ========================================================================
  # 认证服务配置（联动配置 - 调用 auth-app-bff）
  # ========================================================================
  AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth-app-bff:3030}"

  # ========================================================================
  # Session 配置（联动配置 - 必须与 auth-app-bff 一致）
  # ========================================================================
  SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-sunmoonai_session}"

  # ========================================================================
  # API 路径配置（联动配置）
  # ========================================================================
  API_V1_STR: "${API_V1_STR:-/api/v1}"

  # Redis 配置（非敏感部分）
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_PORT: "${REDIS_PORT}"
  REDIS_DB: "${REDIS_DB}"
  REDIS_USE_SSL: "${REDIS_USE_SSL}"

  # Weaviate 配置（非敏感部分）
  WEAVIATE_URL: "${WEAVIATE_URL}"

  # 腾讯云 COS 配置（非敏感部分）
  COS_REGION: "${COS_REGION}"
  COS_BUCKET: "${COS_BUCKET}"
  COS_SCHEME: "${COS_SCHEME}"
  COS_DOMAIN: "${COS_DOMAIN}"

  # OAuth 配置（非敏感部分）
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
  GITHUB_REDIRECT_URI: "${GITHUB_REDIRECT_URI}"

  # 语言模型 API 配置（非敏感部分）
  DEEPSEEK_API_BASE: "${DEEPSEEK_API_BASE}"
