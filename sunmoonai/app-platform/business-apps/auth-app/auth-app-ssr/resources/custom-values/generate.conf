# 需要生成的资源列表
# 格式：资源类型:模板路径:输出文件名:是否启用
GENERATE_RESOURCES=(
    "app:../auth-app-ssr.yaml:auth-app-ssr-generated.yaml:true"
    "configmap:../../deploy-auth-app-ssr/secrets/auth-app-ssr-config/auth-app-ssr-config.yaml:auth-app-ssr-config-generated.yaml:true"
    "secret:../../deploy-auth-app-ssr/secrets/auth-app-ssr-secret/auth-app-ssr-secret.yaml:auth-app-ssr-secret-generated.yaml:true"
    "ingress:../../deploy-auth-app-ssr/ingress/ingress.yaml:auth-app-ssr-ingress-generated.yaml:true"
)

# 生成顺序
GENERATE_ORDER=(
    "configmap:app"
    "secret:app"
