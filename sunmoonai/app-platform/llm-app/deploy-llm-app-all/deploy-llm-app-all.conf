# ============================================================================
# LLM App 业务应用基础配置
# ============================================================================
LLM_APP_PROJECT_ID="sunmoonai"
LLM_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 组件部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
C1_llmops_app_backend_enabled="false"
C2_llmops_app_backend_enabled="false"
C3_llmops_app_backend_enabled="false"
KIND_llmops_app_backend_enabled="true"

C1_llmops_app_front_enabled="false"
C2_llmops_app_front_enabled="false"
C3_llmops_app_front_enabled="false"
KIND_llmops_app_front_enabled="true"

C1_celeryworker_llmops_enabled="false"
C2_celeryworker_llmops_enabled="false"
C3_celeryworker_llmops_enabled="false"
KIND_celeryworker_llmops_enabled="true"

# ============================================================================
# 组件部署优先级（数值越大越先部署）
# ============================================================================
C1_llmops_app_backend_priority=900
C2_llmops_app_backend_priority=900
C3_llmops_app_backend_priority=900
KIND_llmops_app_backend_priority=900

C1_llmops_app_front_priority=800
C2_llmops_app_front_priority=800
C3_llmops_app_front_priority=800
KIND_llmops_app_front_priority=800

C1_celeryworker_llmops_priority=700
C2_celeryworker_llmops_priority=700
C3_celeryworker_llmops_priority=700
KIND_celeryworker_llmops_priority=700
