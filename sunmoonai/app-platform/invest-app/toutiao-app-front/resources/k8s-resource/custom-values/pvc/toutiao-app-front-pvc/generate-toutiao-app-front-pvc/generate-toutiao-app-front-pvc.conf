# toutiao-app-front PVC YAML 生成配置
TEMPLATE_FILE="templates/pvc/toutiao-app-front-pvc.yaml"
OUTPUT_FILE="toutiao-app-front-pvc-generated.yaml"
ENABLED="false"
RESOURCE_TYPE="pvc"

NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

PVC_STORAGE_CLASS="${PVC_STORAGE_CLASS:-local-path}"
PVC_ACCESS_MODE="${PVC_ACCESS_MODE:-ReadWriteOnce}"
PVC_STORAGE_SIZE="${PVC_STORAGE_SIZE:-10Gi}"
