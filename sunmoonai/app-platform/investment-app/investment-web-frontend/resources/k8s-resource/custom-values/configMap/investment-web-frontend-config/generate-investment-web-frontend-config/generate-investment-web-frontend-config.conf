# ============================================================================
# Investment Web Frontend ConfigMap YAML 生成配置
# 字段来源：investment-web-frontend/app/.env.example（非敏感、服务端运行时字段）
# 注意：NEXT_PUBLIC_* 已在 Docker 构建时静态嵌入，运行时无需重复注入。
# ============================================================================

TEMPLATE_FILE="templates/configMap/investment-web-frontend-config.yaml"
OUTPUT_FILE="investment-web-frontend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# ============================================================================
# ConfigMap 数据内容（Next.js BFF 服务端运行时读取，非敏感字段）
# ============================================================================
# Casdoor OIDC（BFF API Routes 使用）
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-https://casdoor.sunmoonai.com}"
CASDOOR_CLIENT_ID="${CASDOOR_CLIENT_ID:-your_client_id}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-https://investment.sunmoonai.com/api/auth/callback}"
CASDOOR_ORGANIZATION="${CASDOOR_ORGANIZATION:-built-in}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-app-investment}"
