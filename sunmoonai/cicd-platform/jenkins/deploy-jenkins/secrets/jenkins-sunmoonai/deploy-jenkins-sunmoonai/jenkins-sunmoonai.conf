# Jenkins 密钥部署配置

# 基础配置
JENKINS_PROJECT_ID="sunmoonai"
JENKINS_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# 密钥配置
# 根据 Bitnami Jenkins Chart 官方文档：
# - Secret 名称：jenkins-sunmoonai（必须与 Chart 创建的 Secret 名称一致）
#   Chart 使用 {{ template "common.names.fullname" . }} 生成 Secret 名称
# - Secret 键名：jenkins-password（Chart 模板中固定的键名，见 templates/secrets.yaml）
# - 如果 jenkinsPassword: "" 留空，Chart 会检查 Secret 是否存在
#   如果存在，使用 Secret 中的密码；如果不存在，Chart 会生成随机密码
# 因此，必须在部署 Chart 之前先部署此 Secret
JENKINS_SECRET_NAME="jenkins-sunmoonai"
JENKINS_AUTH_SECRET_PASSWORD_KEY="jenkins-password"
# 注意：不再使用 JENKINS_ADMIN_USER_KEY，因为 Bitnami Chart 不会从 Secret 读取用户名
# 用户名通过 jenkinsUser values 参数设置（或使用默认值 "user"）

# 密钥值配置
# 如果设置了这些值，将使用配置的值；如果留空，脚本会自动生成
# JENKINS_PASSWORD: 留空则自动生成 16 位随机密码
# JENKINS_ADMIN_USER: 留空则使用 Bitnami 默认值 "user"（不自定义用户名，避免初始化问题）
JENKINS_PASSWORD="zym123"  # 留空则自动生成随机密码，或设置固定密码
