# ============================================================================
# nodebullworker-knowledge-web-backend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/nodebullworker-knowledge-web-backend.yaml"
OUTPUT_FILE="nodebullworker-knowledge-web-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
KIND_NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_PROJECT="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_PROJECT:-app-images}"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE:-knowledge-web-backend}"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_TAG="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_PULL_SECRET_NAME="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_SECRET_NAME="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_SECRET_NAME:-nodebullworker-knowledge-web-backend-secret}"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME:-nodebullworker-knowledge-web-backend-config}"
NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_QUEUE_REDIS_SECRET_NAME="${NODEBULLWORKER_KNOWLEDGE_WEB_BACKEND_QUEUE_REDIS_SECRET_NAME-knowledge-web-backend-nodebull-redis-conn}"
KNOWLEDGE_WEB_BACKEND_SECRET_NAME="${KNOWLEDGE_WEB_BACKEND_SECRET_NAME:-knowledge-web-backend-secret}"
KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME="${KNOWLEDGE_WEB_BACKEND_CONFIGMAP_NAME:-knowledge-web-backend-config}"

# PVC 配置
PVC_NAME="${PVC_NAME:-nodebullworker-knowledge-web-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
