# ============================================================================
# toutiao-app-front 部署配置
# ============================================================================

TOUTIAO_FRONT_PROJECT_ID="${TOUTIAO_FRONT_PROJECT_ID:-sunmoonai}"
TOUTIAO_FRONT_NAMESPACE="${TOUTIAO_FRONT_NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"   # production|development

# 镜像配置
TOUTIAO_FRONT_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
TOUTIAO_FRONT_IMAGE_PROJECT="k8s-images"
TOUTIAO_FRONT_IMAGE="toutiao-app-front"
TOUTIAO_FRONT_TAG="1.0.0"
IMAGE_PULL_POLICY="Always"
TOUTIAO_FRONT_IMAGE_PULL_SECRET_NAME="harbor-registry-secret"

# 访问域名/IP（Ingress 使用）
TOUTIAO_FRONT_UNIFIED_HOST="toutiao.sunmoonai.com"
TOUTIAO_FRONT_NODE_IP="115.190.153.150"

# 组件开关
namespace_enabled="true"
secrets_enabled="true"
configmap_enabled="true"
middleware_enabled="false"
ingress_enabled="true"
pvc_enabled="false"

# 部署优先级
namespace_priority=3000
secrets_priority=2000
configmap_priority=1900
middleware_priority=1000
ingress_priority=100

# PVC 配置
PVC_ENABLED="false"
PVC_NAME="toutiao-app-front-pvc"
PVC_MOUNT_PATH="/app/data"
PVC_SUB_PATH=""
PVC_STORAGE_CLASS="nfs-1"
PVC_ACCESS_MODE="ReadWriteOnce"
PVC_STORAGE_SIZE="10Gi"
