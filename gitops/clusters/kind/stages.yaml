  retryInterval: 30s
  timeout: 15m
  path: ./components/app-platform/auth-app/casdoor/init
  sourceRef: {kind: OCIRepository, name: platform}
  dependsOn:
    - {name: casdoor-db}
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef: {name: sops-age}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
