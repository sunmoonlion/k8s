apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: onlyoffice-docs-web-route
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: onlyoffice-docs-web
spec:
  entryPoints:
    - websecure
    - web
  routes:
    # 域名来自 ONLYOFFICE_UNIFIED_HOST；不再保留历史云节点 IP。
    - match: Host(`${UNIFIED_HOST}`) && PathPrefix(`/onlyoffice-docs`)
      kind: Rule
      services:
        - name: ${SERVICE_NAME}
          port: ${SERVICE_PORT}
      middlewares:
        - name: onlyoffice-docs-stripprefix
  tls:
    secretName: traefik-tls-secret

