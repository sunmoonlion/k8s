# Logstash 开发环境配置
# 基于官方 values.yaml 进行开发环境优化

# 全局配置
global:
  imageRegistry: "harbor.sunmoonai.com:30443"
  imagePullSecrets:
    - name: harbor-registry-secret
  security:
    allowInsecureImages: true

# 副本数配置
replicaCount: 1

# 镜像配置
image:
  registry: harbor.sunmoonai.com:30443
  repository: k8s-images/logstash
  tag: 9.1.2-debian-12-r0
  pullPolicy: IfNotPresent

# 资源限制
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 400m
    memory: 768Mi

# 服务配置
service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: beats
      port: 5044
      targetPort: beats
    - name: tcp
      port: 5000
      targetPort: tcp

# 持久化存储（开发环境：禁用）
persistence:
  enabled: false

# 网络策略（开发环境：禁用）
networkPolicy:
  enabled: false

# 健康检查配置
livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

# Logstash 配置
input: |-
  # HTTP 输入（用于测试）
  http {
    port => 8080
  }
  
  # Beats 输入（用于接收 Filebeat 等）
  beats {
    port => 5044
  }
  
  # TCP 输入（用于接收 syslog 等）
  tcp {
    port => 5000
    type => "syslog"
  }

# 过滤器配置
filter: |-
  # 基本的时间戳处理
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # 添加环境标签
  mutate {
    add_field => { "environment" => "development" }
  }

# 输出配置
output: |-
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch-sunmoonai:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }
  
  # 同时输出到控制台（开发环境便于调试）
  stdout {
    codec => rubydebug
  }

# 环境变量
env:
  - name: ELASTICSEARCH_HOST
    value: "elasticsearch-sunmoonai"
  - name: ELASTICSEARCH_PORT
    value: "9200"

