# Logstash 策略中间件部署配置

# 基础配置
LOGSTASH_PROJECT_ID="sunmoonai"
LOGSTASH_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
LOGSTASH_POLICY_TYPES="rateLimit,headers"

# 限流配置
LOGSTASH_RATE_LIMIT_AVERAGE="50"
LOGSTASH_RATE_LIMIT_BURST="100"

# 头部配置
LOGSTASH_HEADERS_CUSTOM_REQUEST_HEADERS="X-Logstash-Version:9.1.2"
LOGSTASH_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Logstash-Status:active"

