apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-admin-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llm-admin-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-admin-backend
  template:
    metadata:
      labels:
        app: llm-admin-backend
    spec:
      imagePullSecrets:
      - name: ${LLM_ADMIN_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}
      containers:
      - name: llm-admin-backend
        image: ${LLM_ADMIN_BACKEND_FULL_IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY:-Always}
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: ${LLM_ADMIN_BACKEND_CONFIGMAP_NAME:-llm-admin-backend-config}
        - secretRef:
            name: ${LLM_ADMIN_BACKEND_SECRET_NAME:-llm-admin-backend-secret}
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: ${PVC_MOUNT_PATH:-/app/data}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ${PVC_NAME:-llm-admin-backend-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-admin-backend
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: llm-admin-backend
spec:
  selector:
    app: llm-admin-backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
