# RedisInsight Web 路由配置
# 通过 Traefik HTTP 路由暴露 RedisInsight Web 服务
#
# 使用方案 A：RedisInsight 官方支持的 --base-path=/redisinsight 参数
# 这样 RedisInsight 会自动处理所有路径（包括静态资源和 API）
# 访问方式：
# - https://<节点IP>:30443/redisinsight
# - 或 https://www.sunmoonai.com/redisinsight (如果配置了 DNS)
#
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redisinsight-web-route
  namespace: {{NAMESPACE}}
  labels:
    app: ops-platform-ingress
    component: redisinsight-web
spec:
  entryPoints:
    - websecure
  routes:
    # 主路由：处理所有 /redisinsight 开头的路径
    # RedisInsight 使用 --base-path=/redisinsight 启动，会自动处理所有路径
    # 包括：/redisinsight、/redisinsight/、/redisinsight/api/*、/redisinsight/assets/* 等
    # 注意：使用 --base-path 时，不需要任何中间件，RedisInsight 自己会处理路径
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/redisinsight`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    # 主路由：处理所有 /redisinsight 开头的路径
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/redisinsight`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: ingress-platform-dev/traefik-tls-secret
