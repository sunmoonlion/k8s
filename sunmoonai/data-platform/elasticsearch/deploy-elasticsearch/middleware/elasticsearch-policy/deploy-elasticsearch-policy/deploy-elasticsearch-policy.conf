# Elasticsearch 策略中间件部署配置

# 基础配置
ELASTICSEARCH_PROJECT_ID="sunmoonai"
ELASTICSEARCH_NAMESPACE="data-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
ELASTICSEARCH_POLICY_TYPES="rateLimit,headers"

# 限流配置
ELASTICSEARCH_RATE_LIMIT_AVERAGE="50"
ELASTICSEARCH_RATE_LIMIT_BURST="100"

# 头部配置
ELASTICSEARCH_HEADERS_CUSTOM_REQUEST_HEADERS="X-Elasticsearch-Version:9.1.2"
ELASTICSEARCH_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Elasticsearch-Status:active"

