# ============================================================================
# Investment Web Frontend ConfigMap YAML 生成配置
# 职责：配置 YAML 生成相关的参数和数据内容
# ============================================================================

# 模板文件路径（相对于 resources/k8s-resource/）
# 生成脚本中 K8S_RESOURCE_DIR 已经指向 k8s-resource/，所以这里直接使用相对路径
TEMPLATE_FILE="templates/configMap/investment-web-frontend-config.yaml"

# 输出文件名（生成在当前目录）
OUTPUT_FILE="investment-web-frontend-config-generated.yaml"

# 是否启用生成
ENABLED="true"

# 资源类型
RESOURCE_TYPE="configmap"

# ============================================================================
# 基础配置（用于生成 YAML）
# 注意：这些配置的优先级（从高到低）：
#   1. 环境变量（如果已设置）
#   2. 主应用的 deploy-investment-web-frontend.conf（如果存在，由生成脚本自动读取）
#   3. 本文件中的默认值（作为后备）
# ============================================================================
# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-app-platform-dev}"          # 优先使用环境变量，其次主配置，最后默认值
ENVIRONMENT="${ENVIRONMENT:-development}"           # 优先使用环境变量，其次主配置，最后默认值
ENV="${ENV:-dev}"                                   # 优先使用环境变量，其次主配置，最后默认值

# ============================================================================
# ConfigMap 数据内容（SSR Nuxt 前端）
# ============================================================================
# Node.js 环境
NODE_ENV="${NODE_ENV:-production}"
NITRO_HOST="${NITRO_HOST:-0.0.0.0}"
NITRO_PORT="${NITRO_PORT:-3000}"

# 后端 API 地址（Server-side 调用，使用 K8s 内部 Service 名）
NUXT_PUBLIC_API_BASE="${NUXT_PUBLIC_API_BASE:-https://api.investment.sunmoonai.com/api/v1}"
API_BASE_URL="${API_BASE_URL:-http://investment-web-backend:8000/api/v1}"

# OIDC / OAuth 配置（如需对接 Casdoor）
AUTH_CLIENT_ID="${AUTH_CLIENT_ID:-investment-web-frontend}"
AUTH_ORIGIN="${AUTH_ORIGIN:-https://www.investment.sunmoonai.com}"

# Sentry 监控配置（非敏感部分）
SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT:-${ENVIRONMENT:-development}}"
