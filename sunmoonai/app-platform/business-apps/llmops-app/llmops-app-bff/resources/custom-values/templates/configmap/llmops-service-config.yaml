apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-service-config
  namespace: ${NAMESPACE}
  labels:
    app: llmops-service
    component: config
    environment: ${ENV}
data:
  # 应用核心配置
  PROJECT_NAME: "sunmoonai"
  BACKEND_APP_MODULE: "app.main:app"
  BACKEND_PRE_START_PATH: "/app/prestart.sh"
  BACKEND_PROCESS_MANAGER: "gunicorn"
  BACKEND_WITH_RELOAD: "false"
  INSTALL_DEV: "false"
  
  # CORS 配置
  BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:4200", "http://localhost:3000", "http://localhost:8080", "https://localhost", "https://localhost:4200", "https://localhost:3000", "https://localhost:8080", "http://dev.sunmoonai.com", "https://stag.sunmoonai.com", "https://sunmoonai.com", "http://local.dockertoolbox.tiangolo.com", "http://localhost.tiangolo.com"]'
  
  # 服务器配置
  SERVER_NAME: "llmops.sunmoonai.com"
  SERVER_HOST: "https://llmops.sunmoonai.com"
  SERVER_BOT: "Symona"
  
  # 数据库连接 (使用 K8s 集群内 DNS)
  POSTGRES_SERVER: "${POSTGRES_SERVER:-postgresql-service.data-platform}"
  POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
  POSTGRES_USER: "${POSTGRES_USER:-sunmoonai_dev}"
  POSTGRES_DB: "${POSTGRES_DB:-app}"
  NEO4J_SERVER: "${NEO4J_SERVER:-neo4j-service.data-platform}"
  NEO4J_PORT: "${NEO4J_PORT:-7687}"
  NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
  NEO4J_AUTH: "${NEO4J_AUTH:-neo4j}"
  NEO4J_BOLT: "${NEO4J_BOLT:-bolt}"
  
  # SMTP 配置
  SMTP_TLS: "True"
  SMTP_PORT: "587"
  SMTP_HOST: "smtp.sunmoonai.com"
  EMAILS_FROM_EMAIL: "info@sunmoonai.com"
  EMAILS_FROM_NAME: "Symona Adaro"
  EMAILS_TO_EMAIL: "info@sunmoonai.com"
  
  # 功能开关
  USERS_OPEN_REGISTRATION: "True"
  
  # Neo4j 连接优化配置
  NEO4J_FORCE_TIMEZONE: "True"
  NEO4J_AUTO_INSTALL_LABELS: "True"
  NEO4J_MAX_CONNECTION_POOL_SIZE: "50"
  
  # 其他配置
  MULTI_MAX: "20"
  EMAIL_RESET_TOKEN_EXPIRE_HOURS: "48"
  EMAIL_TEMPLATES_DIR: "/app/app/email-templates/build"
  EMAIL_TEST_USER: "test@example.com"
  
  # Celery 配置
  CELERY_BROKER_URL: "amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//"
  CELERY_QUEUE: "llmops-queue"
  CELERY_RESULT_BACKEND: "redis://redis-service.data-platform:6379"

