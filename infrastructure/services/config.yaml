# KIND 当前配置；与本目录实现同源维护。秘密与版本摘要不在这里。
---
# 首批服务动作准入；修改边界见同目录 README 的字段表。
services_enabled: true
# 平台私有输入/TLS目录；修改边界见同目录 README 的字段表。
services_config_dir: /etc/sunmoon/services/sunmoon-kind
# 私有输入/TLS独立副本；修改边界见同目录 README 的字段表。
services_backup_dir: /mnt/sunmoon-data/backups/services/sunmoon-kind

# 本批平台镜像选择；具体版本/摘要唯一取 artifacts 锁。
# RAGFlow配套物料按选版表备齐；镜像发布不等于运行声明/检索已验收。
service_image_ids: [traefik, postgresql, redis, rabbitmq, casdoor, aistor, aistor-mc, text-embeddings-inference, ragflow, infinity, valkey, elasticsearch, kibana, logstash, fluent-bit, neo4j, mongodb, pgadmin, redisinsight, flower]

# 大镜像仍有限时；600秒在当前代理吞吐下不足以备齐RAGFlow。
service_material_timeout_seconds: 3600
