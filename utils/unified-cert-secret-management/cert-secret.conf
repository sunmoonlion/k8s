#!/bin/bash

# =============================================================================
# TLS管理系统配置文件 v4.0
# 文件名: cert-secret.conf
# 用途: 定义TLS证书管理的所有配置参数
# 架构: 5层架构 - 服务类型_服务端环境_服务端节点_客户端环境_客户端节点
# =============================================================================

# =============================================================================
# 全局配置
# =============================================================================

# ⚠️  重要：Secret 键名规范说明
#      - 不同应用的 Secret 键名要求可能不同
#      - 具体规范请参考各应用的官方文档或 Helm Chart 要求
#      - 例如：PostgreSQL Chart 要求键名为小写字母（如 admin_password）
#      - 而其他应用可能接受大写字母（如 ADMIN_PASSWORD）
#      - 建议在配置前查看目标应用的 Secret 键名要求

# SSH连接配置
SSH_TIMEOUT="${SSH_TIMEOUT:-30}"
SSH_RETRY_COUNT="${SSH_RETRY_COUNT:-3}"
SSH_RETRY_DELAY="${SSH_RETRY_DELAY:-5}"

# 证书默认配置
DEFAULT_CERT_DAYS="${DEFAULT_CERT_DAYS:-365}"
DEFAULT_CERT_KEY_SIZE="${DEFAULT_CERT_KEY_SIZE:-4096}"

# 运行模式配置
# 支持的模式: init(初始化), rotate(轮换), force(强制更新)
# 说明：
#   - init: K8s系统初始化时只生成和分发CA证书，关闭服务器证书生成、Secret部署和组件重启
#   - rotate: 定期轮换证书，更新现有Secret，重启相关组件（默认）
#   - force: 强制重新生成和部署所有证书，重启相关组件
# 注意：环境变量 TLS_MODE 会覆盖此配置
TLS_MODE="${TLS_MODE:-rotate}"

# 集群配置支持
# 系统支持集群级别的配置映射，通过 C{数字}_ 前缀区分不同集群
# 例如：C1_TRAEFIK_K1_K1_ENABLED="true" 表示集群1的配置
#       C2_TRAEFIK_K1_K1_ENABLED="false" 表示集群2的配置
# 使用方法：
#   1. 设置环境变量 CLUSTER="C1" 或 CLUSTER="C2"（优先级最高）
#   2. 或者在配置文件中设置 CLUSTER="C1" 或 CLUSTER="C2"（如果环境变量未设置）
#   3. 系统会自动将 C1_* 或 C2_* 前缀的配置映射为默认配置
#   4. 例如：C1_TRAEFIK_K1_K1_SERVER_HOST 会映射为 TRAEFIK_K1_K1_SERVER_HOST
# 注意：集群配置映射在所有脚本加载配置文件后自动应用
# 优先级：环境变量 CLUSTER > 配置文件 CLUSTER > 全局配置文件 k8s-admin.conf > 默认值 C1

# 集群配置（如果环境变量 CLUSTER 未设置，则使用此值）
# 格式：C{数字}，如 C1, C2, C3 等
# 注意：如果环境变量 CLUSTER 已设置，环境变量的优先级更高
# 示例：CLUSTER="C2"  # 设置为集群2
# 如果不设置，系统会从全局配置文件 k8s-admin.conf 读取默认集群，或使用默认值 C1
# CLUSTER="${CLUSTER:-C2}"  # 取消注释并设置默认集群


# =============================================================================
# 服务名全称架构配置
# 格式: 服务名全称_服务端环境_服务端节点_客户端环境_客户端节点
# =============================================================================

# ================================
# 编码格式: 服务名全称_环境_节点_环境_节点
# 位置: 1     2  3  4  5
# 编码: 服务名_环境_节点_环境_节点

# 服务名全称：
#   HARBOR: Harbor
#   POSTGRESQL: PostgreSQL  
#   MYSQL: MySQL
#   MONGODB: MongoDB
#   REDIS: Redis
#   APACHE: Apache
#   NGINX: Nginx
#   TRAEFIK: Traefik
#   KAFKA: Kafka
#   ELASTICSEARCH: Elasticsearch
#   等等... (支持任意长度的服务名)

# 服务端环境编码：
#   K: K8s环境    C: Clastic环境

# 节点编码：
#   1: 节点1    2: 节点2    3: 节点3    4: 节点4

# 客户端环境编码：(需要说明的是：K8s 也是使用 containerd，N 也是使用 containerd，
#               但是，这里的 N 指的是纯粹的 nerdctl 环境，而不是 K8s 的 containerd 环境)
#   K: K8s环境    D: Docker环境   N: nerdctl环境

# 示例:
#   HARBOR_K1_D1 = Harbor-K8s-节点1 -> Docker-节点1
#   HARBOR_K2_D3 = Harbor-K8s-节点2 -> Docker-节点3
#   REDIS_K1_K1 = Redis-K8s-节点1 -> K8s-节点1
#   HARBOR_C1_N1 = Harbor-Clastic-节点1 -> nerdctl-节点1


# 服务端服务器证书secret创建和部署(只在控制平面执行)

# =============================================================================
# Secret数据源配置 - 按顺序号+类型配置
# =============================================================================

# 支持的Secret类型:
# - kubernetes.io/tls: TLS证书和私钥
# - kubernetes.io/dockerconfigjson: Docker镜像拉取认证
# - Opaque: 通用数据
# - kubernetes.io/basic-auth: 基本认证
# - kubernetes.io/ssh-auth: SSH认证
#
# Secret 启停总则（按索引逐个控制）：
# - 如果配置了 Secret（有 TYPE、NAME、NAMESPACE 等），系统会自动处理该 Secret
#   包括：数据准备/渲染、本地归档、远程部署、组件重启（如果配置了 RESTART_COMPONENTS_LIST）
# - 如果未配置 Secret（TYPE 为空），系统会跳过该 Secret
#
# Secret重启配置说明:
# - RESTART_PRIORITY: 重启优先级，数字越小优先级越高 (1-100)
# - RESTART_COMPONENTS_LIST: 手动指定重启的组件列表，用逗号分隔 (必需)
#   系统只使用手动配置的组件列表进行重启，确保准确性和可控性
#
# 组件重启说明：
#   restart_components() 函数会处理所有启用的 Secret（SECRET_0, SECRET_1, SECRET_2...）的重启配置
#   对于每个启用的 Secret，如果配置了 RESTART_COMPONENTS_LIST，则会自动重启对应的组件列表
#   多个 Secret 的组件列表会自动去重，避免重复重启同一个组件
#   注意：Secret 更新后必须重启使用该 Secret 的组件，以应用新的 Secret 内容

# 说明：
# - Secret 生成后会自动部署到远程 K8s 集群（如果 Secret 已启用）
# - 如果配置了 RESTART_COMPONENTS_LIST，Secret 更新后会自动重启对应的组件以应用新 Secret

# =============================================================================
# 重启组件名称确定方法
# =============================================================================
# 1. 查看Kubernetes资源类型和名称：
#    kubectl get deployment,statefulset,daemonset -A
# 
# 2. 常见组件命名规则：
#    - Harbor组件: sunmoonai-harbor-core, sunmoonai-harbor-portal, sunmoonai-harbor-jobservice
#    - Traefik组件: traefik-sunmoonai
#    - PostgreSQL组件: sunmoonai-harbor-postgresql
#    - Redis组件: sunmoonai-harbor-redis-master
#    - 其他组件: 根据实际部署的命名空间和名称确定
#
# 3. 确定组件类型：
#    - Deployment: 直接使用组件名称
#    - StatefulSet: 直接使用组件名称  
#    - DaemonSet: 直接使用组件名称
#
# 4. 配置格式：
#    RESTART_COMPONENTS_LIST="组件1,组件2,组件3"
#    例如: "traefik-sunmoonai,sunmoonai-harbor-core"
#
# 5. 注意事项：
#    - 组件必须在Secret的命名空间中存在
#    - 系统会自动检测组件类型（deployment/statefulset/daemonset）
#    - 如果组件不存在，会显示警告但不会中断执行
# =============================================================================



# 客户端CA证书的分发
# 说明：
# - 对于 Docker/nerdctl 客户端：每个节点使用独立的五层编码（如 TRAEFIK_K1_D1、TRAEFIK_K1_D2），
#   要求前三层相同，仅客户端层（第4-5层）不同，对应不同的目标节点。
# - 为保持配置简洁，此类组合仅提供 CLIENT_* 与 ENABLED；SERVER_* 留空，服务端步骤将跳过，仅执行客户端CA分发。
# - 客户端分发会按“前三层前缀”定位 CA（例如 TRAEFIK_K1 → /tmp/TRAEFIK_K1-ca-certs/ca.crt），如该 CA 不存在将自动生成。
# - 若需要在 K8s 集群创建/更新与证书相关的 Secret（例如 TLS Secret），需至少对对应“前三层组合”执行一次服务端部署。


# =============================================================================
# traefik配置
# =============================================================================


# =============================================================================
# Traefik-K8s-节点1 -> K8s-节点1 (TRAEFIK_K1_K1)
# =============================================================================

# 启用配置
TRAEFIK_K1_K1_ENABLED="true"

# 服务端k8s配置

# 服务端用集群连接信息
TRAEFIK_K1_K1_SERVER_HOST="115.190.64.131"
TRAEFIK_K1_K1_SERVER_PORT="1022"
TRAEFIK_K1_K1_SERVER_USERNAME="zym"
TRAEFIK_K1_K1_SERVER_SSH_KEY="~/.ssh/id_rsa"

# 证书生成配置

#  CA证书配置
TRAEFIK_K1_K1_CA_CN="SunMoonAI Root CA"
TRAEFIK_K1_K1_CA_DAYS="3650"
TRAEFIK_K1_K1_CA_KEY_SIZE="4096"

# 服务器证书配置
# 注意：服务器证书由统一证书管理系统自动生成，无需配置开关
#      在 rotate/force 模式下，服务器证书会自动重新生成以确保证书链验证通过

# CN 设置为根域名（标准做法：使用根域名，不使用通配符）
# 注意：DNS.1 自动设置为 CN（sunmoonai.com），在 DNS 列表中添加通配符和其他域名
# 现代浏览器主要依赖 SANs（Subject Alternative Names）进行域名验证
TRAEFIK_K1_K1_SERVER_CN="sunmoonai.com"
TRAEFIK_K1_K1_SERVER_DAYS="365"
TRAEFIK_K1_K1_SERVER_KEY_SIZE="4096"
# DNS 列表：从 DNS.2 开始（DNS.1 自动设置为 CN）
# 包含通配符域名以覆盖所有子域名，同时根域名由 CN 自动包含
TRAEFIK_K1_K1_SERVER_DNS_2="*.sunmoonai.com"
TRAEFIK_K1_K1_SERVER_DNS_3="localhost"
TRAEFIK_K1_K1_SERVER_IP_1="115.190.64.131"
TRAEFIK_K1_K1_SERVER_IP_2="192.168.3.89"
TRAEFIK_K1_K1_SERVER_IP_3="127.0.0.1"
TRAEFIK_K1_K1_SERVER_IP_4="101.126.151.0"      # LLMOps Service 等服务的访问 IP
TRAEFIK_K1_K1_SERVER_IP_5="115.190.153.150"     # Flower、Mongo Express 等服务的访问 IP

# 根证书ca归档目录
TRAEFIK_K1_K1_LOCAL_CA_CERT_DIR="~/k8s/sunmoonai/ingress-platform/traefik/deploy-traefik/secrets/traefik-tls-secret/ca"

# Traefik 服务器证书归档目录
TRAEFIK_K1_K1_LOCAL_SERVER_CERT_DIR="~/k8s/sunmoonai/ingress-platform/traefik/deploy-traefik/secrets/traefik-tls-secret/server-cert"

# 服务端服务器secret的生成和部署

# （一）服务端traefik的tls 类型的secret的生成和归档和部署

# Secret 0: Traefik TLS Secret生成配置
# 说明：如果配置了 Secret（有 TYPE、NAME、NAMESPACE 等），系统会自动处理，无需额外开关
TRAEFIK_K1_K1_SECRET_0_TYPE="kubernetes.io/tls"
TRAEFIK_K1_K1_SECRET_0_NAME="traefik-tls-secret"
TRAEFIK_K1_K1_SECRET_0_NAMESPACE="ingress-platform-dev"
# TLS Secret 固定键名: tls.crt, tls.key
TRAEFIK_K1_K1_SECRET_0_TLS_CRT="${TRAEFIK_K1_K1_LOCAL_SERVER_CERT_DIR}/server.crt"
TRAEFIK_K1_K1_SECRET_0_TLS_KEY="${TRAEFIK_K1_K1_LOCAL_SERVER_CERT_DIR}/server.key"

# 服务端traefik的tls 类型的secret的归档配置
# yaml文件本地归档目录
TRAEFIK_K1_K1_SECRET_0_LOCAL_SECRET_DIR="~/k8s/sunmoonai/ingress-platform/traefik/deploy-traefik/secrets/traefik-tls-secret"

# 服务端traefik的tls 类型的secret的部署

# 重启优先级（数字越小优先级越高，1-100）
TRAEFIK_K1_K1_SECRET_0_RESTART_PRIORITY="10"
# 手动指定重启的组件列表（必需，用逗号分隔，如：traefik-sunmoonai）
# 注意：traefik-sunmoonai 部署在 ingress-platform-dev 命名空间中
# 说明：如果配置了组件列表，Secret 更新后会自动重启这些组件以应用新 Secret
TRAEFIK_K1_K1_SECRET_0_RESTART_COMPONENTS_LIST="traefik-sunmoonai"

# （二）非TLS类型的Secret生成、归档和部署
# 需要特别说明的是，这类Secret和服务端证书生成无关，但为了使用我们的五层管理系统
# 我们在前面也给它加了五层编码前缀。事实上，对于此类Secret：
# - 生成：与五层编码无关，只依赖配置数据
# - 归档：与五层编码有关，使用 ${combo}_LOCAL_SECRET_DIR 路径
# - 部署：与五层编码有关，需要 ${combo}_CLIENT_* 远程连接配置
# 因此，建议使用对应的服务前缀（如HARBOR_K1_K1）以保持配置一致性

# # Secret 100: Harbor配置Secret(应用或控制器可能会读取它来判断："我要不要启用 Harbor 推送？用哪个 host？需不需要 HTTPS？)
# # 可选：是否启用该Secret处理（默认true）
# # TRAEFIK_K1_K1_SECRET_100_ENABLED="true"
# TRAEFIK_K1_K1_SECRET_100_TYPE="Opaque"
# TRAEFIK_K1_K1_SECRET_100_NAME="harbor.sunmoonai.local-config"
# TRAEFIK_K1_K1_SECRET_100_NAMESPACE="data-platform-dev"
# # Opaque Secret 动态键名: 配置什么键名，Secret就有什么键名
# TRAEFIK_K1_K1_SECRET_100_CONFIG_JSON='{"harbor": {"enabled": true, "version": "2.0", "ssl": true, "host": "harbor.sunmoonai.local"}}'
# TRAEFIK_K1_K1_SECRET_100_APPLY_REMOTE="true"
# # 是否重启使用该Secret的组件
# TRAEFIK_K1_K1_SECRET_100_RESTART_COMPONENTS="false"
# # 重启优先级（数字越小优先级越高，1-100）
# TRAEFIK_K1_K1_SECRET_100_RESTART_PRIORITY="70"
# # 手动指定重启的组件列表（必需，用逗号分隔，如：harbor-core,harbor-jobservice）
# # TRAEFIK_K1_K1_SECRET_100_RESTART_COMPONENTS_LIST="harbor-core,harbor-jobservice"
# TRAEFIK_K1_K1_SECRET_100_LOCAL_SECRET_DIR="~/k8s/sunmoonai/cicd-platform/harbor/deploy/secrets/harbor.sunmoonai.local-config/"


# # Secret 101: Basic Auth Secret配置
# # 可选：是否启用该Secret处理（默认true）
# # TRAEFIK_K1_K1_SECRET_101_ENABLED="true"
# TRAEFIK_K1_K1_SECRET_101_TYPE="kubernetes.io/basic-auth"
# TRAEFIK_K1_K1_SECRET_101_NAME="web-basic-auth"
# TRAEFIK_K1_K1_SECRET_101_NAMESPACE="app-platform-dev"
# # Basic Auth Secret 固定键名: username, password
# TRAEFIK_K1_K1_SECRET_101_USERNAME="admin"
# TRAEFIK_K1_K1_SECRET_101_PASSWORD="WebAdmin123"
# TRAEFIK_K1_K1_SECRET_101_APPLY_REMOTE="true"
# # 是否重启使用该Secret的组件
# TRAEFIK_K1_K1_SECRET_101_RESTART_COMPONENTS="false"
# # 重启优先级（数字越小优先级越高，1-100）
# TRAEFIK_K1_K1_SECRET_101_RESTART_PRIORITY="80"
# # 手动指定重启的组件列表（必需，用逗号分隔，如：harbor-nginx,harbor-portal）
# # TRAEFIK_K1_K1_SECRET_101_RESTART_COMPONENTS_LIST="harbor-nginx,harbor-portal"
# TRAEFIK_K1_K1_SECRET_101_LOCAL_SECRET_DIR="~/k8s/sunmoonai/cicd-platform/harbor/deploy/secrets/web-basic-auth/"

# # Secret 103: SSH Auth Secret配置
# # 可选：是否启用该Secret处理（默认true）
# # TRAEFIK_K1_K1_SECRET_103_ENABLED="true"
# TRAEFIK_K1_K1_SECRET_103_TYPE="kubernetes.io/ssh-auth"
# TRAEFIK_K1_K1_SECRET_103_NAME="git-ssh-auth"
# TRAEFIK_K1_K1_SECRET_103_NAMESPACE="app-platform-dev"
# # SSH Auth Secret 固定键名: ssh-privatekey
# TRAEFIK_K1_K1_SECRET_103_SSH_PRIVATEKEY="~/.ssh/id_rsa"
# TRAEFIK_K1_K1_SECRET_103_APPLY_REMOTE="true"
# # 是否重启使用该Secret的组件
# TRAEFIK_K1_K1_SECRET_103_RESTART_COMPONENTS="false"
# # 重启优先级（数字越小优先级越高，1-100）
# TRAEFIK_K1_K1_SECRET_103_RESTART_PRIORITY="90"
# # 手动指定重启的组件列表（必需，用逗号分隔，如：harbor-jobservice,harbor-core）
# # TRAEFIK_K1_K1_SECRET_103_RESTART_COMPONENTS_LIST="harbor-jobservice,harbor-core"
# TRAEFIK_K1_K1_SECRET_103_LOCAL_SECRET_DIR="~/k8s/sunmoonai/cicd-platform/harbor/deploy/secrets/git-ssh-auth/"


#  特别说明：我们仅仅把traefik的tls类型的secret和非tls类型的secret的生成、归档和部署放到了这里，其它服务的secret的生成、归档和部署
#            可以照此模式处理！！！

# 客户端k8s配置

# 客户端用集群连接信息
C1_TRAEFIK_K1_K1_CLIENT_HOST="115.190.64.131"
C1_TRAEFIK_K1_K1_CLIENT_PORT="1022"
C1_TRAEFIK_K1_K1_CLIENT_USERNAME="zym"
C1_TRAEFIK_K1_K1_CLIENT_SSH_KEY="~/.ssh/id_rsa"


C2_TRAEFIK_K1_K1_CLIENT_HOST="115.190.37.57"
C2_TRAEFIK_K1_K1_CLIENT_PORT="1022"
C2_TRAEFIK_K1_K1_CLIENT_USERNAME="zym"
C2_TRAEFIK_K1_K1_CLIENT_SSH_KEY="~/.ssh/id_rsa"
# 客户端 containerd 的 CA 证书分发
# 
# 这里需要说明的事是，对于K8s环境下的客户端ca证书的分发，由于存在多个节点，
# 因此，我们通过CLIENT_NODES配置多个节点，然后循环分发，所有节点共享相同的containerd证书路径


# K8s客户端多节点配置
C1_TRAEFIK_K1_K1_CLIENT_NODES="node1,node2,node3"
C1_TRAEFIK_K1_K1_CLIENT_NODE_HOSTS="115.190.64.131,101.126.151.0,115.190.61.238"
C1_TRAEFIK_K1_K1_CLIENT_NODE_PORTS="1022,1022,1022"
C1_TRAEFIK_K1_K1_CLIENT_NODE_USERNAMES="zym,zym,zym"
C1_TRAEFIK_K1_K1_CLIENT_NODE_SSH_KEYS="~/.ssh/id_rsa,~/.ssh/id_rsa,~/.ssh/id_rsa"

C2_TRAEFIK_K1_K1_CLIENT_NODES="node1,node2,node3"
C2_TRAEFIK_K1_K1_CLIENT_NODE_HOSTS="115.190.37.57,115.190.153.150,115.190.86.211"
C2_TRAEFIK_K1_K1_CLIENT_NODE_PORTS="1022,1022,1022"
C2_TRAEFIK_K1_K1_CLIENT_NODE_USERNAMES="zym,zym,zym"
C2_TRAEFIK_K1_K1_CLIENT_NODE_SSH_KEYS="~/.ssh/id_rsa,~/.ssh/id_rsa,~/.ssh/id_rsa"

# K8s客户端containerd证书路径（所有节点相同）
# 注意：此分发地址应与 Harbor 的路由域名和端口一致（当前为harbor.sunmoonai.com:30443，使用 websecure entryPoint）
TRAEFIK_K1_K1_CLIENT_CONTAINERD_PATH="/etc/containerd/certs.d/harbor.sunmoonai.com:30443"


# =============================================================================
# Traefik-K8s-节点1 -> Docker-节点1
# 就服务器是k8来说，如果客户端是docker，则每一个节点都需要执行，因此，每一个节点都要有conf，虽然
# 除了节点地址不同外，其他都相同，但是，代码不会重复执行，因为代码会自动分组并幂等执行
# =============================================================================

# 启用配置
TRAEFIK_K1_D1_ENABLED="true"

# 客户端配置

# Docker客户端CA证书分发配置
TRAEFIK_K1_D1_CLIENT_HOST="43.153.135.74"
TRAEFIK_K1_D1_CLIENT_PORT="1022"
TRAEFIK_K1_D1_CLIENT_USERNAME="zym"
TRAEFIK_K1_D1_CLIENT_SSH_KEY="~/.ssh/id_rsa"

# Docker客户端证书路径

# 注意：此分发地址应与 Harbor 的路由域名和端口一致（当前为harbor.sunmoonai.com:30443，使用 websecure entryPoint）
TRAEFIK_K1_D1_CLIENT_DOCKER_PATH="/etc/docker/certs.d/harbor.sunmoonai.com:30443"

# =============================================================================
# Traefik-K8s-节点1 -> Docker-节点2
# 对于节点2，只要加一个启用配置，服务端配置可以省略，因为它与节点1相同，但客户端的配置一定要把服务端的前缀加上
# 这样，它才能知道要到哪个服务节点去找根证书
# =============================================================================

# TRAEFIK_K1_D2启用配置
TRAEFIK_K1_D2_ENABLED="true"

# 没有服务端的相关逻辑，只进行证书的分发(但组合的前缀还要，因为它要据此去找证书)

# Docker客户端CA证书分发配置
TRAEFIK_K1_D2_CLIENT_HOST="47.100.19.119"
TRAEFIK_K1_D2_CLIENT_PORT="1022"
TRAEFIK_K1_D2_CLIENT_USERNAME="zym"
TRAEFIK_K1_D2_CLIENT_SSH_KEY="~/.ssh/id_rsa"

# 注意：此分发地址应与 Harbor 的路由域名和端口一致（当前为harbor.sunmoonai.com:30443，使用 websecure entryPoint）
TRAEFIK_K1_D2_CLIENT_DOCKER_PATH="/etc/docker/certs.d/harbor.sunmoonai.com:30443"