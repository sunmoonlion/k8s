# ============================================================================
# CI/CD 平台基础配置
# ============================================================================
CICD_PLATFORM_PROJECT_ID="sunmoonai"
CICD_PLATFORM_NAMESPACE="cicd-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志
# ============================================================================
# 控制是否部署各个子级组件
C1_harbor_enabled="true"        # 是否部署 Harbor 镜像仓库
C3_jenkins_enabled="false"        # 是否部署 Jenkins CI/CD
argocd_enabled="false"         # 是否部署 ArgoCD GitOps

# ============================================================================
# 部署优先级控制
# ============================================================================
# 通过优先级数值控制部署顺序，数值越大优先级越高（越先部署）
# 建议优先级范围：1-1000
C1_harbor_priority=1000         # Harbor 优先级最高（最先部署）
C3_jenkins_priority=100         # Jenkins 优先级中等
argocd_priority=10           # ArgoCD 优先级最低（最后部署）
