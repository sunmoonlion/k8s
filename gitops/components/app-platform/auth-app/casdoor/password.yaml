---
- name: Resolve the owning component's fixed protocol and trust settings
  ansible.builtin.set_fact:
    account_protocol_path: "{{ inventory_dir }}/../../gitops/components/app-platform/auth-app/casdoor/password.py"
    account_protocol_settings:
      hostname: '{{ casdoor_hostname }}'
      port: '{{ cluster_ingress_port }}'
      origin: 'https://{{ casdoor_hostname }}:{{ entry_port }}'
      ca: '{{ registry_config_dir }}/clients/ca.crt'
      kubectl: '{{ inventory_dir }}/../.tools/bin/kubectl'
      kubeconfig: '{{ cluster_kubeconfig }}'
      context: 'kind-{{ cluster_name }}'
      namespace: '{{ app_namespace }}'
      age_key: '{{ sops_backup_dir }}/age.agekey'
      sops: '{{ inventory_dir }}/../.tools/bin/sops'
      recipient: '{{ inventory_dir }}/../environments/kind/sops-recipient.txt'
      repo: '{{ inventory_dir }}/../..'
      source_lock: '{{ inventory_dir }}/../environments/kind/flux-source.yaml'
      publication: '{{ inventory_dir }}/../.build/flux/source-candidate.yaml'
      manifest: gitops/components/app-platform/auth-app/casdoor/init/identity.sops.yaml
- name: Check the real component login identity before any rotation
  ansible.builtin.include_tasks: '{{ inventory_dir }}/tasks/account-protocol-check.yaml'
  when: account_action != 'recover'

- name: Stage only the encrypted Casdoor human identity candidate
  ansible.builtin.include_tasks: '{{ inventory_dir }}/tasks/account-component-step.yaml'
  vars: {account_component_step: stage}
  when: account_action == 'stage'
- name: Rotate the reviewed Casdoor account and native Flux configuration together
  ansible.builtin.include_tasks: rotation.yaml
  when: account_action in ['rotate','recover']
