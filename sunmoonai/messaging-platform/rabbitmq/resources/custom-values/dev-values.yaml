# RabbitMQ 开发环境配置 - 直接写具体值，不做模板替换

# 全局配置（对齐统一镜像与存储）
# 关于镜像来源（说明）
# - 部分 Bitnami 历史版本已从官方仓库迁移到 bitnamilegacy 命名空间
#   因此我们基于 bitnamilegacy/rabbitmq:4.1.3-debian-12-r1 在节点上 retag 为
#   www.sunmoonai.com:30443/k8s-images/rabbitmq:4.1.3-debian-12-r1 并推送到 Harbor
# - 通过 imagePullSecrets 从 Harbor 拉取镜像，registry 留空使用默认 Docker Hub 格式
# - 需配合：
#   1) global.security.allowInsecureImages=true（绕过 Bitnami 源校验）
#   2) 命名空间内存在 harbor-registry-secret（镜像拉取凭据）
global:
  imageRegistry: "harbor.sunmoonai.com:30443"
  imagePullSecrets:
    - name: harbor-registry-secret
  security:
    allowInsecureImages: true
  storageClass: "local-path"

# 镜像配置（通过 Harbor 拉取）
image:
  registry: "harbor.sunmoonai.com:30443"
  repository: k8s-images/rabbitmq
  tag: "4.1.3-debian-12-r1"
  pullPolicy: IfNotPresent

# 禁用 Chart 的 resourcesPreset，确保自定义 resources 生效
resourcesPreset: "none"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

# 认证配置（改为引用统一密管 Secret）
# 特别说明（和其他组件的差异）
# - RabbitMQ 是有状态服务，用户名/密码会写入持久卷中的内部数据库，不是"纯配置值"
# - Helm Chart 在 enabled updatePassword 时，会尝试根据 Secret 更新内部密码
#   - 如果持久卷里已有旧密码，而 Secret 中是新密码，更新可能失败，导致探针和管理端都登录失败，Pod 起不来
# - 我们当前策略是：沿用第一次初始化成功时的那套密码，不再自动轮换
#   - 因此使用 existingPasswordSecret/ existingErlangSecret 指向固定的 Secret
#   - 同时关闭 updatePassword，避免自动修改已持久化的密码
auth:
  username: "admin"
  existingPasswordSecret: "rabbitmq-auth-secret"
  existingSecretPasswordKey: "rabbitmq-password"
  existingErlangSecret: "rabbitmq-auth-secret"
  existingSecretErlangKey: "rabbitmq-erlang-cookie"
  # 不启用密码自动更新：始终沿用持久卷中已存在的密码
  # 如果以后真的要换密码，再手工调整 Secret 和数据卷，而不是依赖自动更新
  updatePassword: false

# 主服务配置
primary:
  persistence:
    enabled: true
    storageClass: "local-path"
    size: "10Gi"
    accessModes:
      - "ReadWriteOnce"

  service:
    type: "ClusterIP"  # 改为 ClusterIP，只在内网访问
    ports:
      amqp: 5672
      management: 15672

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

# 健康检查配置（移到顶层，Chart 使用 .Values.livenessProbe/.Values.readinessProbe 及 .Values.startupProbe）
# 优化启动速度：参考其他组件（mongo-express、flower、pgadmin）的配置，大幅缩短启动时间
# 策略：
#   1. 启用 startupProbe：在启动期间更频繁检查（每 2 秒），避免 readinessProbe 在启动阶段失败
#   2. readinessProbe initialDelaySeconds: 0（立即开始检查，与 mongo-express 一样）
#   3. livenessProbe initialDelaySeconds: 30（从 120 秒大幅缩短，与 flower 一样）
startupProbe:
  enabled: true
  initialDelaySeconds: 0         # 立即开始检查
  periodSeconds: 2               # 每 2 秒检查一次（参考 pgadmin）
  timeoutSeconds: 3
  failureThreshold: 30           # 最多等待 60 秒（30 * 2秒），足够 RabbitMQ 启动
  successThreshold: 1

livenessProbe:
  enabled: true
  initialDelaySeconds: 30        # 从默认 120 秒缩短到 30 秒（参考 flower）
  periodSeconds: 10              # 从默认 30 秒缩短到 10 秒，更快发现问题
  timeoutSeconds: 5              # 从默认 20 秒缩短到 5 秒
  failureThreshold: 5            # 保持默认 6，允许更多失败次数
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 0         # 从 5 秒缩短到 0 秒（参考 mongo-express，立即开始检查）
  periodSeconds: 5               # 从默认 30 秒缩短到 5 秒，更快响应
  timeoutSeconds: 3              # 从默认 20 秒缩短到 3 秒
  failureThreshold: 3            # 保持默认
  successThreshold: 1

# 管理界面配置
management:
  enabled: true
  port: 15672

# ============================================================================
# 注意：RabbitMQ 管理界面不支持路径前缀配置
# ============================================================================
# 与 Mongo Express、RedisInsight、Flower 不同，RabbitMQ 管理插件不支持 baseurl/base-path 配置
# 因此必须使用 Traefik 的 stripPrefix 中间件来处理路径前缀
# 参考：https://www.rabbitmq.com/management.html

# 监控配置 - 开发环境禁用
metrics:
  enabled: false

# Ingress 配置 - 通过 ingress-platform 统一管理
ingress:
  enabled: false  # 禁用 Helm Chart 的 Ingress，使用 ingress-platform 管理

# 网络策略
networkPolicy:
  enabled: false

# 集群配置 - 开发环境单节点
clustering:
  enabled: false
