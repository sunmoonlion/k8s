---
# User settings; versions/digests have one source in artifacts/upstream-images.lock.json.
services_mongodb_enabled: true
mongodb_volume: {name: mongodb, node: worker2, size: 20Gi, uid: 999, gid: 999}
mongodb_port: 27017
mongodb_replica_set: sunmoon
mongodb_acceptance_database: sunmoon_acceptance
mongodb_init_generation: v2
mongodb_wiredtiger_cache_gib: 0.5
mongodb_oplog_mib: 256
mongodb_resources:
  requests: {cpu: 250m, memory: 1Gi}
  limits: {cpu: '2', memory: 2Gi}

# Maintainer identity; permissions and current credential storage, never password values.
operator_account_mongodb:
  object: data-platform/mongodb
  id: administrator
  username: sunmoon_mongo_admin
  account_type: platform-administrator
  table_row: ''
  table_import: false
  current_file: '{{ services_config_dir }}/mongodb.yaml'
  current_field: root_password
  backup_file: '{{ services_backup_dir }}/mongodb.yaml'
  minimum_length: 8
  maximum_length: 128
  adapter: mongodb
  initial_preset_supported: false
  protocol_check_supported: false
  rotation_supported: false
