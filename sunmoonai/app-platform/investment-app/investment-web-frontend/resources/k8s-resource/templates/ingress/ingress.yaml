# Investment Web Frontend 路由配置 (Traefik IngressRoute)
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# https://<节点IP>:30443/api/v1
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# https://admin.investment.sunmoonai.com/api/v1
#
---
# Middleware: 根据配置选择使用 stripprefix 或 rate-limit
#STRIP_PREFIX_MIDDLEWARE_START
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: investment-web-frontend-stripprefix
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: investment-web-frontend
    middleware-type: stripprefix
spec:
  stripPrefix:
    prefixes:
      - "/api/v1"
#STRIP_PREFIX_MIDDLEWARE_END
---
# IngressRoute: HTTP 路由
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: investment-web-frontend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: investment-web-frontend
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问 - 文档路径
    - match: Host(`{{NODE_IP}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}

    # 使用节点 IP 访问 - OpenAPI JSON
    - match: Host(`{{NODE_IP}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}

    # 使用节点 IP 访问 - API 路径
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END

    # 使用统一域名访问 - 文档路径
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}

    # 使用统一域名访问 - OpenAPI JSON
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}

    # 使用统一域名访问 - API 路径
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END
