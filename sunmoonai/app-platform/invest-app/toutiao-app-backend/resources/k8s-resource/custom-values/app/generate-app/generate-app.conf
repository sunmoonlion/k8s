# ============================================================================
# toutiao-app-backend App YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/toutiao-app-backend.yaml"
OUTPUT_FILE="toutiao-app-backend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

# 命名空间和环境配置
NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# ============================================================================
# 镜像配置（与源码仓库 mybuild/build.conf 保持一致）
# ============================================================================
TOUTIAO_BACKEND_IMAGE_REGISTRY="${TOUTIAO_BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com:30443}"
TOUTIAO_BACKEND_IMAGE_PROJECT="${TOUTIAO_BACKEND_IMAGE_PROJECT:-k8s-images}"
TOUTIAO_BACKEND_IMAGE="${TOUTIAO_BACKEND_IMAGE:-toutiao-app-backend}"
TOUTIAO_BACKEND_TAG="${TOUTIAO_BACKEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
TOUTIAO_BACKEND_IMAGE_PULL_SECRET_NAME="${TOUTIAO_BACKEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
TOUTIAO_BACKEND_SECRET_NAME="${TOUTIAO_BACKEND_SECRET_NAME:-toutiao-app-backend-secret}"
TOUTIAO_BACKEND_CONFIGMAP_NAME="${TOUTIAO_BACKEND_CONFIGMAP_NAME:-toutiao-app-backend-config}"

# PVC 配置
PVC_NAME="${PVC_NAME:-toutiao-app-backend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
