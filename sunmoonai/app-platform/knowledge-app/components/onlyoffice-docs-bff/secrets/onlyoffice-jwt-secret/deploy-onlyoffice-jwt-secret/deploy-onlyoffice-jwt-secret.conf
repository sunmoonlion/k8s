# =============================================================================
# ONLYOFFICE JWT Secret 部署配置
# 文件名: deploy-onlyoffice-jwt-secret.conf
# 用途: 配置 ONLYOFFICE Docs JWT 认证 Secret（用于 API 认证）
# =============================================================================

SECRET_NAME="onlyoffice-jwt-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"
SECRET_TYPE="Opaque"

# JWT Secret 键名（ONLYOFFICE Docs 使用的键名）
TARGET_SECRET_KEY="jwt-secret"

# JWT Secret 值
# 如果为空，将自动生成一个随机密钥（推荐）
# 如果已设置，将使用指定的值（请确保安全性）
JWT_SECRET_VALUE="${JWT_SECRET_VALUE:-}"

RESTART_COMPONENTS="false"
RESTART_PRIORITY="50"

