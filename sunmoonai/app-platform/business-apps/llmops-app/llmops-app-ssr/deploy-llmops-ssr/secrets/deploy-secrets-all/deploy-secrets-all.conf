# ============================================================================
# LLMOps App SSR Secrets All 部署配置
# ============================================================================

# 基础配置
PROJECT_ID="${PROJECT_ID:-sunmoonai}"
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"

# ============================================================================
# 组件开关与优先级控制
# ============================================================================
# 控制是否部署各个 Secrets/ConfigMap 组件
# 优先级：数值越大优先级越高（越先部署）

# Harbor Registry Secret（镜像拉取认证，最高优先级，需要在其他组件之前部署）
harbor_registry_secret_enabled="${harbor_registry_secret_enabled:-true}"
harbor_registry_secret_priority="${harbor_registry_secret_priority:-700}"

# SSR Secret（敏感配置）
llmops_ssr_secret_enabled="${llmops_ssr_secret_enabled:-true}"
llmops_ssr_secret_priority="${llmops_ssr_secret_priority:-600}"

# SSR ConfigMap（非敏感配置）
llmops_ssr_config_enabled="${llmops_ssr_config_enabled:-true}"
llmops_ssr_config_priority="${llmops_ssr_config_priority:-500}"
