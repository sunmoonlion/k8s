apiVersion: v1
kind: Secret
metadata:
  name: postgresql-incubator-db-secret
  namespace: app-platform-dev
type: Opaque
stringData:
  # 标准数据库连接字段（DB_* 格式）
  DB_HOST: "101.126.151.0"
  DB_PORT: "30444"
  DB_NAME: "mydb"
  DB_USER: "sunmoonai_dev"
  # DB_PASSWORD: "CHANGE_ME"
  DB_SSLMODE: "disable"
  DB_URL: "postgresql://sunmoonai_dev:CHANGE_ME@101.126.151.0:30444/mydb"
  
  # 应用代码期望的环境变量格式（POSTGRES_* 格式）
  POSTGRES_SERVER: "101.126.151.0"
  POSTGRES_PORT: "30444"
  POSTGRES_DB: "mydb"
  POSTGRES_USER: "sunmoonai_dev"
  # POSTGRES_PASSWORD: "CHANGE_ME"
---
# Incubator 数据库连接信息 Secret
# 用途：为 celeryworker-incubator 提供独立的数据库连接配置
# 注意：与 incubator-app-backend-secret（应用 Secret）区分开
# 包含两种格式的字段：
#   - DB_* 格式：标准数据库连接字段
#   - POSTGRES_* 格式：应用代码期望的环境变量格式
# 仅归档/占位用途：实际由部署脚本创建与更新；本文件用于结构对齐
