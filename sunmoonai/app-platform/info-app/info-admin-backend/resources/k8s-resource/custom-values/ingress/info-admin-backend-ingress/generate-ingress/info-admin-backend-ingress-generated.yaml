# Info Admin Backend 路由配置 (Traefik IngressRoute)
# FastAPI 挂载点：app.include_router(router, prefix="/api")
# 所有业务路由在 /api/* 下，e.g. /api/auth/login
#
# 访问方式：
# - https://info-admin-api.sunmoonai.com/api/...
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-admin-backend-ingress
  namespace: app-platform-dev
  labels:
    app: app-platform-ingress
    component: info-admin-backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`info-admin-api.sunmoonai.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: info-admin-backend
          port: 8000
