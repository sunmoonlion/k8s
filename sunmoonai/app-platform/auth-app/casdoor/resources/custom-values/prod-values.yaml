# Casdoor 生产环境 Helm Values

image:
  repository: harbor.sunmoonai.com:30443/k8s-images/casdoor
  pullPolicy: IfNotPresent
  # tag 通过 --set image.tag= 注入，生产环境锁定具体版本

imagePullSecrets:
  - name: harbor-registry-secret

env:
  RUNNING_IN_DOCKER: "true"
  driverName: postgres
  dataSourceName:
    valueFrom:
      secretKeyRef:
        name: casdoor-postgresql-conn
        key: APP_DB_URI
        optional: false
  dbName: ""

service:
  main:
    ports:
      http:
        port: 8000

ingress:
  main:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

controller:
  replicas: 2
  strategy: RollingUpdate
  rollingUpdate:
    unavailable: "0"
    surge: 1

probes:
  liveness:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
  readiness:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  startup:
    custom: true
    spec:
      httpGet:
        path: /api/get-account
        port: http
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60

configmap:
  config:
    enabled: true
    data:
      app.conf: |
        appname = casdoor
        httpport = 8000
        runmode = prod
        SessionOn = true
        copyrequestbody = true
        logPostOnly = true
        staticBaseUrl = "."
        aiAssistantUrl = ""

persistence:
  config:
    enabled: true
    type: configMap
    name: casdoor-sunmoonai-config
    mountPath: /conf
    readOnly: true
