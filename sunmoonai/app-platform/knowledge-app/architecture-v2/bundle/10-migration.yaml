apiVersion: batch/v1
kind: Job
metadata:
  name: knowledge-r5-backend-migration-r6-knowledge-formal-003
  namespace: app-platform-dev
  labels:
    app.kubernetes.io/name: knowledge-r5-backend
    app.kubernetes.io/component: backend-migration
    app.kubernetes.io/part-of: knowledge-r5
    sunmoonai.com/app: knowledge-r5
    sunmoonai.com/managed-by: architecture-v2
    sunmoonai.com/release-id: r6-knowledge-formal-003
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-r5-backend
        app.kubernetes.io/component: backend-migration
        app.kubernetes.io/part-of: knowledge-r5
        sunmoonai.com/app: knowledge-r5
        sunmoonai.com/managed-by: architecture-v2
        sunmoonai.com/release-id: r6-knowledge-formal-003
    spec:
      restartPolicy: Never
      serviceAccountName: knowledge-r5-backend-migration
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: harbor.sunmoonai.com:30443/app-images/knowledge-backend@sha256:e6998183a3aadaff337f822031a1bc2396d5256fa395331176dc2b1a44480757
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.bootstrap.migration
        args:
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: knowledge-r5-backend-config
        env:
        - name: MIGRATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-backend-migration-postgresql-conn
              key: MIGRATION_DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
