# =============================================================================
# ONLYOFFICE PostgreSQL Secret 部署配置
# 文件名: deploy-onlyoffice-postgresql-secret.conf
# 用途: 配置 ONLYOFFICE Docs 连接 PostgreSQL 的认证 Secret
# =============================================================================

SECRET_NAME="onlyoffice-postgresql-secret"
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"
SECRET_TYPE="Opaque"

# =============================================================================
# PostgreSQL 密码配置
# ⚠️  重要：这是 ONLYOFFICE Docs 专用数据库用户的密码！
# =============================================================================
# PostgreSQL 用户密码
# 用户名：onlyoffice_docs（在 deploy-onlyoffice-docs.conf 中配置）
# 数据库名：onlyoffice_docs
# 
# 部署前请确保：
# 1. 在 PostgreSQL 中已创建用户：CREATE USER onlyoffice_docs WITH PASSWORD 'your_password';
# 2. 已创建数据库：CREATE DATABASE onlyoffice_docs OWNER onlyoffice_docs;
# 3. 此密码与创建用户时设置的密码保持一致
#
# 如果为空，脚本将提示错误
# 请在此处设置密码，例如：
# POSTGRESQL_PASSWORD="your_secure_password_here"
POSTGRESQL_PASSWORD="${POSTGRESQL_PASSWORD:-}"

# 目标 Secret 键名（ONLYOFFICE Docs 使用的键名）
TARGET_SECRET_KEY="postgres-password"

RESTART_COMPONENTS="false"
RESTART_PRIORITY="50"

