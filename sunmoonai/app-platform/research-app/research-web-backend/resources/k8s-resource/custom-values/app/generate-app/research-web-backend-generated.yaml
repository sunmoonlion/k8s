apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-web-backend
  namespace: app-platform-dev
  labels:
    app: research-web-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-web-backend
  template:
    metadata:
      labels:
        app: research-web-backend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: research-web-backend
        image: harbor.sunmoonai.com:30443/app-images/research-web-backend:1.0.0-rebuild.20260615
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: research-web-backend-config
        - secretRef:
            name: research-web-backend-secret
        - secretRef:
            name: research-web-backend-postgresql-conn
        - secretRef:
            name: research-web-backend-redis-conn
        - secretRef:
            name: research-web-backend-mongodb-conn
        - configMapRef:
            name: research-web-backend-s3
        - secretRef:
            name: research-web-backend-s3
        - configMapRef:
            name: research-web-backend-elasticsearch
        - secretRef:
            name: research-web-backend-elasticsearch
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: elasticsearch-ca
          mountPath: /var/run/secrets/sunmoonai/elasticsearch
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: research-web-backend-pvc
      - name: elasticsearch-ca
        secret:
          secretName: research-web-backend-elasticsearch
          items:
          - key: ca.crt
            path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: research-web-backend
  namespace: app-platform-dev
  labels:
    app: research-web-backend
spec:
  selector:
    app: research-web-backend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
