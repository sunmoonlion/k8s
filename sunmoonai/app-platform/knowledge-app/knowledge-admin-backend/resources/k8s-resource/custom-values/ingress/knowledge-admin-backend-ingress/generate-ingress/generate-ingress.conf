# ============================================================================
# knowledge-admin-backend Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="knowledge-admin-backend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

SERVICE_NAME="${SERVICE_NAME:-knowledge-admin-backend}"
SERVICE_PORT="${SERVICE_PORT:-8000}"
UNIFIED_HOST="${UNIFIED_HOST:-knowledge-admin-api.sunmoonai.com}"

USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-false}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-false}"
