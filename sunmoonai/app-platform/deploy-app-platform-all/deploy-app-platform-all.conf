# ============================================================================
# App Platform 平台基础配置
# ============================================================================
APP_PLATFORM_PROJECT_ID="sunmoonai"
APP_PLATFORM_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 业务应用部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# !!! 新增 app / 新增组件时先看:
#     ../APP-DEVELOPMENT-NOTES.md
#     Harbor 地址不要在脚本逻辑里写死；部署入口只传 kind/c1，由 get_cluster_harbor_registry 统一解析。
#     默认运行时镜像拉取地址：
#       KIND -> harbor.sunmoonai.com:30443
#       C1/C2/C3 -> harbor.sunmoonai.com:30443
#     如某个远程集群需要独立域名，可设置 C1_HARBOR_REGISTRY / C2_HARBOR_REGISTRY。
#     注意：本机 WSL 构建推送入口可以使用 harbor-c1.sunmoonai.com:30443，
#           但集群内 Pod 的 image registry 必须以 get_cluster_harbor_registry 的结果为准。
#
# App Platform 比其它平台多一层“业务应用层”：
#   app-platform -> business app -> deployable component
# 本配置控制业务应用层是否启用。

# Auth App（Casdoor + auth app backend/front）
C1_auth_app_enabled="true"
C2_auth_app_enabled="false"
C3_auth_app_enabled="false"
KIND_auth_app_enabled="true"

# Info App
C1_info_app_enabled="true"
C2_info_app_enabled="false"
C3_info_app_enabled="false"
KIND_info_app_enabled="true"

# Knowledge App
C1_knowledge_app_enabled="false"
C2_knowledge_app_enabled="true"
C3_knowledge_app_enabled="false"
KIND_knowledge_app_enabled="true"

# Research App
C1_research_app_enabled="true"
C2_research_app_enabled="false"
C3_research_app_enabled="false"
KIND_research_app_enabled="true"

# ============================================================================
# 业务应用部署优先级（数值越大越先部署）
# ============================================================================
# Auth 通常先部署，业务应用依赖其认证能力。
C1_auth_app_priority=1000
C2_auth_app_priority=1000
C3_auth_app_priority=1000
KIND_auth_app_priority=1000

C1_info_app_priority=700
C2_info_app_priority=700
C3_info_app_priority=700
KIND_info_app_priority=700

C1_knowledge_app_priority=950
C2_knowledge_app_priority=950
C3_knowledge_app_priority=950
KIND_knowledge_app_priority=950

C1_research_app_priority=650
C2_research_app_priority=650
C3_research_app_priority=650
KIND_research_app_priority=650
