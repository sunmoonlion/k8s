  - kind: Rule
    match: Host(`knowledge.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: knowledge-web-frontend
      port: 3000
    priority: 10
  tls:
    secretName: knowledge-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge-admin-api-route
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: knowledge
    sunmoonai.com/managed-by: app-platform-v2
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`knowledge-admin-api.sunmoonai.com`) && PathPrefix(`/`)
    services:
    - name: knowledge-backend
