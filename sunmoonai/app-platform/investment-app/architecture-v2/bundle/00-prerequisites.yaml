apiVersion: v1
kind: ConfigMap
metadata:
  name: investment-r5-backend-config
  namespace: app-platform-dev
  labels:
    sunmoonai.com/app: investment-r5
    sunmoonai.com/managed-by: architecture-v2
data:
  ENV: production
  LOG_LEVEL: INFO
  SERVICE_NAME: investment-backend
  DEPLOYMENT_ID: r5-investment-formal-001
  APP_SLUG: investment
  REDIS_HOST: redis-sunmoonai-master.data-platform-dev.svc.cluster.local
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  CASDOOR_ENDPOINT: https://casdoor.sunmoonai.com:30443
  CASDOOR_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  CASDOOR_BACKCHANNEL_ENDPOINT: http://casdoor-sunmoonai.app-platform-dev.svc.cluster.local:8000
  CASDOOR_ORGANIZATION: sunmoonai
  CASDOOR_VERIFY_SSL: 'true'
  ADMIN_CASDOOR_CLIENT_ID: sunmoonai-investment-r5-admin
  ADMIN_CASDOOR_REDIRECT_URI: https://investment-admin.sunmoonai.com:30443/api/auth/admin/callback
  ADMIN_CASDOOR_APPLICATION: sunmoonai-investment-r5-admin
  ADMIN_AUTH_POLICY_VERSION: investment-admin-v2
  ADMIN_AUTH_ROLE_ALLOWLIST: admin,operator
  ADMIN_AUTH_SCOPE_ALLOWLIST: investment:admin
  ADMIN_FRONTEND_BASE_URL: https://investment-admin.sunmoonai.com:30443
  ADMIN_FRONTEND_ALLOWED_ORIGINS: https://investment-admin.sunmoonai.com:30443
  ADMIN_AUTH_DEFAULT_RETURN_TO: /
  ADMIN_AUTH_ALLOWED_RETURN_PATHS: /
  WEB_CASDOOR_CLIENT_ID: sunmoonai-investment-r5-web
  WEB_CASDOOR_REDIRECT_URI: https://investment.sunmoonai.com:30443/api/auth/web/callback
  WEB_CASDOOR_APPLICATION: sunmoonai-investment-r5-web
  WEB_AUTH_POLICY_VERSION: investment-web-v2
  WEB_AUTH_ROLE_ALLOWLIST: member
  WEB_AUTH_SCOPE_ALLOWLIST: profile:read
  WEB_FRONTEND_BASE_URL: https://investment.sunmoonai.com:30443
  WEB_FRONTEND_ALLOWED_ORIGINS: https://investment.sunmoonai.com:30443
  WEB_AUTH_DEFAULT_RETURN_TO: /zh-CN/dashboard
  WEB_AUTH_ALLOWED_RETURN_PATHS: /zh-CN/dashboard,/en/dashboard,/zh-CN/login,/en/login
  WEB_FRONTEND_DEFAULT_LOCALE: zh-CN
  SESSION_COOKIE_SECURE: 'true'
  ALLOWED_HOSTS: investment-r5-backend,investment-r5-backend.app-platform-dev,investment-r5-backend.app-platform-dev.svc,investment-r5-backend.app-platform-dev.svc.cluster.local,investment-admin.sunmoonai.com,investment.sunmoonai.com,investment-admin-api.sunmoonai.com,investment-api.sunmoonai.com
  REFERENCE_INTERACTION_ENABLED: 'false'
  SERVICE_AUTH_SUBJECT_BINDINGS_JSON: '{}'
  CELERY_QUEUE: investment.default
  CELERY_WORKER_CONCURRENCY: '2'
  AUTH_ALLOWED_ALGORITHMS: RS256,ES256
  AGENT_V4_TRAFFIC_ENABLED: 'false'
  AGENT_PILOT_ENABLED: 'false'
  AGENT_REDIS_KEY_PREFIX: investment:r5:agent
  KNOWLEDGE_RETRIEVAL_URL: http://knowledge-r5-backend:8000/api/internal/v1/knowledge/retrievals
  KNOWLEDGE_RETRIEVAL_SERVICE_APPLICATION: sunmoonai-investment-knowledge-retrieve
  KNOWLEDGE_RETRIEVAL_SERVICE_DISCOVERY_URL: https://casdoor.sunmoonai.com:30443/.well-known/openid-configuration
  KNOWLEDGE_RETRIEVAL_SERVICE_BACKCHANNEL_ENDPOINT: http://casdoor-sunmoonai.app-platform-dev.svc.cluster.local:8000
  KNOWLEDGE_RETRIEVAL_SERVICE_SCOPE: knowledge:retrieve
  KNOWLEDGE_RETRIEVAL_TIMEOUT_SECONDS: '20'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: investment-r5-admin-frontend-config
