# ============================================================================
# toutiao-app-backend PVC YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/pvc/toutiao-app-backend-pvc.yaml"
OUTPUT_FILE="toutiao-app-backend-pvc-generated.yaml"
ENABLED="false"
RESOURCE_TYPE="pvc"

# 基础配置
NAMESPACE="${NAMESPACE:-invest-app-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# PVC 存储配置
PVC_STORAGE_CLASS="${PVC_STORAGE_CLASS:-local-path}"
PVC_ACCESS_MODE="${PVC_ACCESS_MODE:-ReadWriteOnce}"
PVC_STORAGE_SIZE="${PVC_STORAGE_SIZE:-10Gi}"
