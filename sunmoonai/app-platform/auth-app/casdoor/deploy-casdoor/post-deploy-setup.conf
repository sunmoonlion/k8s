# ============================================================================
# Casdoor 部署后初始化配置
# 供 post-deploy-setup.sh 读取
# ============================================================================

# ----------------------------------------------------------------------------
# PostgreSQL 连接（默认从 db-access-bootstrap/config/postgresql.external.env 读取）
# 如需覆盖，在此取消注释并填值
# ----------------------------------------------------------------------------
# DB_HOST=www.sunmoonai.com
# DB_PORT=30444
# DB_USER=casdoor
# DB_PASSWORD=casdoor_dev_pass
# DB_NAME=casdoor

# ----------------------------------------------------------------------------
# Admin 账号
# built-in 组织的 admin 用户初始密码（password_type=plain）
#
# 同时用于：对每个 ORG_<n> 自动幂等创建「组织名/admin」用户（Investment OAuth 登录）。
# signup_application 取 ORG 行第三列 default_application，须与 APP_<n> 中应用 name 一致。
# ----------------------------------------------------------------------------
ADMIN_PASSWORD="Ca!s1359admin"

# ----------------------------------------------------------------------------
# Organizations
# 格式：每个 ORG_<n> 变量定义一个组织
#   name|display_name|default_application
# ----------------------------------------------------------------------------
ORG_1="investment-web|投资用户端|app-investment-web"
ORG_2="investment-admin|投资管理端|app-investment-admin"

# ----------------------------------------------------------------------------
# Applications
# 格式：每个 APP_<n> 变量定义一个应用
#   name|display_name|client_id|client_secret|organization|redirect_uris_json|enable_sign_up
#
# enable_sign_up: true / false
# redirect_uris_json: JSON 数组字符串，如 ["http://host:port/api/auth/callback"]
# ----------------------------------------------------------------------------
APP_1="app-investment-web|投资用户端|cd8328352070e08cd432|your-client-secret-here|investment-web|[\"https://investment-api.sunmoonai.com/api/auth/callback\"]|true"
APP_2="app-investment-admin|投资管理端|440db4e5a480c02c370d|your-client-secret-here|investment-admin|[\"https://investment-admin-api.sunmoonai.com/api/auth/callback\"]|false"
