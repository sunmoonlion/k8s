# ONLYOFFICE Docs Secrets 总控部署配置

# 子级 Secret 部署控制
harbor_registry_secret_enabled="true"
harbor_registry_secret_priority=1000

onlyoffice_postgresql_secret_enabled="true"
onlyoffice_postgresql_secret_priority=900

onlyoffice_redis_secret_enabled="true"
onlyoffice_redis_secret_priority=800

onlyoffice_rabbitmq_secret_enabled="true"
onlyoffice_rabbitmq_secret_priority=700

onlyoffice_jwt_secret_enabled="false"  # JWT Secret 可选，如果 jwt.enabled=false 则不需要
onlyoffice_jwt_secret_priority=600

# 部署优先级控制（数值越大优先级越高）
# 建议优先级范围：1-1000
harbor_registry_secret_priority=1000  # Harbor 镜像拉取密钥优先级最高（最先部署）
onlyoffice_postgresql_secret_priority=900  # PostgreSQL 连接密钥（必需）
onlyoffice_redis_secret_priority=800  # Redis 连接密钥（必需）
onlyoffice_rabbitmq_secret_priority=700  # RabbitMQ 连接密钥（必需）
onlyoffice_jwt_secret_priority=600  # JWT 认证密钥（可选，仅在 jwt.enabled=true 时需要）

