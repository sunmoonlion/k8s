# ============================================================================
# LLMOps App BFF Ingress YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/ingress/ingress.yaml"
OUTPUT_FILE="llmops-app-backend-ingress-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="ingress"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

SERVICE_NAME="${SERVICE_NAME:-llmops-app-backend}"
SERVICE_PORT="${SERVICE_PORT:-80}"
UNIFIED_HOST="${UNIFIED_HOST:-llmops.sunmoonai.com}"
NODE_IP="${NODE_IP:-101.126.151.0}"
USE_STRIP_PREFIX="${USE_STRIP_PREFIX:-true}"
USE_RATE_LIMIT="${USE_RATE_LIMIT:-false}"
