# LLMOps App BFF 中间件总控部署配置
# 注意：当前使用 stripprefix 中间件，已集成到 ingress.yaml 中
# 其他中间件（auth、rate-limit、monitoring）为预留，可根据需要扩展

# 基础配置
LLMOPS_BFF_PROJECT_ID="sunmoonai"
LLMOPS_BFF_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 注意：stripprefix 已集成到 ingress.yaml 中，不需要单独部署
# 如果需要其他中间件（如 auth、rate-limit 等），可以在这里添加
llmops_bff_stripprefix_enabled="false"  # StripPrefix 中间件（已集成到 ingress.yaml）
llmops_bff_auth_enabled="false"         # Auth 中间件（预留）
llmops_bff_rate_limit_enabled="false"    # Rate Limit 中间件（预留）
llmops_bff_monitoring_enabled="false"    # Monitoring 中间件（预留）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
llmops_bff_stripprefix_priority=100  # StripPrefix 优先级（已集成到 ingress.yaml）
llmops_bff_auth_priority=90         # Auth 优先级（预留）
llmops_bff_rate_limit_priority=80   # Rate Limit 优先级（预留）
llmops_bff_monitoring_priority=70  # Monitoring 优先级（预留）

