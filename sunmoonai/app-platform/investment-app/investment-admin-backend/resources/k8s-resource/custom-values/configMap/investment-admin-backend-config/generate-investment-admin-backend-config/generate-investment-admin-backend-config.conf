# ============================================================================
# Investment Admin Backend ConfigMap YAML 生成配置
# 字段来源：investment-admin-backend/app/core/config.py + .env
# ============================================================================

TEMPLATE_FILE="templates/configMap/investment-admin-backend-config.yaml"
OUTPUT_FILE="investment-admin-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

# 命名空间和环境
NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-production}"

# ============================================================================
# ConfigMap 数据内容（非敏感，对应 config.py 字段）
# ============================================================================
# 基础
ENV="${ENV:-production}"
LOG_LEVEL="${LOG_LEVEL:-INFO}"

# Redis（k8s 内部 Service 地址，不是外网 NodePort）
REDIS_HOST="${REDIS_HOST:-redis-sunmoonai-master.data-platform-dev.svc.cluster.local}"
REDIS_PORT="${REDIS_PORT:-6379}"
REDIS_DB="${REDIS_DB:-0}"
REDIS_USER="${REDIS_USER:-investment_admin_backend}"

# Casdoor BFF（非敏感字段）
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-https://casdoor.sunmoonai.com}"
CASDOOR_CLIENT_ID="${CASDOOR_CLIENT_ID:-440db4e5a480c02c370d}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-https://investment-admin-api.sunmoonai.com/api/auth/callback}"
CASDOOR_ORGANIZATION="${CASDOOR_ORGANIZATION:-investment-admin}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-app-investment-admin}"
CASDOOR_VERIFY_SSL="${CASDOOR_VERIFY_SSL:-true}"

# Session
SESSION_TTL_SECONDS="${SESSION_TTL_SECONDS:-3600}"

# 前端跳转地址
FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-https://investment-admin.sunmoonai.com}"
