# Portal App BFF 路由配置 (Traefik IngressRoute)
# 路径前缀：/api/v1 → 后端服务端口 3000
#
# 使用方式（统一域名）：
# 方案1: 使用 IP 地址（无需 DNS 配置）
# https://<节点IP>:30443/api/v1
# 方案2: 使用统一域名（只需在 /etc/hosts 中添加一个条目）
# https://portal.sunmoonai.com/api/v1
#
# 注意：只需在 /etc/hosts 中添加一条记录即可访问所有服务
# 示例：101.126.151.0  portal.sunmoonai.com
#
---
# Middleware: 根据配置选择使用 stripprefix 或 rate-limit
# 如果 USE_STRIP_PREFIX=true，使用路径前缀剥离中间件（在此文件中定义）
# 如果 USE_STRIP_PREFIX=false，使用限流中间件（需要单独部署，使用 portal-app-backend-rate-limit）
# 注意：此部分由生成脚本根据 USE_STRIP_PREFIX 配置决定是否包含
#STRIP_PREFIX_MIDDLEWARE_START
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-app-backend-stripprefix
  namespace: ${NAMESPACE}
  labels:
    app: app-platform-ingress
    component: portal-app-backend
    middleware-type: stripprefix
spec:
  stripPrefix:
    prefixes:
      - "/api/v1"
#STRIP_PREFIX_MIDDLEWARE_END
---
# IngressRoute: HTTP 路由
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-app-backend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: portal-app-backend
spec:
  entryPoints:
    - websecure
  routes:
    # 使用节点 IP 访问 - 文档路径（精确匹配，优先级高，不需要 stripPrefix）
    - match: Host(`{{NODE_IP}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{NODE_IP}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用节点 IP 访问 - OpenAPI JSON（精确匹配，不使用 stripPrefix）
    - match: Host(`{{NODE_IP}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用节点 IP 访问 - API 路径（需要 stripPrefix）
    # 注意：NestJS 使用 PREFIX=/api 和 VERSION=v1，所以完整路径是 /api/v1
    # 如果后端路由有 /api/v1 前缀，不应该使用 stripPrefix
    - match: Host(`{{NODE_IP}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END
    
    # 使用统一域名访问 - 文档路径（精确匹配，优先级高，不需要 stripPrefix）
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/docs`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/redoc`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用统一域名访问 - OpenAPI JSON（精确匹配，不使用 stripPrefix）
    - match: Host(`{{UNIFIED_HOST}}`) && Path(`/api/v1/openapi.json`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
    
    # 使用统一域名访问 - API 路径（需要 stripPrefix）
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
      middlewares:
#MIDDLEWARE_LIST_START
# 根据配置生成中间件列表（由生成脚本处理）
#MIDDLEWARE_LIST_END
  # TLS 配置
  # 注意：Traefik 的 TLSStore 配置了 defaultCertificate，会自动使用 ingress-platform-dev/traefik-tls-secret
  # 如果需要显式指定，可以使用跨命名空间引用：ingress-platform-dev/traefik-tls-secret
  # 但通常不需要，因为 TLSStore 的 defaultCertificate 会自动处理
  # tls:
  #   secretName: ingress-platform-dev/traefik-tls-secret

