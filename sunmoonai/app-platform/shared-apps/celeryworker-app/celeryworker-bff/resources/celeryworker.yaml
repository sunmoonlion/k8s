apiVersion: apps/v1
kind: Deployment
metadata:
  name: celeryworker
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celeryworker
  template:
    metadata:
      labels:
        app: celeryworker
    spec:
      # Init Container: 从 Backend 镜像提取任务定义代码
      initContainers:
      - name: extract-worker-code
        image: ${BACKEND_IMAGE_REGISTRY}/${BACKEND_IMAGE_PROJECT}/${BACKEND_IMAGE}:${BACKEND_TAG}  # Backend 镜像（部署时会从 deploy-celeryworker.conf 动态替换为实际镜像名称）
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}
        env:
        # 代码提取配置（从 deploy-celeryworker.conf 读取）
        - name: CODE_EXTRACT_SOURCE_DIR
          value: "${CODE_EXTRACT_SOURCE_DIR:-/app/app}"
        - name: CODE_EXTRACT_TARGET_DIR
          value: "${CODE_EXTRACT_TARGET_DIR:-/shared/app}"
        - name: CODE_EXTRACT_DIRS
          value: "${CODE_EXTRACT_DIRS:-worker core services db models schemas crud}"
        - name: CODE_EXTRACT_FILES
          value: "${CODE_EXTRACT_FILES:-__init__.py celeryworker_pre_start.py}"
        command: ['sh', '-c', |
          echo "=========================================="
          echo "从 ${BACKEND_IMAGE} 镜像提取任务定义代码"
          echo "=========================================="
          echo "源代码路径: ${CODE_EXTRACT_SOURCE_DIR}"
          echo "目标路径: ${CODE_EXTRACT_TARGET_DIR}"
          echo "提取目录: ${CODE_EXTRACT_DIRS}"
          echo "提取文件: ${CODE_EXTRACT_FILES}"
          echo "=========================================="
          
          SOURCE_DIR="${CODE_EXTRACT_SOURCE_DIR}"
          TARGET_DIR="${CODE_EXTRACT_TARGET_DIR}"
          
          mkdir -p "$TARGET_DIR"
          
          # 复制目录（从环境变量读取目录列表）
          if [ -n "${CODE_EXTRACT_DIRS}" ]; then
            echo ""
            echo "开始复制目录..."
            for dir in ${CODE_EXTRACT_DIRS}; do
              if [ -d "$SOURCE_DIR/$dir" ]; then
                echo "  ✓ 复制 $dir/..."
                cp -r "$SOURCE_DIR/$dir" "$TARGET_DIR/"
              else
                echo "  ⚠ 跳过 $dir/（目录不存在）"
              fi
            done
          fi
          
          # 复制文件（从环境变量读取文件列表）
          if [ -n "${CODE_EXTRACT_FILES}" ]; then
            echo ""
            echo "开始复制文件..."
            for file in ${CODE_EXTRACT_FILES}; do
              if [ -f "$SOURCE_DIR/$file" ]; then
                echo "  ✓ 复制 $file"
                cp "$SOURCE_DIR/$file" "$TARGET_DIR/"
              else
                echo "  ⚠ 跳过 $file（文件不存在）"
              fi
            done
          fi
          
          echo ""
          echo "=========================================="
          echo "代码提取完成，目标目录内容:"
          echo "=========================================="
          ls -la "$TARGET_DIR" || true
          echo ""
        ]
        volumeMounts:
        - name: worker-code
          mountPath: /shared
      
      containers:
      - name: celeryworker
        image: ${CELERY_WORKER_IMAGE_REGISTRY}/${CELERY_WORKER_IMAGE_PROJECT}/${CELERY_WORKER_IMAGE}:${CELERY_WORKER_TAG}  # 轻量级基础设施镜像（部署时会从 build.conf 动态替换为实际镜像名称）
        imagePullPolicy: ${IMAGE_PULL_POLICY:-IfNotPresent}
        volumeMounts:
        - name: worker-code
          mountPath: /app/app  # 挂载提取的代码
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: CELERY_BROKER_URL
          value: "${CELERY_BROKER_URL:-amqp://admin:admin123@rabbitmq-sunmoonai.messaging-platform-dev:5672//}"
        - name: CELERY_RESULT_BACKEND
          value: "${CELERY_RESULT_BACKEND:-redis://redis-service.data-platform:6379}"
        - name: CELERY_QUEUE
          value: "${CELERY_QUEUE:-llmops-queue}"  # 队列名称（可根据应用调整）
        - name: CELERY_CONCURRENCY
          value: "${CELERY_CONCURRENCY:-1}"  # Worker 并发数
        # 数据库连接（任务执行需要）
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgresql-llmopsservice-db-secret
              key: DB_URL
        # Redis 连接（如果需要，从 Secret 读取或使用环境变量）
        - name: REDIS_URL
          value: "${REDIS_URL:-redis://redis-service.data-platform:6379}"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker
            - inspect
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
      
      volumes:
      - name: worker-code
        emptyDir: {}  # 临时存储，Pod 重启时清空并重新提取
---
apiVersion: v1
kind: Service
metadata:
  name: celeryworker-service
  namespace: ${NAMESPACE:-app-platform-dev}
  labels:
    app: celeryworker
spec:
  selector:
    app: celeryworker
  ports:
  - port: 5555
    targetPort: 5555
    protocol: TCP
  type: ClusterIP

