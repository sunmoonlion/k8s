# ============================================================================
# Investment App 业务应用基础配置
# ============================================================================
INVESTMENT_APP_PROJECT_ID="sunmoonai"
INVESTMENT_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 组件部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
C1_investment_web_backend_enabled="true"
C2_investment_web_backend_enabled="false"
C3_investment_web_backend_enabled="false"
KIND_investment_web_backend_enabled="true"

C1_investment_admin_backend_enabled="true"
C2_investment_admin_backend_enabled="false"
C3_investment_admin_backend_enabled="false"
KIND_investment_admin_backend_enabled="true"

C1_investment_web_frontend_enabled="true"
C2_investment_web_frontend_enabled="false"
C3_investment_web_frontend_enabled="false"
KIND_investment_web_frontend_enabled="true"

C1_investment_admin_frontend_enabled="true"
C2_investment_admin_frontend_enabled="false"
C3_investment_admin_frontend_enabled="false"
KIND_investment_admin_frontend_enabled="true"

# ============================================================================
# 组件部署优先级（数值越大越先部署）
# ============================================================================
# 后端先于前端，web/admin 两组互相独立。
C1_investment_web_backend_priority=900
C2_investment_web_backend_priority=900
C3_investment_web_backend_priority=900
KIND_investment_web_backend_priority=900

C1_investment_admin_backend_priority=850
C2_investment_admin_backend_priority=850
C3_investment_admin_backend_priority=850
KIND_investment_admin_backend_priority=850

C1_investment_web_frontend_priority=800
C2_investment_web_frontend_priority=800
C3_investment_web_frontend_priority=800
KIND_investment_web_frontend_priority=800

C1_investment_admin_frontend_priority=750
C2_investment_admin_frontend_priority=750
C3_investment_admin_frontend_priority=750
KIND_investment_admin_frontend_priority=750
