# Flower 策略中间件部署配置

# 基础配置
FLOWER_PROJECT_ID="sunmoonai"
FLOWER_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# 策略类型配置
# 注意：Traefik 不支持在同一个 Middleware 中同时使用 rateLimit 和 headers
# 当前只使用 rateLimit，如果需要 headers 功能，应创建独立的 flower-headers middleware
FLOWER_POLICY_TYPES="rateLimit"

# 限流配置
FLOWER_RATE_LIMIT_AVERAGE="20"
FLOWER_RATE_LIMIT_BURST="40"

# 头部配置（已移除，如需使用请创建独立的 flower-headers middleware）
# FLOWER_HEADERS_CUSTOM_REQUEST_HEADERS="X-Flower-Version:2.0"
# FLOWER_HEADERS_CUSTOM_RESPONSE_HEADERS="X-Flower-Status:active"

