# 功能开关说明：
# 1. STEP11_ENABLED: 整个Step11步骤的总开关（控制所有功能）
# 2. STEP11_ENABLE_IMAGE_LOADING: 镜像加载功能的子开）# 3. STEP11_ENABLE_HARBOR_DNS: Harbor DNS映射功能的子开）# 4. 组合使用）#    - 只启用镜像加载：STEP11_ENABLED=true, STEP11_ENABLE_IMAGE_LOADING=true, STEP11_ENABLE_HARBOR_DNS=false
#    - 只启用DNS映射：STEP11_ENABLED=true, STEP11_ENABLE_IMAGE_LOADING=false, STEP11_ENABLE_HARBOR_DNS=true
#    - 全部启用：STEP11_ENABLED=true, STEP11_ENABLE_IMAGE_LOADING=true, STEP11_ENABLE_HARBOR_DNS=true
#    - 全部禁用：STEP11_ENABLED=false（其他开关会被忽略）

# Harbor DNS 映射说明）# 1. STEP11_HARBOR_DOMAIN: Harbor域名，用于镜像仓库访）# 2. STEP11_HARBOR_LOCAL_IP: 用于 /etc/hosts 映射的私网IP地址（优先使用）
# 3. STEP11_HARBOR_PUBLIC_IP: 用于 /etc/hosts 映射的公网IP地址（仅在私网IP未配置时使用）#    - Harbor 通过 Traefik Ingress 暴露，Traefik 使用 NodePort 30443
#    - 由于 NodePort 在所有节点上都可用，因此可以使用任意节点IP
#    - 重要）etc/hosts 中同一个域名有多个IP时，系统只使用第一个匹配的条目
#    - 因此脚本会优先使用私网IP（如果配置了），否则使用公网IP
#    - 只添加一个IP映射到所有节点的 /etc/hosts，例如：192.168.3.89 harbor.sunmoonai.com
#    - 支持多集群配置：使用 C{数字}_STEP11_HARBOR_LOCAL_IP ）C{数字}_STEP11_HARBOR_PUBLIC_IP 为每个集群指定不同的IP
#    - 系统会根）CLUSTER 自动映射对应的配）#    - 例如：CLUSTER=C2 时，C2_STEP11_HARBOR_LOCAL_IP 会被映射）STEP11_HARBOR_LOCAL_IP
# 4. STEP11_HARBOR_PORT: Harbor服务端口，默）0443（Traefik websecure entryPoint）# 5. 功能：在每个节点）etc/hosts文件中添加Harbor域名映射（优先使用私网IP）# 6. 用途：确保所有节点都能正确解析Harbor域名，支持镜像拉取和推）#    同时确保 Harbor 部署脚本能在控制平面节点上检）Harbor API
#    优先使用私网IP（内网访问更快更安全），如果私网IP未配置则使用公网IP
# 7. 架构：Harbor 通过 Traefik Ingress 暴露，Traefik 使用 NodePort 30443

STEP11_ENABLE_IMAGE_LOADING=true              # 是否启用镜像加载功能
