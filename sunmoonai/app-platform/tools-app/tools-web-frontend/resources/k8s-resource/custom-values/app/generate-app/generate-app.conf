# ============================================================================
# tools-web-frontend Deployment YAML 生成配置
# ============================================================================

TEMPLATE_FILE="templates/app/tools-web-frontend.yaml"
OUTPUT_FILE="tools-web-frontend-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="app"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-development}"
ENV="${ENV:-dev}"

# 镜像配置
TOOLS_WEB_FRONTEND_IMAGE_REGISTRY="${TOOLS_WEB_FRONTEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
KIND_TOOLS_WEB_FRONTEND_IMAGE_REGISTRY="harbor.sunmoonai.com:30443"
TOOLS_WEB_FRONTEND_IMAGE_PROJECT="${TOOLS_WEB_FRONTEND_IMAGE_PROJECT:-app-images}"
TOOLS_WEB_FRONTEND_IMAGE="${TOOLS_WEB_FRONTEND_IMAGE:-tools-web-frontend}"
TOOLS_WEB_FRONTEND_TAG="${TOOLS_WEB_FRONTEND_TAG:-1.0.0}"
IMAGE_PULL_POLICY="${IMAGE_PULL_POLICY:-Always}"
TOOLS_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME="${TOOLS_WEB_FRONTEND_IMAGE_PULL_SECRET_NAME:-harbor-registry-secret}"

# Secret / ConfigMap 名称
TOOLS_WEB_FRONTEND_SECRET_NAME="${TOOLS_WEB_FRONTEND_SECRET_NAME:-tools-web-frontend-secret}"
TOOLS_WEB_FRONTEND_CONFIGMAP_NAME="${TOOLS_WEB_FRONTEND_CONFIGMAP_NAME:-tools-web-frontend-config}"
TOOLS_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME="${TOOLS_WEB_FRONTEND_OBJECT_STORAGE_CONFIGMAP_NAME-}"
TOOLS_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME="${TOOLS_WEB_FRONTEND_OBJECT_STORAGE_SECRET_NAME-}"
TOOLS_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME="${TOOLS_WEB_FRONTEND_ELASTICSEARCH_CONFIGMAP_NAME-}"
TOOLS_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME="${TOOLS_WEB_FRONTEND_ELASTICSEARCH_SECRET_NAME-}"
TOOLS_WEB_FRONTEND_POSTGRESQL_SECRET_NAME="${TOOLS_WEB_FRONTEND_POSTGRESQL_SECRET_NAME-}"
TOOLS_WEB_FRONTEND_REDIS_SECRET_NAME="${TOOLS_WEB_FRONTEND_REDIS_SECRET_NAME-}"
TOOLS_WEB_FRONTEND_MONGODB_SECRET_NAME="${TOOLS_WEB_FRONTEND_MONGODB_SECRET_NAME-}"

# PVC 配置
PVC_NAME="${PVC_NAME:-tools-web-frontend-pvc}"
PVC_MOUNT_PATH="${PVC_MOUNT_PATH:-/app/data}"
PVC_SUB_PATH="${PVC_SUB_PATH:-}"
