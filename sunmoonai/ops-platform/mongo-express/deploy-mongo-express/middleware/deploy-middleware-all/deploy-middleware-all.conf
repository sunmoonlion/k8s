# MongoExpress 中间件总控部署配置

# 基础配置
MONGO_EXPRESS_PROJECT_ID="sunmoonai"
MONGO_EXPRESS_NAMESPACE="ops-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 中间件组件启用配置
# ============================================================================
# 注意：变量名使用下划线，不能使用连字符（bash 变量名限制）
# 注意：Mongo Express 通过 ME_CONFIG_SITE_BASEURL 自己处理路径，不需要 stripPrefix 中间件
mongo_express_policy_enabled="true"        # Policy 中间件（限流和 headers）

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
mongo_express_policy_priority=100       # Policy 中间件优先级
