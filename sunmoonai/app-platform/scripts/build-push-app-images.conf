# App Platform App 镜像构建与推送配置
#
# 本文件只服务于 build-push-app-images.sh：
#   在 WSL 本地 docker build，再 docker push 到指定 Harbor。
#
# 与 Harbor 复制（仓库管理 → 复制管理）是两套独立机制，勿混用：
#   - 直推：改本文件或 CLUSTER=KIND|C1，由脚本推到目标 Harbor
#   - 复制：Kind Harbor UI 配置规则，从源 Harbor 同步到目标 Harbor
#     见 cicd-platform/harbor/docs/kind-to-c1-sync-README.md
#
# 配置优先级：
# 1. 执行命令前显式传入的环境变量
# 2. 本配置文件（按 CLUSTER 读取 *_TARGET_REGISTRY / *_BASE_REGISTRY / *_TAG）
# 3. build-push-app-images.sh 内置默认值

# 默认目标集群。执行时用 CLUSTER=KIND 或 CLUSTER=C1 切换直推目标。
DEFAULT_CLUSTER="KIND"

# 默认镜像版本。正式开发基线当前使用 1.0.0。
TAG="1.0.0"

# 构建平台。Kind 和当前远程开发集群均使用 amd64。
PLATFORM="linux/amd64"

# Docker build 输出模式：auto / plain / tty。
PROGRESS="auto"

# 是否禁用 Docker 构建缓存。
NO_CACHE="true"

# 从指定 app/component 开始继续构建，例如：
# START_FROM="research/admin-backend"
START_FROM=""

# 只打印 docker build / docker push 命令，不实际执行。
DRY_RUN="false"

# App 源码所在根目录。默认各 App 在 /home/zymun/{app}-app。
SOURCE_ROOT="${HOME}"

# 本轮纳入统一构建的 App。
APPS="info research knowledge"

# 每个 App 纳入统一构建的组件。
COMPONENTS="admin-backend admin-frontend web-backend web-frontend"

# Python / Debian / Node 依赖镜像源。
PYPI_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"
DEBIAN_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian"
DEBIAN_SECURITY_MIRROR="http://mirrors.tuna.tsinghua.edu.cn/debian-security"
NPM_REGISTRY="https://registry.npmmirror.com"

# ── 直推目标 Harbor（按 CLUSTER 选择）──
#
# | CLUSTER | 本机 WSL 直推地址               | 前置条件                          |
# |---------|--------------------------------|-----------------------------------|
# | KIND    | harbor.sunmoonai.com:30443     | WSL 解析到本机 Kind Harbor        |
# | C1      | harbor-c1.sunmoonai.com:30443  | /etc/hosts 指向 C1 公网 IP        |
#
# 为何 C1 在本机 WSL 用 harbor-c1 而非 harbor.sunmoonai.com：
#   本机同时跑着 Kind Harbor，harbor.sunmoonai.com 会解析到本地实例，与远程 C1 冲突。
#
# 若在另一台机器上构建直推（无本机 Kind Harbor 冲突），可直接用 harbor.sunmoonai.com:30443
# 推到远程 C1，无需 harbor-c1 别名。例如：
#   C1_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
#   C1_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
#
# C1 集群内 Pod 拉镜像仍用 harbor.sunmoonai.com:30443（部署配置），
# 与 WSL 侧直推入口可不同，但落到同一套远程 Harbor 实例。

# Kind 本地开发集群
KIND_TARGET_REGISTRY="harbor.sunmoonai.com:30443/app-images"
KIND_BASE_REGISTRY="harbor.sunmoonai.com:30443/k8s-images"
KIND_TAG="1.0.0"

# 远程开发集群 C1
# 默认按本机 WSL 场景：用 harbor-c1 避开与 Kind Harbor 的 harbor.sunmoonai.com 冲突。
# 若在其它机器直推远程 C1，可改回 harbor.sunmoonai.com:30443（见上方说明）。
C1_TARGET_REGISTRY="harbor-c1.sunmoonai.com:30443/app-images"
C1_BASE_REGISTRY="harbor-c1.sunmoonai.com:30443/k8s-images"
C1_TAG="1.0.0"

# 预留远程集群（上线前按实际 Harbor 入口填写）
# 无本机 Kind 冲突时，通常可直接用 harbor.sunmoonai.com:30443；本机 WSL 则仿 C1 用独立别名。
C2_TARGET_REGISTRY="harbor-c2.sunmoonai.com:30443/app-images"
C2_BASE_REGISTRY="harbor-c2.sunmoonai.com:30443/k8s-images"
C2_TAG="1.0.0"

C3_TARGET_REGISTRY="harbor-c3.sunmoonai.com:30443/app-images"
C3_BASE_REGISTRY="harbor-c3.sunmoonai.com:30443/k8s-images"
C3_TAG="1.0.0"
