---
- import_playbook: ../host/preflight.yaml
- name: Render or verify template identities and runtime through Flux
  hosts: kind_hosts
  gather_facts: false
  become: true
  vars:
    application_name: tpl
    application_action: plan
    capacity_operation: application-deploy-tpl
    cfg: '{{ tpl_deployment | combine(tpl_backend_deployment) | combine({"namespace":app_namespace, "web_origin":tpl_web_deployment.origin, "admin_origin":tpl_admin_deployment.origin}) }}'
    app_root: '{{ playbook_dir }}/../../gitops/components/app-platform/tpl-app'
    component_root: '{{ app_root }}/tpl-backend'
    repo: '{{ playbook_dir }}/../..'
    build: '{{ playbook_dir }}/../.build/applications/deployment/tpl/tpl-backend'
    tools: '{{ playbook_dir }}/../.tools/bin'
    recipient: '{{ lookup("file", playbook_dir + "/../environments/kind/sops-recipient.txt") | trim }}'
    app_images:
      backend: '{{ lookup("file", component_root + "/image.lock.yaml") | from_yaml }}'
      web: '{{ lookup("file", app_root + "/tpl-web-frontend/image.lock.yaml") | from_yaml }}'
      admin: '{{ lookup("file", app_root + "/tpl-admin-frontend/image.lock.yaml") | from_yaml }}'
    deployment_id: 'tpl-{{ (app_images | to_json | hash("sha256"))[:16] }}'
    browser_clients:
      web: {name: '{{ tpl_web_deployment.casdoor_application }}', client_id: '{{ tpl_web_deployment.casdoor_client_id }}', origin: '{{ tpl_web_deployment.origin }}'}
      admin: {name: '{{ tpl_admin_deployment.casdoor_application }}', client_id: '{{ tpl_admin_deployment.casdoor_client_id }}', origin: '{{ tpl_admin_deployment.origin }}'}
    source_lock: '{{ (lookup("file", playbook_dir + "/sources.yaml") | from_yaml).applications.tpl }}'
    images: '{{ (lookup("file", playbook_dir + "/../artifacts/upstream-images.lock.json") | from_json).images }}'
    image_map: '{{ dict(images | map(attribute="id") | zip(images)) }}'
    migration_job: 'tpl-migrate-{{ app_images.backend.digest[7:19] }}-{{ cfg.migration_job_revision }}'
    kube: ['{{ tools }}/kubectl', '--kubeconfig={{ cluster_kubeconfig }}', '--context=kind-{{ cluster_name }}', '--request-timeout=30s']
    candidate_files: [database/workload.yaml, database/bootstrap.sops.yaml, database/runtime.sops.yaml, database/kustomization.yaml, migration/workload.yaml, migration/auth.sops.yaml, migration/kustomization.yaml, redis/workload.yaml, redis/provision.sops.yaml, redis/runtime.sops.yaml, redis/kustomization.yaml, rabbitmq/workload.yaml, rabbitmq/provision.sops.yaml, rabbitmq/runtime.sops.yaml, rabbitmq/kustomization.yaml, identity/workload.yaml, identity/provision.sops.yaml, identity/runtime.sops.yaml, identity/kustomization.yaml, runtime/workload.yaml, runtime/tls.sops.yaml, runtime/kustomization.yaml, ../tpl-web-frontend/workload.yaml, ../tpl-web-frontend/kustomization.yaml, ../tpl-admin-frontend/workload.yaml, ../tpl-admin-frontend/kustomization.yaml]
  tasks:
    - name: Validate the selected deployment and identity boundaries
      ansible.builtin.assert:
        quiet: true
        that:
          - not ansible_check_mode
          - application_name == 'tpl'
          - application_action in ['plan','render','stage','validate','check']
          - application_action == 'plan' or cfg.enabled | bool
          - cfg.namespace == app_namespace
          - "'namespace' not in tpl_deployment"
          - "'namespace' not in tpl_backend_deployment"
          - tpl_deployment.keys() | intersect(tpl_backend_deployment.keys()) | length == 0
          - cfg.database is match('^[a-z][a-z0-9_]{1,40}$')
          - cfg.database_runtime_user is match('^[a-z][a-z0-9_]{1,40}$')
          - cfg.database_migrator_user is match('^[a-z][a-z0-9_]{1,40}$')
          - cfg.database_runtime_user != cfg.database_migrator_user
          - cfg.database_bootstrap_revision is match('^[a-z0-9-]{1,16}$')
          - cfg.migration_job_revision is match('^[a-z0-9-]{1,16}$')
          - cfg.private_dir == '/etc/sunmoon/applications/' + cluster_name + '/tpl'
          - cfg.backup_dir == '/mnt/sunmoon-data/backups/applications/' + cluster_name + '/tpl'
          - app_images.backend.repository == 'tpl-backend'
          - app_images.backend.digest is match('^sha256:[a-f0-9]{64}$')
          - app_images.backend.source_revision == source_lock.backend_revision
          - cfg.deploy_budget_bytes | int >= 2147483648
          - app_images.web.repository == 'tpl-web-frontend'
          - app_images.admin.repository == 'tpl-admin-frontend'
          - app_images.web.digest is match('^sha256:[a-f0-9]{64}$')
          - app_images.admin.digest is match('^sha256:[a-f0-9]{64}$')
          - app_images.web.source_revision == source_lock.web_revision
          - app_images.admin.source_revision == source_lock.admin_revision
          - cfg.scheduler_replicas | int == 1
          - cfg.celery_control_queue_exclusive is sameas true
          - cfg.celery_event_queue_exclusive is sameas true
          - cfg.api_replicas | int >= 1
          - cfg.worker_replicas | int >= 1
          - cfg.worker_concurrency | int >= 1
          - cfg.api_port | int > 1024 and cfg.api_port | int < 65536
          - tpl_web_deployment.port | int > 1024 and tpl_web_deployment.port | int < 65536
          - tpl_admin_deployment.port | int > 1024 and tpl_admin_deployment.port | int < 65536
          - tpl_web_deployment.replicas | int >= 1
          - tpl_admin_deployment.replicas | int >= 1
          - cfg.web_origin is match('^https://[a-z0-9.-]+:30443$')
          - cfg.admin_origin is match('^https://[a-z0-9.-]+:30443$')
          - cfg.web_origin != cfg.admin_origin
          - cfg.rabbitmq_user is match('^[a-z][a-z0-9_.-]{1,63}$')
          - cfg.rabbitmq_user not in ['admin','guest']
          - cfg.rabbitmq_vhost == 'tpl'
          - cfg.rabbitmq_queue == 'tpl.default'
          - cfg.rabbitmq_identity_revision is match('^[a-z0-9-]{1,16}$')
          - cfg.identity_organization == 'built-in'
          - cfg.identity_revision is match('^[a-z0-9-]{1,16}$')
          - browser_clients.web.client_id != browser_clients.admin.client_id
          - browser_clients.web.name != browser_clients.admin.name
    - name: Require the independent cluster ownership receipt
      ansible.builtin.slurp: {src: '{{ cluster_data_root }}/{{ cluster_name }}/bootstrap/identity.json'}
      register: identity
    - name: Refuse another live API even if the kubeconfig path is reused
      ansible.builtin.command:
        argv: '{{ kube + ["get","ns","kube-system","-o","jsonpath={.metadata.uid}"] }}'
      register: uid
      changed_when: false
      failed_when: uid.rc != 0 or uid.stdout != (identity.content | b64decode | from_json).kube_system_uid
    - name: Show the deployment plan without credentials
      ansible.builtin.debug:
        msg:
          enabled: '{{ cfg.enabled }}'
          namespace: '{{ cfg.namespace }}'
          database: '{{ cfg.database }}'
          runtime_user: '{{ cfg.database_runtime_user }}'
          migrator_user: '{{ cfg.database_migrator_user }}'
          backend: '{{ app_images.backend.digest }}'
          schema: '{{ cfg.expected_schema_revision }}'
          stages: [tpl-database, tpl-migration, tpl-redis, tpl-rabbitmq, tpl-identity, tpl-runtime, tpl-web, tpl-admin]
          image_and_data_budget: '{{ cfg.deploy_budget_bytes }}'
          excluded: 'Public entry cutover is separate; verify new entry before redirecting existing domains.'
      when: application_action == 'plan'
    - name: End the read-only plan
      ansible.builtin.meta: end_host
      when: application_action == 'plan'
    - name: Render recoverable inputs and candidate declarations
      when: application_action == 'render'
      block:
        - name: Require capacity for the whole database and migration unit
          ansible.builtin.include_tasks:
            file: ../host/tasks/capacity.yaml
            apply: {become: false}
          vars: {capacity_planned_bytes: '{{ cfg.deploy_budget_bytes }}'}
        - name: Inspect private and independent backup directories
          ansible.builtin.stat: {path: '{{ item }}', follow: false}
          loop: ['{{ cfg.private_dir }}','{{ cfg.backup_dir }}']
          register: private_dirs
        - name: Reject redirected or foreign private directories
          ansible.builtin.assert:
            quiet: true
            that:
              - not item.stat.islnk | default(false)
              - not item.stat.exists or (item.stat.isdir | default(false) and item.stat.uid == 0)
          loop: '{{ private_dirs.results }}'
          loop_control: {label: '{{ item.item }}'}
        - name: Create root-only application input and backup directories
          ansible.builtin.file: {path: '{{ item }}', state: directory, owner: root, group: root, mode: '0700'}
          loop: ['{{ cfg.private_dir }}','{{ cfg.backup_dir }}']
        - name: Inspect both credential files before initialization
          ansible.builtin.stat: {path: '{{ item }}/credentials.yaml', follow: false}
          loop: ['{{ cfg.private_dir }}','{{ cfg.backup_dir }}']
          register: credential_files
          no_log: true
        - name: Require secure regular files
          ansible.builtin.assert:
            quiet: true
            that:
              - not item.stat.islnk | default(false)
              - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
          loop: '{{ credential_files.results }}'
          no_log: true
        - name: Restore an existing independent backup without changing its values
          ansible.builtin.copy: {src: '{{ cfg.backup_dir }}/credentials.yaml', dest: '{{ cfg.private_dir }}/credentials.yaml', remote_src: true, mode: '0600'}
          when: not credential_files.results[0].stat.exists and credential_files.results[1].stat.exists
          no_log: true
        - name: Never replace lost credentials after declarations exist
          ansible.builtin.assert:
            quiet: true
            that: credential_files.results[0].stat.exists or credential_files.results[1].stat.exists or (query('fileglob', component_root + '/database/bootstrap.sops.yaml') | length == 0)
            fail_msg: Restore the application credential backup; never regenerate an existing database identity.
        - name: Initialize two distinct private identities for a new deployment
          ansible.builtin.copy:
            dest: '{{ cfg.private_dir }}/credentials.yaml'
            force: false
            mode: '0600'
            content: |
              migrator_password: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
              runtime_password: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
          when: not credential_files.results[0].stat.exists and not credential_files.results[1].stat.exists
          no_log: true
        - name: Preserve independent non-overwritten credential backup
          ansible.builtin.copy: {src: '{{ cfg.private_dir }}/credentials.yaml', dest: '{{ cfg.backup_dir }}/credentials.yaml', remote_src: true, force: false, mode: '0600'}
          no_log: true
        - name: Require byte-identical primary and backup inputs
          ansible.builtin.command: {argv: [cmp, --silent, '{{ cfg.private_dir }}/credentials.yaml', '{{ cfg.backup_dir }}/credentials.yaml']}
          changed_when: false
          no_log: true
        - name: Read private application input
          ansible.builtin.slurp: {src: '{{ cfg.private_dir }}/credentials.yaml'}
          register: secret_input
          no_log: true
        - name: Decode secrets only in memory
          ansible.builtin.set_fact:
            app_credentials: '{{ secret_input.content | b64decode | from_yaml }}'
          no_log: true
        - name: Validate URL-safe strong independent credentials
          ansible.builtin.assert:
            quiet: true
            that:
              - app_credentials.runtime_password is match('^[a-zA-Z0-9]{40}$')
              - app_credentials.migrator_password is match('^[a-zA-Z0-9]{40}$')
              - app_credentials.runtime_password != app_credentials.migrator_password
          no_log: true
        - name: Inspect recoverable Redis credential input
          ansible.builtin.stat: {path: '{{ item }}/redis.yaml', follow: false}
          loop: ['{{ cfg.private_dir }}', '{{ cfg.backup_dir }}']
          register: redis_files
          no_log: true
        - name: Require root-only regular Redis input files
          ansible.builtin.assert:
            quiet: true
            that:
              - not item.stat.islnk | default(false)
              - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
          loop: '{{ redis_files.results }}'
          no_log: true
        - name: Restore a preserved Redis input without rotating its password
          ansible.builtin.copy: {src: '{{ cfg.backup_dir }}/redis.yaml', dest: '{{ cfg.private_dir }}/redis.yaml', remote_src: true, mode: '0600'}
          when: not redis_files.results[0].stat.exists and redis_files.results[1].stat.exists
          no_log: true
        - name: Refuse to regenerate a declared Redis identity
          ansible.builtin.assert:
            quiet: true
            that: redis_files.results[0].stat.exists or redis_files.results[1].stat.exists or (query('fileglob', component_root + '/redis/provision.sops.yaml') | length == 0)
        - name: Create an independent Redis password only on first preparation
          ansible.builtin.copy:
            dest: '{{ cfg.private_dir }}/redis.yaml'
            force: false
            mode: '0600'
            content: |
              password: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
          when: not redis_files.results[0].stat.exists and not redis_files.results[1].stat.exists
          no_log: true
        - name: Preserve the independent Redis credential backup
          ansible.builtin.copy: {src: '{{ cfg.private_dir }}/redis.yaml', dest: '{{ cfg.backup_dir }}/redis.yaml', remote_src: true, force: false, mode: '0600'}
          no_log: true
        - name: Verify Redis input against its non-overwritten backup
          ansible.builtin.command: {argv: [cmp, --silent, '{{ cfg.private_dir }}/redis.yaml', '{{ cfg.backup_dir }}/redis.yaml']}
          changed_when: false
          no_log: true
        - name: Read private Redis input without logging
          ansible.builtin.slurp: {src: '{{ cfg.private_dir }}/redis.yaml'}
          register: redis_input
          no_log: true
        - name: Decode private Redis credentials in memory
          ansible.builtin.set_fact:
            redis_credentials: '{{ redis_input.content | b64decode | from_yaml }}'
          no_log: true
        - name: Require a strong distinct application Redis password
          ansible.builtin.assert:
            quiet: true
            that:
              - redis_credentials.password is match('^[a-zA-Z0-9]{40}$')
              - redis_credentials.password != app_credentials.runtime_password
              - redis_credentials.password != app_credentials.migrator_password
          no_log: true
        - name: Inspect recoverable RabbitMQ credential input
          ansible.builtin.stat: {path: '{{ item }}/rabbitmq.yaml', follow: false}
          loop: ['{{ cfg.private_dir }}', '{{ cfg.backup_dir }}']
          register: rabbitmq_files
          no_log: true
        - name: Require root-only regular RabbitMQ input files
          ansible.builtin.assert:
            quiet: true
            that:
              - not item.stat.islnk | default(false)
              - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
          loop: '{{ rabbitmq_files.results }}'
          no_log: true
        - name: Restore a preserved RabbitMQ input without rotating its password
          ansible.builtin.copy: {src: '{{ cfg.backup_dir }}/rabbitmq.yaml', dest: '{{ cfg.private_dir }}/rabbitmq.yaml', remote_src: true, mode: '0600'}
          when: not rabbitmq_files.results[0].stat.exists and rabbitmq_files.results[1].stat.exists
          no_log: true
        - name: Refuse to regenerate a declared RabbitMQ identity
          ansible.builtin.assert:
            quiet: true
            that: rabbitmq_files.results[0].stat.exists or rabbitmq_files.results[1].stat.exists or (query('fileglob', component_root + '/rabbitmq/provision.sops.yaml') | length == 0)
        - name: Create an independent RabbitMQ password only on first preparation
          ansible.builtin.copy:
            dest: '{{ cfg.private_dir }}/rabbitmq.yaml'
            force: false
            mode: '0600'
            content: |
              password: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
          when: not rabbitmq_files.results[0].stat.exists and not rabbitmq_files.results[1].stat.exists
          no_log: true
        - name: Preserve the independent RabbitMQ credential backup
          ansible.builtin.copy: {src: '{{ cfg.private_dir }}/rabbitmq.yaml', dest: '{{ cfg.backup_dir }}/rabbitmq.yaml', remote_src: true, force: false, mode: '0600'}
          no_log: true
        - name: Verify RabbitMQ input against its non-overwritten backup
          ansible.builtin.command: {argv: [cmp, --silent, '{{ cfg.private_dir }}/rabbitmq.yaml', '{{ cfg.backup_dir }}/rabbitmq.yaml']}
          changed_when: false
          no_log: true
        - name: Read private RabbitMQ input without logging
          ansible.builtin.slurp: {src: '{{ cfg.private_dir }}/rabbitmq.yaml'}
          register: rabbitmq_input
          no_log: true
        - name: Decode private RabbitMQ credentials in memory
          ansible.builtin.set_fact:
            rabbitmq_credentials: '{{ rabbitmq_input.content | b64decode | from_yaml }}'
          no_log: true
        - name: Require a strong distinct application RabbitMQ password
          ansible.builtin.assert:
            quiet: true
            that:
              - rabbitmq_credentials.password is match('^[a-zA-Z0-9]{40}$')
              - rabbitmq_credentials.password != app_credentials.runtime_password
              - rabbitmq_credentials.password != app_credentials.migrator_password
              - rabbitmq_credentials.password != redis_credentials.password
          no_log: true
        - name: Inspect recoverable browser identity credential input
          ansible.builtin.stat: {path: '{{ item }}/identity.yaml', follow: false}
          loop: ['{{ cfg.private_dir }}', '{{ cfg.backup_dir }}']
          register: identity_files
          no_log: true
        - name: Require root-only regular browser identity input files
          ansible.builtin.assert:
            quiet: true
            that:
              - not item.stat.islnk | default(false)
              - not item.stat.exists or (item.stat.isreg | default(false) and item.stat.uid == 0 and item.stat.mode == '0600')
          loop: '{{ identity_files.results }}'
          no_log: true
        - name: Restore a preserved browser identity input without rotating its password
          ansible.builtin.copy: {src: '{{ cfg.backup_dir }}/identity.yaml', dest: '{{ cfg.private_dir }}/identity.yaml', remote_src: true, mode: '0600'}
          when: not identity_files.results[0].stat.exists and identity_files.results[1].stat.exists
          no_log: true
        - name: Refuse to regenerate a declared browser identity identity
          ansible.builtin.assert:
            quiet: true
            that: identity_files.results[0].stat.exists or identity_files.results[1].stat.exists or (query('fileglob', component_root + '/identity/provision.sops.yaml') | length == 0)
        - name: Create an independent browser identity password only on first preparation
          ansible.builtin.copy:
            dest: '{{ cfg.private_dir }}/identity.yaml'
            force: false
            mode: '0600'
            content: |
              web_secret: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
              admin_secret: {{ lookup('password','/dev/null',length=40,chars=['ascii_letters','digits']) }}
          when: not identity_files.results[0].stat.exists and not identity_files.results[1].stat.exists
          no_log: true
        - name: Preserve the independent browser identity credential backup
          ansible.builtin.copy: {src: '{{ cfg.private_dir }}/identity.yaml', dest: '{{ cfg.backup_dir }}/identity.yaml', remote_src: true, force: false, mode: '0600'}
          no_log: true
        - name: Verify browser identity input against its non-overwritten backup
          ansible.builtin.command: {argv: [cmp, --silent, '{{ cfg.private_dir }}/identity.yaml', '{{ cfg.backup_dir }}/identity.yaml']}
          changed_when: false
          no_log: true
        - name: Read private browser identity input without logging
          ansible.builtin.slurp: {src: '{{ cfg.private_dir }}/identity.yaml'}
          register: identity_input
          no_log: true
        - name: Decode private browser identity credentials in memory
          ansible.builtin.set_fact:
            identity_credentials: '{{ identity_input.content | b64decode | from_yaml }}'
          no_log: true
        - name: Require a strong distinct application browser identity password
          ansible.builtin.assert:
            quiet: true
            that:
              - identity_credentials.web_secret is match('^[a-zA-Z0-9]{40}$')
              - identity_credentials.admin_secret is match('^[a-zA-Z0-9]{40}$')
              - identity_credentials.web_secret != identity_credentials.admin_secret
          no_log: true
        - name: Prepare recoverable application TLS material
          ansible.builtin.include_tasks: tasks/runtime-tls.yaml
        - name: Bind runtime rollout to public configuration and private input changes
          ansible.builtin.set_fact:
            runtime_config_digest: '{{ ([cfg, browser_clients, secret_input.content, redis_input.content, rabbitmq_input.content, identity_input.content] | to_json) | hash("sha256") }}'
          no_log: true
        - name: Prepare public candidate directories
          ansible.builtin.file: {path: '{{ build }}/{{ item }}', state: directory, owner: '{{ cluster_operator }}', mode: '0755'}
          loop: [database, migration, redis, rabbitmq, identity, runtime, ../tpl-web-frontend, ../tpl-admin-frontend]
        - name: Render colocated workload and stage templates
          ansible.builtin.template:
            src: '{{ component_root }}/{{ item }}.j2'
            dest: '{{ build }}/{{ item }}'
            owner: '{{ cluster_operator }}'
            mode: '0644'
          loop: [database/workload.yaml, migration/workload.yaml, redis/workload.yaml, rabbitmq/workload.yaml, identity/workload.yaml, runtime/workload.yaml, ../tpl-web-frontend/workload.yaml, ../tpl-admin-frontend/workload.yaml, stages.yaml]
        - name: Derive independent connection URLs without logging
          ansible.builtin.set_fact:
            runtime_url: 'postgresql+asyncpg://{{ cfg.database_runtime_user }}:{{ app_credentials.runtime_password }}@postgresql.{{ data_namespace }}.svc.cluster.local:5432/{{ cfg.database }}'
            migrator_url: 'postgresql+asyncpg://{{ cfg.database_migrator_user }}:{{ app_credentials.migrator_password }}@postgresql.{{ data_namespace }}.svc.cluster.local:5432/{{ cfg.database }}'
          no_log: true
        - name: Encrypt credentials with the shared SOPS mechanism and verify recovery
          ansible.builtin.include_tasks: ../services/tasks/encrypt.yaml
          loop:
            - file: database/bootstrap.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-database-bootstrap, namespace: '{{ data_namespace }}'}
                stringData: '{{ app_credentials }}'
            - file: database/runtime.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-database-runtime, namespace: '{{ cfg.namespace }}'}
                stringData: {DATABASE_URL: '{{ runtime_url }}'}
            - file: migration/auth.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-migration-auth, namespace: '{{ cfg.namespace }}'}
                stringData: {DATABASE_URL: '{{ runtime_url }}', MIGRATION_DATABASE_URL: '{{ migrator_url }}'}
            - file: redis/provision.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-redis-provision, namespace: '{{ data_namespace }}'}
                stringData: {password: '{{ redis_credentials.password }}'}
            - file: redis/runtime.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-redis-runtime, namespace: '{{ cfg.namespace }}'}
                stringData: {REDIS_USER: '{{ cfg.redis_user }}', REDIS_PASSWORD: '{{ redis_credentials.password }}'}
            - file: rabbitmq/provision.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-rabbitmq-provision, namespace: '{{ messaging_namespace }}'}
                stringData: {password: '{{ rabbitmq_credentials.password }}'}
            - file: rabbitmq/runtime.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-rabbitmq-runtime, namespace: '{{ cfg.namespace }}'}
                stringData:
                  CELERY_BROKER_URL: 'amqp://{{ cfg.rabbitmq_user }}:{{ rabbitmq_credentials.password }}@rabbitmq.{{ messaging_namespace }}.svc.cluster.local:5672/{{ cfg.rabbitmq_vhost }}'
            - file: identity/provision.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-identity-provision, namespace: '{{ app_namespace }}'}
                stringData: {clients.json: '{{ identity_credentials | to_json }}'}
            - file: identity/runtime.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-browser-secrets, namespace: '{{ app_namespace }}'}
                stringData: {WEB_CASDOOR_CLIENT_SECRET: '{{ identity_credentials.web_secret }}', ADMIN_CASDOOR_CLIENT_SECRET: '{{ identity_credentials.admin_secret }}'}
            - file: runtime/tls.sops.yaml
              manifest:
                apiVersion: v1
                kind: Secret
                metadata: {name: tpl-tls, namespace: '{{ app_namespace }}'}
                type: kubernetes.io/tls
                data: {'tls.key': '{{ app_tls.results[0].content }}', 'tls.crt': '{{ app_tls.results[1].content }}'}
          loop_control: {loop_var: secret_item, label: '{{ secret_item.file }}'}
          no_log: true
        - name: Render explicit resource lists without applying config files
          ansible.builtin.copy:
            dest: '{{ build }}/{{ item.name }}/kustomization.yaml'
            content: '{{ {"apiVersion":"kustomize.config.k8s.io/v1beta1","kind":"Kustomization","resources":item.resources} | to_nice_yaml }}'
            owner: '{{ cluster_operator }}'
            mode: '0644'
          loop:
            - {name: database, resources: [workload.yaml, bootstrap.sops.yaml, runtime.sops.yaml]}
            - {name: migration, resources: [workload.yaml, auth.sops.yaml]}
            - {name: redis, resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]}
            - {name: rabbitmq, resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]}
            - {name: identity, resources: [workload.yaml, provision.sops.yaml, runtime.sops.yaml]}
            - {name: runtime, resources: [workload.yaml, tls.sops.yaml]}
            - {name: ../tpl-web-frontend, resources: [workload.yaml]}
            - {name: ../tpl-admin-frontend, resources: [workload.yaml]}
    - name: Stage reviewed candidate declarations without deploying
      when: application_action == 'stage'
      block:
        - name: Copy explicit application candidates only
          ansible.builtin.copy: {src: '{{ build }}/{{ item }}', dest: '{{ component_root }}/{{ item }}', remote_src: true, owner: '{{ cluster_operator }}', mode: '0644'}
          loop: '{{ candidate_files }}'
        - name: Stage the template dependency chain
          ansible.builtin.copy: {src: '{{ build }}/stages.yaml', dest: '{{ repo }}/gitops/clusters/kind/applications.yaml', remote_src: true, owner: '{{ cluster_operator }}', mode: '0644'}
    - name: Validate rendered inputs against the promoted immutable source
      when: application_action == 'validate'
      block:
        - name: Require clean GitOps declarations
          become: false
          ansible.builtin.command: {argv: [git, -C, '{{ repo }}', status, --porcelain, --untracked-files=all, '--', gitops]}
          register: dirty
          changed_when: false
          failed_when: dirty.rc != 0 or dirty.stdout != ''
        - name: Require declarations to match the promoted Git object
          become: false
          ansible.builtin.command:
            argv: [git, -C, '{{ repo }}', diff, --exit-code, '{{ (lookup("file", playbook_dir + "/../environments/kind/flux-source.yaml") | from_yaml).revision }}', '--', gitops]
          changed_when: false
          no_log: true
        - name: Compare candidate public objects and decrypted secrets
          ansible.builtin.include_tasks: ../services/tasks/check-declaration.yaml
          vars:
            item: {path: '{{ build }}/{{ candidate }}'}
            relative_path: '{{ candidate }}'
            committed_path: '{{ component_root }}/{{ candidate }}'
          loop: '{{ candidate_files }}'
          loop_control: {loop_var: candidate}
        - name: Require stage declarations to match rendered settings
          ansible.builtin.assert:
            quiet: true
            that: (lookup('file',build + '/stages.yaml') | from_yaml_all | list) == (lookup('file',repo + '/gitops/clusters/kind/applications.yaml') | from_yaml_all | list)
    - name: Require the exact application stages and jobs to succeed
      when: application_action == 'check'
      block:
        - name: Wait for current generation Ready at the promoted digest
          ansible.builtin.command:
            argv: '{{ kube + ["get","kustomization",item,"-n","flux-system","-o","json"] }}'
          loop: [tpl-database,tpl-migration,tpl-redis,tpl-rabbitmq,tpl-identity,tpl-runtime,tpl-web,tpl-admin]
          register: stage
          changed_when: false
          until:
            - stage.rc == 0
            - (stage.stdout | from_json).status.observedGeneration | default(-1) == (stage.stdout | from_json).metadata.generation
            - (stage.stdout | from_json).status.conditions | default([]) | selectattr('type','equalto','Ready') | selectattr('status','equalto','True') | list | length == 1
            - (stage.stdout | from_json).status.lastAppliedRevision | default('') == (lookup('file',playbook_dir + '/../environments/kind/flux-source.yaml') | from_yaml).digest
          retries: 120
          delay: 5
        - name: Check the declared jobs completed and expose only acceptance results
          ansible.builtin.command:
            argv: '{{ kube + ["get","job",item.name,"-n",item.namespace,"-o","jsonpath={.status.succeeded}"] }}'
          loop:
            - {name: 'tpl-database-{{ cfg.database_bootstrap_revision }}', namespace: '{{ data_namespace }}'}
            - {name: '{{ migration_job }}', namespace: '{{ cfg.namespace }}'}
            - {name: 'tpl-redis-{{ cfg.redis_identity_revision }}', namespace: '{{ data_namespace }}'}
            - {name: 'tpl-rabbitmq-{{ cfg.rabbitmq_identity_revision }}', namespace: '{{ messaging_namespace }}'}
            - {name: 'tpl-identity-{{ cfg.identity_revision }}', namespace: '{{ app_namespace }}'}
          register: completion
          changed_when: false
          failed_when: completion.rc != 0 or completion.stdout != '1'
        - name: Read the actual schema and grant verification outcome privately
          ansible.builtin.command:
            argv: '{{ kube + ["logs","job/" + migration_job,"-n",cfg.namespace] }}'
          register: result
          changed_when: false
          no_log: true
        - name: Decode the final structured acceptance record privately
          ansible.builtin.set_fact:
            database_acceptance: '{{ result.stdout_lines[-1] | from_json }}'
          no_log: true
        - name: Require the completed job acceptance record
          ansible.builtin.assert:
            quiet: true
            that:
              - database_acceptance.schema == cfg.expected_schema_revision
              - database_acceptance.database == cfg.database
              - database_acceptance.separate_identities is sameas true
              - database_acceptance.runtime_crud is sameas true
              - database_acceptance.runtime_ddl_denied is sameas true
              - database_acceptance.migration_metadata_write_denied is sameas true
            success_msg: 'TPL schema, separate identities, runtime CRUD and denial of runtime DDL verified.'
        - name: Read the actual Redis identity acceptance outcome privately
          ansible.builtin.command:
            argv: '{{ kube + ["logs","job/tpl-redis-" + cfg.redis_identity_revision,"-n",data_namespace] }}'
          register: redis_result
          changed_when: false
          no_log: true
        - name: Decode Redis acceptance without exposing credentials
          ansible.builtin.set_fact:
            redis_acceptance: '{{ redis_result.stdout_lines[-1] | from_json }}'
          no_log: true
        - name: Require application Redis isolation and saved ACL
          ansible.builtin.assert:
            quiet: true
            that:
              - redis_acceptance.redis_user == cfg.redis_user
              - redis_acceptance.key_pattern == cfg.redis_key_pattern
              - redis_acceptance.write_read is sameas true
              - redis_acceptance.foreign_key_denied is sameas true
              - redis_acceptance.admin_command_denied is sameas true
              - redis_acceptance.flushall_permission_denied is sameas true
              - redis_acceptance.acl_saved is sameas true
        - name: Read application Redis input for current live authentication
          ansible.builtin.slurp: {src: '{{ cfg.private_dir }}/redis.yaml'}
          register: live_redis_input
          no_log: true
        - name: Verify the persistent identity authenticates against the current Redis process
          vars:
            redis_auth_probe: >-
              IFS= read -r REDISCLI_AUTH; export REDISCLI_AUTH; redis-cli --user "$1" ping
          ansible.builtin.command:
            argv: '{{ kube + ["exec","-i","redis-0","-n",data_namespace,"-c","redis","--","sh","-ec",redis_auth_probe,"--",cfg.redis_user] }}'
            stdin: '{{ (live_redis_input.content | b64decode | from_yaml).password }}'
          register: redis_live
          changed_when: false
          failed_when: redis_live.rc != 0 or redis_live.stdout != 'PONG'
          no_log: true
        - name: Require private ACL file and restrictive Redis process creation mask
          vars:
            redis_acl_permissions_probe: |
              test ! -L /data/users.acl
              test -f /data/users.acl
              test -s /data/users.acl
              test "$(stat -c %a /data/users.acl)" = 600
              test "$(stat -c %u /data/users.acl)" = "$(id -u)"
              test "$(awk '/^Umask:/ {print $2}' /proc/1/status)" = 0077
              printf 'private-acl'
          ansible.builtin.command:
            argv: '{{ kube + ["exec","redis-0","-n",data_namespace,"-c","redis","--","sh","-ec",redis_acl_permissions_probe] }}'
          register: redis_acl_permissions
          changed_when: false
          failed_when: redis_acl_permissions.rc != 0 or redis_acl_permissions.stdout != 'private-acl'
        - name: Read actual RabbitMQ application identity acceptance privately
          ansible.builtin.command:
            argv: '{{ kube + ["logs","job/tpl-rabbitmq-" + cfg.rabbitmq_identity_revision,"-n",messaging_namespace] }}'
          register: rabbitmq_result
          changed_when: false
          no_log: true
        - name: Decode RabbitMQ acceptance without exposing credentials
          ansible.builtin.set_fact:
            rabbitmq_acceptance: '{{ rabbitmq_result.stdout_lines[-1] | from_json }}'
          no_log: true
        - name: Require RabbitMQ application boundary and real message roundtrip
          ansible.builtin.assert:
            quiet: true
            that:
              - rabbitmq_acceptance.user == cfg.rabbitmq_user
              - rabbitmq_acceptance.vhost == cfg.rabbitmq_vhost
              - rabbitmq_acceptance.queue == cfg.rabbitmq_queue
              - rabbitmq_acceptance.durable_topology is sameas true
              - rabbitmq_acceptance.amqp_roundtrip is sameas true
              - rabbitmq_acceptance.default_vhost_denied is sameas true
              - rabbitmq_acceptance.management_api_denied is sameas true
              - rabbitmq_acceptance.single_vhost_grant is sameas true
        - name: Read browser registration acceptance privately
          ansible.builtin.command:
            argv: '{{ kube + ["logs","job/tpl-identity-" + cfg.identity_revision,"-n",app_namespace] }}'
          register: identity_result
          changed_when: false
          no_log: true
        - name: Decode browser registration acceptance privately
          ansible.builtin.set_fact:
            identity_acceptance: '{{ identity_result.stdout_lines[-1] | from_json }}'
          no_log: true
        - name: Require distinct browser registrations and OIDC metadata
          ansible.builtin.assert:
            quiet: true
            that:
              - identity_acceptance.browser_clients == ['admin','web']
              - identity_acceptance.distinct_identities is sameas true
              - identity_acceptance.exact_redirects is sameas true
              - identity_acceptance.client_secrets_match is sameas true
              - identity_acceptance.authorization_code_only is sameas true
              - identity_acceptance.signup_disabled is sameas true
              - identity_acceptance.issuer == 'https://' + casdoor_hostname + ':30443'
              - identity_acceptance.pkce_s256 is sameas true
              - identity_acceptance.jwks_available is sameas true
        - name: Verify the current runtime deployments and exact image identities
          ansible.builtin.command:
            argv: '{{ kube + ["get","deployment","tpl-" + item.role,"-n",app_namespace,"-o","json"] }}'
          loop:
            - {role: api, image: backend, replicas: '{{ cfg.api_replicas }}'}
            - {role: worker, image: backend, replicas: '{{ cfg.worker_replicas }}'}
            - {role: scheduler, image: backend, replicas: '{{ cfg.scheduler_replicas }}'}
            - {role: web, image: web, replicas: '{{ tpl_web_deployment.replicas }}'}
            - {role: admin, image: admin, replicas: '{{ tpl_admin_deployment.replicas }}'}
          register: runtime
          changed_when: false
          failed_when: >-
            runtime.rc != 0 or
            (runtime.stdout | from_json).status.observedGeneration | default(-1) != (runtime.stdout | from_json).metadata.generation or
            (runtime.stdout | from_json).status.updatedReplicas | default(0) != item.replicas | int or
            (runtime.stdout | from_json).status.availableReplicas | default(0) != item.replicas | int or
            (runtime.stdout | from_json).spec.template.spec.containers[0].image != registry_address + '/platform/' + app_images[item.image].repository + '@' + app_images[item.image].digest
        - name: Verify the real worker responds with its declared queue and tasks
          ansible.builtin.command:
            argv: '{{ kube + ["exec","deployment/tpl-worker","-n",app_namespace,"--","python","-m","app.cli.worker_readiness"] }}'
          changed_when: false
        - name: Verify the scheduler process has completed a recent tick
          ansible.builtin.command:
            argv: '{{ kube + ["exec","deployment/tpl-scheduler","-n",app_namespace,"--","python","-m","app.cli.scheduler_activity","--schedule","/tmp/celerybeat-schedule","--max-age","30"] }}'
          changed_when: false
        - name: Verify API readiness through each new TLS route
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '15', --noproxy, '*', --cacert, '{{ registry_config_dir }}/tls/ca.crt', --connect-to, '{{ item | urlsplit("hostname") }}:30443:127.0.0.1:{{ cluster_ingress_port }}', '{{ item }}/api/health']
          loop: ['{{ cfg.web_origin }}', '{{ cfg.admin_origin }}']
          register: api_route
          changed_when: false
          failed_when: api_route.rc != 0 or (api_route.stdout | from_json).status != 'ready'
        - name: Verify the exact API deployment identity through TLS
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '15', --noproxy, '*', --cacert, '{{ registry_config_dir }}/tls/ca.crt', --connect-to, '{{ cfg.web_origin | urlsplit("hostname") }}:30443:127.0.0.1:{{ cluster_ingress_port }}', '{{ cfg.web_origin }}/api/version']
          register: api_version
          changed_when: false
          failed_when: api_version.rc != 0 or (api_version.stdout | from_json).deploymentId != deployment_id
        - name: Verify both frontend surfaces through their own certificate hostnames
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, --max-time, '15', --noproxy, '*', --cacert, '{{ registry_config_dir }}/tls/ca.crt', --connect-to, '{{ item.origin | urlsplit("hostname") }}:30443:127.0.0.1:{{ cluster_ingress_port }}', '{{ item.origin }}/healthz']
          loop:
            - {origin: '{{ cfg.web_origin }}', surface: web}
            - {origin: '{{ cfg.admin_origin }}', surface: admin}
          register: browser_health
          changed_when: false
          failed_when: >-
            browser_health.rc != 0 or
            (browser_health.stdout | from_json).status != 'ok' or
            (browser_health.stdout | from_json).surface != item.surface or
            (browser_health.stdout | from_json).deployment_id != deployment_id
