---
- name: Verify the promoted service release and real database operations
  hosts: kind_hosts
  gather_facts: false
  become: true
  vars_files: [layout.yaml]
  vars:
    capacity_operation: services-verify
    images: '{{ (lookup("file", playbook_dir + "/../artifacts/upstream-images.lock.json") | from_json).images + ((lookup("file", playbook_dir + "/../../gitops/components/data-platform/ragflow/image.lock.json") | from_json).images if services_ragflow_enabled else []) }}'
    enabled_names: '{{ (["postgresql"] if services_postgresql_enabled else []) + (["redis"] if services_redis_enabled else []) + (["rabbitmq"] if services_rabbitmq_enabled else []) + (["casdoor"] if services_casdoor_enabled else []) + (["traefik"] if services_ingress_enabled else []) + (["object-storage"] if services_object_storage_enabled else []) + (["text-embeddings"] if services_text_embeddings_enabled else []) + (["elasticsearch","kibana","logstash"] if services_elk_enabled else []) + (["neo4j"] if services_neo4j_enabled else []) + (["mongodb"] if services_mongodb_enabled else []) + (["infinity"] if services_infinity_enabled else []) + (["valkey"] if services_valkey_enabled else []) + (["ragflow-runtime"] if services_ragflow_enabled else []) }}'
    stages_to_check: '{{ ["platform-services"] + (["casdoor-db","casdoor-init","casdoor"] if services_casdoor_enabled else []) + (["elk-initialize","elk-runtime"] if services_elk_enabled else []) + (["elk-collector"] if services_elk_enabled and elk_collector_enabled else []) + (["elk-data-view"] if services_elk_enabled and elk_log_data_view_enabled else []) + (["mongodb-initialize"] if services_mongodb_enabled else []) + (["ragflow-database","ragflow-storage","ragflow-initialize","ragflow-runtime"] if services_ragflow_enabled else []) }}'

    kube: ['{{ playbook_dir }}/../.tools/bin/kubectl', '--kubeconfig={{ cluster_kubeconfig }}', '--context=kind-{{ cluster_name }}', '--request-timeout=30s']
  tasks:
    - name: Verify ownership before workload operations
      ansible.builtin.slurp: {src: '{{ cluster_data_root }}/{{ cluster_name }}/bootstrap/identity.json'}
      register: identity
    - name: Require exact owned API UID
      ansible.builtin.command:
        argv: '{{ kube + ["get", "ns", "kube-system", "-o", "jsonpath={.metadata.uid}"] }}'
      register: uid
      changed_when: false
      failed_when: uid.rc != 0 or uid.stdout != (identity.content | b64decode | from_json).kube_system_uid
    - name: Recheck approved floor and small verification allowance
      ansible.builtin.include_tasks:
        file: ../host/tasks/capacity.yaml
        apply: {become: false}
      vars: {capacity_planned_bytes: 16777216}
    - name: Read observed reconciliation stages
      ansible.builtin.command:
        argv: '{{ kube + ["-n", "flux-system", "get", "kustomization", item, "-o", "json"] }}'
      loop: '{{ stages_to_check }}'
      register: stages
      changed_when: false
    - name: Require current stage generations Ready
      ansible.builtin.assert:
        quiet: true
        that:
          - state.status.observedGeneration == state.metadata.generation
          - state.status.conditions | selectattr('type','equalto','Ready') | selectattr('status','equalto','True') | list | length == 1
      vars: {state: '{{ item.stdout | from_json }}'}
      loop: '{{ stages.results }}'
      loop_control: {label: '{{ item.item }}'}
    - name: Inspect actual pod image identities
      ansible.builtin.command:
        argv: '{{ kube + ["-n", item, "get", "pods", "-o", "json"] }}'
      loop: '{{ [data_namespace, messaging_namespace, app_namespace, ingress_namespace] }}'
      register: service_pods
      changed_when: false
    - name: Collect actual runtime identities independently of pod specifications
      ansible.builtin.set_fact:
        observed_image_ids: '{{ service_pods.results | map(attribute="stdout") | map("from_json") | map(attribute="items") | flatten | map(attribute="status.containerStatuses", default=[]) | flatten | map(attribute="imageID", default="") | unique | list }}'
    - name: Require all enabled locked manifests to be present in runtime image IDs
      ansible.builtin.assert:
        quiet: true
        that: (registry_address + '/platform/' + item.id + '@' + item.manifest_digest) in observed_image_ids
      loop: '{{ images | selectattr("id", "in", enabled_names + (["aistor"] if services_object_storage_enabled else []) + (["text-embeddings-inference"] if services_text_embeddings_enabled else [])) | list }}'
      loop_control: {label: '{{ item.id }}'}
    - name: Require enabled retained volumes bound
      ansible.builtin.command:
        argv: '{{ kube + ["get", "pv", cluster_name + "-" + item.name, "-o", "json"] }}'
      loop: '{{ services_volumes | selectattr("name", "in", enabled_names) | list }}'
      register: volumes
      changed_when: false
    - name: Verify durable mapping and reclaim policy
      ansible.builtin.assert:
        quiet: true
        that:
          - volume.status.phase == 'Bound'
          - volume.spec.persistentVolumeReclaimPolicy == 'Retain'
          - volume.spec.local.path == '/data/kind-local-storage/' + item.item.name
          - volume.spec.claimRef.namespace == component_namespaces[item.item.name]
          - volume.spec.claimRef.name == item.item.name + '-data'
          - volume.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0]['values'] == [cluster_name + '-' + item.item.node]
      vars: {volume: '{{ item.stdout | from_json }}'}
      loop: '{{ volumes.results }}'
      loop_control: {label: '{{ item.item.name }}'}
    - name: Execute transactional PostgreSQL read and write
      when: services_postgresql_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n", data_namespace, "exec", "postgresql-0", "--", "sh", "-ec", pg_acceptance] }}'
      vars:
        pg_acceptance: |
          export PGPASSWORD="$(cat /run/auth/password)"
          psql --no-psqlrc -h 127.0.0.1 -U postgres -d postgres --set=ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE TEMP TABLE sunmoon_acceptance(v text);
          INSERT INTO sunmoon_acceptance VALUES ('verified');
          SELECT v FROM sunmoon_acceptance;
          ROLLBACK;
          SQL
      changed_when: false
      register: pg_check
      failed_when: pg_check.rc != 0 or 'verified' not in pg_check.stdout
      no_log: true
    - name: Verify Redis write and read with a bounded temporary key
      when: services_redis_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n", data_namespace, "exec", "redis-0", "--", "sh", "-ec", ''export REDISCLI_AUTH="$(cat /run/auth/password)"; key="sunmoon:acceptance:$(date +%s):$$"; redis-cli SET "$key" verified EX 60 >/dev/null; test "$(redis-cli GET "$key")" = verified; redis-cli DEL "$key" >/dev/null; echo verified''] }}'
      register: redis_check
      changed_when: false
      failed_when: redis_check.rc != 0 or redis_check.stdout != 'verified'
      no_log: true
    - name: Verify RabbitMQ running state and alarms
      when: services_rabbitmq_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n", messaging_namespace, "exec", "rabbitmq-0", "-c", "rabbitmq", "--", "rabbitmq-diagnostics", "-q", item] }}'
      loop: [check_running, check_local_alarms]
      changed_when: false
    - name: Read operator inputs without printing values
      ansible.builtin.slurp: {src: '{{ services_config_dir }}/credentials.yaml'}
      register: private_input
      no_log: true
    - name: Verify real message delivery and authenticated TLS identity flow
      ansible.builtin.command:
        argv: '{{ ["python3", playbook_dir + "/verify-live.py", "--kubectl", playbook_dir + "/../.tools/bin/kubectl", "--kubeconfig", cluster_kubeconfig, "--messaging-namespace", messaging_namespace, "--app-namespace", app_namespace, "--data-namespace", data_namespace, "--probe-node", cluster_name + "-" + (services_volumes | selectattr("name","equalto","postgresql") | first).node, "--ca", registry_config_dir + "/clients/ca.crt"] + (["--probe-image", registry_address + "/platform/postgresql@" + (images | selectattr("id","equalto","postgresql") | first).manifest_digest] if services_postgresql_enabled else []) + ([] if services_rabbitmq_enabled else ["--skip-rabbitmq"]) + ([] if services_casdoor_enabled else ["--skip-casdoor"]) }}'
        stdin: '{{ private_input.content | b64decode | from_yaml | to_json }}'
      no_log: true
      changed_when: false
      register: acceptance
      failed_when: false
    - name: Require live protocol checks to pass
      ansible.builtin.assert:
        quiet: true
        that: acceptance.rc == 0
        fail_msg: '{{ acceptance.stdout }}'
    - name: Verify licensed TLS object storage through actual versioned S3 operations
      when: services_object_storage_enabled | bool
      block:
        - name: Read private object storage root identity without logging
          ansible.builtin.slurp: {src: '{{ services_config_dir }}/object-storage.yaml'}
          register: storage_check_input
          no_log: true
        - name: Require the exact official management client bytes
          ansible.builtin.stat: {path: '{{ playbook_dir }}/../.tools/bin/mc', follow: false, checksum_algorithm: sha256}
          register: storage_client
        - name: Reject an unverified or redirected management client
          ansible.builtin.assert:
            quiet: true
            that:
              - storage_client.stat.isreg | default(false)
              - not storage_client.stat.islnk | default(false)
              - storage_client.stat.checksum == ((lookup('file',playbook_dir + '/../artifacts/files.lock.json') | from_json).files | selectattr('id','equalto','mc') | first).sha256
        - name: Execute bounded S3 roundtrip without printing private inputs
          ansible.builtin.command:
            argv: [python3, '{{ playbook_dir }}/../../gitops/components/data-platform/object-storage/verify.py', --kubectl, '{{ playbook_dir }}/../.tools/bin/kubectl', --kubeconfig, '{{ cluster_kubeconfig }}', --namespace, '{{ data_namespace }}', --mc, '{{ playbook_dir }}/../.tools/bin/mc', --ca, '{{ registry_config_dir }}/clients/ca.crt']
            stdin: '{{ storage_check_input.content | b64decode | from_yaml | to_json }}'
          register: storage_acceptance
          changed_when: false
          no_log: true
          failed_when: false
        - name: Require licensed S3 version and bytes verification
          ansible.builtin.assert:
            quiet: true
            that: storage_acceptance.rc == 0
            fail_msg: '{{ storage_acceptance.stdout }}'
        - name: Report only public S3 acceptance results
          ansible.builtin.debug: {msg: '{{ storage_acceptance.stdout | from_json }}'}
    - name: Verify actual CPU inference with Chinese finite repeatable vectors
      when: services_text_embeddings_enabled | bool
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../../gitops/components/data-platform/text-embeddings/verify.py', --kubectl, '{{ playbook_dir }}/../.tools/bin/kubectl', --kubeconfig, '{{ cluster_kubeconfig }}', --namespace, '{{ data_namespace }}', --model, '{{ text_embeddings_model }}', --revision, '{{ text_embeddings_model_revision }}', --dimensions, '{{ text_embeddings_dimensions | string }}']
      register: embedding_acceptance
      changed_when: false
    - name: Report CPU embedding results and explicit acceptance scope
      when: services_text_embeddings_enabled | bool
      ansible.builtin.debug: {msg: '{{ embedding_acceptance.stdout | from_json }}'}
    - name: Read independent ELK private input for bounded protocol checks
      when: services_elk_enabled | bool
      ansible.builtin.slurp: {src: '{{ services_config_dir }}/elk.yaml'}
      register: elk_check_input
      no_log: true
    - name: Verify actual secured ELK ingestion, search and denied privileges
      when: services_elk_enabled | bool
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../../gitops/components/data-platform/elk/verify.py', --kubectl, '{{ playbook_dir }}/../.tools/bin/kubectl', --kubeconfig, '{{ cluster_kubeconfig }}', --namespace, '{{ data_namespace }}', --ca, '{{ registry_config_dir }}/clients/ca.crt', --version, '{{ (images | selectattr("id","equalto","elasticsearch") | first).source.rsplit(":",1)[1] }}', --writer, '{{ elk_logstash_writer }}', --reader, '{{ elk_log_reader }}', --ingest-user, '{{ elk_ingest_username }}', --index-prefix, '{{ elk_index_prefix }}', --collector-enabled, '{{ elk_collector_enabled | string }}', --collector-namespace, '{{ elk_collector_namespace }}', --application-namespace, '{{ app_namespace }}', --collector-digest, '{{ (images | selectattr("id","equalto","fluent-bit") | first).manifest_digest }}', --data-view-id, '{{ elk_log_data_view_id }}']
        stdin: '{{ elk_check_input.content | b64decode | from_yaml | to_json }}'
      register: elk_acceptance
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require actual ELK protocol acceptance to pass
      when: services_elk_enabled | bool
      ansible.builtin.assert:
        quiet: true
        that: elk_acceptance.rc == 0
        fail_msg: '{{ elk_acceptance.stdout }}'
    - name: Report public ELK protocol assertions only
      when: services_elk_enabled | bool
      ansible.builtin.debug: {msg: '{{ elk_acceptance.stdout | from_json }}'}
    - name: Read independent graph administrator without logging
      when: services_neo4j_enabled | bool
      ansible.builtin.slurp: {src: '{{ services_config_dir }}/neo4j.yaml'}
      register: neo4j_check_input
      no_log: true
    - name: Verify actual graph commit, rollback and required TLS
      when: services_neo4j_enabled | bool
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../../gitops/components/data-platform/neo4j/verify.py', --kubectl, '{{ playbook_dir }}/../.tools/bin/kubectl', --kubeconfig, '{{ cluster_kubeconfig }}', --namespace, '{{ data_namespace }}', --ca, '{{ registry_config_dir }}/clients/ca.crt', --version, '{{ (images | selectattr("id","equalto","neo4j") | first).source.rsplit(":",1)[1].split("-")[0] }}']
        stdin: '{{ neo4j_check_input.content | b64decode | from_yaml | to_json }}'
      register: neo4j_acceptance
      changed_when: false
      failed_when: false
      no_log: true
    - name: Require graph protocol checks to pass
      when: services_neo4j_enabled | bool
      ansible.builtin.assert:
        quiet: true
        that: neo4j_acceptance.rc == 0
        fail_msg: '{{ neo4j_acceptance.stdout }}'
    - name: Report only public graph acceptance assertions
      when: services_neo4j_enabled | bool
      ansible.builtin.debug: {msg: '{{ neo4j_acceptance.stdout | from_json }}'}
    - name: Verify MongoDB TLS, limited CRUD, transactions and denied privileges
      when: services_mongodb_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n", data_namespace, "exec", "mongodb-0", "-c", "mongodb", "--", "mongosh", "--quiet", "--nodb", "--file", "/settings/verify.js"] }}'
      register: mongodb_acceptance
      changed_when: false
      failed_when: false
    - name: Require the MongoDB live protocol checks
      when: services_mongodb_enabled | bool
      ansible.builtin.assert:
        quiet: true
        that: mongodb_acceptance.rc == 0 and (mongodb_acceptance.stdout | from_json).passed
        fail_msg: '{{ mongodb_acceptance.stdout }}'
    - name: Report only public MongoDB acceptance results
      when: services_mongodb_enabled | bool
      ansible.builtin.debug: {msg: '{{ mongodb_acceptance.stdout | from_json }}'}
    - name: Verify real Infinity node identity through its local HTTP endpoint
      when: services_infinity_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n",data_namespace,"exec","infinity-0","--","curl","--silent","--show-error","--fail","--max-time","10","http://127.0.0.1:23820/admin/node/current"] }}'
      changed_when: false
      register: infinity_acceptance
      failed_when: infinity_acceptance.rc != 0 or (infinity_acceptance.stdout | from_json).error_code | default(-1) != 0
    - name: Verify bounded Valkey KV operations and denied permissions
      when: services_valkey_enabled | bool
      ansible.builtin.command:
        argv: '{{ kube + ["-n",data_namespace,"exec","valkey-0","--","sh","-ec",valkey_protocol] }}'
      vars:
        valkey_protocol: |
          export REDISCLI_AUTH="$(cat /run/auth/probe-password)"
          cli() { valkey-cli --user {{ valkey_probe_username }} "$@"; }
          key="sunmoon:acceptance:$(date +%s):$$"
          trap 'cli DEL "$key" >/dev/null' EXIT
          test "$(cli SET "$key" verified EX 60)" = OK
          test "$(cli GET "$key")" = verified
          case "$(cli SET foreign verified)" in *NOPERM*) : ;; *) exit 1 ;; esac
          case "$(cli CONFIG GET '*')" in *NOPERM*) : ;; *) exit 1 ;; esac
          case "$(valkey-cli ping)" in *NOAUTH*) : ;; *) exit 1 ;; esac
          case "$(REDISCLI_AUTH=deliberately-wrong valkey-cli --user {{ valkey_probe_username }} ping 2>&1)" in *WRONGPASS*) : ;; *) exit 1 ;; esac
          echo verified
      register: valkey_acceptance
      changed_when: false
      failed_when: valkey_acceptance.rc != 0 or valkey_acceptance.stdout != 'verified'
      no_log: true
    - name: Read dedicated RAGFlow protocol identity without printing credentials
      when: services_ragflow_enabled | bool
      ansible.builtin.slurp: {src: '{{ services_config_dir }}/ragflow.yaml'}
      register: ragflow_private_input
      no_log: true
    - name: Verify real RAGFlow isolated-tenant upload parsing and Chinese retrieval
      when: services_ragflow_enabled | bool
      ansible.builtin.command:
        argv: ['python3','{{ playbook_dir }}/../../gitops/components/data-platform/ragflow/verify.py','--kubectl','{{ playbook_dir }}/../.tools/bin/kubectl','--kubeconfig','{{ cluster_kubeconfig }}','--namespace','{{ data_namespace }}','--base','https://ragflow.{{ data_namespace }}.svc.cluster.local:{{ ragflow_port }}','--timeout','{{ ragflow_ingestion_timeout_seconds | string }}']
        stdin: '{{ ragflow_private_input.content | b64decode | from_yaml | to_json }}'
      no_log: true
      changed_when: false
      register: ragflow_acceptance
      failed_when: false
    - name: Require actual RAGFlow ingestion and retrieval checks
      when: services_ragflow_enabled | bool
      ansible.builtin.assert:
        quiet: true
        that: ragflow_acceptance.rc == 0 and (ragflow_acceptance.stdout | from_json).passed
        fail_msg: '{{ ragflow_acceptance.stdout }}'
    - name: Report only public RAGFlow acceptance result
      when: services_ragflow_enabled | bool
      ansible.builtin.debug: {msg: '{{ ragflow_acceptance.stdout | from_json }}'}
    - name: Report public acceptance results only
      ansible.builtin.debug: {msg: '{{ acceptance.stdout | from_json }}'}
    - name: Keep public verification receipt outside the repository
      ansible.builtin.file:
        path: '{{ cluster_data_root }}/{{ cluster_name }}/bootstrap/evidence/services'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Record the source, ownership, checks and physical capacity
      ansible.builtin.copy:
        dest: '{{ cluster_data_root }}/{{ cluster_name }}/bootstrap/evidence/services/latest.json'
        mode: '0600'
        content: |
          {{ {'checked_at_utc':lookup('pipe','date -u +%Y-%m-%dT%H:%M:%SZ'), 'cluster_uid':uid.stdout, 'source':lookup('file',playbook_dir + '/../environments/kind/flux-source.yaml') | from_yaml, 'checks':(acceptance.stdout | from_json) | combine({'postgresql_transaction':services_postgresql_enabled,'redis_write_read':services_redis_enabled,'retained_volumes_bound':true}), 'capacity':capacity_report.stdout | from_json, 'object_storage':(storage_acceptance.stdout | from_json) if services_object_storage_enabled else {}, 'text_embeddings':(embedding_acceptance.stdout | from_json) if services_text_embeddings_enabled else {}, 'elk':(elk_acceptance.stdout | from_json) if services_elk_enabled else {}, 'neo4j':(neo4j_acceptance.stdout | from_json) if services_neo4j_enabled else {}, 'mongodb':(mongodb_acceptance.stdout | from_json) if services_mongodb_enabled else {}, 'infinity':(infinity_acceptance.stdout | from_json) if services_infinity_enabled else {}, 'valkey_bounded_kv':services_valkey_enabled, 'ragflow':(ragflow_acceptance.stdout | from_json) if services_ragflow_enabled else {}, 'scope':'Service protocol checks; no WSL/KIND restart or rebuild claim'} | to_nice_json }}
