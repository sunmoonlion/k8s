# ============================================================================
# Knowledge App 业务应用配置
# ============================================================================
KNOWLEDGE_APP_PROJECT_ID="sunmoonai"
KNOWLEDGE_APP_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"
KNOWLEDGE_APP_IMAGE_TAG="${KNOWLEDGE_APP_IMAGE_TAG:-1.0.0}"

# App 源码根目录。Backend 的资源声明随源码维护。
KNOWLEDGE_APP_SOURCE_ROOT="${KNOWLEDGE_APP_SOURCE_ROOT:-${HOME}/knowledge-app}"

# Backend 能力默认完整启用；是否启动组件由下面的集群开关决定。
knowledge_admin_backend_database_access_enabled="true"
knowledge_admin_backend_redis_access_enabled="true"
