# info-admin-backend 路由配置 (Traefik IngressRoute)
# TODO: 根据实际路由规则修改 Host 和 PathPrefix
# 推荐域名规则：
# - {app}.sunmoonai.com
# - {app}-api.sunmoonai.com
# - {app}-admin.sunmoonai.com
# - {app}-admin-api.sunmoonai.com
# 注意：此模板使用 {{VAR}} 语法，由 generate-ingress.sh 转换为 ${VAR} 后再 envsubst
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: info-admin-backend-ingress
  namespace: {{NAMESPACE}}
  labels:
    app: app-platform-ingress
    component: info-admin-backend
spec:
  entryPoints:
    - websecure
  routes:
    # TODO: 修改 PathPrefix（如 /api 用于后端，/ 用于前端）
    - match: Host(`{{UNIFIED_HOST}}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
