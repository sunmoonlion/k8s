# ============================================================================
# App Platform 平台基础配置
# ============================================================================
APP_PLATFORM_PROJECT_ID="sunmoonai"
APP_PLATFORM_NAMESPACE="app-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 业务应用部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# App Platform 比其它平台多一层“业务应用层”：
#   app-platform -> business app -> deployable component
# 本配置控制业务应用层是否启用。

# Auth App（Casdoor + auth app backend/front）
C1_auth_app_enabled="true"
C2_auth_app_enabled="false"
C3_auth_app_enabled="false"
KIND_auth_app_enabled="true"

# Investment App
C1_investment_app_enabled="true"
C2_investment_app_enabled="false"
C3_investment_app_enabled="false"
KIND_investment_app_enabled="true"

# LLM App
C1_llm_app_enabled="false"
C2_llm_app_enabled="false"
C3_llm_app_enabled="false"
KIND_llm_app_enabled="true"

# Research App
C1_research_app_enabled="false"
C2_research_app_enabled="false"
C3_research_app_enabled="false"
KIND_research_app_enabled="true"

# Tools App
C1_tools_app_enabled="false"
C2_tools_app_enabled="false"
C3_tools_app_enabled="false"
KIND_tools_app_enabled="true"

# ============================================================================
# 业务应用部署优先级（数值越大越先部署）
# ============================================================================
# Auth 通常先部署，业务应用依赖其认证能力。
C1_auth_app_priority=1000
C2_auth_app_priority=1000
C3_auth_app_priority=1000
KIND_auth_app_priority=1000

C1_investment_app_priority=900
C2_investment_app_priority=900
C3_investment_app_priority=900
KIND_investment_app_priority=900

C1_llm_app_priority=800
C2_llm_app_priority=800
C3_llm_app_priority=800
KIND_llm_app_priority=800

C1_research_app_priority=700
C2_research_app_priority=700
C3_research_app_priority=700
KIND_research_app_priority=700

C1_tools_app_priority=600
C2_tools_app_priority=600
C3_tools_app_priority=600
KIND_tools_app_priority=600

