apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sunmoon-static
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sunmoon-kind-postgresql
  annotations:
    sunmoonai.com/storage-owner: sunmoon-kind
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity: {storage: 8Gi}
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sunmoon-static
  local:
    path: /data/kind-local-storage/postgresql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [sunmoon-kind-worker]
  claimRef:
    namespace: data-platform-dev
    name: postgresql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: data-platform-dev
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: sunmoon-static
  volumeName: sunmoon-kind-postgresql
  resources:
    requests: {storage: 8Gi}
---
