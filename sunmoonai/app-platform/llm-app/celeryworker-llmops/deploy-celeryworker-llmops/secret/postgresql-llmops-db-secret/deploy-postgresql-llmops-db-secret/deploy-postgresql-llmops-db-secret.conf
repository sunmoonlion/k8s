# =============================================================================
# PostgreSQL LLMOps DB Secret 部署配置
# 文件名: deploy-postgresql-llmops-db-secret.conf
# 用途: 配置PostgreSQL数据库连接信息Secret的生成和部署参数
# =============================================================================

# =============================================================================
# Secret基本信息
# =============================================================================

# Secret名称
SECRET_NAME="postgresql-llmops-db-secret"

# Secret命名空间（将在部署脚本中从参数获取，这里作为默认值）
SECRET_NAMESPACE="${SECRET_NAMESPACE:-app-platform-dev}"

# Secret类型（Opaque）
SECRET_TYPE="Opaque"

# =============================================================================
# Secret数据配置（数据库连接信息）
# =============================================================================

# 数据库主机（与 llmops-service-config 保持一致）
DB_HOST="101.126.151.0"

# 数据库端口
DB_PORT="30444"

# 数据库名称（与 llmops-service-config 保持一致）
DB_NAME="mydb"

# 数据库用户（需要根据实际配置调整）
DB_USER="sunmoonai_dev"

# 数据库密码（需要根据实际配置调整，应与 llmops-service-secret 保持一致）
DB_PASSWORD="Po!s1359"

# SSL模式
DB_SSLMODE="disable"

# 数据库连接 URL（完整连接字符串）
# 格式：postgresql://user:password@host:port/dbname
DB_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"

# =============================================================================
# 应用代码期望的环境变量格式（POSTGRES_*）
# =============================================================================
# 这些字段与 DB_* 字段对应，用于应用代码直接读取
POSTGRES_SERVER="${DB_HOST}"
POSTGRES_PORT="${DB_PORT}"
POSTGRES_DB="${DB_NAME}"
POSTGRES_USER="${DB_USER}"
POSTGRES_PASSWORD="${DB_PASSWORD}"

# =============================================================================
# Secret部署配置
# =============================================================================

# 是否重启使用该Secret的组件
RESTART_COMPONENTS="false"

# 重启优先级（数字越小优先级越高，1-100）
RESTART_PRIORITY="50"
