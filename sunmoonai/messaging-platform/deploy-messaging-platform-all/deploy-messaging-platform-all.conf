# ============================================================================
# Messaging Platform 平台基础配置
# ============================================================================
MESSAGING_PLATFORM_PROJECT_ID="sunmoonai"
MESSAGING_PLATFORM_NAMESPACE="messaging-platform-dev"
ENVIRONMENT="development"

# ============================================================================
# 子级部署控制标志（按集群前缀，启用哪套由 CLUSTER/default_cluster 决定）
# ============================================================================
# 说明：
# - 使用 C1_/C2_/C3_/KIND_ 前缀为不同集群声明各自的开关
# - 实际脚本中使用的是无前缀的 rabbitmq_enabled，值由 apply_cluster_config_mapping 根据当前集群自动覆盖
C1_rabbitmq_enabled="true"
C2_rabbitmq_enabled="true"
C3_rabbitmq_enabled="true"
KIND_rabbitmq_enabled="true"

# ============================================================================
# 部署优先级控制（数值越大越先部署）
# 建议范围：1-1000
# ============================================================================
C1_rabbitmq_priority=900
C2_rabbitmq_priority=900
C3_rabbitmq_priority=900
KIND_rabbitmq_priority=900


