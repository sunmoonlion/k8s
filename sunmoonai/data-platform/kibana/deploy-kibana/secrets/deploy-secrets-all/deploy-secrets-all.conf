# =============================================================================
# Kibana Secrets 部署配置
# 文件名: deploy-secrets-all.conf
# 用途: 配置Kibana所有Secret的部署参数
# =============================================================================

# =============================================================================
# Secret 组件启用和优先级配置
# =============================================================================

# Harbor Registry Secret（镜像拉取）
harbor_registry_secret_enabled="true"
harbor_registry_secret_priority="1000"

# Kibana Elasticsearch Secret（连接 Elasticsearch）
kibana_elasticsearch_secret_enabled="true"
kibana_elasticsearch_secret_priority="800"

