# ============================================================================
# Llm Web Backend ConfigMap YAML 生成配置
# 字段来源：llm-web-backend/app/.env（非敏感字段）
# ============================================================================

TEMPLATE_FILE="templates/configMap/llm-web-backend-config.yaml"
OUTPUT_FILE="llm-web-backend-config-generated.yaml"
ENABLED="true"
RESOURCE_TYPE="configmap"

NAMESPACE="${NAMESPACE:-app-platform-dev}"
ENVIRONMENT="${ENVIRONMENT:-production}"
ENV="${ENV:-prod}"

# ============================================================================
# ConfigMap 数据内容（非敏感字段）
# ============================================================================
# NestJS 基础
NODE_ENV="${NODE_ENV:-production}"
NODE_TLS_REJECT_UNAUTHORIZED="${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
PORT="${PORT:-8000}"

# 多租户配置
TENANT_MODE="${TENANT_MODE:-false}"
TENANT_DB_TYPE="${TENANT_DB_TYPE:-prisma}"

# Redis（非敏感部分，k8s 内部 Service DNS）
REDIS_TYPE="${REDIS_TYPE:-single}"
REDIS_HOST="${REDIS_HOST:-redis-sunmoonai-master.data-platform-dev.svc.cluster.local}"
REDIS_PORT="${REDIS_PORT:-6379}"
REDIS_DB="${REDIS_DB:-0}"
REDIS_USER="${REDIS_USER:-llm_web_backend}"

# Casdoor BFF（非敏感字段）
CASDOOR_ENDPOINT="${CASDOOR_ENDPOINT:-https://casdoor.sunmoonai.com}"
CASDOOR_CLIENT_ID="${CASDOOR_CLIENT_ID:-cd8328352070e08cd432}"
CASDOOR_REDIRECT_URI="${CASDOOR_REDIRECT_URI:-https://llm-api.sunmoonai.com/api/auth/callback}"
FRONTEND_URL="${FRONTEND_URL:-https://llm.sunmoonai.com}"
CASDOOR_ORGANIZATION="${CASDOOR_ORGANIZATION:-llm-web}"
CASDOOR_APPLICATION="${CASDOOR_APPLICATION:-app-llm-web}"

# CORS
CORS="${CORS:-true}"
