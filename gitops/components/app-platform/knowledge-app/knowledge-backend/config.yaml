# 知识应用运行配置；RAGFlow为派生索引，信息原文以独立只读身份读取。
---
knowledge_backend_deployment:
  database: knowledge
  database_runtime_user: knowledge_runtime
  database_migrator_user: knowledge_migrator
  database_extensions:
  - uuid-ossp
  database_bootstrap_revision: v1
  migration_job_revision: v2
  expected_schema_revision: '20260927_0007'
  private_dir: /etc/sunmoon/applications/sunmoon-kind/knowledge
  backup_dir: /mnt/sunmoon-data/backups/applications/sunmoon-kind/knowledge
  deploy_budget_bytes: 2147483648
  redis_user: knowledge_runtime
  redis_key_pattern: knowledge:*
  redis_identity_revision: v2
  rabbitmq_user: knowledge_runtime
  rabbitmq_vhost: knowledge
  rabbitmq_queue: knowledge.default
  rabbitmq_identity_revision: v2
  identity_organization: built-in
  # 普通用户所在组织（决策 D21、SDD 0014）：网页端应用挂这里；管理端仍在 built-in。
  identity_user_organization: sunmoonai
  identity_revision: v3
  api_port: 8000
  api_replicas: 1
  worker_replicas: 1
  worker_concurrency: 2
  scheduler_replicas: 1
  resources:
    api:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: '2'
        memory: 768Mi
    worker:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '2'
        memory: 1Gi
    scheduler:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
  celery_control_queue_exclusive: true
  celery_event_queue_exclusive: true
  domain_runtime_env: {}
  # 0010：数据集目录、多数据集与语义层（0008-info 段三、0009-semantic）、工具的 JWT 验签
  cross_app_enabled: true
  tmp_size_limit: 2Gi
  domain_env:
    KNOWLEDGE_MCP_JWT_ISSUER: sunmoon-workbench
    KNOWLEDGE_MCP_RATE_PER_MINUTE: '120'
    KNOWLEDGE_DATASET_TITLE: 零售经营库（最小实例）
    KNOWLEDGE_DATASET_REGISTRY_ENABLED: 'true'
    KNOWLEDGE_DATASET_ALLOWED_BUCKETS: info-originals
    KNOWLEDGE_DATASET_CACHE_DIR: /tmp/knowledge-datasets
    KNOWLEDGE_SEMANTIC_ENGINE_ENABLED: 'true'
    KNOWLEDGE_SEMANTIC_CACHE_DIR: /tmp/knowledge-semantic
  domain_secrets:
    KNOWLEDGE_MCP_JWT_PUBLIC_KEY: {source: workbench-signing, key: public_key_pem}
  domain_secrets_roles: [api]
  domain_ingress:
    - {name: sandboxes, namespace_var: sandbox_namespace, pod_labels: {sunmoonai.com/sandbox: 'true'}}
  knowledge_provider:
    enabled: true
    dataset_key: default
    dataset_name: sunmoon-kind-knowledge-default
    tenant_id: sunmoonai
    source_user: knowledge_source_reader
    source_bucket: info-originals
    # 2026-10-06 放宽到 info/：原文在 info/original/，登记的数据集文件在 info/securities/…/datasets/
    source_prefix: info/
    # v2：前缀放宽后策略要在现网重建一次（Job 按代次命名，不升代次不重跑）
    job_revision: v2

  knowledge_service_receiver:
    enabled: true
